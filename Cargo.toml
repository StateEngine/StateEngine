[workspace]
resolver = "2"
members = [
    "crates/se-types",
    "crates/se-store",
    "crates/se-core",
    "crates/se-proc",
    "crates/se-host",
    "crates/se-atlas",
    "crates/se",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
license = "LicenseRef-StateEngine-Proprietary"
publish = false

[workspace.dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
schemars = "1.2.1"
uuid = { version = "1.23.1", default-features = false }
sha2 = "0.10.9"
zeroize = "1.8.2"
tokio = { version = "1", default-features = false, features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
panic = "unwind"
