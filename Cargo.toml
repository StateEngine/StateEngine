[workspace]
resolver = "2"
exclude = ["vendor/secode-stateengine-api"]
members = [
    "crates/se-types",
    "crates/se-store",
    "crates/se-core",
    "crates/se-proc",
    "crates/se-host",
    "crates/se-remote-cli",
    "crates/se-remote",
    "crates/se-atlas",
    "crates/se",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
schemars = "1.2.1"
uuid = { version = "1.23.1", default-features = false }
sha2 = "0.10.9"
zeroize = "1.8.2"
tokio = { version = "1", default-features = false, features = ["rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
# Structure guardrails (SE Code parity), ceilings in clippy.toml: warn so CI's
# -D warnings makes them hard stops. Existing offenders carry a one-line allow
# with a reason; those lists may only shrink.
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
struct_excessive_bools = "warn"

[profile.release]
panic = "unwind"

# Native IPC refuses to hash a peer executable over 512 MiB; full debug info
# makes a development `se` about 625 MiB and fails launch tests on size alone.
# Keep line tables and drop the rest, as CI does, so a failed assertion still
# names its line. A full debugger needs CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Native IPC proves a cold executable before its file-identity cache is warm.
# Keep software SHA fast in development/tests, including CPUs without SHA instructions.
[profile.dev.package.sha2]
opt-level = 3

# Archive builds pay the link cost; ordinary release tests keep their usual profile.
[profile.distribution]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1

# Keep bundled SQLite and the authentication/digest primitives optimized for speed.
[profile.distribution.package.libsqlite3-sys]
opt-level = 3

[profile.distribution.package.sha2]
opt-level = 3

[profile.distribution.package.hmac]
opt-level = 3

# The embedding workspace overrides this unpublished permissive package with
# its own API crate, keeping one package identity across the linked boundary.
[patch.crates-io]
secode-stateengine-api = { path = "vendor/secode-stateengine-api" }
