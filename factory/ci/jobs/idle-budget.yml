# Job definition for nightly wiring; this file is not a standalone workflow.
idle-budget:
  strategy:
    fail-fast: false
    matrix:
      os: [ubuntu-24.04, windows-2025, macos-15]
  runs-on: ${{ matrix.os }}
  timeout-minutes: 35
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Install measurement dependency
      run: python -m pip install psutil==7.1.0
    - name: Build release executable
      run: cargo build --release --locked --jobs 4 -p se --bin se
    - name: Check one-session idle budget
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then bin=target/release/se.exe; else bin=target/release/se; fi
        python crates/se/tests/judges/idle_budget.py "$bin" "$RUNNER_TEMP/idle-budget"
