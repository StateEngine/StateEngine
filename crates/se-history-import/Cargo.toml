[package]
name = "se-history-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Off by default: a workspace build without `import` must not unify
# `se-core/import` into crates built without it.
import = ["se-core/import"]

[dependencies]
se-core = { path = "../se-core" }
se-harness = { path = "../se-harness" }
se-proc = { path = "../se-proc" }
se-store = { path = "../se-store" }
se-types = { path = "../se-types" }
serde_json.workspace = true
sha2.workspace = true
uuid = { workspace = true, features = ["std"] }

[lints]
workspace = true
