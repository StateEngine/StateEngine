[package]
name = "se-adoption"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
listener = ["se-harness/listener", "dep:tokio", "dep:uuid", "tokio/rt", "tokio/time", "tokio/io-util", "tokio/process"]

[dependencies]
se-config = { path = "../se-config" }
se-core = { path = "../se-core" }
se-harness = { path = "../se-harness" }
se-mcp = { path = "../se-mcp" }
se-proc = { path = "../se-proc" }
se-repository = { path = "../se-repository" }
se-store = { path = "../se-store" }
se-types = { path = "../se-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar = "=2.7.0"
toml_edit = { version = "0.25.13", features = ["serde"] }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }

[lints]
workspace = true
