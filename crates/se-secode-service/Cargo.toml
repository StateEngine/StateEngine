[package]
name = "se-secode-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
se-config = { path = "../se-config" }
se-core = { path = "../se-core" }
se-harness = { path = "../se-harness", features = ["listener"] }
se-proc = { path = "../se-proc" }
se-store = { path = "../se-store" }
se-types = { path = "../se-types" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
zeroize.workspace = true

[lints]
workspace = true
