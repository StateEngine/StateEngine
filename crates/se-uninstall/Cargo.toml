[package]
name = "se-uninstall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
se-custody = { path = "../se-custody" }
se-native-ipc = { path = "../se-native-ipc" }
se-native-path = { path = "../se-native-path" }
se-state-files = { path = "../se-state-files" }
se-types = { path = "../se-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
ignore_without_reason = "deny"
# The structural guardrails the rest of the workspace inherits from the
# workspace lints, listed here because this crate keeps its own lint table for
# the FFI overrides above.
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
struct_excessive_bools = "warn"
