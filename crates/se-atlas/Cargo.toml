[package]
name = "se-atlas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-clock = []

[dependencies]
se-types = { path = "../se-types" }
serde.workspace = true
serde_json.workspace = true
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "functions"] }
# MIT; safe Rust API over upstream C parsers, no WASM/runtime/network.
tree-sitter = { version = "=0.26.13", default-features = false, features = ["std"] }
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
grep-matcher = "=0.1.9"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"

[lints]
workspace = true

[dev-dependencies]
# Enable deterministic time in integration fixtures, including default test runs.
se-atlas = { path = ".", features = ["test-clock"] }
