[package]
name = "se"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
remote = ["se-host/remote"]
import = ["se-host/import", "se-core/import"]

[dependencies]
se-host = { path = "../se-host" }
se-store = { path = "../se-store" }
se-core = { path = "../se-core" }
se-types = { path = "../se-types" }
se-proc = { path = "../se-proc" }
serde.workspace = true
serde_json.workspace = true
toml = "0.9.11"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
zeroize.workspace = true
regex = "1.13.1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "process", "macros", "signal"] }

[lints]
workspace = true

[[test]]
name = "credential_native"
harness = false

[[test]]
name = "host_e3"
harness = false

[dev-dependencies]
se-atlas = { path = "../se-atlas" }
rusqlite = { version = "0.41", features = ["bundled"] }
