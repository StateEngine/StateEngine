[package]
name = "se-remote-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
remote = ["se-host/remote"]

[dependencies]
se-host = { path = "../se-host", default-features = false }
se-core = { path = "../se-core" }
se-types = { path = "../se-types" }
se-store = { path = "../se-store" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
uuid = { workspace = true, features = ["v4"] }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }

[lints]
workspace = true
