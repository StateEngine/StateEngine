[package]
name = "se-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime", "listener"]
runtime = ["dep:tokio"]
listener = ["runtime", "tokio/net", "tokio/io-util", "tokio/time", "tokio/sync"]
secode = ["runtime", "dep:secode-stateengine-api"]

[dependencies]
secode-stateengine-api = { version = "=2.0.0", optional = true }
se-types = { path = "../se-types" }
se-core = { path = "../se-core" }
se-store = { path = "../se-store" }
se-proc = { path = "../se-proc" }
serde_json.workspace = true
serde.workspace = true
hmac = "0.12.1"
sha2.workspace = true
zeroize.workspace = true
serde_ignored = "0.1.14"
tokio = { workspace = true, optional = true }

[lints]
workspace = true
