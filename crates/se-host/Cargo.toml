[package]
name = "se-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime", "listener"]
import = ["se-core/import", "dep:se-history-import", "se-history-import/import"]
runtime = ["se-harness/runtime", "dep:tokio", "dep:se-agent-observation"]
listener = ["runtime", "se-adoption/listener", "se-harness/listener", "se-remote/listener", "se-atlas-host/listener", "dep:reqwest", "tokio/macros", "tokio/net", "tokio/io-util", "tokio/time", "tokio/sync", "tokio/process", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio-tungstenite", "dep:futures-util", "dep:base64", "dep:se-secode-image", "dep:se-secode-service"]
secode = ["runtime", "listener", "se-harness/secode", "dep:secode-stateengine-api"]
remote = ["se-harness/remote", "dep:se-remote-host", "se-remote/remote", "dep:base64", "listener", "tokio/fs", "dep:chacha20poly1305", "tokio/macros"]

[dependencies]
se-adoption = { path = "../se-adoption" }
se-agent-observation = { path = "../se-agent-observation", optional = true }
se-config = { path = "../se-config" }
se-harness = { path = "../se-harness" }
se-remote-host = { path = "../se-remote-host", optional = true }
se-provider-image = { path = "../se-provider-image" }
secode-stateengine-api = { version = "=2.0.0", optional = true }
se-types = { path = "../se-types" }
se-remote = { path = "../se-remote" }
se-core = { path = "../se-core" }
se-cli-spec = { path = "../se-cli-spec" }
se-mcp = { path = "../se-mcp" }
se-store = { path = "../se-store" }
se-history-import = { path = "../se-history-import", optional = true }
se-proc = { path = "../se-proc" }
se-repository = { path = "../se-repository" }
se-secode-image = { path = "../se-secode-image", optional = true }
se-secode-service = { path = "../se-secode-service", optional = true }
se-atlas-host = { path = "../se-atlas-host" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"], optional = true }
serde_json.workspace = true
serde.workspace = true
shlex = "2.0.1"
toml_edit = { version = "0.25.13", features = ["serde"] }
similar = "=2.7.0"
hmac = "0.12.1"
subtle = "2.6"
base64 = { version = "0.23.1", optional = true }
sha2.workspace = true
ignore = "=0.4.33"
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true
tokio = { workspace = true, optional = true }
# HTTP/1 server plus the verified loopback control client; no TLS.
hyper = { version = "1.11", default-features = false, features = ["server", "client", "http1"], optional = true }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
# The embedded host reads the owner's config.toml itself (same version as se),
# and the Codex launch reads the user's own provider file before it starts.
toml = "0.9.11"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["std"], optional = true }

# The stock Codex control socket is AF_UNIX on Windows too; std has no client for it.
[target.'cfg(windows)'.dependencies]
uds_windows = "1.2.1"

[lints]
workspace = true

[[test]]
name = "w3_realhost_independent"
path = "tests/w3_realhost_independent.rs"
required-features = ["secode"]

[[test]]
name = "w3_lifecycle_independent"
path = "tests/w3_lifecycle_independent.rs"
required-features = ["secode"]

[dev-dependencies]
se-atlas-records = { path = "../se-atlas-records" }
rusqlite = { version = "0.41", features = ["hooks"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "io-util"] }
