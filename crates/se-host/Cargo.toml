[package]
name = "se-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime", "listener"]
import = ["se-core/import"]
runtime = ["dep:tokio"]
listener = ["runtime", "se-remote/listener", "dep:reqwest", "tokio/macros", "tokio/net", "tokio/io-util", "tokio/time", "tokio/sync", "tokio/process", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio-tungstenite", "dep:futures-util"]
secode = ["runtime", "listener", "dep:secode-stateengine-api"]
remote = ["se-remote/remote", "dep:base64", "dep:subtle", "listener", "tokio/fs", "dep:chacha20poly1305", "tokio/macros"]

[dependencies]
secode-stateengine-api = { version = "=2.0.0", optional = true }
se-types = { path = "../se-types" }
se-remote = { path = "../se-remote" }
se-core = { path = "../se-core" }
se-store = { path = "../se-store" }
se-proc = { path = "../se-proc" }
se-atlas = { path = "../se-atlas" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"], optional = true }
serde_json.workspace = true
serde.workspace = true
shlex = "2.0.1"
toml_edit = { version = "0.25.13", features = ["serde"] }
similar = "=2.7.0"
hmac = "0.12.1"
subtle = { version = "2.6", optional = true }
base64 = { version = "0.23.1", optional = true }
sha2.workspace = true
ignore = "=0.4.33"
uuid = { workspace = true, features = ["v4"] }
zeroize.workspace = true
serde_ignored = "0.1.14"
tokio = { workspace = true, optional = true }
# The same server-only HTTP/1 stack the shipping SE Code server resolves
# (hyper 1.11, hyper-util 0.1.20, http-body-util 0.1.5); no client or TLS.
hyper = { version = "1.11", default-features = false, features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
# The embedded host reads the owner's config.toml itself (same version as se),
# and the Codex launch reads the user's own provider file before it starts.
toml = "0.9.11"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["std"], optional = true }

[lints]
workspace = true

[[test]]
name = "w3_realhost_independent"
path = "tests/w3_realhost_independent.rs"
required-features = ["secode"]

[[test]]
name = "w3_lifecycle_independent"
path = "tests/w3_lifecycle_independent.rs"
required-features = ["secode"]

[dev-dependencies]
rusqlite = { version = "0.41", features = ["hooks"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "io-util"] }

[[test]]
name = "atlas_cold_crash_dev"
harness = false

[[test]]
name = "atlas_cold_history_dev"
harness = false
