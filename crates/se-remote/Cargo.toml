[package]
name = "se-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
listener = ["dep:tokio", "tokio/sync", "tokio/time"]
remote = ["listener", "tokio/macros", "tokio/net", "tokio/io-util", "dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
se-types = { path = "../se-types" }
se-core = { path = "../se-core" }
se-store = { path = "../se-store" }
se-proc = { path = "../se-proc" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "io-util"] }
