[package]
name = "se-proc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
se-types = { path = "../se-types" }
sha2.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Kernel", "Win32_System_SystemServices", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Pipes", "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Globalization"] }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"

[[test]]
name = "process_birth"
harness = false

[[test]]
name = "bootstrap_stderr"
harness = false

[[test]]
name = "linux_process_facts"
harness = false

[[test]]
name = "atlas_worker_failure"
harness = false

[[test]]
name = "atlas_git_failure"
harness = false
