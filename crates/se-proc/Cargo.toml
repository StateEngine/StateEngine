[package]
name = "se-proc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
se-custody = { path = "../se-custody" }
se-native-ipc = { path = "../se-native-ipc" }
se-native-path = { path = "../se-native-path" }
se-native-proc = { path = "../se-native-proc" }
se-source-watch = { path = "../se-source-watch" }
se-state-files = { path = "../se-state-files" }
se-types = { path = "../se-types" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

# The pinned digest crate gates its aarch64 hardware backend behind this feature.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
se-uninstall = { path = "../se-uninstall" }

[lints]
workspace = true
