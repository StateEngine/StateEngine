[package]
name = "se-user-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
se-state-files = { path = "../se-state-files" }
se-types = { path = "../se-types" }

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
ignore_without_reason = "deny"
# The structural guardrails the rest of the workspace inherits from the
# workspace lints, listed here because this crate keeps its own lint table for
# the FFI overrides above.
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
struct_excessive_bools = "warn"
