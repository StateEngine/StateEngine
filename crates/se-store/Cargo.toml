[package]
name = "se-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
se-store-contract = { path = "../se-store-contract" }
se-proc = { path = "../se-proc" }
se-types = { path = "../se-types" }
rusqlite = { version = "0.41", features = ["bundled", "functions", "hooks", "backup"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
subtle = "=2.6.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "allow"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
# The structural guardrails the rest of the workspace inherits from the
# workspace lints, listed here because this crate keeps its own lint table for
# the FFI override above.
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
struct_excessive_bools = "warn"
