[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/Brepro",
    "-C", "link-arg=/DELAYLOAD:user32.dll",
    "-C", "link-arg=/DELAYLOAD:ktmw32.dll",
    # Winsock, TLS, and account profile APIs are outside the local read path.
    "-C", "link-arg=/DELAYLOAD:crypt32.dll",
    "-C", "link-arg=/DELAYLOAD:secur32.dll",
    "-C", "link-arg=/DELAYLOAD:userenv.dll",
    "-C", "link-arg=/DELAYLOAD:ws2_32.dll",
    "-C", "link-arg=delayimp.lib",
]
