name: Rust CI tools
description: Pinned compiler and nextest, with Python for portable fixture drivers
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: 1.97.1
        components: rustfmt, clippy
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
      with:
        tool: cargo-nextest@0.9.143
