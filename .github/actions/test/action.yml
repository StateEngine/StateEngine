name: Archived Rust tests
description: Reuse one native build for required tests and informational Windows runtime checks
inputs:
  os:
    description: Platform label of the uploaded archive
    required: true
  shard:
    description: One of two test partitions
    required: true
  mode:
    description: Full suite or supported hosted Windows smoke tests
    default: full
  all-features:
    description: Feature mode used by the archive producer
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust
    - name: Register the disposable runner account for installation tests
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          python scripts/ci/installation_account.py provision
        else
          identity="$(id -u)"
          profile="$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.geteuid()).pw_dir)')"
          sudo python3 scripts/ci/installation_account.py provision --identity "$identity" --profile "$profile"
        fi
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: tests-${{ inputs.os }}
    - name: Run shard from the existing build
      shell: bash
      env:
        CI_TEST_MODE: ${{ inputs.mode }}
        CI_ALL_FEATURES: ${{ inputs.all-features }}
      run: |
        features=()
        if [[ "$CI_ALL_FEATURES" == true ]]; then features+=(--all-features); fi
        filter="$(python scripts/ci/custom.py filter "${features[@]}")"
        if [[ "$RUNNER_OS" == Windows && "$CI_TEST_MODE" == smoke ]]; then
          smoke='kind(lib)'
          smoke="$smoke or (binary(=atlas_hook_native) and test(=missing_host_and_unclosed_provider_input_are_silent_and_finite))"
          smoke="$smoke or (binary(=breakaway_refusal) and test(=no_eligible_broker_reports_named_refusal_and_current_legal_alternatives))"
          filter="($filter) and ($smoke)"
        fi
        cargo nextest run --archive-file tests.tar.zst --extract-to . --workspace-remap "$PWD" --profile ci --partition slice:${{ inputs.shard }}/2 -E "$filter"
    - name: Run custom harnesses once (their main functions serialize their own cases)
      if: ${{ !cancelled() && inputs.shard == '1' && inputs.mode != 'smoke' }}
      shell: bash
      run: python scripts/ci/custom.py run
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: ${{ always() }}
      with:
        name: results-${{ inputs.os }}-${{ inputs.mode }}-${{ inputs.shard }}
        path: target/nextest/ci/junit.xml
        retention-days: 3
        if-no-files-found: warn
