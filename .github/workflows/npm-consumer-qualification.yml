name: Unpublished npm consumer qualification
on:
  push:
    branches: [prime/npm-consumer-r1]
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9a773a00d8e1f78529153c9784ae15dd25646e53
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: ${{ runner.temp }}/unpublished-release
          run-id: 43612872007
          github-token: ${{ github.token }}
      - name: Install real packages in clean homes without publishing
        shell: python
        env:
          SOURCE_SHA: 9a773a00d8e1f78529153c9784ae15dd25646e53
          RELEASE_DIR: ${{ runner.temp }}/unpublished-release
        run: |
          #!/usr/bin/env python3
          """Author qualification of real unpublished npm payloads on a disposable Linux runner."""
          import base64
          import hashlib
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import threading
          import time
          from urllib.parse import unquote, urlsplit
          
          ROOT = Path(os.environ['RUNNER_TEMP']) / 'npm-consumer'
          if sys.platform != 'linux' or os.environ.get('GITHUB_ACTIONS') != 'true':
              raise SystemExit('requires a disposable hosted Linux runner')
          ROOT.mkdir(mode=0o700)
          LOG = ROOT / 'results'
          LOG.mkdir()
          CALLS = []
          RESULT = {'scope': 'Linux x64 glibc; real registry packages and native CLI; no provider launch',
                    'source': os.environ['SOURCE_SHA'], 'calls': CALLS}
          
          
          def save():
              (LOG / 'result.json').write_text(json.dumps(RESULT, indent=2) + '\n')
          
          
          def home(name, registry):
              directory = ROOT / name
              directory.mkdir(mode=0o700)
              (directory / 'global.npmrc').touch()
              # Credentials, provider configuration and Actions tokens never enter the consumer.
              env = {key: os.environ[key] for key in ('PATH', 'LANG', 'TMPDIR') if key in os.environ}
              env.update(HOME=str(directory), XDG_CONFIG_HOME=str(directory / 'config'),
                         XDG_STATE_HOME=str(directory / 'xdg'), SE_HOME=str(directory / 'state'),
                         CI='true', NPM_CONFIG_USERCONFIG='/dev/null',
                         NPM_CONFIG_GLOBALCONFIG=str(directory / 'global.npmrc'),
                         NPM_CONFIG_CACHE=str(directory / 'cache'), NPM_CONFIG_REGISTRY=registry,
                         NPM_CONFIG_AUDIT='false', NPM_CONFIG_FUND='false', NPM_CONFIG_UPDATE_NOTIFIER='false')
              return directory, env
          
          
          def call(label, argv, env, cwd=None, required=True):
              start = time.monotonic()
              with (LOG / (label + '.stdout')).open('wb') as out, (LOG / (label + '.stderr')).open('wb') as err:
                  child = subprocess.Popen(argv, env=env, cwd=cwd or ROOT, stdout=out, stderr=err)
                  try:
                      code = child.wait(timeout=300)
                  except subprocess.TimeoutExpired:
                      # This exact unreaped Popen child is owned by this qualification.
                      child.kill()
                      child.wait()
                      code = child.returncode
                      CALLS.append({'label': label, 'argv': argv, 'exit': code, 'timeout': True})
                      save()
                      raise
              CALLS.append({'label': label, 'argv': argv, 'exit': code,
                            'seconds': time.monotonic() - start})
              save()
              if required and code:
                  raise RuntimeError(f'{label} exited {code}; see preserved stdout/stderr')
              return (LOG / (label + '.stdout')).read_text(errors='replace').strip(), code
          
          
          def snapshot(directory):
              return {str(p.relative_to(directory)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in directory.rglob('*') if p.is_file()}
          
          
          server = None
          thread = None
          installed = False
          install_env = None
          try:
              release = Path(os.environ['RELEASE_DIR'])
              manifest = json.loads((release / 'release.json').read_bytes())
              if manifest['source_commit'] != RESULT['source']:
                  raise RuntimeError('downloaded archives do not match the selected source commit')
              public_home, public_env = home('public-home', 'https://registry.npmjs.org/')
              call('node-version', ['node', '--version'], public_env)
              call('npm-version', ['npm', '--version'], public_env)
              prefix, _ = call('default-global-prefix', ['npm', 'prefix', '-g'], public_env)
              RESULT['default_prefix'] = prefix
              if shutil.which('se', path=public_env['PATH']) or shutil.which('stateengine', path=public_env['PATH']):
                  raise RuntimeError('runner already contains a CLI; refusing to replace it')
              existing, _ = call('existing-global-package', ['npm', 'ls', '-g', '@stateengine/cli', '--json'], public_env, required=False)
              if json.loads(existing).get('dependencies', {}).get('@stateengine/cli'):
                  raise RuntimeError('global package already exists; refusing to replace it')
              install_env = public_env
              installed = True
              _, public_code = call('public-install', ['npm', 'install', '-g', '@stateengine/cli'], public_env, required=False)
              RESULT['public_install_exit'] = public_code
              public_se = shutil.which('se', path=public_env['PATH'])
              placeholder = shutil.which('stateengine', path=public_env['PATH'])
              RESULT['public_se'] = public_se
              RESULT['public_stateengine'] = placeholder
              if public_se:
                  call('public-se-version', [public_se, '--version'], public_env, required=False)
              elif placeholder:
                  call('public-placeholder-version', [placeholder, '--version'], public_env, required=False)
              call('public-uninstall', ['npm', 'uninstall', '-g', '@stateengine/cli'], public_env)
              installed = False
          
              packages = ROOT / 'packages'
              call('generate', [sys.executable, '-B', 'scripts/release/npm_release.py',
                               '--release-dir', str(release), '--out', str(packages)],
                   public_env, cwd=Path(os.environ['GITHUB_WORKSPACE']))
              tarballs = ROOT / 'tarballs'
              tarballs.mkdir()
              order = json.loads((packages / 'publish-order.json').read_bytes())
              metadata = {}
              files = {}
              for index, item in enumerate(order['packages']):
                  package = packages / item['directory']
                  packed, _ = call(f'pack-{index}', ['npm', 'pack', '--ignore-scripts', '--json',
                                        '--pack-destination', str(tarballs)], public_env, cwd=package)
                  record, = json.loads(packed)
                  archive = tarballs / record['filename']
                  native_metadata = json.loads((package / 'package.json').read_bytes())
                  files[archive.name] = archive
                  metadata[item['name']] = (native_metadata, archive)
          
              class Registry(BaseHTTPRequestHandler):
                  def do_GET(self):
                      path = unquote(urlsplit(self.path).path)
                      if path.startswith('/tarballs/') and path.removeprefix('/tarballs/') in files:
                          archive = files[path.removeprefix('/tarballs/')]
                          self.send_response(200)
                          self.send_header('Content-Type', 'application/octet-stream')
                          self.send_header('Content-Length', str(archive.stat().st_size))
                          self.end_headers()
                          with archive.open('rb') as stream:
                              shutil.copyfileobj(stream, self.wfile)
                          return
                      name = path.removeprefix('/')
                      if name not in metadata:
                          self.send_error(404)
                          return
                      value, archive = metadata[name]
                      with archive.open('rb') as stream:
                          integrity = base64.b64encode(hashlib.file_digest(stream, 'sha512').digest()).decode()
                      with archive.open('rb') as stream:
                          shasum = hashlib.file_digest(stream, 'sha1').hexdigest()
                      entry = dict(value, dist={'tarball': f'http://127.0.0.1:{self.server.server_port}/tarballs/{archive.name}',
                                               'integrity': 'sha512-' + integrity, 'shasum': shasum})
                      data = json.dumps({'name': name, 'dist-tags': {'latest': value['version']},
                                         'versions': {value['version']: entry}}).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Content-Length', str(len(data)))
                      self.end_headers()
                      self.wfile.write(data)
          
                  def log_message(self, format, *args):
                      with (LOG / 'registry-requests.log').open('a') as stream:
                          stream.write(format % args + '\n')
          
              server = ThreadingHTTPServer(('127.0.0.1', 0), Registry)
              thread = threading.Thread(target=server.serve_forever)
              thread.start()
              registry = f'http://127.0.0.1:{server.server_port}/'
              private_home, env = home('unpublished-home', registry)
              install_env = env
              installed = True
              call('unpublished-install', ['npm', 'install', '-g', '@stateengine/cli'], env)
              executable = shutil.which('se', path=env['PATH'])
              if not executable:
                  raise RuntimeError('successful npm install did not expose se on the default PATH')
              RESULT['installed_se'] = executable
              call('installed-version', [executable, '--version'], env)
              call('installed-help', [executable, '--help'], env)
              global_root, _ = call('global-root', ['npm', 'root', '-g'], env)
              wrapper = Path(global_root) / '@stateengine/cli'
              native_root, _ = call('resolve-native', ['node', '--input-type=module', '-e',
                  "import {createRequire} from 'node:module';const r=createRequire(process.argv[1]);console.log(r.resolve('@stateengine/cli-linux-x64/package.json'));",
                  str(wrapper / 'package.json')], env)
              payload = Path(native_root).parent / 'payload'
              pin = json.loads((payload / 'native-payload.json').read_bytes())
              if pin['source_commit'] != RESULT['source'] or pin['version'] != manifest['version']:
                  raise RuntimeError('installed native payload source/version differs from the build')
              if hashlib.sha256((payload / 'se').read_bytes()).hexdigest() != pin['files']['se']['sha256']:
                  raise RuntimeError('installed native executable differs from the payload inventory')
              RESULT['installed_payload'] = pin
              repo = private_home / 'repo'
              repo.mkdir()
              call('git-init', ['git', 'init', '--quiet'], env, cwd=repo)
              call('installed-init-help', [executable, 'init', '--help'], env)
              call('installed-init', [executable, 'init', '--repo', str(repo), '--name', 'sample',
                                     '--agent', 'worker', '--provider', 'claude', '--json'], env, cwd=repo)
              agents, _ = call('installed-agent-readback', [executable, 'agent', 'list', '--json'], env, cwd=repo)
              if len(json.loads(agents)['items']) != 1:
                  raise RuntimeError('initialized agent did not survive public CLI readback')
              before = snapshot(private_home / 'state')
              call('unpublished-uninstall', ['npm', 'uninstall', '-g', '@stateengine/cli'], env)
              installed = False
              if shutil.which('se', path=env['PATH']):
                  raise RuntimeError('npm uninstall left the CLI on PATH')
              if before != snapshot(private_home / 'state'):
                  raise RuntimeError('npm uninstall changed initialized StateEngine data')
              RESULT['unpublished_install_init_readback_uninstall'] = 'pass'
          except Exception as error:
              RESULT['failure'] = f'{type(error).__name__}: {error}'
              raise
          finally:
              if installed and install_env is not None:
                  try:
                      call('cleanup-uninstall', ['npm', 'uninstall', '-g', '@stateengine/cli'], install_env)
                  except Exception as error:
                      RESULT['cleanup_failure'] = str(error)
              if server is not None:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=10)
                  if thread.is_alive():
                      RESULT['cleanup_failure'] = 'registry thread did not stop'
              save()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: npm-consumer-results
          path: ${{ runner.temp }}/npm-consumer/results/
          if-no-files-found: error
