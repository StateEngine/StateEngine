name: Atlas source SQL index order development probe
'on':
- push
- workflow_dispatch
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        source:
        - 87b530ae04cf2ce0b1d60f21c3da832fb356d41e
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: 'import os,tomllib

        from pathlib import Path

        channel=tomllib.loads(Path(''rust-toolchain.toml'').read_text())[''toolchain''][''channel'']

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as out: print(''channel=''+channel,file=out)

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Compare exact candidate cutoff against indexed stream prototype
      shell: python
      run: "FILES={'main.rs': '//! Author development adaptation of the independent component observer; not admission proof.\\nmod measure;\\nmod parse;\\nmod sql_replay;\\nmod sql;\\nuse se_atlas::{model::*, scope::Scope};\\nuse se_types::ProjectId;\\nuse std::{\\n    error::Error,\\n    path::{Path, PathBuf},\\n    time::{Duration, Instant},\\n};\\ntype Result<T> = std::result::Result<T, Box<dyn Error>>;\\nfn until() -> Instant {\\n    Instant::now() + Duration::from_secs(20)\\n}\\nfn scope(root: &Path) -> Result<Scope> {\\n    let source = root.join(\"source\");\\n    std::fs::create_dir(&source)?;\\n    let native = se_proc::NativeSourceRoot::open(&source)?;\\n    Ok(Scope::new(\\n        RootRegistration {\\n            project: ProjectId::from_parts(1, [7; 10])?,\\n            root: RootId::from_parts(1, [8; 10])?,\\n            canonical_source_root: source,\\n            cache: CacheLocation {\\n                directory: root\\n                    .join(\"cache\")\\n           \
        \         .join(ProjectId::from_parts(1, [7; 10])?.as_str())\\n                    .join(RootId::from_parts(1, [8; 10])?.as_str()),\\n            },\\n            git_metadata: None,\\n        },\\n        native.physical_identity()?,\\n    )?)\\n}\\nfn main() -> Result<()> {\\n    let args: Vec<_> = std::env::args().collect();\\n    let root = PathBuf::from(args.get(1).ok_or(\"private fixture directory required\")?);\\n    std::fs::create_dir(&root)?;\\n    use std::os::unix::fs::PermissionsExt;\\n    std::fs::set_permissions(&root, std::fs::Permissions::from_mode(0o700))?;\\n    se_proc::initialize_file_creation_owner()?;\\n    measure::install();\\n    let scope = scope(&root)?;\\n    let report = if args.get(2).map(String::as_str) == Some(\"sql\") {\\n        sql::run(scope, &root)?\\n    } else {\\n        parse::run(\\n            scope,\\n            args.get(2).ok_or(\"grammar required\")?,\\n            args.get(3).ok_or(\"pattern required\")?,\\n        )?\\n    };\\n \
