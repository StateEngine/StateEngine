name: Windows warm checkout authenticated image replay
'on':
  push:
    branches:
    - prime/warm-checkout-401-judges-r2
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  judge:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 1db0f20fa543e496fa04be4f37af106a8a0bc27f
        path: source-base
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 6c45194834cb46e14a9579d780325dd585468e29
        path: source-head
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 67f6652e8956f61341b4131b4ed29e68312dabe4
        path: controls
        persist-credentials: false
        sparse-checkout: 'crates/se/tests/warm_checkout_measurement_review.rs

          crates/se-store/tests/warm_checkout_native_review.rs

          crates/se/tests/review_warm_checkout/clients.py

          crates/se/tests/review_warm_checkout/mutate.py

          crates/se/tests/review_warm_checkout/native_process.py

          crates/se/tests/review_warm_checkout/security.ps1

          crates/se/tests/review_warm_checkout/terminate_owned.py'
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Stage independent frozen public consumers
      shell: python
      run: "from pathlib import Path\nimport hashlib,shutil\nCONTROLS={'crates/se/tests/warm_checkout_measurement_review.rs':\
        \ 'f41958784831d0076690124a399327d62518cab74d401a8610bf096345a9bd59', 'crates/se-store/tests/warm_checkout_native_review.rs':\
        \ '62b57c3d454a6bacfdac99d9125a61953642ef325ea874c0beecbcea10fb7226', 'crates/se/tests/review_warm_checkout/clients.py':\
        \ '2efad4ccd25cfc391abbe23dcf66957f1ee8e076a46a49659f99e33b3efaffa7', 'crates/se/tests/review_warm_checkout/mutate.py':\
        \ '01dc1539e72232ce0baebaab15a7bee89995796828c73cfdfda5e6571013e062', 'crates/se/tests/review_warm_checkout/native_process.py':\
        \ '1a1933818b6c46ab9497383fc6e37c8547eee45d448dcd8f8c6b4586529d98dd', 'crates/se/tests/review_warm_checkout/security.ps1':\
        \ '8a5a2763fc6b204ea3b3be3f601a3f20c18824e5d85fbecdfc9e9edc6b5dd584', 'crates/se/tests/review_warm_checkout/terminate_owned.py':\
        \ '7ad11a21dd2259275eb57cd1ae78324bbbe24083ddb16d3dddb0b67304c5feed'}\nfor arm in [\"base\",\"head\"]:\n for name,digest\
        \ in CONTROLS.items():\n  original=Path(\"controls\")/name\n  assert hashlib.sha256(original.read_bytes()).hexdigest()==digest\n\
        \  target=Path(\"source-\"+arm)/name\n  assert not target.exists()\n  target.parent.mkdir(parents=True,exist_ok=True)\n\
        \  shutil.copyfile(original,target)\n"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: warm-checkout-401-r1
        path: original
        run-id: 43737610838
        github-token: ${{ github.token }}
    - name: Replay exact authenticated product images and corrected external judge
      shell: python
      run: "import os,sys\nfrom pathlib import Path\nsys.argv=[\"replay\",\"--input\",\"original\",\"--source-base\",\"source-base\"\
        ,\"--source-head\",\"source-head\",\"--out\",str(Path(os.environ[\"RUNNER_TEMP\"])/\"warm-checkout-401-r2\")]\n\"\"\
        \"Compare frozen public consumers without product instrumentation.\"\"\"\nimport argparse\nimport hashlib\nimport\
        \ json\nimport math\nimport os\nfrom pathlib import Path\nimport platform\nimport shutil\nimport statistics\nimport\
        \ subprocess\nimport time\nimport traceback\n\nPRODUCTS = {'base': '1db0f20fa543e496fa04be4f37af106a8a0bc27f',\n \
        \           'head': '6c45194834cb46e14a9579d780325dd585468e29'}\nCONTROLS = ['crates/se/tests/warm_checkout_measurement_review.rs',\n\
        \            'crates/se-store/tests/warm_checkout_native_review.rs']\nCONTROLS += ['crates/se/tests/review_warm_checkout/'\
        \ + name for name in\n             ['clients.py', 'mutate.py', 'native_process.py', 'security.ps1', 'terminate_owned.py']]\n\
        OPS = ['stateengine_msg_send', 'stateengine_working_state_set']\nPHASES = ['admission', 'submission', 'continuation']\n\
        \n\ndef save(path, value):\n    path.write_text(json.dumps(value, indent=2) + '\\n', encoding='utf-8')\n\n\ndef digest(path):\n\
        \    return hashlib.sha256(path.read_bytes()).hexdigest()\n\n\ndef p95(values):\n    assert values and all(math.isfinite(x)\
        \ for x in values)\n    return sorted(values)[math.ceil(len(values) * .95) - 1]\n\n\ndef components(sample):\n   \
        \ assert sample['writer']['mode'] == 'host' and sample['event_id']\n    phases = sample['diagnostics']['host_phases']\n\
        \    result = {'client_ms': sample['ms'], 'host_ms': phases['admitted_to_encode_us'] / 1000,\n              'completion_wait_ms':\
        \ phases['completion_wait_us'] / 1000}\n    for phase in PHASES:\n        span = phases[phase]\n        assert span['jobs']\
        \ == 1 and 'native_file_counts' not in span\n        for part in ['queue', 'work', 'resume']:\n            result[phase\
        \ + '_' + part + '_ms'] = span[part + '_us'] / 1000\n    for part in ['queue', 'work', 'resume']:\n        result['worker_'\
        \ + part + '_ms'] = sum(result[phase + '_' + part + '_ms'] for phase in PHASES)\n    result['host_other_ms'] = result['host_ms']\
        \ - result['completion_wait_ms'] - sum(\n        result['worker_' + part + '_ms'] for part in ['queue', 'work', 'resume'])\n\
        \    result['bridge_wire_ms'] = result['client_ms'] - result['host_ms']\n    assert result['host_other_ms'] >= -.01\
        \ and result['bridge_wire_ms'] >= -.01\n    assert all(math.isfinite(value) for value in result.values())\n    return\
        \ result\n\n\ndef analyze(report, smoke):\n    assert set(report['cohorts']) == ({'1'} if smoke else {'1', '8'})\n\
        \    result, seen = {}, set()\n    for cohort, clients in report['cohorts'].items():\n        assert len(clients)\
        \ == int(cohort)\n        for client in clients:\n            assert not client.get('error') and not client.get('cleanup_error'),\
        \ client\n            assert client['verified_events'] == 60 and client['replay_verified'] == 2\n            assert\
        \ client['bridge_exit'] == 0 and set(client['samples']) == set(OPS)\n        measured = {}\n        for op in OPS:\n\
        \            rows, tails = [], []\n            for client in clients:\n                samples = client['samples'][op]\n\
        \                assert len(samples) == 30 and p95([s['ms'] for s in samples]) == client['p95_ms'][op]\n         \
        \       tails.append(sorted(samples, key=lambda row: row['ms'])[28])\n                for sample in samples:\n   \
        \                 assert sample['key'] not in seen\n                    seen.add(sample['key'])\n                \
        \    rows.append(components(sample))\n            tail = max(tails, key=lambda sample: sample['ms'])\n           \
        \ measured[op] = {'samples': len(rows), 'worst_client_p95_ms': tail['ms'],\n                'pooled_p95_ms': p95([row['client_ms']\
        \ for row in rows]),\n                'worker_queue_p95_ms': p95([row['worker_queue_ms'] for row in rows]),\n    \
        \            'worker_queue_mean_ms': statistics.mean(row['worker_queue_ms'] for row in rows),\n                'worker_work_mean_ms':\
        \ statistics.mean(row['worker_work_ms'] for row in rows),\n                'exact_worst_client_tail_key': tail['key'],\
        \ 'exact_tail_components': components(tail)}\n        result[cohort] = measured\n    assert len(seen) == (60 if smoke\
        \ else 540)\n    return {'cohorts': result, 'verified_events': len(seen), 'latency_budget_pass': report['pass'],\n\
        \            'accounting': 'Per-request worker sums are additive; marginal p95s and overlapping writer/completion\
        \ intervals are not added.'}\n\n\nclass CleanupUnknown(RuntimeError):\n    pass\n\n\ndef main():\n    parser = argparse.ArgumentParser(description='Replay\
        \ authenticated review images; do not rebuild product code.')\n    parser.add_argument('--input', type=Path, required=True)\n\
        \    parser.add_argument('--source-base', type=Path)\n    parser.add_argument('--source-head', type=Path, required=True)\n\
        \    parser.add_argument('--out', type=Path, required=True)\n    parser.add_argument('--preflight', action='store_true')\n\
        \    args = parser.parse_args()\n    assert args.preflight or os.name == 'nt'\n    original = args.input.resolve()\n\
        \    out = args.out.resolve()\n    out.mkdir(exist_ok=False)\n    summary = {'products': PRODUCTS, 'preflight': args.preflight,\
        \ 'qualified': False,\n               'platform': platform.platform(), 'profile': 'release', 'features': 'all-features',\n\
        \               'distribution_performance_claim': False, 'resource_cost': 'not measured',\n               'producer_sha256':\
        \ digest(Path(__file__)), 'phases': [], 'failures': [], 'measurements': []}\n    sources = {'head': args.source_head.resolve()}\
        \ if args.preflight else {\n        'base': args.source_base.resolve(), 'head': args.source_head.resolve()}\n    env\
        \ = {k: v for k, v in os.environ.items() if not k.startswith(\n        ('SE_', 'STATEENGINE_', 'SECODE_', 'OPENAI_',\
        \ 'ANTHROPIC_', 'GH_', 'GITHUB_'))\n        and k not in ('CLAUDECODE', 'CODEX_THREAD_ID', 'CODEX_CI')}\n    old =\
        \ json.loads((original / 'summary.json').read_text())\n\n    def execute(arm, label, command, extra=None):\n     \
        \   row = {'arm': arm, 'label': label, 'argv': [str(x) for x in command], 'state': 'unrun'}\n        summary['phases'].append(row)\n\
        \        save(out / 'summary.json', summary)\n        destination = out / arm\n        destination.mkdir(exist_ok=True)\n\
        \        with (destination / (label + '.stdout')).open('wb') as stdout, (destination / (label + '.stderr')).open('wb')\
        \ as stderr:\n            child = subprocess.Popen(row['argv'], cwd=sources[arm], env=dict(env, **(extra or {})),\n\
        \                                     stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr)\n            row.update(state='running',\
        \ owned_pid=child.pid)\n            save(out / 'summary.json', summary)\n            try:\n                row['exit']\
        \ = child.wait(timeout=300)\n            except subprocess.TimeoutExpired:\n                row.update(state='failed',\
        \ cleanup_unknown=True)\n                raise CleanupUnknown(f'Owned {label} process {child.pid} did not join; no\
        \ next arm started')\n        row['state'] = 'passed' if row['exit'] == 0 else 'failed'\n        save(out / 'summary.json',\
        \ summary)\n        assert row['exit'] == 0, f'{arm} {label} failed; complete output retained'\n        return destination\
        \ / (label + '.stdout')\n\n    try:\n        expected_manifest = {'native': '16ebcd12560a1c5e209044905aa6190f94d743fbd4ddb46284fd9f825e19cabc',\
        \ 'preflight': 'de32d710ce2d0b419a4b8e10406b20c075bc4ec6db4591554f7c2b87d5fb398a'}\n        assert digest(original\
        \ / 'manifest.json') == expected_manifest['preflight' if args.preflight else 'native']\n        manifest = json.loads((original\
        \ / 'manifest.json').read_text())\n        for name, expected in manifest['files'].items():\n            path = original\
        \ / name\n            assert path.stat().st_size == expected['bytes'] and digest(path) == expected['sha256'], name\n\
        \        summary['original_manifest_sha256'] = digest(original / 'manifest.json')\n        programs = {}\n       \
        \ for arm, source in sources.items():\n            destination = out / arm\n            destination.mkdir()\n    \
        \        inputs = json.loads((original / arm / 'inputs.json').read_text())\n            assert inputs['product'] ==\
        \ PRODUCTS[arm]\n            current = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=source, text=True).strip()\n\
        \            changed = set(subprocess.check_output(['git', 'diff', '--name-only', PRODUCTS[arm]], cwd=source, text=True).splitlines())\n\
        \            assert changed <= set(CONTROLS)\n            status = subprocess.check_output(['git', 'status', '--porcelain',\
        \ '--untracked-files=all'], cwd=source, text=True)\n            assert all(line[3:] in CONTROLS for line in status.splitlines())\n\
        \            runtime = {name: digest(source / name) for name in CONTROLS}\n            for name, value in runtime.items():\n\
        \                if not name.endswith('/security.ps1'):\n                    assert value == inputs['review_controls'][name],\
        \ name\n            save(destination / 'inputs.json', {'product': PRODUCTS[arm], 'checked_out': current,\n       \
        \          'compiled_controls': inputs['review_controls'], 'runtime_controls': runtime,\n                 'original_images':\
        \ json.loads((original / arm / 'images.json').read_text())})\n            binaries = {}\n            for label in\
        \ ['measure', 'store', 'host']:\n                log = original / arm / ('build-' + label + '.stdout')\n         \
        \       if not log.exists():\n                    assert args.preflight and label == 'host'\n                    continue\n\
        \                for line in log.read_text(encoding='utf-8').splitlines():\n                    if not line.startswith('{'):\n\
        \                        continue\n                    row = json.loads(line)\n                    if row.get('reason')\
        \ == 'compiler-artifact' and row.get('executable') and row.get('profile', {}).get('test'):\n                     \
        \   name = row['target']['name']\n                        if name == 'warm_checkout_measurement_review':\n       \
        \                     assert Path(row['target']['src_path']).parents[3] == source, 'Compiled source root differs from\
        \ staged runtime consumer'\n                        binaries[name] = Path(row['executable'])\n            binaries['se']\
        \ = Path(next(p['argv'][0] for p in old['phases']\n                                      if p['arm'] == arm and p['label']\
        \ == 'first-product-call'))\n            identities = json.loads((original / arm / 'images.json').read_text())\n \
        \           assert set(binaries) == set(identities)\n            for name, path in binaries.items():\n           \
        \     exported = original / arm / (name + path.suffix)\n                expected = identities[name]\n            \
        \    assert exported.stat().st_size == expected['bytes'] and digest(exported) == expected['sha256']\n            \
        \    path.parent.mkdir(parents=True, exist_ok=True)\n                if not path.exists():\n                    shutil.copyfile(exported,\
        \ path)\n                assert path.stat().st_size == expected['bytes'] and digest(path) == expected['sha256']\n\
        \            programs[arm] = binaries\n            save(destination / 'images.json', identities)\n            scratch\
        \ = out.parent / (out.name + '-' + arm + '-private')\n            scratch.mkdir(exist_ok=False)\n            repo\
        \ = scratch / 'repo'\n            repo.mkdir()\n            log = execute(arm, 'first-product-call', [binaries['se'],\
        \ '--json', '--home', scratch / 'state', 'init', '--repo', repo])\n            assert json.loads(log.read_text())['schema']\
        \ == 'se.init/v1'\n            assert (scratch / 'state/state.db').is_file()\n        for arm, binaries in programs.items():\n\
        \            for name, expected in [('warm_checkout_native_review', 4), ('read_pool_independent', 7),\n          \
        \                         ('read_pool_host_independent', 4 if os.name == 'nt' else 5)]:\n                if name not\
        \ in binaries:\n                    assert args.preflight and name == 'read_pool_host_independent'\n             \
        \       continue\n                try:\n                    log = execute(arm, 'regression-' + name, [binaries[name],\
        \ '--nocapture', '--test-threads=1'])\n                    assert f'test result: ok. {expected} passed; 0 failed;'\
        \ in log.read_text(encoding='utf-8')\n                except CleanupUnknown:\n                    raise\n        \
        \        except Exception as error:\n                    summary['failures'].append({'arm': arm, 'path': name, 'error':\
        \ repr(error)})\n        order = [('head', 1)] if args.preflight else [('base', 1), ('head', 1), ('head', 2), ('base',\
        \ 2)]\n        for arm, repeat in order:\n            try:\n                measurement = out / arm / f'measurement-{repeat}'\n\
        \                extra = {'SE_REVIEW_OUT': str(measurement)}\n                if args.preflight:\n               \
        \     extra['SE_MEASURE_COHORT'] = '1'\n                execute(arm, f'measurement-{repeat}', [programs[arm]['warm_checkout_measurement_review'],\n\
        \                        'measure_public_warm_checkout', '--exact', '--nocapture', '--test-threads=1'], extra)\n \
        \               report = json.loads((measurement / 'mcp-writers.json').read_text(encoding='utf-8'))\n            \
        \    summary['measurements'].append({'arm': arm, 'repeat': repeat, **analyze(report, args.preflight)})\n         \
        \   except CleanupUnknown:\n                raise\n            except Exception as error:\n                summary['failures'].append({'arm':\
        \ arm, 'path': f'measurement-{repeat}', 'error': repr(error)})\n            save(out / 'summary.json', summary)\n\
        \        summary['qualified'] = not summary['failures']\n    except Exception as error:\n        summary['failure']\
        \ = repr(error)\n        summary['traceback'] = traceback.format_exc()\n        summary['cleanup_unknown'] = isinstance(error,\
        \ CleanupUnknown)\n    finally:\n        save(out / 'summary.json', summary)\n        save(out / 'manifest.json',\
        \ {'files': {p.relative_to(out).as_posix():\n             {'bytes': p.stat().st_size, 'sha256': digest(p)} for p in\
        \ out.rglob('*') if p.is_file()}})\n    return 0 if summary['qualified'] else 1\n\n\nif __name__ == '__main__':\n\
        \    raise SystemExit(main())\n\n"
    - name: Retain complete input identities, native controls and raw phase samples
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: warm-checkout-401-r2
        path: ${{ runner.temp }}/warm-checkout-401-r2
        if-no-files-found: error
