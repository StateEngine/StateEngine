        'XDG_CACHE_HOME\\',\\n                                  \\'XDG_STATE_HOME\\', \\'XDG_RUNTIME_DIR\\\
        ', \\'CODEX_HOME\\']})\\n                return super().call(*arguments, **options)\\n\\n    \
        \    private = root / \\'private\\'\\n        private.mkdir(mode=0o700)\\n        for name in\
