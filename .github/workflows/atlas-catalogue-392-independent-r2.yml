    - name: Build exact images and judge idle and crash recovery
      shell: python
      run: "import hashlib,json,os,shutil,subprocess,sys\nfrom pathlib import Path\nworkspace=Path.cwd()\n\
        judge=workspace/'judge'\nartifacts=workspace/'artifacts'\nartifacts.mkdir()\npins={'base': '7b23fb01a7e16362c6d6b024e5c1801a32bda8c6',\
        \ 'head': 'a08fab8906e2e4696500bb2a3d7b52a5d100d308'}\ntarget='x86_64-pc-windows-msvc' if os.name=='nt'\
        \ else 'x86_64-unknown-linux-gnu'\nbinary='se.exe' if os.name=='nt' else 'se'\ndef run(argv,**kwargs):\n\
        \    subprocess.run([str(value) for value in argv],check=True,**kwargs)\noutcomes=[]\nclass PhaseBlocked(Exception):pass\n\
        def phase(name,action):\n    row=dict(phase=name,state='running')\n    try:\n        action()\n\
        \        row['state']='passed'\n    except PhaseBlocked as error:\n        row.update(state='blocked',reason=str(error))\n\
        \    except Exception as error:\n        row.update(state='failed',error=f'{type(error).__name__}:\
        \ {error}')\n        if isinstance(error,subprocess.CalledProcessError):row['exit_code']=error.returncode\n\
        \    outcomes.append(row)\n    (artifacts/'phase-outcomes.json').write_text(json.dumps(dict(\n\
        \        phases=outcomes,\n        base_crash_expected='Recovery passes; deferred-publication\
        \ discriminator fails (intended negative).',\n        head_crash_expected='Recovery and deferred-publication\
        \ discriminator both pass.',\n        rule='An unrelated base correctness or harness failure is\
        \ never an expected negative.'\n    ),indent=2)+'\\n')\n    print(json.dumps(row),flush=True)\n\
        def blocked(name,reason):\n    raise PhaseBlocked(name+': '+reason)\ndef preserve_results(source,label):\n\
        \    if not source.exists():return\n    for path in source.rglob('result.json'):\n        relative=path.relative_to(source)\n\
        \        destination=artifacts/label/relative\n        destination.parent.mkdir(parents=True,exist_ok=True)\n\
        \        shutil.copyfile(path,destination)\n    if (source/'summary.json').exists():\n       \
        \ destination=artifacts/label/'summary.json'\n        destination.parent.mkdir(parents=True,exist_ok=True)\n\
        \        shutil.copyfile(source/'summary.json',destination)\nimages={}\ndef build_shipping(arm,sha):\n\
        \    source=workspace/arm\n    actual=subprocess.check_output(['git','rev-parse','HEAD'],cwd=source,text=True).strip()\n\
        \    assert actual==sha\n    assert not subprocess.check_output(['git','status','--porcelain'],cwd=source,text=True)\n\
        \    output=workspace/(arm+'-package')\n    run([sys.executable,source/'scripts/release/build.py','--target',target,'--out',output,\n\
        \         '--target-dir',workspace/(arm+'-target')],cwd=source)\n    images[arm]=output/binary\n\
        \    shutil.copyfile(output/'build.json',artifacts/(arm+'-build.json'))\n    (artifacts/(arm+'-source.txt')).write_text(sha+'\\\
        n')\n    (artifacts/(arm+'-image-sha256.txt')).write_text(hashlib.sha256(images[arm].read_bytes()).hexdigest()+'\\\
        n')\nfor arm,sha in pins.items():\n    phase('build-shipping-'+arm,lambda arm=arm,sha=sha:build_shipping(arm,sha))\n\
        def idle_arm(arm,mode,number):\n    label=f'{mode}-{number:02}-{arm}'\n    if arm not in images:\n\
        \        blocked(label,'its shipping image did not build')\n        return\n    output=workspace/label\n\
        \    try:\n        # Only the selected arm runs. Its peer can be absent without blocking it.\n\
        \        run([sys.executable,judge/'observe_idle.py','--base-se',images.get('base',images[arm]),\n\
        \             '--head-se',images.get('head',images[arm]),'--output',output,'--mode',mode,\n  \
        \           '--seconds','60','--warmup','30','--rounds','1','--arms',arm])\n    finally:\n   \
        \     preserve_results(output,label)\nfor number in range(3):\n    for arm in (['base','head']\
        \ if number%2==0 else ['head','base']):\n        phase(f'untraced-{number:02}-{arm}',lambda arm=arm,number=number:idle_arm(arm,'untraced',number))\n\
        if os.name!='nt':\n    def eviction(arm,sha):\n        if arm not in images:\n            blocked('eviction-'+arm,'its\
        \ shipping image did not build')\n            return\n        try:\n            run([sys.executable,judge/'eviction_recovery.py','--se',images[arm],'--source',sha,\n\
        \                 '--output',workspace/(arm+'-eviction')])\n        finally:\n            preserve_results(workspace/(arm+'-eviction'),arm+'-eviction')\n\
        \    for arm,sha in pins.items():\n        phase('eviction-'+arm,lambda arm=arm,sha=sha:eviction(arm,sha))\n\
        \    phase('allow-native-flush-tracing',lambda:run(['sudo','sysctl','kernel.yama.ptrace_scope=0']))\n\
        \    def flush(arm):\n        label='linux-fsync-00-'+arm\n        try:\n            idle_arm(arm,'linux-fsync',0)\n\
        \        finally:\n            for path in (workspace/label).rglob('fsync.*'):\n             \
        \   if path.name.rsplit('.',1)[-1].isdigit():\n                    destination=artifacts/label/path.relative_to(workspace/label)\n\
        \                    destination.parent.mkdir(parents=True,exist_ok=True)\n                  \
        \  shutil.copyfile(path,destination)\n    for arm in pins:\n        phase('fsync-'+arm,lambda\
        \ arm=arm:flush(arm))\n    crash_images={}\n    def build_crash(arm,sha):\n        source=workspace/arm\n\
        \        overlay=workspace/(arm+'-crash-source')\n        run(['git','worktree','add','-b','review-crash-'+arm,overlay,sha],cwd=source)\n\
        \        run([sys.executable,judge/'inject_crash_barrier.py','--source',overlay,'--expected-head',sha,\n\
        \             '--receipt',artifacts/(arm+'-crash-overlay.json')])\n        # The release builder\
        \ requires a clean committed tree. This private\n        # runner branch holds only the reviewer\
        \ hook and is never pushed.\n        message=workspace/(arm+'-crash-message.txt')\n        message.write_text('Add\
        \ an independent maintenance crash barrier.\\n\\nCo-Authored-By: GPT-6 <noreply@openai.com>\\\
        n')\n        run(['git','-c','user.name=JimmyMederos',\n             '-c','user.email=309843563+JimmyMederos@users.noreply.github.com',\n\
        \             'commit','-F',message,'--','crates/se-host/src/runtime/atlas_owner/mod.rs'],cwd=overlay)\n\
        \        overlay_head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=overlay,text=True).strip()\n\
        \        (artifacts/(arm+'-crash-source.txt')).write_text(overlay_head+'\\n')\n        output=workspace/(arm+'-crash-package')\n\
        \        run([sys.executable,overlay/'scripts/release/build.py','--target',target,'--out',output,\n\
        \             '--target-dir',workspace/(arm+'-crash-target')],cwd=overlay)\n        crash_images[arm]=output/binary\n\
        \    def crash(arm,sha):\n        if arm not in crash_images:\n            blocked('crash-'+arm,'its\
        \ reviewer crash image did not build')\n            return\n        try:\n            run([sys.executable,judge/'crash_recovery.py','--se',crash_images[arm],'--source',sha,'--arm',arm,\n\
        \                 '--output',workspace/(arm+'-crash')])\n        finally:\n            preserve_results(workspace/(arm+'-crash'),arm+'-crash')\n\
        \    for arm,sha in pins.items():\n        phase('build-crash-'+arm,lambda arm=arm,sha=sha:build_crash(arm,sha))\n\
        \        phase('crash-'+arm,lambda arm=arm,sha=sha:crash(arm,sha))\n# Every independent phase\
        \ has had its chance before the one final assertion.\nassert outcomes and all(row['state']=='passed'\
        \ for row in outcomes), outcomes\n"
    - name: Hash evidence without test homes or capabilities
      if: always()
      shell: python
      run: "import hashlib,json,shutil\nfrom pathlib import Path\nroot=Path('artifacts');root.mkdir(exist_ok=True)\n\
        judge=Path('judge')\nfor path in judge.rglob('*.py'):\n    destination=root/'judge'/path.relative_to(judge)\n\
        \    destination.parent.mkdir(parents=True,exist_ok=True)\n    shutil.copyfile(path,destination)\n\
        values={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()\n        for p in\
        \ sorted(root.rglob('*')) if p.is_file() and p.name!='SHA256.json'}\n(root/'SHA256.json').write_text(json.dumps(values,indent=2)+'\\\
        n')\n"
