name: Independent catalogue persistence comparison
'on':
  push:
    branches:
    - prime/atlas-catalogue-392-independent-r2
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  judge:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
