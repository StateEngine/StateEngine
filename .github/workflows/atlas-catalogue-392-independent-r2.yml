        \ / \\'fixture/completed_provider.py\\')\\n        listener.bind((\\'127.0.0.1\\', 0))\\n    \
        \    listener.listen(1)\\n        listener.settimeout(40)\\n        nonce = uuid.uuid4().hex\\\
        n        save(f.repo / \\'completion-control.json\\', dict(port=listener.getsockname()[1], nonce=nonce))\\\
        n        started = f.ok(\\'up\\')\\n        pid = started[\\'process\\'][\\'pid\\']\\n       \
        \ owner = identity(pid)\\n        assert str(image) in owner[\\'command\\'] and str(f.home) in\
