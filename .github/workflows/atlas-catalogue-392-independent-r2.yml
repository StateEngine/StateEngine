        n                  psutil_version=psutil.__version__, actual_provider=\\'unmeasured protocol fixture\\\
        ')\\n    known, connection, tracer, trace_log, f = [], None, None, None, None\\n    listener =\
        \ socket.socket()\\n    try:\\n        class PrivateFixture(Fixture):\\n            def call(self,\
        \ *arguments, **options):\\n                self.env.update({key: str(root / \\'private\\' / key.lower())\
