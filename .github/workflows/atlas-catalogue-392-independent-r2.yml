        \ psutil\\n\\nfrom observe_idle import Fixture, census, identity, save\\n\\n\\ndef bytes_inventory(directory):\\\
        n    return {path.name: dict(sha256=hashlib.sha256(path.read_bytes()).hexdigest(),\\n        \
        \                   value=json.loads(path.read_bytes()))\\n            for path in sorted(directory.glob(\\\
        '*.json\\'))}\\n\\n\\ndef status(f):\\n    return f.ok(\\'--project\\', f.project, \\'status\\\
        ')[\\'atlas\\']\\n\\n\\ndef wait_indexed(f, count, seconds=180):\\n    end = time.monotonic()\
        \ + seconds\\n    rows = []\\n    while True:\\n        answer = status(f)\\n        rows.append(answer)\\\
        n        summary = answer.get(\\'summary\\') or {}\\n        if summary.get(\\'coverage\\', {}).get(\\\
