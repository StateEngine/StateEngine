        \ calls=calls, tracer_exit=code,\\n                scope=\\'separate traced window; no CPU verdict\\\
        ')\\n\\n\\ndef trial(args, arm, serial):\\n    root = args.output / f\\'{serial:02}-{arm}\\'\\\
        n    root.mkdir(mode=0o700)\\n    image = root / (\\'se.exe\\' if os.name == \\'nt\\' else \\\
