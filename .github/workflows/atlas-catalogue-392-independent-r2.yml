        n        result[\\'status_after\\'] = f.ok(\\'--project\\', f.project, \\'status\\')\\n      \
        \  assert identity(pid) == owner\\n    except Exception as error:\\n        result[\\'failure\\\
        '] = f\\'{type(error).__name__}: {error}\\'\\n    finally:\\n        if tracer is not None:\\\
        n            try:\\n                trace_stop(tracer, trace_log, root, 0, time.time())\\n   \
        \         except Exception as error:\\n                result[\\'trace_cleanup_error\\'] = str(error)\\\
        n        if f is not None:\\n            try:\\n                f.close()\\n                result[\\\
        'down_witnessed\\'] = True\\n            except Exception as error:\\n                result[\\\
        'cleanup_error\\'] = str(error)\\n        if connection is not None:\\n            connection.close()\\\
        n        listener.close()\\n        result[\\'outside\\'] = census(root, known)\\n        result[\\\
        'measured\\'] = (\\'after\\' in result and result.get(\\'down_witnessed\\') and\\n           \
        \                   not any(result.get(key) for key in\\n                                    \
        \  [\\'failure\\', \\'cleanup_error\\', \\'trace_cleanup_error\\', \\'outside\\']))\\n       \
        \ save(root / \\'result.json\\', result)\\n    return {key: result.get(key) for key in [\\'arm\\\
        ', \\'measured\\', \\'failure\\', \\'idle\\', \\'fsync\\', \\'outside\\']}\\n\\n\\ndef main():\\\
        n    parser = argparse.ArgumentParser(description=__doc__)\\n    for arm in [\\'base\\', \\'head\\\
        ']:\\n        parser.add_argument(\\'--\\' + arm + \\'-se\\', type=Path, required=True)\\n   \
        \ parser.add_argument(\\'--output\\', type=Path, required=True)\\n    parser.add_argument(\\'--mode\\\
        ', choices=[\\'untraced\\', \\'linux-fsync\\'], default=\\'untraced\\')\\n    parser.add_argument(\\\
        '--seconds\\', type=float, default=60)\\n    parser.add_argument(\\'--warmup\\', type=float, default=30)\\\
        n    parser.add_argument(\\'--rounds\\', type=int, default=3)\\n    parser.add_argument(\\'--arms\\\
        ', nargs=\\'+\\', choices=[\\'base\\', \\'head\\'], default=[\\'base\\', \\'head\\'])\\n    args\
        \ = parser.parse_args()\\n    assert psutil.__version__ == \\'7.1.0\\'\\n    assert args.seconds\
        \ >= 60 and args.warmup >= 10 and args.rounds >= 1\\n    if args.mode == \\'linux-fsync\\':\\\
        n        assert sys.platform == \\'linux\\'\\n    os.umask(0o077)\\n    args.output = args.output.resolve()\\\
        n    args.output.mkdir(parents=True, exist_ok=False, mode=0o700)\\n    for key in list(os.environ):\\\
        n        if key.startswith((\\'SE_\\', \\'STATEENGINE_\\', \\'CODEX\\', \\'CLAUDE\\', \\'OPENAI\\\
        ', \\'ANTHROPIC\\')):\\n            os.environ.pop(key)\\n    # Alternate the leading arm; both\
        \ shipping images run sequentially.\\n    rows = []\\n    for turn in range(args.rounds):\\n \
        \       for arm in ([\\'base\\', \\'head\\'] if turn % 2 == 0 else [\\'head\\', \\'base\\']):\\\
        n            if arm not in args.arms:\\n                continue\\n            rows.append(trial(args,\
        \ arm, len(rows)))\\n            print(json.dumps(rows[-1]), flush=True)\\n    save(args.output\
        \ / \\'summary.json\\', rows)\\n    if not all(row[\\'measured\\'] for row in rows):\\n      \
        \  raise SystemExit(1)\\n\\n\\nif __name__ == \\'__main__\\':\\n    main()\\n'}\nroot=Path('judge')\n\
