        n            connection.sendall(b\\'complete\\\\n\\')\\n            assert control.readline()\
        \ == b\\'completed\\\\n\\'\\n        result[\\'turn_completed\\'] = True\\n        result[\\'native_before\\\
        '] = census(root, known)\\n        time.sleep(args.warmup)\\n        result[\\'status_before\\\
        '] = f.ok(\\'--project\\', f.project, \\'status\\')\\n        result[\\'catalogue_before\\'] =\
        \ catalogue(f.home)\\n        if args.mode == \\'linux-fsync\\':\\n            tracer, trace_log\
        \ = trace_start(pid, root)\\n        result[\\'before\\'] = snapshot(pid)\\n        time.sleep(args.seconds)\\\
        n        result[\\'after\\'] = snapshot(pid)\\n        if tracer is not None:\\n            result[\\\
        'fsync\\'] = trace_stop(tracer, trace_log, root,\\n                                         result[\\\
        'before\\'][\\'unix\\'], result[\\'after\\'][\\'unix\\'])\\n            tracer, trace_log = None,\
        \ None\\n            assert result[\\'fsync\\'][\\'measured\\'], \\'unfinished flush at window\
