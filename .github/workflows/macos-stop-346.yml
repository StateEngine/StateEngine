    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: stop-product-${{ matrix.platform }}
        path: ${{ runner.temp }}/stop-repeat/product
    - name: Install pinned process observer
      run: |
        python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/stop-repeat/requirements.txt"
    - name: Provision disposable installation account
      run: |
        identity="$(id -u)"
        profile="$(python -c 'import os,pwd; print(pwd.getpwuid(os.geteuid()).pw_dir)')"
        sudo python3 scripts/ci/installation_account.py provision --identity "$identity" --profile "$profile"
    - name: Run one isolated saved-turn stop round
      shell: python
      env:
        ROUND: ${{ matrix.round }}
      run: |
        import os,subprocess,sys
        from pathlib import Path
        sys.path.insert(0,str(Path("scripts/ci").resolve()))
        from installation_account import require
        require()
        subprocess.run([sys.executable,"-u",str(Path(os.environ["RUNNER_TEMP"])/"stop-repeat/run-round.py")],check=True)
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: stop-round-${{ matrix.platform }}-${{ matrix.round }}
        path: |-
          ${{ runner.temp }}/stop-repeat/
          !${{ runner.temp }}/stop-repeat/product/
        if-no-files-found: error
        retention-days: 7
