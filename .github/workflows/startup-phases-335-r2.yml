name: Native macOS complete startup phase observation r2
'on':
  push:
    branches:
    - prime/startup-phases-335-r2
permissions:
  contents: read
  actions: read
concurrency:
  group: startup-phases-335-r2-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 65a3b059a7b8ba752b386e63d16f045564e1c1ad
        path: observer
        persist-credentials: false
    - name: Decode and verify bounded observation material
      shell: python
      run: "import ast,base64,hashlib,json,os\nfrom pathlib import Path\nfiles=json.loads('{\"reuse_native.py\": {\"sha256\": \"51baebb85df0d33e4525680e6e088ae3bdc73263f42c68df790e1e2b23ea2d98\", \"base64\": \"\"\
        }, \"observe_phases.py\": {\"sha256\": \"da419d0e54c90578714c9eec232c7a5e7a0d255c38f3d404d6ca145bee5d756f\", \"base64\": \"\"\
        }, \"partition.py\": {\"sha256\": \"511fc58854a1c36dbcb1022f11040b219f9affc8c8a582c98ba88f92bb4c6f2d\", \"base64\": \"\"\
        }, \"source-observation.patch\": {\"sha256\": \"d277057fe73f5940296c2103386d801de9ee0da22e8757f8a0a52551d1985ea5\", \"base64\": \"\"\
        }, \"overlay.json\": {\"sha256\": \"d8bc4f08a36e84fc908c237c0406216a880381f3ed9bd785f5c62156830d6674\", \"base64\": \"\"\
        }}')\nroot=Path(os.environ['RUNNER_TEMP'])/'startup-phase-material'\nroot.mkdir(exist_ok=False)\nfor name,item in files.items():\n data=base64.b64decode(item['base64'],validate=True)\n assert hashlib.sha256(data).hexdigest()==item['sha256']\n if name.endswith('.py'):ast.parse(data)\n (root/name).write_bytes(data)\n"
    - name: Authenticate existing packages and observe complete startup
      shell: python
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'import os,pathlib,subprocess,sys

        path=pathlib.Path(os.environ[''RUNNER_TEMP''])/''startup-phase-material''/''reuse_native.py''

        subprocess.run([sys.executable,''-B'',str(path)],check=True)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: startup-phases-335-r2-macos
        path: ${{ runner.temp }}/startup-phase-evidence
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
