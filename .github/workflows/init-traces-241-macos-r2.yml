name: Calibrated macOS fresh initialization traces
'on':
  push:
    branches:
    - prime/init-traces-241-macos-r2
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Authenticate prior native image and revised external observer
      shell: python
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        import ast,base64,hashlib,io,json,os,stat,subprocess,zipfile
        from pathlib import Path,PurePosixPath
        r=Path(os.environ['RUNNER_TEMP'])/'init241-inputs';r.mkdir()
        files={'observe.c': '', 'calibrate.c': '', 'run.py': ''}
        hashes={'observe.c': '2540db134f4104ef3de470985b4a5d08d1a6376d25b0b28dcd5cdc6a6401450e', 'calibrate.c': '94bf3f9f6bb70656e944436bde8f4ab950b29ea89bf100cd1de1d6c4f89d3325', 'run.py': '238054bc7f392144e74d4ebda82b683bc6e8a01f0da448ea9c8e3bf5cdfdbd5a'}
        for name,encoded in files.items():
            data=base64.b64decode(encoded);assert hashlib.sha256(data).hexdigest()==hashes[name]
            if name.endswith('.py'):ast.parse(data)
            (r/name).write_bytes(data)
        (r/'inputs.json').write_text(json.dumps(hashes,indent=2)+'\n')
        def api(path):return subprocess.check_output(['gh','api','repos/StateEngine/StateEngine/'+path])
        listing=json.loads(api('actions/runs/43768213254/artifacts?per_page=100'))
        artifact=next(x for x in listing['artifacts'] if x['name']=='init241-macos-15-traced-r1')
        raw=api('actions/artifacts/'+str(artifact['id'])+'/zip')
        digest=hashlib.sha256(raw).hexdigest();assert artifact['digest']=='sha256:'+digest
        assert digest=='cc4cf2c9bca18fa65a457d6f0d7b17167597d64324684550ce1c5309c396f8b9'
        contents={};size=0
        with zipfile.ZipFile(io.BytesIO(raw)) as z:
            for item in z.infolist():
                name=item.filename;p=PurePosixPath(name)
                assert not p.is_absolute() and '..' not in p.parts and '\\' not in name and not stat.S_ISLNK(item.external_attr>>16)
                if item.is_dir():continue
                assert name not in contents and item.file_size<128*1024*1024
                size+=item.file_size;assert size<512*1024*1024;contents[name]=z.read(item)
        manifest=json.loads(contents['members.json']);assert set(manifest)==set(contents)-{'members.json'}
        for name,digest in manifest.items():assert hashlib.sha256(contents[name]).hexdigest()==digest,name
        build=json.loads(contents['inputs/build.json'])
        assert build['source']=='7b23fb01a7e16362c6d6b024e5c1801a32bda8c6' and build['exit']==0 and build['target']=='aarch64-apple-darwin'
        assert build['profile']=='distribution' and build['features']==['default','remote']
        assert hashlib.sha256(contents['image']).hexdigest()==build['sha256']=='9da038d1476a69f2e42b21c5d33f4c3e43d7ee02450ddeec99e56b45e087d534'
        (r/'image').write_bytes(contents['image']);(r/'image').chmod(0o700)
        (r/'original-build.json').write_bytes(contents['inputs/build.json'])
        build['image']=str(r/'image');(r/'build.json').write_text(json.dumps(build,indent=2)+'\n')
        (r/'reused-image.json').write_text(json.dumps(dict(run='43768213254',artifact=artifact,authenticated_members=len(manifest),image_sha256=build['sha256']),indent=2)+'\n')
    - name: Calibrate observer then trace thirty fresh public inits
      shell: python
      run: |
        import json,os,subprocess,sys
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'init241-inputs';out=Path(os.environ['RUNNER_TEMP'])/'init241-results';homes=Path(os.environ['RUNNER_TEMP'])/'init241-homes'
        argv=[sys.executable,'-B',str(r/'run.py'),'--image',str(r/'image'),'--out',str(out),'--scratch',str(homes),'--source','7b23fb01a7e16362c6d6b024e5c1801a32bda8c6','--source-tree',os.environ['GITHUB_WORKSPACE'],'--count','30']
        with (r/'consumer.stdout').open('wb') as stdout,(r/'consumer.stderr').open('wb') as stderr:p=subprocess.run(argv,stdout=stdout,stderr=stderr,timeout=600)
        (r/'consumer-exit.json').write_text(json.dumps(dict(exit=p.returncode,argv=argv))+'\n');raise SystemExit(p.returncode)
    - name: Retain every native observation and failure
      if: always()
      shell: python
      run: |
        import hashlib,json,os,shutil
        from pathlib import Path
        base=Path(os.environ['RUNNER_TEMP']);r=base/'init241-inputs';out=base/'init241-retained';out.mkdir();dst=out/'inputs';dst.mkdir()
        for name in ['observe.c','calibrate.c','run.py','inputs.json','original-build.json','build.json','reused-image.json','consumer.stdout','consumer.stderr','consumer-exit.json']:
            p=r/name
            if p.is_file():shutil.copy2(p,dst/name)
        for name in ['image','observe.dylib','calibrate','inert.c']:
            p=r/name
            if p.is_file():shutil.copy2(p,out/name)
        if (base/'init241-results').exists():shutil.copytree(base/'init241-results',out/'results')
        files=[p for p in out.rglob('*') if p.is_file()];assert all(not p.is_symlink() for p in files)
        (out/'members.json').write_text(json.dumps({p.relative_to(out).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files},indent=2)+'\n')
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: init241-macos-traced-r2
        path: ${{ runner.temp }}/init241-retained/
        if-no-files-found: error
        retention-days: 14
