name: Native Windows rendezvous inputs
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  produce:
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: base
            source: 0f47ddb7ef5c30fa39de9b77cbb60d7021737c35
          - arm: head
            source: 7a64f4c44d987a384d073cde39fac3c6f17be022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 481aa7932c2bd6f4df79166702fbff1f057a8f2a
          path: controls
          persist-credentials: false
          sparse-checkout: crates/se/tests/review_runtime_rendezvous
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read the pinned Rust channel
        id: compiler
        shell: python
        run: |
          import os,tomllib
          from pathlib import Path
          channel=tomllib.loads(Path('source/rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: print('channel='+channel,file=out)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          targets: x86_64-pc-windows-msvc
      - name: Select the native C++ compiler
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $where=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $where -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if($LASTEXITCODE -ne 0 -or !$vs){throw 'Native compiler installation not found'}
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          # The developer shell is local to this step; compile the helper here.
          $out=Join-Path $env:RUNNER_TEMP 'rendezvous-inputs'
          $null=New-Item -ItemType Directory -Path $out
          $cpp=(Resolve-Path 'controls/crates/se/tests/review_runtime_rendezvous/windows_pipe_peer.cpp').Path
          & cl.exe /nologo /std:c++17 /EHsc /W4 /WX $cpp "/Fe:$out\windows_pipe_peer.exe" "/Fo:$out\windows_pipe_peer.obj" *> "$out\peer-build.log"
          if($LASTEXITCODE -ne 0){throw 'Native pipe observer compilation failed'}
      - name: Build exact source and authenticate the observer boundary
        shell: python
        env:
          PRODUCT_SOURCE: ${{ matrix.source }}
          ARM: ${{ matrix.arm }}
        run: |
          import ast,hashlib,json,os,shutil,subprocess,time
          from pathlib import Path
          source=Path('source').resolve()
          controls=Path('controls/crates/se/tests/review_runtime_rendezvous').resolve()
          out=Path(os.environ['RUNNER_TEMP'])/'rendezvous-inputs'
          target='x86_64-pc-windows-msvc'
          actual=subprocess.check_output(['git','rev-parse','HEAD'],cwd=source,text=True).strip()
          assert actual==os.environ['PRODUCT_SOURCE'],actual
          host=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip()
          assert host==target,host
          names=['windows_control.py','windows_process.py','windows_peer_smoke.py','windows_pipe_peer.cpp']
          for name in names:
              if name.endswith('.py'):ast.parse((controls/name).read_text())
              shutil.copyfile(controls/name,out/name)
          env=dict(os.environ,CARGO_TARGET_DIR=str(out/'target'),CARGO_INCREMENTAL='0',CARGO_BUILD_JOBS='2',CARGO_PROFILE_DEV_DEBUG='0')
          command=['cargo','build','--locked','--target',target,'-p','se','--bin','se']
          started=time.monotonic_ns()
          with (out/'build.log').open('w') as log:
              result=subprocess.run(command,cwd=source,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=1500)
          metadata={'source':actual,'arm':os.environ['ARM'],'build':command,'exit':result.returncode,
                    'elapsed_ns':time.monotonic_ns()-started,'target':target,
                    'compiler':subprocess.check_output(['rustc','-vV'],text=True),
                    'control_source':'481aa7932c2bd6f4df79166702fbff1f057a8f2a',
                    'controls':{name:hashlib.sha256((out/name).read_bytes()).hexdigest() for name in names}}
          (out/'build.json').write_text(json.dumps(metadata,indent=2)+'\n')
          if result.returncode:raise SystemExit(result.returncode)
          shutil.copyfile(out/'target'/target/'debug/se.exe',out/'se.exe')
          with (out/'help.log').open('w') as log:
              subprocess.run([str(out/'se.exe'),'--help'],stdout=log,stderr=subprocess.STDOUT,check=True,timeout=20)
          with (out/'source-judges.tar').open('wb') as archive:
              subprocess.run(['git','archive','--format=tar',actual,'crates/se/tests/judges'],cwd=source,stdout=archive,check=True)
          with (out/'peer-smoke.stdout').open('w') as log,(out/'peer-smoke.stderr').open('w') as err:
              smoke=subprocess.run(['python','-B',str(out/'windows_peer_smoke.py'),'--peer',str(out/'windows_pipe_peer.exe'),
                                    '--out',str(out/'peer-smoke.json')],stdout=log,stderr=err,timeout=40)
          metadata['peer_smoke_exit']=smoke.returncode
          metadata['image_sha256']=hashlib.sha256((out/'se.exe').read_bytes()).hexdigest()
          metadata['image_bytes']=(out/'se.exe').stat().st_size
          metadata['peer_sha256']=hashlib.sha256((out/'windows_pipe_peer.exe').read_bytes()).hexdigest()
          metadata['source_judges_sha256']=hashlib.sha256((out/'source-judges.tar').read_bytes()).hexdigest()
          metadata['not_exercised']=['Product crash recovery on native Windows','Held-owner public refusal on native Windows']
          (out/'build.json').write_text(json.dumps(metadata,indent=2)+'\n')
          exported=['se.exe','windows_pipe_peer.exe','source-judges.tar','build.json','build.log','help.log','peer-build.log',
                    'peer-smoke.stdout','peer-smoke.stderr',*names]
          if (out/'peer-smoke.json').is_file():exported.append('peer-smoke.json')
          (out/'retained-files.json').write_text(json.dumps({name:hashlib.sha256((out/name).read_bytes()).hexdigest()
                                                           for name in exported},indent=2)+'\n')
          raise SystemExit(smoke.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-rendezvous-${{ matrix.arm }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rendezvous-inputs/*.exe
            ${{ runner.temp }}/rendezvous-inputs/*.py
            ${{ runner.temp }}/rendezvous-inputs/*.cpp
            ${{ runner.temp }}/rendezvous-inputs/*.json
            ${{ runner.temp }}/rendezvous-inputs/*.tar
            ${{ runner.temp }}/rendezvous-inputs/*.log
            ${{ runner.temp }}/rendezvous-inputs/*.stdout
            ${{ runner.temp }}/rendezvous-inputs/*.stderr
