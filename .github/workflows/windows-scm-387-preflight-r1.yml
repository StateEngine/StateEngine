name: PR387 SCM first-native-case feasibility
'on':
  push:
    branches:
    - prime/windows-scm-387-preflight-r1
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 531c31e5b93ee45ef597db525d3a2b5e1a54aca3
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 2836e87c9e251d77cece6385b04b003b5030627f
        path: observer-source
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: windows-public-vm-r3-base
        path: original-base
        run-id: 43724741950
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: windows-public-vm-r3-head
        path: original-head
        run-id: 43724741950
        github-token: ${{ github.token }}
    - name: Authenticate frozen inputs and stage new broker
      shell: python
      run: "import base64,hashlib,json,os,shutil,subprocess,sys,urllib.request\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'pr387-scm-preflight-r1'\n\
        root.mkdir()\nbundle=root/'bundle';bundle.mkdir()\nsmall={'prepare-standard-user.ps1': '',\
        \ 'collect_vm.py': '',\
        \ 'controls/task-entry.ps1': '',\
        \ 'controls/standard-user-bootstrap.ps1': '',\
        \ 'controls/public_windows.py': '',\
        \ 'controls/token_context.py': '',\
        \ 'controls/run-standard-user.py': ''}\n\
        for name,encoded in small.items():\n path=bundle/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(base64.b64decode(encoded))\n\
        (bundle/'manifest.json').write_bytes(base64.b64decode(''))\n\
        for arm in ['base','head']:\n for name in ['se.exe','build.json','build.log']:\n  target=bundle/'images'/arm/name;target.parent.mkdir(parents=True,exist_ok=True)\n\
        \  shutil.copyfile(Path('original-'+arm)/'image'/name,target)\nwith (bundle/'observer.tar').open('wb') as\
        \ archive:\n subprocess.run(['git','archive','--format=tar','HEAD','crates/se/tests/judges','scripts'],cwd='observer-source',stdout=archive,check=True)\n\
        manifest=json.loads((bundle/'manifest.json').read_text())\nassert hashlib.sha256((bundle/'manifest.json').read_bytes()).hexdigest()=='e10877f61320c331079de10829c28787562b930b2f50ba48b8e1c897f803c5f2'\n\
        for name,digest in manifest['files'].items():\n assert hashlib.sha256((bundle/name).read_bytes()).hexdigest()==digest,name\n\
        controls=root/'controls';controls.mkdir()\ncode={'scm-broker.py': '',\
        \ 'service-probe.py': '',\
        \ 'worker-entry.py': '',\
        \ 'token_context.py': ''}\n\
        for name,encoded in code.items():\n raw=base64.b64decode(encoded);compile(raw.decode(),name,'exec');(controls/name).write_bytes(raw)\n\
        wheel={'name': 'pywin32-312-cp312-cp312-win_amd64.whl', 'sha256': 'b457f6d628a47e8a7346ce22acb7e1a46a4a78b52e1d17e1af56871bd19a93bc',\
        \ 'url': 'https://files.pythonhosted.org/packages/03/d9/77040d3b43df3f3be32ea289433d660d2727f5ba327bc73be835127d9d60/pywin32-312-cp312-cp312-win_amd64.whl'}\n\
        raw=urllib.request.urlopen(wheel['url']).read()\nassert hashlib.sha256(raw).hexdigest()==wheel['sha256']\n\
        wheel_path=root/wheel['name'];wheel_path.write_bytes(raw)\nsubprocess.run([sys.executable,'-m','pip','install','--no-user','--no-deps','--no-index',str(wheel_path)],check=True)\n\
        inputs={'scripts':{name:hashlib.sha256((controls/name).read_bytes()).hexdigest() for name in code},'bundle_manifest_sha256':hashlib.sha256((bundle/'manifest.json').read_bytes()).hexdigest(),'dependency':wheel,'native_execution':'pending','scope':'SCM\
        \ broker feasibility only; frozen product and public consumer; actual standard-user token and no-job gate\
        \ preserved'}\n(root/'inputs.json').write_text(json.dumps(inputs,indent=2)+'\\n',encoding='utf-8')\nwith\
        \ open(os.environ['GITHUB_ENV'],'a') as env:env.write('SCM_PROBE_ROOT='+str(root)+'\\n')\n"
    - name: Reach first native public case and require joined closure
      shell: python
      run: 'import os,subprocess,sys

        from pathlib import Path

        root=Path(os.environ[''SCM_PROBE_ROOT''])

        rustc=subprocess.check_output([''rustup'',''which'',''rustc''],text=True).strip()

        result=subprocess.run([sys.executable,''-B'',str(root/''controls/service-probe.py''),''--bundle'',str(root/''bundle''),''--arm'',''head'',''--out'',str(root/''attempt''),''--rustc'',rustc])

        raise SystemExit(result.returncode)

        '
    - name: Retain finite receipts and exact harness inputs
      if: always()
      shell: python
      run: "import hashlib,json,os,shutil\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'pr387-scm-preflight-r1'\n\
        out=root/'retained';out.mkdir(exist_ok=True)\nfor name in ['inputs.json']:\n if (root/name).exists():shutil.copyfile(root/name,out/name)\n\
        if (root/'attempt/export').exists():shutil.copytree(root/'attempt/export',out/'export')\nif (root/'controls').exists():shutil.copytree(root/'controls',out/'controls')\n\
        manifest={p.relative_to(out).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*')\
        \ if p.is_file()}\n(out/'retained-files.json').write_text(json.dumps(manifest,indent=2)+'\\n',encoding='utf-8')\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: windows-scm-387-preflight-r1
        path: ${{ runner.temp }}/pr387-scm-preflight-r1/retained
        if-no-files-found: error
        retention-days: 14
