name: Windows metadata custody comparison
'on':
  workflow_dispatch: {}
  push:
    branches:
    - prime/windows-metadata-custody-r1
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 96e5a23da795a86c4f38e91d5c8462b2002464fc
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: windows-metadata-custody-r1
        cache-on-failure: true
        cache-targets: false
    - name: Compare metadata ancestry custody with every first request
      shell: python
      run: "import os,sys\nsys.argv=['driver','--out',os.path.join(os.environ['RUNNER_TEMP'],'windows-metadata-custody-r1')]\n\"\"\"Merged product comparison with complete finite-worker permit custody.\"\"\"\nimport argparse\nimport base64\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport platform\nimport shutil\nimport statistics\nimport subprocess\nimport time\nimport traceback\n\nPRODUCT = '96e5a23da795a86c4f38e91d5c8462b2002464fc'\nOVERLAY = {'crates/se-host/src/ipc/listener.rs', 'crates/se-host/src/runtime/submit.rs', 'crates/se-host/src/permit_observer.rs', 'crates/se-proc/src/state_files/metadata.rs', 'crates/se-store/src/worker_observer.rs', 'crates/se-host/src/runtime/executor.rs', 'crates/se-host/src/runtime/timings.rs', 'crates/se-store/src/lib.rs', 'crates/se/tests/worker_process_metrics.py', 'crates/se-core/src/ops/outputs/host_phases.rs', 'crates/se-store/src/read_phase_pool.rs', 'crates/se-proc/src/state_files/effects/windows.rs', 'crates/se/tests/eight_writer_worker_measurement.rs', 'crates/se/src/mcp_stdio.rs', 'crates/se-proc/src/worker_observer.rs', 'crates/se-store/src/read/snapshot.rs', 'crates/se-host/src/runtime/admission.rs', 'crates/se-store/src/read_phase.rs', 'crates/se-host/src/runtime/pool.rs', 'crates/se-host/src/lib.rs', 'crates/se-host/src/client/lease.rs', 'crates/se-proc/src/state_files/windows/security.rs', 'crates/se-proc/src/lib.rs', 'crates/se/tests/eight_writer_workers.py'}\nSOURCES = {'base': PRODUCT, 'candidate': 'd4c673c71f55f5712ee4bfbe9f84d118b7ad40eb'}\nORDER = [('base',0),('base',1),('candidate',1),('candidate',0),('candidate',0),('candidate',1),('base',1),('base',0)]\n\nOPS = ['stateengine_msg_send', 'stateengine_working_state_set']\nPHASES = ['admission', 'submission', 'continuation']\n\n\ndef describe(sample):\n    phases = sample['diagnostics']['host_phases']\n    result = {'client_ms': sample['ms'], 'host_ms': phases['admitted_to_encode_us'] / 1000,\n              'completion_ms': phases['completion_wait_us'] / 1000}\n    for phase in PHASES:\n        span = phases[phase]\n        assert span['jobs'] == 1, 'unexpected phase multiplicity'\n        for part in ['queue', 'work', 'resume']:\n            result[phase + '_' + part + '_ms'] = span[part + '_us'] / 1000\n        assert 0 <= span['queue_us'] - span['semaphore_us'] - span['dispatch_us'] <= 1\n        for part in ['semaphore', 'dispatch', 'observer_collect']:\n            result[phase + '_' + part + '_ms'] = span[part + '_us'] / 1000\n        if span.get('detail') is not None:\n            for layer, records in span['detail'].items():\n                assert layer in ['host_native', 'store'] and isinstance(records, dict)\n                for label, values in records.items():\n                    calls, inclusive, exclusive, maximum = values\n                    assert calls > 0 and 0 <= exclusive <= inclusive and 0 <= maximum <= inclusive\n                    assert inclusive <= span['work_us'] * 1000 + 1000, (label, values, span)\n    result['host_other_ms'] = result['host_ms'] - result['completion_ms'] - sum(\n        result[p + '_' + k + '_ms'] for p in PHASES for k in ['queue', 'work', 'resume'])\n    result['bridge_wire_ms'] = result['client_ms'] - result['host_ms']\n    assert result['host_other_ms'] >= -0.01 and result['bridge_wire_ms'] >= -0.01\n    writer = sample['diagnostics']['write_timings']\n    for name in ['queue_ms', 'transaction_ms', 'commit_call_ms']:\n        result['writer_' + name] = writer[name]\n    assert all(math.isfinite(v) for v in result.values())\n    return result\n\n\ndef analyze(report):\n    assert set(report['cohorts']) == {'1', '8'}\n    assert set(report['resources']) == {'1', '8'}\n    seen = set()\n    cohorts = {}\n    for cohort, clients in report['cohorts'].items():\n        assert len(clients) == int(cohort)\n        for client in clients:\n            assert not client.get('error') and not client.get('cleanup_error'), client\n            assert client['verified_events'] == 60\n            assert set(client['samples']) == set(OPS)\n            for samples in client['samples'].values():\n                assert len(samples) == 30\n                for sample in samples:\n                    assert sample['key'] not in seen and sample['event_id']\n                    assert sample['writer']['mode'] == 'host'\n                    seen.add(sample['key'])\n        operations = {}\n        resources = report['resources'][cohort]\n        assert resources['qualified'] is True, resources\n        assert len(resources['snapshots']) == 4\n        for operation in OPS:\n            for client in clients:\n                assert sorted(client['samples'][operation], key=lambda row: row['ms'])[28]['ms'] == client['p95_ms'][operation]\n            worst = max(range(len(clients)), key=lambda i: clients[i]['p95_ms'][operation])\n            exact = sorted(clients[worst]['samples'][operation], key=lambda row: row['ms'])[28]\n            rows = [describe(sample) for client in clients for sample in client['samples'][operation]]\n            resource = resources['phases'][operation]\n            assert resource['writes'] == len(rows) and resource['wall_ms'] > 0\n            assert resource['cpu_ms_total'] >= 0 and resource['ending_working_set_bytes'] > 0\n            operations[operation] = {\n                'count': len(rows), 'worst_client': worst,\n                'worst_client_p95_ms': exact['ms'], 'exact_tail_key': exact['key'],\n                'exact_tail_components': describe(exact),\n                'exact_tail_steps': exact['diagnostics'],\n                'component_means': {key: statistics.mean(row[key] for row in rows) for key in rows[0]},\n                'resources': resource,\n            }\n        cohorts[cohort] = operations\n    assert len(seen) == 540\n    return {'verified_events': len(seen), 'cohorts': cohorts, 'budget_pass': report['pass']}\n\n\ndef digest(path):\n    return hashlib.sha256(Path(path).read_bytes()).hexdigest()\n\n\n\nSOURCE_PARENT = '312ec7511850345aeb3c6f4bd8f7c4ffde2cced2'  # Frozen observer reference.\nSPECIAL = {'crates/se-proc/src/state_files/metadata.rs', 'crates/se-store/src/read_phase_pool.rs'}\n\n\ndef overlay_special(work):\n    path = work / 'crates/se-proc/src/state_files/metadata.rs'\n    raw = path.read_text()\n    marker = '    pub fn metadata(&self) -> Result<Metadata> {\\n'\n    assert raw.count(marker) == 1 and 'native.metadata_pin' not in raw\n    path.write_text(raw.replace(marker, marker + '        let _worker_step = crate::worker_observer::span(\"native.metadata_pin\");\\n'))\n    path = work / 'crates/se-store/src/read_phase_pool.rs'\n    raw = path.read_text()\n    for marker, label in [('    fn state(&self) -> StoreResult<MutexGuard<\\'_, State>> {\\n', 'pool.lock'),\n                          ('    pub fn read_phase(&self) -> StoreResult<ReadPhase> {\\n', 'pool.checkout'),\n                          ('    pub(crate) fn release(self, db: Connection) -> StoreResult<()> {\\n', 'pool.recycle')]:\n        assert raw.count(marker) == 1, (path, marker)\n        raw = raw.replace(marker, marker + '        let _worker_step = crate::worker_observer::span(\"' + label + '\");\\n')\n    marker = 'identity.validate(&reader.path)?;'\n    assert raw.count(marker) == 3\n    raw = raw.replace(marker, 'crate::worker_observer::observe(\"pool.native_identity\", || identity.validate(&reader.path))?;')\n    marker = '        self.identity.validate(&self.pool.0.reader.path)?;'\n    assert raw.count(marker) == 1\n    raw = raw.replace(marker, '        crate::worker_observer::observe(\"pool.recycle_identity\", || self.identity.validate(&self.pool.0.reader.path))?;')\n    path.write_text(raw)\n\n\ndef permit_analysis(custody, raw):\n    assert custody['schema'] == 1 and custody['overflow'] == 0\n    assert custody['pid'] > 0 and int(custody['origin_unix_ns']) > 0\n    jobs = {}\n    for row in custody['rows']:\n        identity = row['identity']\n        job = jobs.setdefault(identity['job'], {'identity': identity})\n        assert row['event'] not in job\n        job[row['event']] = row\n    for job in jobs.values():\n        assert 'acquired' in job and 'released' in job, 'unclosed permit or missing acquisition'\n        acquired = job['acquired']['ns']\n        released = job['released']\n        assert acquired <= released['release_begin_ns'] <= released['release_end_ns']\n        if 'entered' in job:\n            assert acquired <= job['entered']['identity']['entered_ns'] <= released['release_begin_ns']\n    # Definite ownership is [acquired, release_begin]; actual release is inside\n    # its retained bracket. Never invent a total ordering within those brackets.\n    pools = {}\n    for job in jobs.values():\n        events = pools.setdefault(job['identity']['pool'], [])\n        events += [(job['acquired']['ns'], 1), (job['released']['release_begin_ns'], -1)]\n    maximum = {}\n    for pool, events in pools.items():\n        active = peak = 0\n        for _, delta in sorted(events):\n            active += delta\n            assert 0 <= active <= 2, 'finite shared capacity exceeded'\n            peak = max(peak, active)\n        assert active == 0\n        maximum[str(pool)] = peak\n    samples = []\n    reverse = {}\n    for cohort, clients in raw['cohorts'].items():\n        for client, report in enumerate(clients):\n            for operation, values in report['samples'].items():\n                assert len(values) == 30  # First requests count; no warm-up deletion.\n                for index, sample in enumerate(values):\n                    record = {'key': sample['key'], 'cohort': cohort, 'client': client,\n                              'sample': index, 'operation': operation, 'ms': sample['ms'], 'phases': {}}\n                    for phase in PHASES:\n                        marker = sample['diagnostics']['host_phases'][phase]['permit']\n                        job = jobs[marker['job']]\n                        assert marker['pool'] == job['identity']['pool']\n                        assert marker['worker'] == job['entered']['identity']['worker']\n                        assert marker['queued_ns'] <= marker['acquired_ns'] <= marker['entered_ns'] <= marker['finished_ns'] <= job['released']['release_begin_ns']\n                        assert marker['job'] not in reverse\n                        reverse[marker['job']] = {k: v for k, v in record.items() if k != 'phases'} | {'phase': phase}\n                        record['phases'][phase] = dict(marker,\n                            release_begin_ns=job['released']['release_begin_ns'],\n                            release_end_ns=job['released']['release_end_ns'])\n                    samples.append(record)\n    for sample in samples:\n        for phase in sample['phases'].values():\n            blockers = []\n            for number, job in jobs.items():\n                if number == phase['job'] or job['identity']['pool'] != phase['pool']:\n                    continue\n                begin = max(phase['queued_ns'], job['acquired']['ns'])\n                end = min(phase['acquired_ns'], job['released']['release_end_ns'])\n                if begin < end:\n                    blockers.append({'job': number, 'overlap_upper_ns': end - begin,\n                                     'owner': reverse.get(number, {'class': job['identity']['class']}),\n                                     'worker': job.get('entered', {}).get('identity', {}).get('worker'),\n                                     'acquired_ns': job['acquired']['ns'],\n                                     'release_begin_ns': job['released']['release_begin_ns'],\n                                     'release_end_ns': job['released']['release_end_ns']})\n            phase['blockers'] = sorted(blockers, key=lambda v: v['overlap_upper_ns'], reverse=True)\n    return {'qualified': True, 'jobs': len(jobs), 'unclosed': 0, 'overflow': 0,\n            'maximum_definite_occupancy': maximum, 'matched_request_phases': len(reverse),\n            'samples': samples, 'scope': 'Every finite-work slot acquisition, including IPC peer and background work; shutdown acquire-many fencing is outside request execution. UTC anchor plus shared monotonic offsets; release brackets remain explicit. Logging is identical in tracing off/on and adds observer overhead in both.'}\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--out', required=True)\n    args = parser.parse_args()\n    checkout = Path.cwd().resolve()\n    root = Path(args.out).resolve()\n    root.mkdir(parents=True, exist_ok=False)\n    summary = {'qualified': False, 'product': PRODUCT, 'sources': SOURCES, 'observer_parent': SOURCE_PARENT,\n        'order': ORDER, 'rows': [],\n        'scope': 'Same Windows runner/two workers, pinned main parent versus only metadata ancestry custody optimization. Trace off/on controls repeated in balanced order. Synthetic active sessions, public kept-open MCP; no provider hooks, mixed FULL or loaded maintenance qualification.',\n        'accounting': 'Host serial phases add; writer timing overlaps completion. Host/native and store layers overlap. Off/on controls measure instrumentation overhead separately for each source. Resource snapshots are outside requests; boundary working sets and lifetime peaks are not interval peaks.',\n        'decision': 'Retain every first request and join each wait to complete permit holder intervals; Product metadata custody optimization; all six validation checkpoints remain.'}\n    def save():\n        (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\\n', encoding='utf-8')\n    try:\n        assert os.name == 'nt', 'native Windows only'\n        observer = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\n        assert len(SOURCES['candidate']) == 40 and all(c in '0123456789abcdef' for c in SOURCES['candidate'])\n        assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],text=True)\n        subprocess.run(['git','cat-file','-e',SOURCES['candidate']+'^{commit}'],check=True)\n        subprocess.run(['git','merge-base','--is-ancestor',PRODUCT,SOURCES['candidate']],check=True)\n        metadata = subprocess.check_output(['git','show',SOURCES['candidate']+':crates/se-proc/src/state_files/metadata.rs'],text=True)\n        pool = subprocess.check_output(['git','show',SOURCES['candidate']+':crates/se-store/src/read_phase_pool.rs'],text=True)\n        assert 'One protected handle supplies both facts.' in metadata, 'PR394 missing from candidate'\n        assert 'A cold open crosses native I/O' in pool, 'PR401 missing from candidate'\n        common = base64.b64decode('')\n\
        \        assert hashlib.sha256(common).hexdigest() == '3b8726a10074d304617662a94e46b4274eb46ce8f86b4ea915e0cfdc4249394a'\n        (root/'observer-common.patch').write_bytes(common)\n        (root/'product-bundle.diff').write_bytes(subprocess.check_output(['git','diff',SOURCES['base'],SOURCES['candidate']]))\n        inputs = {'product': PRODUCT, 'sources': SOURCES, 'observer_parent': SOURCE_PARENT,\n            'observer':observer,'overlay_sha256':hashlib.sha256(common).hexdigest(),'publication':os.environ.get('GITHUB_SHA'),'run':os.environ.get('GITHUB_RUN_ID'),\n            'attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'platform':platform.platform(),\n            'cpu_count':os.cpu_count(),'compiler':subprocess.check_output(['rustc','-vV'],text=True),\n            'files':{}}\n        (root/'inputs.json').write_text(json.dumps(inputs,indent=2)+'\\n')\n        lanes = {}\n        for arm, source in SOURCES.items():\n            work = Path(os.environ['RUNNER_TEMP']) / ('worker-metadata-custody-source-'+arm)\n            subprocess.run(['git','worktree','add','--detach',str(work),source],check=True)\n            subprocess.run(['git','apply','--3way',str(root/'observer-common.patch')],cwd=work,check=True)\n            overlay_special(work)\n            changed = set(subprocess.check_output(['git','diff','HEAD','--name-only'],cwd=work,text=True).splitlines())\n            assert changed == OVERLAY, changed ^ OVERLAY\n            (root/(arm+'-observation-only.diff')).write_bytes(subprocess.check_output(['git','diff','HEAD'],cwd=work))\n            inputs['files'][arm] = {p:digest(work/p) for p in sorted(OVERLAY)}\n            (root/'inputs.json').write_text(json.dumps(inputs,indent=2)+'\\n')\n            env = dict(os.environ, CARGO_TARGET_DIR=str(work/'target'))\n            for key in ['SE_MEASURE_MIXED','SE_MEASURE_COHORT','SE_OBSERVE_BLOCKING_JOBS','SE_OBSERVE_WORKER_STEPS','SE_OBSERVE_BRIDGE_STEPS']:\n                env.pop(key,None)\n            build = ['cargo','test','--target','x86_64-pc-windows-msvc','--release','--all-features','--locked','-p','se','--test','eight_writer_worker_measurement','--no-run','--message-format=json']\n            with (root/(arm+'-build.jsonl')).open('wb') as out, (root/(arm+'-build.stderr')).open('wb') as err:\n                done=subprocess.run(build,cwd=work,env=env,stdout=out,stderr=err,timeout=2700)\n            (root/(arm+'-build-command.json')).write_text(json.dumps({'argv':build,'exit':done.returncode})+'\\n')\n            assert done.returncode == 0, arm+' did not compile; no latency verdict'\n            artifacts=[json.loads(line) for line in (root/(arm+'-build.jsonl')).read_text().splitlines()]\n            executables=[r['executable'] for r in artifacts if r.get('reason')=='compiler-artifact' and r.get('target',{}).get('name')=='eight_writer_worker_measurement' and r.get('profile',{}).get('test') is True and r.get('executable')]\n            assert len(executables)==1, 'ambiguous executable'\n            executable=Path(executables[0]); shipping=work/'target/x86_64-pc-windows-msvc/release/se.exe'\n            binaries={'observer':{'path':str(executable),'sha256':digest(executable)},'shipping':{'path':str(shipping),'sha256':digest(shipping)}}\n            (root/(arm+'-binaries.json')).write_text(json.dumps(binaries,indent=2)+'\\n')\n            lanes[arm]=(work,env,executable,shipping,binaries)\n        for index,(arm,tracing) in enumerate(ORDER):\n            work,env,executable,shipping,binaries=lanes[arm]\n            dest=root/f'{index+1:02d}-{arm}-tracing-{tracing}'\n            dest.mkdir()\n            row={'index':index+1,'arm':arm,'observer':SOURCES[arm],'workers':2,'tracing':bool(tracing),'qualified':False}\n            summary['rows'].append(row)\n            try:\n                assert digest(executable)==binaries['observer']['sha256']\n                assert digest(shipping)==binaries['shipping']['sha256']\n                assert not (work/'target/judge-diagnostics').exists(), 'stale diagnostics remain'\n                assert {p:digest(work/p) for p in sorted(OVERLAY)} == inputs['files'][arm], 'observer source drift'\n                runenv=dict(env,SE_OBSERVE_BLOCKING_JOBS='2',SE_OBSERVE_WORKER_STEPS=str(tracing),SE_OBSERVE_BRIDGE_STEPS=str(tracing))\n                command=[str(executable),'--nocapture']; started=time.monotonic_ns()\n                with (dest/'stdout.log').open('wb') as out,(dest/'stderr.log').open('wb') as err:\n                    process=subprocess.run(command,cwd=work,stdout=out,stderr=err,env=runenv,timeout=300)\n                row['command']={'argv':command,'exit':process.returncode,'elapsed_ns':time.monotonic_ns()-started}\n                diagnostics=work/'target/judge-diagnostics'\n                if diagnostics.is_dir(): shutil.move(str(diagnostics),str(dest/'diagnostics'))\n                assert process.returncode==0, 'writes/readback/closure failed'\n                settings=json.loads((dest/'diagnostics/worker-settings.json').read_text())\n                assert settings['requested']==settings['effective']==settings['runtime_thread_cap']==2\n                assert settings['native_cpus']>=4\n                assert settings['worker_steps']==settings['bridge_steps']==bool(tracing)\n                shutdown=json.loads((dest/'diagnostics/shutdown.json').read_text())\n                assert shutdown['transport_closed'] and shutdown['endpoint_retired']\n                assert shutdown['pending']==[] and shutdown['errors']==[]\n                raw=json.loads((dest/'diagnostics/mcp-writers.json').read_text())\n                row['measurement']=analyze(raw)\n                custody=json.loads((dest/'diagnostics/permit-custody.json').read_text())\n                joined=permit_analysis(custody,raw)\n                (dest/'permit-joins.json').write_text(json.dumps(joined,indent=2)+'\\n')\n                row['permit_jobs']=joined['jobs']\n                row['latency_pass']=raw['pass']\n                for cohort in raw['cohorts'].values():\n                    for client in cohort:\n                        for samples in client['samples'].values():\n                            for sample in samples:\n                                diag=sample['diagnostics']\n                                assert ('bridge_steps' in diag)==bool(tracing)\n                                for phase in PHASES: assert ('detail' in diag['host_phases'][phase])==bool(tracing)\n                row['qualified']=True\n            except Exception as error:\n                row.update(error=repr(error),traceback=traceback.format_exc())\n                if isinstance(error,subprocess.TimeoutExpired):\n                    summary['cleanup_unknown']=True\n                    raise\n            finally: save()\n        summary['qualified']=len(summary['rows'])==len(ORDER) and all(r['qualified'] for r in summary['rows'])\n        assert summary['qualified'], 'one or more observations unqualified'\n    except Exception as error:\n        summary.update(error=repr(error),traceback=traceback.format_exc())\n        summary['cleanup_unknown']=summary.get('cleanup_unknown',False) or isinstance(error,subprocess.TimeoutExpired)\n    finally:\n        save()\n        files={p.relative_to(root).as_posix():{'bytes':p.stat().st_size,'sha256':digest(p)} for p in sorted(root.rglob('*')) if p.is_file()}\n        (root/'manifest.json').write_text(json.dumps({'files':files},indent=2)+'\\n',encoding='utf-8')\n    return 0 if summary['qualified'] else 1\n\nif __name__=='__main__':\n    raise SystemExit(main())\n"
    - name: Retain complete measurements and inputs
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-metadata-custody-r1
        path: ${{ runner.temp }}/windows-metadata-custody-r1
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: error
