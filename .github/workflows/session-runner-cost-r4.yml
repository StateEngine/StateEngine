name: Session runner author cost r4
on:
  workflow_dispatch:
  push:
    branches: [prime/session-runner-cost-r4]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: session-runner-cost-r4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-cost:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PRODUCER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PRODUCER_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 21f38de3f365a234f42040cf78e92d629d420daf
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Install isolated observer dependency
        run: python -m pip install psutil==7.0.0
      - name: Restore sealed measurement sources
        shell: python
        run: |
          import base64,hashlib,json
          from pathlib import Path
          root=Path('.runner-cost')
          root.mkdir(exist_ok=True)
          payload={'runner_cost.rs': '', 'provider.rs': '', 'measure.py': '', 'produce.py': ''}
          expected={'runner_cost.rs': '9684640ebacab2703591fa2756a72a3a2ca3d73eb300d445829934bd73c0e4bb', 'provider.rs': '7e16cd99d89decc10200136829f2f6c8817d078040b19af178c1e03c048afbb1', 'measure.py': '17d423756ccec1bf4d71c15d6c060224fec284258983f195fd8a3d6e1e5c2c5a', 'produce.py': '5e89bbdd7eba559b4d31ca016599c9ed507efe7af1fb5b51f59b3cb4204847ee'}
          for name,encoded in payload.items():
              data=base64.b64decode(encoded,validate=True)
              if hashlib.sha256(data).hexdigest()!=expected[name]: raise RuntimeError('input digest mismatch')
              (root/name).write_bytes(data)
      - name: Build shipping image and observe author costs
        run: python -B .runner-cost/produce.py
      - name: Retain complete native evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-runner-cost-r4-${{ matrix.os }}
          path: runner-cost-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
