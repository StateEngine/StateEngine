name: Atlas exact shipping SQL statement allocation replay
'on':
- push
- workflow_dispatch
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        source:
        - 87b530ae04cf2ce0b1d60f21c3da832fb356d41e
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: 'import os,tomllib

        from pathlib import Path

        channel=tomllib.loads(Path(''rust-toolchain.toml'').read_text())[''toolchain''][''channel'']

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as out: print(''channel=''+channel,file=out)

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Measure native twin and candidate smaller source envelopes
      shell: python
      run: "FILES={'main.rs': '//! Author development adaptation of the independent component observer; not admission proof.\\nmod measure;\\nmod parse;\\nmod sql_replay;\\nmod sql;\\nmod sql_trace;\\nuse se_atlas::{model::*, scope::Scope};\\nuse se_types::ProjectId;\\nuse std::{\\n    error::Error,\\n    path::{Path, PathBuf},\\n    time::{Duration, Instant},\\n};\\ntype Result<T> = std::result::Result<T, Box<dyn Error>>;\\nfn until() -> Instant {\\n    Instant::now() + Duration::from_secs(20)\\n}\\nfn scope(root: &Path) -> Result<Scope> {\\n    let source = root.join(\"source\");\\n    std::fs::create_dir(&source)?;\\n    let native = se_proc::NativeSourceRoot::open(&source)?;\\n    Ok(Scope::new(\\n        RootRegistration {\\n            project: ProjectId::from_parts(1, [7; 10])?,\\n            root: RootId::from_parts(1, [8; 10])?,\\n            canonical_source_root: source,\\n            cache: CacheLocation {\\n                directory: root\\n                    .join(\"cache\")\\n                    .join(ProjectId::from_parts(1, [7; 10])?.as_str())\\n                    .join(RootId::from_parts(1, [8; 10])?.as_str()),\\n            },\\n            git_metadata: None,\\n        },\\n        native.physical_identity()?,\\n    )?)\\n}\\nfn main() -> Result<()> {\\n    let args: Vec<_> = std::env::args().collect();\\n    let root = PathBuf::from(args.get(1).ok_or(\"private fixture directory required\")?);\\n    std::fs::create_dir(&root)?;\\n    use std::os::unix::fs::PermissionsExt;\\n    std::fs::set_permissions(&root, std::fs::Permissions::from_mode(0o700))?;\\n    se_proc::initialize_file_creation_owner()?;\\n    measure::install();\\n    let scope = scope(&root)?;\\n    let report = if args.get(2).map(String::as_str) == Some(\"sql\") {\\n        sql::run(scope, &root)?\\n    } else {\\n        parse::run(\\n            scope,\\n            args.get(2).ok_or(\"grammar required\")?,\\n            args.get(3).ok_or(\"pattern required\")?,\\n        )?\\n    };\\n    println!(\"{}\", serde_json::to_string(&report)?);\\n    std::fs::remove_dir_all(&root)?;\\n    Ok(())\\n}\\n', 'measure.rs': '//! Native allocator observations retain the platform allocator and its size rounding.\\nuse std::{\\n    alloc::{GlobalAlloc, Layout, System},\\n    ffi::c_void,\\n    sync::atomic::{AtomicUsize, Ordering},\\n};\\nstatic LIVE: AtomicUsize = AtomicUsize::new(0);\\nstatic PEAK: AtomicUsize = AtomicUsize::new(0);\\nfn add(bytes: usize) {\\n    let now = LIVE.fetch_add(bytes, Ordering::SeqCst) + bytes;\\n    PEAK.fetch_max(now, Ordering::SeqCst);\\n}\\nfn sub(bytes: usize) {\\n    LIVE.fetch_sub(bytes, Ordering::SeqCst);\\n}\\nunsafe fn size(pointer: *mut c_void) -> usize {\\n    if pointer.is_null() {\\n        0\\n    } else {\\n        {\\n            #[cfg(target_os=\"macos\")] {unsafe { libc::malloc_size(pointer) }}\\n            #[cfg(target_os=\"linux\")] {unsafe { libc::malloc_usable_size(pointer) }}\\n        }\\n    }\\n}\\nstruct Observed;\\n#[global_allocator]\\nstatic ALLOCATOR: Observed = Observed;\\nunsafe impl GlobalAlloc for Observed {\\n    unsafe fn alloc(&self, layout: Layout) -> *mut u8 {\\n        let p = unsafe { System.alloc(layout) };\\n        add(unsafe { size(p.cast()) });\\n        p\\n    }\\n    unsafe fn alloc_zeroed(&self, layout: Layout) -> *mut u8 {\\n        let p = unsafe { System.alloc_zeroed(layout) };\\n        add(unsafe { size(p.cast()) });\\n        p\\n    }\\n    unsafe fn dealloc(&self, pointer: *mut u8, layout: Layout) {\\n        sub(unsafe { size(pointer.cast()) });\\n        unsafe { System.dealloc(pointer, layout) };\\n    }\\n    unsafe fn realloc(&self, pointer: *mut u8, layout: Layout, bytes: usize) -> *mut u8 {\\n        let old = unsafe { size(pointer.cast()) };\\n        let next = unsafe { System.realloc(pointer, layout, bytes) };\\n        if !next.is_null() {\\n            sub(old);\\n            add(unsafe { size(next.cast()) });\\n        }\\n        next\\n    }\\n}\\nunsafe extern \"C\" fn tree_alloc(bytes: usize) -> *mut c_void {\\n    let p = unsafe { libc::malloc(bytes) };\\n    add(unsafe { size(p) });\\n    p\\n}\\nunsafe extern \"C\" fn tree_zero(count: usize, bytes: usize) -> *mut c_void {\\n    let p = unsafe { libc::calloc(count, bytes) };\\n    add(unsafe { size(p) });\\n    p\\n}\\nunsafe extern \"C\" fn tree_realloc(pointer: *mut c_void, bytes: usize) -> *mut c_void {\\n    let old = unsafe { size(pointer) };\\n    let next = unsafe { libc::realloc(pointer, bytes) };\\n    if !next.is_null() || bytes == 0 {\\n        sub(old);\\n        add(unsafe { size(next) });\\n    }\\n    next\\n}\\nunsafe extern \"C\" fn tree_free(pointer: *mut c_void) {\\n    sub(unsafe { size(pointer) });\\n    unsafe { libc::free(pointer) };\\n}\\npub fn install() {\\n    unsafe {\\n        tree_sitter::set_allocator(\\n            Some(tree_alloc),\\n            Some(tree_zero),\\n            Some(tree_realloc),\\n            Some(tree_free),\\n        )\\n    };\\n}\\npub fn reset() -> usize {\\n    let live = LIVE.load(Ordering::SeqCst);\\n    PEAK.store(live, Ordering::SeqCst);\\n    live\\n}\\npub fn peak() -> usize {\\n    PEAK.load(Ordering::SeqCst)\\n}\\npub fn zone() -> serde_json::Value {\\n    #[cfg(target_os=\"macos\")] {\\n        let mut stats:libc::malloc_statistics_t=unsafe{std::mem::zeroed()};\\n        unsafe{libc::malloc_zone_statistics(std::ptr::null_mut(),&mut stats)};\\n        serde_json::json!({\"in_use\":stats.size_in_use,\"touched_high_water\":stats.max_size_in_use,\"reserved\":stats.size_allocated})\\n    }\\n    #[cfg(target_os=\"linux\")] {serde_json::json!({\"state\":\"not measured\",\"reason\":\"macOS all-zone API unavailable; native-sized live Rust/tree allocations retained\"})}\\n}\\n', 'parse.rs': 'use crate::{Result, measure};\\nuse se_atlas::{\\n    lifecycle::*,\\n    model::*,\\n    parse::{ParserPlacement, ParserProfile, SemanticParser},\\n    scope::Scope,\\n};\\nuse se_host::atlas_source::NativeAtlasSource;\\nuse se_types::code::AtlasText;\\nuse std::{\\n    fs,\\n    time::{Duration, Instant},\\n};\\nfn line(language: Language, pattern: &str, index: usize) -> String {\\n    match pattern {\\n        \"definitions\" => match language {\\n            Language::Rust => {\\n                format!(\"pub fn value_{index}(x: u64) -> u64 {{ x.wrapping_add(2) }}\\\\n\")\\n            }\\n            Language::Python => format!(\"def value_{index}(x):\\\\n return x + 2\\\\n\"),\\n            Language::JavaScript => {\\n                format!(\"export function value_{index}(x) {{ return x + 2; }}\\\\n\")\\n            }\\n            Language::Jsx => format!(\"export const value_{index} = (x) => <span>{{x}}</span>;\\\\n\"),\\n            Language::TypeScript => {\\n                format!(\"export function value_{index}(x:number):number {{ return x + 2; }}\\\\n\")\\n            }\\n            Language::Tsx => {\\n                format!(\"export const value_{index} = (x:number) => <span>{{x}}</span>;\\\\n\")\\n            }\\n        },\\n        \"references\" => {\\n            if language == Language::Rust {\\n                \"fn f(){a();a();a();a();a();a();a();a();}\\\\n\".into()\\n            } else {\\n                \"a;a;a;a;a;a;a;a;a;a;a;a;a;a;a;a;\\\\n\".into()\\n            }\\n        }\\n        \"comments\" => {\\n            if language == Language::Python {\\n                \"# allocator observation only\\\\n\".into()\\n            } else {\\n                \"/* allocator observation only */\\\\n\".into()\\n            }\\n        }\\n        \"malformed\" => \"((({[[[ bad_token = ;\\\\n\".into(),\\n        \"nesting\" => \"((((((((((((((((((((((((((((((((\".into(),\\n        _ => panic!(\"unknown input pattern\"),\\n    }\\n}\\npub fn run(scope: Scope, language: &str, pattern: &str) -> Result<serde_json::Value> {\\n    let (language, extension) = match language {\\n        \"rust\" => (Language::Rust, \"rs\"),\\n        \"python\" => (Language::Python, \"py\"),\\n        \"javascript\" => (Language::JavaScript, \"js\"),\\n        \"jsx\" => (Language::Jsx, \"jsx\"),\\n        \"typescript\" => (Language::TypeScript, \"ts\"),\\n        \"tsx\" => (Language::Tsx, \"tsx\"),\\n        _ => return Err(\"unknown grammar\".into()),\\n    };\\n    let source_bytes: usize=std::env::var(\"MEASURE_SOURCE_BYTES\")?.parse()?;\\n    let source_limit=u32::try_from(source_bytes)?;\\n    let row_limit:u32=std::env::var(\"MEASURE_ROWS\")?.parse()?;\\n    let path = RelativePath::new(format!(\"input.{extension}\"))?;\\n    let mut source = String::with_capacity(source_bytes);\\n    for index in 0..source_bytes {\\n        let next = line(language, pattern, index);\\n        if source.len() + next.len() > source_bytes {\\n            break;\\n        }\\n        source.push_str(&next);\\n    }\\n    while source.len() < source_bytes {\\n        source.push(\\'\\\\n\\');\\n    }\\n    fs::write(\\n        scope.registration.canonical_source_root.join(path.as_str()),\\n        source.as_bytes(),\\n    )?;\\n    drop(source);\\n    let native = NativeAtlasSource::open(scope.registration.clone(), CaseMode::Sensitive)?;\\n    let profile = ParserProfile::from_qualified_measurement(\\n        language,\\n        ParserPlacement::Incremental,\\n        source_limit,\\n        row_limit,\\n        8_000_000,\\n        3_000_000,\\n    )?;\\n    let mut parser = SemanticParser::new(scope, vec![profile])?;\\n    let budget = ParseBudget {\\n        max_source_bytes: source_limit,\\n        max_rows: row_limit,\\n        max_work: Duration::from_millis(200),\\n        max_steps: MAX_PARSE_STEPS,\\n        reserved_bytes: 11_000_000+source_limit,\\n    };\\n    let zone_before = measure::zone();\\n    let physical_before = se_proc::atlas_worker::memory_usage()?;\\n    let base = measure::reset();\\n    let SourceRead::Bytes(snapshot) = native.read(&path, budget)? else {\\n        return Err(\"native source did not return bytes\".into());\\n    };\\n    let started = Instant::now();\\n    let result = parser.parse(&snapshot, language, budget);\\n    let elapsed_us = started.elapsed().as_micros();\\n    let peak = measure::peak().saturating_sub(base);\\n    let zone_after = measure::zone();\\n    let physical_after = se_proc::atlas_worker::memory_usage()?;\\n    let outcome = match &result {\\n        Ok(value) => {\\n            serde_json::json!({\"coverage\": format!(\"{:?}\", value.coverage), \"symbols\": value.symbols.len(), \"references\": value.references.len(), \"imports\": value.imports.len(), \"scopes\": value.scopes.len()})\\n        }\\n        Err(error) => serde_json::json!({\"error\": error.body}),\\n    };\\n    drop(result);\\n    drop(snapshot);\\n    drop(parser);\\n    drop(native);\\n    let zone_closed = measure::zone();\\n    Ok(\\n        serde_json::json!({\"grammar\":format!(\"{language:?}\"),\"pattern\":pattern,\"source_bytes\":source_bytes,\"row_allowance\":row_limit,\"elapsed_us\":elapsed_us,\\n        \"combined_native_sized_rust_tree_peak_increment\":peak,\"zone_before\":zone_before,\"zone_after\":zone_after,\"zone_closed\":zone_closed,\\n        \"physical_peak_before\":physical_before,\"physical_peak_after\":physical_after,\"reservation_bytes\":11_000_000+source_limit,\"work_step_limit\":MAX_PARSE_STEPS,\"outcome\":outcome}),\\n    )\\n}\\n', 'sql.rs': 'use crate::{Result, measure, until};\\nuse se_atlas::{\\n    cache::{connection::*, pointer, *},\\n    model::*,\\n    scope::Scope,\\n};\\nuse se_host::atlas_cache::NativeAtlasCache;\\nuse se_types::code::AtlasText;\\nuse serde_json::{Value, json};\\nuse std::{\\n    ffi::c_int,\\n    path::Path,\\n    sync::atomic::{AtomicPtr, Ordering},\\n};\\nstatic LAST: AtomicPtr<rusqlite::ffi::sqlite3> = AtomicPtr::new(std::ptr::null_mut());\\nunsafe extern \"C\" fn opened(\\n    db: *mut rusqlite::ffi::sqlite3,\\n    _: *mut *mut libc::c_char,\\n    _: *const rusqlite::ffi::sqlite3_api_routines,\\n) -> c_int {\\n    LAST.store(db, Ordering::Release);\\n    rusqlite::ffi::SQLITE_OK\\n}\\nfn sql_memory(reset: bool) -> Result<(i64, i64)> {\\n    let (mut current, mut peak) = (0, 0);\\n    let code = unsafe {\\n        rusqlite::ffi::sqlite3_status64(\\n            rusqlite::ffi::SQLITE_STATUS_MEMORY_USED,\\n            &mut current,\\n            &mut peak,\\n            i32::from(reset),\\n        )\\n    };\\n    if code != 0 {\\n        return Err(format!(\"native SQLite memory counter failed: {code}\").into());\\n    }\\n    Ok((current, peak))\\n}\\nfn connection_memory(db: *mut rusqlite::ffi::sqlite3) -> Result<Value> {\\n    if db.is_null() {\\n        return Err(\"native SQL handle absent\".into());\\n    }\\n    let mut counters = serde_json::Map::new();\\n    for (name, operation) in [\\n        (\"cache\", rusqlite::ffi::SQLITE_DBSTATUS_CACHE_USED),\\n        (\"schema\", rusqlite::ffi::SQLITE_DBSTATUS_SCHEMA_USED),\\n        (\"statements\", rusqlite::ffi::SQLITE_DBSTATUS_STMT_USED),\\n    ] {\\n        let (mut current, mut peak) = (0, 0);\\n        let code =\\n            unsafe { rusqlite::ffi::sqlite3_db_status(db, operation, &mut current, &mut peak, 0) };\\n        if code != 0 {\\n            return Err(format!(\"native SQL counter failed: {code}\").into());\\n        }\\n        counters.insert(name.into(), json!(current));\\n    }\\n    Ok(Value::Object(counters))\\n}\\nfn error(value: impl std::fmt::Display) -> se_types::SeError {\\n    se_types::SeError::invalid(\"native SQL admission measurement\", &value.to_string())\\n}\\nfn scan(connection: &mut CacheConnection<\\'_>, ordered: bool) -> Result<u64> {\\n    Ok(connection.read(until(), |sql| {\\n        let mut statement = sql.prepare(if ordered {\\n            \"SELECT text FROM names ORDER BY length(text),text\"\\n        } else {\\n            \"SELECT text FROM names ORDER BY id\"\\n        })?;\\n        let mut rows = statement.query([]).map_err(error)?;\\n        let mut bytes = 0;\\n        while let Some(row) = rows.next().map_err(error)? {\\n            bytes += row\\n                .get_ref(0)\\n                .map_err(error)?\\n                .as_str()\\n                .map_err(error)?\\n                .len() as u64;\\n        }\\n        Ok(bytes)\\n    })?)\\n}\\nfn sample(label: &str, handles: &[*mut rusqlite::ffi::sqlite3]) -> Result<Value> {\\n    let (current, peak) = sql_memory(false)?;\\n    Ok(\\n        json!({\"phase\":label,\"sqlite_current\":current,\"sqlite_high_water\":peak,\\n        \"handles\":handles.iter().map(|handle| connection_memory(*handle)).collect::<Result<Vec<_>>>()?,\\n        \"zone\":measure::zone(),\"physical_peak\":se_proc::atlas_worker::memory_usage()?}),\\n    )\\n}\\npub fn run(scope: Scope, root: &Path) -> Result<Value> {\\n    let code = unsafe { rusqlite::ffi::sqlite3_auto_extension(Some(opened)) };\\n    if code != 0 {\\n        return Err(format!(\"native SQL handle observer refused: {code}\").into());\\n    }\\n    let cache = NativeAtlasCache::create(&root.join(\"cache\"), scope.clone())?;\\n    let consumer = std::env::var_os(\"MEASURE_PUBLIC_QUERY\").is_some();\\n    let seed_batches: i32 = std::env::var(\"MEASURE_SEED_BATCHES\")?.parse()?;\\n    let coverage = serde_json::from_value(\\n        json!({\"discovered_files\":if consumer {seed_batches*512}else{0},\"indexed_files\":if consumer {seed_batches*512}else{0},\"partial_files\":0,\"deferred_files\":0,\"failed_files\":0,\"discovery_complete\":true,\"stale_files\":0,\"resolved_references\":0,\"name_only_references\":0,\"watched_directories\":0,\"unwatched_directories\":0,\"watch_discovery_complete\":true,\"watch_stats_started\":null,\"watch_activation_attempts\":0,\"watch_limited_activations\":0,\"reasons\":[]}),\\n    )?;\\n    let seed = CacheSeed {\\n        identity: CacheIdentity {\\n            scope,\\n            epoch: CacheEpoch::from_parts(1, [9; 10])?,\\n        },\\n        extractor_version: \"native-admission-control\".into(),\\n        ignore_digest: ContentHash([0; 32]),\\n        coverage,\\n        state: IndexState::Current,\\n    };\\n    let mut cold = CacheConnection::create(\\n        &cache,\\n        &seed,\\n        ConnectionRole::ColdWriter,\\n        &SqlProfile::contained_cold(),\\n        until(),\\n    )?;\\n    for batch in 0..seed_batches {\\n        cold.write(1_000_000, until(), |sql| {\\n            let mut statement = sql.prepare(\"INSERT INTO names(text) VALUES(?1)\")?;\\n            for row in 0..512 {\\n                statement\\n                    .execute([format!(\"entry_{batch}_{row}_{}\", \"x\".repeat(180))])\\n                    .map_err(error)?;\\n                if consumer {\\n                    let id=i64::from(batch*512+row+1);\\n                    let mut symbol=[0u8;32];symbol[..8].copy_from_slice(&id.to_be_bytes());\\n                    let path=RelativePath::new(format!(\"file-{id}.rs\"))?;\\n                    let file=seed.identity.scope.file_id(&path);\\n                    sql.prepare(\"INSERT INTO files(id,key,path,path_key,bytes,identity,coverage_json,last_code_generation,last_author_generation,baseline_reset,language) VALUES(?1,?2,?3,?3,0,x\\'01\\',\\'\\\\\"Indexed\\\\\"\\',0,0,0,\\'Rust\\')\")?.execute((id,file.0.as_slice(),path.as_str())).map_err(error)?;\\n                    sql.prepare(\"INSERT INTO symbols(id,key,file,name,kind,start_byte,end_byte,start_line,start_column,end_line,end_column,exported,doc_line) VALUES(?1,?2,?1,?1,\\'Function\\',0,0,1,0,1,0,0,\\'\\')\")?.execute((id,symbol.as_slice())).map_err(error)?;\\n                    sql.prepare(\"INSERT INTO symbol_fts(rowid,name,split_name,path,container,doc_line) VALUES(?1,?2,\\'entry\\',?3,\\'\\',\\'\\')\")?.execute((id,format!(\"entry_{batch}_{row}_{}\",\"x\".repeat(180)),path.as_str())).map_err(error)?;\\n                }\\n            }\\n            Ok(())\\n        })?;\\n    }\\n    pointer::publish(&cache, &mut cold, None, until())?;\\n    drop(cold);\\n    // Arithmetic-only allowance to open the measured path. It grants no admission.\\n    let provisional = SqlProfile::from_qualified_overhead((SQL_QUERY_BYTES - 262_144) / 2)?;\\n    sql_memory(true)?;\\n    let mut observations = vec![sample(\"before-host-open\", &[])?];\\n    for round in 0..if consumer { 2 } else { 12 } {\\n        let mut writer = CacheConnection::open(\\n            &cache,\\n            seed.identity.clone(),\\n            ConnectionRole::HostWriter,\\n            &provisional,\\n            until(),\\n        )?\\n        .ok_or(\"writer absent\")?;\\n        let writer_handle = LAST.load(Ordering::Acquire);\\n        let mut reader = CacheConnection::open(\\n            &cache,\\n            seed.identity.clone(),\\n            ConnectionRole::HostReader,\\n            &provisional,\\n            until(),\\n        )?\\n        .ok_or(\"reader absent\")?;\\n        let reader_handle = LAST.load(Ordering::Acquire);\\n        observations.push(sample(\\n            &format!(\"{round}-both-open\"),\\n            &[writer_handle, reader_handle],\\n        )?);\\n        let bytes = if consumer {\\n            let value = crate::sql_replay::run(&mut reader, reader_handle)?;\\n            observations\\n                .push(json!({\"phase\":format!(\"{round}-public-source-queries\"),\"consumer\":value}));\\n            0\\n        } else {\\n            scan(&mut writer, false)? + scan(&mut reader, true)?\\n        };\\n        if !consumer && bytes < 1_000_000 {\\n            return Err(\"SQL fixture did not fill both native caches\".into());\\n        }\\n        observations.push(sample(\\n            &format!(\"{round}-both-scanned\"),\\n            &[writer_handle, reader_handle],\\n        )?);\\n        // Hold the maximum admitted statement count while observing real handles.\\n        writer.read(until(), |sql| {\\n            let mut statements = Vec::new();\\n            let mut refused = None;\\n            for _ in 0..9 {\\n                match sql.prepare(\"SELECT text FROM names WHERE id=?1\") {\\n                    Ok(statement) => statements.push(statement),\\n                    Err(error) => {\\n                        if !matches!(error.body.detail(), se_types::Detail::AtlasResourceBudget(_)) { return Err(error); }\\n                        refused = Some(serde_json::to_value(&error.body).map_err(crate::sql::error)?);\\n                        break;\\n                    },\\n                }\\n            }\\n            if statements.is_empty() {\\n                return Err(error(\"no statement admitted\"));\\n            }\\n            observations.push(json!({\"phase\":format!(\"{round}-statement-admission\"),\"held\":statements.len(),\"refusal\":refused}));\\n            observations.push(\\n                sample(\\n                    &format!(\"{round}-statements-held\"),\\n                    &[writer_handle, reader_handle],\\n                )\\n                .map_err(error)?,\\n            );\\n            Ok(())\\n        })?;\\n        drop(reader);\\n        drop(writer);\\n        observations.push(sample(&format!(\"{round}-all-closed\"), &[])?);\\n    }\\n    Ok(\\n        json!({\"provisional_only\":true,\"sql_total_reservation\":SQL_QUERY_BYTES,\"fixed_cache_statement_arena_reservation\":262_144,\"rows\":observations,\\n        \"limitations\":[\"Native bounded adapter inputs; no universal SQL plan or whole-host bound\",\"Allocator reserved/touched memory retained separately from SQLite counters\",\"No allocator configuration, SQL guard or production pragma changed\"]}),\\n    )\\n}\\n', 'public_queries.rs': '//! Author development observations of actual source-query plans, not a SQL admission.\\nuse crate::{Result, measure};\\nuse se_atlas::{\\n    cache::connection::CacheConnection,\\n    errors::AtlasResult,\\n    query::{QueryReader, ReaderContext, RecordReader},\\n};\\nuse se_types::code::*;\\nuse se_types::{ProjectId, Read};\\nstruct NoRecords;\\nimpl RecordReader for NoRecords {\\n    fn read(\\n        &self,\\n        _: &ProjectId,\\n        _: &AtlasPrincipal,\\n        _: &RecordPointer,\\n        _: Option<&QueryText>,\\n    ) -> AtlasResult<Read<RecordHit>> {\\n        Err(unexpected())\\n    }\\n    fn literal_read(\\n        &self,\\n        _: &ProjectId,\\n        _: &AtlasPrincipal,\\n        _: &RecordPointer,\\n        _: &QueryText,\\n    ) -> AtlasResult<Read<RecordHit>> {\\n        Err(unexpected())\\n    }\\n    fn body(\\n        &self,\\n        _: &ProjectId,\\n        _: &AtlasPrincipal,\\n        _: &RecordPointer,\\n        _: Option<&QueryText>,\\n    ) -> AtlasResult<Read<HitBody>> {\\n        Err(unexpected())\\n    }\\n}\\nfn unexpected() -> se_types::SeError {\\n    se_types::SeError::invalid(\"source-only query observation\", \"no record adapter call\")\\n}\\nfn sql_memory(reset: bool) -> Result<(i64, i64)> {\\n    let (mut now, mut peak) = (0, 0);\\n    // SAFETY: both counter outputs are valid mutable pointers for the native call.\\n    let code = unsafe {\\n        rusqlite::ffi::sqlite3_status64(\\n            rusqlite::ffi::SQLITE_STATUS_MEMORY_USED,\\n            &mut now,\\n            &mut peak,\\n            i32::from(reset),\\n        )\\n    };\\n    if code != rusqlite::ffi::SQLITE_OK {\\n        return Err(format!(\"SQLite status failed: {code}\").into());\\n    }\\n    Ok((now, peak))\\n}\\npub fn run(\\n    connection: &mut CacheConnection<\\'_>,\\n    native_handle: *mut rusqlite::ffi::sqlite3,\\n) -> Result<serde_json::Value> {\\n    let viewer = AtlasPrincipal::Agent(se_types::AgentId::from_parts(1, [3; 10])?);\\n    let mut reader = QueryReader::new(\\n        connection,\\n        ReaderContext {\\n            memory: None,\\n            viewer,\\n            records: &NoRecords,\\n            source: None,\\n            hostless: false,\\n            epoch_retired: false,\\n            now_unix_ms: Some(1),\\n            record_feed_current: true,\\n        },\\n    );\\n    let mut observations = Vec::new();\\n    for (kind, mode, text) in [\\n        (SearchKind::Symbol, SearchMode::Literal, \"entry_\".to_owned()),\\n        (SearchKind::Symbol, SearchMode::Broad, \"entry\".to_owned()),\\n        (SearchKind::Path, SearchMode::Literal, \"file-\".to_owned()),\\n        (\\n            SearchKind::Symbol,\\n            SearchMode::Exact,\\n            format!(\"entry_0_0_{}\", \"x\".repeat(180)),\\n        ),\\n    ] {\\n        let query = FindQuery {\\n            query: QueryText::new(text)?,\\n            kind,\\n            scope: SearchScope {\\n                paths: vec![],\\n                languages: vec![],\\n            },\\n            next: None,\\n            budget: Validate.query_budget(16, 8192)?,\\n            mode: Some(mode),\\n            order: SearchOrder::Relevance,\\n            full: false,\\n            regex: false,\\n        };\\n        let rust_base = measure::reset();\\n        crate::sql_trace::begin(native_handle)?;\\n        let before = sql_memory(true)?;\\n        let result = reader.find(&query);\\n        let sql_after = sql_memory(false)?;\\n        let combined_peak = measure::peak().saturating_sub(rust_base);\\n        let trace = crate::sql_trace::finish(native_handle)?;\\n        // Outcome remains separate from allocation observations, including absent/stale live source.\\n        let outcome = match result {\\n            Ok(answer) => serde_json::json!({\"answer\":answer}),\\n            Err(error) => serde_json::json!({\"error\":error.body}),\\n        };\\n        observations.push(serde_json::json!({\"kind\":format!(\"{kind:?}\"),\"mode\":format!(\"{mode:?}\"),\"sqlite_current_before\":before.0,\"sqlite_high_water_after\":sql_after.1,\"native_sized_rust_tree_peak_increment\":combined_peak,\"outcome\":outcome,\"trace\":trace}));\\n    }\\n    Ok(\\n        serde_json::json!({\"source_queries\":observations,\"limitations\":\"source live verification absent and no records/history/impact/resume plans; actual QueryReader plan observations only, not a general native SQL profile\"}),\\n    )\\n}\\n', 'sql_trace.rs': '//! Diagnostic callbacks preserve the native allocator and the product\\'s deadlines.\\nuse crate::Result;\\nuse rusqlite::ffi;\\nuse std::{\\n    ffi::{CStr, c_int, c_uint, c_void},\\n    sync::{\\n        Mutex,\\n        atomic::{AtomicUsize, Ordering},\\n    },\\n};\\n\\n#[derive(Clone, Copy)]\\nstruct Sample {\\n    event: u32,\\n    current: i64,\\n    high: i64,\\n    cache: i32,\\n    schema: i32,\\n    statements: i32,\\n    lookaside: i32,\\n    statement: i32,\\n    sorts: i32,\\n    autoindex: i32,\\n    fullscan: i32,\\n    steps: i32,\\n    page_overflow: i64,\\n    largest_malloc: i64,\\n    malloc_count: i64,\\n}\\nimpl Sample {\\n    const ZERO: Self = Self {\\n        event: 0,\\n        current: 0,\\n        high: 0,\\n        cache: 0,\\n        schema: 0,\\n        statements: 0,\\n        lookaside: 0,\\n        statement: 0,\\n        sorts: 0,\\n        autoindex: 0,\\n        fullscan: 0,\\n        steps: 0,\\n        page_overflow: 0,\\n        largest_malloc: 0,\\n        malloc_count: 0,\\n    };\\n}\\n#[derive(Clone, Copy)]\\nstruct Record {\\n    sql: [u8; 2048],\\n    len: usize,\\n    count: usize,\\n    at_largest_current: Sample,\\n    last: Sample,\\n}\\nimpl Record {\\n    const ZERO: Self = Self {\\n        sql: [0; 2048],\\n        len: 0,\\n        count: 0,\\n        at_largest_current: Sample::ZERO,\\n        last: Sample::ZERO,\\n    };\\n}\\nstruct State {\\n    rows: [Record; 64],\\n    used: usize,\\n    before: [i64; 5],\\n}\\nstatic STATE: Mutex<State> = Mutex::new(State {\\n    rows: [Record::ZERO; 64],\\n    used: 0,\\n    before: [0; 5],\\n});\\nstatic LOST: AtomicUsize = AtomicUsize::new(0);\\n\\nunsafe fn global(code: i32) -> (i64, i64) {\\n    let (mut now, mut high) = (0, 0);\\n    if unsafe { ffi::sqlite3_status64(code, &mut now, &mut high, 0) } != ffi::SQLITE_OK {\\n        LOST.fetch_add(1, Ordering::Relaxed);\\n    }\\n    (now, high)\\n}\\nunsafe fn db_status(db: *mut ffi::sqlite3, code: i32) -> i32 {\\n    let (mut now, mut high) = (0, 0);\\n    if unsafe { ffi::sqlite3_db_status(db, code, &mut now, &mut high, 0) } != ffi::SQLITE_OK {\\n        LOST.fetch_add(1, Ordering::Relaxed);\\n    }\\n    now\\n}\\nunsafe extern \"C\" fn callback(\\n    event: c_uint,\\n    context: *mut c_void,\\n    statement: *mut c_void,\\n    _: *mut c_void,\\n) -> c_int {\\n    let stmt = statement.cast::<ffi::sqlite3_stmt>();\\n    let text = unsafe { ffi::sqlite3_sql(stmt) };\\n    if text.is_null() {\\n        LOST.fetch_add(1, Ordering::Relaxed);\\n        return 0;\\n    }\\n    let bytes = unsafe { CStr::from_ptr(text) }.to_bytes();\\n    if bytes.len() > 2048 {\\n        LOST.fetch_add(1, Ordering::Relaxed);\\n        return 0;\\n    }\\n    let Ok(mut state) = STATE.try_lock() else {\\n        LOST.fetch_add(1, Ordering::Relaxed);\\n        return 0;\\n    };\\n    let index = match state.rows[..state.used]\\n        .iter()\\n        .position(|r| r.len == bytes.len() && &r.sql[..r.len] == bytes)\\n    {\\n        Some(index) => index,\\n        None => {\\n            if state.used == 64 {\\n                LOST.fetch_add(1, Ordering::Relaxed);\\n                return 0;\\n            }\\n            let index = state.used;\\n            state.used += 1;\\n            state.rows[index].len = bytes.len();\\n            state.rows[index].sql[..bytes.len()].copy_from_slice(bytes);\\n            index\\n        }\\n    };\\n    let db = context.cast::<ffi::sqlite3>();\\n    let (current, high) = unsafe { global(ffi::SQLITE_STATUS_MEMORY_USED) };\\n    let sample = Sample {\\n        event,\\n        current,\\n        high,\\n        cache: unsafe { db_status(db, ffi::SQLITE_DBSTATUS_CACHE_USED) },\\n        schema: unsafe { db_status(db, ffi::SQLITE_DBSTATUS_SCHEMA_USED) },\\n        statements: unsafe { db_status(db, ffi::SQLITE_DBSTATUS_STMT_USED) },\\n        lookaside: unsafe { db_status(db, ffi::SQLITE_DBSTATUS_LOOKASIDE_USED) },\\n        statement: unsafe { ffi::sqlite3_stmt_status(stmt, ffi::SQLITE_STMTSTATUS_MEMUSED, 0) },\\n        sorts: unsafe { ffi::sqlite3_stmt_status(stmt, ffi::SQLITE_STMTSTATUS_SORT, 0) },\\n        autoindex: unsafe { ffi::sqlite3_stmt_status(stmt, ffi::SQLITE_STMTSTATUS_AUTOINDEX, 0) },\\n        fullscan: unsafe {\\n            ffi::sqlite3_stmt_status(stmt, ffi::SQLITE_STMTSTATUS_FULLSCAN_STEP, 0)\\n        },\\n        steps: unsafe { ffi::sqlite3_stmt_status(stmt, ffi::SQLITE_STMTSTATUS_VM_STEP, 0) },\\n        page_overflow: unsafe { global(ffi::SQLITE_STATUS_PAGECACHE_OVERFLOW) }.0,\\n        largest_malloc: unsafe { global(ffi::SQLITE_STATUS_MALLOC_SIZE) }.1,\\n        malloc_count: unsafe { global(ffi::SQLITE_STATUS_MALLOC_COUNT) }.0,\\n    };\\n    let row = &mut state.rows[index];\\n    row.count += 1;\\n    row.last = sample;\\n    if sample.current >= row.at_largest_current.current {\\n        row.at_largest_current = sample;\\n    }\\n    0\\n}\\npub fn begin(db: *mut ffi::sqlite3) -> Result<()> {\\n    let mut state = STATE.lock().map_err(|_| \"SQL trace lock poisoned\")?;\\n    *state = State {\\n        rows: [Record::ZERO; 64],\\n        used: 0,\\n        before: [0; 5],\\n    };\\n    LOST.store(0, Ordering::Relaxed);\\n    state.before = unsafe {\\n        [\\n            global(ffi::SQLITE_STATUS_MEMORY_USED).0,\\n            i64::from(db_status(db, ffi::SQLITE_DBSTATUS_CACHE_USED)),\\n            i64::from(db_status(db, ffi::SQLITE_DBSTATUS_SCHEMA_USED)),\\n            i64::from(db_status(db, ffi::SQLITE_DBSTATUS_STMT_USED)),\\n            i64::from(db_status(db, ffi::SQLITE_DBSTATUS_LOOKASIDE_USED)),\\n        ]\\n    };\\n    let (mut unused_now, mut unused_high) = (0, 0);\\n    // SAFETY: reset only this isolated observer process\\'s diagnostic maximum;\\n    // this changes no allocation policy or connection configuration.\\n    if unsafe {\\n        ffi::sqlite3_status64(\\n            ffi::SQLITE_STATUS_MALLOC_SIZE,\\n            &mut unused_now,\\n            &mut unused_high,\\n            1,\\n        )\\n    } != ffi::SQLITE_OK\\n    {\\n        return Err(\"SQL malloc diagnostic reset failed\".into());\\n    }\\n\\n    // SAFETY: the private observer owns this live connection until finish(), and\\n    // callbacks retain no statement pointer or borrowed SQL text after return.\\n    let code = unsafe {\\n        ffi::sqlite3_trace_v2(\\n            db,\\n            ffi::SQLITE_TRACE_STMT | ffi::SQLITE_TRACE_ROW | ffi::SQLITE_TRACE_PROFILE,\\n            Some(callback),\\n            db.cast(),\\n        )\\n    };\\n    if code != ffi::SQLITE_OK {\\n        return Err(format!(\"SQL trace installation failed: {code}\").into());\\n    }\\n    Ok(())\\n}\\nfn value(s: Sample) -> serde_json::Value {\\n    serde_json::json!({\"event\":s.event,\"sqlite_current\":s.current,\"query_cumulative_high_water\":s.high,\"connection_page_cache\":s.cache,\"connection_schema\":s.schema,\"connection_statements\":s.statements,\"connection_lookaside_slots\":s.lookaside,\"statement_memory\":s.statement,\"statement_sort_count\":s.sorts,\"statement_autoindex_rows\":s.autoindex,\"statement_fullscan_steps\":s.fullscan,\"statement_vm_steps\":s.steps,\"global_pagecache_overflow\":s.page_overflow,\"largest_single_malloc_since_query_start\":s.largest_malloc,\"global_malloc_count\":s.malloc_count})\\n}\\npub fn finish(db: *mut ffi::sqlite3) -> Result<serde_json::Value> {\\n    // SAFETY: the same private connection remains open; a zero mask removes the callback.\\n    let code = unsafe { ffi::sqlite3_trace_v2(db, 0, None, std::ptr::null_mut()) };\\n    if code != ffi::SQLITE_OK {\\n        return Err(format!(\"SQL trace removal failed: {code}\").into());\\n    }\\n    let state = STATE.lock().map_err(|_| \"SQL trace lock poisoned\")?;\\n    let rows:Vec<_>=state.rows[..state.used].iter().map(|r|serde_json::json!({\"sql\":String::from_utf8_lossy(&r.sql[..r.len]),\"events\":r.count,\"at_largest_observed_live_allocation\":value(r.at_largest_current),\"last\":value(r.last)})).collect();\\n    Ok(\\n        serde_json::json!({\"lost_events\":LOST.load(Ordering::Relaxed),\"before_query\":{\"sqlite_current\":state.before[0],\"connection_page_cache\":state.before[1],\"connection_schema\":state.before[2],\"connection_statements\":state.before[3],\"connection_lookaside_slots\":state.before[4]},\"rows\":rows,\"limitations\":\"Diagnostic trace overhead changes timing; category snapshots are simultaneous at observed callbacks, not an exhaustive allocation timeline. The high-water field is cumulative only within the current measurement scope (one public query or one statement replay); categories overlap and must not be summed.\"}),\\n    )\\n}\\n', 'sql_replay.rs': '//! Replay the shipped planner\\'s exact statements for allocation attribution only.\\nuse crate::{Result, measure, sql_trace, until};\\nuse se_atlas::cache::connection::CacheConnection;\\nuse se_types::code::*;\\n\\nfn fail(value: impl std::fmt::Display) -> se_types::SeError {\\n    se_types::SeError::invalid(\"SQL plan allocation diagnostic\", &value.to_string())\\n}\\nfn memory(reset: bool) -> Result<(i64, i64)> {\\n    let (mut current, mut high) = (0, 0);\\n    // SAFETY: both status outputs point to live writable integers.\\n    let code = unsafe {\\n        rusqlite::ffi::sqlite3_status64(\\n            rusqlite::ffi::SQLITE_STATUS_MEMORY_USED,\\n            &mut current,\\n            &mut high,\\n            i32::from(reset),\\n        )\\n    };\\n    if code != rusqlite::ffi::SQLITE_OK {\\n        return Err(format!(\"native allocation counter refused: {code}\").into());\\n    }\\n    Ok((current, high))\\n}\\npub fn run(\\n    connection: &mut CacheConnection<\\'_>,\\n    handle: *mut rusqlite::ffi::sqlite3,\\n) -> Result<serde_json::Value> {\\n    let mut observations = Vec::new();\\n    for (kind, mode, text) in [\\n        (SearchKind::Symbol, SearchMode::Literal, \"entry_\".to_owned()),\\n        (SearchKind::Symbol, SearchMode::Broad, \"entry\".to_owned()),\\n        (SearchKind::Path, SearchMode::Literal, \"file-\".to_owned()),\\n        (\\n            SearchKind::Symbol,\\n            SearchMode::Exact,\\n            format!(\"entry_0_0_{}\", \"x\".repeat(180)),\\n        ),\\n    ] {\\n        let query = FindQuery {\\n            query: QueryText::new(text)?,\\n            kind,\\n            scope: SearchScope {\\n                paths: Vec::new(),\\n                languages: Vec::new(),\\n            },\\n            next: None,\\n            budget: Validate.query_budget(16, 8192)?,\\n            mode: Some(mode),\\n            order: SearchOrder::Relevance,\\n            full: false,\\n            regex: false,\\n        };\\n        // This export is appended only to the hosted diagnostic checkout. It\\n        // returns the original private constructor\\'s SQL/bindings unchanged.\\n        let plans = se_atlas::query::diagnostic_find_plans(&query, mode)?;\\n        for (sql, values, lexical) in plans {\\n            let explain = connection.read(until(), |view| {\\n                let mut statement = view.prepare(&format!(\"EXPLAIN QUERY PLAN {sql}\"))?;\\n                let mut rows = statement\\n                    .query(rusqlite::params_from_iter(values.clone()))\\n                    .map_err(fail)?;\\n                let mut result = Vec::new();\\n                while let Some(row) = rows.next().map_err(fail)? {\\n                    result.push((\\n                        row.get::<_, i64>(0).map_err(fail)?,\\n                        row.get::<_, i64>(1).map_err(fail)?,\\n                        row.get::<_, String>(3).map_err(fail)?,\\n                    ));\\n                }\\n                Ok(result)\\n            })?;\\n            sql_trace::begin(handle)?;\\n            let before = memory(true)?;\\n            let baseline = measure::reset();\\n            let start = std::time::Instant::now();\\n            let result = connection.read(until(), |view| {\\n                let mut statement = view.prepare(&sql)?;\\n                let mut rows = statement\\n                    .query(rusqlite::params_from_iter(values))\\n                    .map_err(fail)?;\\n                let mut result = Vec::new();\\n                while let Some(row) = rows.next().map_err(fail)? {\\n                    if result.len() == 513 {\\n                        return Err(fail(\"shipping candidate limit exceeded\"));\\n                    }\\n                    result.push((\\n                        row.get::<_, i64>(0).map_err(fail)?,\\n                        row.get::<_, Option<i64>>(1).map_err(fail)?,\\n                        if lexical {\\n                            Some(row.get::<_, f64>(2).map_err(fail)?)\\n                        } else {\\n                            None\\n                        },\\n                    ));\\n                }\\n                Ok(result)\\n            });\\n            let elapsed = start.elapsed().as_micros();\\n            let after = memory(false)?;\\n            let rust_peak = measure::peak().saturating_sub(baseline);\\n            let trace = sql_trace::finish(handle)?;\\n            let outcome = match result {\\n                Ok(rows) => serde_json::json!({\"rows\":rows}),\\n                Err(error) => serde_json::json!({\"error\":error.body}),\\n            };\\n            observations.push(serde_json::json!({\"kind\":format!(\"{kind:?}\"),\"mode\":format!(\"{mode:?}\"),\"sql\":sql,\"lexical\":lexical,\"explain_query_plan\":explain,\"sqlite_current_before\":before.0,\"sqlite_high_water_after\":after.1,\"rust_peak_increment\":rust_peak,\"diagnostic_elapsed_us\":elapsed,\"outcome\":outcome,\"trace\":trace}));\\n        }\\n    }\\n    Ok(\\n        serde_json::json!({\"statement_replays\":observations,\"limitations\":\"Exact SQL/bindings from original planner, replayed one statement at a time with a 20-second diagnostic deadline. This is allocation attribution, not the 25ms QueryReader consumer, response ranking/pagination, live verification, latency or admission proof.\"}),\\n    )\\n}\\n'}\nimport os,subprocess,json,pathlib,tomllib,hashlib,time,shutil\nrepo=pathlib.Path.cwd();root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'atlas-memory-development';out.mkdir();app=out/'observer';(app/'src').mkdir(parents=True)\nsource=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert source in ['be51bb4ee8442fe984e564c42b95e8c21c340f89','87b530ae04cf2ce0b1d60f21c3da832fb356d41e']\nexport='\\n/// Allocation diagnostic export present only in this hosted checkout.\\npub fn diagnostic_find_plans(query: &FindQuery, mode: SearchMode) -> AtlasResult<Vec<(String, Vec<rusqlite::types::Value>, bool)>> {\\n    candidate_sql::plans(query, mode).map(|plans| plans.into_iter().map(|p| (p.sql, p.values, p.lexical)).collect())\\n}\\n'\nsource_file=repo/'crates/se-atlas/src/query/mod.rs';original=source_file.read_text();assert 'pub fn diagnostic_find_plans' not in original;source_file.write_text(original+export)\n(out/'diagnostic-plan-export.rs').write_text(export)\n(out/'diagnostic-source.patch').write_text(subprocess.check_output(['git','diff','--','crates/se-atlas/src/query/mod.rs'],text=True))\n\nhost=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip();assert host in ['x86_64-unknown-linux-gnu','aarch64-apple-darwin']\nfor name,text in FILES.items():(app/'src'/name).write_text(text)\nmanifest='[package]\\nname=\"atlas-memory-development\"\\nversion=\"0.0.0\"\\nedition=\"2024\"\\n[workspace]\\n[dependencies]\\n'\nfor name in ['se-host','se-atlas','se-proc','se-types']:manifest+=name+'={path='+json.dumps(str(repo/'crates'/name))+'}\\n'\nmanifest+='serde_json=\"=1.0.154\"\\nlibc=\"=0.2.191\"\\nrusqlite={version=\"=0.41.1\",features=[\"bundled\",\"hooks\",\"limits\",\"functions\"]}\\ntree-sitter={version=\"=0.26.13\",default-features=false,features=[\"std\"]}\\n'\nmanifest+='[patch.crates-io]\\nsecode-stateengine-api={path='+json.dumps(str(repo/'vendor/secode-stateengine-api'))+'}\\n'\nprofiles=tomllib.loads((repo/'Cargo.toml').read_text())['profile'];p=profiles['distribution'];manifest+='[profile.distribution]\\ninherits=\"release\"\\nopt-level=\"s\"\\nlto='+json.dumps(p['lto'])+'\\ncodegen-units=1\\n'\nfor name in ['libsqlite3-sys','sha2','hmac']:manifest+='[profile.distribution.package.'+name+']\\nopt-level=3\\n'\n(app/'Cargo.toml').write_text(manifest);shutil.copy2(repo/'Cargo.lock',app/'Cargo.lock');(app/'.cargo').mkdir();shutil.copy2(repo/'.cargo/config.toml',app/'.cargo/config.toml')\nenv=dict(os.environ,CARGO_TARGET_DIR=str(root/'atlas-memory-target'),CARGO_BUILD_JOBS='2',CARGO_INCREMENTAL='0')\ndef run(label,argv,cwd=app,timeout=1800):\n    start=time.monotonic_ns()\n    with (out/(label+'.stdout')).open('w') as stdout,(out/(label+'.stderr')).open('w') as stderr:p=subprocess.run(argv,cwd=cwd,env=env,stdout=stdout,stderr=stderr,timeout=timeout)\n    (out/(label+'.execution.json')).write_text(json.dumps({'argv':list(map(str,argv)),'exit':p.returncode,'elapsed_ns':time.monotonic_ns()-start},indent=2));return p.returncode\nassert run('fetch',['cargo','fetch','--locked','--target',host],repo)==0\nassert run('build',['cargo','build','--offline','--profile','distribution','--target',host])==0\nknown={(p['name'],p['version'],p.get('source')) for p in tomllib.loads((repo/'Cargo.lock').read_text())['package']};resolved=tomllib.loads((app/'Cargo.lock').read_text())['package'];names={p[0] for p in known};changed=[p for p in resolved if p['name'] in names and (p['name'],p['version'],p.get('source')) not in known];assert not changed,changed\nimage=root/'atlas-memory-target'/host/'distribution/atlas-memory-development'\n(out/'manifest.json').write_text(json.dumps({'source':source,'host':host,'compiler':subprocess.check_output(['rustc','-Vv'],text=True),'image_sha256':hashlib.sha256(image.read_bytes()).hexdigest(),'manifest':manifest,'changed_dependency_versions':changed,'observer_origin':'author allocation diagnostic with pure plan export; no acceptance admission','diagnostic_plan_export_sha256':hashlib.sha256(export.encode()).hexdigest(),'diagnostic_source_patch_sha256':hashlib.sha256((out/'diagnostic-source.patch').read_bytes()).hexdigest()},indent=2))\nresults=[]\nfor label,batches,consumer in [('public-4096',8,True)]:\n    env.update(MEASURE_PUBLIC_QUERY='1' if consumer else '0',MEASURE_SEED_BATCHES=str(batches),MEASURE_SOURCE_BYTES='16384',MEASURE_ROWS='8192')\n    if not consumer:env.pop('MEASURE_PUBLIC_QUERY')\n    fixture=out/('fixture-'+label);code=run(label,[str(image),str(fixture),'sql'],timeout=180)\n    row={'case':label,'seed_rows':batches*512,'exit':code,'limitations':'no live source/record/history/impact/resume admission; general sorter remains a separate counterexample'}\n    if code==0:row['observation']=json.loads((out/(label+'.stdout')).read_text());assert not fixture.exists()\n    else:row['failure']=(out/(label+'.stderr')).read_text()\n    results.append(row);(out/'results.json').write_text(json.dumps(results,indent=2))\nassert all(row['exit']==0 for row in results),'one or more observation processes failed; all raw results retained'\n"
