name: Native Windows guarded journal proof comparison
on:
  push:
    branches: [prime/windows-usn-proof-paired-r5]
permissions:
  contents: read
concurrency:
  group: windows-usn-proof-paired-r5-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        journal: [default, active]
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      MEASURE_TARGET: x86_64-pc-windows-msvc
      STARTUP_PUBLIC_READY: '1'
      STARTUP_MEASURE_PEER: '1'
      STARTUP_BASE: 737bee8caf03e17d2a61e21594d7b0285d6619dc
      STARTUP_HEAD: fbdbe5fc7fc4731410d65c8694b1f2b4afc8e3a7
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 568667b344a7c567328cb2c51badad98b5a47758
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Initialize isolated paths and verify source pins
        id: compiler
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for key in ('STARTUP_BASE', 'STARTUP_HEAD'):
              source = os.environ[key]
              actual = subprocess.check_output(['git', 'rev-parse', source + '^{commit}'], text=True).strip()
              if actual != source:
                  raise ValueError('Product source pin differs')
          subprocess.run(['git', 'merge-base', '--is-ancestor', os.environ['STARTUP_BASE'], os.environ['STARTUP_HEAD']], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MEASURE_ROOT={root / "startup-paired"}\n')
              output.write(f'EVIDENCE_ROOT={root / "startup-paired-evidence"}\n')
          text = subprocess.check_output(['git', 'show', os.environ['STARTUP_HEAD'] + ':rust-toolchain.toml'], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={tomllib.loads(text)["toolchain"]["channel"]}\n')
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rust-docs, llvm-tools-preview
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with: {arch: amd64}
      - name: Check observer syntax
        shell: python
        run: |
          import ast, pathlib
          for path in pathlib.Path('scripts/startup_package').glob('*.py'):
              ast.parse(path.read_text())
      - name: Check native census syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/startup_package/processes.ps1'), [ref]$tokens, [ref]$errors) > $null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Build and compare on the default native volume
        if: ${{ matrix.journal == 'default' }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/startup_package/paired.py', os.environ['MEASURE_ROOT']], check=True)
      - name: Build and compare on a private active-journal NTFS volume
        if: ${{ matrix.journal == 'active' }}
        shell: python
        run: |
          import base64, hashlib, os, pathlib, subprocess, sys
          payload=base64.b64decode('')
          if hashlib.sha256(payload).hexdigest() != 'c565946b77f83efc55b7dd8ca52b3e1d2d5e5802ee2feb5eac2ee864969c8f37':
              raise ValueError('Private-volume driver differs')
          script=pathlib.Path(os.environ['RUNNER_TEMP'])/'usn-cost-active-r2.py'
          script.write_bytes(payload)
          subprocess.run([sys.executable,'-B',script],check=True)
      - name: Collect archives and raw observations without private homes
        if: ${{ always() && matrix.journal == 'default' }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/startup_package/collect.py', os.environ['MEASURE_ROOT'], os.environ['EVIDENCE_ROOT']], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: windows-usn-proof-paired-r5-${{ matrix.journal }}
          path: |
            ${{ runner.temp }}/startup-paired-evidence
            ${{ runner.temp }}/usn-cost-active-r2/*.json
            ${{ runner.temp }}/usn-cost-active-r2/*.stdout
            ${{ runner.temp }}/usn-cost-active-r2/*.stderr
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
