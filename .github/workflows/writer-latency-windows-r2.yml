name: writer-latency
on:
  push:
    branches: [prime/writer-latency-b4-windows-r2]
permissions:
  contents: read
concurrency:
  group: writer-latency-${{ github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: baseline
            ref: b7a3c1c5d9d4f016b237a97c5c0d883645276eda
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Overlay measurement sources
        env:
          MEASUREMENTS: seat-5d/eight-writer-measurement-20261115
        run: |
          git fetch --quiet origin "275e369a7081d4c382f0f0f09e610397dbca918a:refs/remotes/measure/tests" "refs/heads/main:refs/remotes/measure/main"
          measured="$(git rev-parse refs/remotes/measure/tests)"
          test "$measured" = 275e369a7081d4c382f0f0f09e610397dbca918a
          echo "$measured" > measurement-commit.txt
          fork="$(git merge-base refs/remotes/measure/main refs/remotes/measure/tests)"
          git diff --name-only --diff-filter=AM "$fork" refs/remotes/measure/tests > "$RUNNER_TEMP/measurement-files"
          python3 -I - "$RUNNER_TEMP/measurement-files" <<'PY'
          import re, sys
          paths = open(sys.argv[1], encoding="utf-8").read().splitlines()
          if not paths or any(not re.match(r"^(crates/[^/]+/)?tests/", p) for p in paths):
              sys.exit("measurement overlay must contain only tests directory changes")
          PY
          xargs git checkout refs/remotes/measure/tests -- < "$RUNNER_TEMP/measurement-files"
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: writer-latency-windows-v1
          cache-on-failure: true
      - name: Measure baseline release writes
        id: baseline
        continue-on-error: true
        run: |
          git rev-parse HEAD > baseline-source.txt
          target="$(rustc --print host-tuple)"
          set +e
          cargo test --target "$target" --release --locked --all-features --no-fail-fast -p se --test eight_writer_mcp_measurement -- --nocapture
          measurement_status=$?
          cargo test --target "$target" --release --locked -p se-proc --test native_metadata_measurement -- --nocapture
          native_status=$?
          if [[ "$native_status" != 0 ]]; then measurement_status="$native_status"; fi
          set -e
          if [[ -d target/judge-diagnostics ]]; then mv target/judge-diagnostics target/judge-baseline; fi
          exit "$measurement_status"
      - name: Select candidate with the same measurement overlay
        run: |
          git fetch --quiet origin 25bea315184d95c0f5205eb7d36e05f6ee46a9ec:refs/remotes/measure/head
          test "$(git rev-parse refs/remotes/measure/head)" = 25bea315184d95c0f5205eb7d36e05f6ee46a9ec
          git checkout --detach 25bea315184d95c0f5205eb7d36e05f6ee46a9ec
          git rev-parse HEAD > candidate-source.txt
          while IFS= read -r measurement_path; do
            git diff --exit-code refs/remotes/measure/tests -- "$measurement_path"
          done < "$RUNNER_TEMP/measurement-files"
      - name: Measure candidate release writes
        id: candidate
        continue-on-error: true
        run: |
          target="$(rustc --print host-tuple)"
          set +e
          cargo test --target "$target" --release --locked --all-features --no-fail-fast -p se --test eight_writer_mcp_measurement -- --nocapture
          measurement_status=$?
          cargo test --target "$target" --release --locked -p se-proc --test native_metadata_measurement -- --nocapture
          native_status=$?
          if [[ "$native_status" != 0 ]]; then measurement_status="$native_status"; fi
          set -e
          if [[ -d target/judge-diagnostics ]]; then mv target/judge-diagnostics target/judge-candidate; fi
          exit "$measurement_status"
      - name: Run retained Windows file and pooled-read controls
        run: |
          target="$(rustc --print host-tuple)"
          cargo test --target "$target" --release --all-features --locked --no-fail-fast -p se-proc --test state_files -p se-store --test read_pool_independent -- --nocapture
      - name: Preserve failed observer verdicts
        if: ${{ always() }}
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
        run: |
          test "$BASELINE" = success
          test "$CANDIDATE" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: writer-latency-windows-metadata-paired
          path: |
            baseline-source.txt
            candidate-source.txt
            measurement-commit.txt
            target/judge-baseline/
            target/judge-candidate/
          if-no-files-found: error
          retention-days: 14
