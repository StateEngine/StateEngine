name: Independent native publication and cold pairing review
on:
  push:
    branches: [prime/cold-pairing-418-review-r1]
permissions:
  contents: read
concurrency:
  group: cold-pairing-418-review-r1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      REVIEW_TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PAIRING_ROUNDS: '20'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 952adabe474912bc914f8e35fe40d6b7f6d95354
          path: judge
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3d96af070dfb6d28daaa4f6ec6aebfc40d1ee1f6
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7c1d84a935a44cf7c12d626df64b2bb44d8f503d
          path: head
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: {toolchain: '1.97.1'}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: ${{ runner.os == 'Windows' }}
        with: {arch: amd64}
      - name: Verify source pins and prepare bounded output paths
        shell: python
        run: |
          import ast, hashlib, json, os, pathlib, platform, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review418'
          root.mkdir()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'REVIEW_ROOT={root}\n')
              output.write(f'REVIEW_EXPORT={root.parent / "review418-export"}\n')
          pins = {'base': '3d96af070dfb6d28daaa4f6ec6aebfc40d1ee1f6', 'head': '7c1d84a935a44cf7c12d626df64b2bb44d8f503d'}
          records = {}
          for side, source in pins.items():
              tree = pathlib.Path(side)
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=tree, text=True).strip() == source
              assert not subprocess.check_output(['git', 'status', '--porcelain'], cwd=tree, text=True).strip()
              paths = ['crates/se-host/src/remote/native_image/' + name for name in ('staging.rs', 'transactions.rs', 'prepare.rs')]
              paths += ['crates/se-host/src/remote/ssh/bootstrap.rs']
              records[side] = dict(source=source, files={name: hashlib.sha256((tree / name).read_bytes()).hexdigest() for name in paths})
          fixture = pathlib.Path('judge/scripts/judges/cold_pairing_review')
          for path in fixture.glob('*.py'):
              ast.parse(path.read_text())
          records['judge'] = dict(source='952adabe474912bc914f8e35fe40d6b7f6d95354', files={p.relative_to(fixture).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in fixture.rglob('*') if p.is_file()})
          records['native'] = dict(platform=platform.platform(), machine=platform.machine(), cpu_count=os.cpu_count(), target=os.environ['REVIEW_TARGET'], rustc=subprocess.check_output(['rustc', '-Vv'], text=True))
          (root / 'provenance.json').write_text(json.dumps(records, indent=2) + '\n')
      - name: Execute exact-source publication commands on native files
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          root = pathlib.Path(os.environ['REVIEW_ROOT'])
          template = pathlib.Path('judge/scripts/judges/cold_pairing_review/command-emitter')
          results = {}
          for side in ('base', 'head'):
              helper = root / ('emitter-' + side)
              shutil.copytree(template, helper)
              source = pathlib.Path(side) / 'crates/se-host/src/remote/native_image'
              target = helper / 'src/remote/native_image'
              target.mkdir(parents=True)
              for name in ('staging.rs', 'transactions.rs'):
                  shutil.copyfile(source / name, target / name)
                  assert (source / name).read_bytes() == (target / name).read_bytes()
              env = dict(os.environ, CARGO_TARGET_DIR=str(root / 'emitter-target'), CARGO_ENCODED_RUSTFLAGS='')
              argv = ['cargo', 'build', '--manifest-path', str(helper / 'Cargo.toml'), '--target', os.environ['REVIEW_TARGET'], '--locked']
              if side == 'head':
                  argv += ['--features', 'head']
              with (root / (side + '-emitter-build.log')).open('xb') as log:
                  subprocess.run(argv, cwd=helper, env=env, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=600)
              binary = root / 'emitter-target' / os.environ['REVIEW_TARGET'] / 'debug' / ('private-command-review.exe' if sys.platform == 'win32' else 'private-command-review')
              retained = root / (side + '-' + binary.name)
              shutil.copyfile(binary, retained)
              retained.chmod(0o700)
              results[side] = dict(sha256=hashlib.sha256(retained.read_bytes()).hexdigest(), argv=argv)
              with (root / (side + '-publication.log')).open('xb') as log:
                  subprocess.run([sys.executable, '-B', 'judge/scripts/judges/cold_pairing_review/publication_controls.py', str(retained), str(root / ('controls-' + side)), side], stdout=log, stderr=subprocess.STDOUT, check=True, timeout=900)
              (root / 'publication-builds.json').write_text(json.dumps(results, indent=2) + '\n')
      - name: Build both real public CLI images sequentially
        if: ${{ runner.os == 'Linux' }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ['REVIEW_ROOT'])
          images = root / 'images'
          images.mkdir()
          results = {}
          for side in ('base', 'head'):
              tree = pathlib.Path(side).resolve()
              env = dict(os.environ, CARGO_TARGET_DIR=str(root / 'product-target'))
              argv = ['cargo', 'build', '--release', '--target', os.environ['REVIEW_TARGET'], '--locked', '--no-default-features', '--features', 'remote', '-p', 'se']
              with (root / (side + '-product-build.log')).open('xb') as log:
                  subprocess.run(argv, cwd=tree, env=env, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=3000)
              image = images / side / 'se'
              image.parent.mkdir()
              shutil.copyfile(root / 'product-target' / os.environ['REVIEW_TARGET'] / 'release/se', image)
              image.chmod(0o700)
              assert not subprocess.check_output(['git', 'status', '--porcelain'], cwd=tree, text=True).strip()
              results[side] = dict(argv=argv, source=subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=tree, text=True).strip(), sha256=hashlib.sha256(image.read_bytes()).hexdigest(), bytes=image.stat().st_size)
              (root / 'public-images.json').write_text(json.dumps(results, indent=2) + '\n')
      - name: Measure alternating cold first pairings through loopback SSH
        if: ${{ runner.os == 'Linux' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['REVIEW_ROOT'])
          with (root / 'public-pairing.log').open('xb') as log:
              subprocess.run([sys.executable, '-B', 'judge/scripts/judges/cold_pairing_review/pairing_tail.py', str(root / 'pairing'), str(root / 'images/base/se'), str(root / 'images/head/se')], stdout=log, stderr=subprocess.STDOUT, check=True, timeout=1800)
      - name: Collect complete evidence without credentials or build caches
        if: ${{ always() }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path(os.environ['REVIEW_ROOT'])
          export = pathlib.Path(os.environ['REVIEW_EXPORT'])
          export.mkdir()
          for directory, children, files in os.walk(root):
              children[:] = [name for name in children if name not in ('private', 'product-target', 'emitter-target', 'emitter-base', 'emitter-head')]
              for name in files:
                  source = pathlib.Path(directory) / name
                  dest = export / source.relative_to(root)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, dest)
          manifest = {p.relative_to(export).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in export.rglob('*') if p.is_file()}
          (export / 'manifest.json').write_text(json.dumps(dict(files=manifest), indent=2) + '\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: cold-pairing-418-review-r1-${{ matrix.target }}
          path: ${{ runner.temp }}/review418-export
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
