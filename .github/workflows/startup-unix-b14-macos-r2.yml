name: Native macOS Unix startup and agent listing
on:
  push:
    branches: [prime/startup-unix-b14-macos-r2]
permissions:
  contents: read
concurrency:
  group: startup-unix-b14-macos-r2-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      MEASURE_TARGET: aarch64-apple-darwin
      STARTUP_BASE: 3b6fd70af3da4c55b6fc423abf3b24cbff337c84
      STARTUP_HEAD: a0163c9b3157415aa5d5eca71e7ec063eebc7e07
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      STARTUP_PUBLIC_READY: '1'
      LIST_OBSERVE_ROUNDS: '200'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: db77c5710c4d4bf781e14b829ef255dfdd95eca9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5a0067772e57598b6c232f71abf76ca7c10a546c
          path: list-observer
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Initialize isolated paths and verify source pins
        id: compiler
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for key in ('STARTUP_BASE', 'STARTUP_HEAD'):
              source = os.environ[key]
              actual = subprocess.check_output(['git', 'rev-parse', source + '^{commit}'], text=True).strip()
              if actual != source:
                  raise ValueError('Product source pin differs')
          parent = subprocess.check_output(['git', 'rev-parse', os.environ['STARTUP_HEAD'] + '^'], text=True).strip()
          if parent != os.environ['STARTUP_BASE']:
              raise ValueError('Candidate is not an immediate child of the base')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MEASURE_ROOT={root / "startup-paired"}\n')
              output.write(f'EVIDENCE_ROOT={root / "startup-paired-evidence"}\n')
          text = subprocess.check_output(['git', 'show', os.environ['STARTUP_HEAD'] + ':rust-toolchain.toml'], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={tomllib.loads(text)["toolchain"]["channel"]}\n')
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rust-docs, llvm-tools-preview
      - name: Check observer syntax
        shell: python
        run: |
          import ast, pathlib
          for directory in ('scripts/startup_package', 'list-observer/scripts/agent_list_observe'):
              for path in pathlib.Path(directory).glob('*.py'):
                  ast.parse(path.read_text())
      - name: Build stripped release packages and alternate their public startup
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/startup_package/paired.py', os.environ['MEASURE_ROOT']], check=True)
      - name: Run existing image-replacement and cache refusal controls
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['MEASURE_ROOT']) / 'head'
          argv = ['cargo', 'test', '--target', os.environ['MEASURE_TARGET'], '-p', 'se-proc',
              '--all-features', '--locked', '--test', 'image_cache', '--test', 'image_cache_upgrade', '--', '--show-output']
          env = dict(os.environ, CARGO_TARGET_DIR=str(root / 'target'))
          with (root / 'image-refusal-controls.log').open('xb') as output:
              result = subprocess.run(argv, cwd=root / 'source', env=env, stdout=output,
                  stderr=subprocess.STDOUT, timeout=1800)
          (root / 'image-refusal-controls.json').write_text(json.dumps(dict(argv=argv, exit=result.returncode), indent=2) + '\n')
          if result.returncode:
              raise RuntimeError('Existing native image-refusal controls failed')
      - name: Observe B2 on the exact candidate startup package
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['MEASURE_ROOT']) / 'head'
          image = json.loads((root / 'image.json').read_text())
          if image['source'] != os.environ['STARTUP_HEAD']:
              raise ValueError('Candidate startup package source differs')
          before = hashlib.sha256(pathlib.Path(image['image']).read_bytes()).hexdigest()
          if before != image['sha256']:
              raise ValueError('Candidate startup package image differs')
          subprocess.run([sys.executable, '-B', 'list-observer/scripts/agent_list_observe/observe.py', str(root)], check=True)
          after = hashlib.sha256(pathlib.Path(image['image']).read_bytes()).hexdigest()
          if after != before:
              raise ValueError('Candidate image changed between startup and listing')
          (root / 'same-package-listing.json').write_text(json.dumps(dict(source=image['source'], sha256=before,
              archive_sha256=image['archive']['sha256'], startup='observation.json', listing='result.json'), indent=2) + '\n')
      - name: Record absolute startup and listing budget outcomes
        shell: python
        run: |
          import json, os, pathlib
          root = pathlib.Path(os.environ['MEASURE_ROOT'])
          report = dict(startup_budget_ms=100, listing_budget_ms=20, arms={})
          for arm in ('base', 'head'):
              observation = json.loads((root / arm / 'observation.json').read_text())
              if observation['result'] != 'OBSERVED':
                  raise ValueError('A startup consumer did not complete')
              rows = {}
              for condition, count in (('fresh', 10), ('restart', 100)):
                  stats = observation['summary'][condition + '-traced-False']['wall']
                  if stats['count'] != count:
                      raise ValueError('Startup population differs')
                  rows[condition] = dict(**stats, within_100ms=stats['p95_ms'] <= 100)
              report['arms'][arm] = rows
          listing = json.loads((root / 'head/result.json').read_text())
          if listing['result'] != 'OBSERVED' or len(listing['cohorts']) != 12:
              raise ValueError('Listing consumer did not complete all cohorts')
          report['listing'] = dict(worst_p95_ms=max(c['summary']['p95_ms'] for c in listing['cohorts']),
              all_within_20ms=listing['all_cohorts_within_budget'])
          (root / 'budget-readback.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
      - name: Collect archives and raw observations without private homes
        if: ${{ always() }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/startup_package/collect.py', os.environ['MEASURE_ROOT'], os.environ['EVIDENCE_ROOT']], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: startup-unix-b14-macos-r2
          path: ${{ runner.temp }}/startup-paired-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
