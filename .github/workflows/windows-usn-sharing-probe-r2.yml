name: Native active-journal sharing boundary
on:
  push:
    branches: [prime/windows-usn-sharing-probe-r2]
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Qualify sharing on a private active-journal NTFS disk
        shell: python
        run: |
          import base64, hashlib, os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          data=base64.b64decode('')
          if hashlib.sha256(data).hexdigest() != '21c797d1b3189271d21791c1fbf287e5e81ecdedc721e74d1294d9aaa9134d23': raise ValueError("Payload differs")
          (root / 'usn-sharing-probe-r2.py').write_bytes(data)
          data=base64.b64decode('')
          if hashlib.sha256(data).hexdigest() != 'ab14015adfd7e52641bdd9c900313ca582fe2d29833ca25088a57b220a2514de': raise ValueError("Payload differs")
          (root / 'usn-private-volume-r2.py').write_bytes(data)
          os.environ["USN_PROBE_SCRIPT"]=str(root / "usn-sharing-probe-r2.py")
          subprocess.run([sys.executable,"-B",root / "usn-private-volume-r2.py"],check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: windows-usn-sharing-probe-r2
          path: |
            ${{ runner.temp }}/usn-private-volume-r2/*.json
            ${{ runner.temp }}/usn-private-volume-r2/*.stdout
            ${{ runner.temp }}/usn-private-volume-r2/*.stderr
          if-no-files-found: error
          retention-days: 14
