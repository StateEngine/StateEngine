        \ -Compress}\"\\n        return json.loads(powershell(script))\\n\\n    @staticmethod\\n    def shell_selection():\\\
        n        return powershell(\"$p=Get-ItemProperty -Path HKLM:\\\\\\\\SOFTWARE\\\\\\\\OpenSSH -Name DefaultShell -ErrorAction\
        \ SilentlyContinue; ConvertTo-Json @{default_shell=$p.DefaultShell} -Compress\")\\n\\n    def start(self):\\n    \
        \    binary = Path(os.environ[\\'WINDIR\\'])/\\'System32/OpenSSH/sshd.exe\\'\\n        assert binary.is_file(), \\\
        'Hosted step unavailable: built-in OpenSSH server image is absent\\'\\n        self.before = self.query(\\'sshd\\\
        ')\\n        if self.before.get(\\'pid\\'):\\n            self.incumbent = exact(self.before[\\'pid\\'])\\n      \
        \      assert self.incumbent[\\'state\\'] == \\'present\\'\\n        self.shell = self.shell_selection()\\n      \
        \  assert self.query(self.name)[\\'state\\'] == \\'absent\\', \\'Preserve an incumbent service name\\'\\n        command\
        \ = \\'\"\\' + str(binary) + \\'\" -f \"\\' + str(self.config) + \\'\"\\'\\n        run([str(binary), \\'-t\\', \\\
        '-f\\', str(self.config)])\\n        run([\\'sc.exe\\', \\'create\\', self.name, \\'type=\\', \\'own\\', \\'start=\\\
        ', \\'demand\\',\\n             \\'obj=\\', \\'LocalSystem\\', \\'binPath=\\', command])\\n        self.created =\
        \ True\\n        run([\\'sc.exe\\', \\'start\\', self.name], timeout=45)\\n        end = time.monotonic() + 30\\n\
        \        while time.monotonic() < end:\\n            row = self.query(self.name)\\n            if row.get(\\'pid\\\
        '):\\n                observed = exact(row[\\'pid\\'])\\n                assert observed[\\'state\\'] == \\'present\\\
        ' and str(self.config) in observed[\\'command\\']\\n                assert Path(observed[\\'image\\']).resolve() ==\
        \ binary.resolve()\\n                self.owned = observed\\n            if row[\\'state\\'] == \\'Running\\' and\
        \ self.owned:\\n                return {\\'stock_before\\': self.before, \\'stock_process\\': self.incumbent,\\n \
        \                       \\'fixture_service\\': self.name, \\'owned\\': self.owned,\\n                        \\'default_shell\\\
        ': json.loads(self.shell), \\'config\\': str(self.config)}\\n            time.sleep(0.2)\\n        raise RuntimeError(\\\
        'Hosted step unavailable: separate SSH service did not become ready\\')\\n\\n    def close(self):\\n        result\
        \ = {\\'stock_before\\': self.before, \\'fixture_service\\': self.name}\\n        if self.created:\\n            row\
        \ = self.query(self.name)\\n            if row.get(\\'pid\\'):\\n                observed = self.owned or exact(row[\\\
        'pid\\'])\\n                assert row[\\'pid\\'] == observed[\\'pid\\'] and str(self.config) in observed[\\'command\\\
        ']\\n                family = service_family(observed)\\n                result[\\'owned_family\\'] = family\\n  \
        \              for member in sorted(family, key=lambda x: x[\\'depth\\'], reverse=True):\\n                    stopped\
        \ = stop(member)\\n                    assert stopped[\\'state\\'] == \\'absent\\' or (stopped[\\'state\\'] == \\\
        'present\\' and stopped[\\'signalled\\'])\\n            end = time.monotonic() + 15\\n            while time.monotonic()\
        \ < end:\\n                row = self.query(self.name)\\n                if row[\\'state\\'] == \\'Stopped\\' and\
        \ row[\\'pid\\'] == 0:\\n                    break\\n                time.sleep(0.2)\\n            assert row[\\'state\\\
        '] == \\'Stopped\\' and row[\\'pid\\'] == 0\\n            run([\\'sc.exe\\', \\'delete\\', self.name])\\n        \
        \    assert self.query(self.name)[\\'state\\'] == \\'absent\\', \\'Owned service survived deletion\\'\\n         \
        \   result[\\'fixture_state\\'] = \\'deleted\\'\\n            result[\\'owned_process_after\\'] = exact(self.owned[\\\
        'pid\\']) if self.owned else {\\'state\\': \\'not observed\\'}\\n        else:\\n            result[\\'fixture_state\\\
        '] = \\'not created\\'\\n        if self.before is not None:\\n            result[\\'stock_after\\'] = self.query(\\\
        'sshd\\')\\n            assert result[\\'stock_after\\'] == self.before, \\'Stock SSH service changed during the fixture\\\
        '\\n            if self.incumbent:\\n                assert same(self.incumbent, exact(self.incumbent[\\'pid\\']))\\\
        n        if self.shell is not None:\\n            assert self.shell_selection() == self.shell, \\'SSH shell selection\
        \ changed during the fixture\\'\\n        return result\\n'}\nfor name,body in files.items():\n    ast.parse(body,filename=name)\n\
        \    (root/name).write_text(body,encoding='utf-8')\n"
    - name: Run installed Windows source and destination through real SSH logons
      shell: python
      run: 'import datetime,os,pathlib,subprocess,sys

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])/(''r5-windows-ssh-''+os.environ[''GITHUB_RUN_ID''])

        controller=pathlib.Path(os.environ[''RUNNER_TEMP''])/''r5-windows-controller''

        assert not os.environ.get(''GH_TOKEN'') and not os.environ.get(''GITHUB_TOKEN'')

        deadline=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=20)).isoformat()

        subprocess.run([sys.executable,''-B'',str(controller/''regression.py''),''--assets'',str(pathlib.Path(os.environ[''RUNNER_TEMP''])/''r5-release-assets''),''--root'',str(root),''--deadline-utc'',deadline],check=True)

        '
    - name: Stage only bounded reports and controllers after private-key screening
      if: always()
      shell: python
      run: "from pathlib import Path\nimport os,re,shutil\nbase=Path(os.environ['RUNNER_TEMP'])\nreports=base/('r5-windows-ssh-'+os.environ['GITHUB_RUN_ID'])/'reports'\n\
        controller=base/'r5-windows-controller'\nselected=[]\nif reports.is_dir():\n    for path in reports.iterdir():\n \
        \       assert path.is_file() and not path.is_symlink() and not (path.stat().st_file_attributes & 0x400)\n       \
        \ assert path.suffix in ('.json','.stdout','.stderr')\n        selected.append((path,Path('reports')/path.name))\n\
        for name in ('accounts.py','install.py','native.py','regression.py','ssh_service.py'):\n    path=controller/name\n\
        \    if path.is_file():selected.append((path,Path('controller')/name))\nprovenance=base/'r5-release-provenance.json'\n\
        if provenance.is_file():selected.append((provenance,Path(provenance.name)))\nassert selected, 'No bounded fixture\
        \ evidence exists'\n# Validate every selected byte before staging anything for upload.\nfor path,_ in selected:\n\
        \    assert not path.is_symlink() and not (path.stat().st_file_attributes & 0x400)\n    data=path.read_bytes()\n \
        \   assert not re.search(rb'-----BEGIN [A-Z ]*PRIVATE KEY-----|PuTTY-User-Key-File-',data), 'Private material refused\
        \ from artifact staging'\nstage=base/'r5-windows-upload'\nstage.mkdir(exist_ok=False)\nfor path,relative in selected:\n\
        \    destination=stage/relative\n    destination.parent.mkdir(parents=True,exist_ok=True)\n    shutil.copyfile(path,destination)\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: r5-windows-installed-regression
        path: ${{ runner.temp }}/r5-windows-upload
        if-no-files-found: error
        retention-days: 7
