        nU.DeleteProfileW.argtypes = [W.LPCWSTR, W.LPCWSTR, W.LPCWSTR]\\nU.DeleteProfileW.restype = W.BOOL\\nPROFILE_KEY =\
        \ \\'SOFTWARE/Microsoft/Windows NT/CurrentVersion/ProfileList/\\'.replace(\\'/\\', chr(92))\\n\\n\\ndef create(role):\\\
