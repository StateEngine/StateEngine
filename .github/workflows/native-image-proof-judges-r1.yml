name: Independent Windows public executable hint readers
on:
  push:
    branches: [prime/native-image-proof-judges-r1]
permissions:
  contents: read
concurrency:
  group: native-image-proof-judges-r1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  judge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: base
            source: 737bee8caf03e17d2a61e21594d7b0285d6619dc
          - side: head
            source: 7e565de8101511b60ca97e1d39b2af216642ef71
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: ${{ matrix.source }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: ./.github/actions/rust
      - name: Materialize independent public reader regression
        shell: python
        run: |
          import base64, hashlib, os, pathlib, subprocess
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if source != os.environ['EXPECTED_SOURCE']:
              raise ValueError('Product source differs')
          evidence = pathlib.Path(os.environ['RUNNER_TEMP'])/'native-image-proof-evidence'
          evidence.mkdir()
          (evidence/'source.txt').write_text(source+'\n')
          judge = base64.b64decode('')
          if hashlib.sha256(judge).hexdigest() != 'c3556c0ce2cf746ac7e32d0d35668fedc446a33ad63b2956b1b47b304e78bbec':
              raise ValueError('Independent judge differs')
          pathlib.Path('crates/se-proc/tests/windows_image_hint_independent.rs').write_bytes(judge)
          (evidence/'windows_image_hint_independent.rs').write_bytes(judge)
      - name: Exercise existing host remote and adoption hint readers
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          env = dict(os.environ,CARGO_TARGET_DIR=str(root/'native-image-proof-target'),PROOF_JUDGE_ROOT=str(root/'native-image-proof-private-home'))
          pathlib.Path(env['PROOF_JUDGE_ROOT']).mkdir()
          host = next(line.split(': ',1)[1] for line in subprocess.check_output(['rustc','-vV'],text=True).splitlines() if line.startswith('host: '))
          evidence = root/'native-image-proof-evidence'
          command = ['cargo','test','--target',host,'-p','se-proc','--locked','--test','windows_image_hint_independent','--','--nocapture','--test-threads=1']
          with (evidence/'native-judge.log').open('wb') as output:
              result = subprocess.run(command,env=env,stdout=output,stderr=subprocess.STDOUT)
          (evidence/'result.json').write_text(json.dumps(dict(source=env['EXPECTED_SOURCE'],exit_code=result.returncode))+'\n')
          print((evidence/'native-judge.log').read_text())
          raise SystemExit(result.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: native-image-proof-${{ matrix.side }}
          path: ${{ runner.temp }}/native-image-proof-evidence
          if-no-files-found: error
          retention-days: 14
