name: Independent native image revision delta
'on':
  push:
    branches:
    - prime/native-image-delta-review-r1
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  JUDGE_SOURCE: 7ef799c365c9ed6885afc54d6346ac26f210590e
jobs:
  judge:
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - side: retained_gap
          ref: bb334ddf2affddfccf5ef8ccfe242663f706acea
        - side: head
          ref: 3aa7cb5d48048aee59d0580c01e80536f9d7b31c
    env:
      EXPECTED_SOURCE: ${{ matrix.ref }}
      SIDE: ${{ matrix.side }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.ref }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: native-image-delta-windows-v1
        cache-on-failure: true
    - name: Overlay independent native judges
      shell: python
      run: "import hashlib, json, os, pathlib, subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-image-delta-evidence';root.mkdir()\n\
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\nif source!=os.environ['EXPECTED_SOURCE']:raise\
        \ ValueError('Product pin differs')\nsubprocess.run(['git','fetch','--quiet','origin',os.environ['JUDGE_SOURCE']],check=True)\n\
        manifest={}\nfor path in ['crates/se-proc/src/native_ipc/independent_delta.rs','crates/se-proc/tests/windows_image_hint_independent.rs','crates/se-host/tests/windows_retained_image_independent.rs']:\n\
        \ data=subprocess.check_output(['git','show',os.environ['JUDGE_SOURCE']+':'+path])\n pathlib.Path(path).write_bytes(data);(root/pathlib.Path(path).name).write_bytes(data)\n\
        \ manifest[path]=hashlib.sha256(data).hexdigest()\np=pathlib.Path('crates/se-proc/src/native_ipc/mod.rs')\np.write_bytes(p.read_bytes()+b'\\\
        n#[cfg(all(test, windows))]\\n#[path = \"independent_delta.rs\"]\\nmod independent_delta;\\n')\n(root/'pins.json').write_text(json.dumps(dict(source=source,judge=os.environ['JUDGE_SOURCE'],files=manifest),indent=2)+'\\\
        n')\n"
    - name: Exercise common native proofs and four public consumers
      shell: python
      run: 'import base64, hashlib, os, pathlib, subprocess, sys

        data=base64.b64decode('''')

        if hashlib.sha256(data).hexdigest()!=''af6609b5c40996524185449ba0218211a4a2537720429be6cb76ed1697552f64'':raise ValueError(''Driver
        differs'')

        p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''product-delta-driver-r3.py'';p.write_bytes(data)

        subprocess.run([sys.executable,''-B'',str(p)],check=True)

        '
    - name: Grade witnessed base failures and candidate passes
      shell: python
      run: "import json,os,pathlib,re\nr=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-image-delta-evidence'\nd=json.loads((r/'result.json').read_text())\n\
        if not d.get('detached') or not d.get('consumers_completed'):raise ValueError('Completion or cleanup absent')\nexpected={'retained_gap':{'common-native':(5,0),'public-clock':(4,0),'public-generationless':(4,0),'retained-public':(0,6)},'head':{'common-native':(5,0),'public-clock':(4,0),'public-generationless':(4,0),'retained-public':(6,0)}}[os.environ['SIDE']]\n\
        verdict={}\nfor name,wanted in expected.items():\n text=(r/(name+'.log')).read_text(errors='replace')\n matches=re.findall(r'test\
        \ result: (?:ok|FAILED)\\. (\\d+) passed; (\\d+) failed; (\\d+) ignored;',text)\n if not matches:raise ValueError(name+'\
        \ did not finish native cases')\n actual=tuple(map(int,matches[-1]))\n if actual[:2]!=wanted or actual[2]!=(0 if name\
        \ in ('common-native','retained-public') else 1):raise ValueError(f'{name}: expected {wanted}, final {actual}')\n\
        \ code=d['commands'][name]['exit'];want_code=0 if wanted[1]==0 else 101\n if code!=want_code:raise ValueError(f'{name}:\
        \ expected exit {want_code}, observed {code}')\n verdict[name]=dict(exit=code,passed=actual[0],failed=actual[1],ignored=actual[2])\n\
        retained=(r/'retained-public.log').read_text(errors='replace')\nif os.environ['SIDE']=='head':\n for mode in ['unavailable','removed','held-writer']:\n\
        \  for server in ['false','true']:\n   for byte in [66,67,68]:\n    if f'RETAINED_IMAGE mode={mode} server={server}\
        \ byte={byte} stale_refused=true stamp_drift=true invocation_refused=true fresh_validation=true clocks_restored=true'\
        \ not in retained:raise ValueError('Retained consumer exercise absent')\nelse:\n for mode in ['unavailable','removed','held-writer']:\n\
        \  for server in ['false','true']:\n   if f'RETAINED_IMAGE_STALE_ACCEPT mode={mode} server={server} byte=66' not in\
        \ retained:raise ValueError('Negative arm did not witness stale retained acceptance')\ncommon=(r/'common-native.log').read_text(errors='replace')\n\
        collision=re.search(r'DELTA recreated-journal first_instance=(\\d+) second_instance=(\\d+) first_usn=(\\d+) second_usn=(\\\
        d+)',common)\nif not collision:raise ValueError('Native collision observations absent')\na,b,u,v=map(int,collision.groups())\n\
        if a==b or u!=v or u<=0:raise ValueError('Equal positive USN across different journal instances was not witnessed')\n\
        if 'COLLISION_NOT_EXERCISED' in common:raise ValueError('Collision fixture failed')\nverdict['collision']=dict(first_instance=a,second_instance=b,positive_usn=u)\n\
        (r/'grade.json').write_text(json.dumps(verdict,indent=2)+'\\n')\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: native-image-delta-${{ matrix.side }}
        path: ${{ runner.temp }}/native-image-delta-evidence
        if-no-files-found: error
        retention-days: 14
