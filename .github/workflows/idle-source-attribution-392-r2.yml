name: Idle source attribution 392 Windows r2
on:
  push:
    branches: [prime/idle-source-attribution-392-r2]
permissions:
  contents: read
jobs:
  attribution:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.97.1'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: idle-source-attribution-392-r1
      - name: Materialize private attribution scripts
        shell: python
        run: |
          import base64, pathlib
          for name, value in {'inject-attribution.py': '', 'hosted-observe.py': ''}.items():
              pathlib.Path(name).write_bytes(base64.b64decode(value))
      - name: Apply temporary diagnostic overlay
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'inject-attribution.py', '.', 'out'], check=True)
      - name: Build source attribution image
        shell: python
        run: |
          import shutil, subprocess
          linker = shutil.which('link.exe')
          if not linker or 'git' in linker.lower():
              raise RuntimeError('MSVC linker unavailable in the native build environment')
          print('Native MSVC linker selected.')
          subprocess.run(['cargo', 'build', '--locked', '-p', 'se', '--bin', 'se'], check=True)
      - name: Observe idle source firings
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'hosted-observe.py', '--source', '.', '--se', 'target/debug/se.exe', '--output', 'out/cohorts'], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: idle-source-attribution-${{ runner.os }}
          if-no-files-found: error
          path: |
            out/attribution-overlay.diff
            out/attribution-sites.json
            out/cohorts/summary.json
            out/cohorts/**/result.json
            out/cohorts/**/host.stdout
            out/cohorts/**/host.stderr
            out/cohorts/**/call-*.stdout
            out/cohorts/**/call-*.stderr
