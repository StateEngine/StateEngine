name: Independent candidate admission expiry controls
'on':
  push:
    branches:
    - prime/candidate-admission-judges-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        arm:
        - base
        - head
        include:
        - arm: base
          source: 737bee8caf03e17d2a61e21594d7b0285d6619dc
        - arm: head
          source: fa793ea942fb27b34a1f770ce300c8ed07fc989a
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: ./.github/actions/rust
    - name: Exercise expiry checkpoints and completed-window consumer behavior
      shell: python
      env:
        EXPECTED_SOURCE: ${{ matrix.source }}
      run: |
        PAYLOADS={'admission_review.rs': '', 'admission_review_probe.rs': ''}
        HASHES={'admission_review.rs': 'f5a0cbc527570c29f1e37962d9c7b059eb0425724223010e366aac5fa2e91977', 'admission_review_probe.rs': '30b4e091f8f2aefb4083eff106443d8f6b7b17e9b6b054c8779ec2fcbff69922'}

        import base64,hashlib,json,os,pathlib,subprocess,time
        repo=pathlib.Path.cwd();source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert source==os.environ['EXPECTED_SOURCE']
        root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'admission-review';out.mkdir();(out/'source.txt').write_text(source+'\n')
        for name,encoded in PAYLOADS.items():
         b=base64.b64decode(encoded);assert hashlib.sha256(b).hexdigest()==HASHES[name];(out/name).write_bytes(b)
         (repo/('crates/se-atlas/tests/foundation_judge/'+name if name=='admission_review.rs' else 'crates/se-atlas/src/query/'+name)).write_bytes(b)
        (out/'judge-hashes.json').write_text(json.dumps(HASHES,indent=2)+'\n')
        with (repo/'crates/se-atlas/src/query/mod.rs').open('a')as f:f.write('\n#[cfg(feature="test-clock")]\nmod admission_review_probe;\n')
        with (repo/'crates/se-atlas/tests/foundation_judge.rs').open('a')as f:f.write('\n#[path="foundation_judge/admission_review.rs"]\nmod admission_review;\n')
        host=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip()
        command=['cargo','test','--target',host,'-p','se-atlas','--locked','--test','foundation_judge','admission_review::','--','--nocapture','--test-threads=1']
        env=dict(os.environ,CARGO_TARGET_DIR=str(root/'admission-target'),CARGO_BUILD_JOBS='2',CARGO_INCREMENTAL='0',CARGO_PROFILE_DEV_DEBUG='0',CARGO_PROFILE_TEST_DEBUG='0')
        start=time.monotonic_ns()
        with (out/'native-controls.log').open('wb')as log:r=subprocess.run(command,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=2400)
        (out/'execution.json').write_text(json.dumps(dict(source=source,argv=command,exit=r.returncode,elapsed_ns=time.monotonic_ns()-start),indent=2)+'\n')
        print('native controls',r.returncode);raise SystemExit(r.returncode)
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: candidate-admission-${{ matrix.os }}-${{ matrix.arm }}
        path: ${{ runner.temp }}/admission-review
        if-no-files-found: error
        retention-days: 14
