name: Review native runtime recovery
'on':
  push:
    branches:
    - prime/review-runtime-macos-415-r2
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      REVIEW_HEAD: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
      REVIEW_BASE: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/rust
    - name: Install pinned native process observer
      shell: python
      run: 'import subprocess,sys

        subprocess.run([sys.executable,"-m","pip","install","--disable-pip-version-check","psutil==7.1.0"],check=True)

        '
    - name: Stage independent frozen consumers
      shell: python
      run: 'from pathlib import Path

        import base64,json,hashlib,os

        p=Path(os.environ["RUNNER_TEMP"])/"review415-inputs"

        p.mkdir()

        files={''consumer.py'': '''', ''fixture_paths.py'': '''', ''judge_records.py'': '''', ''launch_continuity_provider.py'': '''', ''mail_cli.py'': '''', ''native.py'': '''', ''overlay.py'': '''', ''produce.py'': ''''}

        for name,raw in files.items(): (p/name).write_bytes(base64.b64decode(raw))

        (p/"input-hashes.json").write_text(json.dumps({name:hashlib.sha256(base64.b64decode(raw)).hexdigest() for name,raw in files.items()},indent=2))

        '
    - name: Build both source arms and exercise native recovery
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        r=Path(os.environ["RUNNER_TEMP"])/"review415-inputs"

        raise SystemExit(subprocess.run([sys.executable,"-B",str(r/"produce.py")]).returncode)

        '
    - name: Hash finite joined output and frozen inputs
      if: ${{ always() }}
      shell: python
      run: 'from pathlib import Path

        import hashlib,json,os,shutil

        r=Path(os.environ["RUNNER_TEMP"])/"r415/evidence"

        r.mkdir(parents=True,exist_ok=True)

        s=Path(os.environ["RUNNER_TEMP"])/"review415-inputs"

        if s.exists(): shutil.copytree(s,r/"frozen-inputs")

        rows=[{"file":p.relative_to(r).as_posix(),"bytes":p.stat().st_size,"sha256":hashlib.file_digest(p.open("rb"),"sha256").hexdigest()} for p in sorted(r.rglob("*")) if p.is_file() and p.name!="artifact-manifest.json"]

        (r/"artifact-manifest.json").write_text(json.dumps(rows,indent=2)+"\n")

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: review415-native-macos-r2
        path: ${{ runner.temp }}/r415/evidence
        retention-days: 2
        compression-level: 0
        if-no-files-found: error
        include-hidden-files: true
