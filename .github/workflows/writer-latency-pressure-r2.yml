name: background-wal-copy-phases
on:
  push:
    branches: [prime/writer-latency-b4-pressure-r2]
permissions:
  contents: read
concurrency:
  group: writer-latency-${{ github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025
            cache: writer-latency-windows-v1
            ref: 906ca100f773a8d824a47905f0f700d38de3f63c
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Overlay measurement sources
        env:
          MEASUREMENTS: 57ba1b02f1669d1a48d8641482f0f88a94e310f4
        run: |
          git fetch --quiet origin "57ba1b02f1669d1a48d8641482f0f88a94e310f4:refs/remotes/measure/tests" "refs/heads/main:refs/remotes/measure/main"
          measured="$(git rev-parse refs/remotes/measure/tests)"
          test "$measured" = 57ba1b02f1669d1a48d8641482f0f88a94e310f4
          echo "$measured" > measurement-commit.txt
          fork="$(git merge-base refs/remotes/measure/main refs/remotes/measure/tests)"
          git diff --name-only --diff-filter=AM "$fork" refs/remotes/measure/tests > "$RUNNER_TEMP/measurement-files"
          python -I - "$RUNNER_TEMP/measurement-files" <<'PY'
          import re, sys
          paths = open(sys.argv[1], encoding="utf-8").read().splitlines()
          if not paths or any(not re.match(r"^(crates/[^/]+/)?tests/", p) for p in paths):
              sys.exit("measurement overlay must contain only tests directory changes")
          PY
          xargs git checkout refs/remotes/measure/tests -- < "$RUNNER_TEMP/measurement-files"
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ${{ matrix.cache }}
          cache-on-failure: true
      - name: Measure baseline continuous WAL pressure
        id: baseline
        continue-on-error: true
        run: |
          git rev-parse HEAD > baseline-source.txt
          target="$(rustc --print host-tuple)"
          set +e
          python -I -c 'from pathlib import Path; Path("target/judge-diagnostics/wal-pressure.json").unlink(missing_ok=True)'
          cargo test --target "$target" --release --locked --all-features --no-fail-fast -p se-store --test wal_pressure_measurement -- --nocapture > pressure-baseline.log 2>&1
          pressure_status=$?
          set -e
          if [[ -f target/judge-diagnostics/wal-pressure.json ]]; then
            mkdir -p target/pressure-baseline
            cp target/judge-diagnostics/wal-pressure.json target/pressure-baseline/wal-pressure.json
          fi
          exit "$pressure_status"
      - name: Run baseline retained checkpoint and pressure controls
        id: baseline_controls
        continue-on-error: true
        run: |
          target="$(rustc --print host-tuple)"
          cargo test --target "$target" --release --all-features --locked --no-fail-fast -p se-store --test background_checkpoint_independent --test deferred_checkpoint_independent -- --nocapture > checkpoint-baseline-controls.log 2>&1
      - name: Select candidate with the same measurement overlay
        run: |
          git fetch --quiet origin 12d9b40f7570973977b8efe8e63bef4a45dc21e9:refs/remotes/measure/head
          test "$(git rev-parse refs/remotes/measure/head)" = 12d9b40f7570973977b8efe8e63bef4a45dc21e9
          git checkout --detach 12d9b40f7570973977b8efe8e63bef4a45dc21e9
          git rev-parse HEAD > candidate-source.txt
          while IFS= read -r measurement_path; do
            git diff --exit-code refs/remotes/measure/tests -- "$measurement_path"
          done < "$RUNNER_TEMP/measurement-files"
      - name: Measure candidate continuous WAL pressure
        id: candidate
        continue-on-error: true
        run: |
          target="$(rustc --print host-tuple)"
          set +e
          python -I -c 'from pathlib import Path; Path("target/judge-diagnostics/wal-pressure.json").unlink(missing_ok=True)'
          cargo test --target "$target" --release --locked --all-features --no-fail-fast -p se-store --test wal_pressure_measurement -- --nocapture > pressure-candidate.log 2>&1
          pressure_status=$?
          set -e
          if [[ -f target/judge-diagnostics/wal-pressure.json ]]; then
            mkdir -p target/pressure-candidate
            cp target/judge-diagnostics/wal-pressure.json target/pressure-candidate/wal-pressure.json
          fi
          exit "$pressure_status"
      - name: Run candidate retained checkpoint and pressure controls
        id: candidate_controls
        continue-on-error: true
        run: |
          target="$(rustc --print host-tuple)"
          cargo test --target "$target" --release --all-features --locked --no-fail-fast -p se-store --test background_checkpoint_independent --test deferred_checkpoint_independent -- --nocapture > checkpoint-candidate-controls.log 2>&1
      - name: Preserve failed observer verdicts
        if: ${{ always() }}
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          BASE_CONTROLS: ${{ steps.baseline_controls.outcome }}
          HEAD_CONTROLS: ${{ steps.candidate_controls.outcome }}
        run: |
          test "$BASELINE" = success
          test "$CANDIDATE" = success
          test "$BASE_CONTROLS" = success
          test "$HEAD_CONTROLS" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: background-wal-copy-phases-${{ matrix.os }}-paired
          path: |
            checkpoint-baseline-controls.log
            checkpoint-candidate-controls.log
            pressure-baseline.log
            pressure-candidate.log
            baseline-source.txt
            candidate-source.txt
            measurement-commit.txt
            target/pressure-baseline/
            target/pressure-candidate/
          if-no-files-found: error
          retention-days: 14
