name: Native fresh status full-image proof counts
'on':
  push:
    branches:
    - prime/status-hash-count-r1
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      HASH_SOURCE: 3aa7cb5d48048aee59d0580c01e80536f9d7b31c
      HASH_COUNT_OBSERVER: ${{ github.workspace }}/observer
      USN_COST_JOURNAL: unavailable
      STARTUP_PUBLIC_READY: '1'
      STARTUP_MEASURE_PEER: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 4d9238856172205249c950f6c464f5efad2f5204
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 568667b344a7c567328cb2c51badad98b5a47758
        path: observer
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: amd64
    - name: Count full proofs through native fresh status
      shell: python
      run: 'import base64,hashlib,os,pathlib,subprocess,sys

        os.environ[''MEASURE_ROOT'']=str(pathlib.Path(os.environ[''RUNNER_TEMP''])/''hash-count-data'')

        os.environ[''EVIDENCE_ROOT'']=str(pathlib.Path(os.environ[''RUNNER_TEMP''])/''hash-count-evidence'')

        payload=base64.b64decode('''')

        assert hashlib.sha256(payload).hexdigest()==''57214a02eb66897649a09ed648f7901c871943a9339df30ed24d5e9254822516''

        script=pathlib.Path(os.environ[''RUNNER_TEMP''])/''hash-count-r1-driver.py'';script.write_bytes(payload)

        subprocess.run([sys.executable,''-B'',str(script)],check=True,timeout=6600)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: status-hash-count-r1
        path: '${{ runner.temp }}/hash-count-evidence

          ${{ runner.temp }}/hash-count-r1/*.json

          ${{ runner.temp }}/hash-count-r1/*.stdout

          ${{ runner.temp }}/hash-count-r1/*.stderr'
        if-no-files-found: error
        retention-days: 14
