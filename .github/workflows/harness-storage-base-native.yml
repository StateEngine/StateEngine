name: Native harness storage base checks
'on':
  push:
    branches: [diag/harness-storage-base-native]
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 10461d73de9df4bf3370b5255e458ccdc56f826b
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Run native checks
        shell: python
        run: |
          import base64,hashlib,os,subprocess,sys
          from pathlib import Path
          source=base64.b64decode('')
          assert hashlib.sha256(source).hexdigest()=='a6f74242c95ffd2944d3e8c20611bfde784da8a6ee6c83b2937292f7834d3eae'
          path=Path(os.environ['RUNNER_TEMP'])/'harness-native.py'
          path.write_bytes(source)
          raise SystemExit(subprocess.call([sys.executable,'-B',str(path)]))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-storage-native-windows
          path: ${{ runner.temp }}/harness-storage-native/
          if-no-files-found: error
