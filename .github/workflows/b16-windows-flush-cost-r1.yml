name: Measure native Windows init flush duration
'on':
  push:
    branches:
    - prime/b16-windows-flush-cost-r1
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      REVIEW_SOURCE: 7e339926a21eff352033aa4410142ea42b24fb7b
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Stage frozen observers
      shell: python
      run: "from pathlib import Path\nimport base64,os\nr=Path(os.environ['RUNNER_TEMP'])/'b16cost/controls';r.mkdir(parents=True)\nfiles={'acquire.py': '', 'drive.py': '', 'windows-observer/Program.cs': '', 'windows-observer/SyncTrace.csproj': '', 'windows-observer/packages.lock.json': ''}\nfor name,data in files.items():\n p=r/name;p.parent.mkdir(parents=True,exist_ok=True);raw=base64.b64decode(data);p.write_bytes(raw)\n if name.endswith('.py'):compile(raw.decode(),name,'exec')\n"
    - name: Compile and calibrate flush duration matching
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        c=Path(os.environ[''RUNNER_TEMP''])/''b16cost/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(c/''drive.py''),*(''preflight'',)]).returncode)

        '
    - name: Authenticate and reuse qualified native image
      shell: python
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'from pathlib import Path

        import os,subprocess,sys

        c=Path(os.environ[''RUNNER_TEMP''])/''b16cost/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(c/''acquire.py''),*()]).returncode)

        '
    - name: Measure fresh init with completion-paired flush costs
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        c=Path(os.environ[''RUNNER_TEMP''])/''b16cost/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(c/''drive.py''),*(''measure'',)]).returncode)

        '
    - name: Hash finite evidence
      if: always()
      shell: python
      run: "from pathlib import Path\nimport hashlib,json,os,shutil\nr=Path(os.environ['RUNNER_TEMP'])/'b16cost';out=r/'evidence';out.mkdir(parents=True,exist_ok=True)\nfor folder in ['calibration','results']:\n p=out/folder/'native.etl'\n if p.is_file():p.unlink()\nassert not list(out.rglob('*.etl'))\nshutil.copytree(r/'controls',out/'observer-source')\nrows=[{'file':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()} for p in sorted(out.rglob('*')) if p.is_file()]\n(out/'artifact-manifest.json').write_text(json.dumps(rows,indent=2)+'\\n')\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: b16-windows-flush-cost-r1
        path: ${{ runner.temp }}/b16cost/evidence
        retention-days: 2
        compression-level: 0
        include-hidden-files: true
        if-no-files-found: error
