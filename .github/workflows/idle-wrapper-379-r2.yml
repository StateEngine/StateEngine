name: Idle engine census and four public read budgets
'on':
  push:
    branches:
    - prime/idle-wrapper-379-r2
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: bda8e1e7a2c7905cb9b8537c35aad29e9242cb99
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: 'import os,tomllib

        from pathlib import Path

        channel=tomllib.loads(Path(''rust-toolchain.toml'').read_text())[''toolchain''][''channel'']

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as out:print(''channel=''+channel,file=out)

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Build shipping image then observe an idle isolated owner
      shell: python
      run: 'OBSERVER="import os,pathlib,json,subprocess,tempfile,time,uuid,traceback,shutil,argparse,math,hashlib\np=argparse.ArgumentParser();p.add_argument(''--se'',type=pathlib.Path,required=True);p.add_argument(''--source'',type=pathlib.Path,required=True);p.add_argument(''--out'',type=pathlib.Path,required=True);p.add_argument(''--image-source'',required=True);p.add_argument(''--samples'',type=int,default=200);a=p.parse_args();assert a.samples>0\nroot=a.out.resolve();root.mkdir(mode=0o700);owner=root/''owner'';owner.mkdir(mode=0o700);repo=root/''repo'';repo.mkdir();home=root/''state'';runtime=pathlib.Path(tempfile.mkdtemp(prefix=''se379-''))\nimage=a.se.resolve();env={k:v for k,v in os.environ.items() if not k.startswith((''SE_'',''STATEENGINE_'',''CODEX_'',''CLAUDE'',''ANTHROPIC_'',''OPENAI_'',''GH_'',''GITHUB_'',''GIT_''))};env.update(HOME=str(owner),USERPROFILE=str(owner),XDG_RUNTIME_DIR=str(runtime),GIT_CONFIG_NOSYSTEM=''1'',GIT_CONFIG_GLOBAL=str(owner/''empty-git-config''))\nfor
        key in [''XDG_CONFIG_HOME'',''XDG_CACHE_HOME'',''XDG_DATA_HOME'',''XDG_STATE_HOME'',''CODEX_HOME'']:\n d=owner/key.lower();d.mkdir(mode=0o700);env[key]=str(d)\nreport={''image_source'':a.image_source,''checkout_source'':subprocess.check_output([''git'',''rev-parse'',''HEAD''],cwd=a.source,text=True).strip(),''image_sha256'':hashlib.sha256(image.read_bytes()).hexdigest(),''machine'':{''cpu_count'':os.cpu_count(),''kernel'':os.uname().release},''limitations'':[''Author observations, not independent regression qualification.'',''Idle means three consecutive one-second CPU observations below 15 percent before and after measurement; raw samples are retained even when idle qualification fails.'',''One source repository, one saved agent, one unread message; no provider session.''],''calls'':[],''censuses'':[]};host=None\n\ndef call(args):\n start=time.perf_counter_ns();p=subprocess.run([str(image),''--json'',''--home'',str(home),*args],cwd=repo,env=env,capture_output=True,timeout=120);elapsed=(time.perf_counter_ns()-start)/1e6;row={''argv'':args,''elapsed_ms'':elapsed,''exit'':p.returncode,''stdout'':p.stdout.decode(),''stderr'':p.stderr.decode()};report[''calls''].append(row);save();return
        p,json.loads(p.stdout) if p.stdout else None\n\ndef save():(root/''report.json'').write_text(json.dumps(report,indent=2))\ndef census():\n rows=[]\n for path in pathlib.Path(''/proc'').iterdir():\n  if not path.name.isdigit():continue\n  try:\n   stat=(path/''stat'').read_text().rsplit('') '',1)[1].split();exe=os.readlink(path/''exe'');cmd=(path/''cmdline'').read_bytes().replace(b''\\0'',b'' '').decode(errors=''replace'');rows.append({''pid'':int(path.name),''ppid'':int(stat[1]),''state'':stat[0],''birth'':stat[19],''image'':exe,''command'':cmd})\n  except (FileNotFoundError,PermissionError,ProcessLookupError):pass\n ids={host};changed=True\n while changed:\n  before=len(ids);ids.update(x[''pid''] for x in rows if x[''ppid''] in ids);changed=len(ids)!=before\n return [x for x in rows if x[''pid''] in ids or x[''image'']==str(image)]\ntry:\n for args in [[''msg'',''send'',''--help''],[''init'',''--help''],[''up'',''--help''],[''down'',''--help''],[''status'',''--help''],[''agent'',''list'',''--help''],[''msg'',''inbox'',''--help''],[''msg'',''list'',''--help'']]:\n  p,_=call(args);assert
        p.returncode==0\n (repo/''source.rs'').write_text(''pub fn ordinary_source() -> u32 { 1 }\\n'')\n for args in [[''git'',''init'',''-q''],[''git'',''add'',''--'',''source.rs''],[''git'',''-c'',''user.name=Source fixture'',''-c'',''user.email=fixture@example.invalid'',''commit'',''-q'',''-m'',''Create source'']]:subprocess.run(args,cwd=repo,env=env,capture_output=True,check=True)\n p,value=call([''--key'',str(uuid.uuid4()),''init'',''--repo'',str(repo),''--name'',''Idle observation'',''--agent'',''Reader'',''--provider'',''codex'']);assert p.returncode==0;report[''project'']=value[''project''][''id'']\n p,value=call([''up'']);assert p.returncode==0;host=value[''process''][''pid''];report[''host'']=host\n for _ in range(3):\n  time.sleep(3);report[''censuses''].append(census());save()\n p,value=call([''--project'',report[''project''],''msg'',''send'',''Reader'',''Ordinary unread fixture message'',''--no-wake'']);assert p.returncode==0\n def cpu():\n  v=list(map(int,pathlib.Path(''/proc/stat'').read_text().splitlines()[0].split()[1:]));return
        sum(v[:8]),v[3]+v[4]\n def quiet():\n  samples=[];consecutive=0\n  for _ in range(20):\n   before=cpu();time.sleep(1);after=cpu();total=after[0]-before[0];busy=None if total<=0 else 1-(after[1]-before[1])/total;samples.append(busy)\n   consecutive=consecutive+1 if busy is not None and busy<.15 else 0\n   if consecutive>=3:break\n  return {''samples'':samples,''eligible'':consecutive>=3}\n report[''quiet_before'']=quiet();report[''measurements'']={};report[''latency_rows'']=[]\n commands=[(''status'',40,[''status'']),(''agent_list'',20,[''agent'',''list'']),(''inbox'',20,[''msg'',''inbox'',''Reader'']),(''msg_list'',20,[''msg'',''list'',''--to'',''Reader'',''--all''])]\n for label,limit,args in commands:\n  for _ in range(5):\n   p,value=call([''--project'',report[''project''],*args]);assert p.returncode==0 and isinstance(value,dict),report[''calls''][-1]\n for iteration in range(a.samples):\n  for label,limit,args in commands:\n   start=time.perf_counter_ns();p,value=call([''--project'',report[''project''],*args]);elapsed=(time.perf_counter_ns()-start)/1e6\n   #
        Saving observer receipts occurs after return and is excluded below by the direct command timer in call.\n   elapsed=report[''calls''][-1][''elapsed_ms''];report[''latency_rows''].append({''read'':label,''iteration'':iteration,''elapsed_ms'':elapsed,''exit'':p.returncode})\n report[''quiet_after'']=quiet();qualified=report[''quiet_before''][''eligible''] and report[''quiet_after''][''eligible'']\n for label,limit,args in commands:\n  rows=[x for x in report[''latency_rows''] if x[''read'']==label];values=sorted(x[''elapsed_ms''] for x in rows);p95=values[math.ceil(len(values)*.95)-1];failures=[x for x in rows if x[''exit'']!=0]\n  report[''measurements''][label]={''limit_ms'':limit,''samples'':len(rows),''p95_ms'':p95,''failures'':failures,''idle_qualified'':qualified,''verdict'':(''passing'' if p95<=limit else ''failing'') if qualified and not failures else ''unmeasured'',''reason'':None if qualified and not failures else (''a read failed'' if failures else ''idle CPU window not
        established'')}\n report[''final_census'']=census();report[''extra_wrapper_processes'']=[x for x in report[''final_census''] if x[''pid'']!=host]\n report[''observation'']=''completed'';save()\nfinally:\n if host:\n  p,value=call([''down'']);report[''down'']=value;report[''after_down'']=census();save();assert p.returncode==0 and value[''complete''] and value[''witness''][''state'']==''witnessed''\n shutil.rmtree(runtime)\nprint(json.dumps({''host'':host,''censuses'':report[''censuses''],''after_down'':report.get(''after_down'')},indent=2))\n"

        import pathlib,subprocess,json,os,time,hashlib,shutil

        root=pathlib.Path(os.environ[''RUNNER_TEMP'']);out=root/''idle379'';out.mkdir();source=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip();env=dict(os.environ,CARGO_TARGET_DIR=str(root/''idle379-target''),CARGO_BUILD_JOBS=''2'',CARGO_INCREMENTAL=''0'',CARGO_PROFILE_DISTRIBUTION_DEBUG=''0'');host=subprocess.check_output([''rustc'',''--print'',''host-tuple''],text=True).strip();inputs=json.loads(pathlib.Path(''scripts/release/inputs.json'').read_text());features='',''.join(inputs[''features'']);receipts=[]

        argv=[''cargo'',''build'',''--locked'',''-p'',''se'',''--no-default-features'',''--features'',features,''--profile'',''distribution'',''--target'',host];start=time.monotonic_ns()

        with (out/''build.stdout'').open(''w'') as stdout,(out/''build.stderr'').open(''w'') as stderr:p=subprocess.run(argv,env=env,stdout=stdout,stderr=stderr,timeout=1800)

        receipts.append({''source'':source,''argv'':argv,''exit'':p.returncode,''elapsed_ns'':time.monotonic_ns()-start});(out/''executions.json'').write_text(json.dumps(receipts,indent=2));assert p.returncode==0

        image=root/''idle379-target''/host/''distribution/se'';shutil.copy2(image,out/''se'');(out/''image.json'').write_text(json.dumps({''source'':source,''sha256'':hashlib.sha256(image.read_bytes()).hexdigest(),''features'':inputs[''features''],''profile'':''distribution''},indent=2));observer=out/''observer.py'';observer.write_text(OBSERVER);argv=[''python'',str(observer),''--se'',str(out/''se''),''--source'',str(pathlib.Path.cwd()),''--out'',str(out/''observation''),''--image-source'',source];start=time.monotonic_ns()

        with (out/''observe.stdout'').open(''w'') as stdout,(out/''observe.stderr'').open(''w'') as stderr:p=subprocess.run(argv,env=env,stdout=stdout,stderr=stderr,timeout=600)

        receipts.append({''source'':source,''argv'':argv,''exit'':p.returncode,''elapsed_ns'':time.monotonic_ns()-start});(out/''executions.json'').write_text(json.dumps(receipts,indent=2));raise SystemExit(p.returncode)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: idle379-linux-baseline
        path: '${{ runner.temp }}/idle379/*.json

          ${{ runner.temp }}/idle379/*.stdout

          ${{ runner.temp }}/idle379/*.stderr

          ${{ runner.temp }}/idle379/observer.py

          ${{ runner.temp }}/idle379/se

          ${{ runner.temp }}/idle379/observation/report.json'
        if-no-files-found: error
