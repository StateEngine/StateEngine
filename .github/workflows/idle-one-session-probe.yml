name: One session idle probe
on:
  push:
    branches: [probe/idle-one-session]
permissions:
  contents: read
jobs:
  idle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install measurement library
        run: python -m pip install psutil==7.1.0
      - name: Build release executable
        run: cargo build --release --locked -p se --bin se
      - name: Measure completed-turn idle host
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bin=target/release/se.exe; else bin=target/release/se; fi
          python probes/idle-session.py "$bin" "$RUNNER_TEMP/idle-session-probe"
