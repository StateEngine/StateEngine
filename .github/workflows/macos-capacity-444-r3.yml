name: macOS IPC capacity baseline probe
'on':
  push:
    branches:
    - prime/macos-capacity-444-r3
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 312ec7511850345aeb3c6f4bd8f7c4ffde2cced2
        - arm: fix
          source: 3344ad2e3dfd0be4f661487ba64c791b268c2727
    env:
      REVIEW_SOURCE: ${{ matrix.source }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: ./.github/actions/rust
    - name: Repeat existing native capacity test
      shell: python
      run: 'import base64,hashlib,subprocess,sys,os

        from pathlib import Path

        b=base64.b64decode('''')

        assert hashlib.sha256(b).hexdigest()==''2fbde36a38a7ad086de0eb028bfd36bccf8252f417bc4b2e9b1f5f1c1592b582''

        p=Path(os.environ[''RUNNER_TEMP''])/''probe.py'';p.write_bytes(b)

        raise SystemExit(subprocess.call([sys.executable,''-B'',str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: macos-capacity-r3-${{ matrix.arm }}
        path: ${{ runner.temp }}/capacity-probe/
        include-hidden-files: true
        if-no-files-found: error
