name: Independent runtime recovery controls
'on':
  push:
    branches:
    - prime/runtime-415-review-r3
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  consume:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2025
          arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        - os: windows-2025
          arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
    env:
      ARM: ${{ matrix.arm }}
      PRODUCT_SOURCE: ${{ matrix.source }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: review415-native
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 2836e87c9e251d77cece6385b04b003b5030627f
        path: observer-source
        persist-credentials: false
    - name: Stage independent controls and pinned native service dependency
      shell: python
      run: |
        import base64,hashlib,json,os,sys,subprocess,urllib.request
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'review415';root.mkdir()
        controls=root/'controls';controls.mkdir()
        code={'ancestry_trace.py': '', 'build.py': '', 'overlay.py': '', 'owned_family.py': '', 'public_windows.py': '', 'review_route.rs': '', 'run-standard-user.py': '', 'scm-broker.py': '', 'service-probe.py': '', 'token_context.py': '', 'worker-entry.py': ''}
        for name,encoded in code.items():
         raw=base64.b64decode(encoded);(controls/name).write_bytes(raw)
         if name.endswith('.py'):compile(raw.decode(),name,'exec')
        (root/'inputs.json').write_text(json.dumps({name:hashlib.sha256((controls/name).read_bytes()).hexdigest() for name in code},indent=2)+'\n')
        if os.name=='nt':
         url='https://files.pythonhosted.org/packages/03/d9/77040d3b43df3f3be32ea289433d660d2727f5ba327bc73be835127d9d60/pywin32-312-cp312-cp312-win_amd64.whl'
         raw=urllib.request.urlopen(url).read();assert hashlib.sha256(raw).hexdigest()=='b457f6d628a47e8a7346ce22acb7e1a46a4a78b52e1d17e1af56871bd19a93bc'
         wheel=root/'pywin32-312-cp312-cp312-win_amd64.whl';wheel.write_bytes(raw)
         subprocess.run([sys.executable,'-m','pip','install','--no-user','--no-deps','--no-index',str(wheel)],check=True)
        with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('REVIEW415_ROOT='+str(root)+'\n')
    - name: Build exact source with route scheduling barrier
      shell: python
      run: |
        import os,subprocess,sys
        from pathlib import Path
        subprocess.run([sys.executable,'-B',str(Path(os.environ['REVIEW415_ROOT'])/'controls/build.py')],check=True)
    - name: Public crash and race controls with native closure
      shell: python
      run: |
        import hashlib,json,os,subprocess,sys,tarfile
        from pathlib import Path
        root=Path(os.environ['REVIEW415_ROOT']);arm=os.environ['ARM'];bundle=root/'bundle'
        if os.name=='nt':
         manifest=hashlib.sha256((bundle/'manifest.json').read_bytes()).hexdigest()
         rustc=subprocess.check_output(['rustup','which','rustc'],text=True).strip()
         command=[sys.executable,'-B',str(root/'controls/service-probe.py'),'--bundle',str(bundle),'--arm',arm,'--out',str(root/'attempt'),'--rustc',rustc,'--manifest-sha256',manifest]
         environment=dict(os.environ)
        else:
         observer=root/'observer';observer.mkdir()
         with tarfile.open(bundle/'observer.tar') as archive:
          assert all(m.isfile() or m.isdir() for m in archive.getmembers());archive.extractall(observer,filter='data')
         image=bundle/'images'/arm/'se';image.chmod(0o700)
         environment=dict(os.environ,OBSERVER_CHECKOUT=str(observer),JUDGE_OUTPUT=str(root/'public'),JUDGE_PRIVATE=str(root/'private'),SE_IMAGE=str(image))
         command=[sys.executable,'-B',str(root/'controls/public_windows.py')]
        with (root/'consumer.stdout').open('wb') as out,(root/'consumer.stderr').open('wb') as err:result=subprocess.run(command,env=environment,stdin=subprocess.DEVNULL,stdout=out,stderr=err)
        (root/'consumer-exit.json').write_text(json.dumps({'exit':result.returncode,'argv':command})+'\n')
        raise SystemExit(result.returncode)
    - name: Retain complete bounded receipts
      if: always()
      shell: python
      run: |
        import hashlib,json,os,shutil
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'review415';out=root/'retained';out.mkdir()
        for name in ['inputs.json','consumer.stdout','consumer.stderr','consumer-exit.json']:
         if (root/name).exists():shutil.copyfile(root/name,out/name)
        for name in ['controls','build','public']:
         if (root/name).exists():shutil.copytree(root/name,out/name)
        if (root/'attempt/export').exists():shutil.copytree(root/'attempt/export',out/'export')
        # Runtime homes, credentials and native account profiles stay outside the artifact.
        files=[p for p in out.rglob('*') if p.is_file()];assert all(not p.is_symlink() for p in files)
        (out/'members.json').write_text(json.dumps({p.relative_to(out).as_posix():hashlib.file_digest(p.open('rb'),'sha256').hexdigest() for p in files},indent=2)+'\n')
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: runtime-415-review-r3-${{ matrix.os }}-${{ matrix.arm }}
        path: ${{ runner.temp }}/review415/retained
        if-no-files-found: error
        retention-days: 14
