name: Session runner author cost r6
on:
  workflow_dispatch:
  push:
    branches: [prime/session-runner-cost-r6]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: session-runner-cost-r6-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-cost:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PRODUCER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PRODUCER_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 60600efcfcff1565ad7be0f06d467c233356b335
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Install isolated observer dependency
        run: python -m pip install psutil==7.0.0
      - name: Restore sealed measurement sources
        shell: python
        run: |
          import base64,hashlib,json
          from pathlib import Path
          root=Path('.runner-cost')
          root.mkdir(exist_ok=True)
          payload={'runner_cost.rs': '', 'provider.rs': '', 'measure.py': '', 'produce.py': ''}
          expected={'runner_cost.rs': '07faf41d9d0f9885582c62ed4fda5c66ed3298af6bc0fdb6a60814c9f41dc30c', 'provider.rs': '7e16cd99d89decc10200136829f2f6c8817d078040b19af178c1e03c048afbb1', 'measure.py': 'a2d23b7f140dbe780b89db4fb83f1b2b411f06785093c91f4ff70e1be7f32d41', 'produce.py': 'd65d45f51234c3df2e1f8b3c6057378c099d1882652c36502a5e1fea3d10398a'}
          for name,encoded in payload.items():
              data=base64.b64decode(encoded,validate=True)
              if hashlib.sha256(data).hexdigest()!=expected[name]: raise RuntimeError('input digest mismatch')
              (root/name).write_bytes(data)
      - name: Build shipping image and observe author costs
        run: python -B .runner-cost/produce.py
      - name: Retain complete native evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-runner-cost-r6-${{ matrix.os }}
          path: runner-cost-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
