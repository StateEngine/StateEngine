name: Independent Windows publication command probe
on:
  push:
    branches: [prime/publication-windows-418-r4]
permissions:
  contents: read
concurrency:
  group: publication-windows-418-r4-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      REVIEW_TARGET: x86_64-pc-windows-msvc
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 61c563532bb6c3e9edb587ccddb49d886eea181a
          path: judge
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a5e466a82987a51edd51156a0968435c91b43a63
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d4917ccddb85cc3e77b191512fab01d0b1b6e03b
          path: head
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: {toolchain: '1.97.1'}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: ${{ runner.os == 'Windows' }}
        with: {arch: amd64}
      - name: Verify source pins and prepare bounded output paths
        shell: python
        run: |
          import ast, hashlib, json, os, pathlib, platform, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication418r4'
          root.mkdir()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'REVIEW_ROOT={root}\n')
              output.write(f'REVIEW_EXPORT={root.parent / "publication418r4-export"}\n')
          pins = {'base': 'a5e466a82987a51edd51156a0968435c91b43a63', 'head': 'd4917ccddb85cc3e77b191512fab01d0b1b6e03b'}
          records = {}
          for side, source in pins.items():
              tree = pathlib.Path(side)
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=tree, text=True).strip() == source
              assert not subprocess.check_output(['git', 'status', '--porcelain'], cwd=tree, text=True).strip()
              paths = ['crates/se-host/src/remote/native_image/' + name for name in ('staging.rs', 'transactions.rs', 'prepare.rs')]
              paths += ['crates/se-host/src/remote/ssh/bootstrap.rs']
              records[side] = dict(source=source, files={name: hashlib.sha256((tree / name).read_bytes()).hexdigest() for name in paths})
          fixture = pathlib.Path('judge/scripts/judges/cold_pairing_review')
          for path in fixture.glob('*.py'):
              ast.parse(path.read_text())
          records['judge'] = dict(source='61c563532bb6c3e9edb587ccddb49d886eea181a', files={p.relative_to(fixture).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in fixture.rglob('*') if p.is_file()})
          records['native'] = dict(platform=platform.platform(), machine=platform.machine(), cpu_count=os.cpu_count(), target=os.environ['REVIEW_TARGET'], rustc=subprocess.check_output(['rustc', '-Vv'], text=True))
          (root / 'provenance.json').write_text(json.dumps(records, indent=2) + '\n')
      - name: Execute exact-source publication commands on native files
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          root = pathlib.Path(os.environ['REVIEW_ROOT'])
          template = pathlib.Path('judge/scripts/judges/cold_pairing_review/command-emitter')
          results = {}
          for side in ('base', 'head'):
              helper = root / ('emitter-' + side)
              shutil.copytree(template, helper)
              source = pathlib.Path(side) / 'crates/se-host/src/remote/native_image'
              target = helper / 'src/remote/native_image'
              target.mkdir(parents=True)
              for name in ('staging.rs', 'transactions.rs'):
                  shutil.copyfile(source / name, target / name)
                  assert (source / name).read_bytes() == (target / name).read_bytes()
              env = dict(os.environ, CARGO_TARGET_DIR=str(root / ('emitter-target-' + side)), CARGO_ENCODED_RUSTFLAGS='')
              argv = ['cargo', 'build', '--manifest-path', str(helper / 'Cargo.toml'), '--target', os.environ['REVIEW_TARGET'], '--locked']
              if side == 'head':
                  argv += ['--features', 'head']
              with (root / (side + '-emitter-build.log')).open('xb') as log:
                  subprocess.run(argv, cwd=helper, env=env, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=600)
              binary = root / ('emitter-target-' + side) / os.environ['REVIEW_TARGET'] / 'debug' / ('private-command-review.exe' if sys.platform == 'win32' else 'private-command-review')
              retained = root / (side + '-' + binary.name)
              shutil.copyfile(binary, retained)
              retained.chmod(0o700)
              results[side] = dict(sha256=hashlib.sha256(retained.read_bytes()).hexdigest(), argv=argv)
              with (root / (side + '-publication.log')).open('xb') as log:
                  observed = subprocess.run([sys.executable, '-B', 'judge/scripts/judges/cold_pairing_review/windows_commands.py', str(retained), str(root / ('controls-' + side)), side], stdout=log, stderr=subprocess.STDOUT, timeout=600)
              results[side]['controls_exit'] = observed.returncode
              (root / 'publication-builds.json').write_text(json.dumps(results, indent=2) + '\n')
          assert all(row['controls_exit'] == 0 for row in results.values()), results
          assert results["base"]["sha256"] != results["head"]["sha256"], "base and head emitters are identical"
      - name: Collect complete evidence without credentials or build caches
        if: ${{ always() }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path(os.environ['REVIEW_ROOT'])
          export = pathlib.Path(os.environ['REVIEW_EXPORT'])
          export.mkdir()
          for directory, children, files in os.walk(root):
              children[:] = [name for name in children if name not in ('private', 'product-target-base', 'product-target-head', 'emitter-target-base', 'emitter-target-head', 'emitter-base', 'emitter-head')]
              for name in files:
                  source = pathlib.Path(directory) / name
                  dest = export / source.relative_to(root)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, dest)
          manifest = {p.relative_to(export).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in export.rglob('*') if p.is_file()}
          (export / 'manifest.json').write_text(json.dumps(dict(files=manifest), indent=2) + '\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: publication-windows-418-r4-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/publication418r4-export
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
