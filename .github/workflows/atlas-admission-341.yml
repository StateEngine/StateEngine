name: Independent native Atlas admission observations
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 02f60515c2cf9a02fc3e2b1c5668db5f471a82a6
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 51a71dbae7ee6646959c72e4c755c817a64865c7
          path: controls
          sparse-checkout: crates/se-host/tests/review_atlas_admission
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read pinned compiler
        id: compiler
        shell: python
        run: |
          import os,tomllib
          from pathlib import Path
          channel=tomllib.loads(Path('source/rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: print('channel='+channel,file=out)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Measure native SQL and all parser grammars independently
        shell: python
        run: |
          import os,subprocess,sys
          from pathlib import Path
          script=Path('controls/crates/se-host/tests/review_atlas_admission/run.py').resolve()
          out=Path(os.environ['RUNNER_TEMP'])/'atlas-admission'
          subprocess.run([sys.executable,'-B',str(script),str(Path('source').resolve()),
              str(Path('controls').resolve()),str(out)],check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-atlas-admission
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/atlas-admission/inputs.json
            ${{ runner.temp }}/atlas-admission/results.json
            ${{ runner.temp }}/atlas-admission/*.stdout
            ${{ runner.temp }}/atlas-admission/*.stderr
            ${{ runner.temp }}/atlas-admission/*.execution.json
            ${{ runner.temp }}/atlas-admission/observer/Cargo.toml
            ${{ runner.temp }}/atlas-admission/observer/Cargo.lock
