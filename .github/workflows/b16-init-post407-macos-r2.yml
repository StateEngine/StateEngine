name: Measure native macOS fresh init after observer correction
'on':
  push:
    branches:
    - prime/b16-init-post407-macos-r2
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
    timeout-minutes: 60
    env:
      REVIEW_SOURCE: 7e339926a21eff352033aa4410142ea42b24fb7b
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 7e339926a21eff352033aa4410142ea42b24fb7b
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Stage frozen measurement observers
      shell: python
      run: "from pathlib import Path\nimport base64, os\nr = Path(os.environ['RUNNER_TEMP']) / 'b16/controls'\nr.mkdir(parents=True)\nfiles = {'build.py': '', 'calibrate.c': '', 'measure.py': '', 'observe.c': '', 'preflight.py': '', 'unix_support.py': ''}\nfor name, data in files.items():\n    p = r / name\n    p.parent.mkdir(parents=True, exist_ok=True)\n    raw = base64.b64decode(data)\n    p.write_bytes(raw)\n    if name.endswith('.py'):\n        compile(raw.decode(), name, 'exec')\n"
    - name: Compile and calibrate observers before product build
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        r=Path(os.environ[''RUNNER_TEMP''])/''b16/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(r/''preflight.py'')]).returncode)

        '
    - name: Build pinned native distribution image
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        r=Path(os.environ[''RUNNER_TEMP''])/''b16/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(r/''build.py'')]).returncode)

        '
    - name: Measure public fresh init; tracing and timing separate
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        r=Path(os.environ[''RUNNER_TEMP''])/''b16/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(r/''measure.py'')]).returncode)

        '
    - name: Hash retained finite evidence
      if: always()
      shell: python
      run: 'from pathlib import Path

        import hashlib,json,os,shutil

        r=Path(os.environ[''RUNNER_TEMP''])/''b16'';out=r/''evidence'';out.mkdir(exist_ok=True,parents=True)

        shutil.copytree(r/''controls'',out/''observer-source'',ignore=shutil.ignore_patterns(''__pycache__''))

        files=[{''file'':p.relative_to(out).as_posix(),''bytes'':p.stat().st_size,''sha256'':hashlib.file_digest(p.open(''rb''),''sha256'').hexdigest()} for p in sorted(out.rglob(''*'')) if p.is_file() and p.name!=''artifact-manifest.json'']

        (out/''artifact-manifest.json'').write_text(json.dumps(files,indent=2)+''\n'')

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: b16-${{ matrix.os }}-r2
        path: ${{ runner.temp }}/b16/evidence
        retention-days: 2
        compression-level: 0
        include-hidden-files: true
        if-no-files-found: error
