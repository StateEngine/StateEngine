name: Native macOS strict Clippy correction
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-source:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ad170f359a9d1ab2ea0116a13a42e950242da97b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read the pinned compiler
        id: compiler
        shell: python
        run: |
          import os,tomllib
          from pathlib import Path
          channel=tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: print('channel='+channel,file=output)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: clippy
      - name: Check strict Clippy and existing native consumers
        shell: python
        run: |
          import os,subprocess,pathlib,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'macos-clippy-evidence';out.mkdir()
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source=='ad170f359a9d1ab2ea0116a13a42e950242da97b',source
          target=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip()
          assert target=='aarch64-apple-darwin',target
          env=os.environ.copy();env.update(CARGO_TARGET_DIR=str(root/'clippy-target'),CARGO_INCREMENTAL='0',CARGO_PROFILE_DEV_DEBUG='0',CARGO_PROFILE_TEST_DEBUG='0')
          commands=[
            ('proc-clippy',['cargo','clippy','--locked','--target',target,'-p','se-proc','--all-targets','--all-features','--','-D','warnings']),
            ('workspace-clippy-audit',['cargo','clippy','--locked','--target',target,'--workspace','--all-targets','--all-features','--','-D','warnings']),
            ('helper',['cargo','build','--locked','--target',target,'-p','se','--all-features']),
            ('controlled-runtime',['cargo','test','--locked','--target',target,'-p','se-proc','--test','macos_controlled_runtime','--all-features','--','--test-threads=1','--nocapture']),
            ('state-files',['cargo','test','--locked','--target',target,'-p','se-proc','--test','state_files','--all-features','--','--test-threads=1','--nocapture']),
          ]
          results=[]
          for label,command in commands:
            if label=='controlled-runtime':env['SE_MACOS_HELPER']=str(root/'clippy-target'/target/'debug/se')
            with (out/(label+'.log')).open('w') as log: result=subprocess.run(command,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=1200)
            results.append({'step':label,'command':command,'exit':result.returncode})
            (out/'results.json').write_text(json.dumps({'source':source,'target':target,'results':results},indent=2)+'\n')
            if result.returncode and label in ['proc-clippy','helper']: raise RuntimeError(results)
          image=root/'clippy-target'/target/'debug/se'
          (out/'image.json').write_text(json.dumps({'source':source,'sha256':hashlib.sha256(image.read_bytes()).hexdigest()},indent=2)+'\n')
          if any(row['exit'] for row in results): raise RuntimeError('One or more recorded native checks failed; inspect each result without suppressing failures')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-clippy-correction
          path: ${{ runner.temp }}/macos-clippy-evidence/
          if-no-files-found: error
