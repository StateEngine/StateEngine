name: Native Windows ACP agent list completion
on:
  push:
    branches: [prime/agent-list-windows-acp-b2-r4]
permissions:
  contents: read
  actions: read
concurrency:
  group: agent-list-windows-acp-b2-r4-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      MEASURE_SOURCE: 861bbfa550efee21bac143e139b0daa40f76d34e
      MEASURE_TARGET: x86_64-pc-windows-msvc
      LIST_OBSERVE_ROUNDS: '200'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5a0067772e57598b6c232f71abf76ca7c10a546c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Prepare private observation paths and syntax check
        shell: python
        run: |
          import ast, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MEASURE_ROOT={root / "b2a"}\n')
              output.write(f'EVIDENCE_ROOT={root / "b2a-evidence"}\n')
          for path in pathlib.Path('scripts/agent_list_observe').glob('*.py'):
              ast.parse(path.read_text())
      - name: Authenticate the unchanged packaged image from the prior run
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, pathlib, shutil, subprocess, sys, zipfile
          sys.path.insert(0, str(pathlib.Path('scripts/agent_list_observe').resolve()))
          import build
          root = pathlib.Path(os.environ['MEASURE_ROOT'])
          root.mkdir()
          origin = root / 'origin'
          endpoint = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/artifacts/14179118858'
          api = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          expected = 'sha256:c8f30e43c0757caf7f40b8ff90b8ad8f30269703ee9c4d701e705f28c5d18029'
          if api['digest'] != expected or api['workflow_run']['id'] != 43756890096 or api['expired']:
              raise ValueError('Origin artifact provenance differs')
          archive = root / 'origin-artifact.zip'
          with archive.open('xb') as output:
              subprocess.run(['gh', 'api', endpoint + '/zip'], stdout=output, check=True)
          if 'sha256:' + hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise ValueError('Origin API ZIP digest differs')
          with zipfile.ZipFile(archive) as package:
              if not 1 <= len(package.infolist()) <= 2048:
                  raise ValueError('Origin member count differs')
              for member in package.infolist():
                  name = pathlib.PurePosixPath(member.filename)
                  if name.is_absolute() or '..' in name.parts or chr(92) in member.filename or ':' in member.filename or member.file_size > 512 * 1024**2:
                      raise ValueError('Unsafe origin member')
              package.extractall(origin)
          metadata = json.loads((origin / 'build.json').read_text())
          if metadata['source_commit'] != os.environ['MEASURE_SOURCE'] or metadata['profile'] != 'distribution':
              raise ValueError('Original shipping package identity differs')
          packaged = list((origin / 'archive').glob('*.zip'))
          if len(packaged) != 1:
              raise ValueError('Original package inventory differs')
          root_archive = root / 'archive'
          root_archive.mkdir()
          retained = root_archive / packaged[0].name
          shutil.copyfile(packaged[0], retained)
          prior_image = json.loads((origin / 'image.json').read_text())
          if hashlib.sha256(retained.read_bytes()).hexdigest() != prior_image['archive']['sha256']:
              raise ValueError('Inner archive digest differs')
          image, manifest = build.unpack(retained, root / 'extracted', metadata)
          build.save(root / 'build.json', metadata)
          build.save(root / 'manifest.json', manifest)
          build.save(root / 'image.json', dict(image=str(image), sha256=build.digest(image), bytes=image.stat().st_size,
              source=metadata['source_commit'], archive=dict(path=str(retained), bytes=retained.stat().st_size,
              sha256=prior_image['archive']['sha256']), stripping=metadata['stripping']))
          build.save(root / 'reused-package-origin.json', dict(run=43756890096, artifact=14179118858,
              api_digest=expected, product=metadata['source_commit'], observer='5a0067772e57598b6c232f71abf76ca7c10a546c',
              scope='Unchanged full-LTO stripped package; only fixture setup timeout and outcome retention corrected'))
      - name: Observe the remaining single-agent clean ACP cohort
        shell: python
        run: |
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('scripts/agent_list_observe').resolve()))
          from observe import condition
          from support import save, require
          root = pathlib.Path(os.environ['MEASURE_ROOT'])
          image = json.loads((root / 'image.json').read_text())
          observations = root / 'observations'
          observations.mkdir()
          result = dict(result='NOT RUN', exit=1, image=image, cohorts=[], budget_ms=20,
              scope='One ACP cohort only; completes eleven validated cohorts using the identical package')
          for dirty in (False,):
              for count in (1,):
                  row = condition(observations, image, 'acp', dirty, count)
                  result['cohorts'].append(row)
                  save(root / 'result.json', result)
                  require(all(value == [] for value in row['process_closure'].values()), 'Process closure failed')
          result['exit'] = 0 if len(result['cohorts']) == 1 and all(row['exit'] == 0 for row in result['cohorts']) else 1
          result['result'] = 'OBSERVED' if result['exit'] == 0 else 'FAIL'
          save(root / 'result.json', result)
          raise SystemExit(result['exit'])
      - name: Collect raw output and native permission readbacks
        if: ${{ always() }}
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys
          root, evidence = pathlib.Path(os.environ['MEASURE_ROOT']), pathlib.Path(os.environ['EVIDENCE_ROOT'])
          subprocess.run([sys.executable, '-B', 'scripts/agent_list_observe/collect.py', str(root), str(evidence)], check=True)
          origin = root / 'reused-package-origin.json'
          if origin.is_file():
              shutil.copyfile(origin, evidence / origin.name)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: agent-list-windows-acp-b2-r4-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/b2a-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
