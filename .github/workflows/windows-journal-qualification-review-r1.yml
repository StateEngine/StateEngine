name: Independent journal qualification API readback
'on':
  push:
    branches:
    - prime/windows-journal-qualification-review-r1
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Observe native qualification on a verified owned NTFS volume
      shell: python
      run: 'import base64,hashlib,os,pathlib,subprocess,sys

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])

        data=base64.b64decode('''')

        if hashlib.sha256(data).hexdigest()!=''dced0fd3c46b1ebe0d44b60c3acbba587bc5c0c22ec9c9ef1ec3a192c496c8de'':raise ValueError(''Payload
        differs'')

        (root/''qualification-probe.py'').write_bytes(data)

        data=base64.b64decode('''')

        if hashlib.sha256(data).hexdigest()!=''6bd25faeb58be322c6b9bb54a1cd4fd5923fa13ffb1c7ebc7c7a205b1b50dffc'':raise ValueError(''Payload
        differs'')

        (root/''qualification-volume.py'').write_bytes(data)

        os.environ[''USN_PROBE_SCRIPT'']=str(root/''qualification-probe.py'')

        subprocess.run([sys.executable,''-B'',root/''qualification-volume.py''],check=True)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: independent-journal-qualification-r1
        path: '${{ runner.temp }}/independent-journal-qualification-r1/*.json

          ${{ runner.temp }}/independent-journal-qualification-r1/*.stdout

          ${{ runner.temp }}/independent-journal-qualification-r1/*.stderr'
        if-no-files-found: error
        retention-days: 14
