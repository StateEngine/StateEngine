name: Native runtime rendezvous and held lease comparison
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            source: 0f47ddb7ef5c30fa39de9b77cbb60d7021737c35
            expect: refused
          - label: head
            source: 2931c427a3c75923bc377d1eb456f70689a53680
            expect: recovered
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 84c4ff923187ece5af3826e1714f9ddaba419478
          path: controls
          sparse-checkout: crates/se/tests/review_runtime_rendezvous
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read pinned compiler
        id: compiler
        shell: python
        run: |
          import os,tomllib
          from pathlib import Path
          channel=tomllib.loads(Path('source/rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: print('channel='+channel,file=out)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Register the disposable native runner account
        shell: python
        run: |
          import os,pwd,subprocess
          from pathlib import Path
          entry=pwd.getpwuid(os.geteuid())
          script=Path('source/scripts/ci/installation_account.py').resolve()
          subprocess.run(['python3',str(script),'--help'],check=True)
          subprocess.run(['sudo','python3',str(script),'provision','--identity',str(entry.pw_uid),'--profile',entry.pw_dir],check=True)
      - name: Build pinned CLI and independent connection barrier
        shell: python
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          source=Path('source').resolve()
          controls=Path('controls/crates/se/tests/review_runtime_rendezvous').resolve()
          out=Path(os.environ['RUNNER_TEMP'])/'rendezvous-evidence'
          out.mkdir()
          target=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip()
          assert target.endswith('-unknown-linux-gnu'),target
          commit=subprocess.check_output(['git','rev-parse','HEAD'],cwd=source,text=True).strip()
          assert commit==os.environ['EXPECTED_SOURCE'],commit
          env=dict(os.environ,CARGO_TARGET_DIR=str(out/'target'),CARGO_INCREMENTAL='0',CARGO_BUILD_JOBS='2',CARGO_PROFILE_DEV_DEBUG='0')
          command=['cargo','build','--locked','--target',target,'-p','se']
          (out/'inputs.json').write_text(json.dumps({'source':commit,'build':command,
              'compiler':subprocess.check_output(['rustc','-vV'],text=True),
              'controls':{n:hashlib.sha256((controls/n).read_bytes()).hexdigest() for n in ['control.py','connect.c']}},indent=2))
          with (out/'build.log').open('w') as log:
              result=subprocess.run(command,cwd=source,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=1200)
          if result.returncode:raise SystemExit(result.returncode)
          subprocess.run(['cc','-O1','-Wall','-Wextra','-Werror','-shared','-fPIC',str(controls/'connect.c'),'-ldl','-o',str(out/'connect.so')],check=True)
          image=out/'target'/target/'debug/se'
          with (out/'help.log').open('w') as log:subprocess.run([str(image),'--help'],check=True,stdout=log,stderr=subprocess.STDOUT)
          (out/'binary.txt').write_text(str(image))
      - name: Exercise real route authentication window and genuinely held lease
        shell: python
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          import os,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'rendezvous-evidence'
          script=Path('controls/crates/se/tests/review_runtime_rendezvous/control.py').resolve()
          with (out/'control.log').open('w') as log:
              result=subprocess.run(['python3','-B',str(script),'--source',str(Path('source').resolve()),
                  '--se',(out/'binary.txt').read_text(),'--hook',str(out/'connect.so'),
                  '--out',str(out/'results'),'--expect',os.environ['EXPECT']],stdout=log,stderr=subprocess.STDOUT,timeout=420)
          raise SystemExit(result.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-rendezvous-${{ matrix.label }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/rendezvous-evidence/inputs.json
            ${{ runner.temp }}/rendezvous-evidence/build.log
            ${{ runner.temp }}/rendezvous-evidence/help.log
            ${{ runner.temp }}/rendezvous-evidence/control.log
            ${{ runner.temp }}/rendezvous-evidence/results/summary.json
            ${{ runner.temp }}/rendezvous-evidence/results/**/outside-report.json
            ${{ runner.temp }}/rendezvous-evidence/results/**/connections.jsonl
            ${{ runner.temp }}/rendezvous-evidence/results/**/up.stdout
            ${{ runner.temp }}/rendezvous-evidence/results/**/up.stderr
