name: Linux complete and in-flight output observation
on:
  push:
    branches: [prime/linux-live-output-r5]
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-live-output-inflight-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PRIOR_RUN: '43667160972'
      OUTPUT_RESULT_DELAY_MS: '0'
      OUTPUT_BOTH_COHORTS: '1'
      MEASURE_SOURCE: b7a3c1c5d9d4f016b237a97c5c0d883645276eda
    steps:
      - name: Initialize isolated evidence paths
        run: |
          echo "MEASURE_ROOT=$RUNNER_TEMP/live-output" >> "$GITHUB_ENV"
          echo "EVIDENCE_ROOT=$RUNNER_TEMP/live-output-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3752e42c97f7cb0bec850d75f89b4f4a00ec2f37
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Read committed compiler version
        id: compiler
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          source = os.environ['MEASURE_SOURCE']
          text = subprocess.check_output(['git', 'show', source + ':rust-toolchain.toml'], text=True)
          channel = tomllib.loads(text)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={channel}\n')
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rust-docs, llvm-tools-preview
      - name: Check observer syntax
        run: python3 -B -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('scripts/live_output_observe').glob('*.py')]"
      - name: Join the original package observation before reusing its archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "$PRIOR_RUN" -R "$GITHUB_REPOSITORY" --interval 60
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-live-output
          run-id: 43667160972
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-package
      - name: Verify the identical native package and observe output before turn completion
        run: python3 -B scripts/live_output_observe/reuse.py "$RUNNER_TEMP/original-package" "$MEASURE_ROOT"
      - name: Attribute stages with a separately identified diagnostic image
        run: python3 -B scripts/live_output_observe/diagnose.py "$MEASURE_ROOT"
      - name: Collect evidence without private homes or compilation caches
        if: ${{ always() }}
        run: python3 -B scripts/live_output_observe/collect.py "$MEASURE_ROOT" "$EVIDENCE_ROOT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: linux-live-output-r5
          path: ${{ runner.temp }}/live-output-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
