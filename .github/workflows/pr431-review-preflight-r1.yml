name: Independent Git status fixture macOS preflight
'on':
  push:
    branches:
    - prime/pr431-review-preflight-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  preflight:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 19117f4fde2204c39b4a352291a856aca25654a6
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: git2-status-389-v1-macos-15
        cache-workspace-crates: false
    - name: Compile independent fixture natively before judging
      shell: python
      run: 'import base64,hashlib,os,subprocess,sys

        from pathlib import Path

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''b067a15488dbd02b0a06d68a78b117d756f9df688e94adc63db32f5bd4f5724d''

        p=Path(os.environ["RUNNER_TEMP"])/''review431-preflight.py''

        p.write_bytes(data)

        raise SystemExit(subprocess.call([sys.executable,"-B",str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: review431-macos-preflight
        path: ${{ runner.temp }}/review431-preflight/
        include-hidden-files: true
        if-no-files-found: error
