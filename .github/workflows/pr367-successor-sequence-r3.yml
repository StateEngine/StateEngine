name: Observe a healthy Atlas successor after runaway containment
'on':
  push:
    branches:
    - prime/pr367-successor-sequence-r3
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: d4edee95c9b913b91c8a2d2eea9a99e6410796cc
        persist-credentials: false
    - uses: ./.github/actions/rust
    - name: Stage frozen development observer
      shell: python
      run: 'from pathlib import Path

        import base64,os

        r=Path(os.environ["RUNNER_TEMP"])/"successor-probe"

        r.mkdir()

        files={''cold_successor_sequence.rs'': '''', ''run_probe.py'': '''', ''produce_windows.py'': '''', ''phase-trace.json'': ''''}

        for name,data in files.items(): (r/name).write_bytes(base64.b64decode(data))

        '
    - name: Build observer and observe the authenticated shipping worker
      shell: python
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'from pathlib import Path

        import os,subprocess

        r=Path(os.environ["RUNNER_TEMP"])/"successor-probe"

        raise SystemExit(subprocess.run(["python","-B",str(r/"produce_windows.py")]).returncode)

        '
    - name: Hash finite evidence and portable capsule
      if: ${{ always() }}
      shell: python
      run: "from pathlib import Path\nimport os,json,hashlib\nr=Path(os.environ[\"RUNNER_TEMP\"])/\"successor-probe/evidence\"\nif r.exists():\n files=[{\"file\":p.relative_to(r).as_posix(),\"bytes\":p.stat().st_size,\"sha256\":hashlib.file_digest(p.open(\"rb\"),\"sha256\").hexdigest()} for p in sorted(r.rglob(\"*\")) if p.is_file() and p.name!=\"artifact-manifest.json\"]\n (r/\"artifact-manifest.json\").write_text(json.dumps(files,indent=2)+\"\\n\")\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: pr367-successor-sequence-r3
        path: ${{ runner.temp }}/successor-probe/evidence
        retention-days: 2
        compression-level: 0
        if-no-files-found: error
