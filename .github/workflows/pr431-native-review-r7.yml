name: Independent Git status native controls r7
'on':
  push:
    branches:
    - prime/pr431-native-review-r7
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 6ef9ea1c73d7851828bc97c995749de06a7edbad
        persist-credentials: false
        fetch-depth: 8
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: git2-status-389-v1-${{ matrix.os }}
        cache-workspace-crates: false
    - name: Judge deadline, reservation, Git parity, public consumer and native notices
      shell: python
      run: 'import base64,hashlib,os,subprocess,sys

        from pathlib import Path

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''98a93f70477f57653bb7247f508d72cc2afcf354056a0c199b30ac6e74e8b305''

        p=Path(os.environ["RUNNER_TEMP"])/"review431-runner-r7.py"

        p.write_bytes(data)

        raise SystemExit(subprocess.call([sys.executable,"-B",str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: review431-native-${{ matrix.os }}
        path: ${{ runner.temp }}/review431-results/
        include-hidden-files: true
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-2025
        - macos-15
