name: 5e-381-cold-pair-profile

# Temporary judging workflow for issue 381 (cold-pairing tail bound).
# Lives on the 5e branch only; it never lands on main. The judge pairs a
# fresh source home against a fresh loopback destination user over a local
# sshd and measures per-attempt wall time with process profiles.

on:
  push:
    branches: [5e/381-cold-pair-profile-20261115]
  workflow_dispatch:

concurrency:
  group: 5e-381-cold-pair-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: cold-pair ${{ matrix.run.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run:
          - name: base
            ref: bda8e1e7a2c7905cb9b8537c35aad29e9242cb99
            attempts: 5
            tail-bound-sec: null
    steps:
      - name: Checkout ${{ matrix.run.name }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.run.ref }}

      - name: Rust CI tools
        uses: ./.github/actions/rust

      - name: Build se (release)
        run: cargo build --release --locked -p se

      - name: Loopback sshd on 127.0.0.1:2222
        run: |
          set -e
          mkdir -p /tmp/se381-sshd
          # This runner image does not pre-create sshd's privilege separation dir.
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd
          sudo ssh-keygen -t ed25519 -N '' -f /tmp/se381-sshd/host_key -q
          sudo /usr/sbin/sshd \
            -p 2222 \
            -o ListenAddress=127.0.0.1 \
            -o HostKey=/tmp/se381-sshd/host_key \
            -o PidFile=/tmp/se381-sshd/sshd.pid \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o UsePAM=no \
            -o PrintMotd=no \
            -o X11Forwarding=no \
            -o AuthorizedKeysFile=.ssh/authorized_keys
          sleep 1
          sudo cat /tmp/se381-sshd/sshd.pid
          ssh-keyscan -p 2222 127.0.0.1 >/dev/null

      - name: Runner identity key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -C se381-cold-pair -q
          chmod 600 ~/.ssh/id_ed25519

      - name: Judge cold pairings (${{ matrix.run.name }})
        env:
          ATTEMPTS: ${{ matrix.run.attempts }}
          TAIL_BOUND: ${{ matrix.run.tail-bound-sec }}
        run: |
          set -e
          args=(--se "$GITHUB_WORKSPACE/target/release/se"
                --output "$GITHUB_WORKSPACE/cold-pair-results/${{ matrix.run.name }}"
                --attempts "$ATTEMPTS"
                --identity "$HOME/.ssh/id_ed25519"
                --ssh-port 2222)
          if [ -n "$TAIL_BOUND" ]; then
            args+=(--tail-bound-sec "$TAIL_BOUND")
          fi
          python3 scripts/cold-pair-profile.py "${args[@]}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cold-pair-${{ matrix.run.name }}
          path: cold-pair-results/${{ matrix.run.name }}
          if-no-files-found: error
