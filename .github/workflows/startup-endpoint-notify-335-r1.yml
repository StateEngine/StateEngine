name: Endpoint publication notification native development checks r1
'on':
  push:
    branches:
    - prime/startup-endpoint-notify-335-r1
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-2025
        - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 21f2f7000449ea0e6d096a46a7590d46e5f8cebe
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: endpoint-notify-335-r1-${{ matrix.os }}
        cache-workspace-crates: false
    - name: Gate native fixtures and run unchanged native consumers
      shell: python
      run: 'import ast,base64,hashlib,os,pathlib,subprocess,sys

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''724c60edc535ced4db791f12d2d2991e902106e0e34e59331279cfd9fa6547f1''

        ast.parse(data)

        p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''endpoint-notify-recorder.py''

        p.write_bytes(data)

        subprocess.run([sys.executable,''-B'',str(p)],check=True)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: endpoint-notify-335-r1-${{ matrix.os }}
        path: ${{ runner.temp }}/endpoint-notify-checks
        if-no-files-found: error
        retention-days: 14
