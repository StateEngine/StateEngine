name: External native ancestry observation
'on':
  push:
    branches:
    - prime/external-ancestry-414-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
    env:
      ARM: ${{ matrix.arm }}
      PRODUCT_SOURCE: ${{ matrix.source }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: external414-stock-native
    - name: Stage external controls and native service dependency
      shell: python
      run: |
        import base64,hashlib,json,os,subprocess,sys,urllib.request
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'external414';root.mkdir()
        controls=root/'controls';controls.mkdir()
        code={'ancestry_trace.py': '', 'build.py': '', 'owned_family.py': '', 'preflight.py': '', 'public_windows.py': '', 'run-standard-user.py': '', 'scm-broker.py': '', 'service-probe.py': '', 'token_context.py': '', 'trace_schema.py': '', 'worker-entry.py': ''}
        for name,encoded in code.items():
         raw=base64.b64decode(encoded);compile(raw.decode(),name,'exec');(controls/name).write_bytes(raw)
        (root/'inputs.json').write_text(json.dumps({name:hashlib.sha256((controls/name).read_bytes()).hexdigest() for name in code},indent=2)+'\n')
        url='https://files.pythonhosted.org/packages/03/d9/77040d3b43df3f3be32ea289433d660d2727f5ba327bc73be835127d9d60/pywin32-312-cp312-cp312-win_amd64.whl'
        raw=urllib.request.urlopen(url).read();assert hashlib.sha256(raw).hexdigest()=='b457f6d628a47e8a7346ce22acb7e1a46a4a78b52e1d17e1af56871bd19a93bc'
        wheel=root/'pywin32-312-cp312-cp312-win_amd64.whl';wheel.write_bytes(raw)
        subprocess.run([sys.executable,'-m','pip','install','--no-user','--no-deps','--no-index',str(wheel)],check=True)
        with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('REVIEW414_ROOT='+str(root)+'\n')
    - name: Validate native trace ABI and exited-handle readback
      shell: python
      run: |
        import os,subprocess,sys
        from pathlib import Path
        subprocess.run([sys.executable,'-B',str(Path(os.environ['REVIEW414_ROOT'])/'controls/preflight.py')],check=True)
    - name: Build stock MSVC image without source changes
      shell: python
      run: |
        import os,subprocess,sys
        from pathlib import Path
        subprocess.run([sys.executable,'-B',str(Path(os.environ['REVIEW414_ROOT'])/'controls/build.py')],check=True)
    - name: Eight public init attempts and post-refusal System snapshots
      shell: python
      run: |
        import hashlib,json,os,subprocess,sys
        from pathlib import Path
        root=Path(os.environ['REVIEW414_ROOT']);bundle=root/'bundle';arm=os.environ['ARM']
        manifest=hashlib.sha256((bundle/'manifest.json').read_bytes()).hexdigest()
        command=[sys.executable,'-B',str(root/'controls/service-probe.py'),'--bundle',str(bundle),'--arm',arm,'--out',str(root/'attempt'),'--manifest-sha256',manifest]
        with (root/'consumer.stdout').open('wb') as out,(root/'consumer.stderr').open('wb') as err:
         result=subprocess.run(command,stdin=subprocess.DEVNULL,stdout=out,stderr=err)
        (root/'consumer-exit.json').write_text(json.dumps({'exit':result.returncode,'argv':command})+'\n')
        raise SystemExit(result.returncode)
    - name: Retain complete bounded receipts
      if: always()
      shell: python
      run: |
        import hashlib,json,os,shutil
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'external414';out=root/'retained';out.mkdir()
        for name in ['inputs.json','native-preflight.json','consumer.stdout','consumer.stderr','consumer-exit.json']:
         if (root/name).exists():shutil.copyfile(root/name,out/name)
        for name in ['controls','build']:
         if (root/name).exists():shutil.copytree(root/name,out/name)
        if (root/'attempt/export').exists():shutil.copytree(root/'attempt/export',out/'export')
        files=[p for p in out.rglob('*') if p.is_file()];assert all(not p.is_symlink() for p in files)
        (out/'members.json').write_text(json.dumps({p.relative_to(out).as_posix():hashlib.file_digest(p.open('rb'),'sha256').hexdigest() for p in files},indent=2)+'\n')
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: external-ancestry-414-r1-${{ matrix.arm }}
        path: ${{ runner.temp }}/external414/retained
        if-no-files-found: error
        retention-days: 14
