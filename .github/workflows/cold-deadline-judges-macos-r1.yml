name: Independent native cold source deadline and custody
on:
  push:
    branches: [prime/cold-deadline-judges-macos-r1]
permissions:
  contents: read
concurrency:
  group: cold-deadline-judges-macos-r1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d4edee95c9b913b91c8a2d2eea9a99e6410796cc
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: ./.github/actions/rust
      - name: Run the native consumer with a shipping-feature compact worker
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, shutil, subprocess, time
          source = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if source != 'd4edee95c9b913b91c8a2d2eea9a99e6410796cc':
              raise ValueError('Product source differs')
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          out = root / 'cold-deadline-evidence'
          out.mkdir()
          (out / 'source.txt').write_text(source + '\n')
          judge = base64.b64decode('')
          if hashlib.sha256(judge).hexdigest() != '1b51fbe3997258d0c6fe1527825c9a0694dd79bb2ed215fc138ff8071782d6f5':
              raise ValueError('Independent judge differs')
          pathlib.Path('crates/se-host/tests/cold_deadline_independent.rs').write_bytes(judge)
          (out / 'cold_deadline_independent.rs').write_bytes(judge)
          host = next(line.split(': ',1)[1] for line in subprocess.check_output(['rustc','-vV'],text=True).splitlines() if line.startswith('host: '))
          env = dict(os.environ, CARGO_TARGET_DIR=str(root/'cold-deadline-target'), CARGO_BUILD_JOBS='2', CARGO_INCREMENTAL='0', CARGO_PROFILE_TEST_DEBUG='0', CARGO_PROFILE_RELEASE_OPT_LEVEL='s', CARGO_PROFILE_RELEASE_LTO='false')
          executions = []
          def run(label, command):
              started = time.monotonic_ns()
              with (out/(label+'.log')).open('wb') as output:
                  result = subprocess.run(command, env=env, stdout=output, stderr=subprocess.STDOUT)
              executions.append(dict(label=label, argv=command, exit_code=result.returncode, elapsed_ns=time.monotonic_ns()-started))
              (out/'executions.json').write_text(json.dumps(executions, indent=2)+'\n')
              print((out/(label+'.log')).read_text())
              if result.returncode:
                  raise SystemExit(result.returncode)
          run('build-worker', ['cargo','build','--release','--target',host,'-p','se','--bin','se','--no-default-features','--features','remote','--locked'])
          image = root/'cold-deadline-target'/host/'release/se'
          shutil.copy2(image,out/'se')
          (out/'worker-info.json').write_text(json.dumps(dict(source=source,sha256=hashlib.sha256(image.read_bytes()).hexdigest(),bytes=image.stat().st_size,features=['remote'],opt_level='s',lto=False),indent=2)+'\n')
          env.update(SE_ATLAS_WORKER_BIN=str(image), COLD_JUDGE_ROOT=str(root/'cold-native-private-home'))
          run('cold-native-control', ['cargo','test','--target',host,'-p','se-host','--features','remote','--locked','--test','cold_deadline_independent','--','--nocapture','--test-threads=1'])
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: cold-deadline-native-macos
          path: ${{ runner.temp }}/cold-deadline-evidence
          if-no-files-found: error
          retention-days: 14
