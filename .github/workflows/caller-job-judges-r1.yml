    - name: Parse all scripts in PowerShell 5.1 and 7
      shell: python
      run: "import base64,os,subprocess\nfrom pathlib import Path\nroot=Path(os.environ['CALLER_REVIEW_ROOT'])\n\
        env={k:v for k,v in os.environ.items() if k.casefold()!='psmodulepath'}\nshells=[('ps51',str(Path(os.environ['SystemRoot'])/'System32/WindowsPowerShell/v1.0/powershell.exe')),('ps7','pwsh.exe')]\n\
        for name in ['strict/strict_job.ps1','account/prepare-standard-user.ps1','account/standard-user-bootstrap.ps1']:\n\
        \    script=\"$tokens=$null;$errors=$null;[Management.Automation.Language.Parser]::ParseFile('\"+str(root/'controls'/name).replace(\"\
        '\",\"''\")+\"',[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|Format-List;exit 1};$PSVersionTable.PSVersion.ToString()\"\
        \n    for label,shell in shells:\n        command=[shell,'-NoLogo','-NoProfile','-NonInteractive','-EncodedCommand',base64.b64encode(script.encode('utf-16le')).decode()]\n\
        \        prefix=label+'-'+Path(name).stem\n        with (root/(prefix+'.stdout')).open('wb') as out,(root/(prefix+'.stderr')).open('wb')\
        \ as err:\n            subprocess.run(command,env=env,stdout=out,stderr=err,check=True,timeout=30)"
    - name: Compare main and candidate with broker assertions preserved
      shell: python
      run: 'import os,subprocess,sys

        from pathlib import Path

        root=Path(os.environ[''CALLER_REVIEW_ROOT''])

        subprocess.run([sys.executable,''-B'',str(root/''controls/compare.py'')],check=True)'
    - name: Hash finite evidence and clean-source shipping image
      if: ${{ always() }}
      shell: python
      run: 'import hashlib,json,os

        from pathlib import Path

        root=Path(os.environ[''CALLER_REVIEW_ROOT''])

        hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob(''*'') if
        p.is_file()}

        (root/''sha256sums.json'').write_text(json.dumps(hashes,indent=2)+''\n'')'
