name: Native caller-job reviewer comparison
'on':
  push:
    branches:
    - prime/caller-job-judges-r1
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: caller-job-review-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CALLER_REVIEW_SOURCE: ${{ github.workspace }}/source
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 8ade22d54f4e938a5fbb7f3b5ce51ac09ecc7ace
        path: source
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
        components: rust-docs
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: amd64
    - name: Install identical reviewer controls
      shell: python
      run: "import ast,hashlib,json,os\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'caller-job-review';root.mkdir()\n\
        with open(os.environ['GITHUB_ENV'],'a') as out:out.write('CALLER_REVIEW_ROOT='+str(root)+'\\n')\nfiles={'compare.py':\
        \ '\"\"\"Build and run identical reviewer controls on one native Windows runner.\"\"\"\\nimport hashlib\\\
        nimport json\\nimport os\\nfrom pathlib import Path\\nimport re\\nimport shutil\\nimport subprocess\\nimport\
        \ sys\\n\\nROOT = Path(os.environ[\\'CALLER_REVIEW_ROOT\\'])\\nSOURCE = Path(os.environ[\\'CALLER_REVIEW_SOURCE\\\
        '])\\nBASE = \\'689c05b15fb0a0b36f02f7545e5df55290ef5a9d\\'\\nHEAD = \\'8ade22d54f4e938a5fbb7f3b5ce51ac09ecc7ace\\\
        '\\nCASES = [\\'eligible_broker_runtime_outlives_strict_job_and_public_down_closes_it\\',\\n         \\\
        'explicit_foreground_stays_in_caller_job_until_public_down\\',\\n         \\'no_eligible_broker_returns_background_in_caller_job_and_stops_publicly\\\
        ']\\n\\n\\ndef run(argv, cwd, label, timeout=1800):\\n    with (ROOT / (label + \\'.stdout\\')).open(\\\
        'wb\\') as out, (ROOT / (label + \\'.stderr\\')).open(\\'wb\\') as err:\\n        child = subprocess.Popen(argv,\
        \ cwd=cwd, stdin=subprocess.DEVNULL, stdout=out, stderr=err)\\n        try:\\n            return child.wait(timeout=timeout)\\\
        n        except subprocess.TimeoutExpired:\\n            sys.path.insert(0, str(ROOT / \\'controls/account\\\
        '))\\n            import native_jobs as native\\n            pin = native.Process(child.pid)\\n        \
        \    try:\\n                # This Popen child is ours; read its complete native command and\\n        \
        \        # birth through a retained handle before any emergency signal.\\n                (ROOT / (label\
        \ + \\'-timeout.json\\')).write_text(json.dumps(\\n                    {\\'child\\': pin.initial, \\'argv\\\
        ': argv, \\'cleanup_unknown\\': True}, indent=2))\\n                current = pin.observe()\\n         \
        \       assert current[\\'creation_filetime\\'] == pin.initial[\\'creation_filetime\\']\\n             \
        \   native.require(native.k.TerminateProcess(pin.handle, 91))\\n                child.wait(timeout=10)\\\
        n            finally:\\n                pin.close()\\n            raise\\n\\n\\ndef build(checkout, package,\
        \ test, label):\\n    code = run([\\'cargo\\', \\'test\\', \\'-p\\', package, \\'--all-features\\', \\'--locked\\\
        ', \\'--test\\', test,\\n                \\'--no-run\\', \\'--message-format=json\\'], checkout, label)\\\
        n    assert code == 0, f\\'{label} build failed: {code}\\'\\n    rows = [json.loads(line) for line in (ROOT\
        \ / (label + \\'.stdout\\')).read_text().splitlines()]\\n    binaries = [row[\\'executable\\'] for row in\
        \ rows if row.get(\\'reason\\') == \\'compiler-artifact\\'\\n                and row.get(\\'target\\', {}).get(\\\
        'name\\') == test and row.get(\\'executable\\')]\\n    assert len(binaries) == 1\\n    return binaries[0]\\\
        n\\n\\ndef collect_public_case(label):\\n    text = (ROOT / (label + \\'.stderr\\')).read_text(errors=\\\
        'replace\\')\\n    roots = re.findall(r\\'(?:fixture root \\\\(retained if interrupted or cleanup is unproved\\\
        \\)|retained fixture root after incomplete or failed case): ([^\\\\r\\\\n\\\\x1b]+)\\', text)\\n    for\
        \ index, name in enumerate(dict.fromkeys(roots)):\\n        source = Path(name.strip())\\n        if not\
        \ source.is_dir():\\n            continue\\n        out = ROOT / (label + \\'-case-\\' + str(index))\\n\
        \        out.mkdir()\\n        # No database, profile, credential, nonce channel or private state files.\\\
        n        for filename in [\\'job.json\\', \\'json.stdout\\', \\'json.stderr\\', \\'json.exit\\',\\n    \
        \                     \\'plain.stdout\\', \\'plain.stderr\\', \\'plain.exit\\']:\\n            path = source\
        \ / filename\\n            if path.is_file():\\n                shutil.copyfile(path, out / filename)\\\
        n\\n\\ndef main():\\n    results = {}\\n    for label, revision in [(\\'base\\', BASE), (\\'head\\', HEAD)]:\\\
        n        checkout = ROOT.parent / (\\'caller-source-\\' + label)\\n        subprocess.run([\\'git\\', \\\
        'worktree\\', \\'add\\', \\'--detach\\', str(checkout), revision], cwd=SOURCE, check=True)\\n        assert\
        \ subprocess.check_output([\\'git\\', \\'rev-parse\\', \\'HEAD\\'], cwd=checkout, text=True).strip() ==\
        \ revision\\n        os.environ[\\'CARGO_TARGET_DIR\\'] = str(ROOT.parent / (\\'caller-target-\\' + label))\\\
        n        for source, target in [(\\'breakaway_refusal.rs\\', \\'crates/se/tests/breakaway_refusal.rs\\'),\\\
        n                               (\\'strict_job.ps1\\', \\'crates/se/tests/support/strict_job.ps1\\'),\\\
        n                               (\\'bootstrap_stderr.rs\\', \\'crates/se-proc/tests/bootstrap_stderr.rs\\\
        ')]:\\n            shutil.copyfile(ROOT / \\'controls/strict\\' / source, checkout / target)\\n        binary\
        \ = build(checkout, \\'se\\', \\'breakaway_refusal\\', label + \\'-cli-build\\')\\n        rows = []\\n\
        \        for case in CASES:\\n            name = label + \\'-\\' + case\\n            code = run([binary,\
        \ \\'--exact\\', case, \\'--nocapture\\', \\'--test-threads=1\\'], checkout, name, 180)\\n            collect_public_case(name)\\\
        n            rows.append({\\'case\\': case, \\'exit\\': code})\\n        bootstrap = build(checkout, \\\
        'se-proc\\', \\'bootstrap_stderr\\', label + \\'-bootstrap-build\\')\\n        code = run([bootstrap], checkout,\
        \ label + \\'-bootstrap\\', 180)\\n        rows.append({\\'case\\': \\'bootstrap_stderr\\', \\'exit\\':\
        \ code})\\n        results[label] = {\\'source\\': revision, \\'cases\\': rows}\\n        (ROOT / \\'comparison.json\\\
        ').write_text(json.dumps(results, indent=2) + \\'\\\\n\\')\\n        # Build processes and every native\
        \ judge have returned before their\\n        # checkout-specific compiler scratch is removed.\\n       \
        \ shutil.rmtree(Path(os.environ[\\'CARGO_TARGET_DIR\\']))\\n    # A clean checkout runs the actual shipping\
        \ producer. Reviewer overlays must\\n    # never enter its clean-source or release-build manifest.\\n  \
        \  checkout = ROOT.parent / \\'caller-distribution-source\\'\\n    subprocess.run([\\'git\\', \\'worktree\\\
        ', \\'add\\', \\'--detach\\', str(checkout), HEAD], cwd=SOURCE, check=True)\\n    os.environ.pop(\\'CARGO_PROFILE_DEV_DEBUG\\\
        ', None)\\n    os.environ.pop(\\'CARGO_PROFILE_TEST_DEBUG\\', None)\\n    os.environ.pop(\\'CARGO_TARGET_DIR\\\
        ', None)\\n    image = ROOT / \\'distribution\\'\\n    code = run([sys.executable, \\'-B\\', \\'scripts/release/build.py\\\
        ', \\'--target\\', \\'x86_64-pc-windows-msvc\\',\\n                \\'--out\\', str(image)], checkout, \\\
        'distribution-build\\', 3600)\\n    assert code == 0, f\\'actual shipping producer failed: {code}\\'\\n\
        \    manifest = json.loads((image / \\'build.json\\').read_text())\\n    digest = hashlib.sha256((image\
        \ / \\'se.exe\\').read_bytes()).hexdigest()\\n    assert manifest[\\'source_commit\\'] == HEAD and manifest[\\\
        'files\\'][\\'se.exe\\'] == digest\\n    account = ROOT / \\'controls/account\\'\\n    expected = {\\'source\\\
        ': HEAD, \\'image_sha256\\': digest}\\n    (account / \\'expected.json\\').write_text(json.dumps(expected,\
        \ indent=2) + \\'\\\\n\\')\\n    files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in account.iterdir()\
        \ if p.is_file()}\\n    (account / \\'manifest.json\\').write_text(json.dumps(expected | {\\'files\\': files},\
        \ indent=2) + \\'\\\\n\\')\\n    (ROOT / \\'image-pin.json\\').write_text(json.dumps(expected, indent=2)\
        \ + \\'\\\\n\\')\\n    print(json.dumps(results))\\n\\n\\nif __name__ == \\'__main__\\':\\n    main()\\\
        n', 'strict/breakaway_refusal.rs': '//! Public CLI success and honest refusal from actual strict Windows\
        \ jobs.\\n#![cfg(windows)]\\n#[path = \"../../test-support/directory.rs\"]\\nmod cleanup_directory;\\nuse\
        \ std::{\\n    error::Error,\\n    fs,\\n    path::PathBuf,\\n    process::{Command, Output},\\n    time::{Duration,\
        \ Instant},\\n};\\ntype Result<T = ()> = std::result::Result<T, Box<dyn Error>>;\\nfn clear(command: &mut\
        \ Command) {\\n    for key in [\\n        \"SE_HOME\",\\n        \"SE_CONFIG\",\\n        \"SE_PROJECT\"\
        ,\\n        \"SE_SESSION\",\\n        \"CLAUDECODE\",\\n        \"CODEX_THREAD_ID\",\\n        \"CODEX_CI\"\
        ,\\n    ] {\\n        command.env_remove(key);\\n    }\\n}\\nstruct Fixture {\\n    root: PathBuf,\\n  \
        \  executable: PathBuf,\\n    home: PathBuf,\\n    host: Option<se_proc::ProcessIdentity>,\\n    root_owner:\
        \ Option<cleanup_directory::PrivateDirectory>,\\n}\\nimpl Fixture {\\n    fn new(_case: &str) -> Result<Self>\
        \ {\\n        se_proc::initialize_file_creation_owner()?;\\n        let root_owner = cleanup_directory::private_case_directory()?;\\\
        n        let root = root_owner.to_path_buf();\\n        drop(se_proc::NativeStateFiles::create(&root)?);\\\
        n        // Cargo hard-links its binary; the installed runtime requires a single-link image.\\n        let\
        \ executable = root.join(\"se.exe\");\\n        fs::copy(env!(\"CARGO_BIN_EXE_se\"), &executable)?;\\n \
        \       let mut fixture = Self {\\n            home: root.join(\"state\"),\\n            root,\\n      \
        \      executable,\\n            host: None,\\n            root_owner: Some(root_owner),\\n        };\\\
        n        fs::create_dir(fixture.root.join(\"repo\"))?;\\n        fixture.ok(&[\\n            \"init\",\\\
        n            \"--repo\",\\n            fixture\\n                .root\\n                .join(\"repo\"\
        )\\n                .to_str()\\n                .ok_or(\"non-UTF8 fixture\")?,\\n        ])?;\\n       \
        \ fs::write(\\n            fixture.root.join(\"strict-job.ps1\"),\\n            include_str!(\"support/strict_job.ps1\"\
        ),\\n        )?;\\n        // Keep the guard active even if a later assertion or native read fails.\\n \
        \       fixture.host = fixture.read_host()?;\\n        Ok(fixture)\\n    }\\n    fn command(&self) -> Command\
        \ {\\n        let mut command = Command::new(&self.executable);\\n        clear(&mut command);\\n      \
        \  command\\n            .arg(\"--home\")\\n            .arg(&self.home)\\n            .arg(\"--json\")\\\
        n            .current_dir(&self.root);\\n        command\\n    }\\n    fn ok(&self, args: &[&str]) -> Result<serde_json::Value>\
        \ {\\n        let output = self.command().args(args).output_executable()?;\\n        assert!(\\n       \
        \     output.status.success(),\\n            \"public CLI failed; retained {}: {output:?}\",\\n        \
        \    self.root.display()\\n        );\\n        Ok(serde_json::from_slice(&output.stdout)?)\\n    }\\n \
        \   fn read_host(&self) -> Result<Option<se_proc::ProcessIdentity>> {\\n        let path = self.home.join(\"\
        endpoint.json\");\\n        if !path.try_exists()? {\\n            return Ok(None);\\n        }\\n     \
        \   let endpoint = se_host::client::endpoint::decode_endpoint(&fs::read(path)?)?;\\n        let fields =\
        \ endpoint.epoch.owner.fields();\\n        let observed = se_proc::NativeProcessRuntime::read_process(\\\
        n            fields.machine.clone(),\\n            se_proc::ProcessId(fields.pid.get()),\\n        )\\n\
        \        .map_err(|e| format!(\"outside exact runtime read: {e:?}\"))?;\\n        let se_proc::ProcessRead::Present(live)\
        \ = observed else {\\n            return Err(\"published host is not live\".into());\\n        };\\n   \
        \     assert_eq!(\\n            fs::canonicalize(&live.identity.image)?,\\n            fs::canonicalize(&self.executable)?\\\
        n        );\\n        let se_types::StartIdentity::Windows { creation_filetime } = &fields.started else\
        \ {\\n            return Err(\"endpoint does not carry a Windows process birth\".into());\\n        };\\\
        n        assert_eq!(\\n            live.identity.start,\\n            se_proc::StartIdentity::Windows {\\\
        n                creation_filetime: creation_filetime.get()\\n            }\\n        );\\n        Ok(Some(live.identity))\\\
        n    }\\n    fn run_strict(&mut self, refuse: bool, foreground: bool) -> Result {\\n        let powershell\
        \ = se_proc::windows_directory()\\n            .map_err(|e| format!(\"native Windows directory: {e:?}\"\
        ))?\\n            .join(\"System32/WindowsPowerShell/v1.0/powershell.exe\");\\n        let mut command =\
        \ Command::new(powershell);\\n        clear(&mut command);\\n        command\\n            .args([\"-NoProfile\"\
        , \"-ExecutionPolicy\", \"Bypass\", \"-File\"])\\n            .arg(self.root.join(\"strict-job.ps1\"))\\\
        n            .arg(\"-Se\")\\n            .arg(&self.executable)\\n            .arg(\"-HomePath\")\\n   \
        \         .arg(&self.home)\\n            .arg(\"-Out\")\\n            .arg(&self.root);\\n        if refuse\
        \ {\\n            command.arg(\"-NoEligibleBroker\");\\n        }\\n        if foreground {\\n         \
        \   command.arg(\"-Foreground\");\\n        }\\n        let output = command.output_executable()?;\\n  \
        \      // This outside reader runs only after the strict-job shell has exited.\\n        self.host = self.read_host()?;\\\
        n        assert!(\\n            output.status.success(),\\n            \"strict-job fixture failed; retained\
        \ {}: {output:?}\",\\n            self.root.display()\\n        );\\n        let witness: serde_json::Value\
        \ =\\n            serde_json::from_slice(&fs::read(self.root.join(\"job.json\"))?)?;\\n        assert_eq!(witness[\"\
        caller_in_job_before\"], true);\\n        assert_eq!(witness[\"caller_in_job_after\"], true);\\n       \
        \ assert_eq!(witness[\"privilege_removed\"], refuse);\\n        assert_eq!(witness[\"restricting_sids\"\
        ], false);\\n        assert_eq!(witness[\"home_readable_after_restriction\"], true);\\n        if refuse\
        \ {\\n            assert!(matches!(\\n                witness[\"removed_privilege\"].as_str(),\\n      \
        \          Some(\\n                    \"SeShutdownPrivilege\"\\n                        | \"SeTimeZonePrivilege\"\
        \\n                        | \"SeIncreaseWorkingSetPrivilege\"\\n                        | \"SeUndockPrivilege\"\
        \\n                )\\n            ));\\n        } else {\\n            assert!(witness[\"removed_privilege\"\
        ].is_null());\\n        }\\n        Ok(())\\n    }\\n    fn result(&self, mode: &str) -> Result<(String,\
        \ Vec<u8>, String)> {\\n        Ok((\\n            fs::read_to_string(self.root.join(format!(\"{mode}.exit\"\
        )))?\\n                .trim()\\n                .into(),\\n            fs::read(self.root.join(format!(\"\
        {mode}.stdout\")))?,\\n            fs::read_to_string(self.root.join(format!(\"{mode}.stderr\")))?,\\n \
        \       ))\\n    }\\n    fn exited(&self, identity: &se_proc::ProcessIdentity) -> Result<bool> {\\n    \
        \    match se_proc::NativeProcessRuntime::read_process(identity.machine.clone(), identity.pid)\\n      \
        \      .map_err(|e| format!(\"outside runtime closure: {e:?}\"))?\\n        {\\n            se_proc::ProcessRead::Absent\
        \ { .. } => Ok(true),\\n            se_proc::ProcessRead::ExitedRecord {\\n                pid, boot, start,\
        \ ..\\n            } if pid == identity.pid && boot == identity.boot && start == identity.start => {\\n\
        \                Ok(true)\\n            }\\n            se_proc::ProcessRead::Present(live) if live.identity\
        \ == *identity => {\\n                Ok(live.state == se_proc::NativeState::ExitedAwaitingReap)\\n    \
        \        }\\n            _ => Err(\"runtime identity changed; refusing another process\".into()),\\n   \
        \     }\\n    }\\n    fn stop(&mut self) -> Result {\\n        // Public down resolves only this fresh protected\
        \ home\\'s owned endpoint.\\n        // It also cleans a host when a preceding assertion failed before identity\
        \ capture.\\n        if self.home.join(\"endpoint.json\").try_exists()? {\\n            let output: Output\
        \ = self.command().arg(\"down\").output_executable()?;\\n            if !matches!(output.status.code(),\
        \ Some(0) | Some(2)) {\\n                return Err(format!(\\n                    \"public down failed;\
        \ retained {}: {output:?}\",\\n                    self.root.display()\\n                )\\n          \
        \      .into());\\n            }\\n        }\\n        if let Some(identity) = &self.host {\\n         \
        \   let until = Instant::now() + Duration::from_secs(15);\\n            while !self.exited(identity)? {\\\
        n                if Instant::now() >= until {\\n                    return Err(\"exact broker runtime did\
        \ not exit\".into());\\n                }\\n                std::thread::park_timeout(Duration::from_millis(10));\\\
        n            }\\n        }\\n        if self.home.join(\"endpoint.json\").try_exists()? {\\n           \
        \ return Err(\"endpoint survived public shutdown\".into());\\n        }\\n        let path = self.home.join(\"\
        runtime.lock\");\\n        if path.try_exists()? {\\n            let lease = fs::OpenOptions::new().read(true).write(true).open(path)?;\\\
        n            lease.try_lock()?;\\n        }\\n        self.host = None;\\n        Ok(())\\n    }\\n    fn\
        \ finish(mut self) -> Result {\\n        self.stop()?;\\n        self.root_owner\\n            .as_ref()\\\
        n            .ok_or(\"strict-job fixture owner absent\")?\\n            .finish(Ok(()))\\n    }\\n}\\nimpl\
        \ Drop for Fixture {\\n    fn drop(&mut self) {\\n        if self.root.exists()\\n            && let Err(error)\
        \ = self.stop()\\n            && let Some(root) = self.root_owner.take()\\n        {\\n            root.retain(&format!(\"\
        strict-job shutdown failed: {error}\"));\\n        }\\n    }\\n}\\n\\n#[test]\\nfn eligible_broker_runtime_outlives_strict_job_and_public_down_closes_it()\
        \ -> Result {\\n    let mut f = Fixture::new(\"broker\")?;\\n    f.run_strict(false, false)?;\\n    let\
        \ identity = f\\n        .host\\n        .as_ref()\\n        .ok_or(\"eligible broker did not retain a live\
        \ host after job exit\")?;\\n    for mode in [\"json\", \"plain\"] {\\n        let (exit, stdout, stderr)\
        \ = f.result(mode)?;\\n        assert_eq!(exit, \"0\", \"broker launch refused: {stderr}\");\\n        if\
        \ mode == \"json\" {\\n            let value: serde_json::Value = serde_json::from_slice(&stdout)?;\\n \
        \           assert_eq!(value[\"state\"], \"running\");\\n            assert_eq!(value[\"process\"][\"pid\"\
        ], identity.pid.0);\\n        } else {\\n            let text = String::from_utf8(stdout)?;\\n         \
        \   assert!(\\n                text.contains(\"Runtime running\")\\n                    && text.contains(&format!(\"\
        PID {}\", identity.pid.0)),\\n                \"wrong human startup output: {text}\"\\n            );\\\
        n        }\\n    }\\n    let witness: serde_json::Value = serde_json::from_slice(&fs::read(f.root.join(\"\
        job.json\"))?)?;\\n    assert_eq!(witness[\"runtime_outside_all_jobs\"], true);\\n    assert_eq!(witness[\"\
        runtime_pid\"], identity.pid.0);\\n    let birth = witness[\"runtime_creation_filetime\"]\\n        .as_str()\\\
        n        .ok_or(\"missing outside native process birth\")?\\n        .parse::<u64>()?;\\n    assert_eq!(\\\
        n        identity.start,\\n        se_proc::StartIdentity::Windows {\\n            creation_filetime: birth\\\
        n        }\\n    );\\n    let status = f.ok(&[\"status\"])?;\\n    assert_eq!(status[\"runtime\"][\"state\"\
        ], \"running\");\\n    assert_eq!(status[\"runtime\"][\"process\"][\"pid\"], identity.pid.0);\\n    f.stop()?;\\\
        n    println!(\\n        \"PASS broker: JSON/plain CLI success; caller stayed in strict job; exact runtime\
        \ outside all jobs survived job exit; public down closed it\"\\n    );\\n    f.finish()\\n}\\n\\n#[test]\\\
        nfn explicit_foreground_stays_in_caller_job_until_public_down() -> Result {\\n    let mut f = Fixture::new(\"\
        no-broker\")?;\\n    f.run_strict(true, true)?;\\n    assert!(\\n        f.host.is_none(),\\n        \"\
        foreground host survived its joined public down\"\\n    );\\n    let witness: serde_json::Value = serde_json::from_slice(&fs::read(f.root.join(\"\
        job.json\"))?)?;\\n    let cases = witness[\"foreground_cases\"]\\n        .as_array()\\n        .ok_or(\"\
        missing foreground cases\")?;\\n    assert_eq!(cases.len(), 2);\\n    for mode in [\"json\", \"plain\"]\
        \ {\\n        let (exit, stdout, stderr) = f.result(mode)?;\\n        assert_eq!(exit, \"0\", \"foreground\
        \ startup/down failed: {stderr}\");\\n        let observed = cases\\n            .iter()\\n            .find(|row|\
        \ row[\"mode\"] == mode)\\n            .ok_or(\"missing mode witness\")?;\\n        assert_eq!(observed[\"\
        in_job\"], true);\\n        assert_eq!(observed[\"down_exit\"], 0);\\n        if mode == \"json\" {\\n \
        \           let value: serde_json::Value = serde_json::from_slice(&stdout)?;\\n            assert_eq!(value[\"\
        state\"], \"running\");\\n            assert_eq!(value[\"process\"][\"pid\"], observed[\"pid\"]);\\n   \
        \     } else {\\n            let text = String::from_utf8(stdout)?;\\n            assert!(\\n          \
        \      text.contains(\"Runtime running\")\\n                    && text.contains(&format!(\"PID {}\", observed[\"\
        pid\"])),\\n                \"wrong foreground output: {text}\"\\n            );\\n        }\\n    }\\n\
        \    f.finish()\\n}\\n\\n#[test]\\nfn no_eligible_broker_returns_background_in_caller_job_and_stops_publicly()\
        \ -> Result {\\n    let mut f = Fixture::new(\"caller-job\")?;\\n    f.run_strict(true, false)?;\\n    assert!(\\\
        n        f.host.is_none(),\\n        \"caller-job host survived its witnessed public down\"\\n    );\\n\
        \    let witness: serde_json::Value = serde_json::from_slice(&fs::read(f.root.join(\"job.json\"))?)?;\\\
        n    let cases = witness[\"background_cases\"]\\n        .as_array()\\n        .ok_or(\"missing background\
        \ cases\")?;\\n    assert_eq!(cases.len(), 2);\\n    for mode in [\"json\", \"plain\"] {\\n        let (exit,\
        \ stdout, stderr) = f.result(mode)?;\\n        assert_eq!(exit, \"0\", \"background startup failed: {stderr}\"\
        );\\n        assert!(\\n            stderr.contains(\"Windows may stop this background host\"),\\n     \
        \       \"caller-job lifetime hidden: {stderr}\"\\n        );\\n        let observed = cases\\n        \
        \    .iter()\\n            .find(|row| row[\"mode\"] == mode)\\n            .ok_or(\"missing mode witness\"\
