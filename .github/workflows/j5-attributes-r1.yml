name: Windows uninstall attribute and mapped-image diagnosis
'on':
  push:
    branches:
    - prime/j5-attributes-r1
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        features:
        - default
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 672c8d5aaaa882a7de66dfb8ff3f83b6886a37a3
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Register disposable runner account
      shell: bash
      run: 'python scripts/ci/installation_account.py provision

        python scripts/ci/installation_account.py check

        '
    - name: Extract frozen public-consumer invocation
      shell: python
      run: "import base64,hashlib,os\nfrom pathlib import Path\nr=Path(os.environ[\"\
        RUNNER_TEMP\"])/\"public-completion-inputs\";r.mkdir()\ninputs={'owned_file.py':\
        \ '',\
        \ 'token_context.py': '',\
        \ 'runtime-console-timing.ps1': '',\
        \ 'public_completion.py': '',\
        \ 'reuse.py': '',\
        \ 'mapped_image.py': ''}\n\
        expected={'owned_file.py': 'e65db33c40d8be8d035ad092e8a48128db36aae208e339af0b536267384aa594',\
        \ 'token_context.py': 'ed4e4714a72a15a337992d771bf4c0a55e83df54a7fbbb69bde33482d9422660',\
        \ 'runtime-console-timing.ps1': '44d50339e76b252143b2a3b3606e77b4fe73b94d29721126364111b9fb1bc8fa',\
        \ 'public_completion.py': '8f91da194147d10c169599a86b3afe1b9a5dcc36856a7246771a7d4bad23cf58',\
        \ 'reuse.py': 'd8d47df9df9526daa4b010dad416e3ced6bac5479e24ffa5aaed0e019dbb6e3c',\
        \ 'mapped_image.py': '61bb89489b17b09d126cb81db887b5972d5d251e78f2882e1e401387e9135ad7'}\n\
        for n,v in inputs.items():\n raw=base64.b64decode(v);assert hashlib.sha256(raw).hexdigest()==expected[n];(r/n).write_bytes(raw)\n"
    - name: Authenticate reused native image
      shell: python
      env:
        GITHUB_TOKEN: ${{ github.token }}
        TIMING_FEATURES: ${{ matrix.features }}
      run: 'import os,runpy

        from pathlib import Path

        runpy.run_path(str(Path(os.environ[''RUNNER_TEMP''])/''public-completion-inputs/reuse.py''),run_name=''__main__'')

        '
    - name: Read shipped public uninstall completion
      shell: python
      env:
        TIMING_FEATURES: ${{ matrix.features }}
        TIMING_EXPECTED_PRODUCT_TYPE: '3'
        TIMING_OUT: ${{ runner.temp }}/public-completion-evidence-${{ matrix.features
          }}
      run: 'import os,runpy,sys

        from pathlib import Path

        r=Path(os.environ[''RUNNER_TEMP'']);inputs=r/''public-completion-inputs'';sys.path.insert(0,str(inputs));mode=os.environ[''TIMING_FEATURES''];reused=r/(''native-reused-''+mode)/''files''

        os.environ[''TIMING_PREBUILT_IMAGE'']=str(reused/''native-se.exe'');os.environ[''TIMING_BUILD_RECORD'']=str(reused/''build.json'')

        runpy.run_path(str(inputs/''public_completion.py''),run_name=''__main__'')

        '
    - name: Observe disposable mapped-image deletion matrix
      if: ${{ always() }}
      shell: python
      env:
        TIMING_FEATURES: ${{ matrix.features }}
      run: 'import os,runpy

        from pathlib import Path

        runpy.run_path(str(Path(os.environ["RUNNER_TEMP"])/"public-completion-inputs/mapped_image.py"),run_name="__main__")

        '
    - name: Retain public completion and image custody
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: j5-attributes-${{ matrix.features }}
        path: '${{ runner.temp }}/public-completion-evidence-${{ matrix.features }}/

          ${{ runner.temp }}/native-reused-${{ matrix.features }}/reuse.json'
        if-no-files-found: error
        retention-days: 14
