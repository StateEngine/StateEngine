name: Review native Windows owner inbox follow over SSH
'on':
  push:
    branches:
    - prime/pr447-native-ssh-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      REVIEW_SOURCE: b0ede0ce43e3ec06c98db4e147d14e09633e146a
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: b0ede0ce43e3ec06c98db4e147d14e09633e146a
        path: source
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Stage frozen independent controls
      shell: python
      run: 'from pathlib import Path

        import base64,hashlib,json,os

        r=Path(os.environ[''RUNNER_TEMP''])/''owner-follow-native''

        r.mkdir(exist_ok=True)

        files={''judge.py'': '''',
        ''setup-ssh.ps1'': ''''}

        for name,data in files.items():(r/name).write_bytes(base64.b64decode(data))

        (r/''controls.json'').write_text(json.dumps({name:hashlib.sha256(base64.b64decode(data)).hexdigest() for name,data
        in files.items()},indent=2)+''\n'')

        '
    - name: Prepare a disposable native SSH server
      shell: pwsh
      run: '& "$env:RUNNER_TEMP/owner-follow-native/setup-ssh.ps1"'
    - name: Build the exact candidate into a fresh target directory
      shell: python
      run: "from pathlib import Path\nimport hashlib,json,os,subprocess,time\nr=Path(os.environ['RUNNER_TEMP'])/'owner-follow-native'\n\
        s=Path(os.environ['GITHUB_WORKSPACE'])/'source'\nactual=subprocess.check_output(['git','rev-parse','HEAD'],cwd=s,text=True).strip()\n\
        assert actual==os.environ['REVIEW_SOURCE']\ntarget=r/'target';assert not target.exists()\nenv=dict(os.environ,CARGO_TARGET_DIR=str(target),CARGO_BUILD_JOBS='2',CARGO_INCREMENTAL='0')\n\
        for key in ['GH_TOKEN','GITHUB_TOKEN','RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS']:env.pop(key,None)\nargv=['cargo','build','--profile','distribution','--target','x86_64-pc-windows-msvc','-p','se','--bin','se','--locked']\n\
        started=time.monotonic()\nwith (r/'build.stdout').open('wb') as out,(r/'build.stderr').open('wb') as err:code=subprocess.run(argv,cwd=s,env=env,stdout=out,stderr=err).returncode\n\
        record=dict(source=actual,argv=argv,exit=code,seconds=time.monotonic()-started,rustc=subprocess.check_output(['rustc','-vV'],text=True))\n\
        if code==0:\n image=target/'x86_64-pc-windows-msvc/distribution/se.exe'\n with image.open('rb') as stream:record['image_sha256']=hashlib.file_digest(stream,'sha256').hexdigest()\n\
        (r/'build.json').write_text(json.dumps(record,indent=2)+'\\n')\nraise SystemExit(code)\n"
    - name: Witness SSH close, last cursor and zero orphaned session processes
      shell: pwsh
      run: 'python -B "$env:RUNNER_TEMP/owner-follow-native/judge.py"

        exit $LASTEXITCODE'
    - name: Hash explicit finite evidence
      if: always()
      shell: python
      run: "from pathlib import Path\nimport hashlib,json,os,shutil\nr=Path(os.environ['RUNNER_TEMP'])/'owner-follow-native';out=r/'evidence';out.mkdir(parents=True,exist_ok=True)\n\
        for name in ['controls.json','build.json','build.stdout','build.stderr']:\n if (r/name).is_file():shutil.copyfile(r/name,out/name)\n\
        rows=[]\nfor p in sorted(out.iterdir()):\n assert p.is_file() and p.suffix in ['.json','.stdout','.stderr'], 'Evidence\
        \ must be an explicit finite top-level file'\n assert p.stat().st_size<16*1024**2\n with p.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()\n\
        \ rows.append(dict(file=p.name,bytes=p.stat().st_size,sha256=digest))\n(out/'artifact-manifest.json').write_text(json.dumps(rows,indent=2)+'\\\
        n')\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: pr447-native-ssh-r1
        path: ${{ runner.temp }}/owner-follow-native/evidence/*
        if-no-files-found: error
        retention-days: 7
