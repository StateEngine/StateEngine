name: Shared app-server proxy probe on Windows
on:
  push:
    branches: [probe/518-windows-proxy-20261119]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe
        shell: bash
        run: python probe/518-windows-proxy/run.py
