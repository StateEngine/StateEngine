name: Windows endpoint notification frozen base/head package producer r2
'on':
  push:
    branches:
    - prime/endpoint-pair-433-windows-r2
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 5ef5d32ea8316542d4806383f063ce8a9ddf276c
        path: base
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 879887c2ce979a8e2a8f942aab56c9b789bbc8aa
        path: head
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 65a3b059a7b8ba752b386e63d16f045564e1c1ad
        path: observer
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: ./head/.github/actions/rust
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: amd64
    - name: Preflight native dependency inspector before compilation
      shell: python
      run: |
        import shutil,subprocess,sys
        assert shutil.which('dumpbin.exe'), 'Visual Studio Native Tools must supply dumpbin before any compilation'
        r=subprocess.run(['dumpbin.exe','/headers',sys.executable],capture_output=True,timeout=30)
        assert r.returncode==0,r.stderr.decode(errors='replace')
    - name: Decode exact producer and frozen observer inventory
      shell: python
      run: |
        import ast,base64,hashlib,os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'endpoint-pair-material'
        root.mkdir(exist_ok=False)
        data=base64.b64decode('',validate=True)
        assert hashlib.sha256(data).hexdigest()=='221c9a9932741113c055c143d6766557c4a9dfb3123ff61ea7e7c8d83fe9c193'
        ast.parse(data)
        (root/'produce_pair.py').write_bytes(data)
        data=base64.b64decode('',validate=True)
        assert hashlib.sha256(data).hexdigest()=='1b545c545d10218cda4cd9cffe9979330c7ead61ba04b30562d69c29588b4a84'
        ast.parse(data)
        (root/'run_pair.py').write_bytes(data)
        data=base64.b64decode('',validate=True)
        assert hashlib.sha256(data).hexdigest()=='86a7a25b24d5b5eb1d430a19e373345986c7e055ff5cdabe2008c2a425cbef6e'
        (root/'observer-inputs.json').write_bytes(data)
    - name: Gate native fixtures, assemble both packages and observe macOS
      shell: python
      run: |
        import os,pathlib,subprocess,sys
        p=pathlib.Path(os.environ['RUNNER_TEMP'])/'endpoint-pair-material'/'produce_pair.py'
        subprocess.run([sys.executable,'-B',str(p)],check=True)
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: endpoint-pair-433-r2-windows-2025
        path: ${{ runner.temp }}/endpoint-pair-evidence
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 0
        retention-days: 14
