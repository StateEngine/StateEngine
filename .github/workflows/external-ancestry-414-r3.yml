name: External native ancestry observation
'on':
  push:
    branches:
    - prime/external-ancestry-414-r3
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 1
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 2
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 3
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 4
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 5
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 6
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 7
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 8
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 9
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 10
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 11
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          boot: 12
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 1
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 2
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 3
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 4
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 5
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 6
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 7
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 8
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 9
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 10
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 11
        - arm: head
          source: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
          boot: 12
      max-parallel: 6
    env:
      ARM: ${{ matrix.arm }}
      PRODUCT_SOURCE: ${{ matrix.source }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      BOOT_PAIR: ${{ matrix.boot }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        key: external414-stock-native
    - name: Stage external controls and native service dependency
      shell: python
      run: |
        import base64,hashlib,json,os,subprocess,sys,urllib.request
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'external414';root.mkdir()
        controls=root/'controls';controls.mkdir()
        code={'ancestry_trace.py': '', 'build.py': '', 'owned_family.py': '', 'preflight.py': '', 'public_windows.py': '', 'run-standard-user.py': '', 'scm-broker.py': '', 'service-probe.py': '', 'token_context.py': '', 'trace_schema.py': '', 'worker-entry.py': ''}
        for name,encoded in code.items():
         raw=base64.b64decode(encoded);compile(raw.decode(),name,'exec');(controls/name).write_bytes(raw)
        (root/'inputs.json').write_text(json.dumps({name:hashlib.sha256((controls/name).read_bytes()).hexdigest() for name in code},indent=2)+'\n')
        url='https://files.pythonhosted.org/packages/03/d9/77040d3b43df3f3be32ea289433d660d2727f5ba327bc73be835127d9d60/pywin32-312-cp312-cp312-win_amd64.whl'
        raw=urllib.request.urlopen(url).read();assert hashlib.sha256(raw).hexdigest()=='b457f6d628a47e8a7346ce22acb7e1a46a4a78b52e1d17e1af56871bd19a93bc'
        wheel=root/'pywin32-312-cp312-cp312-win_amd64.whl';wheel.write_bytes(raw)
        subprocess.run([sys.executable,'-m','pip','install','--no-user','--no-deps','--no-index',str(wheel)],check=True)
        with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('REVIEW414_ROOT='+str(root)+'\n')
    - name: Validate native trace ABI and exited-handle readback
      shell: python
      run: |
        import os,subprocess,sys
        from pathlib import Path
        subprocess.run([sys.executable,'-B',str(Path(os.environ['REVIEW414_ROOT'])/'controls/preflight.py')],check=True)
    - name: Record native boot time and machine UUID digest
      shell: python
      run: |
        import hashlib,json,os,subprocess,uuid
        from pathlib import Path
        root=Path(os.environ['REVIEW414_ROOT'])
        script="$ErrorActionPreference='Stop'; $os=Get-CimInstance Win32_OperatingSystem; $machine=Get-CimInstance Win32_ComputerSystemProduct; @{boot_utc=$os.LastBootUpTime.ToUniversalTime().ToString('o'); uuid=$machine.UUID} | ConvertTo-Json -Compress"
        value=json.loads(subprocess.check_output(['powershell.exe','-NoProfile','-NonInteractive','-Command',script],text=True))
        assert value['boot_utc'] and uuid.UUID(value['uuid']).int!=0
        receipt={'boot_utc':value['boot_utc'],'machine_uuid_sha256':hashlib.sha256(value['uuid'].casefold().encode()).hexdigest(),'pair':int(os.environ['BOOT_PAIR']),'source':os.environ['PRODUCT_SOURCE'],'arm':os.environ['ARM'],'github_run_id':os.environ['GITHUB_RUN_ID'],'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT']}
        (root/'boot-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
    - name: Build stock MSVC image without source changes
      shell: python
      run: |
        import os,subprocess,sys
        from pathlib import Path
        subprocess.run([sys.executable,'-B',str(Path(os.environ['REVIEW414_ROOT'])/'controls/build.py')],check=True)
    - name: Paired first inits in two independent fresh accounts
      shell: python
      run: |
        import hashlib,json,os,subprocess,sys
        from pathlib import Path
        root=Path(os.environ['REVIEW414_ROOT']);bundle=root/'bundle';arm=os.environ['ARM']
        manifest=hashlib.sha256((bundle/'manifest.json').read_bytes()).hexdigest()
        pair=int(os.environ['BOOT_PAIR']);order=['no-help','help'] if pair%2 else ['help','no-help']
        aggregate={'groups':[],'condition_order':order,'measurement_complete':False,'attempts_planned':2,'boot_pair':pair}
        for condition in order:
         attempt=root/condition
         command=[sys.executable,'-B',str(root/'controls/service-probe.py'),'--bundle',str(bundle),'--arm',arm,'--out',str(attempt),'--manifest-sha256',manifest]
         if condition=='help':command.append('--prelude')
         with (root/(condition+'.stdout')).open('wb') as out,(root/(condition+'.stderr')).open('wb') as err:
          result=subprocess.run(command,stdin=subprocess.DEVNULL,stdout=out,stderr=err)
         row={'condition':condition,'exit':result.returncode,'argv':command};aggregate['groups'].append(row)
         summary=attempt/'summary.json';broker=attempt/'admin/broker.json'
         if summary.exists() and broker.exists():
          service=json.loads(summary.read_text());native=json.loads(broker.read_text())
          row['native_closure']=all(service.get(k) is True for k in ['service_removed','service_process_joined']) and all(native.get(k) is True for k in ['worker_joined','account_disabled','profile_unloaded','batch_logon_right_removed']) and not native.get('cleanup_unknown')
         else:row['native_closure']=False
         (root/'aggregate.json').write_text(json.dumps(aggregate,indent=2)+'\n')
         if not row['native_closure']:
          aggregate['stop_reason']='Native closure is unknown; the other account was not launched.'
          break
        aggregate['measurement_complete']=len(aggregate['groups'])==2 and all(r['exit']==0 and r['native_closure'] for r in aggregate['groups'])
        (root/'aggregate.json').write_text(json.dumps(aggregate,indent=2)+'\n')
        raise SystemExit(0 if aggregate['measurement_complete'] else 1)
    - name: Retain complete bounded receipts
      if: always()
      shell: python
      run: |
        import hashlib,json,os,shutil
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'external414';out=root/'retained';out.mkdir()
        for name in ['inputs.json','native-preflight.json','aggregate.json','boot-receipt.json']:
         if (root/name).exists():shutil.copyfile(root/name,out/name)
        for name in ['controls','build']:
         if (root/name).exists():shutil.copytree(root/name,out/name)
        for name in ['help','no-help']:
         for stream in ['stdout','stderr']:
          if (root/(name+'.'+stream)).exists():shutil.copyfile(root/(name+'.'+stream),out/(name+'.'+stream))
         if (root/name/'export').exists():shutil.copytree(root/name/'export',out/'groups'/name)
        files=[p for p in out.rglob('*') if p.is_file()];assert all(not p.is_symlink() for p in files)
        (out/'members.json').write_text(json.dumps({p.relative_to(out).as_posix():hashlib.file_digest(p.open('rb'),'sha256').hexdigest() for p in files},indent=2)+'\n')
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: external-ancestry-414-r3-${{ matrix.arm }}-${{ matrix.boot }}
        path: ${{ runner.temp }}/external414/retained
        if-no-files-found: error
        retention-days: 14
