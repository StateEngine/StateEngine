name: Native macOS nightly journeys
'on':
  workflow_dispatch:
    inputs:
      nightly_binding:
        description: Strict se.nightly-binding/v1 from Linux run.json after archive creation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-macos-nightly-${{ github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  NIGHTLY_BINDING: ${{ inputs.nightly_binding }}
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  package:
    name: Build exact-source native nightly package
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - &id001
      name: Check out adapter at the workflow commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.workflow_sha }}
        path: controller
        persist-credentials: false
    - &id002
      name: Bind exact nightly source and record adapter inventory
      id: binding
      env:
        WORKFLOW_SHA: ${{ github.workflow_sha }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        python3 -B - <<'PY'
        import hashlib, json, os, re, subprocess, sys
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP'])
        controller = Path(os.environ['GITHUB_WORKSPACE']) / 'controller'
        commit = subprocess.check_output(['git', '-C', str(controller), 'rev-parse', 'HEAD'], text=True).strip()
        if commit != os.environ['WORKFLOW_SHA']:
            raise RuntimeError('Adapter checkout differs from the workflow commit')
        source = controller / 'journeys/hosted_macos'
        sys.path.insert(0, str(source))
        from common import binding, save
        value = os.environ['NIGHTLY_BINDING']
        if len(value.encode()) > 4096:
            raise RuntimeError('Nightly binding is oversized')
        nightly = binding(json.loads(value))
        product_commit = nightly['product_commit']
        if not re.fullmatch(r'[0-9a-f]{40}', product_commit):
            raise RuntimeError(f'Invalid product_commit: {product_commit!r}')
        compare_raw = subprocess.check_output(
            ['gh', 'api', f"repos/{os.environ['GH_REPO']}/compare/{product_commit}...main"],
            text=True,
        )
        compare = json.loads(compare_raw)
        if (
            compare.get('status') not in ('identical', 'ahead')
            or compare.get('behind_by') != 0
            or (compare.get('merge_base_commit') or {}).get('sha') != product_commit
        ):
            raise RuntimeError(
                f"product_commit {product_commit} is not an ancestor of main "
                f"(status={compare.get('status')!r}, behind_by={compare.get('behind_by')!r})"
            )
        save(root / 'nightly-binding.json', nightly)
        files = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted(source.glob('*.py'))}
        if not files:
            raise RuntimeError('Adapter source inventory is absent')
        save(root / 'observer-source.json', dict(schema='se.hosted-observer/v1', commit=commit, files=files))
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            print('product_commit=' + product_commit, file=out)
        PY
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: StateEngine/StateEngine
        ref: ${{ steps.binding.outputs.product_commit }}
        path: product
        persist-credentials: false
    - name: Read pinned native toolchain
      id: toolchain
      run: "python3 -B - <<'PY'\nimport os, tomllib\nfrom pathlib import Path\nchannel = tomllib.loads(Path('product/rust-toolchain.toml').read_text())['toolchain']['channel']\n\
        if not channel or any(c not in '0123456789.-' for c in channel):\n    raise RuntimeError('Expected the source-pinned\
        \ release toolchain')\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as out:\n    out.write('channel=' + channel + '\\\
        n')\nPY\n"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        targets: aarch64-apple-darwin
        components: llvm-tools-preview
    - name: Build one exact-nightly native package
      env:
        CARGO_HOME: ${{ runner.temp }}/cargo-home
        CARGO_BUILD_JOBS: '2'
        CARGO_INCREMENTAL: '0'
      run: 'python3 -B "$GITHUB_WORKSPACE/controller/journeys/hosted_macos/package.py" --source "$GITHUB_WORKSPACE/product"
        --binding "$RUNNER_TEMP/nightly-binding.json" --out "$RUNNER_TEMP/native-package"

        '
    - name: Bind transferred package metadata
      id: package
      run: "python3 -B - <<'PY'\nimport hashlib, json, os\nfrom pathlib import Path\npath = Path(os.environ['RUNNER_TEMP'])\
        \ / 'native-package/transfer/package.json'\nvalue = json.loads(path.read_text())\nwith open(os.environ['GITHUB_OUTPUT'],\
        \ 'a') as out:\n    out.write('sha256=' + hashlib.sha256(path.read_bytes()).hexdigest() + '\\n')\nwith open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as out:\n    out.write('Native-only macOS sibling source: `' + value['nightly']['product_commit'] + '`\\n\\\
        n')\n    out.write('Linux archive binding: `' + value['nightly']['linux_archive_sha256'] + '`\\n\\n')\n    out.write('Native\
        \ archive: `' + value['archive_sha256'] + '`\\n\\nRemote bootstrap images are unmeasured.\\n')\nPY\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-nightly-package
        path: ${{ runner.temp }}/native-package/transfer/*
        if-no-files-found: error
        retention-days: 7
  smoke:
    name: Account-free macOS smoke only
    needs: package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - *id001
    - *id002
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: StateEngine/StateEngine
        ref: ${{ steps.binding.outputs.product_commit }}
        path: product
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-nightly-package
        path: ${{ runner.temp }}/package-transfer
    - name: Register the disposable native installation account
      run: 'identity="$(id -u)"

        profile="$(python3 -c ''import os,pwd; print(pwd.getpwuid(os.geteuid()).pw_dir)'')"

        sudo python3 product/scripts/ci/installation_account.py provision --identity "$identity" --profile "$profile"

        python3 product/scripts/ci/installation_account.py check

        '
    - name: Account-free native Install, terminal, identity and cleanup
      env:
        PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
      run: 'python3 -B "$GITHUB_WORKSPACE/controller/journeys/hosted_macos/five_journeys.py" --mode account-free --surface
        codex --binding "$RUNNER_TEMP/nightly-binding.json" --package "$RUNNER_TEMP/package-transfer" --package-sha256 "$PACKAGE_SHA256"
        --account-registration "$GITHUB_WORKSPACE/product/scripts/ci/installation_account.py" --out "$RUNNER_TEMP/evidence"

        '
    - name: Export finite receipts and qualification limits
      if: ${{ always() }}
      run: "python3 -B - <<'PY'\nimport json, os, shutil\nfrom pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP'])\n\
        evidence = root / 'evidence'\nevidence.mkdir(exist_ok=True)\nshutil.copyfile(root / 'observer-source.json', evidence\
        \ / 'observer-source.json')\npath = evidence / 'results.json'\nvalue = json.loads(path.read_text()) if path.exists()\
        \ else {'account_free_result': 'FAIL', 'reason': 'No smoke receipt'}\nwith open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as out:\n    out.write('Account-free macOS smoke: **' + value.get('account_free_result', 'FAIL') + '**\\n\\\
        n')\n    out.write('Real provider results are published by the separate matrix. Desktop windows and remote bootstrap images: **NOT\
        \ RUN**.\\n')\nPY\npython3 -B \"$GITHUB_WORKSPACE/controller/journeys/hosted_macos/collect.py\" --source \"$RUNNER_TEMP/evidence\"\
        \ --out \"$RUNNER_TEMP/upload\"\n"
    - name: Retain finite account-free-macos-receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: account-free-macos-receipts
        path: ${{ runner.temp }}/upload/*
        if-no-files-found: error
        retention-days: 7
  providers:
    name: Real macOS provider journeys (${{ matrix.provider }})
    needs: package
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: nightly-providers
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, codex]
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - *id001
    - *id002
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: StateEngine/StateEngine
        ref: ${{ steps.binding.outputs.product_commit }}
        path: product
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-nightly-package
        path: ${{ runner.temp }}/package-transfer
    - name: Register the disposable native installation account
      run: |
        identity="$(id -u)"
        profile="$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.geteuid()).pw_dir)')"
        sudo python3 product/scripts/ci/installation_account.py provision --identity "$identity" --profile "$profile"
        python3 product/scripts/ci/installation_account.py check
    - name: Install the pinned provider client
      env:
        SURFACE: ${{ matrix.provider }}
      run: |
        case "$SURFACE" in
          claude) package='@anthropic-ai/claude-code@2.1.326' ;;
          codex) package='@openai/codex@0.169.0' ;;
        esac
        npm install --prefix "$RUNNER_TEMP/native-provider" "$package"
        printf '%s\n' "$RUNNER_TEMP/native-provider/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Run five real provider journeys
      env:
        SURFACE: ${{ matrix.provider }}
        PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        CI_ANTHROPIC_API_KEY: ${{ matrix.provider == 'claude' && secrets.CI_ANTHROPIC_API_KEY || '' }}
        CI_OPENAI_API_KEY: ${{ matrix.provider == 'codex' && secrets.CI_OPENAI_API_KEY || '' }}
        CI_CLAUDE_MODEL: ${{ vars.CI_CLAUDE_MODEL }}
        CI_CODEX_MODEL: ${{ vars.CI_CODEX_MODEL }}
      run: |
        python3 -B controller/journeys/hosted_macos/providers.py --surface "$SURFACE" \
          --binding "$RUNNER_TEMP/nightly-binding.json" --package "$RUNNER_TEMP/package-transfer" \
          --package-sha256 "$PACKAGE_SHA256" --account-registration "$GITHUB_WORKSPACE/product/scripts/ci/installation_account.py" \
          --out "$RUNNER_TEMP/provider-evidence"
    - name: Delete the disposable provider seed
      if: ${{ always() }}
      run: |
        python3 -B - <<'PY'
        import os, shutil
        from pathlib import Path
        seed = Path(os.environ['RUNNER_TEMP']).resolve() / 'provider-evidence/seed'
        try:
            shutil.rmtree(seed)
        except FileNotFoundError:
            pass
        if seed.exists() or seed.is_symlink():
            raise RuntimeError('Private seed cleanup failed')
        PY
    - name: Publish the bounded native provider receipt
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: macos-nightly-proof-${{ matrix.provider }}
        path: ${{ runner.temp }}/provider-evidence/publish/results.json
        if-no-files-found: error
        retention-days: 7
  gate:
    name: Require successful native macOS smoke and both providers
    if: ${{ always() }}
    needs: [package, smoke, providers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Require witnessed package, smoke and provider success
      env:
        PACKAGE_RESULT: ${{ needs.package.result }}
        SMOKE_RESULT: ${{ needs.smoke.result }}
        PROVIDERS_RESULT: ${{ needs.providers.result }}
      run: |
        if [[ "$PACKAGE_RESULT" != success || "$SMOKE_RESULT" != success || "$PROVIDERS_RESULT" != success ]]; then
          printf 'macOS nightly incomplete: package=%s smoke=%s providers=%s\n' \
            "$PACKAGE_RESULT" "$SMOKE_RESULT" "$PROVIDERS_RESULT" >&2
          exit 1
        fi
        printf 'Native macOS nightly: account-free smoke and both real provider rows passed.\n' >> "$GITHUB_STEP_SUMMARY"
