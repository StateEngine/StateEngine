name: 5e-381-cold-pair-profile

# One-shot diagnostic for issue 381 (cold first-pairing tail bound): deleted
# after the verdict, never a standing gate.
#
# The publish branch is cut from main and carries only this file, so the
# judge is checked out by the full SHA of the 5e branch commit that holds
# it, and the product under test (pinned main) is checked out separately
# under product/.
#
# Each attempt pairs a fresh source home against a fresh destination user
# over a loopback sshd on 127.0.0.1:2222 and measures wall time with
# 100 ms process profiles. No secrets; everything is loopback.

on:
  push:
    branches: [prime/5e-381-cold-pair-profile-r8]

permissions:
  contents: read

concurrency:
  group: 5e-381-cold-pair-profile-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  profile:
    name: cold-pair ${{ matrix.run.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run:
          - name: base
            ref: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
            attempts: 5
            tail-bound-sec: null
    steps:
      # Publish branch (cut from main): provides the composite actions.
      - name: Checkout workflow branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust CI tools
        uses: ./.github/actions/rust

      # Judge scripts at the exact 5e branch commit (Prime reads them at this
      # SHA before publishing).
      - name: Checkout judge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 33d117685070015c6f084d96b3100a3da21f4bf6
          path: judge
          persist-credentials: false

      - name: Checkout product ${{ matrix.run.name }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.run.ref }}
          path: product
          persist-credentials: false

      # Match the release inputs (scripts/release/inputs.json): the remote
      # owner path behind 'remote add' is feature-gated and not a default.
      - name: Build se (release)
        working-directory: product
        run: cargo build --release --locked --no-default-features --features remote -p se

      - name: Loopback sshd on 127.0.0.1:2222
        run: |
          set -e
          mkdir -p /tmp/se381-sshd
          # This runner image does not pre-create sshd's privilege separation dir.
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd
          sudo ssh-keygen -t ed25519 -N '' -f /tmp/se381-sshd/host_key -q
          sudo /usr/sbin/sshd \
            -p 2222 \
            -o ListenAddress=127.0.0.1 \
            -o HostKey=/tmp/se381-sshd/host_key \
            -o PidFile=/tmp/se381-sshd/sshd.pid \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o UsePAM=no \
            -o PrintMotd=no \
            -o X11Forwarding=no \
            -o AuthorizedKeysFile=.ssh/authorized_keys
          sleep 1
          sudo cat /tmp/se381-sshd/sshd.pid
          ssh-keyscan -p 2222 127.0.0.1 >/dev/null

      - name: Runner identity key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -C se381-cold-pair -q
          chmod 600 ~/.ssh/id_ed25519

      - name: Judge cold pairings (${{ matrix.run.name }})
        env:
          ATTEMPTS: ${{ matrix.run.attempts }}
          TAIL_BOUND: ${{ matrix.run.tail-bound-sec }}
        run: |
          set -e
          args=(--se "$GITHUB_WORKSPACE/product/target/release/se"
                --repo "$GITHUB_WORKSPACE/product"
                --output "$GITHUB_WORKSPACE/cold-pair-results/${{ matrix.run.name }}"
                --attempts "$ATTEMPTS"
                --identity "$HOME/.ssh/id_ed25519"
                --ssh-port 2222)
          if [ -n "$TAIL_BOUND" ]; then
            args+=(--tail-bound-sec "$TAIL_BOUND")
          fi
          python3 judge/scripts/cold-pair-profile.py "${args[@]}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cold-pair-${{ matrix.run.name }}
          path: cold-pair-results/${{ matrix.run.name }}
          if-no-files-found: error
