name: Independent search page and cursor controls
'on':
  push:
    branches:
    - prime/page-fitting-judges-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        arm:
        - base
        - head
        include:
        - arm: base
          source: 737bee8caf03e17d2a61e21594d7b0285d6619dc
        - arm: head
          source: 2afb01f903a891bb7a7f5bd283e7d7f4170cb875
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: ./.github/actions/rust
    - name: Exercise public query, cursor and source-range contracts
      shell: python
      env:
        EXPECTED_SOURCE: ${{ matrix.source }}
        ARM: ${{ matrix.arm }}
      run: |
        PAYLOADS={'page_review.rs': '', 'page_fitting_review.rs': ''}
        HASHES={'page_review.rs': 'cedf125ac766c66a40076e3ebabc2367bd71cf56257801caae2e66bf0df17371', 'page_fitting_review.rs': 'b6a70c49616b5472132e4cd05401c6a1a33202915d2d9e2245fc4b5dcb56886c'}

        import base64,hashlib,json,os,pathlib,subprocess,time
        repo=pathlib.Path.cwd();source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        assert source==os.environ['EXPECTED_SOURCE']
        root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'page-review';out.mkdir()
        (out/'source.txt').write_text(source+'\n')
        for name,encoded in PAYLOADS.items():
         raw=base64.b64decode(encoded);assert hashlib.sha256(raw).hexdigest()==HASHES[name];(out/name).write_bytes(raw)
         (repo/('crates/se-atlas/tests/foundation_judge/'+name if name=='page_review.rs' else 'crates/se-atlas/src/query/'+name)).write_bytes(raw)
        (out/'judge-hashes.json').write_text(json.dumps(HASHES,indent=2)+'\n')
        with (repo/'crates/se-atlas/tests/foundation_judge.rs').open('a') as f:f.write('\n#[path="foundation_judge/page_review.rs"]\nmod page_review;\n')
        if os.environ['ARM']=='head':
         with (repo/'crates/se-atlas/src/query/search_page.rs').open('a') as f:f.write('\n#[cfg(test)]\n#[path="page_fitting_review.rs"]\nmod page_review;\n')
        host=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip()
        env=dict(os.environ,CARGO_TARGET_DIR=str(root/'page-target'),CARGO_BUILD_JOBS='2',CARGO_INCREMENTAL='0',CARGO_PROFILE_DEV_DEBUG='0',CARGO_PROFILE_TEST_DEBUG='0')
        receipts=[]
        def run(label,command):
         began=time.monotonic_ns()
         with (out/(label+'.log')).open('wb') as log:r=subprocess.run(command,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=2400)
         receipts.append(dict(source=source,label=label,argv=command,exit=r.returncode,elapsed_ns=time.monotonic_ns()-began));(out/'executions.json').write_text(json.dumps(receipts,indent=2)+'\n')
         print(label,r.returncode)
        run('public-query-cursor-controls',['cargo','test','--target',host,'-p','se-atlas','--locked','--test','foundation_judge','page_review::','--','--nocapture','--test-threads=1'])
        if os.environ['ARM']=='head':run('clipped-source-accounting',['cargo','test','--target',host,'-p','se-atlas','--locked','--lib','page_review::','--','--nocapture','--test-threads=1'])
        raise SystemExit(1 if any(x['exit'] for x in receipts) else 0)
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: page-fitting-${{ matrix.os }}-${{ matrix.arm }}
        path: ${{ runner.temp }}/page-review
        if-no-files-found: error
        retention-days: 14
