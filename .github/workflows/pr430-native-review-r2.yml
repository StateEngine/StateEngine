name: Independent Windows venue and consumer comparison r2
'on':
  push:
    branches:
    - prime/pr430-native-review-r2
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
        fetch-depth: 1
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: pr430-native-review-r2-${{ matrix.arm }}
        cache-workspace-crates: false
        workspaces: . -> ${{ env.CARGO_TARGET_DIR }}
    - name: Judge exact Windows venue, cleanup and both real consumers
      shell: python
      run: 'import base64,hashlib,os,subprocess,sys

        from pathlib import Path

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''83265d5b43b34c2d3d21b8db0c5d36bf7919ac63dd26a6e7e761e58753afc02a''

        p=Path(os.environ[''RUNNER_TEMP''])/''review430-pair-runner-r2.py''

        p.write_bytes(data)

        raise SystemExit(subprocess.call([sys.executable,''-B'',str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: review430-pair-r2-${{ matrix.arm }}
        path: ${{ runner.temp }}/review430-results/
        include-hidden-files: true
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: head
          source: cb3b5ad971fce7cd2f8a0decea495bea5ae2d97e
        - arm: base
          source: 452d3207793a05e73433f04752b8cd2c79f9b2e7
    env:
      REVIEW_ARM: ${{ matrix.arm }}
      REVIEW_SOURCE: ${{ matrix.source }}
      CARGO_TARGET_DIR: ${{ runner.temp }}/review430-target-${{ matrix.arm }}
