name: Windows detached-broker prerequisites and native consumers
'on':
  push:
    branches:
    - prime/c29-windows-broker-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  RUST_BACKTRACE: '1'
jobs:
  windows:
    name: Broker consumers (${{ matrix.features }})
    runs-on: windows-2025
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        features:
        - default
        - all
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: fb711318674aa465e083c8c503bbae404b21cdd3
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: c29-windows-${{ matrix.features }}-v1
    - name: Extract checksum-pinned native fixtures
      shell: python
      run: "import ast,base64,hashlib,json,os\nfrom pathlib import Path\nr=Path(os.environ['RUNNER_TEMP'])/'broker-inputs';r.mkdir()\ninputs={'driver.py': '',\
        \ 'owned_family.py': '',\
        \ 'run-broker-tests.py': '',\
        \ 'scm-broker.py': '',\
        \ 'service-probe.py': '',\
        \ 'token_context.py': '',\
        \ 'worker-entry.py': ''}\n\
        expected={'driver.py': 'e6140aca7ae2ae6d6ef15f9e601f6f3323d00e6eefa054237b9e2287971bb6d8', 'owned_family.py': 'f8920dd0561e08556d10c4a6bef7795e106fa674b1d6b07be19ce7fd23ef8190', 'run-broker-tests.py': '326838339f5f1c229788823ceb8ffafd3d7a123cdf2cc10f84dd9e26f769a784', 'scm-broker.py': '9259b4fe3beb9650c87ecceee778a150951940e84dbbca237d520b128acd825f', 'service-probe.py': 'ec57302f27db0ff65a060ef51c085eb96d97d5c732ca7fd95408c7d36d97354a', 'token_context.py': 'ed4e4714a72a15a337992d771bf4c0a55e83df54a7fbbb69bde33482d9422660', 'worker-entry.py': '8b6f755265661b71765e36b0b9d39f5f36a243551b252708751fa4677f89cc99'}\nfor name,encoded in inputs.items():\n raw=base64.b64decode(encoded);assert hashlib.sha256(raw).hexdigest()==expected[name]\n ast.parse(raw,filename=name);(r/name).write_bytes(raw)\n(r/'inputs.json').write_text(json.dumps(expected,indent=2)+'\\n')\n(r/'dependencies.json').write_text(json.dumps([{'name': 'pywin32-312-cp312-cp312-win_amd64.whl', 'sha256': 'b457f6d628a47e8a7346ce22acb7e1a46a4a78b52e1d17e1af56871bd19a93bc',\
        \ 'url': 'https://files.pythonhosted.org/packages/03/d9/77040d3b43df3f3be32ea289433d660d2727f5ba327bc73be835127d9d60/pywin32-312-cp312-cp312-win_amd64.whl'}],indent=2)+'\\n')\n"
    - name: Install authenticated service dependency
      shell: python
      run: "import hashlib,json,os,subprocess,sys,urllib.request\nfrom pathlib import Path\nr=Path(os.environ['RUNNER_TEMP'])/'broker-inputs';w=Path(os.environ['RUNNER_TEMP'])/'broker-wheels';w.mkdir()\npaths=[]\nfor row in json.loads((r/'dependencies.json').read_text()):\n p=w/row['name']\n with urllib.request.urlopen(row['url'],timeout=120) as response:p.write_bytes(response.read())\n assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'];paths.append(str(p))\nsubprocess.run([sys.executable,'-m','pip','install','--no-user','--no-index','--no-deps',*paths],check=True)\n"
    - name: Prove outside-job standard user then run native consumers
      shell: python
      env:
        BROKER_FEATURES: ${{ matrix.features }}
        BROKER_OUT: ${{ runner.temp }}/broker-evidence-${{ matrix.features }}
      run: 'import os,runpy

        from pathlib import Path

        runpy.run_path(str(Path(os.environ[''RUNNER_TEMP''])/''broker-inputs/driver.py''),run_name=''__main__'')

        '
    - name: Retain bounded receipts and consumer output
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: c29-broker-${{ matrix.features }}
        path: ${{ runner.temp }}/broker-evidence-${{ matrix.features }}
        retention-days: 14
        if-no-files-found: error
