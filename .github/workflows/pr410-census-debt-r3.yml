name: Independent macOS census and escaped debt controls
'on':
  push:
    branches:
    - prime/pr410-census-debt-r3
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
defaults:
  run:
    working-directory: source
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: main
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          expect: fail
        - label: head
          source: 7217d87038002b3a852e5edcb1c8c01bcd761ebb
          expect: pass
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        path: source
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Register disposable native installation account
      shell: python
      run: 'from pathlib import Path

        import runpy,subprocess,sys

        script=Path("scripts/ci/installation_account.py").resolve()

        identity,profile=runpy.run_path(str(script))["account"]()

        subprocess.run(["sudo",sys.executable,str(script),"provision","--identity",identity,"--profile",str(profile)],check=True)

        subprocess.run([sys.executable,str(script),"check"],check=True)

        '
    - name: Decode independently reviewed controls
      shell: python
      run: "from pathlib import Path\nimport base64,json,os\nroot=Path(os.environ[\"GITHUB_WORKSPACE\"])/\"controls\"\nroot.mkdir()\nfiles=json.loads('{\"census.c\": \"\"\
        , \"public_stop.py\": \"\"\
        , \"native.c\": \"\"\
        , \"escape.rs\": \"\"\
        , \"run_native.py\": \"\"\
        , \"provider.py\": \"\"\
        }')\nfor name,encoded in files.items():\n (root/name).write_bytes(base64.b64decode(encoded))\n"
    - name: Compile native APIs before product observations
      shell: python
      env:
        SE410_EXPECT: ${{ matrix.expect }}
      run: 'from pathlib import Path

        import os,subprocess,sys

        script=Path(os.environ["GITHUB_WORKSPACE"])/"controls/run_native.py"

        subprocess.run([sys.executable,"-B",str(script)],check=True,timeout=3600)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: pr410-census-debt-r3-${{ matrix.label }}
        path: ${{ runner.temp }}/escape410/evidence
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
