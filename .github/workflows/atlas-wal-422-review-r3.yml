name: Independent native Atlas WAL admission pair
'on':
  push:
    branches:
    - prime/atlas-wal-422-review-r3
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2025
        arm:
        - base
        - head
    env:
      PRODUCT_SOURCE: ${{ matrix.arm == 'head' && '58355cd837fb15aa78578b4e7310a964fc785d2e' || '7b23fb01a7e16362c6d6b024e5c1801a32bda8c6'
        }}
      ARM: ${{ matrix.arm }}
      CARGO_TARGET_DIR: target-wal-${{ matrix.arm }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.PRODUCT_SOURCE }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Authenticate reviewer fixture and exact source
      shell: python
      run: |
        import base64, hashlib, json, os, subprocess
        from pathlib import Path
        r = Path(os.environ['RUNNER_TEMP']) / 'wal-review'
        r.mkdir()
        (r / 'inputs').mkdir()
        source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, encoding='utf-8').strip()
        assert source == os.environ['PRODUCT_SOURCE']
        assert not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'])
        data = base64.b64decode('')
        expected = '0c13274fc0ad819e15bfb54796258f7c9ea925c3df80e8fa7a1f90ef7df2ff75'
        assert hashlib.sha256(data).hexdigest() == expected
        p = Path('crates/se-atlas/tests/wal_pressure_review.rs')
        assert not p.exists()
        p.write_bytes(data)
        (r / 'inputs/fixture.rs').write_bytes(data)
        (r / 'inputs/source.json').write_text(json.dumps(dict(source=source, fixture_sha256=expected, scope='Native CacheConnection with actual SQLite, native retained file identity and real WAL length; synthetic growth reservation does not qualify the production disk inventory or whole application startup.'), indent=2) + '\n', encoding='utf-8')
    - name: Build native test image in separate arm target
      shell: python
      run: |
        import hashlib, json, os, shutil, subprocess, time
        from pathlib import Path
        r = Path(os.environ['RUNNER_TEMP']) / 'wal-review'
        i = r / 'inputs'
        compiler = subprocess.check_output(['rustc', '-Vv'], text=True, encoding='utf-8')
        host = next((x[6:] for x in compiler.splitlines() if x.startswith('host: ')))
        argv = ['cargo', 'test', '-p', 'se-atlas', '--test', 'wal_pressure_review', '--all-features', '--target', host, '--locked', '--no-run', '--message-format=json']
        start = time.monotonic()
        with (i / 'build.stdout').open('wb') as stdout, (i / 'build.stderr').open('wb') as stderr:
            p = subprocess.run(argv, stdout=stdout, stderr=stderr)
        record = dict(source=os.environ['PRODUCT_SOURCE'], arm=os.environ['ARM'], argv=argv, compiler=compiler, target=host, exit=p.returncode, seconds=time.monotonic() - start, profile='test')
        if p.returncode == 0:
            executables = []
            for line in (i / 'build.stdout').read_text(encoding='utf-8').splitlines():
                data = json.loads(line)
                if data.get('reason') == 'compiler-artifact' and data.get('target', {}).get('name') == 'wal_pressure_review' and data.get('executable'):
                    executables.append(data['executable'])
            assert len(executables) == 1
            image = r / ('native-wal-test.exe' if os.name == 'nt' else 'native-wal-test')
            shutil.copy2(executables[0], image)
            record.update(image=str(image), sha256=hashlib.sha256(image.read_bytes()).hexdigest())
        (i / 'build.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
        raise SystemExit(p.returncode)
    - name: Exercise native WAL pressure and pinned-reader release
      shell: python
      run: |
        import hashlib, json, os, subprocess, time
        from pathlib import Path
        r = Path(os.environ['RUNNER_TEMP']) / 'wal-review'
        b = json.loads((r / 'inputs/build.json').read_text(encoding='utf-8'))
        assert b['exit'] == 0
        image = Path(b['image'])
        assert hashlib.sha256(image.read_bytes()).hexdigest() == b['sha256']
        temporary = r / 'owned-temp'
        temporary.mkdir()
        env = dict(os.environ, TMPDIR=str(temporary), TMP=str(temporary), TEMP=str(temporary))
        argv = [str(image), '--nocapture', '--test-threads=1']
        start = time.monotonic()
        with (r / 'test.stdout').open('wb') as stdout, (r / 'test.stderr').open('wb') as stderr:
            p = subprocess.run(argv, env=env, stdout=stdout, stderr=stderr)
        text = (r / 'test.stdout').read_text(encoding='utf-8') + (r / 'test.stderr').read_text(encoding='utf-8')
        head = os.environ['ARM'] == 'head'
        qualified = p.returncode == 0 and '2 passed; 0 failed;' in text and (text.count('ADMISSION_RECOVERY ') == 2) and ('PINNED_REFUSAL ' in text) if head else p.returncode != 0 and '0 passed; 2 failed;' in text and (text.count('AtlasResourceBudget') >= 2) and ('PINNED_REFUSAL ' in text) and ('ADMISSION_RECOVERY ' not in text)
        records = []
        for line in text.splitlines():
            for marker in ['PINNED_REFUSAL ', 'ADMISSION_RECOVERY ']:
                if marker in line:
                    records.append(dict(kind=marker.strip(), value=json.loads(line.split(marker, 1)[1])))
        result = dict(source=b['source'], arm=os.environ['ARM'], image_sha256=b['sha256'], exit=p.returncode, argv=argv, seconds=time.monotonic() - start, qualified=qualified, records=records, expected='candidate admits after reclaim/release; pinned/oversized/expired calls never execute SQL' if head else 'both recovery cases refuse at the unchanged WAL ceiling; pinned refusal remains valid')
        (r / 'result.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
        raise SystemExit(0 if qualified else 1)
    - name: Seal every result and failure
      if: always()
      shell: python
      run: |
        import hashlib, json, os
        from pathlib import Path
        r = Path(os.environ['RUNNER_TEMP']) / 'wal-review'
        files = [p for p in r.rglob('*') if p.is_file()]
        assert all((not p.is_symlink() for p in files))
        (r / 'members.json').write_text(json.dumps({p.relative_to(r).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, indent=2) + '\n', encoding='utf-8')
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: atlas-wal-${{ matrix.os }}-${{ matrix.arm }}-r3
        path: ${{ runner.temp }}/wal-review/
        if-no-files-found: error
        retention-days: 14
