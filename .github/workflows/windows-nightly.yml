name: Windows nightly journeys
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_run_id: ${{ steps.release.outputs.release_run_id }}
      archive_sha256: ${{ steps.release.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Verify the named nightly release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci/windows_nightly_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-nightly-release
          path: ${{ steps.release.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 2
  providers:
    needs: release
    if: github.ref == 'refs/heads/main'
    environment: nightly-providers
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install pinned provider clients
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global @anthropic-ai/claude-code@2.1.326 @openai/codex@0.169.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-nightly-release
          path: ${{ runner.temp }}/nightly-bundle
      - name: Run both five-journey paths
        shell: pwsh
        env:
          CI_ANTHROPIC_API_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
          CI_OPENAI_API_KEY: ${{ secrets.CI_OPENAI_API_KEY }}
          CI_CLAUDE_MODEL: ${{ vars.CI_CLAUDE_MODEL }}
          CI_CODEX_MODEL: ${{ vars.CI_CODEX_MODEL }}
          NIGHTLY_SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          NIGHTLY_RELEASE_RUN_ID: ${{ needs.release.outputs.release_run_id }}
          NIGHTLY_ARCHIVE_SHA256: ${{ needs.release.outputs.archive_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/nightly-bundle" -File -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows release archive' }
          python -B scripts/ci/windows_nightly_providers.py --archive $archives[0].FullName --archive-sha256 $env:NIGHTLY_ARCHIVE_SHA256 --release-run-id $env:NIGHTLY_RELEASE_RUN_ID --out "$env:RUNNER_TEMP/nightly-evidence"
          exit $LASTEXITCODE
      - name: Delete private provider seeds
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $seedRoot = Join-Path $env:RUNNER_TEMP 'nightly-provider-seeds'
          if (Test-Path -LiteralPath $seedRoot) { Remove-Item -LiteralPath $seedRoot -Recurse -Force }
      - name: Publish the bounded result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-nightly-proof
          path: |
            ${{ runner.temp }}/nightly-evidence/publish/summary.json
            ${{ runner.temp }}/nightly-evidence/publish/*-journey/results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify provider seeds are absent
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $seedRoot = Join-Path $env:RUNNER_TEMP 'nightly-provider-seeds'
          if (Test-Path -LiteralPath $seedRoot) { throw 'Private provider seed cleanup failed' }
