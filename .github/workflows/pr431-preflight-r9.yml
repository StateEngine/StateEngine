name: Moved repository preflight controls r9
'on':
  push:
    branches:
    - prime/pr431-preflight-r9
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  preflight:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 0906dc4ac1e00514e883036352ed0df398dcc849
        persist-credentials: false
        fetch-depth: 50
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: pr431-preflight-r9-${{ matrix.os }}
        cache-workspace-crates: false
    - name: Judge deadline, reservation, Git parity, public consumer and native notices
      shell: python
      run: 'import base64,hashlib,os,subprocess,sys

        from pathlib import Path

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''4aa5b0a2b353893ac2eae8bfae1f9b613c8c01418bd29216ed9d993030a573ef''

        p=Path(os.environ["RUNNER_TEMP"])/"review431-runner-r7.py"

        p.write_bytes(data)

        raise SystemExit(subprocess.call([sys.executable,"-B",str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: review431-preflight-r9-${{ matrix.os }}
        path: ${{ runner.temp }}/review431-results/
        include-hidden-files: true
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
        - windows-2025
    env:
      REVIEW_PREFLIGHT: '1'
