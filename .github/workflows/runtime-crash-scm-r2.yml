name: Runtime crash recovery through an ordinary Windows logon
'on':
  push:
    branches:
    - prime/runtime-crash-scm-282-r2
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PRODUCT_SOURCE: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.PRODUCT_SOURCE }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Extract and authenticate the private native controls
      shell: python
      run: |
        import ast,base64,hashlib,json,os
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'crash-scm-inputs';r.mkdir()
        inputs={'token_context.py': '', 'owned_family.py': '', 'scm-broker.py': '', 'service-probe.py': '', 'worker-entry.py': '', 'run-crash-user.py': '', 'driver.py': '', 'provider.py': '', 'windows_process.py': ''}
        expected={'token_context.py': 'ed4e4714a72a15a337992d771bf4c0a55e83df54a7fbbb69bde33482d9422660', 'owned_family.py': 'f8920dd0561e08556d10c4a6bef7795e106fa674b1d6b07be19ce7fd23ef8190', 'scm-broker.py': '0533ca96c16f89fd89d0a56bf4a09a8a2b16bd794a0d7e0c8bda9d7f39872718', 'service-probe.py': 'c5f5659c229d8409e1b0d120d86091659cb368792b30573201061871a2f028f5', 'worker-entry.py': 'e09f64bae07fdae93c6bebe54db7f1aa7f81bffd51f5c442a02986148b3476fd', 'run-crash-user.py': 'fda3165a9419366c8d2c6c7373f9d2e092388e9a57f195396088ab073c7c020e', 'driver.py': '18416b9f5054e1a253835321dfe2649948d119d01d659dd3e0befaebb7c7d009', 'provider.py': '63ed0e17ade7725725a7a35049540ced089950c4a3b333131db0c2beb4a048a1', 'windows_process.py': '78c4469f9034da4dfbde1cc6c8e897b6a5d41fa3af3c8aed5f41dc0a41a35b58'}
        dependencies={'wheels': [{'name': 'pywin32-312-cp312-cp312-win_amd64.whl', 'sha256': 'b457f6d628a47e8a7346ce22acb7e1a46a4a78b52e1d17e1af56871bd19a93bc', 'url': 'https://files.pythonhosted.org/packages/03/d9/77040d3b43df3f3be32ea289433d660d2727f5ba327bc73be835127d9d60/pywin32-312-cp312-cp312-win_amd64.whl'}, {'name': 'psutil-7.1.0-cp37-abi3-win_amd64.whl', 'sha256': '57f5e987c36d3146c0dd2528cd42151cf96cd359b9d67cfff836995cc5df9a3d', 'url': 'https://files.pythonhosted.org/packages/bf/e9/b44c4f697276a7a95b8e94d0e320a7bf7f3318521b23de69035540b39838/psutil-7.1.0-cp37-abi3-win_amd64.whl'}], 'source': 'Original qualified broker dependency plus PyPI psutil 7.1.0 release metadata'}
        for name,encoded in inputs.items():
            data=base64.b64decode(encoded);assert hashlib.sha256(data).hexdigest()==expected[name]
            ast.parse(data,filename=name);(r/name).write_bytes(data)
        (r/'inputs.json').write_text(json.dumps(expected,indent=2)+'\n')
        (r/'dependencies.json').write_text(json.dumps(dependencies,indent=2)+'\n')
    - name: Install checksum-pinned native process dependencies
      shell: python
      run: |
        import hashlib,json,os,subprocess,sys,urllib.request
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'crash-scm-inputs';wheels=Path(os.environ['RUNNER_TEMP'])/'crash-scm-wheels';wheels.mkdir()
        paths=[]
        for row in json.loads((r/'dependencies.json').read_text())['wheels']:
            p=wheels/row['name']
            with urllib.request.urlopen(row['url'],timeout=120) as response:p.write_bytes(response.read())
            assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'];paths.append(str(p))
        subprocess.run([sys.executable,'-m','pip','install','--no-user','--no-index','--no-deps',*paths],check=True)
    - name: Build the unmodified product at its exact source
      shell: python
      run: |
        import hashlib,json,os,subprocess,time
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'crash-scm-inputs'
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert source==os.environ['PRODUCT_SOURCE']
        compiler=subprocess.check_output(['rustc','-Vv'],text=True);host=next(x.removeprefix('host: ') for x in compiler.splitlines() if x.startswith('host: '))
        assert host=='x86_64-pc-windows-msvc'
        argv=['cargo','build','--target',host,'-p','se','--features','remote','--locked'];start=time.monotonic()
        with (r/'build.log').open('w') as log:result=subprocess.run(argv,stdout=log,stderr=subprocess.STDOUT,timeout=2100)
        image=(Path('target')/host/'debug/se.exe').resolve()
        build=dict(source=source,exit=result.returncode,seconds=time.monotonic()-start,compiler=compiler,target=host,argv=argv,profile='dev',features=['default','remote'],binary=str(image))
        if result.returncode==0:build['binary_sha256']=hashlib.sha256(image.read_bytes()).hexdigest()
        (r/'build.json').write_text(json.dumps(build,indent=2)+'\n');raise SystemExit(result.returncode)
    - name: Join the ordinary-user crash and recovery consumer
      shell: python
      run: |
        import json,os,subprocess,sys
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'crash-scm-inputs';build=json.loads((r/'build.json').read_text());assert build['exit']==0
        rustc=subprocess.check_output(['rustup','which','rustc'],text=True).strip()
        argv=[sys.executable,'-B',str(r/'service-probe.py'),'--image',build['binary'],'--build',str(r/'build.json'),'--rustc',rustc,'--out',str(Path(os.environ['RUNNER_TEMP'])/'crash-scm-attempt')]
        with (r/'service.stdout').open('w') as stdout,(r/'service.stderr').open('w') as stderr:
            result=subprocess.run(argv,stdout=stdout,stderr=stderr,timeout=1100)
        (r/'service-exit.json').write_text(json.dumps(dict(exit=result.returncode,argv=argv))+'\n');raise SystemExit(result.returncode)
    - name: Hash bounded public receipts and cleanup witnesses
      if: always()
      shell: python
      run: |
        import hashlib,json,os,shutil
        from pathlib import Path
        base=Path(os.environ['RUNNER_TEMP']);r=base/'crash-scm-inputs';retained=base/'crash-scm-retained';retained.mkdir()
        shutil.copytree(r,retained/'inputs')
        export=base/'crash-scm-attempt/export'
        if export.exists():shutil.copytree(export,retained/'attempt')
        else:
            summary=base/'crash-scm-attempt/summary.json'
            if summary.is_file():shutil.copyfile(summary,retained/'attempt-summary.json')
            (retained/'missing-export.json').write_text(json.dumps({'missing':True})+'\n')
        files=[p for p in retained.rglob('*') if p.is_file()];assert all(not p.is_symlink() for p in files)
        (retained/'members.json').write_text(json.dumps({p.relative_to(retained).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files},indent=2)+'\n')
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: runtime-crash-scm-windows-r2
        path: ${{ runner.temp }}/crash-scm-retained/
        if-no-files-found: error
