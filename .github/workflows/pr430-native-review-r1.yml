name: Independent Windows venue and cleanup controls
'on':
  push:
    branches:
    - prime/pr430-native-review-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 5104dfa2faf853414f02b5ee271523104bd7ee3a
        persist-credentials: false
        fetch-depth: 1
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: pr430-native-review-v1
        cache-workspace-crates: false
    - name: Judge exact Windows venue, cleanup and both real consumers
      shell: python
      run: 'import base64,hashlib,os,subprocess,sys

        from pathlib import Path

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''a00d50a977b4e5e269a2fe38865c3f3c455f0fde9cf364d504413ad017d086dc''

        p=Path(os.environ[''RUNNER_TEMP''])/''review430-runner.py''

        p.write_bytes(data)

        raise SystemExit(subprocess.call([sys.executable,''-B'',str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: review430-native-windows
        path: ${{ runner.temp }}/review430-results/
        include-hidden-files: true
        if-no-files-found: error
