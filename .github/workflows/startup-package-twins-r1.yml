name: Native packaged startup observation
on:
  push:
    branches: [prime/startup-package-twins-r1]
permissions:
  contents: read
  actions: read
concurrency:
  group: startup-package-twins-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, target: x86_64-pc-windows-msvc}
          - {runner: macos-15, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      MEASURE_SOURCE: b7a3c1c5d9d4f016b237a97c5c0d883645276eda
      MEASURE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f28fef15f0d74bff19203b544d80dfc06ad6d4d9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Initialize isolated evidence paths and read compiler
        id: compiler
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MEASURE_ROOT={root / "startup-package"}\n')
              output.write(f'EVIDENCE_ROOT={root / "startup-package-evidence"}\n')
          text = subprocess.check_output(['git', 'show', os.environ['MEASURE_SOURCE'] + ':rust-toolchain.toml'], text=True)
          channel = tomllib.loads(text)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={channel}\n')
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rust-docs, llvm-tools-preview
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with: {arch: amd64}
      - name: Check observer syntax
        shell: python
        run: |
          import ast, pathlib
          for path in pathlib.Path('scripts/startup_package').glob('*.py'):
              ast.parse(path.read_text())
      - name: Build, strip, assemble and observe the exact native package
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/startup_package/build.py', os.environ['MEASURE_ROOT']], check=True)
      - name: Collect evidence without private homes or compilation caches
        if: ${{ always() }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/startup_package/collect.py', os.environ['MEASURE_ROOT'], os.environ['EVIDENCE_ROOT']], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: startup-package-${{ matrix.target }}
          path: ${{ runner.temp }}/startup-package-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  linux-tail-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MEASURE_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f28fef15f0d74bff19203b544d80dfc06ad6d4d9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Read back the original Linux release archive
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          prior = root / 'original-startup-package'
          subprocess.run(['gh', 'run', 'download', '43653318293', '-R', os.environ['GITHUB_REPOSITORY'], '-n', 'linux-startup-package', '--dir', str(prior)], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'STARTUP_REUSE_ROOT={prior}\n')
              output.write(f'MEASURE_ROOT={root / "linux-startup-tail"}\n')
              output.write(f'EVIDENCE_ROOT={root / "linux-startup-tail-evidence"}\n')
      - name: Check syscall observer availability
        run: strace -V
      - name: Observe ownership-commit tail without changing product bytes
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/startup_package/reuse.py', os.environ['MEASURE_ROOT']], check=True)
      - name: Collect evidence without private homes
        if: ${{ always() }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/startup_package/collect.py', os.environ['MEASURE_ROOT'], os.environ['EVIDENCE_ROOT']], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: startup-package-linux-tail
          path: ${{ runner.temp }}/linux-startup-tail-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
