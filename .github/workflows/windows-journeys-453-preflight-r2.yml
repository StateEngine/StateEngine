name: Native Windows journey preflight
'on':
  push:
    branches:
    - prime/windows-journeys-453-preflight-r2
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  preflight:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      REVIEW_SOURCE: a9d449b59b8956020a95650e0e641c020c8dfdf7
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: a9d449b59b8956020a95650e0e641c020c8dfdf7
        persist-credentials: false
    - uses: ./.github/actions/rust
    - name: Compile native runner inputs
      shell: python
      run: 'import base64,hashlib,subprocess,sys,os

        from pathlib import Path

        b=base64.b64decode('''')

        assert hashlib.sha256(b).hexdigest()==''0d1f1bf27b5a640c857ef337d4608e2f0ba422f8e1d67f8401cdeb0e8ca3a084''

        p=Path(os.environ[''RUNNER_TEMP''])/''journey-preflight.py'';p.write_bytes(b)

        raise SystemExit(subprocess.call([sys.executable,''-B'',str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: windows-journeys-453-preflight-r2
        path: ${{ runner.temp }}/journey-preflight/
        if-no-files-found: error
        include-hidden-files: true
