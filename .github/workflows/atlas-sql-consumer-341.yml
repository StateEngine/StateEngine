name: Atlas public source query plan memory development observations
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: be51bb4ee8442fe984e564c42b95e8c21c340f89
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read pinned compiler
        id: compiler
        shell: python
        run: |
          import os,tomllib
          from pathlib import Path
          channel=tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: print('channel='+channel,file=out)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Measure native twin and candidate smaller source envelopes
        shell: python
        run: |
          FILES={'main.rs': '//! Author development adaptation of the independent component observer; not admission proof.\nmod measure;\nmod parse;\nmod sql;\nmod public_queries;\nuse se_atlas::{model::*, scope::Scope};\nuse se_types::ProjectId;\nuse std::{\n    error::Error,\n    path::{Path, PathBuf},\n    time::{Duration, Instant},\n};\ntype Result<T> = std::result::Result<T, Box<dyn Error>>;\nfn until() -> Instant {\n    Instant::now() + Duration::from_secs(20)\n}\nfn scope(root: &Path) -> Result<Scope> {\n    let source = root.join("source");\n    std::fs::create_dir(&source)?;\n    let native = se_proc::NativeSourceRoot::open(&source)?;\n    Ok(Scope::new(\n        RootRegistration {\n            project: ProjectId::from_parts(1, [7; 10])?,\n            root: RootId::from_parts(1, [8; 10])?,\n            canonical_source_root: source,\n            cache: CacheLocation {\n                directory: root\n                    .join("cache")\n                    .join(ProjectId::from_parts(1, [7; 10])?.as_str())\n                    .join(RootId::from_parts(1, [8; 10])?.as_str()),\n            },\n            git_metadata: None,\n        },\n        native.physical_identity()?,\n    )?)\n}\nfn main() -> Result<()> {\n    let args: Vec<_> = std::env::args().collect();\n    let root = PathBuf::from(args.get(1).ok_or("private fixture directory required")?);\n    std::fs::create_dir(&root)?;\n    use std::os::unix::fs::PermissionsExt;\n    std::fs::set_permissions(&root, std::fs::Permissions::from_mode(0o700))?;\n    se_proc::initialize_file_creation_owner()?;\n    measure::install();\n    let scope = scope(&root)?;\n    let report = if args.get(2).map(String::as_str) == Some("sql") {\n        sql::run(scope, &root)?\n    } else {\n        parse::run(\n            scope,\n            args.get(2).ok_or("grammar required")?,\n            args.get(3).ok_or("pattern required")?,\n        )?\n    };\n    println!("{}", serde_json::to_string(&report)?);\n    std::fs::remove_dir_all(&root)?;\n    Ok(())\n}\n', 'measure.rs': '//! Native allocator observations retain the platform allocator and its size rounding.\nuse std::{\n    alloc::{GlobalAlloc, Layout, System},\n    ffi::c_void,\n    sync::atomic::{AtomicUsize, Ordering},\n};\nstatic LIVE: AtomicUsize = AtomicUsize::new(0);\nstatic PEAK: AtomicUsize = AtomicUsize::new(0);\nfn add(bytes: usize) {\n    let now = LIVE.fetch_add(bytes, Ordering::SeqCst) + bytes;\n    PEAK.fetch_max(now, Ordering::SeqCst);\n}\nfn sub(bytes: usize) {\n    LIVE.fetch_sub(bytes, Ordering::SeqCst);\n}\nunsafe fn size(pointer: *mut c_void) -> usize {\n    if pointer.is_null() {\n        0\n    } else {\n        {\n            #[cfg(target_os="macos")] {unsafe { libc::malloc_size(pointer) }}\n            #[cfg(target_os="linux")] {unsafe { libc::malloc_usable_size(pointer) }}\n        }\n    }\n}\nstruct Observed;\n#[global_allocator]\nstatic ALLOCATOR: Observed = Observed;\nunsafe impl GlobalAlloc for Observed {\n    unsafe fn alloc(&self, layout: Layout) -> *mut u8 {\n        let p = unsafe { System.alloc(layout) };\n        add(unsafe { size(p.cast()) });\n        p\n    }\n    unsafe fn alloc_zeroed(&self, layout: Layout) -> *mut u8 {\n        let p = unsafe { System.alloc_zeroed(layout) };\n        add(unsafe { size(p.cast()) });\n        p\n    }\n    unsafe fn dealloc(&self, pointer: *mut u8, layout: Layout) {\n        sub(unsafe { size(pointer.cast()) });\n        unsafe { System.dealloc(pointer, layout) };\n    }\n    unsafe fn realloc(&self, pointer: *mut u8, layout: Layout, bytes: usize) -> *mut u8 {\n        let old = unsafe { size(pointer.cast()) };\n        let next = unsafe { System.realloc(pointer, layout, bytes) };\n        if !next.is_null() {\n            sub(old);\n            add(unsafe { size(next.cast()) });\n        }\n        next\n    }\n}\nunsafe extern "C" fn tree_alloc(bytes: usize) -> *mut c_void {\n    let p = unsafe { libc::malloc(bytes) };\n    add(unsafe { size(p) });\n    p\n}\nunsafe extern "C" fn tree_zero(count: usize, bytes: usize) -> *mut c_void {\n    let p = unsafe { libc::calloc(count, bytes) };\n    add(unsafe { size(p) });\n    p\n}\nunsafe extern "C" fn tree_realloc(pointer: *mut c_void, bytes: usize) -> *mut c_void {\n    let old = unsafe { size(pointer) };\n    let next = unsafe { libc::realloc(pointer, bytes) };\n    if !next.is_null() || bytes == 0 {\n        sub(old);\n        add(unsafe { size(next) });\n    }\n    next\n}\nunsafe extern "C" fn tree_free(pointer: *mut c_void) {\n    sub(unsafe { size(pointer) });\n    unsafe { libc::free(pointer) };\n}\npub fn install() {\n    unsafe {\n        tree_sitter::set_allocator(\n            Some(tree_alloc),\n            Some(tree_zero),\n            Some(tree_realloc),\n            Some(tree_free),\n        )\n    };\n}\npub fn reset() -> usize {\n    let live = LIVE.load(Ordering::SeqCst);\n    PEAK.store(live, Ordering::SeqCst);\n    live\n}\npub fn peak() -> usize {\n    PEAK.load(Ordering::SeqCst)\n}\npub fn zone() -> serde_json::Value {\n    #[cfg(target_os="macos")] {\n        let mut stats:libc::malloc_statistics_t=unsafe{std::mem::zeroed()};\n        unsafe{libc::malloc_zone_statistics(std::ptr::null_mut(),&mut stats)};\n        serde_json::json!({"in_use":stats.size_in_use,"touched_high_water":stats.max_size_in_use,"reserved":stats.size_allocated})\n    }\n    #[cfg(target_os="linux")] {serde_json::json!({"state":"not measured","reason":"macOS all-zone API unavailable; native-sized live Rust/tree allocations retained"})}\n}\n', 'parse.rs': 'use crate::{Result, measure};\nuse se_atlas::{\n    lifecycle::*,\n    model::*,\n    parse::{ParserPlacement, ParserProfile, SemanticParser},\n    scope::Scope,\n};\nuse se_host::atlas_source::NativeAtlasSource;\nuse se_types::code::AtlasText;\nuse std::{\n    fs,\n    time::{Duration, Instant},\n};\nfn line(language: Language, pattern: &str, index: usize) -> String {\n    match pattern {\n        "definitions" => match language {\n            Language::Rust => {\n                format!("pub fn value_{index}(x: u64) -> u64 {{ x.wrapping_add(2) }}\\n")\n            }\n            Language::Python => format!("def value_{index}(x):\\n return x + 2\\n"),\n            Language::JavaScript => {\n                format!("export function value_{index}(x) {{ return x + 2; }}\\n")\n            }\n            Language::Jsx => format!("export const value_{index} = (x) => <span>{{x}}</span>;\\n"),\n            Language::TypeScript => {\n                format!("export function value_{index}(x:number):number {{ return x + 2; }}\\n")\n            }\n            Language::Tsx => {\n                format!("export const value_{index} = (x:number) => <span>{{x}}</span>;\\n")\n            }\n        },\n        "references" => {\n            if language == Language::Rust {\n                "fn f(){a();a();a();a();a();a();a();a();}\\n".into()\n            } else {\n                "a;a;a;a;a;a;a;a;a;a;a;a;a;a;a;a;\\n".into()\n            }\n        }\n        "comments" => {\n            if language == Language::Python {\n                "# allocator observation only\\n".into()\n            } else {\n                "/* allocator observation only */\\n".into()\n            }\n        }\n        "malformed" => "((({[[[ bad_token = ;\\n".into(),\n        "nesting" => "((((((((((((((((((((((((((((((((".into(),\n        _ => panic!("unknown input pattern"),\n    }\n}\npub fn run(scope: Scope, language: &str, pattern: &str) -> Result<serde_json::Value> {\n    let (language, extension) = match language {\n        "rust" => (Language::Rust, "rs"),\n        "python" => (Language::Python, "py"),\n        "javascript" => (Language::JavaScript, "js"),\n        "jsx" => (Language::Jsx, "jsx"),\n        "typescript" => (Language::TypeScript, "ts"),\n        "tsx" => (Language::Tsx, "tsx"),\n        _ => return Err("unknown grammar".into()),\n    };\n    let source_bytes: usize=std::env::var("MEASURE_SOURCE_BYTES")?.parse()?;\n    let source_limit=u32::try_from(source_bytes)?;\n    let row_limit:u32=std::env::var("MEASURE_ROWS")?.parse()?;\n    let path = RelativePath::new(format!("input.{extension}"))?;\n    let mut source = String::with_capacity(source_bytes);\n    for index in 0..source_bytes {\n        let next = line(language, pattern, index);\n        if source.len() + next.len() > source_bytes {\n            break;\n        }\n        source.push_str(&next);\n    }\n    while source.len() < source_bytes {\n        source.push(\'\\n\');\n    }\n    fs::write(\n        scope.registration.canonical_source_root.join(path.as_str()),\n        source.as_bytes(),\n    )?;\n    drop(source);\n    let native = NativeAtlasSource::open(scope.registration.clone(), CaseMode::Sensitive)?;\n    let profile = ParserProfile::from_qualified_measurement(\n        language,\n        ParserPlacement::Incremental,\n        source_limit,\n        row_limit,\n        8_000_000,\n        3_000_000,\n    )?;\n    let mut parser = SemanticParser::new(scope, vec![profile])?;\n    let budget = ParseBudget {\n        max_source_bytes: source_limit,\n        max_rows: row_limit,\n        max_work: Duration::from_millis(200),\n        max_steps: MAX_PARSE_STEPS,\n        reserved_bytes: 11_000_000+source_limit,\n    };\n    let zone_before = measure::zone();\n    let physical_before = se_proc::atlas_worker::memory_usage()?;\n    let base = measure::reset();\n    let SourceRead::Bytes(snapshot) = native.read(&path, budget)? else {\n        return Err("native source did not return bytes".into());\n    };\n    let started = Instant::now();\n    let result = parser.parse(&snapshot, language, budget);\n    let elapsed_us = started.elapsed().as_micros();\n    let peak = measure::peak().saturating_sub(base);\n    let zone_after = measure::zone();\n    let physical_after = se_proc::atlas_worker::memory_usage()?;\n    let outcome = match &result {\n        Ok(value) => {\n            serde_json::json!({"coverage": format!("{:?}", value.coverage), "symbols": value.symbols.len(), "references": value.references.len(), "imports": value.imports.len(), "scopes": value.scopes.len()})\n        }\n        Err(error) => serde_json::json!({"error": error.body}),\n    };\n    drop(result);\n    drop(snapshot);\n    drop(parser);\n    drop(native);\n    let zone_closed = measure::zone();\n    Ok(\n        serde_json::json!({"grammar":format!("{language:?}"),"pattern":pattern,"source_bytes":source_bytes,"row_allowance":row_limit,"elapsed_us":elapsed_us,\n        "combined_native_sized_rust_tree_peak_increment":peak,"zone_before":zone_before,"zone_after":zone_after,"zone_closed":zone_closed,\n        "physical_peak_before":physical_before,"physical_peak_after":physical_after,"reservation_bytes":11_000_000+source_limit,"work_step_limit":MAX_PARSE_STEPS,"outcome":outcome}),\n    )\n}\n', 'sql.rs': 'use crate::{Result, measure, until};\nuse se_atlas::{\n    cache::{connection::*, pointer, *},\n    model::*,\n    scope::Scope,\n};\nuse se_host::atlas_cache::NativeAtlasCache;\nuse serde_json::{Value, json};\nuse std::{\n    ffi::c_int,\n    path::Path,\n    sync::atomic::{AtomicPtr, Ordering},\n};\nstatic LAST: AtomicPtr<rusqlite::ffi::sqlite3> = AtomicPtr::new(std::ptr::null_mut());\nunsafe extern "C" fn opened(\n    db: *mut rusqlite::ffi::sqlite3,\n    _: *mut *mut libc::c_char,\n    _: *const rusqlite::ffi::sqlite3_api_routines,\n) -> c_int {\n    LAST.store(db, Ordering::Release);\n    rusqlite::ffi::SQLITE_OK\n}\nfn sql_memory(reset: bool) -> Result<(i64, i64)> {\n    let (mut current, mut peak) = (0, 0);\n    let code = unsafe {\n        rusqlite::ffi::sqlite3_status64(\n            rusqlite::ffi::SQLITE_STATUS_MEMORY_USED,\n            &mut current,\n            &mut peak,\n            i32::from(reset),\n        )\n    };\n    if code != 0 {\n        return Err(format!("native SQLite memory counter failed: {code}").into());\n    }\n    Ok((current, peak))\n}\nfn connection_memory(db: *mut rusqlite::ffi::sqlite3) -> Result<Value> {\n    if db.is_null() {\n        return Err("native SQL handle absent".into());\n    }\n    let mut counters = serde_json::Map::new();\n    for (name, operation) in [\n        ("cache", rusqlite::ffi::SQLITE_DBSTATUS_CACHE_USED),\n        ("schema", rusqlite::ffi::SQLITE_DBSTATUS_SCHEMA_USED),\n        ("statements", rusqlite::ffi::SQLITE_DBSTATUS_STMT_USED),\n    ] {\n        let (mut current, mut peak) = (0, 0);\n        let code =\n            unsafe { rusqlite::ffi::sqlite3_db_status(db, operation, &mut current, &mut peak, 0) };\n        if code != 0 {\n            return Err(format!("native SQL counter failed: {code}").into());\n        }\n        counters.insert(name.into(), json!(current));\n    }\n    Ok(Value::Object(counters))\n}\nfn error(value: impl std::fmt::Display) -> se_types::SeError {\n    se_types::SeError::invalid("native SQL admission measurement", &value.to_string())\n}\nfn scan(connection: &mut CacheConnection<\'_>, ordered: bool) -> Result<u64> {\n    Ok(connection.read(until(), |sql| {\n        let mut statement = sql.prepare(if ordered {\n            "SELECT text FROM names ORDER BY length(text),text"\n        } else {\n            "SELECT text FROM names ORDER BY id"\n        })?;\n        let mut rows = statement.query([]).map_err(error)?;\n        let mut bytes = 0;\n        while let Some(row) = rows.next().map_err(error)? {\n            bytes += row\n                .get_ref(0)\n                .map_err(error)?\n                .as_str()\n                .map_err(error)?\n                .len() as u64;\n        }\n        Ok(bytes)\n    })?)\n}\nfn sample(label: &str, handles: &[*mut rusqlite::ffi::sqlite3]) -> Result<Value> {\n    let (current, peak) = sql_memory(false)?;\n    Ok(\n        json!({"phase":label,"sqlite_current":current,"sqlite_high_water":peak,\n        "handles":handles.iter().map(|handle| connection_memory(*handle)).collect::<Result<Vec<_>>>()?,\n        "zone":measure::zone(),"physical_peak":se_proc::atlas_worker::memory_usage()?}),\n    )\n}\npub fn run(scope: Scope, root: &Path) -> Result<Value> {\n    let code = unsafe { rusqlite::ffi::sqlite3_auto_extension(Some(opened)) };\n    if code != 0 {\n        return Err(format!("native SQL handle observer refused: {code}").into());\n    }\n    let cache = NativeAtlasCache::create(&root.join("cache"), scope.clone())?;\n    let coverage = serde_json::from_value(\n        json!({"discovered_files":4096,"indexed_files":4096,"partial_files":0,"deferred_files":0,"failed_files":0,"discovery_complete":true,"stale_files":0,"resolved_references":0,"name_only_references":0,"watched_directories":0,"unwatched_directories":0,"watch_discovery_complete":true,"watch_stats_started":null,"watch_activation_attempts":0,"watch_limited_activations":0,"reasons":[]}),\n    )?;\n    let seed = CacheSeed {\n        identity: CacheIdentity {\n            scope,\n            epoch: CacheEpoch::from_parts(1, [9; 10])?,\n        },\n        extractor_version: "native-admission-control".into(),\n        ignore_digest: ContentHash([0; 32]),\n        coverage,\n        state: IndexState::Current,\n    };\n    let mut cold = CacheConnection::create(\n        &cache,\n        &seed,\n        ConnectionRole::ColdWriter,\n        &SqlProfile::contained_cold(),\n        until(),\n    )?;\n    let consumer=std::env::var_os("MEASURE_PUBLIC_QUERY").is_some();\n    for batch in 0..8 {\n        cold.write(1_000_000, until(), |sql| {\n            let mut statement = sql.prepare("INSERT INTO names(text) VALUES(?1)")?;\n            for row in 0..512 {\n                statement\n                    .execute([format!("entry_{batch}_{row}_{}", "x".repeat(180))])\n                    .map_err(error)?;\n                if consumer {\n                    let id=i64::from(batch*512+row+1);\n                    let mut symbol=[0u8;32];symbol[..8].copy_from_slice(&id.to_be_bytes());\n                    let path=RelativePath::new(format!("file-{id}.rs"))?;\n                    let file=seed.identity.scope.file_id(&path);\n                    sql.prepare("INSERT INTO files(id,key,path,path_key,bytes,identity,coverage_json,last_code_generation,last_author_generation,baseline_reset,language) VALUES(?1,?2,?3,?3,0,x\'01\',\'\\"Indexed\\"\',0,0,0,\'Rust\')")?.execute((id,file.0.as_slice(),path.as_str())).map_err(error)?;\n                    sql.prepare("INSERT INTO symbols(id,key,file,name,kind,start_byte,end_byte,start_line,start_column,end_line,end_column,exported,doc_line) VALUES(?1,?2,?1,?1,\'Function\',0,0,1,0,1,0,0,\'\')")?.execute((id,symbol.as_slice())).map_err(error)?;\n                    sql.prepare("INSERT INTO symbol_fts(rowid,name,split_name,path,container,doc_line) VALUES(?1,?2,\'entry\',?3,\'\',\'\')")?.execute((id,format!("entry_{batch}_{row}_{}","x".repeat(180)),path.as_str())).map_err(error)?;\n                }\n            }\n            Ok(())\n        })?;\n    }\n    pointer::publish(&cache, &mut cold, None, until())?;\n    drop(cold);\n    // Arithmetic-only allowance to open the measured path. It grants no admission.\n    let provisional = SqlProfile::from_qualified_overhead((SQL_QUERY_BYTES - 262_144) / 2)?;\n    sql_memory(true)?;\n    let mut observations = vec![sample("before-host-open", &[])?];\n    for round in 0..if consumer {2}else{12} {\n        let mut writer = CacheConnection::open(\n            &cache,\n            seed.identity.clone(),\n            ConnectionRole::HostWriter,\n            &provisional,\n            until(),\n        )?\n        .ok_or("writer absent")?;\n        let writer_handle = LAST.load(Ordering::Acquire);\n        let mut reader = CacheConnection::open(\n            &cache,\n            seed.identity.clone(),\n            ConnectionRole::HostReader,\n            &provisional,\n            until(),\n        )?\n        .ok_or("reader absent")?;\n        let reader_handle = LAST.load(Ordering::Acquire);\n        observations.push(sample(\n            &format!("{round}-both-open"),\n            &[writer_handle, reader_handle],\n        )?);\n        let bytes = if consumer {\n            let value=crate::public_queries::run(&mut reader)?;\n            observations.push(json!({"phase":format!("{round}-public-source-queries"),"consumer":value}));\n            0\n        } else {scan(&mut writer, false)? + scan(&mut reader, true)?};\n        if !consumer && bytes < 1_000_000 {\n            return Err("SQL fixture did not fill both native caches".into());\n        }\n        observations.push(sample(\n            &format!("{round}-both-scanned"),\n            &[writer_handle, reader_handle],\n        )?);\n        // Hold the maximum admitted statement count while observing real handles.\n        writer.read(until(), |sql| {\n            let mut statements = Vec::new();\n            let mut refused = None;\n            for _ in 0..9 {\n                match sql.prepare("SELECT text FROM names WHERE id=?1") {\n                    Ok(statement) => statements.push(statement),\n                    Err(error) => {\n                        if !matches!(error.body.detail(), se_types::Detail::AtlasResourceBudget(_)) { return Err(error); }\n                        refused = Some(serde_json::to_value(&error.body).map_err(crate::sql::error)?);\n                        break;\n                    },\n                }\n            }\n            if statements.is_empty() {\n                return Err(error("no statement admitted"));\n            }\n            observations.push(json!({"phase":format!("{round}-statement-admission"),"held":statements.len(),"refusal":refused}));\n            observations.push(\n                sample(\n                    &format!("{round}-statements-held"),\n                    &[writer_handle, reader_handle],\n                )\n                .map_err(error)?,\n            );\n            Ok(())\n        })?;\n        drop(reader);\n        drop(writer);\n        observations.push(sample(&format!("{round}-all-closed"), &[])?);\n    }\n    Ok(\n        json!({"provisional_only":true,"sql_total_reservation":SQL_QUERY_BYTES,"fixed_cache_statement_arena_reservation":262_144,"rows":observations,\n        "limitations":["Native bounded adapter inputs; no universal SQL plan or whole-host bound","Allocator reserved/touched memory retained separately from SQLite counters","No allocator configuration, SQL guard or production pragma changed"]}),\n    )\n}\n', 'public_queries.rs': '//! Author development observations of actual source-query plans, not a SQL admission.\nuse crate::{Result, measure};\nuse se_atlas::{\n    cache::connection::CacheConnection,\n    errors::AtlasResult,\n    query::{QueryReader, ReaderContext, RecordReader},\n};\nuse se_types::code::*;\nuse se_types::{ProjectId, Read};\nstruct NoRecords;\nimpl RecordReader for NoRecords {\n    fn read(\n        &self,\n        _: &ProjectId,\n        _: &AtlasPrincipal,\n        _: &RecordPointer,\n        _: Option<&QueryText>,\n    ) -> AtlasResult<Read<RecordHit>> {\n        Err(unexpected())\n    }\n    fn literal_read(\n        &self,\n        _: &ProjectId,\n        _: &AtlasPrincipal,\n        _: &RecordPointer,\n        _: &QueryText,\n    ) -> AtlasResult<Read<RecordHit>> {\n        Err(unexpected())\n    }\n    fn body(\n        &self,\n        _: &ProjectId,\n        _: &AtlasPrincipal,\n        _: &RecordPointer,\n        _: Option<&QueryText>,\n    ) -> AtlasResult<Read<HitBody>> {\n        Err(unexpected())\n    }\n}\nfn unexpected() -> se_types::SeError {\n    se_types::SeError::invalid("source-only query observation", "no record adapter call")\n}\nfn sql_memory() -> Result<(i64, i64)> {\n    let (mut now, mut peak) = (0, 0);\n    // SAFETY: both counter outputs are valid mutable pointers for the native call.\n    let code = unsafe {\n        rusqlite::ffi::sqlite3_status64(\n            rusqlite::ffi::SQLITE_STATUS_MEMORY_USED,\n            &mut now,\n            &mut peak,\n            0,\n        )\n    };\n    if code != rusqlite::ffi::SQLITE_OK {\n        return Err(format!("SQLite status failed: {code}").into());\n    }\n    Ok((now, peak))\n}\npub fn run(connection: &mut CacheConnection<\'_>) -> Result<serde_json::Value> {\n    let viewer = AtlasPrincipal::Agent(se_types::AgentId::from_parts(1, [3; 10])?);\n    let mut reader = QueryReader::new(\n        connection,\n        ReaderContext {\n            memory: None,\n            viewer,\n            records: &NoRecords,\n            source: None,\n            hostless: false,\n            epoch_retired: false,\n            now_unix_ms: Some(1),\n            record_feed_current: true,\n        },\n    );\n    let mut observations = Vec::new();\n    for (kind, mode, text) in [\n        (SearchKind::Symbol, SearchMode::Literal, "entry_"),\n        (SearchKind::Symbol, SearchMode::Broad, "entry"),\n        (SearchKind::Path, SearchMode::Literal, "file-"),\n    ] {\n        let query = FindQuery {\n            query: QueryText::new(text)?,\n            kind,\n            scope: SearchScope {\n                paths: vec![],\n                languages: vec![],\n            },\n            next: None,\n            budget: Validate.query_budget(16, 8192)?,\n            mode: Some(mode),\n            order: SearchOrder::Relevance,\n            full: false,\n            regex: false,\n        };\n        let rust_base = measure::reset();\n        let before = sql_memory()?;\n        let result = reader.find(&query);\n        let sql_after = sql_memory()?;\n        let combined_peak = measure::peak().saturating_sub(rust_base);\n        // Outcome remains separate from allocation observations, including absent/stale live source.\n        let outcome = match result {\n            Ok(answer) => serde_json::json!({"answer":answer}),\n            Err(error) => serde_json::json!({"error":error.body}),\n        };\n        observations.push(serde_json::json!({"kind":format!("{kind:?}"),"mode":format!("{mode:?}"),"sqlite_current_before":before.0,"sqlite_high_water_after":sql_after.1,"native_sized_rust_tree_peak_increment":combined_peak,"outcome":outcome}));\n    }\n    Ok(\n        serde_json::json!({"source_queries":observations,"limitations":"source live verification absent and no records/history/impact/resume plans; actual QueryReader plan observations only, not a general native SQL profile"}),\n    )\n}\n'}
