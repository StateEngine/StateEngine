name: Native harness binding checks
'on':
  push:
    branches: [diag/harness-binding-native]
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d5226048cd714dc6998fdebad4e4b5df895b5d7e
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Run native checks
        shell: python
        run: |
          import base64,hashlib,os,subprocess,sys
          from pathlib import Path
          source=base64.b64decode('')
          assert hashlib.sha256(source).hexdigest()=='f73eaf893bd386a1de1a2d2b145e3fb4cd769b898d5b8ab7461252eddb0b0e39'
          path=Path(os.environ['RUNNER_TEMP'])/'harness-native.py'
          path.write_bytes(source)
          raise SystemExit(subprocess.call([sys.executable,'-B',str(path)]))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-binding-native-windows
          path: ${{ runner.temp }}/harness-binding-native/
          if-no-files-found: error
