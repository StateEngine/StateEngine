name: Review Windows inaccessible ancestry
'on':
  push:
    branches:
    - prime/owner-424-review-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        - arm: head
          source: 15db2ce653d22b833eee6f9d2dcba87f1aa690f3
    env:
      ARM: ${{ matrix.arm }}
      PRODUCT_SOURCE: ${{ matrix.source }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Stage sealed independent consumers
      shell: python
      run: "from pathlib import Path\nimport base64,hashlib,json,os,subprocess,sys,urllib.request\nr=Path(os.environ['RUNNER_TEMP'])/'review414';r.mkdir();c=r/'controls';c.mkdir()\nfiles={'ancestry_trace.py': '', 'cycles.py': '', 'frozen-cycle-inputs.json': '', 'generate.py': '', 'owned_family.py': '', 'probe.rs.in': '', 'process-tree.py': '', 'produce.py': '', 'public_windows.py': '', 'run-standard-user.py': '', 'scm-broker.py': '', 'service-probe.py': '', 'token_context.py': '', 'worker-entry.py': ''}\nfor name,data in files.items():\n raw=base64.b64decode(data);(c/name).write_bytes(raw)\n if name.endswith('.py'):compile(raw.decode(),name,'exec')\n(r/'input-hashes.json').write_text(json.dumps({name:hashlib.sha256((c/name).read_bytes()).hexdigest() for name in files},indent=2)+'\\n')\nif os.name=='nt':\n raw=urllib.request.urlopen('https://files.pythonhosted.org/packages/03/d9/77040d3b43df3f3be32ea289433d660d2727f5ba327bc73be835127d9d60/pywin32-312-cp312-cp312-win_amd64.whl').read()\n assert hashlib.sha256(raw).hexdigest()=='b457f6d628a47e8a7346ce22acb7e1a46a4a78b52e1d17e1af56871bd19a93bc'\n wheel=r/'pywin32-312-cp312-cp312-win_amd64.whl';wheel.write_bytes(raw)\n subprocess.run([sys.executable,'-m','pip','install','--no-user','--no-deps','--no-index',str(wheel)],check=True)\nwith open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as s:s.write('REVIEW414_ROOT='+str(r)+'\\n')\n"
    - name: Build pinned native arm and join owned consumer
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        r=Path(os.environ[''REVIEW414_ROOT''])

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(r/''controls/produce.py'')]).returncode)

        '
    - name: Hash finite evidence and frozen inputs
      if: always()
      shell: python
      run: 'from pathlib import Path

        import hashlib,json,os,shutil

        r=Path(os.environ[''REVIEW414_ROOT'']);e=r/''evidence'';e.mkdir(exist_ok=True)

        shutil.copytree(r/''controls'',e/''frozen-inputs'')

        shutil.copyfile(r/''input-hashes.json'',e/''input-hashes.json'')

        rows=[{''file'':p.relative_to(e).as_posix(),''bytes'':p.stat().st_size,''sha256'':hashlib.file_digest(p.open(''rb''),''sha256'').hexdigest()} for p in sorted(e.rglob(''*'')) if p.is_file() and p.name!=''artifact-manifest.json'']

        (e/''artifact-manifest.json'').write_text(json.dumps(rows,indent=2)+''\n'')

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: owner-424-review-r1-${{ matrix.arm }}
        path: ${{ runner.temp }}/review414/evidence
        retention-days: 2
        include-hidden-files: true
        if-no-files-found: error
        compression-level: 0
