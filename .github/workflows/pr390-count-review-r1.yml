name: Independent exact Git count public controls
'on':
  push:
    branches:
    - prime/pr390-count-review-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  review:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 1a615a352034577ffc9ec82623eb74a29878ecef
        path: head
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        path: base
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: |
        import os,tomllib
        from pathlib import Path
        channel=tomllib.loads(Path('head/rust-toolchain.toml').read_text())['toolchain']['channel']
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:print('channel='+channel,file=f)
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Install pinned outside process observer
      shell: python
      run: |
        import subprocess,sys
        subprocess.run([sys.executable,'-m','pip','install','--disable-pip-version-check','psutil==7.0.0'],check=True)
    - name: Build pinned native images and run public controls
      shell: python
      run: |
        OBSERVER='"""Independent public-consumer count controls and native read timing; no credentials."""\nfrom pathlib import Path\nimport argparse,hashlib,json,math,os,platform,subprocess,tempfile,time,traceback,uuid\nimport psutil\np=argparse.ArgumentParser();p.add_argument(\'--image\',required=True);p.add_argument(\'--source-sha\',required=True);p.add_argument(\'--arm\',choices=[\'base\',\'head\'],required=True);p.add_argument(\'--out\',required=True);a=p.parse_args()\nimage=Path(a.image).resolve();out=Path(a.out).resolve();out.mkdir(parents=True,exist_ok=True)\nfixture=Path(tempfile.mkdtemp(prefix=\'count-review-\',dir=Path.home()));owner=fixture/\'owner\';owner.mkdir(mode=0o700);home=fixture/\'state\';repo=fixture/\'repo\';repo.mkdir();runtime=Path(tempfile.mkdtemp(prefix=\'count-ipc-\'));runtime.chmod(0o700)\nenv={k:v for k,v in os.environ.items() if not k.startswith((\'SE_\',\'STATEENGINE_\',\'CODEX_\',\'CLAUDE\',\'ANTHROPIC_\',\'OPENAI_\',\'GH_\',\'GITHUB_\',\'GIT_\'))}\nenv.update(HOME=str(owner),USERPROFILE=str(owner),XDG_RUNTIME_DIR=str(runtime),GIT_CONFIG_NOSYSTEM=\'1\',GIT_CONFIG_GLOBAL=str(owner/\'empty-config\'),GIT_CONFIG_SYSTEM=str(owner/\'empty-system-config\'),GIT_TERMINAL_PROMPT=\'0\')\n# Git prompt suppression is intentionally scoped to Git commands below; an\n# unrelated GIT_* environment variable would disable the product cache.\nenv.pop(\'GIT_TERMINAL_PROMPT\')\nfor name in [\'XDG_CONFIG_HOME\',\'XDG_CACHE_HOME\',\'XDG_DATA_HOME\',\'XDG_STATE_HOME\',\'CODEX_HOME\',\'APPDATA\',\'LOCALAPPDATA\']:\n d=owner/name.lower();d.mkdir(mode=0o700);env[name]=str(d)\nreport={\'source_sha\':a.source_sha,\'arm\':a.arm,\'image_sha256\':hashlib.sha256(image.read_bytes()).hexdigest(),\'machine\':{\'system\':platform.system(),\'architecture\':platform.machine(),\'cpu_count\':os.cpu_count()},\'fixture\':str(fixture),\'controls\':[],\'calls\':[],\'limitations\':[\'Independent development-image public CLI qualification, no installed lifecycle or provider sessions.\',\'Latency is process start to completed public response; correctness validation and receipt serialization occur afterward.\',\'Three consecutive one-second CPU readings below 15 percent before and after are required to qualify latency.\']}\nproject=None;host=None;launch=None;up_attempted=False\n\ndef save():\n (out/\'report.json\').write_text(json.dumps(report,indent=2)+\'\\n\')\n\ndef git(*args,cwd=None):\n result=subprocess.run([\'git\',\'-C\',str(cwd or repo),*args],env=env,capture_output=True,text=True,timeout=60)\n row={\'kind\':\'git\',\'argv\':list(args),\'cwd\':str(cwd or repo),\'exit\':result.returncode,\'stdout\':result.stdout,\'stderr\':result.stderr};report[\'calls\'].append(row);save()\n assert result.returncode==0,row\n return result.stdout.strip()\n\ndef call(args,project_id=None,cwd=None):\n argv=[str(image),\'--json\',\'--home\',str(home)]\n if project_id:argv+=[\'--project\',project_id]\n argv+=args\n before=time.perf_counter_ns();result=subprocess.run(argv,cwd=cwd or repo,env=env,capture_output=True,timeout=120);elapsed=(time.perf_counter_ns()-before)/1e6\n row={\'kind\':\'public\',\'argv\':args,\'project\':project_id,\'elapsed_ms\':elapsed,\'exit\':result.returncode,\'stdout\':result.stdout.decode(errors=\'replace\'),\'stderr\':result.stderr.decode(errors=\'replace\')};report[\'calls\'].append(row);save()\n assert result.returncode==0,row\n value=json.loads(row[\'stdout\']) if \'--help\' not in args else None\n return value,elapsed\n\ndef init(path,label):\n value,_=call([\'--key\',str(uuid.uuid4()),\'init\',\'--repo\',str(path),\'--name\',label,\'--agent\',\'Reader\',\'--provider\',\'codex\'],cwd=path)\n return value[\'project\'][\'id\'],value[\'agent\'][\'id\']\n\ndef commit(filename,text,label):\n (repo/filename).write_text(text);git(\'add\',\'--\',filename);git(\'-c\',\'user.name=Source fixture\',\'-c\',\'user.email=fixture@example.invalid\',\'commit\',\'-q\',\'-m\',label,\'--\',filename)\n\ndef status(label,path=None,project_id=None,expected_count=None,dirty=False):\n path=path or repo;selected=project_id or project\n expected={\'head\':git(\'rev-parse\',\'HEAD\',cwd=path),\'branch\':git(\'branch\',\'--show-current\',cwd=path),\'commits\':int(git(\'rev-list\',\'--count\',\'HEAD\',cwd=path)),\'uncommitted\':dirty}\n if expected_count is not None:assert expected[\'commits\']==expected_count,(label,expected)\n value,elapsed=call([\'status\'],selected,path);observed=value[\'project\'][\'value\'][\'git\']\n assert observed[\'head\']==expected[\'head\'] and observed[\'commits\']==expected[\'commits\'] and observed[\'uncommitted\']==dirty,(label,expected,observed)\n if expected[\'branch\']:assert observed[\'branch\']==expected[\'branch\'],(label,expected,observed)\n report[\'controls\'].append({\'case\':label,\'expected\':expected,\'observed\':observed,\'elapsed_ms\':elapsed,\'passed\':True});save();return value\n\ntracked={}\ndef census():\n rows=[];uncertain=[];snapshot=[proc.info for proc in psutil.process_iter([\'pid\',\'ppid\',\'exe\',\'cmdline\',\'create_time\',\'status\'],ad_value=None)]\n owned_ids={host[\'pid\']} if host else set()\n while True:\n  previous=len(owned_ids);owned_ids.update(v[\'pid\'] for v in snapshot if v[\'ppid\'] in owned_ids)\n  if len(owned_ids)==previous:break\n for v in snapshot:\n  command=v[\'cmdline\'] or [];same=v[\'exe\'] is not None and os.path.normcase(os.path.realpath(v[\'exe\']))==os.path.normcase(str(image));owned=any(str(home) in arg for arg in command)\n  old=tracked.get(v[\'pid\']);retained=old is not None and (v[\'create_time\'] is None or old==v[\'create_time\'])\n  if same or owned or v[\'pid\'] in owned_ids or retained:\n   if any(v[k] is None for k in [\'ppid\',\'exe\',\'cmdline\',\'create_time\']):uncertain.append(v)\n   tracked[v[\'pid\']]=v[\'create_time\'];rows.append(v)\n assert not uncertain,{\'unreadable_owned_processes\':uncertain}\n return rows\n\ndef start_host():\n global launch,host,up_attempted\n up_attempted=True\n stdout=(out/\'up.stdout\').open(\'wb\');stderr=(out/\'up.stderr\').open(\'wb\')\n try:launch=subprocess.Popen([str(image),\'--json\',\'--home\',str(home),\'up\',\'--foreground\'],cwd=repo,env=env,stdout=stdout,stderr=stderr)\n finally:stdout.close();stderr.close()\n deadline=time.monotonic()+90\n while time.monotonic()<deadline:\n  for line in (out/\'up.stdout\').read_text(errors=\'replace\').splitlines():\n   try:value=json.loads(line)\n   except ValueError:continue\n   if value.get(\'schema\')==\'se.runtime-start/v1\' and value.get(\'state\')==\'running\':\n    proc=psutil.Process(value[\'process\'][\'pid\']);host={\'pid\':proc.pid,\'birth\':proc.create_time(),\'exe\':proc.exe(),\'command\':proc.cmdline()};assert os.path.normcase(os.path.realpath(host[\'exe\']))==os.path.normcase(str(image));report[\'host\']=host;report[\'startup\']=value;save();return\n  assert launch.poll() is None,{\'up_exit\':launch.returncode,\'stdout\':(out/\'up.stdout\').read_text(),\'stderr\':(out/\'up.stderr\').read_text()}\n  time.sleep(.1)\n raise RuntimeError(\'No public runtime readiness before bounded observer deadline\')\n\ndef quiet():\n values=[];consecutive=0\n for _ in range(20):\n  value=psutil.cpu_percent(interval=1);values.append(value);consecutive=consecutive+1 if value<15 else 0\n  if consecutive==3:break\n return {\'system_cpu_percent\':values,\'qualified\':consecutive==3}\n\ndef validate_read(label,value,agent,message):\n assert isinstance(value,dict)\n if label==\'status\':assert value[\'project\'][\'value\'][\'git\'][\'commits\']==6\n else:\n  items=value[\'items\'];assert len(items)==1,(label,len(items))\n  if label==\'agent list\':assert value[\'project\'][\'id\']==project and items[0][\'id\']==agent\n  else:assert items[0][\'id\']==message or items[0].get(\'message_id\')==message,(label,items[0])\n\ntry:\n for args in [[\'init\',\'--help\'],[\'status\',\'--help\'],[\'up\',\'--help\'],[\'down\',\'--help\'],[\'agent\',\'list\',\'--help\'],[\'msg\',\'send\',\'--help\'],[\'msg\',\'inbox\',\'--help\'],[\'msg\',\'list\',\'--help\']]:call(args)\n git(\'init\',\'-q\',\'-b\',\'main\');git(\'config\',\'user.name\',\'Source fixture\');git(\'config\',\'user.email\',\'fixture@example.invalid\')\n for i in range(3):commit(\'source.txt\',f\'original {i}\\n\',f\'Create source {i}\')\n project,agent=init(repo,\'Count review\');report[\'project\']=project;report[\'agent\']=agent\n status(\'cold initial count\',expected_count=3);status(\'warm initial count\',expected_count=3)\n caches=list(home.glob(\'git-count-*\'));report[\'initial_cache_entries\']=[{\'file\':p.name,\'bytes\':p.stat().st_size,\'sha256\':hashlib.sha256(p.read_bytes()).hexdigest()} for p in caches]\n if a.arm==\'head\':assert len(caches)==1,\'Candidate never published its optional cache on a supported ordinary repository\'\n commit(\'source.txt\',\'fourth\\n\',\'Append fourth commit\');status(\'new commit changes count\',expected_count=4);status(\'warm after new commit\',expected_count=4)\n (repo/\'source.txt\').write_text(\'dirty tracked source\\n\');status(\'warm count keeps dirty fresh\',expected_count=4,dirty=True);git(\'restore\',\'--\',\'source.txt\');status(\'working tree becomes clean\',expected_count=4)\n git(\'switch\',\'-q\',\'-c\',\'topic\',\'HEAD~2\');commit(\'topic.txt\',\'topic change\\n\',\'Create topic commit\');status(\'branch switch changes count\',expected_count=3);status(\'warm topic count\',expected_count=3)\n git(\'switch\',\'-q\',\'main\');commit(\'source.txt\',\'fifth\\n\',\'Append fifth commit\');status(\'main advances independently\',expected_count=5)\n git(\'switch\',\'-q\',\'topic\');status(\'return to cached older branch\',expected_count=3);git(\'rebase\',\'main\');status(\'rebase changes ancestry and count\',expected_count=6);status(\'warm after rebase\',expected_count=6)\n git(\'replace\',\'--graft\',\'HEAD\');status(\'same HEAD replacement history bypasses cache\',expected_count=1);git(\'replace\',\'-d\',\'HEAD\');status(\'removed replacement restores count\',expected_count=6)\n # Remove Git\'s now-empty replacement directory so later ordinary reads can\n # exercise reuse again; only our synthetic repository is mutated.\n replacement=repo/\'.git/refs/replace\'\n if replacement.is_dir() and not list(replacement.iterdir()):replacement.rmdir()\n linked=fixture/\'linked\';git(\'worktree\',\'add\',\'--detach\',str(linked),\'HEAD~2\');linked_project,_=init(linked,\'Linked review\');status(\'linked worktree uses its own fresh head\',path=linked,project_id=linked_project,expected_count=4)\n shallow=fixture/\'shallow\';git(\'clone\',\'-q\',\'--depth\',\'1\',\'--branch\',\'topic\',repo.as_uri(),str(shallow));shallow_project,_=init(shallow,\'Shallow review\');status(\'shallow repository retains bounded authoritative count\',path=shallow,project_id=shallow_project,expected_count=1);git(\'fetch\',\'--unshallow\',cwd=shallow);status(\'unshallow changes count at same HEAD\',path=shallow,project_id=shallow_project,expected_count=6)\n # A malformed optional entry must fall back, not become zero or success.\n status(\'rewarm main repository after alternate views\',expected_count=6)\n cache_head=git(\'rev-parse\',\'HEAD\');matches=[p for p in home.glob(\'git-count-*\') if p.read_text().splitlines()[1:2]==[cache_head]]\n if a.arm==\'head\':\n  assert matches\n  for cache in matches:\n   assert cache.is_file() and not cache.is_symlink();cache.write_text(\'incomplete optional count\\n\')\n  status(\'malformed optional metadata preserves fresh count\',expected_count=6)\n start_host();message_value,_=call([\'msg\',\'send\',\'Reader\',\'Independent count review message\',\'--no-wake\'],project);message=message_value[\'message_id\'];report[\'message\']=message\n commands=[(\'status\',40,[\'status\']),(\'agent list\',20,[\'agent\',\'list\']),(\'msg inbox\',20,[\'msg\',\'inbox\',\'Reader\']),(\'msg list\',20,[\'msg\',\'list\',\'--to\',\'Reader\',\'--all\'])]\n for label,_,args in commands:\n  for _ in range(5):value,_=call(args,project);validate_read(label,value,agent,message)\n report[\'quiet_before\']=quiet();report[\'timings\']=[];report[\'outside_before\']=census();save()\n for iteration in range(200):\n  for label,limit,args in commands:\n   value,elapsed=call(args,project);validate_read(label,value,agent,message);report[\'timings\'].append({\'label\':label,\'iteration\':iteration,\'elapsed_ms\':elapsed})\n report[\'quiet_after\']=quiet();report[\'outside_after\']=census();report[\'latencies\']={}\n for label,limit,_ in commands:\n  times=sorted(x[\'elapsed_ms\'] for x in report[\'timings\'] if x[\'label\']==label);p95=times[math.ceil(len(times)*.95)-1]\n  report[\'latencies\'][label]={\'samples\':len(times),\'p95_ms\':p95,\'budget_ms_exclusive\':limit,\'qualified\':report[\'quiet_before\'][\'qualified\'] and report[\'quiet_after\'][\'qualified\'],\'within_budget\':p95<limit}\n assert len(report[\'outside_before\'])==len(report[\'outside_after\'])==1,\'Unexpected persistent process in public read fixture\'\n report[\'completed\']=True;save()\nexcept BaseException as error:\n report[\'failure\']={\'type\':type(error).__name__,\'detail\':str(error),\'traceback\':traceback.format_exc()};save();raise\nfinally:\n if up_attempted:\n  try:\n   down,_=call([\'down\'],project);report[\'down\']=down\n   if launch is not None:report[\'foreground_exit\']=launch.wait(timeout=30)\n   report[\'outside_closed\']=census();assert down[\'complete\'] is True and down[\'witness\'][\'state\']==\'witnessed\' and not report[\'outside_closed\'];assert report[\'foreground_exit\']==0\n  except BaseException as error:report[\'cleanup_failure\']={\'type\':type(error).__name__,\'detail\':str(error)};save();raise\n save()\nprint(json.dumps({\'source_sha\':a.source_sha,\'arm\':a.arm,\'controls\':len(report[\'controls\']),\'latencies\':report.get(\'latencies\'),\'outside_closed\':report.get(\'outside_closed\')},indent=2))\n'
        BASE='7b23fb01a7e16362c6d6b024e5c1801a32bda8c6'
        HEAD='1a615a352034577ffc9ec82623eb74a29878ecef'
        from pathlib import Path
        import hashlib,json,os,re,subprocess,sys
        root=Path.cwd();results=root/'review-results';results.mkdir()
        observer=root/'count-observer.py';observer.write_text(OBSERVER,encoding='utf-8')
        host=re.search(r'^host: (.+)$',subprocess.check_output(['rustc','-vV'],text=True),re.M).group(1)
        summary={'native_target':host,'observer_sha256':hashlib.sha256(observer.read_bytes()).hexdigest(),'arms':[]}
        for arm,sha in [('base',BASE),('head',HEAD)]:
         source=root/arm;out=results/arm;out.mkdir();actual=subprocess.check_output(['git','rev-parse','HEAD'],cwd=source,text=True).strip();assert actual==sha
         target=Path(os.environ['RUNNER_TEMP'])/('count-review-build-'+arm)
         env=dict(os.environ,CARGO_TARGET_DIR=str(target))
         with (out/'build.log').open('wb') as log:
          result=subprocess.run(['cargo','build','--release','--locked','--target',host,'-p','se','--bin','se'],cwd=source,env=env,stdout=log,stderr=subprocess.STDOUT)
         item={'arm':arm,'source_sha':sha,'build_exit':result.returncode};summary['arms'].append(item)
         if result.returncode==0:
          image=target/host/'release'/('se.exe' if os.name=='nt' else 'se');item['image_sha256']=hashlib.sha256(image.read_bytes()).hexdigest()
          with (out/'observer.stdout').open('wb') as stdout,(out/'observer.stderr').open('wb') as stderr:
           observed=subprocess.run([sys.executable,str(observer),'--image',str(image),'--source-sha',sha,'--arm',arm,'--out',str(out)],stdout=stdout,stderr=stderr)
          item['observer_exit']=observed.returncode
         (results/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
        manifest=[]
        for p in results.rglob('*'):
         if p.is_file() and p.name!='manifest.json':manifest.append({'file':p.relative_to(results).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
        (results/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
        assert len(summary['arms'])==2 and all(a['build_exit']==0 and a.get('observer_exit')==0 for a in summary['arms']),summary
    - name: Retain complete readback
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pr390-count-${{ matrix.os }}
        path: review-results
        if-no-files-found: error
        retention-days: 7
