        \ for c in cursors}\\n                retained.update({json.dumps(c[\\'target\\'], sort_keys=True): c for\
        \ c in body[\\'cursors\\']})\\n                cursors = list(retained.values())\\n                if observed:\\\
        n                    break\\n            row[\\'public_stream_marker\\'] = observed\\n            assert\
        \ observed, \\'provider output never reached the public typed client stream\\'\\n            assert (f.repo\
        \ / \\'provider-emitted\\').exists()\\n        # Do not let a successful refusal count as successful shutdown.\\\
        n        down = f.call(\\'down\\')\\n        row[\\'down_exit\\'] = down.returncode\\n        assert down.returncode\
        \ == 0, down.stderr.decode()\\n        value = json.loads(down.stdout)\\n        row[\\'down\\'] = value\\\
        n        assert value[\\'complete\\'] and value[\\'witness\\'][\\'state\\'] == \\'witnessed\\', value\\\
        n        assert not (f.home / \\'endpoint.json\\').exists()\\n        until = time.monotonic() + 5\\n  \
        \      while (not host.exited() or any(not pin.exited() for pin in pins)) and time.monotonic() < until:\\\
        n            time.sleep(.025)\\n        row[\\'outside_exits\\'] = [host.exited(), *[pin.exited() for pin\
        \ in pins]]\\n        row[\\'job_members_after_down\\'] = job.members()\\n        assert all(row[\\'outside_exits\\\
        ']) and not row[\\'job_members_after_down\\']\\n        row[\\'passed\\'] = True\\n    except BaseException:\\\
        n        row[\\'failure\\'] = traceback.format_exc()\\n    finally:\\n        row[\\'emergency_cleanup_used\\\
        '] = False\\n        if f is not None:\\n            try:\\n                if host is None:\\n        \
        \            host = recover_owned_host(f)\\n                if launched and launched.poll() is None:\\n\
        \                    client = Process(launched.pid)\\n                    try:\\n                      \
        \  row[\\'timed_out_client\\'] = client.initial\\n                        client.emergency_stop(f.root)\\\
        n                        launched.wait(timeout=10)\\n                        row[\\'emergency_cleanup_used\\\
        '] = True\\n                    finally:\\n                        client.close()\\n                if host\
        \ and not host.exited():\\n                    retry = f.call(\\'down\\')\\n                    row[\\'cleanup_public_down_exit\\\
        '] = retry.returncode\\n                up_client = getattr(f, \\'up_client\\', None)\\n               \
        \ if up_client is not None:\\n                    try:\\n                        up_client.wait(timeout=3)\\\
        n                    except subprocess.TimeoutExpired:\\n                        pin = Process(up_client.pid)\\\
        n                        try:\\n                            row[\\'unsettled_up_client\\'] = pin.initial\\\
        n                            pin.emergency_stop(f.root)\\n                            up_client.wait(timeout=10)\\\
        n                            row[\\'emergency_cleanup_used\\'] = True\\n                        finally:\\\
        n                            pin.close()\\n                for pin in [*pins, *([host] if host else [])]:\\\
        n                    if not pin.exited():\\n                        row[\\'emergency_cleanup_used\\'] =\
        \ True\\n                        pin.emergency_stop(f.root)\\n                if job:\\n               \
        \     row[\\'members_after_cleanup\\'] = job.members()\\n                    assert not row[\\'members_after_cleanup\\\
        '], \\'owned parent job has live custody\\'\\n            except BaseException:\\n                row[\\\
        'cleanup_failure\\'] = traceback.format_exc()\\n                row[\\'passed\\'] = False\\n           \
        \ for pin in [*pins, *([host] if host else [])]:\\n                pin.close()\\n            if job:\\n\
        \                job.close()\\n        save()\\n        print(json.dumps({\\'case\\': name, \\'passed\\\
        ': row[\\'passed\\'], \\'failure\\': row.get(\\'failure\\'),\\n                          \\'cleanup_failure\\\
        ': row.get(\\'cleanup_failure\\')}), flush=True)\\n\\nreport[\\'complete\\'] = True\\nsave()\\nraise SystemExit(0\
        \ if all(row[\\'passed\\'] for row in report[\\'cases\\']) else 1)\\n'}\nhashes={'native_jobs.py': 'cca368c264082d8dddac6a53398d8b0cd686ae630df1a363cae71f4f26651529',\
        \ 'provider_output.py': '179c0165e071a3003317725c78a161edbbd14c17a7ff23cb32a103d40e5004e5', 'provider_nesting.py':\
        \ 'a42015bac0bf19c26a17bc84fd676f7f3bb067f52c62594a61c3daf537211e61'}\nfor name,code in files.items():\n\
        \    assert hashlib.sha256(code.encode()).hexdigest()==hashes[name]\n    ast.parse(code)\n    (controls/name).write_text(code,encoding='utf-8',newline='')\n\
        (root/'judges.json').write_text(json.dumps(hashes,indent=2)+'\\n')\nwith open(os.environ['GITHUB_ENV'],'a')\
        \ as out:out.write('REVIEW_ROOT='+str(root)+'\\n')"
