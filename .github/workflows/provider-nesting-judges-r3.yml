        \      observed = Extended()\\n        require(k.QueryInformationJobObject(self.handle, 9, C.byref(observed),\
        \ C.sizeof(observed), None))\\n        assert observed.basic.flags == self.flags\\n\\n    def attach(self,\
        \ process):\\n        require(k.AssignProcessToJobObject(self.handle, process.handle))\\n        assert\
