    - name: Collect finite public evidence
      if: ${{ always() }}
      shell: python
      run: "import hashlib,json,os,shutil\nfrom pathlib import Path\nroot=Path(os.environ['REVIEW_ROOT']);archive=root/'archive';archive.mkdir()\n\
        for name in ['inputs.json','image.json','judges.json','build.log','consumer.log','reuse.json']:\n    path=root/name\n\
        \    if path.exists():shutil.copyfile(path,archive/name)\nshutil.copytree(root/'controls',archive/'controls')\n\
        if (root/'bin/se.exe').exists():\n    (archive/'bin').mkdir();shutil.copyfile(root/'bin/se.exe',archive/'bin/se.exe')\n\
        report=root/'results/report.json'\nif report.exists():shutil.copyfile(report,archive/'report.json')\n# Only\
        \ finite public command replies and fixture source are retained. Private\n# owner homes, endpoint frames,\
        \ settings and credentials are excluded.\nfor case in ['nested-public-output','creation-failure-public-down','ordinary-breakaway-output']:\n\
        \    directory=root/'results'/case\n    if not directory.exists():continue\n    dest=archive/case;dest.mkdir()\n\
        \    for pattern in ['up.stdout','up.stderr','launch.stdout','launch.stderr','wrapper-build.stderr','provider.rs','calls/call-*.json',\n\
        \                    'calls/call-*.stdout','calls/call-*.stderr']:\n        for path in directory.glob(pattern):\n\
        \            target=dest/path.relative_to(directory);target.parent.mkdir(exist_ok=True,parents=True)\n \
        \           shutil.copyfile(path,target)\nmanifest={str(path.relative_to(archive)):hashlib.sha256(path.read_bytes()).hexdigest()\n\
        \          for path in archive.rglob('*') if path.is_file()}\n(archive/'sha256sums.json').write_text(json.dumps(manifest,indent=2)+'\\\
        n')"
