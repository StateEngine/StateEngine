    - name: Run all three public native consumers
      shell: python
      run: "import os,subprocess,sys\nfrom pathlib import Path\nroot=Path(os.environ['REVIEW_ROOT'])\ncommand=[sys.executable,'-B',str(root/'controls/provider_nesting.py'),'--source',str(Path('source').resolve()),\n\
