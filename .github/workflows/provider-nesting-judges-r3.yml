        n        require(k.QueryInformationJobObject(self.handle, 3, data, len(data), None))\\n        total, count\
        \ = (W.DWORD * 2).from_buffer(data)\\n        assert total == count and count <= 128, \\'native membership\
        \ exceeded its bounded census\\'\\n        values = (C.c_size_t * count).from_buffer(data, 8)\\n       \
        \ return list(values)\\n\\n    def close(self):\\n        require(k.CloseHandle(self.handle))\\n       \
        \ self.handle = None\\n', 'provider_output.py': '\"\"\"Protocol double: real provider streams and transcript,\
        \ no external account.\"\"\"\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport sys\\nimport\
        \ time\\n\\nsys.dont_write_bytecode = True\\nsys.path.insert(0, str(Path(__file__).parent / \\'protocol\\\
        '))\\nfrom mail_provider import main\\n\\n\\ndef output():\\n    repo = Path.cwd()\\n    ready = json.loads((repo\
        \ / \\'provider-ready.json\\').read_text())\\n    conversation = ready[\\'conversation\\']\\n    # The public\
        \ consumer must establish its current-view cut before output exists.\\n    until = time.monotonic() + 45\\\
        n    while not (repo / \\'emit-output\\').exists():\\n        assert time.monotonic() < until, \\'public\
        \ watch did not arm output barrier\\'\\n        time.sleep(.025)\\n    transcripts = list((Path(os.environ[\\\
        'HOME\\']) / \\'.claude/projects\\').glob(\\'*/*.jsonl\\'))\\n    assert len(transcripts) == 1\\n    message\
        \ = {\\'type\\': \\'assistant\\', \\'sessionId\\': conversation, \\'uuid\\': \\'public-output-proof\\',\\\
        n               \\'message\\': {\\'id\\': \\'public-output-proof\\', \\'role\\': \\'assistant\\',\\n   \
        \                        \\'content\\': [{\\'type\\': \\'text\\', \\'text\\': \\'nested-provider-visible\\\
