name: Independent provider job nesting replay
'on':
  push:
    branches:
    - prime/provider-nesting-judges-r3
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: provider-nesting-replay-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 6b30714d37b1d1ca575e811bba1fc11a633594af
        - arm: head
          source: 7e5465c5c166660fa1fdf7dbbf2fd9b2eb077401
    env:
      REVIEW_SOURCE: ${{ matrix.source }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      REVIEW_ARM: ${{ matrix.arm }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        path: source
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: amd64
    - name: Register disposable hosted account
      shell: python
      run: 'import subprocess,sys

        subprocess.run([sys.executable,''source/scripts/ci/installation_account.py'',''provision''],check=True)'
    - name: Install exact reviewer controls
      shell: python
      run: "import ast,hashlib,json,os\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'provider-nesting'\n\
        root.mkdir()\ncontrols=root/'controls'\ncontrols.mkdir()\nfiles={'native_jobs.py': '\"\"\"Reviewer-owned\
        \ Windows job and exact process witnesses; no product hooks.\"\"\"\\nimport ctypes as C\\nfrom ctypes import\
        \ wintypes as W\\n\\nk = C.WinDLL(\\'kernel32\\', use_last_error=True)\\nnt = C.WinDLL(\\'ntdll\\')\\nHANDLE\
        \ = W.HANDLE\\nk.CreateJobObjectW.argtypes = [C.c_void_p, W.LPCWSTR]\\nk.CreateJobObjectW.restype = HANDLE\\\
        nk.SetInformationJobObject.argtypes = [HANDLE, C.c_int, C.c_void_p, W.DWORD]\\nk.QueryInformationJobObject.argtypes\
        \ = [HANDLE, C.c_int, C.c_void_p, W.DWORD, C.c_void_p]\\nk.AssignProcessToJobObject.argtypes = [HANDLE,\
        \ HANDLE]\\nk.IsProcessInJob.argtypes = [HANDLE, HANDLE, C.POINTER(W.BOOL)]\\nk.OpenProcess.argtypes = [W.DWORD,\
        \ W.BOOL, W.DWORD]\\nk.OpenProcess.restype = HANDLE\\nk.CloseHandle.argtypes = [HANDLE]\\nk.GetProcessTimes.argtypes\
        \ = [HANDLE, C.c_void_p, C.c_void_p, C.c_void_p, C.c_void_p]\\nk.QueryFullProcessImageNameW.argtypes = [HANDLE,\
        \ W.DWORD, W.LPWSTR, C.POINTER(W.DWORD)]\\nk.WaitForSingleObject.argtypes = [HANDLE, W.DWORD]\\nk.WaitForSingleObject.restype\
        \ = W.DWORD\\nk.TerminateProcess.argtypes = [HANDLE, W.UINT]\\nnt.NtQueryInformationProcess.argtypes = [HANDLE,\
        \ W.ULONG, C.c_void_p, W.ULONG, C.c_void_p]\\nnt.NtQueryInformationProcess.restype = C.c_long\\n\\n\\ndef\
        \ require(ok):\\n    if not ok:\\n        raise C.WinError(C.get_last_error())\\n\\n\\nclass UnicodeString(C.Structure):\\\
        n    _fields_ = [(\\'length\\', W.USHORT), (\\'maximum\\', W.USHORT), (\\'buffer\\', C.c_void_p)]\\n\\n\\\
        nclass Basic(C.Structure):\\n    _fields_ = [(\\'process_time\\', C.c_longlong), (\\'job_time\\', C.c_longlong),\\\
        n                (\\'flags\\', W.DWORD), (\\'min_ws\\', C.c_size_t), (\\'max_ws\\', C.c_size_t),\\n    \
        \            (\\'active\\', W.DWORD), (\\'affinity\\', C.c_size_t),\\n                (\\'priority\\', W.DWORD),\
        \ (\\'scheduling\\', W.DWORD)]\\n\\n\\nclass Extended(C.Structure):\\n    _fields_ = [(\\'basic\\', Basic),\
        \ (\\'io\\', C.c_ulonglong * 6),\\n                (\\'process_memory\\', C.c_size_t), (\\'job_memory\\\
        ', C.c_size_t),\\n                (\\'peak_process\\', C.c_size_t), (\\'peak_job\\', C.c_size_t)]\\n\\n\\\
        nclass Process:\\n    def __init__(self, pid):\\n        self.pid = int(pid)\\n        self.handle = k.OpenProcess(0x1000\
        \ | 0x100000 | 0x100 | 1, False, self.pid)\\n        require(self.handle)\\n        self.initial = self.observe()\\\
        n\\n    def observe(self):\\n        created, exited, kernel, user = (C.c_ulonglong() for _ in range(4))\\\
        n        require(k.GetProcessTimes(self.handle, C.byref(created), C.byref(exited),\\n                  \
        \                C.byref(kernel), C.byref(user)))\\n        image, count = C.create_unicode_buffer(32768),\
        \ W.DWORD(32768)\\n        require(k.QueryFullProcessImageNameW(self.handle, 0, image, C.byref(count)))\\\
        n        buffer = C.create_string_buffer(65536)\\n        status = nt.NtQueryInformationProcess(self.handle,\
        \ 60, buffer, len(buffer), None)\\n        if status < 0:\\n            raise RuntimeError(f\\'bounded native\
        \ command line query failed: {status:#x}\\')\\n        value = UnicodeString.from_buffer(buffer)\\n    \
        \    start, end = C.addressof(buffer), C.addressof(buffer) + len(buffer)\\n        assert value.length %\
        \ 2 == 0 and start <= value.buffer <= end\\n        assert value.buffer + value.length <= end\\n       \
        \ command = C.wstring_at(value.buffer, value.length // 2)\\n        return {\\'pid\\': self.pid, \\'creation_filetime\\\
        ': created.value,\\n                \\'image\\': image.value, \\'command\\': command, \\'exited\\': self.exited()}\\\
        n\\n    def exited(self):\\n        code = k.WaitForSingleObject(self.handle, 0)\\n        assert code in\
        \ (0, 258), f\\'native process wait failed: {code}\\'\\n        return code == 0\\n\\n    def member(self,\
        \ job=None):\\n        present = W.BOOL()\\n        require(k.IsProcessInJob(self.handle, job, C.byref(present)))\\\
        n        return bool(present.value)\\n\\n    def emergency_stop(self, owned_path):\\n        if self.exited():\\\
        n            return\\n        current = self.observe()\\n        assert current[\\'creation_filetime\\']\
        \ == self.initial[\\'creation_filetime\\']\\n        assert str(owned_path).casefold() in current[\\'command\\\
        '].casefold(), current\\n        require(k.TerminateProcess(self.handle, 91))\\n        assert k.WaitForSingleObject(self.handle,\
        \ 10000) == 0\\n\\n    def close(self):\\n        if self.handle:\\n            require(k.CloseHandle(self.handle))\\\
        n            self.handle = None\\n\\n\\nclass Job:\\n    def __init__(self, allow_breakaway):\\n       \
        \ self.handle = k.CreateJobObjectW(None, None)\\n        require(self.handle)\\n        self.flags = 0x800\
