        n            with (output / (name + \\'.stdout\\')).open(\\'wb\\') as stdout, (output / (name\
        \ + \\'.stderr\\')).open(\\'wb\\') as stderr:\\n                completed = subprocess.run(argv,\
        \ env=environment, stdout=stdout, stderr=stderr, timeout=120)\\n            row.update(argv=argv,\
