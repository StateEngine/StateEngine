name: Frozen Windows worker clocks and native retention inputs
'on':
  push:
    branches:
    - prime/pr367-windows-portable-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  producer:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: d4edee95c9b913b91c8a2d2eea9a99e6410796cc
        path: source
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
    - name: Stage frozen portable producer and judges
      shell: python
      run: "from pathlib import Path\nFILES={'producer.py': '\"\"\"Build frozen Windows inputs and prove\
        \ their real consumers execute.\"\"\"\\nimport argparse\\nimport hashlib\\nimport json\\nimport\
        \ os\\nfrom pathlib import Path\\nimport shutil\\nimport subprocess\\nimport sys\\nimport time\\\
        n\\nPIN = \\'d4edee95c9b913b91c8a2d2eea9a99e6410796cc\\'\\nROOT = Path(__file__).resolve().parent\\\
        nJUDGES = [\\n    \\'crates/se-host/src/atlas_cold/clock_windows_review.rs\\',\\n    \\'crates/se-host/tests/windows_worker_retention_review.rs\\\
        ',\\n    \\'crates/se-host/tests/review_windows_retention/observer.py\\',\\n    \\'crates/se-host/tests/review_windows_retention/windows_process.py\\\
        ',\\n    \\'crates/se-proc/examples/phase_review_worker.rs\\',\\n]\\n\\n\\ndef digest(path):\\\
        n    return hashlib.sha256(path.read_bytes()).hexdigest()\\n\\n\\ndef save(path, value):\\n  \
        \  path.write_text(json.dumps(value, indent=2) + \\'\\\\n\\', encoding=\\'utf-8\\')\\n\\n\\ndef\
        \ stage(source, package):\\n    hashes = {}\\n    for name in JUDGES:\\n        payload = (ROOT\
        \ / name).read_bytes()\\n        target = source / name\\n        assert not target.exists(),\
        \ \\'review source would overwrite an existing file: \\' + name\\n        target.parent.mkdir(parents=True,\
        \ exist_ok=True)\\n        target.write_bytes(payload)\\n        copy = package / \\'judges\\\
        ' / name\\n        copy.parent.mkdir(parents=True, exist_ok=True)\\n        copy.write_bytes(payload)\\\
        n        hashes[name] = digest(copy)\\n    job = source / \\'crates/se-host/src/atlas_cold/job.rs\\\
        '\\n    before = job.read_bytes()\\n    # A child module defaults to job/; explicitly select the\
        \ sibling source.\\n    suffix = b\\'\\\\n#[cfg(all(test, windows))]\\\\n#[path = \"clock_windows_review.rs\"\
        ]\\\\nmod clock_windows_review;\\\\n\\'\\n    assert b\\'clock_windows_review\\' not in before\\\
        n    job.write_bytes(before + suffix)\\n    shutil.copyfile(ROOT / \\'run_portable.py\\', package\
        \ / \\'run_portable.py\\')\\n    return {\\'source\\': PIN, \\'judges\\': hashes, \\'product_overlay\\\
        ': {\\n        \\'path\\': job.relative_to(source).as_posix(), \\'before_sha256\\': hashlib.sha256(before).hexdigest(),\\\
        n        \\'after_sha256\\': digest(job), \\'suffix\\': suffix.decode(), \\'scope\\': \\'test-only\
        \ module inclusion\\'}}\\n\\n\\ndef main():\\n    parser = argparse.ArgumentParser(description=__doc__)\\\
        n    parser.add_argument(\\'--source\\', type=Path, required=True)\\n    parser.add_argument(\\\
        '--output\\', type=Path, required=True)\\n    parser.add_argument(\\'--stage-only\\', action=\\\
        'store_true\\')\\n    args = parser.parse_args()\\n    source, output = args.source.resolve(),\
        \ args.output.resolve()\\n    head = subprocess.check_output([\\'git\\', \\'rev-parse\\', \\'HEAD\\\
        '], cwd=source, text=True).strip()\\n    dirty = subprocess.check_output([\\'git\\', \\'status\\\
        ', \\'--porcelain\\'], cwd=source, text=True)\\n    assert head == PIN and not dirty, \\'fresh\
        \ exact owned source required\\'\\n    output.mkdir(parents=True, exist_ok=False)\\n    package\
        \ = output / \\'portable\\'\\n    package.mkdir()\\n    if args.stage_only:\\n        save(output\
        \ / \\'stage-receipt.json\\', dict(stage(source, package), native_execution=\\'unrun\\'))\\n \
        \       print(\\'Shared Python staging passed; native Windows compile and product calls remain\
        \ unrun.\\')\\n        return\\n    assert sys.platform == \\'win32\\', \\'native Windows producer\
        \ required\\'\\n    assert shutil.which(\\'dumpbin.exe\\'), \\'native dependency inspector required\
        \ before compilation\\'\\n    target = \\'x86_64-pc-windows-msvc\\'\\n    target_directory = output.parent\
        \ / (output.name + \\'-target\\')\\n    assert not target_directory.exists(), \\'fresh compilation\
        \ target required\\'\\n    env = dict(os.environ, CARGO_TARGET_DIR=str(target_directory), CARGO_BUILD_JOBS=\\\
        '2\\',\\n               CARGO_INCREMENTAL=\\'0\\', CARGO_PROFILE_DEV_DEBUG=\\'0\\', CARGO_PROFILE_TEST_DEBUG=\\\
        '0\\',\\n               CARGO_PROFILE_RELEASE_OPT_LEVEL=\\'s\\', CARGO_PROFILE_RELEASE_LTO=\\\
        'false\\')\\n    phases = []\\n\\n    def run(label, argv, timeout=2400):\\n        start = time.monotonic_ns()\\\
        n        row = {\\'phase\\': label, \\'argv\\': [str(x) for x in argv], \\'source\\': PIN}\\n\
        \        try:\\n            with (output / (label + \\'.stdout\\')).open(\\'wb\\') as stdout,\
        \ (output / (label + \\'.stderr\\')).open(\\'wb\\') as stderr:\\n                result = subprocess.run(row[\\\
        'argv\\'], cwd=source, env=env, stdout=stdout, stderr=stderr, timeout=timeout)\\n            row.update(exit=result.returncode,\
        \ state=\\'passed\\' if result.returncode == 0 else \\'failed\\')\\n        except Exception as\
        \ error:\\n            row.update(state=\\'failed\\', error=f\\'{type(error).__name__}: {error}\\\
        ')\\n        row[\\'elapsed_ns\\'] = time.monotonic_ns() - start\\n        phases.append(row)\\\
        n        save(output / \\'phases.json\\', phases)\\n        print(json.dumps(row), flush=True)\\\
        n        return row[\\'state\\'] == \\'passed\\'\\n\\n    shipping = [\\'cargo\\', \\'build\\\
        ', \\'--release\\', \\'--target\\', target, \\'--package\\', \\'se\\', \\'--bin\\', \\'se\\',\\\
        n                \\'--no-default-features\\', \\'--features\\', \\'remote\\', \\'--locked\\']\\\
        n    if run(\\'build-frozen-worker\\', shipping):\\n        image = target_directory / target\
        \ / \\'release/se.exe\\'\\n        shutil.copyfile(image, package / \\'worker.exe\\')\\n     \
        \   save(package / \\'worker-source.json\\', {\\'source\\': PIN, \\'source_clean\\': True,\\n\
        \             \\'sha256\\': digest(image), \\'features\\': [\\'remote\\'], \\'profile\\': \\'release\\\
        ',\\n             \\'opt_level\\': \\'s\\', \\'lto\\': False, \\'argv\\': shipping})\\n    receipt\
        \ = stage(source, package)\\n    save(package / \\'judge-sources.json\\', receipt)\\n    builds\
        \ = [\\n        (\\'build-phase-fixture\\', [\\'cargo\\', \\'build\\', \\'--release\\', \\'--target\\\
        ', target, \\'-p\\', \\'se-proc\\',\\n                                 \\'--example\\', \\'phase_review_worker\\\
        ', \\'--locked\\'],\\n         target_directory / target / \\'release/examples/phase_review_worker.exe\\\
        ', \\'phase_worker.exe\\'),\\n        (\\'build-clock-consumer\\', [\\'cargo\\', \\'test\\', \\\
        '--no-run\\', \\'--message-format=json\\', \\'--target\\', target,\\n                        \
        \         \\'-p\\', \\'se-host\\', \\'--all-features\\', \\'--locked\\', \\'--lib\\'], None, \\\
        'clock_judge.exe\\'),\\n        (\\'build-retention-consumer\\', [\\'cargo\\', \\'test\\', \\\
        '--no-run\\', \\'--message-format=json\\', \\'--target\\', target,\\n                        \
        \             \\'-p\\', \\'se-host\\', \\'--all-features\\', \\'--locked\\', \\'--test\\',\\n\
        \                                     \\'windows_worker_retention_review\\'], None, \\'retention_judge.exe\\\
        '),\\n    ]\\n    for label, argv, executable, destination in builds:\\n        if not run(label,\
        \ argv):\\n            continue\\n        if executable is None:\\n            candidates = []\\\
        n            for line in (output / (label + \\'.stdout\\')).read_text(encoding=\\'utf-8\\').splitlines():\\\
        n                if not line.startswith(\\'{\\'):\\n                    continue\\n          \
        \      row = json.loads(line)\\n                if row.get(\\'reason\\') == \\'compiler-artifact\\\
        ' and row.get(\\'executable\\') and row.get(\\'profile\\', {}).get(\\'test\\'):\\n           \
        \         candidates.append(Path(row[\\'executable\\']))\\n            assert len(candidates)\
        \ == 1, \\'ambiguous test executable\\'\\n            executable = candidates[0]\\n        shutil.copyfile(executable,\
        \ package / destination)\\n    compiler = subprocess.check_output([\\'rustc\\', \\'-Vv\\'], cwd=source,\
        \ text=True)\\n    save(package / \\'compiler.json\\', {\\'compiler\\': compiler, \\'target\\\
        ': target})\\n    for image in sorted(package.glob(\\'*.exe\\')):\\n        run(\\'dependencies-\\\
        ' + image.stem, [\\'dumpbin.exe\\', \\'/dependents\\', image], timeout=30)\\n    files = {p.relative_to(package).as_posix():\
        \ digest(p) for p in package.rglob(\\'*\\') if p.is_file()}\\n    save(package / \\'inputs.json\\\
        ', {\\'source\\': PIN, \\'target\\': target, \\'files\\': files,\\n         \\'not_exercised\\\
        ': [\\'Linux-only incremental parser owner\\', \\'native VM containment\\'],\\n         \\'retention_judge_source_base\\\
        ': \\'5e6932a4f07d3c6b0e5d00d7b03fc75674f69bcc\\',\\n         \\'integration_delta\\': \\'Image\
        \ identity uses samefile to accept native Windows path spellings.\\'})\\n    run(\\'native-smoke\\\
        ', [sys.executable, \\'-B\\', package / \\'run_portable.py\\', \\'--package\\', package,\\n  \
        \                      \\'--output\\', output / \\'hosted-smoke\\', \\'--case\\', \\'all\\'],\
        \ timeout=300)\\n    shutil.make_archive(str(output / \\'portable-inputs\\'), \\'zip\\', package)\\\
        n    save(output / \\'portable-archive.json\\', {\\'sha256\\': digest(output / \\'portable-inputs.zip\\\
        '),\\n                                         \\'bytes\\': (output / \\'portable-inputs.zip\\\
        ').stat().st_size})\\n    assert all(row[\\'state\\'] == \\'passed\\' for row in phases), phases\\\
        n\\n\\nif __name__ == \\'__main__\\':\\n    main()\\n', 'run_portable.py': '\"\"\"Verify frozen\
        \ Windows inputs, then run real clock and retention consumers.\"\"\"\\nimport argparse\\nimport\
        \ hashlib\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport subprocess\\nimport sys\\\
        nimport time\\n\\nPIN = \\'d4edee95c9b913b91c8a2d2eea9a99e6410796cc\\'\\nCASES = {\\n    \\'clock\\\
        ': (\\'clock_judge.exe\\', \\'atlas_cold::job::clock_windows_review::source_and_parse_share_original_clock_and_reaped_slot\\\
        '),\\n    \\'retention\\': (\\'retention_judge.exe\\', \\'pending_reap_fences_the_slot_until_exact_native_exit\\\
        '),\\n}\\n\\n\\ndef digest(path):\\n    return hashlib.sha256(path.read_bytes()).hexdigest()\\\
        n\\n\\ndef verify(package):\\n    manifest = json.loads((package / \\'inputs.json\\').read_text(encoding=\\\
        'utf-8\\'))\\n    assert manifest[\\'source\\'] == PIN and manifest[\\'target\\'] == \\'x86_64-pc-windows-msvc\\\
        '\\n    expected = manifest[\\'files\\']\\n    actual = {p.relative_to(package).as_posix() for\
