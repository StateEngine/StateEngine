        \ / \\'judges/crates/se-host/tests/review_windows_retention/observer.py\\'))\\n    rows = []\\\
        n    for name, (binary, test) in CASES.items():\\n        if args.case != \\'all\\' and name !=\
        \ args.case:\\n            continue\\n        row = {\\'case\\': name, \\'state\\': \\'unrun\\\
        ', \\'source\\': PIN}\\n        try:\\n            executable = package / binary\\n          \
        \  listing = subprocess.run([str(executable), \\'--list\\'], env=environment,\\n             \
        \                        capture_output=True, text=True, timeout=30)\\n            assert listing.returncode\
        \ == 0 and test + \\': test\\' in listing.stdout, \\'required test absent\\'\\n            environment[\\\
