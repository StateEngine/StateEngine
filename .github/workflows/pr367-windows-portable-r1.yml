        n    parser.add_argument(\\'--output\\', type=Path)\\n    parser.add_argument(\\'--case\\', choices=[\\\
        'all\\', *CASES], default=\\'all\\')\\n    parser.add_argument(\\'--verify-only\\', action=\\\
        'store_true\\')\\n    args = parser.parse_args()\\n    package = args.package.resolve()\\n   \
        \ manifest = verify(package)\\n    if args.verify_only:\\n        assert {\\'worker.exe\\', \\\
        'phase_worker.exe\\', \\'clock_judge.exe\\', \\'retention_judge.exe\\'} <= set(manifest[\\'files\\\
        ']), \\'native inputs incomplete\\'\\n        print(json.dumps({\\'inputs_verified\\': True, \\\
        'source\\': PIN, \\'files\\': len(manifest[\\'files\\']),\\n                          \\'native_execution\\\
        ': \\'not run\\'}))\\n        return\\n    assert sys.platform == \\'win32\\', \\'native Windows\
