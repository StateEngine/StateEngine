        \  let ready: serde_json::Value = serde_json::from_str(line.trim())?;\\n        assert_eq!(ready[\"\
        ready\"][\"pid\"].as_u64(), Some(u64::from(pid)));\\n        assert_eq!(ready[\"ready\"][\"exited\"\
