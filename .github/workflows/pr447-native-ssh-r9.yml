name: Review native Windows owner inbox follow using authenticated image
'on':
  push:
    branches:
    - prime/pr447-native-ssh-r9
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      REVIEW_SOURCE: 89d63d517737642b90552457e1c122c0bdb7d739
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 89d63d517737642b90552457e1c122c0bdb7d739
        path: source
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Stage frozen independent controls
      shell: python
      run: 'from pathlib import Path

        import base64,hashlib,json,os

        r=Path(os.environ[''RUNNER_TEMP''])/''owner-follow-native'';r.mkdir(exist_ok=True)

        files={''judge.py'': '''',
        ''setup-ssh.ps1'': '''',
        ''preflight.py'': ''''}

        for name,data in files.items():(r/name).write_bytes(base64.b64decode(data))

        (r/''controls.json'').write_text(json.dumps({n:hashlib.sha256(base64.b64decode(b)).hexdigest() for n,b in files.items()},indent=2)+''\n'')

        '
    - name: Prepare a disposable native SSH server
      shell: pwsh
      run: '& "$env:RUNNER_TEMP/owner-follow-native/setup-ssh.ps1"'
    - name: Check independent SSH fixture before compilation
      shell: pwsh
      run: 'python -B "$env:RUNNER_TEMP/owner-follow-native/preflight.py"

        exit $LASTEXITCODE'
    - name: Authenticate and install the retained native candidate image
      shell: python
      env:
        ARTIFACT_READ_TOKEN: ${{ github.token }}
      run: "from pathlib import Path\nimport hashlib,json,os,urllib.request,urllib.error,zipfile,shutil\nr=Path(os.environ['RUNNER_TEMP'])/'owner-follow-native';r.mkdir(exist_ok=True)\n\
        prefix='https://api.github.com/repos/StateEngine/StateEngine/'\nheaders={'Authorization':'Bearer '+os.environ['ARTIFACT_READ_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}\n\
        with urllib.request.urlopen(urllib.request.Request(prefix+'actions/artifacts/14215314311',headers=headers),timeout=30)\
        \ as f:meta=json.load(f)\nexpected='sha256:603b3419374a47ea251e5b2fb1474924468d38edd6c3331c896a9b91b6710028'\nassert\
        \ meta['digest']==expected and meta['workflow_run']['id']==43846488827 and meta['name']=='pr447-native-image-r8' and\
        \ not meta['expired']\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,req,fp,code,msg,hdrs,newurl):return\
        \ None\ntry:\n urllib.request.build_opener(NoRedirect).open(urllib.request.Request(prefix+'actions/artifacts/14215314311/zip',headers=headers),timeout=30)\n\
        \ raise AssertionError('Expected artifact download redirect')\nexcept urllib.error.HTTPError as e:\n assert e.code==302\n\
        \ url=e.headers['Location']\narchive=r/'source-image.zip'\nwith urllib.request.urlopen(url,timeout=60) as f,archive.open('wb')\
        \ as out:shutil.copyfileobj(f,out)\nwith archive.open('rb') as f:assert 'sha256:'+hashlib.file_digest(f,'sha256').hexdigest()==expected\n\
        installed=r/'installed/se.exe';installed.parent.mkdir()\nwith zipfile.ZipFile(archive) as z:\n members=z.infolist();assert\
        \ len(members)==1 and members[0].filename=='se.exe' and members[0].file_size<100*1024**2\n with z.open(members[0])\
        \ as src,installed.open('wb') as out:shutil.copyfileobj(src,out)\nrecord={'source': '89d63d517737642b90552457e1c122c0bdb7d739',\
        \ 'argv': ['cargo', 'build', '--profile', 'distribution', '--target', 'x86_64-pc-windows-msvc', '-p', 'se', '--bin',\
        \ 'se', '--locked'], 'exit': 0, 'seconds': 777.7349999999999, 'rustc': 'rustc 1.97.1 (8bab26f4f 2026-07-14)\\nbinary:\
        \ rustc\\ncommit-hash: 8bab26f4f68e0e26f0bb7960be334d5b520ea452\\ncommit-date: 2026-07-14\\nhost: x86_64-pc-windows-msvc\\\
        nrelease: 1.97.1\\nLLVM version: 22.1.6\\n', 'compiled_image_sha256': '4e81b4ef5c8bec877f5a1f1b5bafb128e8cde6d0fd8ed8aa9cd26e986751c497',\
        \ 'image_sha256': '4e81b4ef5c8bec877f5a1f1b5bafb128e8cde6d0fd8ed8aa9cd26e986751c497', 'installed_link_count': 1}\n\
        with installed.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==record['image_sha256']\nassert\
        \ installed.stat().st_nlink==1\nrecord['reused_native_run']=43846488827;record['reused_api_zip_digest']=expected;record['installed_link_count']=installed.stat().st_nlink\n\
        (r/'build.json').write_text(json.dumps(record,indent=2)+'\\n')\n"
    - name: Witness SSH close, last cursor and zero orphaned session processes
      shell: pwsh
      run: 'python -B "$env:RUNNER_TEMP/owner-follow-native/judge.py"

        exit $LASTEXITCODE'
    - name: Hash explicit finite evidence
      if: always()
      shell: python
      run: "from pathlib import Path\nimport hashlib,json,os,shutil\nr=Path(os.environ['RUNNER_TEMP'])/'owner-follow-native';out=r/'evidence';out.mkdir(parents=True,exist_ok=True)\n\
        for name in ['controls.json','build.json','build.stdout','build.stderr']:\n if (r/name).is_file():shutil.copyfile(r/name,out/name)\n\
        rows=[]\nfor p in sorted(out.iterdir()):\n assert p.is_file() and p.suffix in ['.json','.stdout','.stderr'], 'Evidence\
        \ must be an explicit finite top-level file'\n assert p.stat().st_size<16*1024**2\n with p.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()\n\
        \ rows.append(dict(file=p.name,bytes=p.stat().st_size,sha256=digest))\n(out/'artifact-manifest.json').write_text(json.dumps(rows,indent=2)+'\\\
        n')\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: pr447-native-ssh-r9
        path: ${{ runner.temp }}/owner-follow-native/evidence/*
        if-no-files-found: error
        retention-days: 7
