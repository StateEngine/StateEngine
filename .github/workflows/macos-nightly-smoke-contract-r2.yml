name: Native macOS smoke retained-package correction r2
'on':
  push:
    branches:
    - prime/macos-nightly-smoke-contract-r2
  workflow_dispatch:
    inputs:
      nightly_binding:
        description: Strict se.nightly-binding/v1 from Linux run.json after archive creation
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: native-macos-nightly-${{ github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  NIGHTLY_BINDING: '{"schema":"se.nightly-binding/v1","started_at":"2026-11-15T09:30:00.535961+00:00","product_commit":"7b23fb01a7e16362c6d6b024e5c1801a32bda8c6","judge_commit":"d8bc5f3c3e0cef67c0d5a5e26a025e0623dedf33","linux_archive_sha256":"b11ef17439f64347544239367bb70d8a254a8b3dd72dde74b3e257c088d57cbe"}'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  package:
    name: Verify retained exact-nightly native package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - &id001
      name: Check out adapter at the workflow commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: c4b557ce384cde5c8051983c6b56f42de1b1c249
        path: controller
        persist-credentials: false
    - &id002
      name: Bind exact nightly source and record adapter inventory
      id: binding
      env:
        WORKFLOW_SHA: c4b557ce384cde5c8051983c6b56f42de1b1c249
      run: "python3 -B - <<'PY'\nimport hashlib, json, os, subprocess, sys\nfrom pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP'])\n\
        controller = Path(os.environ['GITHUB_WORKSPACE']) / 'controller'\ncommit = subprocess.check_output(['git',\
        \ '-C', str(controller), 'rev-parse', 'HEAD'], text=True).strip()\nif commit != os.environ['WORKFLOW_SHA']:\n\
        \    raise RuntimeError('Adapter checkout differs from the workflow commit')\nsource = controller / 'journeys/hosted_macos'\n\
        sys.path.insert(0, str(source))\nfrom common import binding, save\nvalue = os.environ['NIGHTLY_BINDING']\n\
        if len(value.encode()) > 4096:\n    raise RuntimeError('Nightly binding is oversized')\nnightly = binding(json.loads(value))\n\
        save(root / 'nightly-binding.json', nightly)\nfiles = {path.name: hashlib.sha256(path.read_bytes()).hexdigest()\
        \ for path in sorted(source.glob('*.py'))}\nif not files:\n    raise RuntimeError('Adapter source inventory\
        \ is absent')\nsave(root / 'observer-source.json', dict(schema='se.hosted-observer/v1', commit=commit, files=files))\n\
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:\n    print('product_commit=' + nightly['product_commit'],\
        \ file=out)\nPY\n"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-nightly-package
        path: ${{ runner.temp }}/native-package/transfer
        run-id: 43834649652
        github-token: ${{ github.token }}
    - name: Verify retained image and exact nightly binding
      run: 'python3 -B - <<''PYCODE''

        import hashlib,json,os,sys

        from pathlib import Path

        root=Path(os.environ[''RUNNER_TEMP'']);transfer=root/''native-package/transfer''

        sys.path.insert(0,str(Path(os.environ[''GITHUB_WORKSPACE''])/''controller/journeys/hosted_macos''))

        from package import verify

        expected=''596a303e465b613a2fabfd43e6ce92639462af5bba65e5699a10d4dc44d8f8b3''

        bundle,metadata=verify(transfer,expected,root/''native-package/verified'')

        assert metadata[''nightly'']==json.loads((root/''nightly-binding.json'').read_text())

        source={''run'':43834649652,''metadata_sha256'':expected,''archive_sha256'':metadata[''archive_sha256''],''binary_sha256'':metadata[''binary_sha256''],''qualification'':''Retained
        native macOS image from the unchanged exact-nightly product; every archive member verified again; no rebuild''}

        (transfer/''retained-package-source.json'').write_text(json.dumps(source,indent=2)+''\n'')

        print(json.dumps(source))

        PYCODE

        '
    - name: Bind transferred package metadata
      id: package
      run: "python3 -B - <<'PY'\nimport hashlib, json, os\nfrom pathlib import Path\npath = Path(os.environ['RUNNER_TEMP'])\
        \ / 'native-package/transfer/package.json'\nvalue = json.loads(path.read_text())\nwith open(os.environ['GITHUB_OUTPUT'],\
        \ 'a') as out:\n    out.write('sha256=' + hashlib.sha256(path.read_bytes()).hexdigest() + '\\n')\nwith open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as out:\n    out.write('Native-only macOS sibling source: `' + value['nightly']['product_commit']\
        \ + '`\\n\\n')\n    out.write('Linux archive binding: `' + value['nightly']['linux_archive_sha256'] + '`\\\
        n\\n')\n    out.write('Native archive: `' + value['archive_sha256'] + '`\\n\\nRemote bootstrap images and\
        \ providers are unmeasured.\\n')\nPY\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-nightly-package
        path: ${{ runner.temp }}/native-package/transfer/*
        if-no-files-found: error
        retention-days: 7
  smoke:
    name: Account-free macOS smoke only
    needs: package
    runs-on: macos-15
    timeout-minutes: 20
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - *id001
    - *id002
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: StateEngine/StateEngine
        ref: ${{ steps.binding.outputs.product_commit }}
        path: product
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: native-nightly-package
        path: ${{ runner.temp }}/package-transfer
    - name: Register the disposable native installation account
      run: 'identity="$(id -u)"

        profile="$(python3 -c ''import os,pwd; print(pwd.getpwuid(os.geteuid()).pw_dir)'')"

        sudo python3 product/scripts/ci/installation_account.py provision --identity "$identity" --profile "$profile"

        python3 product/scripts/ci/installation_account.py check

        '
    - name: Account-free native Install, terminal, identity and cleanup
      env:
        PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
      run: 'python3 -B "$GITHUB_WORKSPACE/controller/journeys/hosted_macos/five_journeys.py" --mode account-free
        --surface codex --binding "$RUNNER_TEMP/nightly-binding.json" --package "$RUNNER_TEMP/package-transfer"
        --package-sha256 "$PACKAGE_SHA256" --account-registration "$GITHUB_WORKSPACE/product/scripts/ci/installation_account.py"
        --out "$RUNNER_TEMP/evidence"

        '
    - name: Export finite receipts and qualification limits
      if: ${{ always() }}
      run: "python3 -B - <<'PY'\nimport json, os, shutil\nfrom pathlib import Path\nroot = Path(os.environ['RUNNER_TEMP'])\n\
        evidence = root / 'evidence'\nevidence.mkdir(exist_ok=True)\nshutil.copyfile(root / 'observer-source.json',\
        \ evidence / 'observer-source.json')\npath = evidence / 'results.json'\nvalue = json.loads(path.read_text())\
        \ if path.exists() else {'account_free_result': 'FAIL', 'reason': 'No smoke receipt'}\nwith open(os.environ['GITHUB_STEP_SUMMARY'],\
        \ 'a') as out:\n    out.write('Account-free macOS smoke: **' + value.get('account_free_result', 'FAIL')\
        \ + '**\\n\\n')\n    out.write('Real Claude and Codex journeys: **NOT RUN**. Desktop windows and remote\
        \ bootstrap images: **NOT RUN**.\\n')\nPY\npython3 -B \"$GITHUB_WORKSPACE/controller/journeys/hosted_macos/collect.py\"\
        \ --source \"$RUNNER_TEMP/evidence\" --out \"$RUNNER_TEMP/upload\"\n"
    - name: Retain finite account-free-macos-receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: account-free-macos-receipts
        path: ${{ runner.temp }}/upload/*
        if-no-files-found: error
        retention-days: 7
  unmeasured:
    name: Publish NOT RUN provider receipts
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - *id001
    - *id002
    - name: Write provider matrices as NOT RUN without accessing credentials
      run: "for surface in codex claude; do\n  python3 -B \"$GITHUB_WORKSPACE/controller/journeys/hosted_macos/five_journeys.py\"\
        \ --mode provider-not-run --surface \"$surface\" --binding \"$RUNNER_TEMP/nightly-binding.json\" --out \"\
        $RUNNER_TEMP/reports/$surface\"\ndone\npython3 -B - <<'PY'\nimport json, os\nfrom pathlib import Path\n\
        root = Path(os.environ['RUNNER_TEMP'])\nwith open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:\n    out.write('|\
        \ Provider | Journey | Result |\\n|---|---|---|\\n')\n    for surface in ('codex', 'claude'):\n        value\
        \ = json.loads((root / 'reports' / surface / 'results.json').read_text())\n        if value['result'] !=\
        \ 'NOT RUN' or len(value['rows']) != 5 or any(row['result'] != 'NOT RUN' for row in value['rows']):\n  \
        \          raise RuntimeError('Unexecuted provider coverage must not turn green')\n        for row in value['rows']:\n\
        \            out.write('| ' + surface + ' | ' + row['name'] + ' | NOT RUN |\\n')\n    out.write('\\nReceipt\
        \ production can succeed; provider qualification remains unmeasured. Credentials and spending cap await\
        \ approval.\\n')\nPY\n"
    - name: Retain finite provider-not-run-receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: provider-not-run-receipts
        path: ${{ runner.temp }}/reports/*/results.json
        if-no-files-found: error
        retention-days: 7
  codex:
    name: "Codex real-provider journeys \u2014 NOT RUN (credential decision pending)"
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 1
    steps:
    - run: 'echo "NOT RUN: provider execution awaits approval and a real provider adapter"

        exit 78

        '
  claude:
    name: "Claude real-provider journeys \u2014 NOT RUN (credential decision pending)"
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 1
    steps:
    - run: 'echo "NOT RUN: provider execution awaits approval and a real provider adapter"

        exit 78

        '
  gate:
    name: Require successful account-free macOS smoke
    if: ${{ always() }}
    needs:
    - package
    - smoke
    - unmeasured
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Reject failed, canceled or skipped smoke and receipts
      env:
        SMOKE_RESULT: ${{ needs.smoke.result }}
        PACKAGE_RESULT: ${{ needs.package.result }}
        RECEIPTS_RESULT: ${{ needs.unmeasured.result }}
      run: "if [[ \"$SMOKE_RESULT\" != success ]]; then\n  printf 'Account-free macOS smoke did not pass: %s\n'\
        \ \"$SMOKE_RESULT\" >&2\n  exit 1\nfi\nif [[ \"$PACKAGE_RESULT\" != success || \"$RECEIPTS_RESULT\" != success\
        \ ]]; then\n  printf 'Package or NOT RUN receipts failed: package=%s receipts=%s\n' \"$PACKAGE_RESULT\"\
        \ \"$RECEIPTS_RESULT\" >&2\n  exit 1\nfi\nprintf 'Account-free macOS smoke gate: PASS. Real-provider journeys:\
        \ NOT RUN.\n' >> \"$GITHUB_STEP_SUMMARY\"\n"
