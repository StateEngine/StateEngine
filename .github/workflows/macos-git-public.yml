name: Native macOS unchanged public unavailability
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  public:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            source: b5b9e92923e57cb7bcf0ebee2eae8e593f914915
          - label: head
            source: 36b772f4c34c4867e034ca4b4d176a824489d165
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 366d6c1770abf746eb447d1bbc4ec624bf0f40d9
          path: controls
          sparse-checkout: crates/se-proc/tests/review_git_lifetime
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read pinned compiler
        id: compiler
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          channel = tomllib.loads(Path('source/rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('channel='+channel, file=out)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Build pinned public executable
        shell: python
        env:
          EXPECTED_SOURCE: ${{ matrix.source }}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          source=Path('source').resolve()
          controls=Path('controls/crates/se-proc/tests/review_git_lifetime').resolve()
          out=Path(os.environ['RUNNER_TEMP'])/'public-evidence'
          out.mkdir()
          host=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip()
          assert host.endswith('-apple-darwin'),host
          commit=subprocess.check_output(['git','rev-parse','HEAD'],cwd=source,text=True).strip()
          assert commit==os.environ['EXPECTED_SOURCE'],commit
          env=dict(os.environ,CARGO_TARGET_DIR=str(out/'target'),CARGO_INCREMENTAL='0',CARGO_BUILD_JOBS='2')
          command=['cargo','build','--release','--locked','-p','se','--target',host]
          (out/'inputs.json').write_text(json.dumps({'source':commit,'command':command,
              'compiler':subprocess.check_output(['rustc','-vV'],text=True),
              'public_control_sha256':hashlib.sha256((controls/'public.py').read_bytes()).hexdigest()},indent=2))
          with (out/'build.log').open('w') as log:
              result=subprocess.run(command,cwd=source,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=1500)
          if result.returncode: raise SystemExit(result.returncode)
          (out/'binary.txt').write_text(str(out/'target'/host/'release/se'))
      - name: Check unchanged CLI and authenticated MCP unavailability
        shell: python
        run: |
          import os, subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'public-evidence'
          control=Path('controls/crates/se-proc/tests/review_git_lifetime/public.py').resolve()
          command=['python3','-B',str(control),'--source',str(Path('source').resolve()),
              '--se',(out/'binary.txt').read_text(),'--out',str(out/'results')]
          with (out/'control.log').open('w') as log:
              result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=300)
          raise SystemExit(result.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-public-${{ matrix.label }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/public-evidence/inputs.json
            ${{ runner.temp }}/public-evidence/build.log
            ${{ runner.temp }}/public-evidence/control.log
            ${{ runner.temp }}/public-evidence/results/public-report.json
