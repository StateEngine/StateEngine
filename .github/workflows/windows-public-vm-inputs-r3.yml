name: Build Windows public observer VM inputs
'on':
  push:
    branches:
    - prime/windows-public-vm-inputs-r3
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        - arm: head
          source: 531c31e5b93ee45ef597db525d3a2b5e1a54aca3
