        \ == source\\nassert not subprocess.check_output([\\'git\\', \\'status\\', \\'--porcelain\\'])\\ncommand\
        \ = [\\'cargo\\', \\'build\\', \\'--locked\\', \\'--target\\', \\'x86_64-pc-windows-msvc\\', \\'-p\\', \\\
        'se\\', \\'--bin\\', \\'se\\']\\nrecord = {\\'source\\': source, \\'arm\\': os.environ[\\'ARM\\'], \\'argv\\\
        ': command,\\n          \\'publication\\': os.environ[\\'GITHUB_SHA\\'], \\'run\\': os.environ[\\'GITHUB_RUN_ID\\\
        '],\\n          \\'compiler\\': subprocess.check_output([\\'rustc\\', \\'-vV\\'], text=True),\\n       \
        \   \\'environment\\': {k: os.environ.get(k) for k in\\n                          [\\'CARGO_INCREMENTAL\\\
