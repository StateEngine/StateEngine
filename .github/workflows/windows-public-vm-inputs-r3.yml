      with:
        ref: ${{ matrix.source }}
        path: product
        persist-credentials: false
    - uses: ./product/.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: product
        shared-key: windows-launch-387-v1
