name: PR526 Windows spawner drain judge
on:
  push:
    branches: [judge/spawner-bound-drain-526-run]
permissions:
  contents: read
jobs:
  judge:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build the candidate CLI
        run: cargo build --release --locked -p se --bin se
      - name: Register the disposable runner account
        run: python scripts/ci/installation_account.py provision
      - name: Judge the spawner drain
        run: python crates/se/tests/judges/spawner_bound_home_review.py --se target/release/se.exe --output "$RUNNER_TEMP/spawner-526"
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spawner-526-receipt
          path: ${{ runner.temp }}/spawner-526/receipt.json
          if-no-files-found: warn
