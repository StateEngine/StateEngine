name: Paired macOS live output observation
on:
  push:
    branches: [prime/live-output-macos-paired-r1]
permissions:
  contents: read
  actions: read
concurrency:
  group: live-output-macos-paired-r1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      OUTPUT_BASE: b7a3c1c5d9d4f016b237a97c5c0d883645276eda
      OUTPUT_HEAD: 8b9fbc9926e0c5ca89ac9078f5fcbc8f1b62b1e3
      MEASURE_TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 844fac50c7aae28f8a40afb7ef2be3cb2fc2d331
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Initialize isolated paths and verify product source
        id: compiler
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          source = os.environ['OUTPUT_HEAD']
          for arm in ('BASE', 'HEAD'):
              pin = os.environ['OUTPUT_' + arm]
              actual = subprocess.check_output(['git', 'rev-parse', pin + '^{commit}'], text=True).strip()
              if actual != pin:
                  raise ValueError('Product source pin differs')
          parent = subprocess.check_output(['git', 'rev-parse', source + '^'], text=True).strip()
          if parent != os.environ['OUTPUT_BASE']:
              raise ValueError('Comparison must isolate the live-output merge')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MEASURE_ROOT={root / "live-output"}\n')
              output.write(f'EVIDENCE_ROOT={root / "live-output-evidence"}\n')
          text = subprocess.check_output(['git', 'show', source + ':rust-toolchain.toml'], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={tomllib.loads(text)["toolchain"]["channel"]}\n')
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rust-docs, llvm-tools-preview
      - name: Check observer syntax
        shell: python
        run: |
          import ast, pathlib
          for path in pathlib.Path('scripts/live_output_observe').glob('*.py'):
              ast.parse(path.read_text())
      - name: Build both shipping packages and observe sequential paired cohorts
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/live_output_observe/paired.py', os.environ['MEASURE_ROOT']], check=True)
      - name: Collect raw output and archives without private homes
        if: ${{ always() }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/live_output_observe/collect.py', os.environ['MEASURE_ROOT'], os.environ['EVIDENCE_ROOT']], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: live-output-macos-paired-r1-${{ matrix.target }}
          path: ${{ runner.temp }}/live-output-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
