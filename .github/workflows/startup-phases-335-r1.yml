name: Native macOS complete startup phase observation
on:
  push:
    branches: [prime/startup-phases-335-r1]
permissions:
  contents: read
concurrency:
  group: startup-phases-335-r1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 452d3207793a05e73433f04752b8cd2c79f9b2e7
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 65a3b059a7b8ba752b386e63d16f045564e1c1ad
          path: observer
          persist-credentials: false
      - uses: ./source/.github/actions/rust
      - name: Decode and verify bounded observation material
        shell: python
        run: |
          import ast,base64,hashlib,json,os
          from pathlib import Path
          files=json.loads('{"run_native.py": {"sha256": "68e359e5c39bf0cfaf259bfafa74d4325c7d8de9e127c0457fa29fbc6655f880", "base64": ""}, "observe_phases.py": {"sha256": "c0af1ace25c84435fc4c301b8974ee3d667d0c8e67fc58e22aa7e53823dc9819", "base64": ""}, "partition.py": {"sha256": "511fc58854a1c36dbcb1022f11040b219f9affc8c8a582c98ba88f92bb4c6f2d", "base64": ""}, "source-observation.patch": {"sha256": "d277057fe73f5940296c2103386d801de9ee0da22e8757f8a0a52551d1985ea5", "base64": ""}, "overlay.json": {"sha256": "d8bc4f08a36e84fc908c237c0406216a880381f3ed9bd785f5c62156830d6674", "base64": ""}}')
          root=Path(os.environ['RUNNER_TEMP'])/'startup-phase-material'
          root.mkdir(exist_ok=False)
          for name,item in files.items():
           data=base64.b64decode(item['base64'],validate=True)
           assert hashlib.sha256(data).hexdigest()==item['sha256']
           if name.endswith('.py'):ast.parse(data)
           (root/name).write_bytes(data)
      - name: Gate native fixtures, assemble both images and record complete startup
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'startup-phase-material'/'run_native.py'
          subprocess.run([sys.executable,'-B',str(path)],check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: startup-phases-335-r1-macos
          path: ${{ runner.temp }}/startup-phase-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
