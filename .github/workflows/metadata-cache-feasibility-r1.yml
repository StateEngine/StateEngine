name: Metadata cache feasibility r1
on:
  workflow_dispatch:
  push:
    branches: [prime/metadata-cache-feasibility-r1]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Observe native journal and metadata invalidation with a live writer
        shell: python
        run: |
          import base64,hashlib,os,subprocess,sys
          from pathlib import Path
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='70ebe655dc41999d814665fd233112ac0c5c2a881d95e01847f3b82862bd7fc8'
          script=Path(os.environ['RUNNER_TEMP'])/'metadata-cache-probe.py'
          script.write_bytes(data)
          raise SystemExit(subprocess.run([sys.executable,str(script)]).returncode)
      - name: Retain every native observation and unsupported error
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metadata-cache-feasibility-r1
          path: ${{ runner.temp }}/metadata-cache-feasibility/report.json
          retention-days: 3
          if-no-files-found: error
