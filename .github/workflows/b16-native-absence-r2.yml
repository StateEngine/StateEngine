name: Measure plain-folder native repository absence
'on':
  push:
    branches:
    - prime/b16-native-absence-r2
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BASE_SOURCE: 02b0d3e611818fb055d13da5bd53aa2a15eeb259
      HEAD_SOURCE: b3d9c951ef717af6cb82bdb861fa78bb1e6fe5f8
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: b3d9c951ef717af6cb82bdb861fa78bb1e6fe5f8
        path: head
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 02b0d3e611818fb055d13da5bd53aa2a15eeb259
        path: base
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Stage frozen observers
      shell: python
      run: "from pathlib import Path\nimport base64,hashlib,json,os\nr=Path(os.environ['RUNNER_TEMP'])/'b16step/controls';r.mkdir(parents=True)\n\
        files={'build.py': '',\
        \ 'drive.py': '',\
        \ 'analyze.py': '',\
        \ 'pe_imports.py': '',\
        \ 'windows-observer/Program.cs': '',\
        \ 'windows-observer/ProfileRecorder.cs': '',\
        \ 'windows-observer/NativeCalibration.cs': '',\
        \ 'windows-observer/SyncTrace.csproj': '',\
        \ 'windows-observer/packages.lock.json': ''}\n\
        for name,data in files.items():\n p=r/name;p.parent.mkdir(parents=True,exist_ok=True);raw=base64.b64decode(data);p.write_bytes(raw)\n\
        \ if name.endswith('.py'):compile(raw.decode(),name,'exec')\n(r.parent/'frozen-inputs.json').write_text(json.dumps({name:hashlib.sha256(base64.b64decode(data)).hexdigest()\
        \ for name,data in files.items()},indent=2)+'\\n')\n"
    - name: Compile and calibrate native file, flush and CPU records
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        c=Path(os.environ[''RUNNER_TEMP''])/''b16step/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(c/''drive.py''),*(''preflight'',)]).returncode)

        '
    - name: Build both pinned distribution images
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        p=Path(os.environ[''RUNNER_TEMP''])/''b16step/controls/build.py''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(p)]).returncode)

        '
    - name: Profile both images with balanced order and bracketing plain runs
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        c=Path(os.environ[''RUNNER_TEMP''])/''b16step/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(c/''drive.py''),*(''measure'',)]).returncode)

        '
    - name: Hash finite evidence
      if: always()
      shell: python
      run: "from pathlib import Path\nimport hashlib,json,os,shutil\nr=Path(os.environ['RUNNER_TEMP'])/'b16step';out=r/'evidence';out.mkdir(parents=True,exist_ok=True)\n\
        for folder in ['calibration','results']:\n p=out/folder/'native.etl'\n if p.is_file():p.unlink()\nassert not list(out.rglob('*.etl'))\n\
        inputs=json.loads((r/'frozen-inputs.json').read_text())\nfor name,digest in inputs.items():\n p=r/'controls'/name;raw=p.read_bytes();assert\
        \ hashlib.sha256(raw).hexdigest()==digest\n q=out/'observer-source'/name;q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(raw)\n\
        shutil.copyfile(r/'frozen-inputs.json',out/'frozen-inputs.json')\nrows=[{'file':p.relative_to(out).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()}\
        \ for p in sorted(out.rglob('*')) if p.is_file()]\n(out/'artifact-manifest.json').write_text(json.dumps(rows,indent=2)+'\\\
        n')\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: b16-native-absence-r2
        path: ${{ runner.temp }}/b16step/evidence
        retention-days: 2
        compression-level: 0
        include-hidden-files: true
        if-no-files-found: error
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: b3d9c951ef717af6cb82bdb861fa78bb1e6fe5f8
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
        components: clippy
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: hosted-debug-v1
    - name: Strict candidate Clippy
      shell: python
      run: 'import subprocess

        target=subprocess.check_output([''rustc'',''--print'',''host-tuple''],text=True).strip()

        raise SystemExit(subprocess.run([''cargo'',''clippy'',''--workspace'',''--all-targets'',''--all-features'',''--target'',target,''--locked'',''--'',''-D'',''warnings'']).returncode)

        '
