name: Native Windows guarded journal proof comparison
permissions:
  contents: read
concurrency:
  group: windows-usn-proof-paired-r9-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        journal:
        - default
        - unavailable
        - active
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      MEASURE_TARGET: x86_64-pc-windows-msvc
      STARTUP_PUBLIC_READY: '1'
      STARTUP_MEASURE_PEER: '1'
      STARTUP_BASE: 737bee8caf03e17d2a61e21594d7b0285d6619dc
      STARTUP_HEAD: 3aa7cb5d48048aee59d0580c01e80536f9d7b31c
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      USN_COST_JOURNAL: ${{ matrix.journal }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 568667b344a7c567328cb2c51badad98b5a47758
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Initialize isolated paths and verify source pins
      id: compiler
      shell: python
      run: "import os, pathlib, subprocess, tomllib\nroot = pathlib.Path(os.environ['RUNNER_TEMP'])\nfor key in\
        \ ('STARTUP_BASE', 'STARTUP_HEAD'):\n    source = os.environ[key]\n    actual = subprocess.check_output(['git',\
        \ 'rev-parse', source + '^{commit}'], text=True).strip()\n    if actual != source:\n        raise ValueError('Product\
        \ source pin differs')\nsubprocess.run(['git', 'merge-base', '--is-ancestor', os.environ['STARTUP_BASE'],\
        \ os.environ['STARTUP_HEAD']], check=True)\nwith open(os.environ['GITHUB_ENV'], 'a') as output:\n    output.write(f'MEASURE_ROOT={root\
        \ / \"startup-paired\"}\\n')\n    output.write(f'EVIDENCE_ROOT={root / \"startup-paired-evidence\"}\\n')\n\
        text = subprocess.check_output(['git', 'show', os.environ['STARTUP_HEAD'] + ':rust-toolchain.toml'], text=True)\n\
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write(f'channel={tomllib.loads(text)[\"\
        toolchain\"][\"channel\"]}\\n')\n"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
        components: rust-docs, llvm-tools-preview
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: amd64
    - name: Check observer syntax
      shell: python
      run: "import ast, pathlib\nfor path in pathlib.Path('scripts/startup_package').glob('*.py'):\n    ast.parse(path.read_text())\n"
    - name: Check native census syntax
      shell: powershell
      run: '$tokens = $null

        $errors = $null

        [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ''scripts/startup_package/processes.ps1''),
        [ref]$tokens, [ref]$errors) > $null

        if ($errors.Count -gt 0) { throw ($errors | Out-String) }

        '
    - name: Compare public calls and shipping-image qualification on a verified journal venue
      shell: python
      run: 'import base64,hashlib,os,pathlib,subprocess,sys

        payload=base64.b64decode('''')

        if hashlib.sha256(payload).hexdigest()!=''e9c672edf25074703f2cabd06b122439d33edc945420f580306fa539a6db07ee'':raise
        ValueError(''Cost driver differs'')

        script=pathlib.Path(os.environ[''RUNNER_TEMP''])/''usn-cost-venues-r9.py''

        script.write_bytes(payload)

        subprocess.run([sys.executable,''-B'',script],check=True)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: windows-usn-proof-paired-r9-${{ matrix.journal }}
        path: '${{ runner.temp }}/startup-paired-evidence

          ${{ runner.temp }}/usn-cost-venues-r9/*.json

          ${{ runner.temp }}/usn-cost-venues-r9/*.stdout

          ${{ runner.temp }}/usn-cost-venues-r9/*.stderr

          '
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
'on':
  push:
    branches:
    - prime/windows-usn-proof-paired-r9
