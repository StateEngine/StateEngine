name: Native Windows uninstall carrier consumer and timing
'on':
  push:
    branches:
    - prime/j5-native-carrier-r2
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  RUST_BACKTRACE: '1'
jobs:
  windows:
    name: Native carrier consumer (${{ matrix.features }})
    runs-on: windows-2025
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        features:
        - default
        - all
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 82f509543b8897f963f78acd32e1549290333535
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: c29-windows-${{ matrix.features }}-v1
    - name: Register disposable runner account
      shell: bash
      run: 'python scripts/ci/installation_account.py provision

        python scripts/ci/installation_account.py check

        '
    - name: Extract frozen real-console consumer and timing observers
      shell: python
      run: "import base64,hashlib,json,os\nfrom pathlib import Path\nr=Path(os.environ['RUNNER_TEMP'])/'timing-inputs';r.mkdir()\n\
        inputs={'owned_file.py': '',\
        \ 'token_context.py': '',\
        \ 'runtime-console-timing.ps1': '',\
        \ 'timing.py': ''}\n\
        expected={'owned_file.py': 'e65db33c40d8be8d035ad092e8a48128db36aae208e339af0b536267384aa594',\
        \ 'token_context.py': 'ed4e4714a72a15a337992d771bf4c0a55e83df54a7fbbb69bde33482d9422660',\
        \ 'runtime-console-timing.ps1': '105a2b9a5242f6318003c85d0413247f1aa435a9dc0ac71165ecee4e022cd561',\
        \ 'timing.py': '42ee86a340c879512e9cf4ef6e21b35deadd7c67400f38c4200e6181206f9e9d'}\n\
        for name,encoded in inputs.items():\n raw=base64.b64decode(encoded);assert\
        \ hashlib.sha256(raw).hexdigest()==expected[name];(r/name).write_bytes(raw)\n\
        (r/'inputs.json').write_text(json.dumps(expected,indent=2)+'\\n')\n"
    - name: Witness native image removal and measure real console uninstall
      shell: python
      env:
        TIMING_FEATURES: ${{ matrix.features }}
        TIMING_OUT: ${{ runner.temp }}/uninstall-timing-evidence-${{ matrix.features
          }}
        TIMING_EXPECTED_PRODUCT_TYPE: '3'
      run: 'import os,runpy,sys

        from pathlib import Path

        r=Path(os.environ[''RUNNER_TEMP''])/''timing-inputs'';sys.path.insert(0,str(r))

        runpy.run_path(str(r/''timing.py''),run_name=''__main__'')

        '
    - name: Retain native consumer results and pinned VM image
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: j5-native-carrier-${{ matrix.features }}
        path: ${{ runner.temp }}/uninstall-timing-evidence-${{ matrix.features }}
        retention-days: 14
        if-no-files-found: error
