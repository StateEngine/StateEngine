    - name: Parse fixture in native PowerShell 5.1 and 7
      shell: python
      run: "import base64,os,subprocess\nfrom pathlib import Path\nroot=Path(os.environ['REVIEW_ROOT'])\nscript=\"\
        $tokens=$null;$errors=$null;[Management.Automation.Language.Parser]::ParseFile('\"+str(root/'controls/environment.ps1').replace(\"\
        '\",\"''\")+\"',[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|Format-List;exit 1};$PSVersionTable.PSVersion.ToString()\"\
        \nenv={k:v for k,v in os.environ.items() if k.casefold()!='psmodulepath'}\nfor name,shell in [('ps51',str(Path(os.environ['SystemRoot'])/'System32/WindowsPowerShell/v1.0/powershell.exe')),('ps7','pwsh.exe')]:\n\
        \    command=[shell,'-NoLogo','-NoProfile','-NonInteractive','-EncodedCommand',base64.b64encode(script.encode('utf-16le')).decode()]\n\
        \    with (root/(name+'-parse.stdout')).open('wb') as out,(root/(name+'-parse.stderr')).open('wb') as err:\n\
        \        subprocess.run(command,env=env,stdout=out,stderr=err,check=True,timeout=30)"
    - name: Preflight both real SSH default shells
      shell: python
      run: 'import os,subprocess,sys

        from pathlib import Path

        root=Path(os.environ[''REVIEW_ROOT''])

        subprocess.run([sys.executable,''-B'',str(root/''controls/preflight.py''),str(root)],check=True,timeout=600)'
    - name: Verify immutable full-size shipping payload
      shell: python
      run: 'import os,subprocess,sys

        from pathlib import Path

        root=Path(os.environ[''REVIEW_ROOT''])

        subprocess.run([sys.executable,''-B'',str(root/''controls/payload.py''),str(root)],check=True,timeout=240)'
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Build main and fix upload consumers sequentially
      shell: python
      run: 'import os,subprocess,sys

        from pathlib import Path

        root=Path(os.environ[''REVIEW_ROOT''])

        subprocess.run([sys.executable,''-B'',str(root/''controls/build.py''),str(root)],check=True,timeout=3600)'
    - name: Compare full-size real SSH uploads and outside hashes
      shell: python
      run: 'import os,subprocess,sys

        from pathlib import Path

        root=Path(os.environ[''REVIEW_ROOT''])

        subprocess.run([sys.executable,''-B'',str(root/''controls/run.py''),str(root)],check=True,timeout=1800)'
    - name: Recover only initialized disposable fixture
      if: ${{ always() }}
      shell: python
      run: "import os,subprocess,sys\nfrom pathlib import Path\nroot=Path(os.environ['REVIEW_ROOT'])\nsys.path.insert(0,str(root/'controls'))\n\
        from run import Review\nimport json\nfor directory in [root,root/'preflight']:\n    state=directory/'private/environment.json'\n\
        \    if state.exists() and not json.loads(state.read_text())['cleanup_complete']:\n        Review(directory).environment('recovery','cleanup')"
    - name: Collect finite public evidence
      if: ${{ always() }}
      shell: python
      run: "import hashlib,os,shutil\nfrom pathlib import Path\nimport json\nroot=Path(os.environ['REVIEW_ROOT']);out=root/'archive';out.mkdir()\n\
        for name in ['controls.json','source.json','ps51-parse.stdout','ps51-parse.stderr','ps7-parse.stdout','ps7-parse.stderr']:\n\
        \    path=root/name\n    if path.exists():shutil.copyfile(path,out/name)\nshutil.copytree(root/'controls',out/'controls',ignore=shutil.ignore_patterns('__pycache__'))\n\
