        n    root.mkdir(parents=True, exist_ok=True)\\n    reports = root / \\'reports\\'\\n    reports.mkdir(exist_ok=True)\\\
        n    source = Path(os.environ[\\'UPLOAD_SOURCE\\']).resolve()\\n    overlay = Path(__file__).with_name(\\\
