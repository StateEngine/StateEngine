        n')"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: windows-upload-comparison-r8
        path: ${{ runner.temp }}/windows-upload-comparison/archive
        if-no-files-found: error
        retention-days: 14
