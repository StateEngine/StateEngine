name: Build fixed uninstall interop assembly
'on':
  push:
    branches:
    - prime/j5-precompiled-interop-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  interop:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Extract source and deterministic generator
      shell: python
      run: "import base64,hashlib,json,os\nfrom pathlib import Path\nr=Path(os.environ['RUNNER_TEMP'])/'interop-build';r.mkdir()\n\
        inputs={'carrier-interop.cs': '',\
        \ 'compile-interop.ps1': ''}\n\
        expected={'carrier-interop.cs': 'eb79927d40c620fcc99132683c50ea6a72b79ef49fb6ff4778cb2b27850e7d74',\
        \ 'compile-interop.ps1': '8da0ebd12ac0b588c88468e754d2df85256aaff11db63c87a4bb3b147393528b'}\n\
        for name,encoded in inputs.items():\n raw=base64.b64decode(encoded);assert\
        \ hashlib.sha256(raw).hexdigest()==expected[name];(r/name).write_bytes(raw)\n\
        (r/'inputs.json').write_text(json.dumps(expected,indent=2)+'\\n')\n"
    - name: Compile and load fixed interop assembly
      shell: powershell
      run: '$ErrorActionPreference=''Stop''

        Set-StrictMode -Version Latest

        $root=Join-Path $env:RUNNER_TEMP ''interop-build''

        $sdks=@(& dotnet --list-sdks)

        if($LASTEXITCODE -ne 0){throw ''SDK enumeration failed''}

        $last=$sdks[-1]

        if($last -notmatch ''^([^ ]+) \[(.+)\]$''){throw ''SDK location absent''}

        $compiler=Join-Path (Join-Path $Matches[2] $Matches[1]) ''Roslyn/bincore/csc.dll''

        & (Join-Path $root ''compile-interop.ps1'') -Compiler $compiler

        $first=(Get-FileHash (Join-Path $root ''carrier-interop.b64'') -Algorithm
        SHA256).Hash

        & (Join-Path $root ''compile-interop.ps1'') -Compiler $compiler

        if($LASTEXITCODE -ne 0){throw ''Assembly generation failed''}

        if((Get-FileHash (Join-Path $root ''carrier-interop.b64'') -Algorithm SHA256).Hash
        -cne $first){throw ''Deterministic assembly reproduction differs''}

        $encoded=[IO.File]::ReadAllText((Join-Path $root ''carrier-interop.b64''))

        $bytes=[Convert]::FromBase64String($encoded)

        if($bytes[0] -ne 77 -or $bytes[1] -ne 90){throw ''Assembly header invalid''}

        $assembly=[Reflection.Assembly]::Load($bytes)

        $type=$assembly.GetType(''SeUninstallObjects'',$true)

        foreach($name in @(''Identity'',''Digest'',''Unlink'',''Flush'',''Absent'',''SameName'',''WaitForSingleObject'',''GetTickCount64'')){if($null
        -eq $type.GetMethod($name)){throw "Missing public native method: $name"}}

        if([SeUninstallObjects]::GetTickCount64() -le 0){throw ''Native interop call
        failed''}

        $receipt=@{schema=''se.uninstall-interop-build/v1'';source=(Get-FileHash (Join-Path
        $root ''carrier-interop.cs'') -Algorithm SHA256).Hash.ToLowerInvariant();generator=(Get-FileHash
        (Join-Path $root ''compile-interop.ps1'') -Algorithm SHA256).Hash.ToLowerInvariant();assembly_b64=(Get-FileHash
        (Join-Path $root ''carrier-interop.b64'') -Algorithm SHA256).Hash.ToLowerInvariant();compiler=(Get-FileHash
        $compiler -Algorithm SHA256).Hash.ToLowerInvariant();sdk=$last;framework=[Runtime.InteropServices.RuntimeEnvironment]::GetSystemVersion();assembly_bytes=$bytes.Length;native_interop_loaded=$true}

        $receipt|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $root
        ''receipt.json'') -Encoding utf8

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: uninstall-interop-assembly
        path: ${{ runner.temp }}/interop-build/
        if-no-files-found: error
        retention-days: 7
