name: Git2 status native development checks r2
'on':
  push:
    branches:
    - prime/status-git2-389-checks-r2
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2025
        - ubuntu-24.04
        - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SOURCE_SHA: 19117f4fde2204c39b4a352291a856aca25654a6
      SOURCE_ARM: head
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 19117f4fde2204c39b4a352291a856aca25654a6
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: git2-status-389-v1-${{ matrix.os }}
        cache-workspace-crates: false
    - name: Record native checks, existing tests and CLI linking
      shell: python
      run: 'import ast,base64,hashlib,os,subprocess,sys

        from pathlib import Path

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''7c6537bcd4651b6c9b67f16444ce9690f00d1705b70557aa46bb7b5a10e2ee12''

        ast.parse(data)

        p=Path(os.environ[''RUNNER_TEMP''])/''git2-check-recorder-r2.py''

        p.write_bytes(data)

        raise SystemExit(subprocess.call([sys.executable,''-B'',str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: git2-check-r2-${{ matrix.os }}
        path: ${{ runner.temp }}/git2-check-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  release-base-control:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      SOURCE_SHA: 247e1b5d42b23a302e98d4641abf3df042413120
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 247e1b5d42b23a302e98d4641abf3df042413120
        persist-credentials: false
    - uses: ./.github/actions/rust
    - name: Record the unchanged Windows release-fixture outcome
      shell: python
      run: 'import ast,base64,hashlib,os,subprocess,sys

        from pathlib import Path

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''4b1da964ec0110635a669079033f22f04cfe87b48a4ae9da12ed501ed6c7eece''

        ast.parse(data)

        p=Path(os.environ[''RUNNER_TEMP''])/''release-base-control.py''

        p.write_bytes(data)

        raise SystemExit(subprocess.call([sys.executable,''-B'',str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: release-base-control-windows-r2
        path: ${{ runner.temp }}/release-base-control/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
