name: Independent native writable mapping boundary
'on':
  push:
    branches:
    - prime/windows-image-mapping-review-r1
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Observe a private active-journal writable mapping
      shell: python
      run: 'import base64, hashlib, os, pathlib, subprocess, sys

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])

        data=base64.b64decode('''')

        if hashlib.sha256(data).hexdigest() != ''e126e9200fdba5bd48eb79d88fba3b7d1898f34f6c4f39598bf13846f3b217f8'': raise
        ValueError(''Payload differs'')

        (root / ''mapping-probe.py'').write_bytes(data)

        data=base64.b64decode('''')

        if hashlib.sha256(data).hexdigest() != ''23b46fd8b3d975aef4d090e6df5a3e4d0ec48ce38b97f3cd3d0dab6cf2a7855b'': raise
        ValueError(''Payload differs'')

        (root / ''mapping-volume.py'').write_bytes(data)

        os.environ[''USN_PROBE_SCRIPT'']=str(root/''mapping-probe.py'')

        subprocess.run([sys.executable,''-B'',root/''mapping-volume.py''],check=True)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: independent-mapping-review-r1
        path: '${{ runner.temp }}/independent-mapping-volume-r1/*.json

          ${{ runner.temp }}/independent-mapping-volume-r1/*.stdout

          ${{ runner.temp }}/independent-mapping-volume-r1/*.stderr'
        if-no-files-found: error
        retention-days: 14
