name: Tagged release
run-name: ${{ inputs.nightly || github.ref_name }}
on:
  push:
    tags: ['v*']
  # A manual run builds and assembles the same archives without publishing anything,
  # so reviewers can install a complete same-source distribution.
  workflow_dispatch:
    inputs:
      version:
        description: Workspace package version that labels the unpublished build (must match Cargo.toml)
        type: string
        required: true
      nightly:
        description: Optional nightly run identity
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc}
          - {runner: macos-15, target: aarch64-apple-darwin}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Label an unpublished build with a local tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        # The version may already name a published tag; point a local copy at this commit.
        # It is never pushed.
        run: git tag --force "$RELEASE_TAG" HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - name: Validate the version tag and read the pinned compiler
        id: compiler
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          subprocess.run(['python', '-B', 'scripts/release/release_assets.py', '--tag', os.environ['RELEASE_TAG'], '--check-tag'], check=True)
          channel = tomllib.loads(pathlib.Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={channel}\n')
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rust-docs, llvm-tools-preview
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with: {arch: amd64}
      - name: Build on the native target
        shell: python
        env:
          BUILD_ROOT: ${{ runner.temp }}/native-build
        run: |
          import os, subprocess
          subprocess.run(['python', '-B', 'scripts/release/build.py', '--target', os.environ['RELEASE_TARGET'], '--out', os.environ['BUILD_ROOT']], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native-build/
          if-no-files-found: error
          compression-level: 0
  assemble:
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Label an unpublished build with a local tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        # The version may already name a published tag; point a local copy at this commit.
        # It is never pushed.
        run: git tag --force "$RELEASE_TAG" HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - name: Verify pinned release license bytes and contributor agreement checks
        shell: bash
        run: |
          set -eu
          python -B -m unittest scripts/release/test_licenses.py -v
          python -B -m unittest discover -s scripts/cla -p 'test_*.py' -v
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: 'native-*', path: '${{ runner.temp }}/builds'}
      - name: Assemble complete same-source archives and pinned installers
        shell: python
        run: |
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          builds = root / 'builds'
          for directory in builds.glob('native-*'):
              directory.rename(builds / directory.name.removeprefix('native-'))
          subprocess.run(['python', '-B', 'scripts/release/release_assets.py', '--builds', str(builds), '--out', str(root / 'release'), '--tag', os.environ['RELEASE_TAG']], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
  preview:
    needs: assemble
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: release-assets, path: release}
      - name: Require the source commit's successful required check
        shell: bash
        run: |
          set -eu
          gh api "repos/$GH_REPO/commits/$RELEASE_SHA/check-runs?per_page=100" > checks.json
          python3 - <<'PY'
          import json
          checks = [x for x in json.load(open('checks.json'))['check_runs'] if x['name'] == 'check']
          checks.sort(key=lambda x: x['id'], reverse=True)
          assert checks and checks[0]['conclusion'] == 'success', 'the tag source requires a successful check'
          PY
      - name: Stage all assets before exposing the prerelease
        shell: bash
        run: |
          set -eu
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" --draft --prerelease --latest=false --title "$RELEASE_TAG" --notes 'Unsigned native archives with published SHA-256 checksums; stable promotion awaits native installation readback.'
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
  smoke:
    needs: preview
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Install the public Unix release in an isolated home
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          export HOME="$RUNNER_TEMP/install-home"
          export SE_HOME="$RUNNER_TEMP/install-state"
          mkdir -p "$HOME"
          curl --proto '=https' --proto-redir '=https' -fsSL "https://github.com/StateEngine/StateEngine/releases/download/$RELEASE_TAG/install.sh" -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh"
          "$HOME/.local/bin/se" --version
      - name: Install the public Windows release in isolated user directories
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'install-home'
          $env:SE_HOME = Join-Path $env:RUNNER_TEMP 'install-state'
          $installerScript = Invoke-RestMethod "https://github.com/StateEngine/StateEngine/releases/download/$env:RELEASE_TAG/install.ps1"
          Invoke-Expression $installerScript
          & (Join-Path $env:LOCALAPPDATA 'StateEngine/bin/se.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'installed version readback failed' }
  promote:
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Promote qualified stable tags only
        shell: bash
        run: |
          set -eu
          case "$RELEASE_TAG" in
            *-*) gh release view "$RELEASE_TAG" ;;
            *) gh release edit "$RELEASE_TAG" --prerelease=false --latest ;;
          esac
  publish-npm:
    needs: [promote]
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: release-assets, path: '${{ runner.temp }}/release'}
      - name: Build verified npm packages from release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/release/npm_release.py \
            --release-dir "$RUNNER_TEMP/release" \
            --out "$RUNNER_TEMP/npm-packages"
      - name: Publish npm packages in dependency order
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NPMRC=""
          cleanup() {
            if [ -n "$NPMRC" ]; then rm -f "$NPMRC"; fi
          }
          trap cleanup EXIT
          if [ -n "${NPM_TOKEN:-}" ]; then
            NPMRC="$RUNNER_TEMP/.npmrc"
            umask 077
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPMRC"
            export NPM_CONFIG_USERCONFIG="$NPMRC"
          fi
          ORDER_JSON="$RUNNER_TEMP/npm-packages/publish-order.json"
          VERSION="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' "$ORDER_JSON")"
          while IFS=$'\t' read -r PKG_NAME PKG_DIR; do
            FULL_DIR="$RUNNER_TEMP/npm-packages/$PKG_DIR"
            EXISTING="$(npm view "${PKG_NAME}@${VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$EXISTING" = "$VERSION" ]; then
              echo "Skipping ${PKG_NAME}@${VERSION}: already published on npm."
              continue
            fi
            echo "Publishing ${PKG_NAME}@${VERSION} from ${PKG_DIR}..."
            (cd "$FULL_DIR" && npm publish --access public --provenance --registry=https://registry.npmjs.org)
          done < <(python3 - "$ORDER_JSON" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          for entry in doc["packages"]:
              print(f"{entry['name']}\t{entry['directory']}")
          PY
          )
          echo "Published npm packages for version \`${VERSION}\`." >> "$GITHUB_STEP_SUMMARY"
  publish-homebrew:
    needs: [promote]
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: release-assets, path: '${{ runner.temp }}/release'}
      - name: Generate verified Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/release/brew_release.py \
            --release-dir "$RUNNER_TEMP/release" \
            --out "$RUNNER_TEMP/stateengine.rb" \
            --repository "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-formula
          path: '${{ runner.temp }}/stateengine.rb'
          retention-days: 14
          if-no-files-found: error
      - name: Push formula to StateEngine/homebrew-tap when configured
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "Homebrew formula uploaded as artifact homebrew-formula; tap push skipped because HOMEBREW_TAP_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 -w0)"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" clone --depth 1 \
            https://github.com/StateEngine/homebrew-tap.git "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cp "$RUNNER_TEMP/stateengine.rb" "$TAP_DIR/Formula/stateengine.rb"
          cd "$TAP_DIR"
          if git diff --quiet -- Formula/stateengine.rb && [ -z "$(git ls-files --others --exclude-standard Formula/stateengine.rb)" ]; then
            echo "Homebrew tap formula already up to date for \`${RELEASE_TAG}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/stateengine.rb
          git commit -m "chore(formula): update stateengine to ${RELEASE_TAG}"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin HEAD
          echo "Published Homebrew formula to StateEngine/homebrew-tap for \`${RELEASE_TAG}\`." >> "$GITHUB_STEP_SUMMARY"
