name: Native runtime crash recovery
'on':
  push:
    branches:
    - prime/runtime-crash-282-r2
permissions:
  contents: read
jobs:
  consume:
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PRODUCT_SOURCE: bf729137c8ddb3aeee8cd5afe32ad908ccd27c15
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.PRODUCT_SOURCE }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Extract bounded consumer inputs
      shell: python
      run: "import base64,json,hashlib,os\nfrom pathlib import Path\nr=Path(os.environ[\"RUNNER_TEMP\"])/\"crash-inputs\"\n\
        r.mkdir()\ninputs={'driver.py': '',\
        \ 'windows_process.py': '',\
        \ 'provider.py': ''}\n\
        for name,data in inputs.items():\n p=r/name;p.write_bytes(base64.b64decode(data))\n(r/\"inputs.json\").write_text(json.dumps({name:hashlib.sha256((r/name).read_bytes()).hexdigest()\
        \ for name in inputs},indent=2)+\"\\n\")\n"
    - name: Install native process reader
      shell: python
      run: 'import subprocess,sys

        subprocess.run([sys.executable,''-m'',''pip'',''install'',''psutil==7.1.0''],check=True)

        '
    - name: Build exact source
      shell: python
      run: "import os,subprocess,json,hashlib,time\nfrom pathlib import Path\nr=Path(os.environ['RUNNER_TEMP'])/'crash-inputs'\n\
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\nassert source==os.environ['PRODUCT_SOURCE']\n\
        compiler=subprocess.check_output(['rustc','-Vv'],text=True)\nhost=next(line.removeprefix('host: ') for line in compiler.splitlines()\
        \ if line.startswith('host: '))\nstart=time.monotonic()\nargv=['cargo','build','--target',host,'-p','se','--features','remote','--locked']\n\
        with (r/'build.log').open('w') as log:\n p=subprocess.run(argv,stdout=log,stderr=subprocess.STDOUT,timeout=2100)\n\
        exe=(Path('target')/host/'debug'/('se.exe' if os.name=='nt' else 'se')).resolve()\na=dict(source=source,exit=p.returncode,seconds=time.monotonic()-start,features=['remote'],profile='dev',target=host,compiler=compiler,argv=argv,binary=str(exe))\n\
        if p.returncode==0:a['binary_sha256']=hashlib.sha256(exe.read_bytes()).hexdigest()\n(r/'build.json').write_text(json.dumps(a,indent=2)+'\\\
        n')\nraise SystemExit(p.returncode)\n"
    - name: Crash exact runtime and recover through public commands
      shell: python
      run: "import os,subprocess,sys,json\nfrom pathlib import Path\nr=Path(os.environ['RUNNER_TEMP'])/'crash-inputs'\nout=Path(os.environ['RUNNER_TEMP'])/'crash-consumer'\n\
        build=json.loads((r/'build.json').read_text());assert build['exit']==0\nexe=Path(build['binary'])\nwith (r/'consumer.stdout').open('w')\
        \ as log,(r/'consumer.stderr').open('w') as err:\n p=subprocess.run([sys.executable,'-B',str(r/'driver.py'),'--se',str(exe),'--source',os.environ['PRODUCT_SOURCE'],'--output',str(out)],stdout=log,stderr=err,timeout=600)\n\
        (r/'consumer-exit.json').write_text(json.dumps(dict(exit=p.returncode))+'\\n')\nraise SystemExit(p.returncode)\n"
    - name: Hash all retained evidence
      if: always()
      shell: python
      run: "import os,hashlib,json,shutil\nfrom pathlib import Path\nbase=Path(os.environ['RUNNER_TEMP'])\nr=base/'crash-inputs';out=base/'crash-consumer';retained=base/'crash-retained'\n\
        retained.mkdir()\nshutil.copytree(r,retained/'inputs')\nsafe=retained/'consumer';safe.mkdir()\nfor name in ['result.json','provider-build.stdout','provider-build.stderr','provider-stderr.txt']:\n\
        \ p=out/name\n if p.is_file():shutil.copyfile(p,safe/name)\nif (out/'calls').exists():shutil.copytree(out/'calls',safe/'calls')\n\
        for name in ['provider-ready.json','provider-reconnect.json','provider-error.txt']:\n p=out/'repo'/name\n if p.is_file():shutil.copyfile(p,safe/name)\n\
        # Protected homes and credentials are deliberately outside the artifact.\nnames=[p for p in retained.rglob('*') if\
        \ p.is_file()]\nassert all(not p.is_symlink() for p in names)\nmanifest={p.relative_to(retained).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()\
        \ for p in names}\n(retained/'members.json').write_text(json.dumps(manifest,indent=2)+'\\n')\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: runtime-crash-${{ matrix.os }}
        if-no-files-found: error
        path: ${{ runner.temp }}/crash-retained/
