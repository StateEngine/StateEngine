    - name: Install hash-pinned native process sampler
      run: |
        python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/code-pages/requirements.txt"
    - name: Provision disposable hosted account
      run: |
        identity="$(id -u)"
        profile="$(python -c 'import os,pwd; print(pwd.getpwuid(os.geteuid()).pw_dir)')"
        sudo python3 scripts/ci/installation_account.py provision --identity "$identity" --profile "$profile"
    - name: Build both native profiles then measure ten alternating pairs
      shell: python
      env:
        PAIR_TARGET: ${{ matrix.target }}
      run: |
        import os,subprocess,sys
        from pathlib import Path
        sys.path.insert(0,str(Path("scripts/ci").resolve()))
        from installation_account import require
        require()
        subprocess.run([sys.executable,"-u",str(Path(os.environ["RUNNER_TEMP"])/"code-pages/paired.py")],check=True)
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: release-code-pages-${{ matrix.target }}
        path: |-
          ${{ runner.temp }}/code-pages/
          !${{ runner.temp }}/code-pages/target-*/
          !${{ runner.temp }}/code-pages/source-*/
        if-no-files-found: error
        retention-days: 7
