        (p/'mac-resident.c').write_text('#include <errno.h>\n#include <inttypes.h>\n#include <libproc.h>\n#include <limits.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <sys/proc_info.h>\n#include <unistd.h>\n\nint main(int argc, char **argv) {\n    if (argc != 3) return 2;\n    char *tail = NULL;\n    long parsed = strtol(argv[1], &tail, 10);\n    if (!tail || *tail || parsed <= 0 || parsed > INT_MAX) return 2;\n    char expected[PATH_MAX];\n    if (!realpath(argv[2], expected)) return 3;\n    uint64_t address = 0, resident = 0, virtual_bytes = 0;\n    long page = sysconf(_SC_PAGESIZE);\n    if (page <= 0) return 4;\n    unsigned matched = 0;\n    printf("{\\"regions\\":[");\n    for (unsigned count = 0; count < 100000; ++count) {\n        struct proc_regionwithpathinfo info;\n        memset(&info, 0, sizeof(info));\n        errno = 0;\n        int size = proc_pidinfo((int)parsed, PROC_PIDREGIONPATHINFO, address, &info, sizeof(info));\n        if (size != (int)sizeof(info)) {\n            if (size == 0 && errno == EINVAL && matched > 0) {\n                printf("],\\"resident_bytes\\":%" PRIu64 ",\\"virtual_bytes\\":%" PRIu64 ",\\"matched_regions\\":%u,\\"page_size\\":%ld}\\n", resident, virtual_bytes, matched, page);\n                return 0;\n            }\n            fprintf(stderr, "region observation failed: size=%d errno=%d matches=%u\\n", size, errno, matched);\n            return 5;\n        }\n        struct proc_regioninfo *r = &info.prp_prinfo;\n        if (!r->pri_size || r->pri_address < address || r->pri_address + r->pri_size <= address) return 6;\n        if (strcmp(info.prp_vip.vip_path, expected) == 0) {\n            uint64_t bytes = (uint64_t)r->pri_pages_resident * (uint64_t)page;\n            printf("%s{\\"address\\":%" PRIu64 ",\\"size\\":%" PRIu64 ",\\"offset\\":%" PRIu64 ",\\"protection\\":%u,\\"resident_bytes\\":%" PRIu64 "}", matched ? "," : "", r->pri_address, r->pri_size, r->pri_offset, r->pri_protection, bytes);\n            resident += bytes;\n            virtual_bytes += r->pri_size;\n            ++matched;\n        }\n        address = r->pri_address + r->pri_size;\n    }\n    return 7;\n}\n',encoding="utf-8")
