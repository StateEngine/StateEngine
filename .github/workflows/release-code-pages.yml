name: Paired native distribution LTO residency
'on':
  push:
    branches:
    - prime/release-code-pages-r2
permissions:
  contents: read
concurrency:
  group: release-code-pages-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
        - runner: macos-15
          target: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 006d32827e03811ccab86e75ebca2ebbdd9c540e
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned toolchain
      id: compiler
      shell: python
      run: |
        import os,tomllib
        from pathlib import Path
        channel=tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
        with open(os.environ["GITHUB_OUTPUT"],"a") as f: print("channel="+channel,file=f)
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
        components: rust-docs, llvm-tools-preview
    - name: Materialize sealed comparison inputs
      shell: python
      run: |
        import os,hashlib
        from pathlib import Path
        p=Path(os.environ["RUNNER_TEMP"])/"code-pages"
        p.mkdir()
        (p/'paired.py').write_text('"""Native distribution builds and alternating first-hour resource measurements."""\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport platform\nimport shutil\nimport statistics\nimport subprocess\nimport sys\nimport time\nimport tomllib\n\nfrom measure import summarize, Pin\nfrom resident import observe\n\nroot = Path(os.environ[\'RUNNER_TEMP\'])/\'code-pages\'\nroot.mkdir(exist_ok=True)\nsource = json.loads((root/\'source.json\').read_text())\nworkspace = Path.cwd()\ntarget = os.environ[\'PAIR_TARGET\']\nreport = {\'schema\':\'se.paired-release-residency/v1\', \'sources\':source, \'platform\':platform.platform(),\n          \'target\':target, \'rounds_per_variant\':10, \'order\':\'AB,BA alternating for ten pairs\',\n          \'rss_budget_bytes\':30000000, \'startup_budget_ms\':100,\n          \'sampler\':\'20 host-only native RSS reads, 50ms sleeps, per-round maximum; native executable mapping observation follows the first read\',\n          \'limits\':[\'OS cache coldness is not claimed; fresh means new owner HOME and state.\',\n                    \'One native provider protocol-double turn; no real provider execution.\',\n                    \'A resident function page is not proof that every function on it executed.\',\n                    \'Native mapping observation adds outside observer work after the first RSS read; its duration is retained.\',\n                    \'No Windows measurement in this experiment; neither profile is qualified for release.\'],\n          \'builds\':{}, \'attempts\':[], \'complete\':False}\n\n\ndef save():\n    (root/\'paired-result.json\').write_text(json.dumps(report,indent=2)+\'\\n\')\n\n\ndef digest(p):\n    return hashlib.sha256(p.read_bytes()).hexdigest()\n\n\ndef logged(argv, cwd, stem):\n    started=time.monotonic_ns()\n    with stem.with_suffix(\'.stdout\').open(\'wb\') as out, stem.with_suffix(\'.stderr\').open(\'wb\') as err:\n        r=subprocess.run(argv,cwd=cwd,stdout=out,stderr=err)\n    stem.with_suffix(\'.json\').write_text(json.dumps({\'argv\':list(map(str,argv)),\'exit\':r.returncode,\n        \'elapsed_ns\':time.monotonic_ns()-started},indent=2)+\'\\n\')\n    r.check_returncode()\n\n\nsave()\ntry:\n    if sys.platform==\'darwin\':\n        logged([\'cc\',\'-O2\',\'-Wall\',\'-Wextra\',\'-Werror\',str(root/\'mac-resident.c\'),\'-lproc\',\'-o\',str(root/\'mac-resident\')],workspace,root/\'observer-build\')\n    probe=observe(Pin(os.getpid()),root/\'observer-probe\')\n    assert probe[\'state\']==\'present\' and probe[\'resident_bytes\']>0\n    for variant in (\'base\',\'candidate\'):\n        tree=root/(\'source-\'+variant)\n        subprocess.run([\'git\',\'worktree\',\'add\',\'--detach\',str(tree),source[variant]],check=True)\n        assert subprocess.check_output([\'git\',\'rev-parse\',\'HEAD\'],cwd=tree,text=True).strip()==source[variant]\n        profile=tomllib.loads((tree/\'Cargo.toml\').read_text())[\'profile\']\n        assert profile[\'distribution\'][\'codegen-units\']==1 and profile[\'distribution\'][\'opt-level\']==\'s\'\n        assert profile[\'distribution\'][\'lto\']==(\'thin\' if variant==\'base\' else \'fat\')\n        assert profile[\'release\'][\'panic\']==\'unwind\'\n        out=root/(\'distribution-\'+variant)\n        logged([sys.executable,str(tree/\'scripts/release/build.py\'),\'--target\',target,\'--out\',str(out),\n                \'--target-dir\',str(root/(\'target-\'+variant))],tree,root/(\'build-\'+variant))\n        manifest=json.loads((out/\'build.json\').read_text())\n        image=out/\'se\'\n        assert manifest[\'source_commit\']==source[variant] and manifest[\'panic\']==\'unwind\'\n        assert manifest[\'profile\']==\'distribution\' and manifest[\'stripping\'][\'mode\']==\'all\'\n        assert manifest[\'stripping\'][\'stripped\'][\'sha256\']==digest(image)\n        report[\'builds\'][variant]={\'source\':source[variant],\'image_sha256\':digest(image),\n            \'binary_bytes\':image.stat().st_size,\'build_wall_seconds\':json.loads((root/(\'build-\'+variant+\'.json\')).read_text())[\'elapsed_ns\']/1e9,\'profile\':profile[\'distribution\'],\'panic\':\'unwind\',\n            \'strip\':manifest[\'stripping\'],\'compiler\':manifest[\'compiler\'],\'manifest_sha256\':digest(out/\'build.json\')}\n        if sys.platform==\'linux\':\n            for suffix,argv in [(\'segments\',[\'readelf\',\'-lW\',str(image)]),(\'sections\',[\'readelf\',\'-SW\',str(image)]),\n                                (\'symbols\',[\'nm\',\'--numeric-sort\',\'--print-size\',\'--format=posix\',str(out/\'symbols/se.debug\')])]:\n                logged(argv,tree,root/(variant+\'-\'+suffix))\n        else:\n            logged([\'otool\',\'-l\',str(image)],tree,root/(variant+\'-segments\'))\n            logged([\'size\',\'-m\',str(image)],tree,root/(variant+\'-sections\'))\n        # Each profile gets a fresh target; finished caches are not measurement inputs.\n        shutil.rmtree(root/(\'target-\'+variant))\n        save()\n    assert report[\'builds\'][\'base\'][\'compiler\']==report[\'builds\'][\'candidate\'][\'compiler\']\n    for number in range(1,11):\n        order=(\'base\',\'candidate\') if number%2 else (\'candidate\',\'base\')\n        for variant in order:\n            tree=root/(\'source-\'+variant)\n            output=root/(f\'pair-{number:02}-\'+variant)\n            attempt={\'pair\':number,\'variant\':variant,\'order\':list(order),\'output\':output.name,\'state\':\'running\'}\n            report[\'attempts\'].append(attempt);save()\n            logged([sys.executable,str(root/\'measure.py\'),\'--se\',str(root/(\'distribution-\'+variant)/\'se\'),\n                    \'--source\',source[variant],\'--repo\',str(tree),\'--output\',str(output),\'--rounds\',\'1\'],tree,\n                    root/(f\'measure-{number:02}-\'+variant))\n            result=json.loads((output/\'result.json\').read_text())\n            assert result[\'complete\'] and result[\'source\']==source[variant]\n            assert len(result[\'rounds\'])==1 and result[\'image_sha256\']==report[\'builds\'][variant][\'image_sha256\']\n            row=result[\'rounds\'][0]\n            assert row[\'cleanup\'][\'pinned_processes_absent\'] and row[\'cleanup\'][\'disposable_home_removed\']\n            attempt.update(state=\'complete\',result_sha256=digest(output/\'result.json\'),\n                           timings_ms=row[\'timings_ms\'],rss=row[\'rss\'])\n            save();print(json.dumps({\'pair\':number,\'variant\':variant,\'timings_ms\':row[\'timings_ms\']}),flush=True)\n    report[\'summary\']={}\n    for variant in (\'base\',\'candidate\'):\n        rows=[v for v in report[\'attempts\'] if v[\'variant\']==variant]\n        assert len(rows)==10 and all(v[\'state\']==\'complete\' for v in rows)\n        summary={\'binary_bytes\':report[\'builds\'][variant][\'binary_bytes\'],\'build_wall_seconds\':report[\'builds\'][variant][\'build_wall_seconds\'],\'timings_ms\':{},\'rss_bytes\':{},\'resident_executable_bytes\':{}}\n        for name in rows[0][\'timings_ms\']:\n            summary[\'timings_ms\'][name]=summarize([r[\'timings_ms\'][name] for r in rows],100 if name.startswith((\'bare_\',\'host_\')) else None)\n        for phase in rows[0][\'rss\']:\n            summary[\'rss_bytes\'][phase]=summarize([r[\'rss\'][phase][\'summary_bytes\'][\'max\'] for r in rows],30000000)\n            assert all(r[\'rss\'][phase][\'resident_executable\'][\'state\']==\'present\' for r in rows)\n            summary[\'resident_executable_bytes\'][phase]=summarize([r[\'rss\'][phase][\'resident_executable\'][\'resident_bytes\'] for r in rows],None)\n        report[\'summary\'][variant]=summary\n    report[\'complete\']=True\nexcept BaseException as error:\n    import traceback\n    report[\'error\']=repr(error);report[\'traceback\']=traceback.format_exc();raise\nfinally:\n    save()\n',encoding="utf-8")
        assert hashlib.sha256((p/'paired.py').read_bytes()).hexdigest()=='c792c080aadcdf608c3f56808a24d16f98247e17e81e14a6d61ab1b3ec2a21f2'
        (p/'measure.py').write_text('"""Public CLI startup and outside host RSS; protocol double, no paid provider."""\nimport argparse\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport platform\nimport shutil\nimport statistics\nimport subprocess\nimport sys\nimport time\nimport traceback\n\nimport psutil\nfrom resident import observe\n\nBUDGET_RSS = 30_000_000\nBUDGET_MS = 100\n\n\ndef digest(path):\n    with Path(path).open(\'rb\') as stream:\n        return hashlib.file_digest(stream, \'sha256\').hexdigest()\n\n\ndef summarize(values, budget):\n    if not values:\n        return {\'state\': \'absent\', \'count\': 0, \'budget\': budget}\n    values = sorted(values)\n    return {\'state\': \'present\', \'count\': len(values), \'min\': values[0],\n            \'median\': statistics.median(values), \'p95_nearest_rank\': values[math.ceil(.95*len(values))-1],\n            \'max\': values[-1], \'range\': values[-1]-values[0],\n            \'budget\': budget, \'over_budget\': None if budget is None else sum(v > budget for v in values)}\n\n\ndef environment():\n    denied = (\'SE_\', \'STATEENGINE_\', \'SECODE_\', \'CODEX_\', \'CLAUDE\', \'OPENAI_\', \'ANTHROPIC_\',\n              \'GH_\', \'GITHUB_\', \'ACTIONS_\', \'RUNNER_\')\n    return {k: v for k, v in os.environ.items() if not k.startswith(denied)}\n\n\ndef invoke(argv, env, cwd, stem):\n    """Time spawn through process exit and output drain; file writes are outside timer."""\n    started = time.perf_counter_ns()\n    child = subprocess.Popen(argv, env=env, cwd=cwd, stdin=subprocess.DEVNULL,\n                             stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n    timed_out = False\n    try:\n        out, err = child.communicate(timeout=90)\n    except subprocess.TimeoutExpired:\n        timed_out = True\n        # The retained child and its complete command must agree before stopping it.\n        process = psutil.Process(child.pid)\n        actual = process.cmdline()\n        if actual != argv:\n            raise RuntimeError((\'timeout: child command changed; retained without signal\', child.pid, actual))\n        process.kill()\n        out, err = child.communicate(timeout=15)\n    elapsed = (time.perf_counter_ns()-started)/1_000_000\n    row = {\'argv\': argv, \'pid\': child.pid, \'exit\': child.returncode,\n           \'elapsed_ms\': elapsed, \'timed_out\': timed_out}\n    stem.with_suffix(\'.stdout\').write_bytes(out)\n    stem.with_suffix(\'.stderr\').write_bytes(err)\n    stem.with_suffix(\'.json\').write_text(json.dumps(row, indent=2))\n    if timed_out:\n        raise RuntimeError((\'public command timed out\', row))\n    return subprocess.CompletedProcess(argv, child.returncode, out, err), row\n\n\nclass Pin:\n    def __init__(self, pid, image_hash=None):\n        p = psutil.Process(pid)\n        self.pid, self.birth = pid, p.create_time()\n        self.image, self.argv = p.exe(), p.cmdline()\n        self.hash = digest(self.image)\n        if image_hash is not None:\n            assert self.hash == image_hash, (\'published host image differs from measured distribution\', self.image)\n        self.verify()\n\n    def record(self):\n        return {\'pid\': self.pid, \'create_time\': self.birth, \'image\': self.image,\n                \'argv\': self.argv, \'image_sha256\': self.hash}\n\n    def verify(self):\n        p = psutil.Process(self.pid)\n        assert p.create_time() == self.birth and p.is_running(), \'native process identity changed\'\n        assert os.path.normcase(p.exe()) == os.path.normcase(self.image), \'native image changed\'\n        assert p.status() != psutil.STATUS_ZOMBIE, \'native process is exited awaiting reap\'\n        return p\n\n    def exited(self):\n        try:\n            p = psutil.Process(self.pid)\n            return p.create_time() != self.birth or not p.is_running() or p.status() == psutil.STATUS_ZOMBIE\n        except psutil.NoSuchProcess:\n            return True\n\n\ndef sample_rss(pin, endpoint, out):\n    """Twenty native host-only reads, no status command or child aggregation."""\n    rows = []\n    for index in range(20):\n        row = {\'at_monotonic_ns\': time.monotonic_ns(), \'rss_bytes\': None}\n        try:\n            owner = json.loads(endpoint.read_text())[\'epoch\'][\'owner\']\n            assert owner[\'pid\'] == pin.pid\n            p = pin.verify()\n            row[\'rss_bytes\'] = p.memory_info().rss\n            pin.verify()\n            assert json.loads(endpoint.read_text())[\'epoch\'][\'owner\'] == owner\n            row[\'state\'] = \'present\'\n            if index == 0:\n                try:\n                    row[\'resident_executable\'] = observe(pin, out.with_name(out.stem+\'-mapping\'))\n                except Exception as error:\n                    row[\'resident_executable\'] = {\'state\':\'unreadable\',\'error\':repr(error)}\n        except Exception as error:\n            row.update(state=\'unreadable\', rss_bytes=None, error=repr(error))\n        rows.append(row)\n        time.sleep(.05)\n    out.write_text(json.dumps({\'identity\': pin.record(), \'samples\': rows}, indent=2))\n    good = [r[\'rss_bytes\'] for r in rows if r[\'state\'] == \'present\']\n    mapping = rows[0].get(\'resident_executable\', {\'state\':\'absent\'})\n    return {\'samples\': len(rows), \'unreadable\': len(rows)-len(good),\n            \'resident_executable\': mapping, \'summary_bytes\': summarize(good, BUDGET_RSS)}\n\n\ndef activity(value, agent):\n    if isinstance(value, dict):\n        if value.get(\'id\') == agent and \'provider_activity\' in value:\n            read = value[\'provider_activity\']\n            return read.get(\'value\') if read.get(\'state\') == \'present\' else None\n        for child in value.values():\n            found = activity(child, agent)\n            if found is not None:\n                return found\n    elif isinstance(value, list):\n        for child in value:\n            found = activity(child, agent)\n            if found is not None:\n                return found\n    return None\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\'--se\', type=Path, required=True)\n    parser.add_argument(\'--source\', required=True)\n    parser.add_argument(\'--repo\', type=Path, required=True)\n    parser.add_argument(\'--output\', type=Path, required=True)\n    parser.add_argument(\'--rounds\', type=int, default=10)\n    args = parser.parse_args()\n    assert 1 <= args.rounds <= 20\n    se, repo, output = args.se.resolve(strict=True), args.repo.resolve(strict=True), args.output.resolve()\n    output.mkdir(exist_ok=False)\n    actual = subprocess.check_output([\'git\', \'rev-parse\', \'HEAD\'], cwd=repo, text=True).strip()\n    assert actual == args.source\n    sys.path.insert(0, str(repo/\'crates/se/tests/judges\'))\n    from mail_cli import Fixture\n\n    class MeasuredFixture(Fixture):\n        def __init__(self, root, evidence):\n            self.evidence, self.measured = evidence, []\n            super().__init__(se, root, provider_helper=repo/\'crates/se/tests/judges/provider_waiting_protocol_review.py\',\n                             log_directory=\'fixture-logs\')\n\n        def call(self, *arguments, recipient=False):\n            self.env = {k: v for k, v in self.env.items() if k in environment() or k in (\'HOME\', \'USERPROFILE\')}\n            self.calls += 1\n            env = dict(self.env)\n            if recipient:\n                env[\'SE_SESSION\'] = self.session\n            argv = [str(self.se), \'--json\', \'--home\', str(self.home), *map(str, arguments)]\n            result, row = invoke(argv, env, self.repo, self.evidence/f\'call-{self.calls:03}\')\n            self.measured.append(row)\n            return result\n\n    report = {\'schema\': \'se.startup-rss/v1\', \'source\': actual, \'image_sha256\': digest(se),\n              \'platform\': sys.platform, \'machine\': platform.machine(), \'os\': platform.platform(),\n              \'python\': sys.version, \'psutil\': psutil.__version__, \'logical_cpus\': psutil.cpu_count(),\n              \'physical_memory_bytes\': psutil.virtual_memory().total, \'rounds_requested\': args.rounds,\n              \'rss_budget_bytes\': BUDGET_RSS, \'startup_budget_ms\': BUDGET_MS,\n              \'build\': \'native scripts/release/build.py distribution profile, pinned standalone feature set\',\n              \'provider\': \'native executable wrapping finite Claude protocol double; no real model execution\',\n              \'startup_definition\': \'outside perf_counter_ns before Popen through CLI exit and output drain\',\n              \'cold_definition\': \'first host up for fresh initialized state and owner HOME; OS cache coldness unverified\',\n              \'warm_definition\': \'same-home up after witnessed down, before any agent session\',\n              \'rss_definition\': \'psutil native host PID RSS / Windows working set; shared pages included; excludes all children\',\n              \'sample_window\': \'20 reads at 50ms spacing after each phase; sampled values, not lifetime peak\',\n              \'limitations\': [\'runner account native installation registry and machine caches persist across rounds\',\n                              \'bare --version startup does not exercise store or host readiness\',\n                              \'host up includes the CLI parent and public readiness verification\',\n                              \'host RSS is not total process-tree memory; provider, helper and client RSS excluded\',\n                              \'one completed synthetic protocol turn is not a long real-provider workload\',\n                              \'OS cache coldness, other architectures and retail hardware unverified\'],\n              \'rounds\': [], \'complete\': False}\n\n    def save():\n        (output/\'result.json\').write_text(json.dumps(report, indent=2)+\'\\n\')\n\n    save()\n    for number in range(1, args.rounds+1):\n        evidence = output/f\'round-{number:02}\'\n        evidence.mkdir()\n        # Keep native Unix socket aliases short even when artifact paths are long.\n        import tempfile\n        scratch = Path(tempfile.mkdtemp(prefix=\'seb8-\'))\n        root = scratch/\'fixture\'\n        row = {\'round\': number, \'state\': \'running\', \'rss\': {}, \'timings_ms\': {}, \'cleanup\': {}}\n        report[\'rounds\'].append(row)\n        f, pins = None, []\n        try:\n            env = environment()\n            owner = scratch/\'bare-owner\'; owner.mkdir()\n            env.update(HOME=str(owner), USERPROFILE=str(owner))\n            cmd = [str(se), \'--version\']\n            before, cold = invoke(cmd, env, scratch, evidence/\'bare-first\')\n            assert before.returncode == 0\n            row[\'timings_ms\'][\'bare_cli_first\'] = cold[\'elapsed_ms\']\n            f = MeasuredFixture(root, evidence)\n            # There must be one actual init attempt, never a hidden successful retry.\n            init_calls = [c for c in f.measured if \'init\' in c[\'argv\']]\n            assert len(init_calls) == 1 and init_calls[0][\'exit\'] == 0, \'init retry made fresh-state attempt ambiguous\'\n            row[\'timings_ms\'][\'init\'] = init_calls[0][\'elapsed_ms\']\n            for phase in (\'fresh\', \'warm\'):\n                started = f.ok(\'up\')\n                row[\'timings_ms\'][\'host_\'+phase] = f.measured[-1][\'elapsed_ms\']\n                assert started[\'state\'] == \'running\', started\n                pin = Pin(started[\'process\'][\'pid\'], report[\'image_sha256\'])\n                pins.append(pin)\n                row[phase+\'_host\'] = pin.record()\n                row[\'rss\'][\'after_init_\'+phase] = sample_rss(pin, f.home/\'endpoint.json\', evidence/(phase+\'-rss.json\'))\n                if phase == \'fresh\':\n                    down = f.ok(\'down\')\n                    assert down[\'complete\'] and down[\'witness\'][\'state\'] == \'witnessed\'\n                    assert pin.exited() and not (f.home/\'endpoint.json\').exists()\n                    row[\'cleanup\'][\'fresh_down\'] = down\n            warm_version, warm = invoke(cmd, env, scratch, evidence/\'bare-warm\')\n            assert warm_version.returncode == 0\n            row[\'timings_ms\'][\'bare_cli_warm\'] = warm[\'elapsed_ms\']\n            launched = f.ok(\'--project\', f.project, \'launch\', f.agent, \'--detach\', \'--task\', \'Complete one measured protocol turn\')\n            assert launched[\'state\'] == \'running\', launched\n            row[\'timings_ms\'][\'launch_protocol_double\'] = f.measured[-1][\'elapsed_ms\']\n            f.session = launched[\'session_id\']\n            provider = Pin(launched[\'process\'][\'pid\'])\n            pins.append(provider)\n            assert provider.pid != pin.pid\n            row[\'excluded_provider_root\'] = provider.record()\n            # Pin all observed descendants now, then prove public stop/down retires them.\n            for child in provider.verify().children(recursive=True):\n                pins.append(Pin(child.pid))\n            row[\'excluded_provider_children\'] = [p.record() for p in pins[3:]]\n            (f.repo/\'review-release\').touch()\n            until = time.monotonic()+30\n            while True:\n                state = f.ok(\'--project\', f.project, \'agent\', \'show\', f.agent)\n                current = activity(state, f.agent)\n                if current and current[\'activity\'] == \'turn-completed\':\n                    break\n                assert time.monotonic() < until, (\'completed turn not witnessed\', state)\n                time.sleep(.1)\n            until = time.monotonic()+30\n            while True:\n                history = f.ok(\'--project\', f.project, \'history\', \'--agent\', f.agent,\n                               \'--kind\', \'session.turn\', \'--limit\', \'100\')\n                assert history[\'window\'][\'complete\'] and history[\'next\'] is None, history\n                answers = [r for r in history[\'items\'] if r[\'payload\'][\'role\'] == \'assistant\']\n                if answers:\n                    assert len(answers) == 1 and answers[0][\'payload\'][\'body\'][\'text\'] == \'REVIEW_RECOVERED_OK\', history\n                    break\n                assert time.monotonic() < until, (\'native reply was not captured\', history)\n                time.sleep(.1)\n            row[\'completed_session\'] = {\'session_id\': f.session, \'activity\': current, \'history_event\': answers[0][\'event_id\']}\n            row[\'rss\'][\'after_completed_turn\'] = sample_rss(pin, f.home/\'endpoint.json\', evidence/\'completed-rss.json\')\n            row[\'stop\'] = f.ok(\'--project\', f.project, \'stop\', f.agent)\n            until = time.monotonic()+10\n            while not all(p.exited() for p in pins[2:]):\n                assert time.monotonic() < until, \'provider process survived public stop\'\n                time.sleep(.1)\n            row[\'rss\'][\'after_session_stop\'] = sample_rss(pin, f.home/\'endpoint.json\', evidence/\'stopped-rss.json\')\n            assert all(v[\'unreadable\'] == 0 for v in row[\'rss\'].values()), \'RSS has unreadable observations\'\n            row[\'state\'] = \'measured\'\n        except Exception as error:\n            row.update(state=\'failed\', error=repr(error), traceback=traceback.format_exc())\n        finally:\n            if f is not None:\n                try:\n                    down = f.ok(\'down\')\n                    assert down[\'complete\'] and down[\'witness\'][\'state\'] == \'witnessed\', down\n                    assert not (f.home/\'endpoint.json\').exists()\n                    until = time.monotonic()+10\n                    while not all(p.exited() for p in pins):\n                        assert time.monotonic()<until, \'pinned process survived public down\'\n                        time.sleep(.1)\n                    row[\'cleanup\'].update(final_down=down, pinned_processes_absent=True)\n                except Exception as error:\n                    row[\'cleanup\'].update(state=\'unproved\', error=repr(error))\n            else:\n                row[\'cleanup\'][\'state\'] = \'fixture-construction-failed; no host up was attempted\'\n            if row[\'cleanup\'].get(\'pinned_processes_absent\'):\n                shutil.rmtree(scratch)\n                row[\'cleanup\'][\'disposable_home_removed\'] = not scratch.exists()\n            save()\n        print(json.dumps({\'round\': number, \'state\': row[\'state\'], \'timings_ms\': row[\'timings_ms\']}), flush=True)\n        # An unproved cleanup must never overlap the next attempt on this account.\n        if row[\'state\'] != \'measured\' or not row[\'cleanup\'].get(\'pinned_processes_absent\'):\n            break\n    metrics = {}\n    timing_names = sorted({k for r in report[\'rounds\'] for k in r[\'timings_ms\']})\n    for name in timing_names:\n        budget = BUDGET_MS if name.startswith((\'bare_\', \'host_\')) else None\n        metrics[name] = summarize([r[\'timings_ms\'][name] for r in report[\'rounds\'] if name in r[\'timings_ms\']], budget)\n    for phase in (\'after_init_fresh\', \'after_init_warm\', \'after_completed_turn\', \'after_session_stop\'):\n        # Across-round spread uses each round\'s maximum sampled RSS, keeping raw reads separately.\n        values = [r[\'rss\'][phase][\'summary_bytes\'][\'max\'] for r in report[\'rounds\']\n                  if phase in r[\'rss\'] and r[\'rss\'][phase][\'summary_bytes\'][\'state\'] == \'present\']\n        metrics[\'rss_\'+phase] = summarize(values, BUDGET_RSS)\n    report[\'metrics\'] = metrics\n    report[\'complete\'] = len(report[\'rounds\']) == args.rounds and all(\n        r[\'state\']==\'measured\' and r[\'cleanup\'].get(\'disposable_home_removed\') and all(v.get(\'resident_executable\',{}).get(\'state\')==\'present\' for v in r[\'rss\'].values()) for r in report[\'rounds\'])\n    save()\n    # Budget misses are measured outcomes; missing phases or incomplete cleanup fail the measurement.\n    return 0 if report[\'complete\'] else 1\n\n\nif __name__ == \'__main__\':\n    sys.exit(main())\n',encoding="utf-8")
