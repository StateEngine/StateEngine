        (p/'resident.py').write_text('"""Outside native resident mappings; no target calls, signals or memory reads."""\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport struct\nimport subprocess\nimport sys\nimport time\n\n\ndef observe(pin, stem):\n    started = time.monotonic_ns()\n    pin.verify()\n    if sys.platform == \'darwin\':\n        helper = Path(__file__).with_name(\'mac-resident\')\n        r = subprocess.run([str(helper), str(pin.pid), pin.image], capture_output=True, timeout=10)\n        stem.with_suffix(\'.native.stdout\').write_bytes(r.stdout)\n        stem.with_suffix(\'.native.stderr\').write_bytes(r.stderr)\n        r.check_returncode()\n        value = json.loads(r.stdout)\n        value[\'method\'] = \'libproc PROC_PIDREGIONPATHINFO resident pages for exact executable path\'\n    elif sys.platform == \'linux\':\n        text = Path(f\'/proc/{pin.pid}/smaps\').read_text()\n        stem.with_suffix(\'.smaps\').write_text(text)\n        mappings = []\n        current = None\n        for line in text.splitlines():\n            match = re.match(r\'^([0-9a-f]+)-([0-9a-f]+)\\s+(\\S+)\\s+([0-9a-f]+)\\s+\\S+\\s+\\d+\\s*(.*)$\', line)\n            if match:\n                low, high, perms, offset, path = match.groups()\n                current = {\'address\': int(low,16), \'end\': int(high,16), \'permissions\': perms,\n                           \'offset\': int(offset,16), \'path\': path}\n                if path == pin.image:\n                    mappings.append(current)\n            elif current is not None and line.startswith(\'Rss:\'):\n                current[\'resident_bytes\'] = int(line.split()[1])*1024\n        assert mappings and all(\'resident_bytes\' in m for m in mappings)\n        page = os.sysconf(\'SC_PAGE_SIZE\')\n        try:\n            with Path(f\'/proc/{pin.pid}/pagemap\').open(\'rb\') as stream:\n                for mapping in mappings:\n                    count = (mapping[\'end\']-mapping[\'address\'])//page\n                    assert 0 < count < 131072\n                    stream.seek(mapping[\'address\']//page*8)\n                    raw = stream.read(count*8)\n                    assert len(raw) == count*8\n                    mapping[\'present_file_offsets\'] = [mapping[\'offset\']+i*page\n                        for i,(entry,) in enumerate(struct.iter_unpack(\'=Q\',raw)) if entry & (1<<63)]\n            pagemap = {\'state\':\'present\',\'page_size\':page,\'definition\':\'present bit only; frame numbers neither used nor retained\'}\n        except Exception as error:\n            pagemap = {\'state\':\'unreadable\',\'error\':repr(error)}\n        value = {\'method\':\'procfs smaps exact executable path\',\'regions\':mappings,\n                 \'resident_bytes\':sum(m[\'resident_bytes\'] for m in mappings), \'pagemap\':pagemap}\n    else:\n        raise RuntimeError(\'unsupported native mapping observer\')\n    pin.verify()\n    value.update(state=\'present\', elapsed_ns=time.monotonic_ns()-started)\n    stem.with_suffix(\'.json\').write_text(json.dumps(value,indent=2)+\'\\n\')\n    return value\n',encoding="utf-8")
