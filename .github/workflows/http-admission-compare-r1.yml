name: Native macOS HTTP admission base and fix repetitions
'on':
  push:
    branches:
    - prime/http-admission-compare-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  repeat:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: http391-macos-main-v1
    - name: Repeat only the unchanged HTTP admission consumer fifty times
      shell: python
      run: "\"\"\"Run one unchanged native HTTP admission test fifty times; retain every outcome.\"\"\"\
        \nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport subprocess\n\
        import sys\nimport time\n\nSOURCE = os.environ['HTTP_SOURCE']\nCASE = 'public_http_admission_precedes_anonymous_and_private_routes'\n\
        ROOT = Path(os.environ['RUNNER_TEMP']) / os.environ['HTTP_REPETITION_ROOT']\nROOT.mkdir(exist_ok=True)\n\
        rows = []\nsummary = {'source': SOURCE, 'case': CASE, 'planned': 50, 'attempted': 0,\n       \
        \    'cases': rows, 'complete': False, 'cleanup_unknown': False}\n\n\ndef save():\n    summary['attempted']\
        \ = len(rows)\n    summary['passed'] = sum(row['qualified_pass'] for row in rows)\n    summary['failed']\
        \ = sum(not row['qualified_pass'] for row in rows)\n    summary['not_run'] = list(range(len(rows)\
        \ + 1, 51))\n    (ROOT / 'summary.json').write_text(json.dumps(summary, indent=2) + '\\n')\n\n\
        \ndef run(label, argv, timeout):\n    start = time.monotonic()\n    result = {'argv': [str(a)\
        \ for a in argv], 'timed_out': False}\n    with (ROOT / (label + '.stdout')).open('wb') as out,\
        \ \\\n         (ROOT / (label + '.stderr')).open('wb') as err:\n        child = subprocess.Popen(argv,\
        \ stdin=subprocess.DEVNULL, stdout=out, stderr=err)\n        result['pid'] = child.pid\n     \
        \   try:\n            result['exit_code'] = child.wait(timeout=timeout)\n        except subprocess.TimeoutExpired:\n\
        \            result['timed_out'] = True\n            # This Popen child remains ours and unreaped.\
        \ Observe its complete\n            # native command before any emergency signal; never target\
        \ a name.\n            pin = subprocess.run(['ps', '-ww', '-p', str(child.pid), '-o', 'pid=',\n\
        \                                  '-o', 'lstart=', '-o', 'command='],\n                     \
        \            capture_output=True, text=True)\n            (ROOT / (label + '.process.txt')).write_text(pin.stdout\
        \ + pin.stderr)\n            if child.poll() is None and pin.returncode == 0 and str(argv[0])\
        \ in pin.stdout:\n                child.kill()\n                try:\n                    result['exit_code']\
        \ = child.wait(timeout=10)\n                except subprocess.TimeoutExpired:\n              \
        \      result['exit_code'] = None\n            else:\n                result['exit_code'] = child.poll()\n\
        \            # A killed test cannot run its host guard. Do not start another\n            # case\
        \ or claim cleanup; the disposable runner tears down its job.\n            summary['cleanup_unknown']\
        \ = True\n    result['elapsed_seconds'] = time.monotonic() - start\n    (ROOT / (label + '.json')).write_text(json.dumps(result,\
        \ indent=2) + '\\n')\n    return result\n\n\ndef main():\n    revision = subprocess.check_output(['git',\
        \ 'rev-parse', 'HEAD'], text=True).strip()\n    if revision != SOURCE:\n        raise RuntimeError('checked-out\
        \ source does not match the admitted baseline')\n    summary['actual_source'] = revision\n   \
        \ target = subprocess.check_output(['rustc', '--print', 'host-tuple'], text=True).strip()\n  \
        \  summary['target'] = target\n    build = run('build', ['cargo', 'test', '--target', target,\
        \ '-p', 'se', '--test',\n                         'http_admission', '--locked', '--no-run', '--message-format=json'],\
        \ 1800)\n    if build['exit_code'] != 0 or build['timed_out']:\n        raise RuntimeError('native\
        \ build failed or exceeded its bound; no case qualified')\n    messages = [json.loads(line) for\
        \ line in (ROOT / 'build.stdout').read_text().splitlines()]\n    artifacts = [row for row in messages\
        \ if row.get('reason') == 'compiler-artifact'\n                 and row.get('executable')]\n \
        \   tests = [Path(row['executable']) for row in artifacts\n             if row['target']['name']\
        \ == 'http_admission' and row['profile']['test']]\n    images = [Path(row['executable']) for row\
        \ in artifacts\n              if row['target']['name'] == 'se' and row['target']['kind'] == ['bin']\n\
        \              and not row['profile']['test']]\n    if len(tests) != 1 or len(images) != 1:\n\
        \        raise RuntimeError('exact native test/CLI artifact was absent or ambiguous')\n    binary\
        \ = tests[0].resolve(strict=True)\n    summary['inputs'] = [{'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),\n\
        \                          'bytes': path.stat().st_size} for path in [binary, images[0]]]\n  \
        \  listed = run('list', [str(binary), '--exact', CASE, '--list'], 15)\n    listing = (ROOT / 'list.stdout').read_text()\n\
        \    if listed['exit_code'] != 0 or listed['timed_out'] or listing.splitlines().count(CASE + ':\
        \ test') != 1:\n        raise RuntimeError('requested case was not independently listed exactly\
        \ once')\n    until = time.monotonic() + 900\n    for index in range(1, 51):\n        if time.monotonic()\
        \ >= until:\n            summary['stopped_reason'] = 'fifteen-minute repetition window elapsed'\n\
        \            break\n        label = f'case-{index:02d}'\n        result = run(label, [str(binary),\
        \ '--exact', CASE, '--nocapture', '--test-threads=1'], 120)\n        stdout = (ROOT / (label +\
        \ '.stdout')).read_text(errors='replace')\n        stderr = (ROOT / (label + '.stderr')).read_text(errors='replace')\n\
        \        result['iteration'] = index\n        result['qualified_pass'] = (result['exit_code']\
        \ == 0 and not result['timed_out']\n                                    and re.search(r'test result:\
        \ ok\\. 1 passed; 0 failed; 0 ignored;', stdout) is not None)\n        result['connection_reset_reported']\
        \ = 'ConnectionReset' in stdout + stderr or 'Connection reset by peer' in stdout + stderr\n  \
        \      rows.append(result)\n        save()\n        print(json.dumps({'iteration': index, 'exit_code':\
        \ result['exit_code'],\n                          'qualified_pass': result['qualified_pass'],\n\
        \                          'connection_reset_reported': result['connection_reset_reported']}),\
        \ flush=True)\n        cleanup_markers = ('retaining exact runtime fixture host', 'retaining failed\
        \ runtime fixture')\n        if summary['cleanup_unknown'] or any(marker in stderr for marker\
        \ in cleanup_markers):\n            summary['cleanup_unknown'] = True\n            summary['stopped_reason']\
        \ = 'native cleanup not witnessed; remaining cases not run'\n            break\n    dirty = subprocess.check_output(['git',\
        \ 'status', '--porcelain', '--untracked-files=no'], text=True)\n    summary['tracked_source_unchanged']\
        \ = not dirty\n    summary['complete'] = len(rows) == 50 and not summary['cleanup_unknown'] and\
        \ not dirty\n    summary['connection_reset_cases'] = [row['iteration'] for row in rows if row['connection_reset_reported']]\n\
        \    summary['all_passed'] = summary['complete'] and all(row['qualified_pass'] for row in rows)\n\
        \    save()\n    return 0 if summary['all_passed'] else 1\n\n\ntry:\n    code = main()\nexcept\
        \ Exception as error:\n    summary['driver_error'] = repr(error)\n    code = 1\nfinally:\n   \
        \ save()\n    manifest = {str(p.relative_to(ROOT)): {'bytes': p.stat().st_size,\n            \
        \    'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}\n                for p in sorted(ROOT.rglob('*'))\
        \ if p.is_file() and p.name != 'manifest.json'}\n    (ROOT / 'manifest.json').write_text(json.dumps({'source':\
        \ SOURCE, 'files': manifest}, indent=2) + '\\n')\nsys.exit(code)\n"
    - name: Retain every build and case log and complete manifest
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: http391-compare-r1-${{ matrix.revision }}
        path: ${{ runner.temp }}/http391-compare-r1-${{ matrix.revision }}
        if-no-files-found: error
        retention-days: 14
    name: HTTP admission fifty repetitions (${{ matrix.revision }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - revision: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        - revision: head
          source: 0c09b4f1abebf68d379db4b6f001d8e51dd63780
    env:
      HTTP_SOURCE: ${{ matrix.source }}
      HTTP_REPETITION_ROOT: http391-compare-r1-${{ matrix.revision }}
