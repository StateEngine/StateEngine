name: Atlas response page fitting native macOS checks
'on':
- push
- workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 29e92783eb7bd25ce8cfb8f9d56dd238c2907fe3
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: 'import os,tomllib

        from pathlib import Path

        channel=tomllib.loads(Path(''rust-toolchain.toml'').read_text())[''toolchain''][''channel'']

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as out:print(''channel=''+channel,file=out)

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Compile and exercise existing native readers
      shell: python
      run: "import pathlib,subprocess,os,time,json\nroot=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'atlas-response-native';out.mkdir()\nenv=dict(os.environ,CARGO_TARGET_DIR=str(root/'response-native-target'),CARGO_BUILD_JOBS='2',CARGO_INCREMENTAL='0',CARGO_PROFILE_DEV_DEBUG='0',CARGO_PROFILE_TEST_DEBUG='0')\nsource=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();receipts=[];host=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip()\ncommands=[('clippy',['cargo','clippy','--workspace','--all-targets','--all-features','--locked','--','-D','warnings']),('types-tests',['cargo','test','-p','se-types','--all-features','--locked']),('atlas-tests',['cargo','test','-p','se-atlas','--all-features','--locked']),('native-query-tests',['cargo','test','-p','se-host','--all-features','--locked','--test','atlas_query_reads'])]\nfor label,argv in commands:\n boundary=argv.index('--') if '--' in argv else len(argv);argv=argv[:boundary]+['--target',host]+argv[boundary:]\n\
        \ start=time.monotonic_ns()\n with (out/(label+'.stdout')).open('w') as stdout,(out/(label+'.stderr')).open('w') as stderr:p=subprocess.run(argv,env=env,stdout=stdout,stderr=stderr,timeout=1500)\n receipts.append({'source':source,'argv':argv,'exit':p.returncode,'elapsed_ns':time.monotonic_ns()-start});(out/'executions.json').write_text(json.dumps(receipts,indent=2))\n if p.returncode:raise SystemExit(p.returncode)\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: atlas-response-native-${{ matrix.os }}
        path: ${{ runner.temp }}/atlas-response-native/*
        if-no-files-found: error
