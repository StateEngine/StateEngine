name: Independent cold phase witness original deadline controls
'on':
- push
- workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: d4edee95c9b913b91c8a2d2eea9a99e6410796cc
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: 'import os,tomllib

        from pathlib import Path

        channel=tomllib.loads(Path(''rust-toolchain.toml'').read_text())[''toolchain''][''channel'']

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as out:print(''channel=''+channel,file=out)

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Exercise independent real consumer deadline and custody controls
      shell: python
      run: "PAYLOADS={'parse-clock.rs': '//! Reviewer controls for the original per-file deadline through the real parser consumer.\\nuse super::*;\\nuse se_atlas::parse::ParserPlacement;\\nuse std::{\\n    fs,\\n    sync::{\\n        Arc,\\n        atomic::{AtomicBool, Ordering},\\n    },\\n};\\ntype Check<T = ()> = Result<T, Box<dyn std::error::Error>>;\\nfn allowance() -> ParseBudget {\\n    ParseBudget {\\n        max_source_bytes: 1024,\\n        max_rows: 512,\\n        max_work: Duration::from_millis(200),\\n        reserved_bytes: 1_000_000,\\n    }\\n}\\nfn real_parse(parser: &mut Parser, source: &Source) -> Check {\\n    let started = Instant::now();\\n    let end = started + Duration::from_millis(500);\\n    let SourceRead::Bytes(input) = source.read(&RelativePath::new(\"healthy.js\")?, allowance())?\\n    else {\\n        return Err(\"source snapshot unavailable\".into());\\n    };\\n    let parsed = parser.parse(source, &input, Language::JavaScript, allowance(), end)?;\\n  \
        \  assert!(Instant::now() <= end);\\n    assert!(matches!(parsed.coverage, FileCoverage::Indexed));\\n    assert!(\\n        parsed\\n            .symbols\\n            .iter()\\n            .any(|row| row.name == \"native_healthy\")\\n    );\\n    assert!(parser.worker.is_none());\\n    println!(\\n        \"PASS real source read, native parse and exact reap in {} us\",\\n        started.elapsed().as_micros()\\n    );\\n    Ok(())\\n}\\n#[test]\\nfn elapsed_source_allowance_cannot_restart_parse_clock() -> Check {\\n    se_proc::initialize_file_creation_owner()?;\\n    let root = PathBuf::from(std::env::var_os(\"PARSER_JUDGE_ROOT\").ok_or(\"private root required\")?);\\n    fs::create_dir(&root)?;\\n    let repo = root.join(\"repo\");\\n    fs::create_dir(&repo)?;\\n    fs::write(\\n        repo.join(\"healthy.js\"),\\n        \"export function native_healthy(){return 42;}\\\\n\",\\n    )?;\\n    let project = se_types::ProjectId::from_parts(1, [71; 10])?;\\n    let id = RootId::from_parts(1,\
        \ [72; 10])?;\\n    let source = crate::atlas_source::NativeAtlasSource::open(\\n        RootRegistration {\\n            project: project.clone(),\\n            root: id.clone(),\\n            canonical_source_root: repo,\\n            cache: CacheLocation {\\n                directory: root.join(\"atlas\").join(project.as_str()).join(id.as_str()),\\n            },\\n            git_metadata: None,\\n        },\\n        CaseMode::Sensitive,\\n    )?;\\n    let image = PathBuf::from(\\n        std::env::var_os(\"SE_ATLAS_WORKER_BIN\").ok_or(\"shipping compact image required\")?,\\n    )\\n    .canonicalize()?;\\n    let fixture =\\n        PathBuf::from(std::env::var_os(\"PHASE_WORKER_BIN\").ok_or(\"native stall fixture required\")?)\\n            .canonicalize()?;\\n    let profile = ParserProfile::from_qualified_measurement(\\n        Language::JavaScript,\\n        ParserPlacement::Incremental,\\n        1024,\\n        512,\\n        678_298,\\n        256_000,\\n    )?;\\n\
        \    let mut parser = Parser::new(vec![profile]);\\n    parser.bind_image(&image);\\n    real_parse(&mut parser, &source)?;\\n    parser.bind_image(&fixture);\\n    let finished = Arc::new(AtomicBool::new(false));\\n    let done = finished.clone();\\n    let image_bytes = fixture.as_os_str().as_encoded_bytes().to_vec();\\n    let observer = std::thread::spawn(move || {\\n        let mut observed = Vec::new();\\n        let end = Instant::now() + Duration::from_secs(2);\\n        while !done.load(Ordering::Acquire) && Instant::now() < end {\\n            if let Ok(tasks) = fs::read_dir(\"/proc/self/task\") {\\n                for task in tasks.flatten() {\\n                    if let Ok(children) = fs::read_to_string(task.path().join(\"children\")) {\\n                        for pid in children.split_whitespace() {\\n                            let p = PathBuf::from(format!(\"/proc/{pid}\"));\\n                            if let (Ok(cmd), Ok(stat)) = (\\n                        \
        \        fs::read(p.join(\"cmdline\")),\\n                                fs::read_to_string(p.join(\"stat\")),\\n                            ) {\\n                                let args: Vec<_> = cmd.split(|b| *b == 0).collect();\\n                                if args.first() == Some(&image_bytes.as_slice())\\n                                    && args.get(1) == Some(&se_proc::atlas_worker::ENTRY.as_bytes())\\n                                {\\n                                    if let Some(tail) = stat\\n                                        .rsplit_once(\") \")\\n                                        .map(|s| s.1.split_whitespace().collect::<Vec<_>>())\\n                                    {\\n                                        if tail.get(1).and_then(|s| s.parse::<u32>().ok())\\n                                            == Some(std::process::id())\\n                                            && !observed.iter().any(|(old, _, _)| old == pid)\\n            \
        \                            {\\n                                            observed.push((\\n                                                pid.to_owned(),\\n                                                String::from_utf8_lossy(&cmd).replace(\\'\\\\0\\', \" \"),\\n                                                tail[19].to_owned(),\\n                                            ));\\n                                        }\\n                                    }\\n                                }\\n                            }\\n                        }\\n                    }\\n                }\\n            }\\n            std::thread::sleep(Duration::from_millis(1));\\n        }\\n        observed\\n    });\\n    let began = Instant::now();\\n    let end = began + Duration::from_millis(500);\\n    // This controlled charge represents already elapsed owner work, not a claim of slow disk I/O.\\n    std::thread::sleep(Duration::from_millis(350));\\n    let SourceRead::Bytes(snapshot)\
        \ =\\n        source.read(&RelativePath::new(\"healthy.js\")?, allowance())?\\n    else {\\n        return Err(\"source snapshot unavailable\".into());\\n    };\\n    let result = parser.parse(&source, &snapshot, Language::JavaScript, allowance(), end);\\n    let elapsed = began.elapsed();\\n    finished.store(true, Ordering::Release);\\n    let observed = observer.join().map_err(|_| \"observer panicked\")?;\\n    let parsed = result?;\\n    assert!(\\n        Instant::now() <= end,\\n        \"original 500ms exceeded: {elapsed:?}\"\\n    );\\n    assert!(matches!(\\n        parsed.coverage,\\n        FileCoverage::Deferred {\\n            reason: CoverageReason::ParseWorkLimit\\n        }\\n    ));\\n    assert!(\\n        parsed.symbols.is_empty()\\n            && parsed.imports.is_empty()\\n            && parsed.references.is_empty()\\n            && parsed.scopes.is_empty()\\n    );\\n    assert!(parser.worker.is_none());\\n    assert_eq!(\\n        observed.len(),\\n       \
        \ 1,\\n        \"owned native stall child not witnessed: {observed:?}\"\\n    );\\n    for (pid, cmd, birth) in observed {\\n        assert!(\\n            !Path::new(&format!(\"/proc/{pid}\")).exists(),\\n            \"exact native child not reaped\"\\n        );\\n        println!(\\n            \"PASS elapsed owner work+source+stalled parse+exact reap {} us; pid={pid}; birth={birth}; command={cmd}\",\\n            elapsed.as_micros()\\n        );\\n    }\\n    parser.bind_image(&image);\\n    real_parse(&mut parser, &source)?;\\n    Ok(())\\n}\\n', 'cold-clock.rs': '#![cfg(target_os = \"linux\")]\\nuse super::*;\\nuse crate::{atlas_cold::protocol::Request, atlas_source::NativeAtlasSource};\\nuse se_atlas::{lifecycle::*, model::*};\\nuse se_types::code::AtlasText;\\nuse std::{\\n    fs,\\n    path::{Path, PathBuf},\\n    time::{Duration, Instant},\\n};\\ntype Check<T = ()> = Result<T, Box<dyn std::error::Error>>;\\nfn input(root: &Path) -> Check<Request> {\\n    let repo = root.join(\"\
        repo\");\\n    fs::create_dir(&repo)?;\\n    fs::write(\\n        repo.join(\"healthy.js\"),\\n        \"export function native_healthy(){return 42;}\\\\n\",\\n    )?;\\n    let home = root.join(\"atlas\");\\n    fs::create_dir(&home)?;\\n    let project = se_types::ProjectId::from_parts(1, [61; 10])?;\\n    let id = RootId::from_parts(1, [62; 10])?;\\n    let source = NativeAtlasSource::open(\\n        RootRegistration {\\n            project: project.clone(),\\n            root: id.clone(),\\n            canonical_source_root: repo.clone(),\\n            cache: CacheLocation {\\n                directory: home.join(project.as_str()).join(id.as_str()),\\n            },\\n            git_metadata: None,\\n        },\\n        CaseMode::Sensitive,\\n    )?;\\n    Ok(Request {\\n        history_unavailable: None,\\n        job: AtlasJobId([63; 16]),\\n        project,\\n        root: id,\\n        source_root: se_types::NativePath::from_local(repo)?,\\n        home: se_types::NativePath::from_local(home)?,\\\
        n        physical_root: source.scope.physical_root,\\n        expected_epoch: None,\\n        epoch: CacheEpoch::from_parts(1, [64; 10])?,\\n        max_files: 10,\\n        ignore_digest: ContentHash([0; 32]),\\n        global_patterns: vec![],\\n        generated_prefixes: vec![],\\n    })\\n}\\nfn command(pid: u32) -> Check<String> {\\n    Ok(String::from_utf8(fs::read(format!(\"/proc/{pid}/cmdline\"))?)?.replace(\\'\\\\0\\', \" \"))\\n}\\n#[test]\\nfn source_and_parse_share_original_clock_and_reaped_slot() -> Check {\\n    se_proc::initialize_file_creation_owner()?;\\n    let root = PathBuf::from(std::env::var_os(\"COLD_JUDGE_ROOT\").ok_or(\"private root required\")?);\\n    fs::create_dir(&root)?;\\n    let request = input(&root)?;\\n    let fixture =\\n        PathBuf::from(std::env::var_os(\"PHASE_WORKER_BIN\").ok_or(\"phase fixture required\")?)\\n            .canonicalize()?;\\n    let image = PathBuf::from(\\n        std::env::var_os(\"SE_ATLAS_WORKER_BIN\").ok_or(\"compact\
        \ shipping image required\")?,\\n    )\\n    .canonicalize()?;\\n    let mut job = ColdJob::spawn(&fixture, request.clone())?;\\n    let pid = job.pid();\\n    let cmd = command(pid)?;\\n    assert!(cmd.contains(fixture.to_str().ok_or(\"fixture path encoding\")?));\\n    assert!(cmd.contains(se_proc::atlas_worker::ENTRY));\\n    let startup = Instant::now() + Duration::from_secs(3);\\n    while job.parse_deadline().is_none() {\\n        assert!(Instant::now() < startup, \"source authorization absent\");\\n        assert!(job.poll()?.is_none());\\n        std::thread::sleep(Duration::from_millis(1));\\n    }\\n    assert!(\\n        matches!(job.last_phase, protocol::Phase::SourceRead),\\n        \"source authorization did not arm the original clock\"\\n    );\\n    let end = job.parse_deadline().ok_or(\"source clock absent\")?;\\n    let began = end - Duration::from_millis(200);\\n    let mut observations = 0;\\n    let mut witnessed_parse = false;\\n    while Instant::now() < end\
        \ {\\n        assert!(job.poll()?.is_none());\\n        assert_eq!(\\n            job.parse_deadline(),\\n            Some(end),\\n            \"parse phase reset original source clock\"\\n        );\\n        witnessed_parse |= matches!(job.last_phase, protocol::Phase::Parse);\\n        if Instant::now() > began + Duration::from_millis(170) {\\n            observations += 1;\\n        }\\n        std::thread::sleep(Duration::from_millis(1));\\n    }\\n    assert!(\\n        observations > 0,\\n        \"no observation after fixture\\'s parse report\"\\n    );\\n    assert!(\\n        witnessed_parse,\\n        \"Parse phase was never observed before the original source deadline\"\\n    );\\n    let error = job\\n        .poll()\\n        .err()\\n        .ok_or(\"stalled native parse was accepted\")?;\\n    assert!(\\n        matches!(error.body.detail(), se_types::Detail::DeadlineExceeded(_)),\\n        \"{error}\"\\n    );\\n    assert!(\\n        Instant::now() <= began + Duration::from_millis(500),\\\
        n        \"source+parse+exact reap exceeded original 500 ms\"\\n    );\\n    assert!(\\n        !Path::new(&format!(\"/proc/{pid}\")).exists(),\\n        \"cancel returned without exact reap\"\\n    );\\n    let pointer = request\\n        .home\\n        .to_local()?\\n        .join(request.project.as_str())\\n        .join(request.root.as_str())\\n        .join(\"current.json\");\\n    assert!(!pointer.exists(), \"failed parse published a cache pointer\");\\n    println!(\\n        \"PASS shared source/parse deadline and exact reap in {} us; pid={pid}; command={cmd}\",\\n        began.elapsed().as_micros()\\n    );\\n    let mut next = ColdJob::spawn(&image, request)?;\\n    let successor = next.pid();\\n    let successor_cmd = command(successor)?;\\n    drop(job);\\n    let until = Instant::now() + Duration::from_secs(20);\\n    let summary = loop {\\n        if let Some(summary) = next.poll()? {\\n            break summary;\\n        }\\n        assert!(Instant::now() < until,\
        \ \"real cold successor did not finish\");\\n        std::thread::sleep(Duration::from_millis(1));\\n    };\\n    assert!(summary.coverage.discovery_complete);\\n    assert!(summary.coverage.indexed_files > 0);\\n    assert!(!Path::new(&format!(\"/proc/{successor}\")).exists());\\n    assert!(pointer.exists());\\n    println!(\\n        \"PASS shipping cold successor reused slot only after reap, independently reopened candidate and published pointer; pid={successor}; command={successor_cmd}\"\\n    );\\n    drop(next);\\n    Ok(())\\n}\\n', 'phase-worker.rs': '//! A native boundary fixture spends source-read time, then never completes parsing.\\nuse se_proc::atlas_worker::WorkerChannel;\\nuse std::time::Duration;\\nfn main() -> Result<(), Box<dyn std::error::Error>> {\\n    let (mut channel, bytes) = WorkerChannel::receive()?;\\n    let request: serde_json::Value = serde_json::from_slice(&bytes)?;\\n    if let Some(job) = request.get(\"job\") {\\n        for phase in [\"SourceRead\"\
        , \"Parse\"] {\\n            channel.send(&serde_json::to_vec(&serde_json::json!({\\n                \"kind\":\"Working\", \"job\":job, \"path\":\"healthy.js\", \"phase\":phase\\n            }))?)?;\\n            if phase == \"SourceRead\" {\\n                channel.await_source_read()?;\\n                std::thread::sleep(Duration::from_millis(150));\\n            }\\n        }\\n    }\\n    loop {\\n        std::thread::sleep(Duration::from_secs(1));\\n    }\\n}\\n'}\nimport pathlib,subprocess,os,time,json,hashlib,shutil\nrepo=pathlib.Path.cwd();root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'parser-review';out.mkdir()\nsource=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();host=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip();assert host=='x86_64-unknown-linux-gnu'\nenv=dict(os.environ,CARGO_TARGET_DIR=str(root/'parser-target'),CARGO_BUILD_JOBS='2',CARGO_INCREMENTAL='0',CARGO_PROFILE_DEV_DEBUG='0',CARGO_PROFILE_TEST_DEBUG='0',CARGO_PROFILE_RELEASE_OPT_LEVEL='s',CARGO_PROFILE_RELEASE_LTO='false')\n\
        receipts=[]\ndef run(label,args,timeout=1500):\n start=time.monotonic_ns()\n with (out/(label+'.stdout')).open('w') as stdout,(out/(label+'.stderr')).open('w') as stderr:p=subprocess.run(args,env=env,stdout=stdout,stderr=stderr,timeout=timeout)\n receipts.append(dict(source=source,label=label,argv=args,exit=p.returncode,elapsed_ns=time.monotonic_ns()-start));(out/'executions.json').write_text(json.dumps(receipts,indent=2));return p.returncode\n# Reuse the exact prior shipping image after independently authenticating its archive.\nimport zipfile\napi='repos/StateEngine/StateEngine/actions'\nmetadata=json.loads(subprocess.check_output(['gh','api',api+'/runs/43677555903/artifacts'],text=True))\narchives=[a for a in metadata['artifacts'] if a['name']=='atlas-worker-linux' and not a['expired']];assert len(archives)==1,metadata\nartifact=archives[0];archive=out/'prior-image.zip'\nwith archive.open('wb') as f:subprocess.run(['gh','api',api+'/artifacts/'+str(artifact['id'])+'/zip'],check=True,stdout=f)\n\
        assert 'sha256:'+hashlib.sha256(archive.read_bytes()).hexdigest()==artifact['digest']\nprior=root/'authenticated-prior';prior.mkdir()\nwith zipfile.ZipFile(archive) as z:\n for name in z.namelist():assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts and '\\\\' not in name\n z.extractall(prior)\nassert (prior/'source.txt').read_text().strip()==source\nimage=prior/'se';recorded=(prior/'sha256.txt').read_text().split()[0];assert hashlib.sha256(image.read_bytes()).hexdigest()==recorded;image.chmod(0o700)\nmanifest=dict(source=source,sha256=recorded,bytes=image.stat().st_size,features=['remote'],opt_level='s',lto=False,required_ci_run=43677555903)\n(out/'image.json').write_text(json.dumps(manifest,indent=2));(out/'archive-custody.json').write_text(json.dumps(artifact,indent=2))\nfor name,body in PAYLOADS.items():(out/name).write_text(body)\nexample=repo/'crates/se-proc/examples/phase_review_worker.rs';example.parent.mkdir(exist_ok=True);example.write_text(PAYLOADS['phase-worker.rs'])\n\
        assert run('build-native-phase-fixture',['cargo','build','--release','--target',host,'--package','se-proc','--example','phase_review_worker','--locked'])==0\nfixture=root/'parser-target'/host/'release/examples/phase_review_worker'\nunit=repo/'crates/se-host/src/atlas_parse/clock_review.rs';unit.write_text(PAYLOADS['parse-clock.rs'])\nwith (repo/'crates/se-host/src/atlas_parse/mod.rs').open('a') as f:f.write('\\n#[cfg(all(test,target_os=\"linux\"))]\\nmod clock_review;\\n')\n(repo/'crates/se-host/src/atlas_cold/clock_review.rs').write_text(PAYLOADS['cold-clock.rs'])\nwith (repo/'crates/se-host/src/atlas_cold/job.rs').open('a') as f:f.write('\\n#[cfg(all(test,target_os=\"linux\"))]\\n#[path=\"clock_review.rs\"]\\nmod clock_review;\\n')\nenv.update(SE_ATLAS_WORKER_BIN=str(image),PHASE_WORKER_BIN=str(fixture),PARSER_JUDGE_ROOT=str(root/'parser-consumer-home'),COLD_JUDGE_ROOT=str(root/'cold-consumer-home'))\n(out/'judges.json').write_text(json.dumps({name:hashlib.sha256(body.encode()).hexdigest()\
        \ for name,body in PAYLOADS.items()},indent=2))\nrun('parse-consumer-clock',['cargo','test','--target',host,'-p','se-host','--all-features','--locked','--lib','atlas_parse::clock_review::elapsed_source_allowance_cannot_restart_parse_clock','--','--nocapture','--test-threads=1'])\nrun('cold-consumer-clock',['cargo','test','--target',host,'-p','se-host','--all-features','--locked','--lib','atlas_cold::job::clock_review::source_and_parse_share_original_clock_and_reaped_slot','--','--nocapture','--test-threads=1'])\nraise SystemExit(1 if any(r['exit'] for r in receipts) else 0)\n"
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: parser-cold-phase-witness-review-linux
        path: ${{ runner.temp }}/parser-review/*
        if-no-files-found: error
