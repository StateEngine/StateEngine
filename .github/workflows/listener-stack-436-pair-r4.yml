name: Windows listener stack comparison
'on':
  push:
    branches:
    - prime/listener-stack-436-pair-r4
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
        fetch-depth: 1
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: listener-stack-436-pair-r2-${{ matrix.arm }}
        cache-workspace-crates: false
        workspaces: . -> ${{ env.CARGO_TARGET_DIR }}
    - name: Run native Clippy and existing listener consumer at default stack
      shell: python
      run: 'import base64,hashlib,subprocess,sys,os

        from pathlib import Path

        b=base64.b64decode('''')

        assert hashlib.sha256(b).hexdigest()==''b612074e650483eafbb9a75de6e78d5a0ff47c3672413d8401bd30e8be6c1776''

        p=Path(os.environ[''RUNNER_TEMP''])/''listener436-pair.py'';p.write_bytes(b)

        raise SystemExit(subprocess.call([sys.executable,''-B'',str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: listener-stack-436-pair-r4-${{ matrix.arm }}
        path: ${{ runner.temp }}/review430-listener-results/
        include-hidden-files: true
        if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 312ec7511850345aeb3c6f4bd8f7c4ffde2cced2
        - arm: fix
          source: e07c326d59f11197a28c64d30a1484d10416d509
    env:
      REVIEW_ARM: ${{ matrix.arm }}
      REVIEW_SOURCE: ${{ matrix.source }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/../listener-stack-436-target-${{ matrix.arm
        }}
