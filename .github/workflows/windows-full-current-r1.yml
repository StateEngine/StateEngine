name: Full native Windows current-main baseline
'on':
  push:
    branches:
    - prime/windows-full-current-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: full-windows-suite-v1
        cache-workspace-crates: false
    - name: Authenticate the external baseline recorder
      shell: python
      run: |
        import ast,base64,hashlib,os
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'windows-full-inputs';r.mkdir()
        data=base64.b64decode('')
        assert hashlib.sha256(data).hexdigest()=='59c5d471e99a62bc417cc6dcc00544e1139423576ff5a001efa9cd3307add9be'
        ast.parse(data);(r/'run.py').write_bytes(data)
    - name: Build and run the full all-features suite without retries or fail-fast
      shell: python
      run: |
        import os,subprocess,sys
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'windows-full-inputs'
        raise SystemExit(subprocess.call([sys.executable,'-B',str(r/'run.py')]))
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: windows-full-current-r1
        path: ${{ runner.temp }}/windows-full-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
