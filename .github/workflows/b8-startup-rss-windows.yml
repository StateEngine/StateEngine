name: Native startup and resident memory measurement
'on':
  push:
    branches:
    - prime/b8-startup-rss-windows-r2
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: windows-2025
          target: x86_64-pc-windows-msvc
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: fcf67c77603948752789c6737363172b15436354
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read the pinned distribution compiler
      id: compiler
      shell: python
      run: |
        import os,tomllib
        from pathlib import Path
        channel=tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
        with open(os.environ["GITHUB_OUTPUT"],"a") as f: print("channel="+channel,file=f)
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
        components: rust-docs, llvm-tools-preview
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      if: runner.os == 'Windows'
      with:
        arch: amd64
    - name: Build the native shipped distribution configuration
      shell: python
      env:
        B8_SOURCE: fcf67c77603948752789c6737363172b15436354
        B8_TARGET: ${{ matrix.target }}
      run: |
        import os,subprocess,sys
        from pathlib import Path
        assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==os.environ["B8_SOURCE"]
        out=Path(os.environ["RUNNER_TEMP"])/"b8-native-build"
        subprocess.run([sys.executable,"scripts/release/build.py","--target",os.environ["B8_TARGET"],"--out",str(out)],check=True)
    - name: Write the independent measurement and hash-pinned sampler dependency
      shell: python
      run: |
        import os
        from pathlib import Path
        root=Path(os.environ["RUNNER_TEMP"])
        (root/"b8-measure.py").write_text('"""Public CLI startup and outside host RSS; protocol double, no paid provider."""\nimport argparse\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport platform\nimport shutil\nimport statistics\nimport subprocess\nimport sys\nimport time\nimport traceback\n\nimport psutil\n\nBUDGET_RSS = 30_000_000\nBUDGET_MS = 100\n\n\ndef digest(path):\n    with Path(path).open(\'rb\') as stream:\n        return hashlib.file_digest(stream, \'sha256\').hexdigest()\n\n\ndef summarize(values, budget):\n    if not values:\n        return {\'state\': \'absent\', \'count\': 0, \'budget\': budget}\n    values = sorted(values)\n    return {\'state\': \'present\', \'count\': len(values), \'min\': values[0],\n            \'median\': statistics.median(values), \'p95_nearest_rank\': values[math.ceil(.95*len(values))-1],\n            \'max\': values[-1], \'range\': values[-1]-values[0],\n            \'budget\': budget, \'over_budget\': None if budget is None else sum(v > budget for v in values)}\n\n\ndef environment():\n    denied = (\'SE_\', \'STATEENGINE_\', \'SECODE_\', \'CODEX_\', \'CLAUDE\', \'OPENAI_\', \'ANTHROPIC_\',\n              \'GH_\', \'GITHUB_\', \'ACTIONS_\', \'RUNNER_\')\n    return {k: v for k, v in os.environ.items() if not k.startswith(denied)}\n\n\ndef invoke(argv, env, cwd, stem):\n    """Time spawn through process exit and output drain; file writes are outside timer."""\n    started = time.perf_counter_ns()\n    child = subprocess.Popen(argv, env=env, cwd=cwd, stdin=subprocess.DEVNULL,\n                             stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n    timed_out = False\n    try:\n        out, err = child.communicate(timeout=90)\n    except subprocess.TimeoutExpired:\n        timed_out = True\n        # The retained child and its complete command must agree before stopping it.\n        process = psutil.Process(child.pid)\n        actual = process.cmdline()\n        if actual != argv:\n            raise RuntimeError((\'timeout: child command changed; retained without signal\', child.pid, actual))\n        process.kill()\n        out, err = child.communicate(timeout=15)\n    elapsed = (time.perf_counter_ns()-started)/1_000_000\n    row = {\'argv\': argv, \'pid\': child.pid, \'exit\': child.returncode,\n           \'elapsed_ms\': elapsed, \'timed_out\': timed_out}\n    stem.with_suffix(\'.stdout\').write_bytes(out)\n    stem.with_suffix(\'.stderr\').write_bytes(err)\n    stem.with_suffix(\'.json\').write_text(json.dumps(row, indent=2))\n    if timed_out:\n        raise RuntimeError((\'public command timed out\', row))\n    return subprocess.CompletedProcess(argv, child.returncode, out, err), row\n\n\n# Inserted into the measurement driver for Windows-only fallback observation.\nimport threading\n\n\ndef windows_up(argv, env, cwd, stem, retained):\n    """Observe the public ready JSON, retaining a foreground host until public down."""\n    first = {\'value\': None, \'at_ns\': None, \'error\': None}\n    ready = threading.Event()\n    err = stem.with_suffix(\'.stderr\').open(\'wb\')\n    started = time.perf_counter_ns()\n    child = subprocess.Popen(argv, env=env, cwd=cwd, stdin=subprocess.DEVNULL,\n                             stdout=subprocess.PIPE, stderr=err)\n    err.close()\n\n    def drain():\n        try:\n            with stem.with_suffix(\'.stdout\').open(\'wb\') as output:\n                for line in child.stdout:\n                    at = time.perf_counter_ns()\n                    output.write(line)\n                    output.flush()\n                    if first[\'value\'] is None:\n                        first[\'value\'] = json.loads(line)\n                        first[\'at_ns\'] = at\n                        ready.set()\n        except Exception as error:\n            first[\'error\'] = repr(error)\n        finally:\n            child.stdout.close()\n            ready.set()\n\n    thread = threading.Thread(target=drain, daemon=True)\n    retained.append({\'process\': child, \'thread\': thread, \'stem\': stem})\n    thread.start()\n    assert ready.wait(90), \'public Windows up never announced readiness\'\n    assert first[\'error\'] is None and first[\'value\'] is not None, first\n    response = first[\'value\']\n    assert response.get(\'state\') == \'running\' and response.get(\'process\', {}).get(\'pid\'), response\n    foreground = response[\'process\'][\'pid\'] == child.pid\n    row = {\'argv\': argv, \'pid\': child.pid, \'elapsed_ms\': (first[\'at_ns\']-started)/1_000_000,\n           \'exit\': None, \'timing_endpoint\': \'first complete public ready JSON line, not process exit\',\n           \'mode\': \'foreground_fallback\' if foreground else \'detached_public_up\'}\n    if not foreground:\n        row[\'exit\'] = child.wait(timeout=10)\n        thread.join(5)\n        assert row[\'exit\'] == 0 and not thread.is_alive()\n    stem.with_suffix(\'.json\').write_text(json.dumps(row, indent=2))\n    return subprocess.CompletedProcess(argv, 0, json.dumps(response).encode(), b\'\'), row\n\n\ndef join_public_up(retained):\n    result = []\n    for entry in retained:\n        child, thread, stem = entry[\'process\'], entry[\'thread\'], entry[\'stem\']\n        code = child.wait(timeout=15)\n        thread.join(5)\n        assert code == 0 and not thread.is_alive(), (\'public up did not join after down\', code)\n        error = stem.with_suffix(\'.stderr\').read_text(errors=\'replace\')\n        row = {\'pid\': child.pid, \'exit\': code,\n               \'foreground_fallback_message\': \'Windows prevented detached startup; starting in the foreground.\' in error,\n               \'reader_joined\': not thread.is_alive()}\n        result.append(row)\n    retained.clear()\n    return result\n\n\nclass Pin:\n    def __init__(self, pid, image_hash=None):\n        p = psutil.Process(pid)\n        self.pid, self.birth = pid, p.create_time()\n        self.image, self.argv = p.exe(), p.cmdline()\n        self.hash = digest(self.image)\n        if image_hash is not None:\n            assert self.hash == image_hash, (\'published host image differs from measured distribution\', self.image)\n        self.verify()\n\n    def record(self):\n        return {\'pid\': self.pid, \'create_time\': self.birth, \'image\': self.image,\n                \'argv\': self.argv, \'image_sha256\': self.hash}\n\n    def verify(self):\n        p = psutil.Process(self.pid)\n        assert p.create_time() == self.birth and p.is_running(), \'native process identity changed\'\n        assert os.path.normcase(p.exe()) == os.path.normcase(self.image), \'native image changed\'\n        assert p.status() != psutil.STATUS_ZOMBIE, \'native process is exited awaiting reap\'\n        return p\n\n    def exited(self):\n        try:\n            p = psutil.Process(self.pid)\n            return p.create_time() != self.birth or not p.is_running() or p.status() == psutil.STATUS_ZOMBIE\n        except psutil.NoSuchProcess:\n            return True\n\n\ndef sample_rss(pin, endpoint, out):\n    """Twenty native host-only reads, no status command or child aggregation."""\n    rows = []\n    for _ in range(20):\n        row = {\'at_monotonic_ns\': time.monotonic_ns(), \'rss_bytes\': None}\n        try:\n            owner = json.loads(endpoint.read_text())[\'epoch\'][\'owner\']\n            assert owner[\'pid\'] == pin.pid\n            p = pin.verify()\n            row[\'rss_bytes\'] = p.memory_info().rss\n            pin.verify()\n            assert json.loads(endpoint.read_text())[\'epoch\'][\'owner\'] == owner\n            row[\'state\'] = \'present\'\n        except Exception as error:\n            row.update(state=\'unreadable\', rss_bytes=None, error=repr(error))\n        rows.append(row)\n        time.sleep(.05)\n    out.write_text(json.dumps({\'identity\': pin.record(), \'samples\': rows}, indent=2))\n    good = [r[\'rss_bytes\'] for r in rows if r[\'state\'] == \'present\']\n    return {\'samples\': len(rows), \'unreadable\': len(rows)-len(good),\n            \'summary_bytes\': summarize(good, BUDGET_RSS)}\n\n\ndef activity(value, agent):\n    if isinstance(value, dict):\n        if value.get(\'id\') == agent and \'provider_activity\' in value:\n            read = value[\'provider_activity\']\n            return read.get(\'value\') if read.get(\'state\') == \'present\' else None\n        for child in value.values():\n            found = activity(child, agent)\n            if found is not None:\n                return found\n    elif isinstance(value, list):\n        for child in value:\n            found = activity(child, agent)\n            if found is not None:\n                return found\n    return None\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\'--se\', type=Path, required=True)\n    parser.add_argument(\'--source\', required=True)\n    parser.add_argument(\'--repo\', type=Path, required=True)\n    parser.add_argument(\'--output\', type=Path, required=True)\n    parser.add_argument(\'--rounds\', type=int, default=10)\n    args = parser.parse_args()\n    assert 1 <= args.rounds <= 20\n    se, repo, output = args.se.resolve(strict=True), args.repo.resolve(strict=True), args.output.resolve()\n    output.mkdir(exist_ok=False)\n    actual = subprocess.check_output([\'git\', \'rev-parse\', \'HEAD\'], cwd=repo, text=True).strip()\n    assert actual == args.source\n    sys.path.insert(0, str(repo/\'crates/se/tests/judges\'))\n    from mail_cli import Fixture\n\n    class MeasuredFixture(Fixture):\n        def __init__(self, root, evidence):\n            self.evidence, self.measured = evidence, []\n            self.up_processes, self.up_closure = [], []\n            super().__init__(se, root, provider_helper=repo/\'crates/se/tests/judges/provider_waiting_protocol_review.py\',\n                             log_directory=\'fixture-logs\')\n\n        def call(self, *arguments, recipient=False):\n            self.env = {k: v for k, v in self.env.items() if k in environment() or k in (\'HOME\', \'USERPROFILE\')}\n            self.calls += 1\n            env = dict(self.env)\n            if recipient:\n                env[\'SE_SESSION\'] = self.session\n            argv = [str(self.se), \'--json\', \'--home\', str(self.home), *map(str, arguments)]\n            stem = self.evidence/f\'call-{self.calls:03}\'\n            if os.name == \'nt\' and arguments == (\'up\',):\n                result, row = windows_up(argv, env, self.repo, stem, self.up_processes)\n            else:\n                result, row = invoke(argv, env, self.repo, stem)\n            if arguments == (\'down\',) and result.returncode == 0:\n                self.up_closure.extend(join_public_up(self.up_processes))\n            self.measured.append(row)\n            return result\n\n    report = {\'schema\': \'se.startup-rss/v1\', \'source\': actual, \'image_sha256\': digest(se),\n              \'platform\': sys.platform, \'machine\': platform.machine(), \'os\': platform.platform(),\n              \'python\': sys.version, \'psutil\': psutil.__version__, \'logical_cpus\': psutil.cpu_count(),\n              \'physical_memory_bytes\': psutil.virtual_memory().total, \'rounds_requested\': args.rounds,\n              \'rss_budget_bytes\': BUDGET_RSS, \'startup_budget_ms\': BUDGET_MS,\n              \'build\': \'native scripts/release/build.py distribution profile, pinned standalone feature set\',\n              \'provider\': \'native executable wrapping finite Claude protocol double; no real model execution\',\n              \'startup_definition\': \'outside perf_counter_ns before Popen through CLI exit/output drain; Windows up ends at the public ready JSON line and foreground fallback is labeled separately\',\n              \'cold_definition\': \'first host up for fresh initialized state and owner HOME; OS cache coldness unverified\',\n              \'warm_definition\': \'same-home up after witnessed down, before any agent session\',\n              \'rss_definition\': \'psutil native host PID RSS / Windows working set; shared pages included; excludes all children\',\n              \'sample_window\': \'20 reads at 50ms spacing after each phase; sampled values, not lifetime peak\',\n              \'limitations\': [\'runner account native installation registry and machine caches persist across rounds\',\n                              \'bare --version startup does not exercise store or host readiness\',\n                              \'host up includes the CLI parent and public readiness verification\',\n                              \'host RSS is not total process-tree memory; provider, helper and client RSS excluded\',\n                              \'one completed synthetic protocol turn is not a long real-provider workload\',\n                              \'OS cache coldness, other architectures and retail hardware unverified\'],\n              \'rounds\': [], \'complete\': False}\n\n    def save():\n        (output/\'result.json\').write_text(json.dumps(report, indent=2)+\'\\n\')\n\n    save()\n    for number in range(1, args.rounds+1):\n        evidence = output/f\'round-{number:02}\'\n        evidence.mkdir()\n        # Keep native Unix socket aliases short even when artifact paths are long.\n        import tempfile\n        scratch = Path(tempfile.mkdtemp(prefix=\'seb8-\'))\n        root = scratch/\'fixture\'\n        row = {\'round\': number, \'state\': \'running\', \'rss\': {}, \'timings_ms\': {}, \'cleanup\': {}}\n        report[\'rounds\'].append(row)\n        f, pins = None, []\n        try:\n            env = environment()\n            owner = scratch/\'bare-owner\'; owner.mkdir()\n            env.update(HOME=str(owner), USERPROFILE=str(owner))\n            cmd = [str(se), \'--home\', str(scratch/\'bare-state\'), \'--version\']\n            before, cold = invoke(cmd, env, scratch, evidence/\'bare-first\')\n            assert before.returncode == 0\n            row[\'timings_ms\'][\'bare_cli_first\'] = cold[\'elapsed_ms\']\n            f = MeasuredFixture(root, evidence)\n            # There must be one actual init attempt, never a hidden successful retry.\n            init_calls = [c for c in f.measured if \'init\' in c[\'argv\']]\n            assert len(init_calls) == 1 and init_calls[0][\'exit\'] == 0, \'init retry made fresh-state attempt ambiguous\'\n            row[\'timings_ms\'][\'init\'] = init_calls[0][\'elapsed_ms\']\n            for phase in (\'fresh\', \'warm\'):\n                started = f.ok(\'up\')\n                mode = f.measured[-1].get(\'mode\', \'detached_public_up\')\n                row[phase+\'_startup_mode\'] = mode\n                label = \'host_\'+phase+(\'_foreground_fallback\' if mode == \'foreground_fallback\' else \'\')\n                row[\'timings_ms\'][label] = f.measured[-1][\'elapsed_ms\']\n                assert started[\'state\'] == \'running\', started\n                pin = Pin(started[\'process\'][\'pid\'], report[\'image_sha256\'])\n                pins.append(pin)\n                row[phase+\'_host\'] = pin.record()\n                row[\'rss\'][\'after_init_\'+phase] = sample_rss(pin, f.home/\'endpoint.json\', evidence/(phase+\'-rss.json\'))\n                if phase == \'fresh\':\n                    down = f.ok(\'down\')\n                    assert down[\'complete\'] and down[\'witness\'][\'state\'] == \'witnessed\'\n                    assert pin.exited() and not (f.home/\'endpoint.json\').exists()\n                    row[\'cleanup\'][\'fresh_down\'] = down\n            warm_version, warm = invoke(cmd, env, scratch, evidence/\'bare-warm\')\n            assert warm_version.returncode == 0\n            row[\'timings_ms\'][\'bare_cli_warm\'] = warm[\'elapsed_ms\']\n            launched = f.ok(\'--project\', f.project, \'launch\', f.agent, \'--detach\', \'--task\', \'Complete one measured protocol turn\')\n            assert launched[\'state\'] == \'running\', launched\n            row[\'timings_ms\'][\'launch_protocol_double\'] = f.measured[-1][\'elapsed_ms\']\n            f.session = launched[\'session_id\']\n            provider = Pin(launched[\'process\'][\'pid\'])\n            pins.append(provider)\n            assert provider.pid != pin.pid\n            row[\'excluded_provider_root\'] = provider.record()\n            # Pin all observed descendants now, then prove public stop/down retires them.\n            for child in provider.verify().children(recursive=True):\n                pins.append(Pin(child.pid))\n            row[\'excluded_provider_children\'] = [p.record() for p in pins[3:]]\n            (f.repo/\'review-release\').touch()\n            until = time.monotonic()+30\n            while True:\n                state = f.ok(\'--project\', f.project, \'agent\', \'show\', f.agent)\n                current = activity(state, f.agent)\n                if current and current[\'activity\'] == \'turn-completed\':\n                    break\n                assert time.monotonic() < until, (\'completed turn not witnessed\', state)\n                time.sleep(.1)\n            until = time.monotonic()+30\n            while True:\n                history = f.ok(\'--project\', f.project, \'history\', \'--agent\', f.agent,\n                               \'--kind\', \'session.turn\', \'--limit\', \'100\')\n                assert history[\'window\'][\'complete\'] and history[\'next\'] is None, history\n                answers = [r for r in history[\'items\'] if r[\'payload\'][\'role\'] == \'assistant\']\n                if answers:\n                    assert len(answers) == 1 and answers[0][\'payload\'][\'body\'][\'text\'] == \'REVIEW_RECOVERED_OK\', history\n                    break\n                assert time.monotonic() < until, (\'native reply was not captured\', history)\n                time.sleep(.1)\n            row[\'completed_session\'] = {\'session_id\': f.session, \'activity\': current, \'history_event\': answers[0][\'event_id\']}\n            row[\'rss\'][\'after_completed_turn\'] = sample_rss(pin, f.home/\'endpoint.json\', evidence/\'completed-rss.json\')\n            row[\'stop\'] = f.ok(\'--project\', f.project, \'stop\', f.agent)\n            until = time.monotonic()+10\n            while not all(p.exited() for p in pins[2:]):\n                assert time.monotonic() < until, \'provider process survived public stop\'\n                time.sleep(.1)\n            row[\'rss\'][\'after_session_stop\'] = sample_rss(pin, f.home/\'endpoint.json\', evidence/\'stopped-rss.json\')\n            assert all(v[\'unreadable\'] == 0 for v in row[\'rss\'].values()), \'RSS has unreadable observations\'\n            row[\'state\'] = \'measured\'\n        except Exception as error:\n            row.update(state=\'failed\', error=repr(error), traceback=traceback.format_exc())\n        finally:\n            if f is not None:\n                try:\n                    down = f.ok(\'down\')\n                    assert down[\'complete\'] and down[\'witness\'][\'state\'] == \'witnessed\', down\n                    assert not (f.home/\'endpoint.json\').exists()\n                    until = time.monotonic()+10\n                    while not all(p.exited() for p in pins):\n                        assert time.monotonic()<until, \'pinned process survived public down\'\n                        time.sleep(.1)\n                    row[\'cleanup\'].update(final_down=down, pinned_processes_absent=True, public_up_processes=f.up_closure)\n                except Exception as error:\n                    row[\'cleanup\'].update(state=\'unproved\', error=repr(error))\n            else:\n                row[\'cleanup\'][\'state\'] = \'fixture-construction-failed; no host up was attempted\'\n            if row[\'cleanup\'].get(\'pinned_processes_absent\'):\n                shutil.rmtree(scratch)\n                row[\'cleanup\'][\'disposable_home_removed\'] = not scratch.exists()\n            save()\n        print(json.dumps({\'round\': number, \'state\': row[\'state\'], \'timings_ms\': row[\'timings_ms\']}), flush=True)\n        # An unproved cleanup must never overlap the next attempt on this account.\n        if row[\'state\'] != \'measured\' or not row[\'cleanup\'].get(\'pinned_processes_absent\'):\n            break\n    metrics = {}\n    timing_names = sorted({k for r in report[\'rounds\'] for k in r[\'timings_ms\']})\n    for name in timing_names:\n        budget = BUDGET_MS if name.startswith((\'bare_\', \'host_\')) else None\n        metrics[name] = summarize([r[\'timings_ms\'][name] for r in report[\'rounds\'] if name in r[\'timings_ms\']], budget)\n    for phase in (\'after_init_fresh\', \'after_init_warm\', \'after_completed_turn\', \'after_session_stop\'):\n        # Across-round spread uses each round\'s maximum sampled RSS, keeping raw reads separately.\n        values = [r[\'rss\'][phase][\'summary_bytes\'][\'max\'] for r in report[\'rounds\']\n                  if phase in r[\'rss\'] and r[\'rss\'][phase][\'summary_bytes\'][\'state\'] == \'present\']\n        metrics[\'rss_\'+phase] = summarize(values, BUDGET_RSS)\n    report[\'windows_detached_startup_needs_native_vm\'] = sys.platform == \'win32\' and any(r.get(\'fresh_startup_mode\') == \'foreground_fallback\' for r in report[\'rounds\'])\n    report[\'metrics\'] = metrics\n    report[\'complete\'] = len(report[\'rounds\']) == args.rounds and all(\n        r[\'state\']==\'measured\' and r[\'cleanup\'].get(\'disposable_home_removed\') for r in report[\'rounds\'])\n    save()\n    # Budget misses are measured outcomes; missing phases or incomplete cleanup fail the measurement.\n    return 0 if report[\'complete\'] else 1\n\n\nif __name__ == \'__main__\':\n    sys.exit(main())\n',encoding="utf-8")
        (root/"b8-requirements.txt").write_text('psutil==7.0.0 \\\n    --hash=sha256:101d71dc322e3cffd7cea0650b09b3d08b8e7c4109dd6809fe452dfd00e58b25 \\\n    --hash=sha256:1e744154a6580bc968a0195fd25e80432d3afec619daf145b9e5ba16cc1d688e \\\n    --hash=sha256:1fcee592b4c6f146991ca55919ea3d1f8926497a713ed7faaf8225e174581e91 \\\n    --hash=sha256:39db632f6bb862eeccf56660871433e111b6ea58f2caea825571951d4b6aa3da \\\n    --hash=sha256:4b1388a4f6875d7e2aff5c4ca1cc16c545ed41dd8bb596cefea80111db353a34 \\\n    --hash=sha256:4cf3d4eb1aa9b348dec30105c55cd9b7d4629285735a102beb4441e38db90553 \\\n    --hash=sha256:84df4eb63e16849689f76b1ffcb36db7b8de703d1bc1fe41773db487621b6c17 \\\n    --hash=sha256:a5f098451abc2828f7dc6b58d44b532b22f2088f4999a937557b603ce72b1993 \\\n    --hash=sha256:ba3fcef7523064a6c9da440fc4d6bd07da93ac726b5733c29027d7dc95b39d99\n',encoding="utf-8")
    - name: Install the pinned outside process observer
      run: |
        python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/b8-requirements.txt"
    - name: Register this disposable hosted runner account
      run: |
        if [[ "$RUNNER_OS" == Windows ]]; then
          python scripts/ci/installation_account.py provision
        else
          identity="$(id -u)"
          profile="$(python -c 'import os,pwd; print(pwd.getpwuid(os.geteuid()).pw_dir)')"
          sudo python3 scripts/ci/installation_account.py provision --identity "$identity" --profile "$profile"
        fi
    - name: Measure ten fresh homes, restarts and completed protocol sessions
      shell: python
      env:
        B8_SOURCE: fcf67c77603948752789c6737363172b15436354
      run: |
        import os,subprocess,sys
        from pathlib import Path
        sys.path.insert(0,str(Path("scripts/ci").resolve()))
        from installation_account import require
        require()
        root=Path(os.environ["RUNNER_TEMP"])
        image=root/"b8-native-build"/("se.exe" if os.name=="nt" else "se")
        subprocess.run([sys.executable,str(root/"b8-measure.py"),"--se",str(image),"--source",os.environ["B8_SOURCE"],"--repo",str(Path.cwd()),"--output",str(root/"b8-results"),"--rounds","10"],check=True)
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: b8-${{ matrix.target }}
        path: |-
          ${{ runner.temp }}/b8-results/
          ${{ runner.temp }}/b8-native-build/build.json
          ${{ runner.temp }}/b8-measure.py
          ${{ runner.temp }}/b8-requirements.txt
        if-no-files-found: error
