name: Atlas native query Windows unchanged base comparison
'on':
- push
- workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 2afb01f903a891bb7a7f5bd283e7d7f4170cb875
        persist-credentials: false
        fetch-depth: 8
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: 'import os,tomllib

        from pathlib import Path

        channel=tomllib.loads(Path(''rust-toolchain.toml'').read_text())[''toolchain''][''channel'']

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as out:print(''channel=''+channel,file=out)

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Exercise the identical unchanged native query consumer on both sources
      shell: python
      run: "import pathlib,subprocess,os,time,json\nroot=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'atlas-response-windows-comparison';out.mkdir()\nrepo=pathlib.Path.cwd();base=root/'unchanged-base';subprocess.run(['git','worktree','add','--detach',str(base),'737bee8caf03e17d2a61e21594d7b0285d6619dc'],check=True)\nhost=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip();assert host=='x86_64-pc-windows-msvc'\nenv=dict(os.environ,CARGO_TARGET_DIR=str(root/'windows-query-target'),CARGO_BUILD_JOBS='2',CARGO_INCREMENTAL='0',CARGO_PROFILE_DEV_DEBUG='0',CARGO_PROFILE_TEST_DEBUG='0');receipts=[]\nfor label,cwd in [('base',base),('candidate',repo)]:\n source=subprocess.check_output(['git','rev-parse','HEAD'],cwd=cwd,text=True).strip();argv=['cargo','test','--target',host,'-p','se-host','--all-features','--locked','--test','atlas_query_reads','--','--nocapture'];start=time.monotonic_ns()\n with (out/(label+'.stdout')).open('w') as stdout,(out/(label+'.stderr')).open('w')\
        \ as stderr:p=subprocess.run(argv,cwd=cwd,env=env,stdout=stdout,stderr=stderr,timeout=1500)\n receipts.append(dict(label=label,source=source,argv=argv,exit=p.returncode,elapsed_ns=time.monotonic_ns()-start));(out/'executions.json').write_text(json.dumps(receipts,indent=2))\nraise SystemExit(1 if any(x['exit'] for x in receipts) else 0)\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: atlas-response-windows-query-comparison
        path: ${{ runner.temp }}/atlas-response-windows-comparison/*
        if-no-files-found: error
