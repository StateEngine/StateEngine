name: Windows hidden console probe
on:
  push:
    branches: [probe/windows-hidden-console-20261119]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile and run the console probe
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'C++ compiler unavailable' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$setup`" >nul && cl /nologo /W3 /Fe:console-probe.exe probes\windows-hidden-console.c && console-probe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e259704bb36e343263c66c7333beaf3fc479829b
          path: candidate
      - name: Prepare independent process-scope control
        shell: pwsh
        run: |
          Copy-Item probes/windows_console_scope.rs candidate/crates/se-proc/tests/support/windows_console_scope.rs
          Add-Content candidate/crates/se-proc/tests/stdio_binding.rs "`n#[cfg(windows)]`n#[path = `"support/windows_console_scope.rs`"]`nmod windows_console_scope;"
      - name: Build and exercise the native process runtime
        shell: pwsh
        working-directory: candidate
        run: |
          cargo build --locked -p se --bin se
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BINDING_SCOPE_HELPER = (Resolve-Path target/debug/se.exe).Path
          $env:BINDING_SCOPE_PAYLOAD = (Resolve-Path ../probes).Path
          cargo test --locked -p se-proc --test stdio_binding windows_console_scope::exact_windows_console_scope_interrupts_real_tools -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
