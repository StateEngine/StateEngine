name: Store fixture ownership native comparison
'on':
  push:
    branches:
    - prime/store-fixture-426-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2025
          arm: base
          sha: d051bf191945aba15bb04dbe639bfd46d2fff1f3
        - os: windows-2025
          arm: head
          sha: ec435eed2f3ef7dff7eb82d92d1ba62c6cf85903
        - os: ubuntu-24.04
          arm: head
          sha: ec435eed2f3ef7dff7eb82d92d1ba62c6cf85903
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ matrix.sha }}
      SOURCE_ARM: ${{ matrix.arm }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.sha }}
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: store-fixture-426-v1-${{ matrix.os }}
        cache-workspace-crates: false
    - name: Record pinned native checks and five existing test binaries
      shell: python
      run: 'import ast,base64,hashlib,os,subprocess,sys

        from pathlib import Path

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''800ddb09a0d090d75b120f6f28457872b82daf205257781a66e30d4ce9eb5f4f''

        ast.parse(data)

        script=Path(os.environ[''RUNNER_TEMP''])/''store-fixture-recorder.py''

        script.write_bytes(data)

        raise SystemExit(subprocess.call([sys.executable,''-B'',str(script)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: store-fixture-${{ matrix.os }}-${{ matrix.arm }}
        path: ${{ runner.temp }}/store-fixture-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
