name: Diagnose native HTTP response close boundary
'on':
  push:
    branches:
    - prime/http-admission-reset-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      REVIEW_SOURCE: 326fda46b8aadc99bd90d2e11c86094acd0b2a2e
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 326fda46b8aadc99bd90d2e11c86094acd0b2a2e
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Stage frozen transport observer
      shell: python
      run: 'from pathlib import Path

        import base64

        p=Path(''native-diagnostic.py'');p.write_bytes(base64.b64decode(''''))

        compile(p.read_text(),str(p),''exec'')

        '
    - name: Build unchanged native consumer
      run: cargo build --target aarch64-apple-darwin -p se --bin se --locked
    - name: Capture exact response and close boundary
      run: python3 -B native-diagnostic.py
    - name: Hash finite evidence
      if: always()
      shell: python
      run: 'from pathlib import Path

        import hashlib,json

        r=Path(''evidence'');r.mkdir(exist_ok=True)

        (r/''observer.py'').write_bytes(Path(''native-diagnostic.py'').read_bytes())

        rows=[{''file'':p.relative_to(r).as_posix(),''bytes'':p.stat().st_size,''sha256'':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(r.rglob(''*'')) if p.is_file() and p.name!=''manifest.json'']

        (r/''manifest.json'').write_text(json.dumps(rows,indent=2)+''\n'')

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: http-admission-native-diagnostic-r1
        path: evidence
        retention-days: 2
        if-no-files-found: error
