name: Native shipping image SHA-256 comparison
'on':
  push:
    branches:
    - prime/shipping-hash-cost-r1
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      HASH_SOURCE: 3aa7cb5d48048aee59d0580c01e80536f9d7b31c
      HASH_RUN: '43693584232'
      HASH_ARTIFACT: windows-usn-proof-paired-r8-active
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 5d18658cb8d5d3b028f8927ab517b219cd2f8272
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: amd64
    - name: Compare complete image SHA-256 paths
      shell: python
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'import ast,pathlib,subprocess,sys

        p=pathlib.Path(''scripts/hash_cost_observe/run.py'');ast.parse(p.read_text())

        subprocess.run([sys.executable,''-B'',str(p)],check=True,timeout=3000)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: shipping-hash-cost-r1
        path: '${{ runner.temp }}/shipping-hash-cost/*.json

          ${{ runner.temp }}/shipping-hash-cost/*.stdout

          ${{ runner.temp }}/shipping-hash-cost/*.stderr'
        if-no-files-found: error
        retention-days: 14
