name: Native executable hint boundary checks
on:
  push:
    branches: [prime/native-image-hint-judges-r2]
permissions:
  contents: read
concurrency:
  group: native-image-hint-judges-r2-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  judge:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 92cc8bf33d89dcedbbc1fb1ae3036718608c19cd
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: ./.github/actions/rust
      - name: Materialize independent native boundary judge
        shell: python
        run: |
          import base64, hashlib, os, pathlib, subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != '92cc8bf33d89dcedbbc1fb1ae3036718608c19cd':
              raise ValueError('Product checkout differs')
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-image-hint-evidence'
          evidence.mkdir()
          (evidence / 'source.txt').write_text(actual + '\n')
          judge = base64.b64decode('')
          if hashlib.sha256(judge).hexdigest() != '83314ad0fa3937037335914bca8b2d81883b8eddcd32f6c6080fb121eb18d7d2':
              raise ValueError('Independent judge differs')
          pathlib.Path('crates/se-proc/tests/startup_hint_independent.rs').write_bytes(judge)
          (evidence / 'startup_hint_independent.rs').write_bytes(judge)
      - name: Run independent fresh-process controls
        shell: python
        run: |
          import json, os, pathlib, subprocess
          env = os.environ.copy()
          root = pathlib.Path(env['RUNNER_TEMP'])
          env['CARGO_TARGET_DIR'] = str(root / 'native-image-hint-target')
          env['HINT_JUDGE_ROOT'] = str(root / 'native-image-hint-fixture')
          evidence = root / 'native-image-hint-evidence'
          host = next(line.split(': ', 1)[1] for line in subprocess.check_output(['rustc', '-vV'], text=True).splitlines() if line.startswith('host: '))
          command = ['cargo', 'test', '-p', 'se-proc', '--locked', '--target', host, '--test', 'startup_hint_independent', '--', '--test-threads=1', '--nocapture']
          with (evidence / 'native-judge.log').open('wb') as output:
              result = subprocess.run(command, env=env, stdout=output, stderr=subprocess.STDOUT)
          (evidence / 'result.json').write_text(json.dumps({'exit_code': result.returncode, 'source': '92cc8bf33d89dcedbbc1fb1ae3036718608c19cd', 'os': env['RUNNER_OS']}) + '\n')
          print((evidence / 'native-judge.log').read_text())
          raise SystemExit(result.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: native-image-hint-${{ matrix.os }}
          path: ${{ runner.temp }}/native-image-hint-evidence
          if-no-files-found: error
          retention-days: 14
