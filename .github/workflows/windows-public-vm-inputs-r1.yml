name: Build Windows public observer VM inputs
'on':
  push:
    branches:
    - prime/windows-public-vm-inputs-r1
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: e64815b8863665fa0d6fa88fe617c5b7e33066cd
        - arm: head
          source: a8eb523f757e95dd7f360e2fd3b88971c2945327
    env:
      PRODUCT_SOURCE: ${{ matrix.source }}
      ARM: ${{ matrix.arm }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        path: product
        persist-credentials: false
    - uses: ./product/.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: product
        shared-key: windows-launch-387-v1
    - name: Stage fixed VM controls
      shell: python
      run: "import hashlib,json,os\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'pr387-vm-inputs';root.mkdir()\n\
        files={'build_images.py': '\"\"\"Build the exact development images used by the independent public observer.\"\
        \"\"\\nimport hashlib\\nimport json\\nimport os\\nfrom pathlib import Path\\nimport shutil\\nimport subprocess\\\
        nimport time\\n\\nroot = Path(os.environ[\\'PR387_BUILD_OUTPUT\\'])\\nroot.mkdir()\\nsource = os.environ[\\\
        'PRODUCT_SOURCE\\']\\nassert subprocess.check_output([\\'git\\', \\'rev-parse\\', \\'HEAD\\'], text=True).strip()\
        \ == source\\nassert not subprocess.check_output([\\'git\\', \\'status\\', \\'--porcelain\\'])\\ncommand\
        \ = [\\'cargo\\', \\'build\\', \\'--locked\\', \\'--target\\', \\'x86_64-pc-windows-msvc\\', \\'-p\\', \\\
        'se\\', \\'--bin\\', \\'se\\']\\nrecord = {\\'source\\': source, \\'arm\\': os.environ[\\'ARM\\'], \\'argv\\\
        ': command,\\n          \\'publication\\': os.environ[\\'GITHUB_SHA\\'], \\'run\\': os.environ[\\'GITHUB_RUN_ID\\\
        '],\\n          \\'compiler\\': subprocess.check_output([\\'rustc\\', \\'-vV\\'], text=True),\\n       \
        \   \\'environment\\': {k: os.environ.get(k) for k in\\n                          [\\'CARGO_INCREMENTAL\\\
        ', \\'CARGO_PROFILE_DEV_DEBUG\\', \\'CARGO_BUILD_JOBS\\']},\\n          \\'profile\\': \\'Native Windows\
        \ development image matching the reviewer recipe\\'}\\nstarted = time.monotonic_ns()\\ntry:\\n    with (root\
        \ / \\'build.log\\').open(\\'wb\\') as log:\\n        result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT,\
