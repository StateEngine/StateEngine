        \    record.update(image_sha256=hashlib.sha256(original.read_bytes()).hexdigest(),\\n                  image_bytes=original.stat().st_size)\\\
        nfinally:\\n    (root / \\'build.json\\').write_text(json.dumps(record, indent=2) + \\'\\\\n\\', encoding=\\\
        'utf-8\\')\\n', 'prepare-standard-user.ps1': 'param(\\n  [Parameter(Mandatory=$true)][ValidateSet(\\'base\\\
