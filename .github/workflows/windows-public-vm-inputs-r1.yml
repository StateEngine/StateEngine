        environment={k:v for k,v in os.environ.items() if k.casefold()!='psmodulepath'}\nresults=[]\nfor name in\
        \ ['prepare-standard-user.ps1','controls/standard-user-bootstrap.ps1']:\n    command=\"$tokens=$null;$errors=$null;[Management.Automation.Language.Parser]::ParseFile('\"\
        +str(root/'controls'/name).replace(\"'\",\"''\")+\"',[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|Format-List;exit\
        \ 1};$PSVersionTable.PSVersion.ToString()\"\n    for label,shell in [('ps51',str(Path(os.environ['SystemRoot'])/'System32/WindowsPowerShell/v1.0/powershell.exe')),('ps7','pwsh.exe')]:\n\
        \        argv=[shell,'-NoLogo','-NoProfile','-NonInteractive','-EncodedCommand',base64.b64encode(command.encode('utf-16le')).decode()]\n\
        \        result=subprocess.run(argv,env=environment,capture_output=True,timeout=30)\n        prefix=label+'-'+Path(name).stem\n\
        \        (root/(prefix+'.stdout')).write_bytes(result.stdout)\n        (root/(prefix+'.stderr')).write_bytes(result.stderr)\n\
        \        results.append({'script':name,'shell':label,'exit':result.returncode})\n        (root/'parse.json').write_text(json.dumps(results,indent=2)+'\\\
        n')\n        assert result.returncode==0,'PowerShell parsing failed'"
    - name: Build exact development image
      shell: python
      working-directory: product
      run: 'import os,subprocess,sys

        from pathlib import Path

        root=Path(os.environ[''PR387_INPUT_ROOT''])

        subprocess.run([sys.executable,''-B'',str(root/''controls/build_images.py'')],check=True)'
    - name: Hash finite input artifact
      if: ${{ always() }}
      shell: python
      run: 'import hashlib,json,os

        from pathlib import Path

        root=Path(os.environ[''PR387_INPUT_ROOT''])

        hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob(''*'') if
        p.is_file()}

        (root/''sha256sums.json'').write_text(json.dumps(hashes,indent=2)+''\n'')'
