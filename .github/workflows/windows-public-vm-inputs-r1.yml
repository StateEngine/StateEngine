        \ arm=$Arm; image_sha256=$selected.image_sha256; account_sid=$account.SID.Value; observer_archive_sha256=$manifest.files.\\\
        'observer.tar\\'}\\n  [IO.File]::WriteAllText((Join-Path $case \\'expected.json\\'),($expected | ConvertTo-Json\
        \ -Depth 6))\\n  # Copy only compiler executables and libraries into this new account\\'s private\\n  #\
        \ case. Never reuse another account\\'s Rust configuration or credentials.\\n  $compiler = Get-Item -LiteralPath\
        \ $Rustc -ErrorAction Stop\\n  if ($compiler.Name -ne \\'rustc.exe\\' -or ($compiler.Attributes -band [IO.FileAttributes]::ReparsePoint))\
        \ {\\n    throw \\'A native compiler executable is required, not a toolchain proxy or link.\\'\\n  }\\n\
        \  $toolchainRoot = Split-Path (Split-Path $compiler.FullName -Parent) -Parent\\n  $targetToolchain = Join-Path\
        \ $case \\'toolchain\\'\\n  $null = [IO.Directory]::CreateDirectory($targetToolchain)\\n  foreach ($part\
