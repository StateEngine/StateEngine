name: macOS watched status measurement
on:
  push:
    branches: [probe/b17-macos-status-measurement]
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build
        run: cargo build --release -p se --features remote --locked
      - name: Measure
        run: python scripts/ci/measure_watched_status_macos.py --se target/release/se --output "$RUNNER_TEMP/status-watch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-watched-status-measurement
          path: |
            ${{ runner.temp }}/status-watch/results.json
            ${{ runner.temp }}/status-watch/host.stdout
            ${{ runner.temp }}/status-watch/host.stderr
          if-no-files-found: warn
