name: PR 403 hosted Windows receive and harden verification
on:
  push:
    branches: [prime/pr403-421-windows-r2]
permissions:
  contents: read
concurrency:
  group: pr403-421-windows-r2-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f3b3c3c392ff6db7cb437cb66a132074fb28b42f
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: {toolchain: '1.97.1'}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with: {arch: amd64}
      - name: Inject review harness (not product code)
        shell: python
        run: |
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / '421review'
          root.mkdir()
          harness = base64.b64decode("")
          judge = base64.b64decode("")
          pathlib.Path('crates/se-host/tests/remote/native_image').mkdir(parents=True, exist_ok=True)
          (pathlib.Path('crates/se-host/tests') / 'zz421_review_emit.rs').write_bytes(harness)
          (root / 'judge421.py').write_bytes(judge)
      - name: Verify the pin and prepare the payload
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / '421review'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == 'f3b3c3c392ff6db7cb437cb66a132074fb28b42f', head
          base = 'crates/se-host/src/remote/native_image/'
          files = {base + n: hashlib.sha256(pathlib.Path(base + n).read_bytes()).hexdigest()
                   for n in ('staging.rs', 'prepare.rs', 'transactions.rs')}
          files['crates/se-host/src/remote/ssh/bootstrap.rs'] = hashlib.sha256(pathlib.Path('crates/se-host/src/remote/ssh/bootstrap.rs').read_bytes()).hexdigest()
          files['harness/crates/se-host/tests/zz421_review_emit.rs'] = hashlib.sha256(pathlib.Path('crates/se-host/tests/zz421_review_emit.rs').read_bytes()).hexdigest()
          files['harness/judge421.py'] = hashlib.sha256((root / 'judge421.py').read_bytes()).hexdigest()
          (root / 'provenance.json').write_text(json.dumps(dict(head=head, files=files), indent=2) + '\n')
          payload = b'stateengine-pr403-421-private-image\n' * 100000
          (root / 'payload.bin').write_bytes(payload)
          digest = hashlib.sha256(payload).hexdigest()
          (root / 'digest.txt').write_text(digest + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('JUDGE421_ROOT=' + str(root) + '\n')
              out.write('EMIT421_DIGEST=' + digest + '\n')
      - name: Emit the exact product commands from the pinned source
        shell: python
        run: |
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['JUDGE421_ROOT'])
          log = root / 'emit.log'
          with log.open('xb') as fh:
              r = subprocess.run(['cargo', 'test', '-p', 'se-host', '--test', 'zz421_review_emit',
                                  '--features', 'remote', '--', '--nocapture'],
                                 stdout=fh, stderr=subprocess.STDOUT, timeout=2400)
          lines = [l for l in log.read_text(errors='replace').splitlines() if l.startswith('EMIT421 ')]
          assert r.returncode == 0 and len(lines) == 7, (r.returncode, len(lines))
          commands = {}
          for line in lines:
              parts = line.split(' ', 2)
              name, command = parts[1], parts[2]
              assert name not in commands, name
              commands[name] = command
          (root / 'commands.json').write_text(json.dumps(commands, indent=2) + '\n')
          print('emitted:', ', '.join(commands))
      - name: Run the receive and harden judge
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['JUDGE421_ROOT'])
          subprocess.run([sys.executable, '-B', str(root / 'judge421.py')], check=True, timeout=1800)
          receipt = json.loads((root / 'receipt.json').read_text())
          assert receipt['qualified'] and receipt['destination_removed']
          print('receipt qualified; steps:', [s['step'] + '=' + str(s['exit']) for s in receipt['steps']])
      - name: Collect complete evidence without credentials or build caches
        if: ${{ always() }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path(os.environ['JUDGE421_ROOT'])
          export = pathlib.Path(os.environ['RUNNER_TEMP']) / '421review-export'
          export.mkdir()
          for name in ('provenance.json', 'commands.json', 'emit.log', 'payload.bin', 'digest.txt',
                       'judge421.py', 'receipt.json'):
              source = root / name
              if source.exists():
                  shutil.copyfile(source, export / name)
          manifest = {p.relative_to(export).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in export.rglob('*') if p.is_file()}
          (export / 'manifest.json').write_text(json.dumps(dict(files=manifest), indent=2) + '\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: pr403-421-windows-r2-windows
          path: ${{ runner.temp }}/421review-export
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
