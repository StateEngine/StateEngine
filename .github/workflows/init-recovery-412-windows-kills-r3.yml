name: Review native Windows first-init kill recovery
'on':
  push:
    branches:
    - prime/init-recovery-412-windows-kills-r3
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      REVIEW_HEAD: cb095a5a3d0b2f4d6fb1ad614560d99cd6497485
      REVIEW_BASE: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: cb095a5a3d0b2f4d6fb1ad614560d99cd6497485
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - name: Stage independent frozen controls
      shell: python
      run: "from pathlib import Path\nimport base64,os\nr=Path(os.environ['RUNNER_TEMP'])/'init-review/controls';r.mkdir(parents=True)\nfiles={'crash_init.py': '', 'instrument.py': '', 'produce.py': '', 'restore.py': '', 'review_cut.rs': ''}\nfor name,data in files.items():\n raw=base64.b64decode(data);(r/name).write_bytes(raw)\n if name.endswith('.py'):compile(raw.decode(),name,'exec')\n"
    - name: Build source-bound images and exercise public recovery
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        r=Path(os.environ[''RUNNER_TEMP''])/''init-review/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(r/''produce.py'')]).returncode)

        '
    - name: Hash retained finite evidence
      if: always()
      shell: python
      run: 'from pathlib import Path

        import hashlib,json,os,shutil

        r=Path(os.environ[''RUNNER_TEMP''])/''init-review'';e=r/''evidence'';e.mkdir(parents=True,exist_ok=True)

        shutil.copytree(r/''controls'',e/''frozen-inputs'')

        rows=[{''file'':p.relative_to(e).as_posix(),''bytes'':p.stat().st_size,''sha256'':hashlib.file_digest(p.open(''rb''),''sha256'').hexdigest()} for p in sorted(e.rglob(''*'')) if p.is_file() and p.name!=''artifact-manifest.json'']

        (e/''artifact-manifest.json'').write_text(json.dumps(rows,indent=2)+''\n'')

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: pr412-windows-kills-r3
        path: ${{ runner.temp }}/init-review/evidence
        include-hidden-files: true
        retention-days: 2
        compression-level: 0
        if-no-files-found: error
