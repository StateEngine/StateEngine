name: Native harness service checks
'on':
  push:
    branches: [diag/harness-services-native]
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 787d333794516b1e2ab26b62a333ef9037680b4a
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Run native checks
        shell: python
        run: |
          import base64,hashlib,os,subprocess,sys
          from pathlib import Path
          source=base64.b64decode('')
          assert hashlib.sha256(source).hexdigest()=='a2c72ef30b8dd34c9f0b3f68c2de0041ad62a1ed9e90f680ea6ed37a7bd02edf'
          path=Path(os.environ['RUNNER_TEMP'])/'harness-native.py'
          path.write_bytes(source)
          raise SystemExit(subprocess.call([sys.executable,'-B',str(path)]))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: harness-services-native-windows
          path: ${{ runner.temp }}/harness-services-native/
          if-no-files-found: error
