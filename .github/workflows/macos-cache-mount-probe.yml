name: Native OS cache mount observations
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Observe OS cache and ancestors through native descriptors
        shell: python
        run: |
          import pathlib,subprocess,json,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'cache-mount-probe';root.mkdir()
          source=root/'probe.c';source.write_text('#include <sys/param.h>\n#include <sys/mount.h>\n#include <sys/stat.h>\n#include <fcntl.h>\n#include <unistd.h>\n#include <dlfcn.h>\n#include <stdio.h>\n#include <string.h>\nint main(int argc, char **argv) {\n if (argc==1) {\n  const char *(*query)(void)=(const char *(*)(void))dlsym(RTLD_DEFAULT,"dyld_shared_cache_file_path");\n  if (!query) return 2;\n  const char *name=query(); if (!name) return 3;\n  printf("%s",name); return 0;\n }\n if (argc!=2) return 4;\n int fd=open(argv[1],O_RDONLY|O_CLOEXEC|O_NOFOLLOW|O_NONBLOCK);\n if(fd<0){perror("open");return 5;}\n struct statfs volume; struct stat info;\n if(fstatfs(fd,&volume)||fstat(fd,&info)){perror("fstatfs/fstat");close(fd);return 6;}\n printf("%u %u %d %d %u %u %u %u %llu %llu\\n",volume.f_flags,volume.f_owner,volume.f_fsid.val[0],volume.f_fsid.val[1],info.st_uid,info.st_gid,info.st_mode,info.st_flags,(unsigned long long)info.st_dev,(unsigned long long)info.st_ino);\n fwrite(volume.f_fstypename,1,strnlen(volume.f_fstypename,sizeof(volume.f_fstypename)),stdout);putchar(0);\n fwrite(volume.f_mntonname,1,strnlen(volume.f_mntonname,sizeof(volume.f_mntonname)),stdout);putchar(0);\n fwrite(volume.f_mntfromname,1,strnlen(volume.f_mntfromname,sizeof(volume.f_mntfromname)),stdout);putchar(0);\n return close(fd)!=0;\n}\n')
          exe=root/'probe';subprocess.run(['clang','-Wall','-Wextra','-Werror',str(source),'-o',str(exe)],check=True)
          query=subprocess.check_output([str(exe)]).decode();path=pathlib.Path(query).resolve(strict=True)
          rows=[]
          for selected in [path,*path.parents]:
           p=subprocess.run([str(exe),str(selected)],capture_output=True)
           row={'path':str(selected),'exit':p.returncode,'stderr':p.stderr.decode(errors='replace')}
           if not p.returncode:
            values,names=p.stdout.split(b'\n',1);fields=[int(v) for v in values.split()];assert len(fields)==10
            row.update(zip(['mount_flags','mount_owner','fsid_0','fsid_1','uid','gid','mode','file_flags','device','inode'],fields))
            parts=names.split(b'\0');assert len(parts)==4 and parts[-1]==b''
            row.update(zip(['filesystem','mounted_on','mounted_from'],[s.decode() for s in parts[:-1]]));row['read_only']=bool(row['mount_flags']&1)
           rows.append(row)
          (root/'mounts.json').write_text(json.dumps({'dyld_path':query,'resolved':str(path),'observations':rows},indent=2)+'\n')
          print((root/'mounts.json').read_text())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: os-cache-mount-observations
          path: ${{ runner.temp }}/cache-mount-probe/
          if-no-files-found: error
