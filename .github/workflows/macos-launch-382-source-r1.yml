name: Native source launch controls
'on':
  push:
    branches:
    - prime/macos-launch-382-source-r1
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  MEASURE_TARGET: aarch64-apple-darwin
defaults:
  run:
    shell: bash
    working-directory: product
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 6fa72f37928db40c98de8238d9a39d92d2b21d66
        path: product
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 2836e87c9e251d77cece6385b04b003b5030627f
        path: observer
        persist-credentials: false
    - uses: ./product/.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: product -> ../target
        shared-key: macos-launch-source-382-v1
    - name: Register disposable native test account
      shell: python
      run: |
        from pathlib import Path
        import runpy,subprocess,sys
        script=Path('scripts/ci/installation_account.py').resolve()
        identity,profile=runpy.run_path(str(script))['account']()
        subprocess.run(['sudo',sys.executable,str(script),'provision','--identity',identity,'--profile',str(profile)],check=True)
        subprocess.run([sys.executable,str(script),'check'],check=True)
    - name: Stage pinned author development controls
      shell: python
      run: |
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP'])
        (root/'trace-proc.c').write_text('/* Observation only: preserve every native return value and errno. */\n#include <errno.h>\n#include <fcntl.h>\n#include <libproc.h>\n#include <stdatomic.h>\n#include <stdint.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\nstatic _Atomic unsigned records;\nstatic void emit(const char *line, size_t size) {\n    const char *path = getenv("SE382_NATIVE_TRACE");\n    if (!path) return;\n    int fd = open(path, O_WRONLY | O_CREAT | O_APPEND, 0600);\n    if (fd < 0) return;\n    ssize_t count = write(fd, line, size);\n    (void)count;\n    close(fd);\n}\n__attribute__((constructor)) static void loaded(void) {\n    int saved = errno;\n    char line[128];\n    int n = snprintf(line, sizeof line, "{\\"event\\":\\"loaded\\",\\"caller\\":%d}\\n", getpid());\n    if (n > 0 && (size_t)n < sizeof line) emit(line, (size_t)n);\n    errno = saved;\n}\nstatic int traced_path(int pid, void *out, uint32_t size) {\n    int result = proc_pidpath(pid, out, size);\n    int saved = errno;\n    unsigned index = atomic_fetch_add(&records, 1);\n    if (result <= 0 || index < 8) {\n        struct proc_bsdinfo a = {0}, b = {0};\n        errno = 0;\n        int an = proc_pidinfo(pid, PROC_PIDTBSDINFO, 1, &a, sizeof a);\n        int ae = errno;\n        errno = 0;\n        int bn = proc_pidinfo(pid, PROC_PIDTBSDINFO, 1, &b, sizeof b);\n        int be = errno;\n        char line[1024];\n        int n = snprintf(line, sizeof line,\n          "{\\"event\\":\\"path\\",\\"caller\\":%d,\\"pid\\":%d,\\"return\\":%d,\\"errno\\":%d,"\n          "\\"a\\":{\\"bytes\\":%d,\\"errno\\":%d,\\"pid\\":%u,\\"parent\\":%u,\\"state\\":%u,\\"start_s\\":%llu,\\"start_us\\":%llu},"\n          "\\"b\\":{\\"bytes\\":%d,\\"errno\\":%d,\\"pid\\":%u,\\"parent\\":%u,\\"state\\":%u,\\"start_s\\":%llu,\\"start_us\\":%llu}}\\n",\n          getpid(), pid, result, saved,\n          an, ae, a.pbi_pid, a.pbi_ppid, a.pbi_status, (unsigned long long)a.pbi_start_tvsec, (unsigned long long)a.pbi_start_tvusec,\n          bn, be, b.pbi_pid, b.pbi_ppid, b.pbi_status, (unsigned long long)b.pbi_start_tvsec, (unsigned long long)b.pbi_start_tvusec);\n        if (n > 0 && (size_t)n < sizeof line) emit(line, (size_t)n);\n    }\n    errno = saved;\n    return result;\n}\n__attribute__((used, section("__DATA,__interpose")))\nstatic const struct { const void *replacement; const void *original; } interpose[] = {\n    { (const void *)traced_path, (const void *)proc_pidpath },\n};\n')
        (root/'source-reproduce.py').write_text('"""Retain failed attempts and native PID facts; never turn an unreadable PID into absence."""\nfrom pathlib import Path\nimport hashlib,json,os,shutil,subprocess,sys,time\ncheckout=Path.cwd();observer=checkout/\'scripts/live_output_observe\'\nsys.path.insert(0,str(observer))\nfrom build import digest,unpack\nfrom native import Fixture as NativeFixture,NativeObserver\nfrom public_ready import PublicReady\nfrom types import SimpleNamespace\nclass Fixture(NativeFixture):\n def ok(self,*args,recipient=False):\n  if args != (\'up\',):return super().ok(*args,recipient=recipient)\n  self.startup=PublicReady(SimpleNamespace(output=self.root,repository=self.repo),[str(self.se),\'--home\',str(self.home),\'--json\',\'up\',\'--foreground\'],self.env)\n  return json.loads(self.startup.wait()[\'stdout\'])\nout=Path(os.environ[\'DIAGNOSTIC_OUTPUT\']);out.mkdir()\nsource=os.environ[\'MEASURE_SOURCE\']\nimage=Path(os.environ[\'DIAGNOSTIC_IMAGE\'])\nassert digest(image)==os.environ[\'DIAGNOSTIC_IMAGE_SHA256\']\ntrace=out/\'trace-proc.dylib\'\nsubprocess.run([\'/usr/bin/cc\',\'-std=c11\',\'-dynamiclib\',\'-Wall\',\'-Wextra\',\'-Werror\',str(Path(os.environ[\'RUNNER_TEMP\'])/\'trace-proc.c\'),\'-o\',str(trace),\'-lproc\'],check=True)\nhelper=out/\'diagnostic-provider.py\'\nprovider_source=(checkout/\'crates/se/tests/judges/mail_provider.py\').read_text()\n# Add a timeline without changing the existing provider\'s handshake or delays.\nprovider_source=provider_source.replace(\'    cwd = Path.cwd()\',\'    cwd = Path.cwd()\\n    phase("entered")\',1)\nfor old,new in [\n (\'    time.sleep(0.25)\',\'    phase("init-flushed")\\n    if (cwd/"diagnostic-cohort.txt").read_text()=="short-lived-descendants":\\n        for _ in range(64):\\n            subprocess.run(["/usr/bin/true"],check=True)\\n        phase("native-helper-churn-finished")\\n    time.sleep(0.25)\'),\n (\'    request = json.dumps\',\'    phase("transcript-written")\\n    request = json.dumps\'),\n (\'    assert ipc.returncode == 0\',\'    phase("session-discovery-returned", exit=ipc.returncode)\\n    assert ipc.returncode == 0\'),\n (\'    if on_ready is not None:\',\'    phase("ready")\\n    if on_ready is not None:\')]:\n assert provider_source.count(old)==1,old\n provider_source=provider_source.replace(old,new,1)\nhelper.write_text(\'\'\'import json,os,sys,time,traceback\nfrom pathlib import Path\ndef phase(name,**fields):\n with (Path.cwd()/\'provider-phases.jsonl\').open(\'a\') as log:\n  log.write(json.dumps(dict(phase=name,pid=os.getpid(),parent=os.getppid(),at_ns=time.monotonic_ns(),**fields))+\'\\\\n\')\ntry:\n exec(compile(SOURCE,\'mail_provider.py\',\'exec\'),dict(__name__=\'__diagnostic__\',__file__=PROVIDER_PATH,phase=phase))\nexcept BaseException:\n with (Path.cwd()/\'provider-error.txt\').open(\'w\') as log:traceback.print_exc(file=log)\n raise\n\'\'\'.replace(" exec(compile(SOURCE,\'mail_provider.py\',\'exec\'),dict(__name__=\'__diagnostic__\',__file__=PROVIDER_PATH,phase=phase))", " scope=dict(__name__=\'__diagnostic__\',__file__="+repr(str(checkout/\'crates/se/tests/judges/mail_provider.py\'))+",phase=phase)\\n exec(compile("+repr(provider_source)+",\'mail_provider.py\',\'exec\'),scope)\\n scope[\'main\']()"))\ninputs={\'source\':source,\'observer\':subprocess.check_output([\'git\',\'rev-parse\',\'HEAD\'],text=True).strip(),\'image_origin\':\'native development build, not release or installer qualification\',\'image_sha256\':digest(image),\'trace_sha256\':digest(trace),\'trace_source_sha256\':digest(Path(os.environ[\'RUNNER_TEMP\'])/\'trace-proc.c\'),\'provider_source_sha256\':digest(checkout/\'crates/se/tests/judges/mail_provider.py\'),\'instrumented_provider_sha256\':digest(helper),\'native_host\':subprocess.check_output([\'rustc\',\'--print\',\'host-tuple\'],text=True).strip(),\'compiler\':subprocess.check_output([\'rustc\',\'-vV\'],text=True),\'run_id\':os.environ[\'GITHUB_RUN_ID\'],\'publication\':os.environ[\'GITHUB_SHA\'],\'runtime_mode\':\'public foreground (detached startup strips trace environment)\',\'cohorts\':[\'natural\',\'short-lived-descendants\']}\n(out/\'inputs.json\').write_text(json.dumps(inputs,indent=2)+\'\\n\')\nrows=[]\nfor index in range(32):\n case=out/f\'attempt-{index+1:02}\';case.mkdir();fixture_dir=case/\'fixture\';fixture_dir.mkdir(mode=0o700)\n private=fixture_dir/\'se\';shutil.copyfile(image,private);private.chmod(0o500);assert digest(private)==digest(image)\n f=Fixture(private,fixture_dir/\'session\',provider_helper=helper)\n cohort=\'natural\' if index%2==0 else \'short-lived-descendants\'\n (f.repo/\'diagnostic-cohort.txt\').write_text(cohort)\n allowed=(\'HOME\',\'USERPROFILE\',\'PATH\',\'LANG\',\'SHELL\',\'TMPDIR\',\'TMP\',\'TEMP\',\'SystemRoot\',\'SYSTEMROOT\',\'windir\',\'WINDIR\',\'ComSpec\',\'COMSPEC\',\'PATHEXT\')\n f.env={k:v for k,v in f.env.items() if k in allowed or k.startswith(\'XDG_\')}\n f.env.update(DYLD_INSERT_LIBRARIES=str(trace),SE382_NATIVE_TRACE=str(case/\'native.jsonl\'))\n observer=NativeObserver(fixture_dir,case)\n failure=None;cleanup=[];launched=None;runtime_pid=None;launch_elapsed_ns=None\n try:\n  up=f.ok(\'up\');runtime_pid=up[\'process\'][\'pid\'];observer.observe(runtime_pid)\n  started=time.monotonic_ns()\n  try:f.launch();launched=f.session\n  except Exception as error:failure=f\'{type(error).__name__}: {error}\'\n  launch_elapsed_ns=time.monotonic_ns()-started\n  observer.observe()\n finally:\n  # Copy diagnostic files before shutdown can remove the owned private home.\n  for name in (\'provider-phases.jsonl\',\'provider-error.txt\',\'provider-ready.json\'):\n   p=f.repo/name\n   if p.exists():shutil.copyfile(p,case/name)\n  if (case/\'native.jsonl\').exists():shutil.copyfile(case/\'native.jsonl\',case/\'native-before-down.jsonl\')\n  try:f.close()\n  except Exception as error:cleanup.append(f\'{type(error).__name__}: {error}\')\n  if f.startup is not None:\n   try:f.startup.join()\n   except Exception as error:cleanup.append(f\'Foreground join: {error}\')\n  until=time.monotonic()+10\n  remaining=observer.observe()\n  while remaining and time.monotonic()<until:time.sleep(.02);remaining=observer.observe()\n  if remaining:cleanup.append(\'Owned native identities remain after public down\')\n  for name in (\'provider-phases.jsonl\',\'provider-error.txt\',\'provider-ready.json\'):\n   p=f.repo/name\n   if p.exists():shutil.copyfile(p,case/name)\n  for p in f.log_root.glob(\'call-*.*\'):shutil.copyfile(p,case/p.name)\n  for name in (\'public-ready.json\',\'public-ready-final.json\'):\n   p=f.root/name\n   if p.exists():shutil.copyfile(p,case/name)\n  native_trace=case/\'native.jsonl\'\n  host_traced=False\n  if not native_trace.exists():cleanup.append(\'Native tracing did not load; reproduction is ungraded\')\n  else:\n   events=[json.loads(line) for line in native_trace.read_text().splitlines()]\n   host_traced=any(e.get(\'event\')==\'path\' and e[\'caller\']==runtime_pid for e in events)\n   if not host_traced:cleanup.append(\'Runtime itself has no exercised native path trace; reproduction is ungraded\')\n  row={\'launch_elapsed_ns\':launch_elapsed_ns,\'cohort\':cohort,\'runtime_pid\':runtime_pid,\'host_traced\':host_traced,\'attempt\':index+1,\'launch_session\':launched,\'failure\':failure,\'cleanup_errors\':cleanup,\'remaining\':remaining}\n  (case/\'result.json\').write_text(json.dumps(row,indent=2)+\'\\n\');rows.append(row)\n  (out/\'census.json\').write_text(json.dumps({\'attempts\':rows,\'failed_attempts\':sum(r[\'failure\'] is not None for r in rows),\'all_cleanup_witnessed\':all(not r[\'cleanup_errors\'] for r in rows),\'claim\':\'Author development observation through public CLI, not independent qualification or release packaging proof\'},indent=2)+\'\\n\')\n if failure or remaining or not host_traced:break\nif any(r[\'cleanup_errors\'] for r in rows):raise SystemExit(\'Cleanup or trace evidence incomplete\')\nprint(json.dumps({\'attempts\':len(rows),\'failed_attempts\':sum(r[\'failure\'] is not None for r in rows)}),flush=True)\n')
        (root/'source-controls.py').write_text("from pathlib import Path\nimport hashlib,json,os,shutil,subprocess,sys,time\nworkspace=Path(os.environ['GITHUB_WORKSPACE']);product=workspace/'product';observer=workspace/'observer';root=Path(os.environ['RUNNER_TEMP'])/'source382';root.mkdir()\ntarget=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip();assert target=='aarch64-apple-darwin'\nassert subprocess.check_output(['git','rev-parse','HEAD'],cwd=observer,text=True).strip()=='2836e87c9e251d77cece6385b04b003b5030627f'\nsummary=[]\nfor label,source in [('base','bda8e1e7a2c7905cb9b8537c35aad29e9242cb99'),('candidate','6fa72f37928db40c98de8238d9a39d92d2b21d66')]:\n assert not subprocess.check_output(['git','status','--porcelain'],cwd=product,text=True).strip()\n subprocess.run(['git','switch','--detach',source],cwd=product,check=True)\n actual=subprocess.check_output(['git','rev-parse','HEAD'],cwd=product,text=True).strip();assert actual==source\n env=dict(os.environ,CARGO_TARGET_DIR=str(workspace/'target'))\n command=['cargo','build','--target',target,'--locked','-p','se','--bin','se']\n started=time.monotonic_ns()\n with (root/(label+'-build.log')).open('wb') as log:result=subprocess.run(command,cwd=product,env=env,stdout=log,stderr=subprocess.STDOUT)\n build={'source':source,'native_host':target,'argv':command,'exit':result.returncode,'elapsed_ns':time.monotonic_ns()-started,'compiler':subprocess.check_output(['rustc','-vV'],text=True),'profile':'dev, shipping-default features','run_id':os.environ['GITHUB_RUN_ID'],'publication':os.environ['GITHUB_SHA']}\n (root/(label+'-build.json')).write_text(json.dumps(build,indent=2)+'\\n')\n if result.returncode:raise SystemExit('Native source build failed before execution')\n image=root/(label+'-image')/'se';image.parent.mkdir();shutil.copyfile(workspace/'target'/target/'debug/se',image);image.chmod(0o500)\n digest=hashlib.sha256(image.read_bytes()).hexdigest();build['image_sha256']=digest;(root/(label+'-build.json')).write_text(json.dumps(build,indent=2)+'\\n')\n env.update(MEASURE_SOURCE=source,DIAGNOSTIC_IMAGE=str(image),DIAGNOSTIC_IMAGE_SHA256=digest,DIAGNOSTIC_OUTPUT=str(root/label))\n with (root/(label+'-observe.log')).open('wb') as log:result=subprocess.run([sys.executable,'-B',str(Path(os.environ['RUNNER_TEMP'])/'source-reproduce.py')],cwd=observer,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=900)\n census_path=root/label/'census.json'\n if not census_path.exists():raise SystemExit('No completed source census; no pass claim')\n census=json.loads(census_path.read_text());summary.append({'label':label,'source':source,'observer_exit':result.returncode,'image_sha256':digest,'attempts':len(census['attempts']),'launch_failures':census['failed_attempts'],'all_cleanup_witnessed':census['all_cleanup_witnessed']})\n (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\\n')\n if any(row['remaining'] for row in census['attempts']):raise SystemExit('Owned native processes remain; stop this dependent build path')\n# Build/check all feature combinations separately from shipping-default execution.\nassert subprocess.check_output(['git','rev-parse','HEAD'],cwd=product,text=True).strip()=='6fa72f37928db40c98de8238d9a39d92d2b21d66'\ncommand=['cargo','clippy','--target',target,'--workspace','--all-targets','--all-features','--locked','--','-D','warnings']\nwith (root/'candidate-clippy.log').open('wb') as log:clippy=subprocess.run(command,cwd=product,env=env,stdout=log,stderr=subprocess.STDOUT)\n(root/'candidate-clippy.json').write_text(json.dumps({'argv':command,'exit':clippy.returncode,'source':'6fa72f37928db40c98de8238d9a39d92d2b21d66'},indent=2)+'\\n')\nprint(json.dumps(summary,indent=2),flush=True)\nenv['SE_MACOS_HELPER']=str(root/'candidate-image'/'se')\ncommand=['cargo','nextest','run','--target',target,'--locked','-p','se-proc','--test','macos_process_read_failures','--test','macos_process_reads','--test','macos_controlled_runtime','--profile','ci','--no-fail-fast','--no-tests','fail']\nwith (root/'candidate-reader.log').open('wb') as log:reader=subprocess.run(command,cwd=product,env=env,stdout=log,stderr=subprocess.STDOUT)\n(root/'candidate-reader.json').write_text(json.dumps({'argv':command,'exit':reader.returncode,'source':'6fa72f37928db40c98de8238d9a39d92d2b21d66'},indent=2)+'\\n')\nraise SystemExit(clippy.returncode or reader.returncode or int(summary[-1]['launch_failures']>0 or not summary[-1]['all_cleanup_witnessed']))\n")
    - name: Build and exercise both native source images sequentially
      shell: python
      run: |
        import os,subprocess,sys
        from pathlib import Path
        subprocess.run([sys.executable,'-B',str(Path(os.environ['RUNNER_TEMP'])/'source-controls.py')],check=True,timeout=3200)
    - name: Retain source inputs and complete observations
      if: ${{ always() }}
      shell: python
      run: |
        from pathlib import Path
        import os,shutil
        root=Path(os.environ['RUNNER_TEMP']);out=root/'source382-evidence';out.mkdir()
        for directory,children,files in os.walk(root/'source382'):
         children[:]=[n for n in children if n not in ('fixture','base-image','candidate-image')]
         for name in files:
          p=Path(directory)/name
          if p.suffix in ('.json','.jsonl','.log','.stdout','.stderr') or name=='provider-error.txt':
           q=out/p.relative_to(root/'source382');q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: macos-launch-382-source
        path: ${{ runner.temp }}/source382-evidence
        retention-days: 14
        if-no-files-found: error
  portable:
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 6fa72f37928db40c98de8238d9a39d92d2b21d66
        path: product
        persist-credentials: false
    - uses: ./product/.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: product -> ../target
        shared-key: launch-382-portable-v1
    - name: Strict platform compiler check
      run: |
        target="$(rustc --print host-tuple)"
        cargo clippy --target "$target" --workspace --all-targets --all-features --locked -- -D warnings
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
    - name: Existing native Windows owned-observation controls
      if: ${{ runner.os == 'Windows' }}
      run: |
        target="$(rustc --print host-tuple)"
        cargo nextest run --target "$target" --locked -p se-proc --lib --profile ci --no-tests fail -E "test(owned_observation_tests)"
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: launch-382-portable-${{ matrix.runner }}
        path: target/nextest/ci/junit.xml
        retention-days: 14
        if-no-files-found: warn
