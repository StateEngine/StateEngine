        choices=(\''INFO\'', \''ERROR\''), default=\''INFO\'')\n    args = parser.parse_args()\n    isolated
        = os.environ.get(\''GITHUB_ACTIONS\'') == \''true\'' or (args.container_dev and Path(\''/.dockerenv\'').is_file())\n    assert
        os.geteuid() == 0 and isolated, \''disposable hosted or explicitly selected container administrator
        required\''\n    control = Control(args)\n    try:\n        control.run()\n    except Exception
        as error:\n        control.result[\''failure\''] = repr(error)\n        control.result[\''passed\'']
        = False\n        if getattr(control, \''source\'', None) and control.server and control.server.poll()
        is None:\n            try:\n                digest = control.result[\''image_sha256\'']\n                control.run_command(\''failure-cache-metadata\'',
        control.user_command(control.source, \''ssh\'', \''restricted\'',\n                    \''pwd;
        id -u; stat -c "%u %a %F %n" . .stateengine-runtime .stateengine-runtime/\'' + digest),\n                    timeout=15,
        check=False)\n            except Exception as diagnostic:\n                control.result[\''diagnostic_error\'']
        = repr(diagnostic)\n    finally:\n        control.cleanup()\n    print(json.dumps(control.result,
        indent=2))\n    return 0 if control.result[\''passed\''] else 1\n\n\nif __name__ == \''__main__\'':\n    raise
        SystemExit(main())\n''}

        for name,source in files.items():(r/''observer''/name).write_text(source)

        '
    - name: Build pinned remote-enabled CLI
      shell: python
      run: 'from pathlib import Path

        import subprocess,os,json,time,hashlib

        r=Path(os.environ[''RUNNER_TEMP''])/''pair403'';out=r/''evidence''

        source=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip();assert source==os.environ[''PRODUCT_PIN'']

        assert not subprocess.check_output([''git'',''status'',''--porcelain'',''--untracked-files=no''])

        e=dict(os.environ,CARGO_TARGET_DIR=str(r/''target''),CARGO_PROFILE_DEV_DEBUG=''0'',CARGO_BUILD_JOBS=''2'',CARGO_INCREMENTAL=''0'')

        for key in [''RUSTFLAGS'',''CARGO_ENCODED_RUSTFLAGS'']:e.pop(key,None)

        t=time.monotonic()

        with (out/''build.stdout'').open(''wb'') as stdout,(out/''build.stderr'').open(''wb'') as stderr:code=subprocess.run([''cargo'',''build'',''-p'',''se'',''--bin'',''se'',''--features'',''remote'',''--locked''],env=e,stdout=stdout,stderr=stderr).returncode

        value={''source'':source,''exit'':code,''seconds'':time.monotonic()-t,''profile'':''dev'',''debug'':0,''features'':[''remote''],''rustc'':subprocess.check_output([''rustc'',''-vV''],text=True)}

        if code==0:value[''image_sha256'']=hashlib.sha256((r/''target/debug/se'').read_bytes()).hexdigest()

        (out/''build.json'').write_text(json.dumps(value,indent=2)+''\n'')

        raise SystemExit(code)

        '
    - name: Observe public pairing and preserved refusal
      shell: python
      run: "from pathlib import Path\nimport subprocess,os,json,sys\nr=Path(os.environ['RUNNER_TEMP'])/'pair403';out=r/'evidence';image=r/'target/debug/se';results=[]\n\
        for case in ['fresh','preexisting775']:\n argv=['sudo','-n','env','-i','PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','GITHUB_ACTIONS=true',sys.executable,str(r/'observer/pair_control.py'),'--se',str(image),'--side',os.environ['PRODUCT_ARM'],'--source',os.environ['PRODUCT_PIN'],'--case',case,'--output',str(out/case)]\n\
        \ with (out/(case+'.stdout')).open('wb') as stdout,(out/(case+'.stderr')).open('wb') as stderr:code=subprocess.run(argv,stdout=stdout,stderr=stderr).returncode\n\
        \ results.append({'case':case,'argv':argv,'exit':code})\n(out/'driver-exits.json').write_text(json.dumps(results,indent=2)+'\\\
        n')\nraise SystemExit(0 if all(x['exit']==0 for x in results) else 1)\n"
    - name: Bind all retained evidence
      if: ${{ always() }}
      shell: python
      run: 'from pathlib import Path

        import os,hashlib,json,shutil

        r=Path(os.environ[''RUNNER_TEMP''])/''pair403'';out=r/''evidence''

        assert not any(p.is_symlink() for p in out.rglob(''*''))

        assert not any(p.name in [''server-key'',''id_ed25519'',''credential'',''state.db''] for p in
        out.rglob(''*'')),''private fixture data reached evidence''

        for p in (r/''observer'').glob(''*.py''):shutil.copyfile(p,out/p.name)

        files=[{''file'':p.relative_to(out).as_posix(),''bytes'':p.stat().st_size,''sha256'':hashlib.sha256(p.read_bytes()).hexdigest()}
        for p in sorted(out.rglob(''*'')) if p.is_file() and p.name!=''manifest.json'']

        (out/''manifest.json'').write_text(json.dumps(files,indent=2)+''\n'')

        '
    - name: Retain both successes and refusals
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pair403-${{ matrix.arm }}-r1
        path: ${{ runner.temp }}/pair403/evidence
        if-no-files-found: error
        retention-days: 14
