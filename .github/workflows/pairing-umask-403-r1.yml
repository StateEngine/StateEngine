        = Path(account.pw_dir) / \''.stateengine-runtime\'' / digest / \''se\''\n            try:\n                row,
        out, _ = self.run_command(role + \''-down\'', self.user_command(account, image,\n                                               \''--home\'',
        home, \''--json\'', \''down\''), timeout=60)\n                receipt = json.loads(out)\n                assert
        receipt[\''complete\''] and receipt[\''witness\''][\''state\''] == \''witnessed\''\n                assert
        not (home / \''endpoint.json\'').exists()\n                self.result[\''cleanup\''][role] =
        {\''state\'': \''joined\'', \''receipt\'': receipt}\n            except Exception as error:\n                errors.append(f\''{role}:
        {error}\'')\n        if self.server is not None:\n            identity = observe(self.server.pid)\n            self.result[\''cleanup\''][\''sshd_identity\'']
        = identity\n            try:\n                if self.server.poll() is None:\n                    assert
        identity and identity[\''birth\''] == self.server_birth\n                    assert str(self.output
        / \''sshd_config\'') in \'' \''.join(identity[\''argv\''])\n                    os.kill(self.server.pid,
        signal.SIGTERM)\n                self.result[\''cleanup\''][\''sshd_exit\''] = self.server.wait(timeout=10)\n            except
        Exception as error:\n                errors.append(f\''sshd: {error}\'')\n        if self.server_log:\n            self.server_log.close()\n        deadline
        = time.monotonic() + 10\n        while True:\n            self.reap()\n            remaining =
        self.fixture_processes()\n            if not remaining or time.monotonic() > deadline:\n                break\n            time.sleep(.05)\n        self.result[\''cleanup\''][\''remaining_before_emergency\'']
        = remaining\n        if remaining:\n            errors.append(\''fixture user processes survived
        public shutdown\'')\n        for row in remaining:\n            current = observe(row[\''pid\''])\n            if
        current and current[\''birth\''] == row[\''birth\''] and current[\''argv\''] == row[\''argv\'']
        and current[\''state\''] != \''Z\'':\n                os.kill(row[\''pid\''], signal.SIGKILL)\n        deadline
        = time.monotonic() + 5\n        while self.fixture_processes() and time.monotonic() < deadline:\n            self.reap()\n            time.sleep(.05)\n        self.result[\''cleanup\''][\''remaining\'']
        = self.fixture_processes()\n        self.result[\''cleanup\''][\''errors\''] = errors\n        if
        errors or self.result[\''cleanup\''][\''remaining\'']:\n            self.result[\''passed\'']
        = False\n        else:\n            for account in self.users:\n                self.run_command(\''user-remove\'',
        [\''userdel\'', account.pw_name])\n                shutil.rmtree(account.pw_dir)\n        # Never
        publish the synthetic private SSH keys or whole account profiles.\n        for path in (self.output
        / \''server-key\'', self.output / \''server-key.pub\''):\n            path.unlink(missing_ok=True)\n        (self.output
        / \''result.json\'').write_text(json.dumps(self.result, indent=2) + \''\\n\'')\n        for path
        in self.output.iterdir():\n            if path.is_file():\n                path.chmod(0o644)\n\n\ndef
        main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\''--se\'',
