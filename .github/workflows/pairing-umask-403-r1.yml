name: Public pairing under a group-writable login umask
'on':
  push:
    branches:
    - prime/pairing-umask-403-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        - arm: head
          source: 600d77a181307cbcc4e7dc4a7907235efb5195ce
    env:
      PRODUCT_PIN: ${{ matrix.source }}
      PRODUCT_ARM: ${{ matrix.arm }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: ./.github/actions/rust
    - name: Install native loopback SSH dependency
      run: 'sudo apt-get update

        sudo apt-get install --yes openssh-server

        '
    - name: Stage independent observer
      shell: python
      run: 'from pathlib import Path

        import os

        r=Path(os.environ[''RUNNER_TEMP''])/''pair403''

        (r/''observer'').mkdir(parents=True)

        (r/''evidence'').mkdir()

        files={''pair_control.py'': ''"""Independent public pairing over real SSH in isolated test accounts."""\nimport
        argparse,hashlib,json,os,shlex,socket,subprocess,time,traceback,uuid\nfrom pathlib import Path\nfrom
        ssh_infra import Control,observe\n\nclass Pair(Control):\n def prepare(self):\n  self.source=self.make_user(\''s\'');self.destination=self.make_user(\''d\'')\n  source=self.source;dest=self.destination\n  self.source_home=Path(source.pw_dir)/\''state\'';self.destination_home=Path(dest.pw_dir)/\''.local/state/stateengine\''\n  self.image=Path(source.pw_dir)/\''se\'';self.image.write_bytes(self.args.se.read_bytes());self.own(self.image,source,0o755)\n  self.repo=Path(source.pw_dir)/\''repo\'';self.repo.mkdir();self.own(self.repo,source,0o700)\n  for
        u in self.users:\n   p=Path(u.pw_dir)/\''.ssh\'';p.mkdir();self.own(p,u,0o700)\n  key=Path(source.pw_dir)/\''.ssh/id_ed25519\''\n  self.run_command(\''key-create\'',self.user_command(source,\''ssh-keygen\'',\''-q\'',\''-t\'',\''ed25519\'',\''-N\'',\''\'',\''-f\'',key))\n  authorized=Path(dest.pw_dir)/\''.ssh/authorized_keys\'';authorized.write_text(key.with_suffix(\''.pub\'').read_text());self.own(authorized,dest,0o600)\n  key.chmod(0o600)\n  #
        The key has no forwarding prohibition. The owned server binds only loopback.\n  hostkey=self.output/\''server-key\'';self.run_command(\''server-key\'',[\''ssh-keygen\'',\''-q\'',\''-t\'',\''ed25519\'',\''-N\'',\''\'',\''-f\'',str(hostkey)])\n  with
        socket.socket() as reservation:reservation.bind((\''127.0.0.1\'',0));port=reservation.getsockname()[1]\n  known=Path(source.pw_dir)/\''.ssh/known_hosts\'';known.write_text(f\''[127.0.0.1]:{port}
        \''+hostkey.with_suffix(\''.pub\'').read_text());self.own(known,source,0o600)\n  cfg=Path(source.pw_dir)/\''.ssh/config\'';cfg.write_text(f\''Host
        destination\\n HostName 127.0.0.1\\n Port {port}\\n User {dest.pw_name}\\n IdentityFile {key}\\n
        IdentitiesOnly yes\\n BatchMode yes\\n StrictHostKeyChecking yes\\n UserKnownHostsFile {known}\\n
        GlobalKnownHostsFile /dev/null\\n ControlMaster no\\n ConnectTimeout 5\\n\'');self.own(cfg,source,0o600)\n  force=self.output/\''login-command.sh\'';force.write_text(\''#!/bin/sh\\numask
        002\\nexec /bin/sh -c "$SSH_ORIGINAL_COMMAND"\\n\'');force.chmod(0o755)\n  config=self.output/\''sshd_config\'';config.write_text(f\''Port
        {port}\\nListenAddress 127.0.0.1\\nHostKey {hostkey}\\nPidFile {self.output}/sshd.pid\\nAuthorizedKeysFile
        .ssh/authorized_keys\\nAllowUsers {dest.pw_name}\\nPasswordAuthentication no\\nKbdInteractiveAuthentication
        no\\nPubkeyAuthentication yes\\nUsePAM no\\nPermitRootLogin no\\nStrictModes yes\\nAllowTcpForwarding
        yes\\nDisableForwarding no\\nLogLevel VERBOSE\\nForceCommand {force}\\n\'')\n  Path(\''/run/sshd\'').mkdir(exist_ok=True);self.run_command(\''server-config\'',[\''/usr/sbin/sshd\'',\''-t\'',\''-f\'',str(config)])\n  self.server_log=(self.output/\''sshd.log\'').open(\''wb\'');self.server=subprocess.Popen([\''/usr/sbin/sshd\'',\''-D\'',\''-e\'',\''-f\'',str(config)],stdin=subprocess.DEVNULL,stdout=self.server_log,stderr=subprocess.STDOUT);self.server_birth=observe(self.server.pid)[\''birth\'']\n  until=time.monotonic()+10\n  while
        True:\n   assert self.server.poll() is None,\''sshd exited before readiness\''\n   try:\n    with
        socket.create_connection((\''127.0.0.1\'',port),timeout=.1):break\n   except OSError:\n    if
        time.monotonic()>until:raise TimeoutError(\''owned sshd readiness\'')\n    time.sleep(.05)\n  cache=Path(dest.pw_dir)/\''.stateengine-runtime\''\n  assert
        not cache.exists(),\''fresh test account unexpectedly has a runtime cache\''\n  if self.args.case==\''preexisting775\'':\n   cache.mkdir();self.own(cache,dest,0o775);sentinel=cache/\''preserve.txt\'';sentinel.write_text(\''Existing
        runtime data must survive refusal.\\n\'');self.own(sentinel,dest,0o600);self.sentinel_sha=hashlib.sha256(sentinel.read_bytes()).hexdigest()\n  row,out,_=self.run_command(\''login-probe\'',self.user_command(source,\''ssh\'',\''-T\'',\''destination\'',\''printf
        "shell=%s\\\\n" "$SHELL"; umask; id -u; if test -e .stateengine-runtime; then stat -c "%u %a %F
        %n" .stateengine-runtime; else printf "runtime-cache-absent\\\\n"; fi\''))\n  probe=out.decode();assert
        \''\\n0002\\n\'' in probe or \''\\n002\\n\'' in probe,probe\n  assert (\''runtime-cache-absent\''
        in probe)==(self.args.case==\''fresh\''),probe\n  self.result[\''before_first_product\'']={\''probe\'':probe,\''case\'':self.args.case,\''destination_uid\'':dest.pw_uid}\n
        def run(self):\n  self.prepare()\n  for command in [(\''remote\'',\''--help\''),(\''remote\'',\''add\'',\''--help\''),(\''init\'',\''--help\'')]:self.run_command(\''help\'',self.user_command(self.source,self.image,*command))\n  self.run_command(\''init\'',self.user_command(self.source,self.image,\''--home\'',self.source_home,\''--json\'',\''--key\'',str(uuid.uuid4()),\''init\'',\''--repo\'',self.repo,\''--name\'',\''Pairing
        control\'',\''--agent\'',\''Worker\'',\''--provider\'',\''codex\''),cwd=str(self.repo))\n  row,out,err=self.run_command(\''remote-add\'',self.user_command(self.source,self.image,\''--home\'',self.source_home,\''--json\'',\''remote\'',\''add\'',\''destination\'',\''--name\'',\''peer\''),timeout=150,check=False,cwd=str(self.repo))\n  value=json.loads(out);self.result[\''remote_add\'']=row|{\''response\'':value};self.result[\''progress\'']=err.decode(errors=\''replace\'')\n  cache=Path(self.destination.pw_dir)/\''.stateengine-runtime\'';digest=self.result[\''image_sha256\''];image=cache/digest/\''se\''\n  if
        self.args.case==\''fresh\'':\n   self.result[\''fresh_pairing_success\'']=row[\''exit\'']==0 and
        value.get(\''schema\'')==\''stateengine.remote-control/v1\'' and value.get(\''value\'',{}).get(\''name\'')==\''peer\''\n   self.result[\''cache_modes\'']={str(p.relative_to(cache.parent)):oct(p.stat().st_mode
        & 0o777) for p in [cache,cache/digest] if p.exists()}\n   self.result[\''uploaded_image_sha256\'']=hashlib.sha256(image.read_bytes()).hexdigest()
        if image.is_file() else None\n   assert self.result[\''fresh_pairing_success\''],\''public fresh
        pairing failed\''\n   assert all(v==\''0o700\'' for v in self.result[\''cache_modes\''].values())
        and len(self.result[\''cache_modes\''])==2\n   assert self.result[\''uploaded_image_sha256\'']==digest\n  else:\n   self.result[\''writable_folder_refused\'']=row[\''exit\'']!=0
        and value.get(\''code\'')==\''listener-unavailable\''\n   text=json.dumps(value);self.result[\''named_path_and_remedy\'']=\''.stateengine-runtime\''
        in text and \''chmod go-w\'' in text and \''775\'' in text\n   self.result[\''existing_directory_preserved\'']=(cache.stat().st_mode&0o777)==0o775
        and hashlib.sha256((cache/\''preserve.txt\'').read_bytes()).hexdigest()==self.sentinel_sha and
        not image.exists()\n   assert self.result[\''writable_folder_refused\''] and self.result[\''existing_directory_preserved\'']\n  self.result[\''fixture_exercised\'']=True\n  self.result[\''passed\'']=self.args.case==\''fresh\''
        or self.result[\''named_path_and_remedy\'']\n def cleanup(self):\n  super().cleanup()\n  # Never
        retain private keys or test state in uploaded evidence.\n  for leaf in [\''server-key\'',\''server-key.pub\'']:\n   p=self.output/leaf\n   if
        p.exists():p.unlink()\n\ndef main():\n p=argparse.ArgumentParser();p.add_argument(\''--se\'',required=True,type=Path);p.add_argument(\''--side\'',required=True,choices=[\''base\'',\''head\'']);p.add_argument(\''--source\'',required=True);p.add_argument(\''--output\'',required=True,type=Path);p.add_argument(\''--case\'',required=True,choices=[\''fresh\'',\''preexisting775\'']);p.add_argument(\''--container-dev\'',action=\''store_true\'');p.add_argument(\''--client-log-level\'',default=\''INFO\'');a=p.parse_args()\n
        assert os.geteuid()==0 and (os.environ.get(\''GITHUB_ACTIONS\'')==\''true\'' or a.container_dev
        and Path(\''/.dockerenv\'').exists()),\''disposable hosted runner or explicit development container
        required\''\n c=Pair(a)\n try:c.run()\n except BaseException as e:c.result.update(passed=False,failure={\''type\'':type(e).__name__,\''detail\'':str(e),\''traceback\'':traceback.format_exc()})\n
        finally:c.cleanup();(c.output/\''result.json\'').write_text(json.dumps(c.result,indent=2)+\''\\n\'')\n
        print(json.dumps(c.result,indent=2));return 0 if c.result[\''passed\''] else 1\nif __name__==\''__main__\'':raise
        SystemExit(main())\n'', ''ssh_infra.py'': ''"""Real SSH refusal control. Run only on a disposable
        hosted Linux runner as root."""\nimport argparse\nimport ctypes\nimport hashlib\nimport json\nimport
        os\nfrom pathlib import Path\nimport pwd\nimport shutil\nimport signal\nimport socket\nimport
        subprocess\nimport time\nimport uuid\n\n\ndef observe(pid):\n    try:\n        root = Path(\''/proc\'')
        / str(pid)\n        fields = (root / \''stat\'').read_text().rsplit(\'') \'', 1)[1].split()\n        return
        {\''pid\'': pid, \''birth\'': fields[19], \''state\'': fields[0],\n                \''uid\'':
        root.stat().st_uid,\n                \''argv\'': [os.fsdecode(x) for x in (root / \''cmdline\'').read_bytes().split(b\''\\0\'')
        if x]}\n    except (FileNotFoundError, ProcessLookupError):\n        return None\n\n\nclass Control:\n    def
        __init__(self, args):\n        self.args = args\n        self.output = args.output.resolve()\n        self.output.mkdir(parents=True,
        exist_ok=False)\n        self.suffix = uuid.uuid4().hex[:10]\n        self.users = []\n        self.calls
        = 0\n        self.server = None\n        self.server_log = None\n        self.result = {\''side\'':
        args.side, \''source\'': args.source, \''client_log_level\'': args.client_log_level,\n                       \''image_sha256\'':
        hashlib.sha256(args.se.read_bytes()).hexdigest(),\n                       \''passed\'': False,
        \''cleanup\'': {}}\n        # Detached native children remain joinable by this outside driver.\n        if
        ctypes.CDLL(None, use_errno=True).prctl(36, 1, 0, 0, 0) != 0:\n            raise OSError(ctypes.get_errno(),
        \''cannot establish child subreaper\'')\n\n    def run_command(self, label, argv, timeout=150,
        check=True, cwd=None):\n        self.calls += 1\n        prefix = self.output / f\''{self.calls:02}-{label}\''\n        started
        = time.monotonic()\n        process = subprocess.Popen(argv, cwd=cwd or \''/\'', stdin=subprocess.DEVNULL,\n                                   stdout=subprocess.PIPE,
        stderr=subprocess.PIPE)\n        try:\n            stdout, stderr = process.communicate(timeout=timeout)\n        except
        subprocess.TimeoutExpired:\n            identity = observe(process.pid)\n            if identity
        is None or identity[\''argv\''] != argv:\n                raise RuntimeError(\''cannot prove timed-out
        child identity\'')\n            os.kill(process.pid, signal.SIGKILL)\n            stdout, stderr
        = process.communicate(timeout=10)\n            prefix.with_suffix(\''.stdout\'').write_bytes(stdout)\n            prefix.with_suffix(\''.stderr\'').write_bytes(stderr)\n            raise
        TimeoutError(f\''{label} exceeded {timeout}s\'')\n        prefix.with_suffix(\''.stdout\'').write_bytes(stdout)\n        prefix.with_suffix(\''.stderr\'').write_bytes(stderr)\n        row
        = {\''argv\'': argv, \''exit\'': process.returncode, \''seconds\'': time.monotonic() - started}\n        prefix.with_suffix(\''.json\'').write_text(json.dumps(row,
