        row, stdout.decode(errors=\''replace\''), stderr.decode(errors=\''replace\'')))\n        return
        row, stdout, stderr\n\n    def user_command(self, account, *argv):\n        return [\''runuser\'',
        \''-u\'', account.pw_name, \''--\'', \''env\'', \''-i\'',\n                \''PATH=/usr/local/bin:/usr/bin:/bin\'',
        \''HOME=\'' + account.pw_dir,\n                \''USER=\'' + account.pw_name, \''LOGNAME=\'' +
        account.pw_name,\n                \''LANG=C.UTF-8\'', *map(str, argv)]\n\n    def make_user(self,
        role):\n        name = \''ssh\'' + self.suffix + role\n        profile = Path(\''/home\'') / name\n        self.run_command(\''user-create-\''
        + role,\n                         [\''useradd\'', \''--create-home\'', \''--home-dir\'', str(profile),
        \''--shell\'', \''/bin/sh\'', name])\n        account = pwd.getpwnam(name)\n        self.users.append(account)\n        #
        Unlock the account for key authentication; passwords stay disabled in sshd.\n        self.run_command(\''user-unlock-\''
        + role, [\''passwd\'', \''-d\'', name])\n        profile.chmod(0o700)\n        return account\n\n    def
        own(self, path, account, mode):\n        path.chmod(mode)\n        os.chown(path, account.pw_uid,
        account.pw_gid)\n\n    def fixture_processes(self):\n        uids = {u.pw_uid for u in self.users}\n        rows
        = []\n        for path in Path(\''/proc\'').iterdir():\n            if path.name.isdecimal():\n                row
        = observe(int(path.name))\n                if row and row[\''uid\''] in uids:\n                    rows.append(row)\n        return
        rows\n\n    def reap(self):\n        for row in self.fixture_processes():\n            if row[\''state\'']
        == \''Z\'':\n                try:\n                    os.waitpid(row[\''pid\''], os.WNOHANG)\n                except
        ChildProcessError:\n                    pass\n\n    def prepare(self):\n        source = self.make_user(\''s\'')\n        destination
        = self.make_user(\''d\'')\n        self.source, self.destination = source, destination\n        self.source_home
        = Path(source.pw_dir) / \''state\''\n        self.destination_home = Path(destination.pw_dir)
        / \''.local/state/stateengine\''\n        self.image = Path(source.pw_dir) / \''se\''\n        shutil.copyfile(self.args.se,
        self.image)\n        self.own(self.image, source, 0o755)\n        repo = Path(source.pw_dir) /
        \''repo\''\n        repo.mkdir()\n        self.own(repo, source, 0o700)\n        self.repo = repo\n        for
        user in (source, destination):\n            directory = Path(user.pw_dir) / \''.ssh\''\n            directory.mkdir()\n            self.own(directory,
        user, 0o700)\n        key = Path(source.pw_dir) / \''.ssh/id_ed25519\''\n        self.run_command(\''key-create\'',
        self.user_command(source, \''ssh-keygen\'', \''-q\'', \''-t\'', \''ed25519\'', \''-N\'', \''\'',
        \''-f\'', key))\n        self.own(key, source, 0o600)\n        assert key.stat().st_mode & 0o777
