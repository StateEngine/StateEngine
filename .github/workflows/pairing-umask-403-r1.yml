        [\''/usr/sbin/sshd\'', \''-t\'', \''-f\'', str(server_config)])\n        self.server_log = (self.output
        / \''sshd.log\'').open(\''wb\'')\n        self.server = subprocess.Popen([\''/usr/sbin/sshd\'',
