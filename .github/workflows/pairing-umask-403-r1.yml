        .ssh/authorized_keys\\n\''\n                                 f\''AllowUsers {destination.pw_name}\\nPasswordAuthentication
        no\\n\''\n                                 \''KbdInteractiveAuthentication no\\nPubkeyAuthentication
        yes\\nUsePAM no\\n\''\n                                 \''PermitRootLogin no\\nStrictModes yes\\nAllowTcpForwarding
