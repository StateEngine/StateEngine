name: Native in-process Git library comparison
'on':
  push:
    branches:
    - prime/status-git-gix-389-r1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2025
        - macos-15
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
        components: clippy,rustfmt
    - name: Install process observer
      shell: python
      run: 'import subprocess,sys

        subprocess.run([sys.executable,''-m'',''pip'',''install'',''--disable-pip-version-check'',''psutil==7.0.0''],check=True)

        '
