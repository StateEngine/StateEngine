name: Measure native init publication flushes
'on':
  push:
    branches:
    - prime/init-sync-241-r2
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: dd80c6ba4a8a4a7d5f85faa30631f56fc580ea76
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        path: baseline
        persist-credentials: false
    - uses: ./.github/actions/rust
    - name: Stage frozen external observers
      shell: python
      run: |
        from pathlib import Path
        import base64,os,shutil
        r=Path(os.environ["RUNNER_TEMP"])/"init-sync"
        r.mkdir()
        (r/"evidence").mkdir()
        files={'observe.c': '', 'calibrate.c': '', 'measure_linux.py': '', 'build_both.py': '', 'windows-observer/SyncTrace.csproj': '', 'windows-observer/Program.cs': '', 'windows-observer/packages.lock.json': ''}
        for name,data in files.items():
         p=r/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(data))
         q=r/"evidence"/"observer-source"/name;q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
    - name: Compile native Windows observer before product builds
      if: runner.os == 'Windows'
      shell: python
      run: |
        from pathlib import Path
        import os,subprocess,json,time
        r=Path(os.environ['RUNNER_TEMP'])/'init-sync';out=r/'evidence'
        argv=['dotnet','build','SyncTrace.csproj','--configuration','Release','--output',str(r/'windows-observer-bin')]
        if (r/'windows-observer/packages.lock.json').is_file():argv+=['-p:RestoreLockedMode=true']
        start=time.monotonic()
        with (out/'observer-build.stdout').open('wb') as stdout,(out/'observer-build.stderr').open('wb') as stderr:code=subprocess.run(argv,cwd=r/'windows-observer',stdout=stdout,stderr=stderr).returncode
        (out/'observer-build.json').write_text(json.dumps({'argv':argv,'exit':code,'seconds':time.monotonic()-start},indent=2)+'\n')
        raise SystemExit(code)
    - name: Build both frozen native distribution images
      shell: python
      run: |
        from pathlib import Path
        import os,subprocess
        r=Path(os.environ['RUNNER_TEMP'])/'init-sync'
        raise SystemExit(subprocess.run(['python',str(r/'build_both.py'),'--root',str(r),'--tree',os.environ['GITHUB_WORKSPACE'],'--base','7b23fb01a7e16362c6d6b024e5c1801a32bda8c6','--head','dd80c6ba4a8a4a7d5f85faa30631f56fc580ea76']).returncode)
    - name: Observe alternating fresh Linux public inits
      if: runner.os == 'Linux'
      shell: python
      run: |
        from pathlib import Path
        import os,subprocess
        r=Path(os.environ['RUNNER_TEMP'])/'init-sync'
        raise SystemExit(subprocess.run(['python',str(r/'measure_linux.py'),'--base',str(r/'evidence/base.se'),'--head',str(r/'evidence/head.se'),'--base-sha','7b23fb01a7e16362c6d6b024e5c1801a32bda8c6','--head-sha','dd80c6ba4a8a4a7d5f85faa30631f56fc580ea76','--out',str(r/'evidence/results'),'--scratch',str(r/'homes'),'--pairs','50']).returncode)
    - name: Observe alternating fresh Windows public inits
      if: runner.os == 'Windows'
      shell: python
      run: |
        from pathlib import Path
        import os,subprocess
        r=Path(os.environ['RUNNER_TEMP'])/'init-sync'
        raise SystemExit(subprocess.run(['dotnet',str(r/'windows-observer-bin/SyncTrace.dll'),str(r/'evidence/results'),str(r/'homes'),str(r/'evidence/base.exe'),str(r/'evidence/head.exe'),'50']).returncode)
    - name: Hash retained evidence
      if: ${{ always() }}
      shell: python
      run: |
        from pathlib import Path
        import os,json,hashlib
        r=Path(os.environ['RUNNER_TEMP'])/'init-sync/evidence'
        def sha(p):
         with p.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
        if r.is_dir():
         files=[{'file':p.relative_to(r).as_posix(),'bytes':p.stat().st_size,'sha256':sha(p)} for p in sorted(r.rglob('*')) if p.is_file() and p.name!='artifact-manifest.json']
         (r/'artifact-manifest.json').write_text(json.dumps(files,indent=2)+'\n')
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: init-sync-${{ matrix.os }}-r2
        path: ${{ runner.temp }}/init-sync/evidence
        retention-days: 2
        compression-level: 0
        if-no-files-found: error
