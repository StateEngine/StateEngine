name: Unix startup author checks
on:
  push:
    branches: [prime/startup-unix-author-r1]
permissions:
  contents: read
concurrency:
  group: startup-unix-author-r1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  author:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ba7fc8e3b024b1f87420700115162a88ed9fc550
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Read compiler and verify frozen source
        id: compiler
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source != 'ba7fc8e3b024b1f87420700115162a88ed9fc550':
              raise ValueError('Frozen source differs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]}\n')
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: clippy, rustfmt
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: ${{ runner.os == 'Windows' }}
        with: {arch: amd64}
      - name: Run author checks and retain every outcome
        shell: python
        run: |
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'author-checks'
          output.mkdir()
          target = subprocess.check_output(['rustc', '--print', 'host-tuple'], text=True).strip()
          commands = {
              'fmt': ['cargo', 'fmt', '--all', '--', '--check'],
              'clippy': ['cargo', 'clippy', '--target', target, '--workspace', '--all-targets', '--all-features', '--locked', '--', '-D', 'warnings'],
              'image-cache': ['cargo', 'test', '--target', target, '--all-features', '--locked', '--no-fail-fast', '-p', 'se-proc', '--test', 'image_cache', '--test', 'image_cache_upgrade', '--', '--show-output'],
              'docs': ['cargo', 'test', '--target', target, '--workspace', '--all-features', '--locked', '--doc'],
          }
          receipt = {'source': 'ba7fc8e3b024b1f87420700115162a88ed9fc550', 'target': target, 'commands': {}}
          for label, argv in commands.items():
              with (output / (label + '.log')).open('wb') as log:
                  result = subprocess.run(argv, stdout=log, stderr=subprocess.STDOUT, timeout=3600)
              receipt['commands'][label] = {'argv': argv, 'exit': result.returncode}
              (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          if any(r['exit'] for r in receipt['commands'].values()):
              raise ValueError('Author checks retain a failed outcome')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: startup-unix-author-r1-${{ matrix.runner }}
          path: ${{ runner.temp }}/author-checks
          if-no-files-found: error
          retention-days: 14
