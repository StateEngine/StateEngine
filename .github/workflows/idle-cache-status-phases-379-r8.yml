        ids={host} if host is not None else set();changed=True\n while changed:\n  before=len(ids);ids.update(x[''pid'']
        for x in rows if x[''ppid''] in ids);changed=len(ids)!=before\n selected=[];uncertain=[]\n for row in rows:\n  same_image=row[''image'']
        is not None and os.path.normcase(os.path.realpath(row[''image'']))==os.path.normcase(str(image))\n  same_name=row[''name'']
        is not None and os.path.normcase(row[''name''])==os.path.normcase(image.name)\n  if row[''pid''] in ids
