name: Native remaining fresh-status phase breakdown
'on':
  push:
    branches:
    - prime/idle-cache-status-phases-379-r8
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 2f84f80355c4854af56010e7a25fa2fdf43c3cf5
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: 'import os,tomllib

        from pathlib import Path

        channel=tomllib.loads(Path(''rust-toolchain.toml'').read_text())[''toolchain''][''channel'']

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as out:print(''channel=''+channel,file=out)

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Install pinned process observer
      shell: python
      run: 'import subprocess,sys

        subprocess.run([sys.executable,''-m'',''pip'',''install'',''--disable-pip-version-check'',''psutil==7.0.0''],check=True)

        '
    - name: Build diagnostic image and isolate remaining status costs
