name: Session runner author cost r1
on:
  workflow_dispatch:
  push:
    branches: [prime/session-runner-cost-r1]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: session-runner-cost-r1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-cost:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PRODUCER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PRODUCER_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 183e0ba9d622921bb0b12003b2161c204fc57a33
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Install isolated observer dependency
        run: python -m pip install psutil==7.0.0
      - name: Restore sealed measurement sources
        shell: python
        run: |
          import base64,hashlib,json
          from pathlib import Path
          root=Path('.runner-cost')
          root.mkdir(exist_ok=True)
          payload={'runner_cost.rs': '', 'provider.rs': '', 'measure.py': '', 'produce.py': ''}
          expected={'runner_cost.rs': '9fc0f15a914149c44eb22803f56c191b19532fe99f3cde61997a7cb401e2a253', 'provider.rs': '7e16cd99d89decc10200136829f2f6c8817d078040b19af178c1e03c048afbb1', 'measure.py': '634c855d930afbf24cf399a2a0ef1667ce171a5bd0d8c0b5f0f7f21990257f20', 'produce.py': 'ccc642b2c4031828af73eb2063bce667cdb9fd3f8ed3c456d28b3b226b69ef55'}
          for name,encoded in payload.items():
              data=base64.b64decode(encoded,validate=True)
              if hashlib.sha256(data).hexdigest()!=expected[name]: raise RuntimeError('input digest mismatch')
              (root/name).write_bytes(data)
      - name: Build shipping image and observe author costs
        run: python -B .runner-cost/produce.py
      - name: Retain complete native evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: session-runner-cost-r1-${{ matrix.os }}
          path: runner-cost-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
