name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  # Keep debug assertions, but omit symbols to fit private runners and artifacts.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes (unresolved diffs run everything)
        id: detect
        run: python scripts/ci/changes.py

  fmt:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo fmt --all -- --check
      - name: Exercise CI routing and final status
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v

  clippy:
    needs: [changes, fmt]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.fmt.result == 'success' }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: hosted-debug-v1
      - name: Strict Clippy (native target, including Windows MSVC)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'Compile cache hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  archive:
    needs: [changes, fmt, clippy]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.clippy.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: hosted-debug-v1
      - name: Compile once per platform, including custom harness executables
        run: |
          target_args=()
          # Match Windows Clippy's native build layout for cache reuse.
          if [[ "$RUNNER_OS" != Windows ]]; then
            target_args=(--target "$(rustc --print host-tuple)")
          fi
          # Test the shipping defaults; all-feature linked-product judges need SE Code's native fixtures.
          cargo nextest archive "${target_args[@]}" --workspace --locked --archive-file tests.tar.zst
      - name: Check documentation examples and compile-fail API boundaries
        if: matrix.os == 'ubuntu-24.04'
        run: |
          target="$(rustc --print host-tuple)"
          cargo test --target "$target" --workspace --locked --doc
      - uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: tests.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'Compile cache hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: [changes, fmt, clippy, archive]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.fmt.result == 'success' && needs.clippy.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/test
        with:
          os: ${{ matrix.os }}
          shard: ${{ matrix.shard }}
          mode: ${{ matrix.os == 'windows-2025' && 'smoke' || 'full' }}

  # Full Windows runtime checks stay visible; the native VM remains required for
  # runtime/process/install changes until its Actions-runner follow-up is qualified.
  windows-runtime:
    name: Windows runtime (informational, shard ${{ matrix.shard }})
    needs: [changes, fmt, clippy, archive]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.fmt.result == 'success' && needs.clippy.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/test
        with:
          os: windows-2025
          shard: ${{ matrix.shard }}

  # macOS promotion remains open until the full-feature workspace compiles there.
  # Preserve its real failure in the run without adding it to required check's needs.
  macos:
    name: macOS portability (informational)
    needs: [changes, fmt, clippy]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.clippy.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: hosted-debug-v1
      - name: Compile full-feature macOS workspace (promotion pending)
        run: |
          target="$(rustc --print host-tuple)"
          cargo test --target "$target" --workspace --all-features --locked --no-run
      - name: Preserve native macOS compiler loader diagnostics after a build failure
        if: ${{ failure() }}
        run: |
          target="$(rustc --print host-tuple)"
          RUSTC_LOG=rustc_metadata::locator=info cargo test --target "$target" -p se-types --locked --no-run -vv
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'Compile cache hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  # Only this status is required: Linux/Windows failures and cancellations remain red.
  check:
    name: check
    if: ${{ always() }}
    needs: [changes, fmt, clippy, archive, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require all applicable jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci/check.py
