name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: Run the full workflow or only native macOS compilation
        type: choice
        default: all
        options: [all, macos]
      target_ref:
        description: Source branch, tag or SHA for macOS (empty uses the workflow ref)
        type: string
        default: ''
      nextest_filter:
        description: Optional nextest filter for native macOS judges after compilation
        type: string
        default: ''
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  # Keep debug assertions, but omit symbols to fit private runners and artifacts.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

defaults:
  run:
    shell: bash

jobs:
  changes:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.job != 'macos' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      windows: ${{ steps.detect.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Candidate policy cannot exempt its own checks.
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes (unresolved diffs run everything)
        id: detect
        run: python -I scripts/ci/changes.py

  linux-route:
    permissions:
      actions: read
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - name: Select an available Linux runner
        id: route
        uses: actions/github-script@v7
        env:
          BOX_ENABLED: ${{ vars.LINUX_CI_RUNNER != '' }}
        with:
          script: |
            let route = 'hosted';
            const pr = context.payload.pull_request;
            if (process.env.BOX_ENABLED === 'true' && context.eventName === 'pull_request'
                && pr?.draft === false && pr.head.repo.full_name === process.env.GITHUB_REPOSITORY
                && Number(process.env.GITHUB_RUN_ATTEMPT) === 1) {
              try {
                const repo = context.repo;
                const options = {headers: {'X-GitHub-Api-Version': '2026-03-10'}, request: {timeout: 10000}};
                const {data: active} = await github.request('GET /repos/{owner}/{repo}/actions/concurrency_groups', {
                  ...repo, ...options, per_page: 100
                });
                if (active.total_count !== active.concurrency_groups.length) {
                  throw new Error('Active workflow observation is incomplete');
                }
                const groups = active.concurrency_groups.filter(g => g.group_name.startsWith('ci-'));
                const members = await Promise.all(groups.map(async group => {
                  try {
                    const {data} = await github.request('GET /repos/{owner}/{repo}/actions/concurrency_groups/{group}', {
                      ...repo, ...options, group: group.group_name
                    });
                    if (data.total_count !== data.group_members.length) throw new Error('Incomplete group');
                    return data.group_members;
                  } catch (error) {
                    if (error.status === 404) return []; // The workflow released its group.
                    throw error;
                  }
                }));
                const runs = [...new Set(members.flat().map(m => m.run_id))];
                if (!runs.includes(context.runId)) throw new Error('Current workflow lease is absent');
                const peers = runs.filter(id => id !== context.runId);
                const released = await Promise.all(peers.map(async id => {
                  const {data} = await github.rest.actions.listJobsForWorkflowRun({
                    ...repo, run_id: id, filter: 'latest', per_page: 100,
                    request: {timeout: 10000}
                  });
                  if (data.total_count > 100) return false;
                  const box = data.jobs.filter(j => j.name === 'linux-box');
                  // A route still running, or awaiting box-job creation, is a
                  // potential holder too. Concurrent decisions both overflow.
                  return box.length === 1 && box[0].status === 'completed';
                }));
                if (released.every(Boolean)) route = 'box';
              } catch {
                core.warning('Runner availability is unknown; using hosted Linux checks');
              }
            }
            core.setOutput('route', route);

  linux-box:
    needs: [changes, linux-route]
    if: ${{ !cancelled() && needs.linux-route.result == 'success' && needs.linux-route.outputs.route == 'box' }}
    runs-on: ${{ fromJSON(vars.LINUX_CI_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: stateengine-ci-approved
      env:
        CI_SOURCE_TOKEN: ${{ github.token }}
    timeout-minutes: 60
    outputs:
      status: ${{ steps.box.outputs.status }}
    steps:
      - name: Run the full Linux chain in isolated containers
        id: box
        run: stateengine-ci linux

  fmt:
    needs: [changes, linux-route, linux-box]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.rust != 'false' && (needs.linux-route.outputs.route == 'hosted' || (needs.linux-route.outputs.route == '' && needs.linux-route.result == 'failure') || (needs.linux-route.outputs.route == 'box' && (needs.linux-box.outputs.status == 'unavailable' || (needs.linux-box.result == 'failure' && needs.linux-box.outputs.status != 'failed')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo fmt --all -- --check
      - name: Exercise CI routing and final status
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v

  clippy:
    needs: [changes, fmt]
    if: ${{ always() && !cancelled() && needs.changes.outputs.rust != 'false' && needs.fmt.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: hosted-debug-v1
      - name: Strict Linux Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'Clippy cache exact hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  windows-clippy:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.rust != 'false' && needs.changes.outputs.windows != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: hosted-debug-v1
      - name: Strict Windows MSVC Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'Clippy cache exact hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  archive:
    needs: [changes, fmt]
    if: ${{ always() && !cancelled() && needs.changes.outputs.rust != 'false' && needs.fmt.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: hosted-linux-archive-v1
          cache-workspace-crates: true
      - name: Compile once per platform, including custom harness executables
        run: |
          target="$(rustc --print host-tuple)"
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends strace
          fi
          mkdir -p target/cargo-timings
          # Test the shipping defaults; all-feature linked-product judges need SE Code's native fixtures.
          # Process-only tracing measures native linker lifetimes without changing compiler flags.
          strace -f -qq -ttt -s 4096 -e trace=execve,execveat,exit_group \
            -o target/cargo-timings/linker-processes.trace \
            cargo nextest archive --timings --target "$target" --workspace --locked --archive-file tests.tar.zst
      - name: Retain compilation and linker timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-timings
          path: target/cargo-timings/
          retention-days: 1
          if-no-files-found: warn
      - name: Check documentation examples and compile-fail API boundaries
        run: |
          target="$(rustc --print host-tuple)"
          cargo test --target "$target" --workspace --locked --doc
      - uses: actions/upload-artifact@v4
        with:
          name: tests-ubuntu-24.04
          path: tests.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'Linux archive cache exact hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: archive
    if: ${{ always() && !cancelled() && needs.archive.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/test
        with:
          os: ubuntu-24.04
          shard: ${{ matrix.shard }}

  # Nightly and manual only: every pull request already runs Windows-target Clippy.
  # The nightly run on main also warms the native Windows build cache.
  windows-archive:
    name: Windows archive (informational)
    needs: [changes, windows-clippy]
    if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.rust != 'false' && needs.changes.outputs.windows != 'false' && needs.windows-clippy.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-archive-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/actions/rust/action.yml', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: windows-archive-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/actions/rust/action.yml', '.github/workflows/ci.yml') }}-
      - name: Compile native Windows shipping-default archive
        # Match Clippy's native Windows layout; macOS alone needs host/target flag isolation.
        run: cargo nextest archive --workspace --locked --archive-file tests.tar.zst
      - uses: actions/cache/save@v4
        if: ${{ github.event_name == 'schedule' && steps.build-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: tests-windows-2025
          path: tests.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Windows build-cache observation
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          echo "Windows build cache exact hit = ${CACHE_HIT:-not reported}" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows build cache restored key = ${CACHE_MATCH:-not reported}" >> "$GITHUB_STEP_SUMMARY"

  # Every Windows test remains visible but non-required; runtime/process/install
  # changes still require native VM qualification before merge.
  windows-test:
    name: Windows ${{ matrix.mode == 'full' && 'runtime' || 'smoke' }} (informational, shard ${{ matrix.shard }})
    needs: [changes, windows-clippy, windows-archive]
    if: ${{ always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.rust != 'false' && needs.changes.outputs.windows != 'false' && needs.windows-clippy.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        # Hosted runners keep every step in a Windows job, so runtime detachment is qualified
        # in the VM; the hosted runtime run is manual and diagnostic only.
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["smoke", "full"]' || '["smoke"]') }}
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/test
        with:
          os: windows-2025
          shard: ${{ matrix.shard }}
          mode: ${{ matrix.mode }}

  # macOS promotion remains open until the full-feature workspace compiles there.
  # Dispatch from main with job=macos and target_ref to test branches with older workflows.
  macos:
    name: macOS portability (informational)
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: hosted-macos-compile-v1
      - name: Compile full-feature macOS workspace (promotion pending)
        run: |
          target="$(rustc --print host-tuple)"
          cargo test --target "$target" --workspace --all-features --locked --no-run
      - name: Preserve native macOS compiler loader diagnostics after a build failure
        if: ${{ failure() }}
        run: |
          target="$(rustc --print host-tuple)"
          RUSTC_LOG=rustc_metadata::locator=info cargo test --target "$target" -p se-types --locked --no-run -vv
      - name: Run requested native macOS judges
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.nextest_filter != '' }}
        timeout-minutes: 3
        env:
          NEXTEST_FILTER: ${{ inputs.nextest_filter }}
        run: |
          target="$(rustc --print host-tuple)"
          cargo nextest run --target "$target" --workspace --all-features --locked \
            --profile ci --no-tests fail -E "$NEXTEST_FILTER"
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'macOS compile cache exact hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  # Required: strict Clippy (Windows too when the diff can affect it) and Linux archive/tests.
  check:
    name: check
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.job == 'macos') }}
    needs: [changes, linux-route, linux-box, fmt, clippy, windows-clippy, archive, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          # The candidate cannot replace the final consumer of job outcomes.
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - name: Require all applicable jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -I scripts/ci/check.py
