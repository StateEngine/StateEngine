name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # The merge queue runs the full suite on the exact tree main receives, so a push to
  # main repeats only lint and refreshes caches that pull requests restore.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: Run the full workflow or only native macOS compilation
        type: choice
        default: all
        options: [all, macos]
      target_ref:
        description: Source branch, tag or SHA for macOS (empty uses the workflow ref)
        type: string
        default: ''
      nextest_filter:
        description: Optional nextest filter for native macOS judges after compilation
        type: string
        default: ''
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Hosted Linux and Windows runners have 4 vCPUs; macOS jobs override to 3.
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  # Keep debug assertions, but omit symbols to fit private runners and artifacts.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

defaults:
  run:
    shell: bash

jobs:
  changes:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.job != 'macos') && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      windows: ${{ steps.detect.outputs.windows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Candidate policy cannot exempt its own checks.
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes (unresolved diffs run everything)
        id: detect
        run: python -I scripts/ci/changes.py

  linux-route:
    permissions: {}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - name: Select the configured Linux runner
        id: route
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BOX_ENABLED: ${{ vars.LINUX_CI_RUNNER != '' }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const sameOrigin = context.eventName !== 'pull_request' ||
              (pr?.head?.repo?.full_name === process.env.GITHUB_REPOSITORY && pr.head.repo.fork === false);
            const route = process.env.BOX_ENABLED === 'true' && sameOrigin ? 'box' : 'hosted';
            if (route === 'box') {
              core.info('Box selected: busy work queues here; GitHub expires an unstarted job after 24 hours.');
            } else {
              core.info('Hosted selected: box disabled by maintainer or source is from a fork.');
            }
            core.setOutput('route', route);

  linux-box:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    needs: [changes, linux-route]
    if: ${{ !cancelled() && needs.linux-route.result == 'success' && needs.linux-route.outputs.route == 'box' }}
    runs-on: ${{ fromJSON(vars.LINUX_CI_RUNNER || '"ubuntu-24.04"') }}
    container:
      image: stateengine-ci-approved
      env:
        CI_SOURCE_TOKEN: ${{ github.token }}
    timeout-minutes: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 100 || 60 }}
    outputs:
      status: ${{ steps.box.outputs.status }}
      windows: ${{ steps.box.outputs.windows }}
    steps:
      - name: Run Linux checks and Windows-target Clippy in one isolated container
        id: box
        run: stateengine-ci linux

  fmt:
    needs: [changes, linux-route, linux-box]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.rust != 'false' && (needs.linux-route.outputs.route == 'hosted' || (needs.linux-route.outputs.route == '' && needs.linux-route.result == 'failure') || (needs.linux-route.outputs.route == 'box' && (needs.linux-box.outputs.status == 'unavailable' || (needs.linux-box.result == 'failure' && needs.linux-box.outputs.status != 'failed')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo fmt --all -- --check
      - name: Exercise CI routing and final status
        run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v

  clippy:
    needs: [changes, fmt]
    if: ${{ always() && !cancelled() && needs.changes.outputs.rust != 'false' && needs.fmt.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: cache
        with:
          shared-key: hosted-debug-v1
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Strict Linux Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Minimal host Clippy
        run: cargo clippy -p se-host --no-default-features --locked -- -D warnings
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'Clippy cache exact hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  windows-clippy:
    needs: [changes, linux-route, linux-box]
    if: ${{ always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.rust != 'false' && needs.changes.outputs.windows != 'false' && needs.linux-box.outputs.status != 'failed' && !(needs.linux-route.outputs.route == 'box' && needs.linux-route.result == 'success' && needs.linux-box.result == 'success' && needs.linux-box.outputs.status == 'passed' && needs.linux-box.outputs.windows == 'passed') }}
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: cache
        with:
          shared-key: hosted-debug-v1
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Strict Windows MSVC Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'Clippy cache exact hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  atlas-worker:
    needs: [changes, fmt]
    if: ${{ always() && !cancelled() && github.event_name != 'push' && needs.changes.outputs.rust != 'false' && needs.fmt.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The native parser's address cap also applies while loading this image.
      # Build the real CLI separately; a debug test image cannot fit that cap.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: s
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: hosted-atlas-worker-release-s-v1
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Build the compact native worker input without LTO
        run: |
          target="$(rustc --print host-tuple)"
          mkdir -p .atlas-worker
          started="$SECONDS"
          cargo build --target "$target" --release --package se --bin se --no-default-features --features remote --locked
          echo "Worker build wall time = $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"
          cp "target/$target/release/se" .atlas-worker/se
          git rev-parse HEAD > .atlas-worker/source.txt
          sha256sum .atlas-worker/se > .atlas-worker/sha256.txt
      - name: Verify startup under the unchanged native address cap
        run: |
          python3 -I - <<'PY_STARTUP'
          from pathlib import Path
          import resource, subprocess
          image = Path('.atlas-worker/se').resolve(strict=True)
          def limits():
              resource.setrlimit(resource.RLIMIT_AS, (96_000_000, 96_000_000))
          result = subprocess.run([str(image), '--help'], preexec_fn=limits,
                                  capture_output=True, timeout=10, check=True)
          if not result.stdout:
              raise RuntimeError('compact worker produced no help output')
          print(f'Worker image: {image.stat().st_size} bytes; startup fits 96000000-byte address cap')
          PY_STARTUP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-worker-linux
          path: .atlas-worker/
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  archive:
    needs: [changes, fmt]
    if: ${{ always() && !cancelled() && needs.changes.outputs.rust != 'false' && needs.fmt.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The hosted image ships toolchains this job never uses; without them the
      # workspace archive fits. Free space is printed so growth stays visible.
      - name: Free hosted runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: cache
        with:
          shared-key: hosted-linux-archive-v1
          cache-workspace-crates: true
          save-if: ${{ github.event_name != 'merge_group' }}
      # Main pushes compile only to seed a missing default-feature cache entry; an exact
      # hit is never re-saved, and the nightly archive builds all features instead.
      - name: Compile once per platform, including custom harness executables
        id: compile
        if: ${{ github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true' }}
        run: |
          target="$(rustc --print host-tuple)"
          if ! command -v strace >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends strace
          fi
          mkdir -p target/cargo-timings
          # PRs retain default features; scheduled/manual main runs cover all features.
          # Process-only tracing measures native linker lifetimes without changing compiler flags.
          strace -f -qq -ttt -s 4096 -e trace=execve,execveat,exit_group \
            -o target/cargo-timings/linker-processes.trace \
            cargo nextest archive --timings --target "$target" --workspace ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--all-features' || '' }} --locked --archive-file tests.tar.zst
      - name: Retain compilation and linker timings
        if: ${{ always() && steps.compile.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-build-timings
          path: target/cargo-timings/
          retention-days: 1
          if-no-files-found: warn
      - name: Check documentation examples and compile-fail API boundaries
        if: ${{ github.event_name != 'push' }}
        run: |
          target="$(rustc --print host-tuple)"
          cargo test --target "$target" --workspace ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--all-features' || '' }} --locked --doc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ github.event_name != 'push' }}
        with:
          name: tests-ubuntu-24.04
          path: tests.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'Linux archive cache exact hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: [archive, atlas-worker]
    if: ${{ always() && !cancelled() && github.event_name != 'push' && needs.archive.result == 'success' && needs.atlas-worker.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SE_ATLAS_WORKER_BIN: ${{ github.workspace }}/.atlas-worker/se
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: atlas-worker-linux
          path: .atlas-worker
      - name: Prepare the required native worker input
        run: |
          test -s "$SE_ATLAS_WORKER_BIN"
          test "$(cat .atlas-worker/source.txt)" = "$(git rev-parse HEAD)"
          sha256sum --check .atlas-worker/sha256.txt
          chmod 700 "$SE_ATLAS_WORKER_BIN"
      - uses: ./.github/actions/test
        with:
          os: ubuntu-24.04
          shard: ${{ matrix.shard }}
          all-features: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}

  # Nightly and manual only: every pull request already runs Windows-target Clippy.
  # The nightly run on main also warms the native Windows build cache.
  windows-archive:
    name: Windows archive
    needs: [changes, linux-box, windows-clippy]
    if: ${{ always() && !cancelled() && github.event_name != 'push' && needs.changes.outputs.rust != 'false' && needs.changes.outputs.windows != 'false' && (needs.windows-clippy.result == 'success' || (needs.windows-clippy.result == 'skipped' && needs.linux-box.outputs.status == 'passed' && needs.linux-box.outputs.windows == 'passed')) }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-archive-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/actions/rust/action.yml', '.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: windows-archive-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/actions/rust/action.yml', '.github/workflows/ci.yml') }}-
      - name: Compile native Windows shipping-default archive
        # Match Clippy's native Windows layout; macOS alone needs host/target flag isolation.
        run: cargo nextest archive --workspace --locked --archive-file tests.tar.zst
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ github.event_name == 'schedule' && steps.build-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-windows-2025
          path: tests.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Windows build-cache observation
        if: ${{ always() }}
        env:
          CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: |
          echo "Windows build cache exact hit = ${CACHE_HIT:-not reported}" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows build cache restored key = ${CACHE_MATCH:-not reported}" >> "$GITHUB_STEP_SUMMARY"

  # Windows tests run on every pull request and are required by check wherever they apply;
  # runtime/process/install changes still require native VM qualification before merge.
  windows-test:
    name: Windows ${{ matrix.mode == 'full' && 'runtime' || 'smoke' }} (shard ${{ matrix.shard }})
    needs: [changes, linux-box, windows-clippy, windows-archive]
    if: ${{ always() && !cancelled() && github.event_name != 'push' && needs.changes.outputs.rust != 'false' && needs.changes.outputs.windows != 'false' && (needs.windows-clippy.result == 'success' || (needs.windows-clippy.result == 'skipped' && needs.linux-box.outputs.status == 'passed' && needs.linux-box.outputs.windows == 'passed')) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        # Pull requests run the smoke set. The merge queue and the nightly run the whole
        # Windows suite; detachment is also qualified in the VM.
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["smoke", "full"]' || (github.event_name == 'merge_group' || github.event_name == 'schedule') && '["full"]' || '["smoke"]') }}
    runs-on: windows-2025
    timeout-minutes: ${{ matrix.mode == 'full' && 40 || 6 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/test
        with:
          os: windows-2025
          shard: ${{ matrix.shard }}
          mode: ${{ matrix.mode }}

  # macOS promotion remains open until the full-feature workspace compiles there.
  # Dispatch from main with job=macos and target_ref to test branches with older workflows.
  macos:
    name: macOS portability (informational)
    if: ${{ !cancelled() && github.event_name != 'push' && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        id: cache
        with:
          shared-key: hosted-macos-compile-v1
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Compile full-feature macOS workspace (promotion pending)
        run: |
          target="$(rustc --print host-tuple)"
          cargo test --target "$target" --workspace --all-features --locked --no-run
      - name: Preserve native macOS compiler loader diagnostics after a build failure
        if: ${{ failure() }}
        run: |
          target="$(rustc --print host-tuple)"
          RUSTC_LOG=rustc_metadata::locator=info cargo test --target "$target" -p se-types --locked --no-run -vv
      - name: Run requested native macOS judges
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.nextest_filter != '' }}
        timeout-minutes: 3
        env:
          NEXTEST_FILTER: ${{ inputs.nextest_filter }}
        run: |
          target="$(rustc --print host-tuple)"
          cargo nextest run --target "$target" --workspace --all-features --locked \
            --profile ci --no-tests fail -E "$NEXTEST_FILTER"
      - name: Strict macOS Clippy
        run: |
          target="$(rustc --print host-tuple)"
          cargo clippy --target "$target" --workspace --all-targets --all-features --locked -- -D warnings
      - name: Cache observation
        if: ${{ always() }}
        run: echo 'macOS compile cache exact hit = ${{ steps.cache.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"

  macos-test:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.result == 'success' && needs.changes.outputs.rust != 'false' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: hosted-macos-tests-v1
          save-if: ${{ github.event_name != 'merge_group' }}
      - name: Register the disposable runner account
        run: |
          identity="$(id -u)"
          profile="$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.geteuid()).pw_dir)')"
          sudo python3 scripts/ci/installation_account.py provision --identity "$identity" --profile "$profile"
          python3 scripts/ci/installation_account.py check
      - name: Compile native macOS shipping-default archive
        id: archive
        run: |
          # Explicit target keeps target linker flags off host compiler plugins.
          target="$(rustc --print host-tuple)"
          cargo nextest archive --target "$target" --workspace --locked --archive-file tests.tar.zst
      - name: Run every ordinary shipping-default case
        run: |
          filter="$(python3 scripts/ci/custom.py filter)"
          cargo nextest run --archive-file tests.tar.zst --extract-to . --extract-overwrite \
            --workspace-remap "$PWD" --profile ci --no-fail-fast --no-tests fail -E "$filter"
      - name: Run every custom harness after ordinary execution
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        run: python3 scripts/ci/custom.py run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: results-macos-15
          path: |
            target/nextest/ci/junit.xml
            ci-reports/input-judges.json
          retention-days: 3
          if-no-files-found: warn

  remote-test:
    needs: [changes, atlas-worker]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.result == 'success' && needs.changes.outputs.rust != 'false' && needs.atlas-worker.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SE_ATLAS_WORKER_BIN: ${{ github.workspace }}/.atlas-worker/se
    steps:
      # Only the proved Rust exemption, or a main push after the merge queue, skips these tests.
      - name: Check out the remote test source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: hosted-remote-tests-v1
          save-if: ${{ github.event_name != 'merge_group' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: atlas-worker-linux
          path: .atlas-worker
      - name: Prepare the required native worker input
        run: |
          test -s "$SE_ATLAS_WORKER_BIN"
          test "$(cat .atlas-worker/source.txt)" = "$(git rev-parse HEAD)"
          sha256sum --check .atlas-worker/sha256.txt
          chmod 700 "$SE_ATLAS_WORKER_BIN"
      - name: Run host and remote tests with the remote feature
        run: |
          started=$SECONDS
          trap 'code=$?; echo "Remote feature compile and tests: $((SECONDS - started)) seconds (exit $code)" >> "$GITHUB_STEP_SUMMARY"' EXIT
          target="$(rustc --print host-tuple)"
          filter="$(python3 scripts/ci/custom.py filter)"
          cargo nextest run --target "$target" -p se-host -p se-remote --features remote --locked --profile ci -E "$filter"
      - name: Judge authenticated runtime status
        run: python3 scripts/ci/runtime_status.py
      # A real stock Codex launch after se init, against a loopback model: no secret needed.
      - name: Judge stock Codex after se init
        run: |
          target="$(rustc --print host-tuple)"
          cargo build --target "$target" -p se --bin se --locked
          mkdir -p ci-reports/stock-codex-init
          python3 -B scripts/ci/stock_codex_init.py --loopback --se "target/$target/debug/se" --output ci-reports/stock-codex-init/receipt.json
      - name: Retain runtime status judge evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-status-judge
          path: |
            ci-reports/runtime-status
            ci-reports/stock-codex-init
          retention-days: 3
          if-no-files-found: warn

  # Required: strict Clippy (Windows too when the diff can affect it) and Linux archive/tests.
  # Main pushes report under another name, so `check` on a main commit (which releases
  # require) always means the merge queue or nightly ran the full suite on that tree.
  check:
    name: ${{ github.event_name == 'push' && 'main guard' || 'check' }}
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.job == 'macos') && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    needs: [changes, linux-route, linux-box, fmt, clippy, windows-clippy, archive, test, macos-test, remote-test, windows-archive, windows-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The candidate cannot replace the final consumer of job outcomes.
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'main' }}
          persist-credentials: false
      - name: Require all applicable jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          CHECK_MODE: ${{ github.event_name == 'push' && 'guard' || 'full' }}
        run: python -I scripts/ci/check.py
