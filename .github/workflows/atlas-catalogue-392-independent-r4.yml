      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
        components: rustfmt,clippy
    - name: Install pinned observer
      shell: python
      run: 'import subprocess,sys

        subprocess.run([sys.executable,"-m","pip","install","psutil==7.1.0"],check=True)

