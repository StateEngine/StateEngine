        \    capsule=artifacts/'native-images'/arm/'crash'/binary\n    capsule.parent.mkdir(parents=True,exist_ok=True)\n\
        \    shutil.copyfile(crash_images[arm],capsule)\n    shutil.copyfile(output/'build.json',artifacts/(arm+'-crash-build.json'))\n\
        def crash(arm,sha):\n    if arm not in crash_images:\n        blocked('crash-'+arm,'its reviewer\
        \ crash image did not build')\n        return\n    try:\n        run([sys.executable,judge/'crash_recovery.py','--se',crash_images[arm],'--source',sha,'--arm',arm,\n\
