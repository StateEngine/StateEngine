name: Independent macOS bounded process reader qualification
'on':
  push:
    branches:
    - prime/macos-process-408-review-r2
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: product
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '3'
jobs:
  judge:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        - arm: head
          source: ee4c6f714695e674823233edd2aa69b270f4f887
    env:
      PRODUCT_SOURCE: ${{ matrix.source }}
      ARM: ${{ matrix.arm }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        path: product
        persist-credentials: false
    - uses: ./product/.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: product
        shared-key: macos-process-408-native-r1
    - name: Stage independent native boundary controls
      shell: python
      run: 'import os,base64

        from pathlib import Path

        p=Path(os.environ[''RUNNER_TEMP''])/''controls408'';p.mkdir()

        (p/''fault.c'').write_bytes(base64.b64decode(''''))

        (p/''reviewer_macos_408.rs'').write_bytes(base64.b64decode(''''))

        (p/''driver.py'').write_bytes(base64.b64decode(''''))

        '
    - name: Compile native interposer and judge exact source
      shell: python
      run: 'import os,subprocess,sys

        from pathlib import Path

        subprocess.run([sys.executable,str(Path(os.environ[''RUNNER_TEMP''])/''controls408/driver.py'')],check=True)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: macos-process-408-${{ matrix.arm }}
        path: ${{ runner.temp }}/macos408
        if-no-files-found: error
        retention-days: 14
