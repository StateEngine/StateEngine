name: Git2 configuration fallback native development checks r7
'on':
  push:
    branches:
    - prime/status-git2-389-config-checks-r7
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2025
        - ubuntu-24.04
        - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SOURCE_SHA: 0906dc4ac1e00514e883036352ed0df398dcc849
      SOURCE_ARM: head
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 0906dc4ac1e00514e883036352ed0df398dcc849
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: git2-status-389-v1-${{ matrix.os }}
        cache-workspace-crates: false
    - name: Record native checks, existing tests and CLI linking
      shell: python
      run: |
        import ast,base64,hashlib,os,subprocess,sys
        from pathlib import Path
        data=base64.b64decode('')
        assert hashlib.sha256(data).hexdigest()=='c87ea17a1d5782f6604e7678256c2c8efb974fb6013958393bdbbd08bce65162'
        ast.parse(data)
        p=Path(os.environ['RUNNER_TEMP'])/'git2-check-recorder-r2.py'
        p.write_bytes(data)
        raise SystemExit(subprocess.call([sys.executable,'-B',str(p)]))
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: git2-config-check-r7-${{ matrix.os }}
        path: ${{ runner.temp }}/git2-check-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
