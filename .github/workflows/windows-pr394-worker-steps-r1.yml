name: Windows metadata readback service comparison
'on':
  push:
    branches:
    - prime/windows-pr394-worker-steps-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ea3c9dfeb6bf10cf884a1dd568a37b5ee64ad460
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: windows-pr394-worker-steps-r1
        cache-on-failure: true
        cache-targets: false
    - name: Compare matched baseline and metadata reuse with tracing controls
      shell: python
      run: "import os,sys\nsys.argv=['driver','--out',os.path.join(os.environ['RUNNER_TEMP'],'windows-pr394-worker-steps-r1')]\n\"\"\"Matched metadata-reuse comparison with identical worker tracing.\"\"\"\nimport argparse\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport platform\nimport shutil\nimport statistics\nimport subprocess\nimport time\nimport traceback\n\nPRODUCT = '5ef5d32ea8316542d4806383f063ce8a9ddf276c'\nOVERLAY = {'crates/se-host/src/runtime/timings.rs', 'crates/se-store/src/lib.rs', 'crates/se-proc/src/lib.rs', 'crates/se-store/src/read_phase.rs', 'crates/se-host/src/runtime/pool.rs', 'crates/se-proc/src/worker_observer.rs', 'crates/se-host/src/client/lease.rs', 'crates/se/tests/eight_writer_worker_measurement.rs', 'crates/se-core/src/ops/outputs/host_phases.rs', 'crates/se-proc/src/state_files/effects/windows.rs', 'crates/se-host/src/runtime/executor.rs', 'crates/se-store/src/read/snapshot.rs', 'crates/se-host/src/runtime/admission.rs',\
        \ 'crates/se/src/mcp_stdio.rs', 'crates/se-store/src/read_phase_pool.rs', 'crates/se-store/src/worker_observer.rs', 'crates/se-proc/src/state_files/windows/security.rs', 'crates/se/tests/worker_process_metrics.py', 'crates/se-proc/src/state_files/metadata.rs', 'crates/se/tests/eight_writer_workers.py', 'crates/se-host/src/runtime/submit.rs'}\nSOURCES = {'base': '5987b188bb9a9429a0285ffa6e5ef3ba171010c9', 'reuse': 'ea3c9dfeb6bf10cf884a1dd568a37b5ee64ad460'}\nPR394 = '1db0f20fa543e496fa04be4f37af106a8a0bc27f'\nORDER = [('base',0),('base',1),('reuse',1),('reuse',0),('reuse',0),('reuse',1),('base',1),('base',0)]\n\nOPS = ['stateengine_msg_send', 'stateengine_working_state_set']\nPHASES = ['admission', 'submission', 'continuation']\n\n\ndef describe(sample):\n    phases = sample['diagnostics']['host_phases']\n    result = {'client_ms': sample['ms'], 'host_ms': phases['admitted_to_encode_us'] / 1000,\n              'completion_ms': phases['completion_wait_us'] / 1000}\n    for phase in\
        \ PHASES:\n        span = phases[phase]\n        assert span['jobs'] == 1, 'unexpected phase multiplicity'\n        for part in ['queue', 'work', 'resume']:\n            result[phase + '_' + part + '_ms'] = span[part + '_us'] / 1000\n        assert 0 <= span['queue_us'] - span['semaphore_us'] - span['dispatch_us'] <= 1\n        for part in ['semaphore', 'dispatch', 'observer_collect']:\n            result[phase + '_' + part + '_ms'] = span[part + '_us'] / 1000\n        if span.get('detail') is not None:\n            for layer, records in span['detail'].items():\n                assert layer in ['host_native', 'store'] and isinstance(records, dict)\n                for label, values in records.items():\n                    calls, inclusive, exclusive, maximum = values\n                    assert calls > 0 and 0 <= exclusive <= inclusive and 0 <= maximum <= inclusive\n                    assert inclusive <= span['work_us'] * 1000 + 1000, (label, values, span)\n    result['host_other_ms']\
        \ = result['host_ms'] - result['completion_ms'] - sum(\n        result[p + '_' + k + '_ms'] for p in PHASES for k in ['queue', 'work', 'resume'])\n    result['bridge_wire_ms'] = result['client_ms'] - result['host_ms']\n    assert result['host_other_ms'] >= -0.01 and result['bridge_wire_ms'] >= -0.01\n    writer = sample['diagnostics']['write_timings']\n    for name in ['queue_ms', 'transaction_ms', 'commit_call_ms']:\n        result['writer_' + name] = writer[name]\n    assert all(math.isfinite(v) for v in result.values())\n    return result\n\n\ndef analyze(report):\n    assert set(report['cohorts']) == {'1', '8'}\n    assert set(report['resources']) == {'1', '8'}\n    seen = set()\n    cohorts = {}\n    for cohort, clients in report['cohorts'].items():\n        assert len(clients) == int(cohort)\n        for client in clients:\n            assert not client.get('error') and not client.get('cleanup_error'), client\n            assert client['verified_events'] == 60\n           \
        \ assert set(client['samples']) == set(OPS)\n            for samples in client['samples'].values():\n                assert len(samples) == 30\n                for sample in samples:\n                    assert sample['key'] not in seen and sample['event_id']\n                    assert sample['writer']['mode'] == 'host'\n                    seen.add(sample['key'])\n        operations = {}\n        resources = report['resources'][cohort]\n        assert resources['qualified'] is True, resources\n        assert len(resources['snapshots']) == 4\n        for operation in OPS:\n            for client in clients:\n                assert sorted(client['samples'][operation], key=lambda row: row['ms'])[28]['ms'] == client['p95_ms'][operation]\n            worst = max(range(len(clients)), key=lambda i: clients[i]['p95_ms'][operation])\n            exact = sorted(clients[worst]['samples'][operation], key=lambda row: row['ms'])[28]\n            rows = [describe(sample) for client in clients\
        \ for sample in client['samples'][operation]]\n            resource = resources['phases'][operation]\n            assert resource['writes'] == len(rows) and resource['wall_ms'] > 0\n            assert resource['cpu_ms_total'] >= 0 and resource['ending_working_set_bytes'] > 0\n            operations[operation] = {\n                'count': len(rows), 'worst_client': worst,\n                'worst_client_p95_ms': exact['ms'], 'exact_tail_key': exact['key'],\n                'exact_tail_components': describe(exact),\n                'exact_tail_steps': exact['diagnostics'],\n                'component_means': {key: statistics.mean(row[key] for row in rows) for key in rows[0]},\n                'resources': resource,\n            }\n        cohorts[cohort] = operations\n    assert len(seen) == 540\n    return {'verified_events': len(seen), 'cohorts': cohorts, 'budget_pass': report['pass']}\n\n\ndef digest(path):\n    return hashlib.sha256(Path(path).read_bytes()).hexdigest()\n\n\n\n\
        def main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--out', required=True)\n    args = parser.parse_args()\n    checkout = Path.cwd().resolve()\n    root = Path(args.out).resolve()\n    root.mkdir(parents=True, exist_ok=False)\n    summary = {'qualified': False, 'product': PRODUCT, 'sources': SOURCES, 'pr394': PR394,\n        'order': ORDER, 'rows': [],\n        'scope': 'Same Windows runner and two-worker cap, matched baseline versus only the PR394 metadata readback change; identical observation overlay. Trace off/on controls repeated in balanced order. Synthetic active sessions, public kept-open MCP; no provider hooks, mixed FULL or loaded maintenance qualification.',\n        'accounting': 'Host serial phases add; writer timing overlaps completion. Host/native and store layers overlap. Off/on controls measure instrumentation overhead separately for each source. Resource snapshots are outside requests; boundary working sets and lifetime peaks are not interval\
        \ peaks.',\n        'decision': 'Measure metadata-pin service and semaphore queue before deciding whether a handoff change is warranted; no handoff change is present.'}\n    def save():\n        (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\\n', encoding='utf-8')\n    try:\n        assert os.name == 'nt', 'native Windows only'\n        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == SOURCES['reuse']\n        assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],text=True)\n        changed = subprocess.check_output(['git','diff','--name-only',SOURCES['base'],SOURCES['reuse']],text=True).splitlines()\n        assert changed == ['crates/se-proc/src/state_files/metadata.rs'], changed\n        path = changed[0]\n        raw_base = subprocess.check_output(['git','show',SOURCES['base']+':'+path])\n        raw_reuse = subprocess.check_output(['git','show',SOURCES['reuse']+':'+path])\n        marker\
        \ = b'        let _worker_step = crate::worker_observer::span(\"native.metadata_pin\");\\n'\n        assert raw_base.count(marker) == raw_reuse.count(marker) == 1\n        assert raw_base.replace(marker,b'') == subprocess.check_output(['git','show',PR394+'^:'+path])\n        assert raw_reuse.replace(marker,b'') == subprocess.check_output(['git','show',PR394+':'+path])\n        (root/'product-only.diff').write_bytes(subprocess.check_output(['git','diff',SOURCES['base'],SOURCES['reuse']]))\n        inputs = {'product': PRODUCT, 'sources': SOURCES, 'pr394': PR394,\n            'publication':os.environ.get('GITHUB_SHA'),'run':os.environ.get('GITHUB_RUN_ID'),\n            'attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'platform':platform.platform(),\n            'cpu_count':os.cpu_count(),'compiler':subprocess.check_output(['rustc','-vV'],text=True),\n            'files':{}}\n        (root/'inputs.json').write_text(json.dumps(inputs,indent=2)+'\\n')\n        lanes = {}\n        for arm,\
        \ source in SOURCES.items():\n            work = Path(os.environ['RUNNER_TEMP']) / ('worker-pr394-source-'+arm)\n            subprocess.run(['git','worktree','add','--detach',str(work),source],check=True)\n            assert set(subprocess.check_output(['git','diff','--name-only',PRODUCT,source],cwd=work,text=True).splitlines()) == OVERLAY\n            inputs['files'][arm] = {p:digest(work/p) for p in sorted(OVERLAY)}\n            (root/'inputs.json').write_text(json.dumps(inputs,indent=2)+'\\n')\n            env = dict(os.environ, CARGO_TARGET_DIR=str(work/'target'))\n            for key in ['SE_MEASURE_MIXED','SE_MEASURE_COHORT','SE_OBSERVE_BLOCKING_JOBS','SE_OBSERVE_WORKER_STEPS','SE_OBSERVE_BRIDGE_STEPS']:\n                env.pop(key,None)\n            build = ['cargo','test','--target','x86_64-pc-windows-msvc','--release','--all-features','--locked','-p','se','--test','eight_writer_worker_measurement','--no-run','--message-format=json']\n            with (root/(arm+'-build.jsonl')).open('wb')\
        \ as out, (root/(arm+'-build.stderr')).open('wb') as err:\n                done=subprocess.run(build,cwd=work,env=env,stdout=out,stderr=err,timeout=2700)\n            (root/(arm+'-build-command.json')).write_text(json.dumps({'argv':build,'exit':done.returncode})+'\\n')\n            assert done.returncode == 0, arm+' did not compile; no latency verdict'\n            artifacts=[json.loads(line) for line in (root/(arm+'-build.jsonl')).read_text().splitlines()]\n            executables=[r['executable'] for r in artifacts if r.get('reason')=='compiler-artifact' and r.get('target',{}).get('name')=='eight_writer_worker_measurement' and r.get('profile',{}).get('test') is True and r.get('executable')]\n            assert len(executables)==1, 'ambiguous executable'\n            executable=Path(executables[0]); shipping=work/'target/x86_64-pc-windows-msvc/release/se.exe'\n            binaries={'observer':{'path':str(executable),'sha256':digest(executable)},'shipping':{'path':str(shipping),'sha256':digest(shipping)}}\n\
        \            (root/(arm+'-binaries.json')).write_text(json.dumps(binaries,indent=2)+'\\n')\n            lanes[arm]=(work,env,executable,shipping,binaries)\n        assert {p for p in OVERLAY if inputs['files']['base'][p]!=inputs['files']['reuse'][p]}=={path}\n        for index,(arm,tracing) in enumerate(ORDER):\n            work,env,executable,shipping,binaries=lanes[arm]\n            dest=root/f'{index+1:02d}-{arm}-tracing-{tracing}'\n            dest.mkdir()\n            row={'index':index+1,'arm':arm,'observer':SOURCES[arm],'workers':2,'tracing':bool(tracing),'qualified':False}\n            summary['rows'].append(row)\n            try:\n                assert digest(executable)==binaries['observer']['sha256']\n                assert digest(shipping)==binaries['shipping']['sha256']\n                assert not (work/'target/judge-diagnostics').exists(), 'stale diagnostics remain'\n                assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'],cwd=work,text=True)\n\
        \                runenv=dict(env,SE_OBSERVE_BLOCKING_JOBS='2',SE_OBSERVE_WORKER_STEPS=str(tracing),SE_OBSERVE_BRIDGE_STEPS=str(tracing))\n                command=[str(executable),'--nocapture']; started=time.monotonic_ns()\n                with (dest/'stdout.log').open('wb') as out,(dest/'stderr.log').open('wb') as err:\n                    process=subprocess.run(command,cwd=work,stdout=out,stderr=err,env=runenv,timeout=300)\n                row['command']={'argv':command,'exit':process.returncode,'elapsed_ns':time.monotonic_ns()-started}\n                diagnostics=work/'target/judge-diagnostics'\n                if diagnostics.is_dir(): shutil.move(str(diagnostics),str(dest/'diagnostics'))\n                assert process.returncode==0, 'writes/readback/closure failed'\n                settings=json.loads((dest/'diagnostics/worker-settings.json').read_text())\n                assert settings['requested']==settings['effective']==settings['runtime_thread_cap']==2\n              \
        \  assert settings['native_cpus']>=4\n                assert settings['worker_steps']==settings['bridge_steps']==bool(tracing)\n                shutdown=json.loads((dest/'diagnostics/shutdown.json').read_text())\n                assert shutdown['transport_closed'] and shutdown['endpoint_retired']\n                assert shutdown['pending']==[] and shutdown['errors']==[]\n                raw=json.loads((dest/'diagnostics/mcp-writers.json').read_text())\n                row['measurement']=analyze(raw)\n                for cohort in raw['cohorts'].values():\n                    for client in cohort:\n                        for samples in client['samples'].values():\n                            for sample in samples:\n                                diag=sample['diagnostics']\n                                assert ('bridge_steps' in diag)==bool(tracing)\n                                for phase in PHASES: assert ('detail' in diag['host_phases'][phase])==bool(tracing)\n           \
        \     row['qualified']=True\n            except Exception as error:\n                row.update(error=repr(error),traceback=traceback.format_exc())\n                if isinstance(error,subprocess.TimeoutExpired):\n                    summary['cleanup_unknown']=True\n                    raise\n            finally: save()\n        summary['qualified']=len(summary['rows'])==len(ORDER) and all(r['qualified'] for r in summary['rows'])\n        assert summary['qualified'], 'one or more observations unqualified'\n    except Exception as error:\n        summary.update(error=repr(error),traceback=traceback.format_exc())\n        summary['cleanup_unknown']=summary.get('cleanup_unknown',False) or isinstance(error,subprocess.TimeoutExpired)\n    finally:\n        save()\n        files={p.relative_to(root).as_posix():{'bytes':p.stat().st_size,'sha256':digest(p)} for p in sorted(root.rglob('*')) if p.is_file()}\n        (root/'manifest.json').write_text(json.dumps({'files':files},indent=2)+'\\\
        n',encoding='utf-8')\n    return 0 if summary['qualified'] else 1\n\nif __name__=='__main__':\n    raise SystemExit(main())\n"
    - name: Retain complete measurements and inputs
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: windows-pr394-worker-steps-r1
        path: ${{ runner.temp }}/windows-pr394-worker-steps-r1
        include-hidden-files: true
        retention-days: 14
        if-no-files-found: error
