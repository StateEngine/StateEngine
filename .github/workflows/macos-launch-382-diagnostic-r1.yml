name: Native macOS launch diagnostic
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MEASURE_TARGET: aarch64-apple-darwin
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 2836e87c9e251d77cece6385b04b003b5030627f
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        github-token: ${{ github.token }}
        run-id: 43681180818
        name: live-output-native-r1-aarch64-apple-darwin
        path: ${{ runner.temp }}/prior-output
    - name: Stage native diagnostic observer
      shell: python
      run: |
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP'])
        (root/'trace-proc.c').write_text('/* Observation only: preserve every native return value and errno. */\n#include <errno.h>\n#include <fcntl.h>\n#include <libproc.h>\n#include <stdatomic.h>\n#include <stdint.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <unistd.h>\nstatic _Atomic unsigned records;\nstatic void emit(const char *line, size_t size) {\n    const char *path = getenv("SE382_NATIVE_TRACE");\n    if (!path) return;\n    int fd = open(path, O_WRONLY | O_CREAT | O_APPEND, 0600);\n    if (fd < 0) return;\n    ssize_t count = write(fd, line, size);\n    (void)count;\n    close(fd);\n}\n__attribute__((constructor)) static void loaded(void) {\n    int saved = errno;\n    char line[128];\n    int n = snprintf(line, sizeof line, "{\\"event\\":\\"loaded\\",\\"caller\\":%d}\\n", getpid());\n    if (n > 0 && (size_t)n < sizeof line) emit(line, (size_t)n);\n    errno = saved;\n}\nstatic int traced_path(int pid, void *out, uint32_t size) {\n    int result = proc_pidpath(pid, out, size);\n    int saved = errno;\n    unsigned index = atomic_fetch_add(&records, 1);\n    if (result <= 0 || index < 8) {\n        struct proc_bsdinfo a = {0}, b = {0};\n        errno = 0;\n        int an = proc_pidinfo(pid, PROC_PIDTBSDINFO, 1, &a, sizeof a);\n        int ae = errno;\n        errno = 0;\n        int bn = proc_pidinfo(pid, PROC_PIDTBSDINFO, 1, &b, sizeof b);\n        int be = errno;\n        char line[1024];\n        int n = snprintf(line, sizeof line,\n          "{\\"event\\":\\"path\\",\\"caller\\":%d,\\"pid\\":%d,\\"return\\":%d,\\"errno\\":%d,"\n          "\\"a\\":{\\"bytes\\":%d,\\"errno\\":%d,\\"pid\\":%u,\\"parent\\":%u,\\"state\\":%u,\\"start_s\\":%llu,\\"start_us\\":%llu},"\n          "\\"b\\":{\\"bytes\\":%d,\\"errno\\":%d,\\"pid\\":%u,\\"parent\\":%u,\\"state\\":%u,\\"start_s\\":%llu,\\"start_us\\":%llu}}\\n",\n          getpid(), pid, result, saved,\n          an, ae, a.pbi_pid, a.pbi_ppid, a.pbi_status, (unsigned long long)a.pbi_start_tvsec, (unsigned long long)a.pbi_start_tvusec,\n          bn, be, b.pbi_pid, b.pbi_ppid, b.pbi_status, (unsigned long long)b.pbi_start_tvsec, (unsigned long long)b.pbi_start_tvusec);\n        if (n > 0 && (size_t)n < sizeof line) emit(line, (size_t)n);\n    }\n    errno = saved;\n    return result;\n}\n__attribute__((used, section("__DATA,__interpose")))\nstatic const struct { const void *replacement; const void *original; } interpose[] = {\n    { (const void *)traced_path, (const void *)proc_pidpath },\n};\n')
        (root/'reproduce.py').write_text('"""Retain failed attempts and native PID facts; never turn an unreadable PID into absence."""\nfrom pathlib import Path\nimport hashlib,json,os,shutil,subprocess,sys,time\ncheckout=Path.cwd();observer=checkout/\'scripts/live_output_observe\'\nsys.path.insert(0,str(observer))\nfrom build import digest,unpack\nfrom native import Fixture,NativeObserver\nout=Path(os.environ[\'RUNNER_TEMP\'])/\'launch382\';out.mkdir()\nprior=Path(os.environ[\'RUNNER_TEMP\'])/\'prior-output\'\nsource=\'7e565de8101511b60ca97e1d39b2af216642ef71\'\nexpected=\'49485522dc947a3f0e59efde29e25a0f4bfeb67854903f7cb7170a5fd3956338\'\narchives=list((prior/\'archive\').glob(\'*.tar.gz\'));assert len(archives)==1 and digest(archives[0])==expected\nbuild=json.loads((prior/\'build.json\').read_text());assert build[\'source_commit\']==source and build[\'target\']==\'aarch64-apple-darwin\'\nimage,manifest=unpack(archives[0],out/\'extracted\',build)\n(out/\'package-manifest.json\').write_text(json.dumps(manifest,indent=2)+\'\\n\')\n(out/\'package-build.json\').write_text(json.dumps(build,indent=2)+\'\\n\')\ntrace=out/\'trace-proc.dylib\'\nsubprocess.run([\'/usr/bin/cc\',\'-std=c11\',\'-dynamiclib\',\'-Wall\',\'-Wextra\',\'-Werror\',str(Path(os.environ[\'RUNNER_TEMP\'])/\'trace-proc.c\'),\'-o\',str(trace),\'-lproc\'],check=True)\nhelper=out/\'diagnostic-provider.py\'\nprovider_source=(checkout/\'crates/se/tests/judges/mail_provider.py\').read_text()\n# Add a timeline without changing the existing provider\'s handshake or delays.\nprovider_source=provider_source.replace(\'    cwd = Path.cwd()\',\'    cwd = Path.cwd()\\n    phase("entered")\',1)\nfor old,new in [\n (\'    time.sleep(0.25)\',\'    phase("init-flushed")\\n    time.sleep(0.25)\'),\n (\'    request = json.dumps\',\'    phase("transcript-written")\\n    request = json.dumps\'),\n (\'    assert ipc.returncode == 0\',\'    phase("session-discovery-returned", exit=ipc.returncode)\\n    assert ipc.returncode == 0\'),\n (\'    if on_ready is not None:\',\'    phase("ready")\\n    if on_ready is not None:\')]:\n assert provider_source.count(old)==1,old\n provider_source=provider_source.replace(old,new,1)\nhelper.write_text(\'\'\'import json,os,sys,time,traceback\nfrom pathlib import Path\ndef phase(name,**fields):\n with (Path.cwd()/\'provider-phases.jsonl\').open(\'a\') as log:\n  log.write(json.dumps(dict(phase=name,pid=os.getpid(),parent=os.getppid(),at_ns=time.monotonic_ns(),**fields))+\'\\\\n\')\ntry:\n exec(compile(SOURCE,\'mail_provider.py\',\'exec\'),dict(__name__=\'__diagnostic__\',__file__=PROVIDER_PATH,phase=phase))\nexcept BaseException:\n with (Path.cwd()/\'provider-error.txt\').open(\'w\') as log:traceback.print_exc(file=log)\n raise\n\'\'\'.replace(" exec(compile(SOURCE,\'mail_provider.py\',\'exec\'),dict(__name__=\'__diagnostic__\',__file__=PROVIDER_PATH,phase=phase))", " scope=dict(__name__=\'__diagnostic__\',__file__="+repr(str(checkout/\'crates/se/tests/judges/mail_provider.py\'))+",phase=phase)\\n exec(compile("+repr(provider_source)+",\'mail_provider.py\',\'exec\'),scope)\\n scope[\'main\']()"))\ninputs={\'source\':source,\'observer\':subprocess.check_output([\'git\',\'rev-parse\',\'HEAD\'],text=True).strip(),\'archive_sha256\':expected,\'image_sha256\':digest(image),\'trace_sha256\':digest(trace),\'trace_source_sha256\':digest(Path(os.environ[\'RUNNER_TEMP\'])/\'trace-proc.c\'),\'provider_source_sha256\':digest(checkout/\'crates/se/tests/judges/mail_provider.py\'),\'instrumented_provider_sha256\':digest(helper),\'native_host\':subprocess.check_output([\'rustc\',\'--print\',\'host-tuple\'],text=True).strip(),\'compiler\':subprocess.check_output([\'rustc\',\'-vV\'],text=True),\'run_id\':os.environ[\'GITHUB_RUN_ID\'],\'publication\':os.environ[\'GITHUB_SHA\']}\n(out/\'inputs.json\').write_text(json.dumps(inputs,indent=2)+\'\\n\')\nrows=[]\nfor index in range(32):\n case=out/f\'attempt-{index+1:02}\';case.mkdir();fixture_dir=case/\'fixture\';fixture_dir.mkdir(mode=0o700)\n private=fixture_dir/\'se\';shutil.copyfile(image,private);private.chmod(0o500);assert digest(private)==digest(image)\n f=Fixture(private,fixture_dir/\'session\',provider_helper=helper)\n allowed=(\'HOME\',\'USERPROFILE\',\'PATH\',\'LANG\',\'SHELL\',\'TMPDIR\',\'TMP\',\'TEMP\',\'SystemRoot\',\'SYSTEMROOT\',\'windir\',\'WINDIR\',\'ComSpec\',\'COMSPEC\',\'PATHEXT\')\n f.env={k:v for k,v in f.env.items() if k in allowed or k.startswith(\'XDG_\')}\n f.env.update(DYLD_INSERT_LIBRARIES=str(trace),SE382_NATIVE_TRACE=str(case/\'native.jsonl\'))\n observer=NativeObserver(fixture_dir,case)\n failure=None;cleanup=[];launched=None\n try:\n  up=f.ok(\'up\');observer.observe(up[\'process\'][\'pid\'])\n  try:f.launch();launched=f.session\n  except Exception as error:failure=f\'{type(error).__name__}: {error}\'\n  observer.observe()\n finally:\n  # Copy diagnostic files before shutdown can remove the owned private home.\n  for name in (\'provider-phases.jsonl\',\'provider-error.txt\',\'provider-ready.json\'):\n   p=f.repo/name\n   if p.exists():shutil.copyfile(p,case/name)\n  try:f.close()\n  except Exception as error:cleanup.append(f\'{type(error).__name__}: {error}\')\n  until=time.monotonic()+10\n  remaining=observer.observe()\n  while remaining and time.monotonic()<until:time.sleep(.02);remaining=observer.observe()\n  if remaining:cleanup.append(\'Owned native identities remain after public down\')\n  for name in (\'provider-phases.jsonl\',\'provider-error.txt\',\'provider-ready.json\'):\n   p=f.repo/name\n   if p.exists():shutil.copyfile(p,case/name)\n  for p in f.log_root.glob(\'call-*.*\'):shutil.copyfile(p,case/p.name)\n  for name in (\'public-ready.json\',\'public-ready-final.json\'):\n   p=f.root/name\n   if p.exists():shutil.copyfile(p,case/name)\n  native_trace=case/\'native.jsonl\'\n  if not native_trace.exists():cleanup.append(\'Native tracing did not load; reproduction is ungraded\')\n  else:\n   events=[json.loads(line) for line in native_trace.read_text().splitlines()]\n   if not any(e.get(\'event\')==\'path\' for e in events):cleanup.append(\'Native trace has no exercised path read; reproduction is ungraded\')\n  row={\'attempt\':index+1,\'launch_session\':launched,\'failure\':failure,\'cleanup_errors\':cleanup,\'remaining\':remaining}\n  (case/\'result.json\').write_text(json.dumps(row,indent=2)+\'\\n\');rows.append(row)\n  (out/\'census.json\').write_text(json.dumps({\'attempts\':rows,\'failed_attempts\':sum(r[\'failure\'] is not None for r in rows),\'all_cleanup_witnessed\':all(not r[\'cleanup_errors\'] for r in rows),\'claim\':\'Diagnostic observation of unmodified retained product; no fix or stock-provider qualification\'},indent=2)+\'\\n\')\n if failure or cleanup:break\nif any(r[\'cleanup_errors\'] for r in rows):raise SystemExit(\'Cleanup or trace evidence incomplete\')\nprint(json.dumps({\'attempts\':len(rows),\'failed_attempts\':sum(r[\'failure\'] is not None for r in rows)}),flush=True)\n')
    - name: Observe unchanged retained native launches
      shell: python
      run: |
        import os,subprocess,sys
        from pathlib import Path
        subprocess.run([sys.executable,'-B',str(Path(os.environ['RUNNER_TEMP'])/'reproduce.py')],check=True,timeout=2100)
    - name: Retain only native observations
      if: ${{ always() }}
      shell: python
      run: |
        from pathlib import Path
        import os,shutil
        root=Path(os.environ['RUNNER_TEMP']);out=root/'launch382-evidence';out.mkdir()
        source=root/'launch382'
        for directory,children,files in os.walk(source):
         children[:]=[name for name in children if name not in ('fixture','extracted')]
         for name in files:
          p=Path(directory)/name
          if p.suffix in ('.json','.jsonl','.log','.stdout','.stderr') or name=='provider-error.txt':
           q=out/p.relative_to(source);q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: macos-launch-382-diagnostic
        path: ${{ runner.temp }}/launch382-evidence
        retention-days: 14
        if-no-files-found: error
'on':
  push:
    branches:
    - prime/macos-launch-382-diagnostic-r1
