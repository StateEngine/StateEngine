        \ -Compress\")\\n\\n    def start(self):\\n        binary = Path(os.environ[\\'WINDIR\\'])/\\\
        'System32/OpenSSH/sshd.exe\\'\\n        assert binary.is_file(), \\'Hosted step unavailable: built-in\
