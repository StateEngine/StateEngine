        \ str(sftp).replace(\\'\\\\\\\\\\', \\'/\\') + \\'\"\\\\n\\')\\n        accounts.private_acl(config,\
        \ \\'S-1-5-32-544\\')\\n        service = Service(config)\\n        report[\\'service\\'] = service.start()\\\
        n        save()\\n        (private / \\'known_hosts\\').write_text(known)\\n        ssh = str(Path(os.environ[\\\
        'WINDIR\\']) / \\'System32/OpenSSH/ssh.exe\\')\\n        prefix = [ssh, \\'-F\\', \\'NUL\\', \\\
        '-i\\', str(private / \\'client\\'), \\'-p\\', str(port), \\'-oBatchMode=yes\\', \\'-oIdentitiesOnly=yes\\\
        ', \\'-oIdentityAgent=none\\', \\'-oStrictHostKeyChecking=yes\\', \\'-oUserKnownHostsFile=\\'\
        \ + str(private / \\'known_hosts\\')]\\n\\n        def call(user, label, arguments):\\n      \
        \      nonlocal outer\\n            work = Path(user[\\'profile\\']) / \\'review-pair\\'\\n  \
        \          output = work / (\\'call-\\' + label)\\n            payload = base64.b64encode(json.dumps(arguments).encode()).decode()\\\
        n            script = \\'& \\' + native.quote(sys.executable) + \\' -B \\' + native.quote(work\
        \ / \\'consumer.py\\') + \\' --binary \\' + native.quote(user[\\'binary\\']) + \\' --output \\\
        ' + native.quote(output) + \\' --arguments \\' + native.quote(payload) + \\'; exit $LASTEXITCODE\\\
        '\\n            remote = \\'powershell.exe -NoLogo -NoProfile -NonInteractive -EncodedCommand\
        \ \\' + native.encoded(script)\\n            with (reports / (label + \\'-login.stdout\\')).open(\\\
        'wb\\') as stdout, (reports / (label + \\'-login.stderr\\')).open(\\'wb\\') as stderr:\\n    \
        \            outer = subprocess.Popen([*prefix, user[\\'name\\'] + \\'@127.0.0.1\\', remote],\
        \ stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr)\\n                birth = native.times(int(outer._handle))\\\
        n                try:\\n                    code = outer.wait(timeout=150)\\n                except\
        \ subprocess.TimeoutExpired:\\n                    exact = native.exact(outer.pid)\\n        \
        \            assert exact[\\'native\\'][\\'creation_filetime\\'] == birth[\\'creation_filetime\\\
        ']\\n                    native.stop(exact)\\n                    outer.wait(timeout=10)\\n  \
        \                  raise\\n                outer = None\\n            assert code == 0, dict(label=label,\
        \ login_exit=code)\\n            row = json.loads((output / \\'result.json\\').read_text())\\\
        n            row.update(label=label, role=user[\\'role\\'])\\n            assert row[\\'native_account\\\
        '][\\'sid\\'] == user[\\'sid\\'] and Path(row[\\'native_account\\'][\\'profile\\']).resolve()\
        \ == Path(user[\\'profile\\']).resolve()\\n            for name in [\\'result.json\\', \\'stdout\\\
        ', \\'stderr\\']:\\n                shutil.copyfile(output / name, reports / (label + \\'-\\'\
        \ + name))\\n            report[\\'commands\\'].append(row)\\n            save()\\n          \
        \  return row\\n        for user in users:\\n            assert call(user, user[\\'role\\'] +\
        \ \\'-help\\', [\\'--help\\'])[\\'exit\\'] == 0\\n        init = call(source, \\'init\\', [\\\
        '--json\\', \\'init\\', \\'--repo\\', str(Path(source[\\'profile\\']) / \\'review-work\\'), \\\
        '--name\\', \\'pair-control\\'])\\n        assert init[\\'exit\\'] == 0 and consumer.response(init)[\\\
        'schema\\'] != \\'se.error/v1\\'\\n        assert not [x for x in census(\\'before-pair\\')[\\\
        'rows\\'] if x[\\'sid\\'] == destination[\\'sid\\']]\\n        pair = call(source, \\'pair\\',\
        \ [\\'--json\\', \\'remote\\', \\'add\\', \\'review-peer\\', \\'--name\\', \\'peer\\'])\\n   \
        \     report[\\'metadata_qualified\\'] = pair[\\'inherited_fd_state\\']\\n        stages = [v[\\\
        'value\\'][\\'stage\\'] for v in pair[\\'responses\\'] if v[\\'value\\'][\\'schema\\'] == \\'stateengine.remote-setup-progress/v1\\\
        ']\\n        report[\\'pair_stages\\'] = stages\\n        if a.arm == \\'base\\':\\n         \
        \   assert stages and set(stages) == {\\'discovering\\'}, \\'Base did not fail specifically during\
        \ discovery\\'\\n            refusal = consumer.response(pair)\\n            assert pair[\\'exit\\\
        '] != 0 and refusal[\\'code\\'] == \\'listener-unavailable\\' and (\\'SSH bootstrap exceeded 25\
        \ seconds\\' in refusal[\\'detail\\'][\\'reason\\']), pair\\n            assert not [x for x in\
        \ census(\\'base-after-refusal\\')[\\'rows\\'] if x[\\'sid\\'] == destination[\\'sid\\']]\\n \
        \           report[\\'base_discovery_failure_witnessed\\'] = True\\n        else:\\n         \
        \   assert \\'discovering\\' in stages and \\'ready\\' in stages, stages\\n            host =\
        \ consumer.connected(pair)\\n            consumer.listed(call(source, \\'list\\', [\\'--json\\\
        ', \\'remote\\', \\'list\\', \\'--host\\', \\'peer\\']))\\n            assert call(source, \\\
        'disconnect\\', [\\'--json\\', \\'remote\\', \\'disconnect\\', \\'--name\\', \\'peer\\'])[\\'exit\\\
        '] == 0\\n            refused = call(source, \\'disconnected-list\\', [\\'--json\\', \\'remote\\\
        ', \\'list\\', \\'--host\\', \\'peer\\'])\\n            value = consumer.response(refused)\\n\
        \            assert refused[\\'exit\\'] != 0 and value[\\'code\\'] == \\'capability-invalid\\\
        ' and (\\'disconnected\\' in value[\\'detail\\'][\\'reason\\'])\\n            assert consumer.connected(call(source,\
        \ \\'reconnect\\', [\\'--json\\', \\'remote\\', \\'add\\', \\'review-peer\\', \\'--name\\', \\\
        'peer\\'])) == host\\n            consumer.listed(call(source, \\'list-again\\', [\\'--json\\\
        ', \\'remote\\', \\'list\\', \\'--host\\', \\'peer\\']))\\n            consumer.stopped(call(destination,\
        \ \\'destination-down\\', [\\'--json\\', \\'down\\']))\\n        consumer.stopped(call(source,\
        \ \\'source-down\\', [\\'--json\\', \\'down\\']))\\n        end = time.monotonic() + 20\\n   \
        \     while True:\\n            quiet = census(\\'after-public-down\\')\\n            if not quiet[\\\
        'rows\\'] or time.monotonic() > end:\\n                break\\n            time.sleep(0.2)\\n\
        \        assert not quiet[\\'rows\\'], \\'Native account processes survived ordinary shutdown\\\
        '\\n        assert report[\\'metadata_qualified\\'], \\'Native descriptor metadata could not be\
        \ qualified; public shutdown was still exercised\\'\\n        report[\\'product_expected\\'] =\
        \ True\\n    except Exception as error:\\n        report[\\'error\\'] = repr(error)\\n    finally:\\\
        n        if outer is not None:\\n            if outer.poll() is None:\\n                native.stop(native.exact(outer.pid))\\\
        n            outer.wait(timeout=10)\\n        if callable(call):\\n            for user in users:\\\
        n                label = user[\\'role\\'] + \\'-down\\'\\n                if not any(row[\\'label\\\
        '] == label and row[\\'exit\\'] == 0 for row in report[\\'commands\\']):\\n                  \
        \  try:\\n                        recovered = call(user, \\'recovery-\\' + label, [\\'--json\\\
        ', \\'down\\'])\\n                        consumer.stopped(recovered)\\n                    except\
        \ Exception as error:\\n                        report[\\'cleanup\\'].append(dict(public_down_error=repr(error),\
        \ role=user[\\'role\\']))\\n        if users:\\n            try:\\n                leftover =\
        \ census(\\'cleanup-before\\')\\n                for proc in leftover[\\'rows\\']:\\n        \
        \            report[\\'cleanup\\'].append(dict(forced_owned=proc, after=native.stop(proc)))\\\
        n                    report[\\'product_expected\\'] = False\\n            except Exception as\
        \ error:\\n                report[\\'cleanup\\'].append(dict(census_error=repr(error)))\\n   \
        \     if service is not None:\\n            try:\\n                report[\\'service_after\\']\
        \ = service.close()\\n            except Exception as error:\\n                report[\\'cleanup\\\
        '].append(dict(service_error=repr(error)))\\n        for user in reversed(users):\\n         \
        \   try:\\n                assert not [x for x in census(\\'before-account-delete\\')[\\'rows\\\
        '] if x[\\'sid\\'] == user[\\'sid\\']]\\n                report[\\'cleanup\\'].append(accounts.remove(user))\\\
        n            except Exception as error:\\n                report[\\'cleanup\\'].append(dict(account=user[\\\
        'name\\'], profile_cleanup_error=repr(error)))\\n        report[\\'cleanup_complete\\'] = all((x.get(\\\
        'removed\\') for x in report[\\'cleanup\\'])) and len(report[\\'cleanup\\']) == len(users)\\n\
        \        save()\\n    assert report[\\'product_expected\\'] and report[\\'cleanup_complete\\'],\
        \ report\\n    print(json.dumps(dict(product_expected=True, cleanup_complete=True, source=a.source)))\\\
        nif __name__ == \\'__main__\\':\\n    main()\\n', 'ssh_service.py': '\"\"\"An exact newly registered\
        \ service using the built-in SSH server image.\"\"\"\\nimport json\\nimport os\\nfrom pathlib\
        \ import Path\\nimport secrets\\nimport subprocess\\nimport time\\nfrom native import exact, powershell,\
        \ quote, same, service_family, stop\\n\\n\\ndef run(command, timeout=30):\\n    value = subprocess.run(command,\
        \ capture_output=True, text=True, timeout=timeout)\\n    if value.returncode:\\n        raise\
        \ RuntimeError({\\'service_command\\': command, \\'exit\\': value.returncode,\\n             \
        \               \\'stdout\\': value.stdout, \\'stderr\\': value.stderr})\\n    return value\\\
        n\\n\\nclass Service:\\n    def __init__(self, config):\\n        self.config = Path(config)\\\
        n        self.name = \\'r5-sshd-\\' + secrets.token_hex(8)\\n        self.before = None\\n   \
        \     self.incumbent = None\\n        self.owned = None\\n        self.created = False\\n    \
        \    self.shell = None\\n\\n    @staticmethod\\n    def query(name):\\n        assert name ==\
        \ \\'sshd\\' or (name.startswith(\\'r5-sshd-\\') and name[8:].isalnum())\\n        script = \"\
        $s=Get-CimInstance Win32_Service -Filter \" + quote(\"Name=\\'\"+name+\"\\'\") + \"; \"\\n   \
        \     script += \"if($null -eq $s){ConvertTo-Json @{state=\\'absent\\'}}else{ConvertTo-Json @{state=$s.State;pid=[int]$s.ProcessId;image_path=$s.PathName;start_mode=$s.StartMode}\
        \ -Compress}\"\\n        return json.loads(powershell(script))\\n\\n    @staticmethod\\n    def\
        \ shell_selection():\\n        return powershell(\"$p=Get-ItemProperty -Path HKLM:\\\\\\\\SOFTWARE\\\
