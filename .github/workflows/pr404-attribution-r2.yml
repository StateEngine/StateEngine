        ': self.before, \\'fixture_service\\': self.name}\\n        if self.created:\\n            row\
        \ = self.query(self.name)\\n            if row.get(\\'pid\\'):\\n                observed = self.owned\
        \ or exact(row[\\'pid\\'])\\n                assert row[\\'pid\\'] == observed[\\'pid\\'] and\
        \ str(self.config) in observed[\\'command\\']\\n                family = service_family(observed)\\\
        n                result[\\'owned_family\\'] = family\\n                for member in sorted(family,\
