    - name: Authenticate and reuse the unchanged native image
      if: matrix.artifact != 0
      shell: python
      env:
        GH_TOKEN: ${{ github.token }}
      run: "import hashlib,json,os,shutil,subprocess,zipfile\nfrom pathlib import Path,PurePosixPath\n\
        root=Path(os.environ['RUNNER_TEMP'])/'review404'\nspec=json.loads(os.environ['SPEC'])\nassert\
        \ subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==spec['source']\nassert\
        \ not subprocess.check_output(['git','status','--porcelain'],text=True).strip()\napi='repos/StateEngine/StateEngine/actions/artifacts/'+str(spec['artifact'])\n\
        metadata=json.loads(subprocess.check_output(['gh','api',api]))\nassert metadata['digest']==spec['api_digest']\
        \ and not metadata['expired']\narchive=root/'input.zip'\nwith archive.open('wb') as stream:subprocess.run(['gh','api',api+'/zip'],stdout=stream,check=True)\n\
        assert 'sha256:'+hashlib.sha256(archive.read_bytes()).hexdigest()==spec['api_digest']\nwith zipfile.ZipFile(archive)\
        \ as package:\n    names=package.namelist();assert len(names)==len(set(names))\n    for member\
        \ in package.infolist():\n        name=PurePosixPath(member.filename)\n        assert not name.is_absolute()\
        \ and '..' not in name.parts and '\\\\' not in member.filename and ':' not in name.parts[0]\n\
        \        assert (member.external_attr>>16)&0o170000!=0o120000\n    manifest=json.loads(package.read('SHA256.json'))\n\
        \    manifest={name.replace('\\\\','/'):sha for name,sha in manifest.items()}\n    assert set(manifest)=={x.filename\
        \ for x in package.infolist() if not x.is_dir() and x.filename!='SHA256.json'}\n    for name,sha\
        \ in manifest.items():assert hashlib.sha256(package.read(name)).hexdigest()==sha\n    binary=package.read(spec['image_path']);build=json.loads(package.read(spec['build_path']))\n\
        assert hashlib.sha256(binary).hexdigest()==spec['image_sha']\nname='se.exe' if os.name=='nt' else\
        \ 'se'\nassert build['source_commit']==spec['source'] and build['target']==spec['target'] and\
        \ build['profile']=='distribution'\nassert build['files'][name]==spec['image_sha']\n(root/'build').mkdir();(root/'build'/name).write_bytes(binary);(root/'build'/name).chmod(0o700)\n\
        (root/'build/build.json').write_text(json.dumps(build,indent=2)+'\\n')\n(root/'image.json').write_text(json.dumps(dict(source=spec['source'],sha256=spec['image_sha'],bytes=len(binary)),indent=2)+'\\\
        n')\n(root/'input-provenance.json').write_text(json.dumps(dict(artifact=spec['artifact'],api_digest=spec['api_digest'],hashed_input_members=len(manifest),source=spec['source'],sha256=spec['image_sha']),indent=2)+'\\\
        n')\n"
    - name: Build the exact native distribution image
      shell: python
      run: 'import os,subprocess,json,hashlib

        from pathlib import Path

        root=Path(os.environ[''RUNNER_TEMP''])/''review404''

        source=os.environ[''SOURCE'']

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==source

        assert not subprocess.check_output([''git'',''status'',''--porcelain'',''--untracked-files=all''],text=True).strip()

        subprocess.run([''python'',''-B'',''scripts/release/build.py'',''--target'',os.environ[''TARGET''],''--out'',str(root/''build''),''--target-dir'',str(root/''target'')],check=True)

        image=root/''build''/(''se.exe'' if os.name==''nt'' else ''se'')

        (root/''image.json'').write_text(json.dumps(dict(source=source,sha256=hashlib.sha256(image.read_bytes()).hexdigest(),bytes=image.stat().st_size),indent=2)+''\n'')

        '
      if: matrix.artifact == 0
    - name: Judge public discovery, pairing and ordinary shutdown
      shell: python
      run: "import os,subprocess,sys\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'review404'\n\
        spec=__import__('json').loads(os.environ['SPEC'])\nif os.name!='nt':\n    import pwd\n    value=subprocess.run(['sudo','passwd','-S',pwd.getpwuid(os.geteuid()).pw_name],capture_output=True,text=True)\n\
        \    (root/'venue-account.json').write_text(__import__('json').dumps(dict(exit=value.returncode,stdout=value.stdout,stderr=value.stderr),indent=2)+'\\\
        n')\nscript='windows_control.py' if os.name=='nt' else 'unix_control.py'\ncommand=[sys.executable,'-B',str(root/'judge'/script),'--binary',str(root/'build'/('se.exe'\
        \ if os.name=='nt' else 'se')),'--root',str(root/'case'),'--source',os.environ['SOURCE']]\nif\
        \ os.name=='nt':command.extend(['--arm',os.environ['ARM']])\nsubprocess.run(command,check=True)\n"
    - name: Preserve failures and authenticateable native image bytes
      if: always()
      shell: python
      run: "import hashlib,json,os,shutil\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'review404'\n\
        out=root/'evidence';out.mkdir(exist_ok=True)\nfor name in ['judge','case/reports']:\n    path=root/name\n\
        \    if path.exists():shutil.copytree(path,out/name,dirs_exist_ok=True)\nfor name in ['input-provenance.json','venue-account.json','image.json','judge-manifest.json','build/build.json','build/se','build/se.exe']:\n\
        \    path=root/name\n    if path.is_file():\n        dest=out/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,dest)\n\
        manifest={p.relative_to(out).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*')\
        \ if p.is_file() and p.name!='SHA256.json'}\n(out/'SHA256.json').write_text(json.dumps(manifest,indent=2)+'\\\
        n')\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: pr404-attribution-${{ matrix.label }}
        path: ${{ runner.temp }}/review404/evidence
        if-no-files-found: error
