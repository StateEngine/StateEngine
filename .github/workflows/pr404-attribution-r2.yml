        \ self.before.get(\\'pid\\'):\\n            self.incumbent = exact(self.before[\\'pid\\'])\\n\
        \            assert self.incumbent[\\'state\\'] == \\'present\\'\\n        self.shell = self.shell_selection()\\\
        n        assert self.query(self.name)[\\'state\\'] == \\'absent\\', \\'Preserve an incumbent service\
        \ name\\'\\n        command = \\'\"\\' + str(binary) + \\'\" -f \"\\' + str(self.config) + \\\
        '\"\\'\\n        run([str(binary), \\'-t\\', \\'-f\\', str(self.config)])\\n        run([\\'sc.exe\\\
        ', \\'create\\', self.name, \\'type=\\', \\'own\\', \\'start=\\', \\'demand\\',\\n           \
        \  \\'obj=\\', \\'LocalSystem\\', \\'binPath=\\', command])\\n        self.created = True\\n \
