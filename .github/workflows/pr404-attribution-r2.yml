        'sid\\'])\\n        config = private / \\'sshd.conf\\'\\n        sftp = Path(os.environ[\\'WINDIR\\\
        ']) / \\'System32/OpenSSH/sftp-server.exe\\'\\n        assert sftp.is_file()\\n        config.write_text(\\\
        'Port \\' + str(port) + \\'\\\\nListenAddress 127.0.0.1\\\\nHostKey \\' + str(private / \\'host\\\
        ').replace(\\'\\\\\\\\\\', \\'/\\') + \\'\\\\nAllowUsers \\' + source[\\'name\\'] + \\' \\' +\
        \ destination[\\'name\\'] + \\'\\\\nAuthorizedKeysFile .ssh/authorized_keys\\\\nPubkeyAuthentication\
