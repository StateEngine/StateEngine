name: Independent SSH attribution and corrected custody controls
'on':
  push:
    branches:
    - prime/pr404-attribution-r2
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  pair:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: windows-base
          runner: windows-2025
          target: x86_64-pc-windows-msvc
          source: 9cefd498f3fc9edbdd7347bd8f370b6b81fb3c3c
          arm: base
          fixture: windows
          artifact: 14175114677
          api_digest: sha256:23f7aa113cf2842dc641a079e132a46706cd905a9080ceb23569c4b926b7867f
          image_path: build/se.exe
          build_path: build/build.json
          image_sha: eb89e59bb4b52b65ce1f952670ffa43797a6fca9ef93688b94d8edba109cf7b3
        - label: windows-head
          runner: windows-2025
          target: x86_64-pc-windows-msvc
          source: 7916a26779df759721f840ed8f5d719241c9d0a8
          arm: head
          fixture: windows
          artifact: 14174789416
          api_digest: sha256:b01771cd9314bb138fade091c88909c6ed1052ac90136de8a67edb183d1ed975
          image_path: build/se.exe
          build_path: build/build.json
          image_sha: 8d5df6724337e9ae9299d7087d04af1c95966487a7108b9de3640bbab2740c11
        - label: linux-base-original
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          source: 9cefd498f3fc9edbdd7347bd8f370b6b81fb3c3c
          arm: head
          fixture: linux-original
          artifact: 0
          api_digest: ''
          image_path: build/se
          build_path: build/build.json
          image_sha: ''
        - label: linux-main-original
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
          arm: head
          fixture: linux-original
          artifact: 14170521497
          api_digest: sha256:9d6539d67249a3ed8e318c1f21b9ea5405fc0a4f3865ad6df09c42a20756327d
          image_path: native-images/base/shipping/se
          build_path: base-build.json
          image_sha: 0ab37536c31e4e4d6b747800d7c4dccf85b3b499c8ee9fcec8c51c31b14455c7
        - label: linux-head-fixed
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          source: 7916a26779df759721f840ed8f5d719241c9d0a8
          arm: head
          fixture: linux-fixed
          artifact: 14175092022
          api_digest: sha256:b135c485d17f0cadccd3b8edb711da8dcfd6a7e30674d89d874814cffb57a89b
          image_path: build/se
          build_path: build/build.json
          image_sha: 31ba22de8128a2d1c933921947a12706640491f508100180b6935b4a7b828e81
    env:
      CARGO_BUILD_JOBS: '2'
      SOURCE: ${{ matrix.source }}
      TARGET: ${{ matrix.target }}
      ARM: ${{ matrix.arm }}
      SPEC: ${{ toJSON(matrix) }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      if: runner.os == 'Windows'
      with:
        arch: amd64
    - name: Preflight native SSH and image tools
      shell: python
      run: "import os,shutil,subprocess,sys\nassert shutil.which('ssh') and shutil.which('sftp')\nif sys.platform=='linux':\n\
        \    if not shutil.which('sshd'):subprocess.run(['sudo','apt-get','update'],check=True);subprocess.run(['sudo','apt-get','install','-y','openssh-server'],check=True)\n\
        \    subprocess.run(['sudo','install','-d','-m','755','/run/sshd'],check=True)\nif os.name!='nt':subprocess.run([sys.executable,'-m','pip','install','psutil==7.1.0'],check=True)\n\
        inspector='dumpbin.exe' if os.name=='nt' else 'otool' if sys.platform=='darwin' else 'readelf'\n\
        assert shutil.which(inspector)\n"
    - name: Stage frozen independent consumer controls
      shell: python
      run: "import hashlib,json,os\nfrom pathlib import Path\nroot=Path(os.environ['RUNNER_TEMP'])/'review404'\n\
        (root/'judge').mkdir(parents=True,exist_ok=False)\nvariants={'windows': {'windows_control.py':\
        \ '\"\"\"Reviewer-owned Windows public pairing from an actual native SSH login.\\n\\nNative account/service\
        \ custody helpers are reused; all product assertions live here.\\nProfile cleanup failures remain\
        \ separate from the witnessed product outcome.\\n\"\"\"\\nimport argparse, base64, json, os, secrets,\
        \ shutil, socket, subprocess, sys, time\\nfrom pathlib import Path\\nimport accounts, consumer,\
        \ native\\nfrom ssh_service import Service\\n\\ndef main():\\n    p = argparse.ArgumentParser()\\\
        n    p.add_argument(\\'--binary\\', type=Path, required=True)\\n    p.add_argument(\\'--root\\\
        ', type=Path, required=True)\\n    p.add_argument(\\'--source\\', required=True)\\n    p.add_argument(\\\
        '--arm\\', choices=[\\'base\\', \\'head\\'], required=True)\\n    a = p.parse_args()\\n    assert\
        \ sys.platform == \\'win32\\' and (not os.environ.get(\\'GH_TOKEN\\')) and (not os.environ.get(\\\
        'GITHUB_TOKEN\\'))\\n    root = a.root.resolve()\\n    root.mkdir(exist_ok=False)\\n    reports\
        \ = root / \\'reports\\'\\n    reports.mkdir()\\n    private = root / \\'private\\'\\n    private.mkdir()\\\
        n    accounts.private_acl(private, \\'S-1-5-32-544\\')\\n    report = dict(source=a.source, arm=a.arm,\
        \ product_expected=False, cleanup_complete=False, commands=[], census=[], cleanup=[], accounts=[],\
        \ scope=\\'real Windows public pairing via native SSH login, native executable copy, fresh nonadministrator\
        \ profiles; no installer or provider claim\\')\\n    users = []\\n    service = None\\n    outer\
        \ = None\\n    call = None\\n\\n    def save():\\n        (reports / \\'result.json\\').write_text(json.dumps(report,\
        \ indent=2) + \\'\\\\n\\')\\n\\n    def census(label):\\n        c = native.census([u[\\'sid\\\
        '] for u in users])\\n        c[\\'label\\'] = label\\n        report[\\'census\\'].append(c)\\\
        n        save()\\n        assert not c[\\'unreadable_owners\\'] and all((x[\\'native\\'][\\'state\\\
        '] != \\'unreadable\\' for x in c[\\'rows\\'])), c\\n        return c\\n    try:\\n        report[\\\
        'privileges\\'] = native.enable_fixture_privileges()\\n        for role in [\\'source\\', \\'destination\\\
        ']:\\n            user = accounts.create(role)\\n            users.append(user)\\n           \
        \ report[\\'accounts\\'].append(user)\\n            save()\\n            accounts.configure_groups(user)\\\
        n            profile = accounts.create_profile(user)\\n            for name in [\\'.ssh\\', \\\
        'review-pair\\', \\'review-work\\']:\\n                path = profile / name\\n              \
        \  path.mkdir()\\n                accounts.private_acl(path, user[\\'sid\\'])\\n            work\
        \ = profile / \\'review-pair\\'\\n            for name in [\\'consumer.py\\', \\'native.py\\']:\\\
        n                path = work / name\\n                shutil.copyfile(Path(__file__).parent /\
        \ name, path)\\n                accounts.private_acl(path, user[\\'sid\\'])\\n            binary\
        \ = work / \\'se.exe\\'\\n            shutil.copyfile(a.binary, binary)\\n            accounts.private_acl(binary,\
        \ user[\\'sid\\'])\\n            user[\\'binary\\'] = str(binary)\\n        source, destination\
        \ = users\\n        assert not census(\\'fresh-accounts\\')[\\'rows\\']\\n        keygen = Path(os.environ[\\\
        'WINDIR\\']) / \\'System32/OpenSSH/ssh-keygen.exe\\'\\n        for name in [\\'client\\', \\'host\\\
        ']:\\n            subprocess.run([str(keygen), \\'-q\\', \\'-t\\', \\'ed25519\\', \\'-N\\', \\\
        '\\', \\'-f\\', str(private / name)], capture_output=True, check=True, timeout=30)\\n        \
        \    accounts.private_acl(private / name, \\'S-1-5-32-544\\')\\n        with socket.socket() as\
        \ s:\\n            s.bind((\\'127.0.0.1\\', 0))\\n            port = s.getsockname()[1]\\n   \
        \     known = \\'[127.0.0.1]:\\' + str(port) + \\' \\' + (private / \\'host.pub\\').read_text()\\\
        n        for user in users:\\n            ssh = Path(user[\\'profile\\']) / \\'.ssh\\'\\n    \
        \        for name, data in [(\\'authorized_keys\\', (private / \\'client.pub\\').read_bytes()),\
        \ (\\'fixture-key\\', (private / \\'client\\').read_bytes()), (\\'known_hosts\\', known.encode())]:\\\
        n                path = ssh / name\\n                path.write_bytes(data)\\n               \
        \ accounts.private_acl(path, user[\\'sid\\'])\\n        config = Path(source[\\'profile\\']) /\
        \ \\'.ssh/config\\'\\n        config.write_text(\\'Host review-peer\\\\n HostName 127.0.0.1\\\\\
        n Port \\' + str(port) + \\'\\\\n User \\' + destination[\\'name\\'] + \\'\\\\n IdentityFile \\\
        ' + str(Path(source[\\'profile\\']) / \\'.ssh/fixture-key\\').replace(\\'\\\\\\\\\\', \\'/\\')\
