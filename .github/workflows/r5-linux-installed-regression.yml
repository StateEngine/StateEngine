name: Linux installed remote SSH regression
'on':
  push:
    branches:
    - prime/r5-linux-installed-r1
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: 3b68277f87f16e85139bb804db5f9e6f19812ca6
      ARCHIVE_RUN: '43666516231'
    steps:
    - name: Read authenticated archive provenance and download complete distribution
      shell: python
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'import json, os, pathlib, subprocess

        root=pathlib.Path(os.environ[''RUNNER_TEMP''])

        run=os.environ[''ARCHIVE_RUN'']; expected=os.environ[''EXPECTED_SOURCE'']

        r=json.loads(subprocess.check_output([''gh'',''api'',''repos/''+os.environ[''GITHUB_REPOSITORY'']+''/actions/runs/''+run],text=True))

        assert r[''head_sha'']==expected and r[''event'']==''workflow_dispatch'' and r[''conclusion'']==''success'', r

        (root/''r5-release-provenance.json'').write_text(json.dumps({''id'':r[''id''],''head_sha'':r[''head_sha''],''event'':r[''event''],''conclusion'':r[''conclusion''],''workflow_path'':r[''path'']},indent=2)+''\n'')

        subprocess.run([''gh'',''run'',''download'',run,''-R'',os.environ[''GITHUB_REPOSITORY''],''-n'',''release-assets'',''--dir'',str(root/''r5-release-assets'')],check=True)

        '
    - name: Materialize the private fixture controller
      shell: python
      run: 'from pathlib import Path

        import os

        script = ''"""Installed-archive Linux SSH regression in two fresh native accounts.\n\nNo provider credentials are
        used. Only reports are suitable for artifact upload;\nprivate SSH material and account homes never leave this disposable
        runner.\n"""\nimport argparse\nimport datetime\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path,
        PurePosixPath\nimport pwd\nimport secrets\nimport shlex\nimport shutil\nimport signal\nimport socket\nimport subprocess\nimport
        tarfile\nimport time\n\n\ndef digest(path):\n    with Path(path).open(\''rb\'') as stream:\n        return hashlib.file_digest(stream,
        \''sha256\'').hexdigest()\n\n\ndef birth(pid):\n    path = Path(\''/proc\'') / str(pid)\n    try:\n        fields
        = (path / \''stat\'').read_text().rsplit(\'') \'', 1)[1].split()\n        return {\''state\'': \''present\'', \''pid\'':
        pid, \''start\'': fields[19],\n                \''process_state\'': fields[0], \''parent\'': int(fields[1]),\n                \''uid\'':
        path.stat().st_uid,\n                \''command\'': (path / \''cmdline\'').read_bytes().replace(b\''\\0\'', b\'' \'').decode(errors=\''replace\'')}\n    except
        FileNotFoundError:\n        return {\''state\'': \''absent\'', \''pid\'': pid}\n    except OSError as error:\n        return
        {\''state\'': \''unreadable\'', \''pid\'': pid, \''error\'': str(error)}\n\n\ndef same(a, b):\n    return (a.get(\''state\'')
        == b.get(\''state\'') == \''present\''\n            and all(a[k] == b[k] for k in (\''pid\'', \''start\'', \''uid\'',
        \''command\'')))\n\n\ndef census(uid):\n    result = []\n    for path in Path(\''/proc\'').iterdir():\n        if
        not path.name.isdigit():\n            continue\n        try:\n            selected = path.stat().st_uid == uid\n        except
        FileNotFoundError:\n            continue\n        if selected:\n            result.append(birth(int(path.name)))\n    return
        result\n\n\ndef executing(row):\n    return row[\''state\''] == \''present\'' and row[\''process_state\''] != \''Z\''\n\n\ndef
        host(rows):\n    selected = [r for r in rows if executing(r) and \''--stateengine-private-runtime-bootstrap\'' in
        r[\''command\'']]\n    assert len(selected) == 1, {\''expected_one_native_host\'': selected, \''all_account_processes\'':
        rows}\n    return selected[0]\n\n\ndef run(command, *, stdin=None, timeout=60):\n    result = subprocess.run(command,
        input=stdin, text=True, capture_output=True, timeout=timeout)\n    if result.returncode:\n        raise RuntimeError({\''command\'':
        command, \''exit\'': result.returncode,\n                            \''stdout\'': result.stdout, \''stderr\'': result.stderr})\n    return
        result.stdout\n\n\ndef verify_archive(assets, source, work):\n    release = json.loads((assets / \''release.json\'').read_text())\n    assert
        release[\''source_commit\''] == source\n    package = release[\''packages\''][\''x86_64-unknown-linux-gnu\'']\n    archive
        = assets / package[\''file\'']\n    assert archive.stat().st_size == package[\''bytes\''] and digest(archive) == package[\''sha256\'']\n    with
        tarfile.open(archive, \''r:gz\'') as handle:\n        members = handle.getmembers()\n        names = [m.name for m
        in members]\n        assert len(names) == len(set(names))\n        for member in members:\n            name = PurePosixPath(member.name)\n            assert
        not name.is_absolute() and \''..\'' not in name.parts and \''\\\\\'' not in member.name\n            assert member.isfile()
        or member.isdir(), \''Archive links/devices are refused\''\n        handle.extractall(work, filter=\''data\'')\n    children
        = list(work.iterdir())\n    assert len(children) == 1 and children[0].is_dir()\n    bundle = children[0]\n    manifest
        = json.loads((bundle / \''manifest.json\'').read_text())\n    assert manifest[\''source_commit\''] == source and manifest[\''variant\'']
        == \''standalone\''\n    assert manifest[\''target\''] == \''x86_64-unknown-linux-gnu\'' and manifest[\''trust\'']
        == \''unsigned\''\n    observed = {str(p.relative_to(bundle)) for p in bundle.rglob(\''*\'') if p.is_file()}\n    assert
        observed == set(manifest[\''files\'']) | {\''manifest.json\'', \''SHA256SUMS\''}\n    for name, facts in manifest[\''files\''].items():\n        path
        = bundle / name\n        assert path.stat().st_size == facts[\''bytes\''] and digest(path) == facts[\''sha256\'']\n    payload
        = json.loads((bundle / \''build.json\'').read_text())\n    assert payload[\''source_commit\''] == source and payload[\''profile\'']
        == \''distribution\''\n    assert \''remote\'' in payload[\''features\'']\n    assert len([n for n in manifest[\''files\'']
        if n.startswith(\''remote-images/\'')]) == 3\n    return bundle, manifest, {\''source\'': source, \''archive_sha256\'':
        package[\''sha256\''],\n                               \''manifest_sha256\'': digest(bundle / \''manifest.json\'')}\n\n\ndef
        main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\''--assets\'', type=Path, required=True)\n    parser.add_argument(\''--source\'',
        required=True)\n    parser.add_argument(\''--root\'', type=Path, required=True)\n    parser.add_argument(\''--deadline-utc\'',
        required=True)\n    args = parser.parse_args()\n    assert os.geteuid() == 0, \''A disposable hosted Linux runner
        creates the fixture accounts\''\n    assert not os.environ.get(\''GH_TOKEN\'') and not os.environ.get(\''GITHUB_TOKEN\'')\n    deadline
        = datetime.datetime.fromisoformat(args.deadline_utc)\n    assert deadline.tzinfo is not None\n    root = args.root.resolve()\n    root.mkdir(mode=0o755,
        exist_ok=False)\n    reports = root / \''reports\''\n    reports.mkdir(mode=0o755)\n    private = root / \''private\''\n    private.mkdir(mode=0o700)\n    homes
        = root / \''homes\''\n    homes.mkdir(mode=0o711)\n    bundle, manifest, archive = verify_archive(args.assets.resolve(),
        args.source, root / \''archive\'')\n    report = {\''source\'': args.source, \''archive\'': archive, \''qualified\'':
        False, \''commands\'': [],\n              \''accounts\'': {}, \''cleanup\'': [], \''scope\'': \''Linux-to-Linux real
        SSH cold pairing, continuation and reconnect only\'',\n              \''unqualified\'': [\''Windows source/destination\'',
        \''real providers\'', \''remote launch/output/send/watch\'',\n                              \''four full-journey remote
        timings\'', \''macOS\'']}\n    users = []\n    daemon = None\n    child = None\n\n    def save():\n        (reports
        / \''result.json\'').write_text(json.dumps(report, indent=2) + \''\\n\'')\n\n    def remaining(maximum):\n        left
        = (deadline - datetime.datetime.now(datetime.timezone.utc)).total_seconds()\n        assert left > 0, \''Fixture deadline
        expired; remaining work is cleanup only\''\n        return min(maximum, left)\n\n    def owned_stop(observed):\n        current
        = birth(observed[\''pid\''])\n        if not executing(current):\n            assert current[\''state\''] != \''unreadable\'',
        current\n            return\n        assert same(observed, current), {\''refused_changed_birth\'': current, \''expected\'':
        observed}\n        os.kill(observed[\''pid\''], signal.SIGTERM)\n        until = time.monotonic() + 4\n        while
        time.monotonic() < until and executing(birth(observed[\''pid\''])):\n            time.sleep(0.05)\n        current
        = birth(observed[\''pid\''])\n        if executing(current):\n            assert same(observed, current)\n            os.kill(observed[\''pid\''],
        signal.SIGKILL)\n\n    try:\n        for role in (\''source\'', \''destination\''):\n            user = \''r5\'' +
        role[:1] + secrets.token_hex(4)\n            home = homes / user\n            run([\''useradd\'', \''--create-home\'',
        \''--home-dir\'', str(home), \''--shell\'', \''/bin/bash\'', user])\n            account = pwd.getpwnam(user)\n            users.append(account)\n            run([\''chpasswd\''],
        stdin=user + \'':synthetic-only-\'' + secrets.token_hex(24) + \''\\n\'')\n            report[\''accounts\''][role]
        = {\''name\'': user, \''uid\'': account.pw_uid, \''home\'': str(home)}\n            assert not census(account.pw_uid)\n            (home
        / \''.ssh\'').mkdir(mode=0o700)\n            os.chown(home / \''.ssh\'', account.pw_uid, account.pw_gid)\n            #
        Prove the fresh account can read and execute the actual archive before installation.\n            run([\''runuser\'',
        \''-u\'', user, \''--\'', \''test\'', \''-r\'', str(bundle / \''install.sh\'')])\n            run([\''runuser\'',
        \''-u\'', user, \''--\'', \''test\'', \''-x\'', str(bundle / \''se\'')])\n            command = [\''runuser\'', \''-u\'',
        user, \''--\'', \''env\'', \''-i\'', \''HOME=\'' + str(home),\n                       \''USER=\'' + user, \''LOGNAME=\''
        + user, \''PATH=/usr/bin:/bin\'',\n                       \''/bin/sh\'', str(bundle / \''install.sh\'')]\n            installed
        = subprocess.run(command, cwd=home, text=True, capture_output=True, timeout=remaining(180))\n            (reports
        / (role + \''-install.stdout\'')).write_text(installed.stdout)\n            (reports / (role + \''-install.stderr\'')).write_text(installed.stderr)\n            assert
        installed.returncode == 0, {\''installer_exit\'': installed.returncode, \''role\'': role}\n            binaries =
        {n: facts for n, facts in manifest[\''files\''].items()\n                        if n == \''se\'' or n.startswith(\''remote-images/\'')}\n            assert
        len(binaries) == 4\n            for name, facts in binaries.items():\n                assert digest(home / \''.local/bin\''
        / name) == facts[\''sha256\'']\n            install_record = home / \''.local/state/stateengine/standalone-install.json\''\n            assert
        install_record.is_file()\n            report[\''accounts\''][role][\''installation_record_sha256\''] = digest(install_record)\n            report[\''accounts\''][role][\''installed_images\'']
        = {n: f[\''sha256\''] for n, f in binaries.items()}\n            save()\n        source, destination = users\n        key
        = private / \''client-key\''\n        server_key = private / \''server-key\''\n        run([\''ssh-keygen\'', \''-q\'',
        \''-t\'', \''ed25519\'', \''-N\'', \''\'', \''-f\'', str(key)])\n        run([\''ssh-keygen\'', \''-q\'', \''-t\'',
        \''ed25519\'', \''-N\'', \''\'', \''-f\'', str(server_key)])\n        with socket.socket() as listener:\n            listener.bind((\''127.0.0.1\'',
        0))\n            port = listener.getsockname()[1]\n        known = private / \''known_hosts\''\n        known.write_text(\''[127.0.0.1]:\''
        + str(port) + \'' \'' + server_key.with_suffix(\''.pub\'').read_text())\n        for account in users:\n            ssh
        = Path(account.pw_dir) / \''.ssh\''\n            for name, data, mode in [(\''authorized_keys\'', key.with_suffix(\''.pub\'').read_bytes(),
        0o600),\n                                     (\''known_hosts\'', known.read_bytes(), 0o600),\n                                     (\''fixture_key\'',
        key.read_bytes(), 0o600)]:\n                target = ssh / name\n                target.write_bytes(data)\n                target.chmod(mode)\n                os.chown(target,
        account.pw_uid, account.pw_gid)\n            config = ssh / \''config\''\n            config.write_text(\''Host fixture-destination\\n
        HostName 127.0.0.1\\n Port \'' + str(port)\n                              + \''\\n User \'' + destination.pw_name
        + \''\\n BatchMode yes\\n StrictHostKeyChecking yes\\n\''\n                              + \'' UserKnownHostsFile
        \'' + str(ssh / \''known_hosts\'') + \''\\n IdentityFile \''\n                              + str(ssh / \''fixture_key\'')
        + \''\\n IdentitiesOnly yes\\n ControlMaster no\\n ControlPath none\\n\'')\n            config.chmod(0o600)\n            os.chown(config,
        account.pw_uid, account.pw_gid)\n        config = private / \''sshd_config\''\n        config.write_text(f\''Port
        {port}\\nListenAddress 127.0.0.1\\nHostKey {server_key}\\n\''\n                          f\''PidFile {private / "sshd.pid"}\\nAllowUsers
        {source.pw_name} {destination.pw_name}\\n\''\n                          \''AuthorizedKeysFile .ssh/authorized_keys\\nPasswordAuthentication
        no\\n\''\n                          \''KbdInteractiveAuthentication no\\nPubkeyAuthentication yes\\nAuthenticationMethods
        publickey\\n\''\n                          \''UsePAM yes\\nStrictModes yes\\nPermitRootLogin no\\nAllowTcpForwarding
        local\\n\''\n                          \''GatewayPorts no\\nX11Forwarding no\\nPrintMotd no\\nLogLevel VERBOSE\\n\'')\n        Path(\''/run/sshd\'').mkdir(exist_ok=True)\n        run([\''/usr/sbin/sshd\'',
        \''-t\'', \''-f\'', str(config)])\n        daemon_log = (reports / \''sshd.stderr\'').open(\''w\'')\n        daemon
        = subprocess.Popen([\''/usr/sbin/sshd\'', \''-D\'', \''-e\'', \''-f\'', str(config)],\n                                  stdin=subprocess.DEVNULL,
        stdout=subprocess.DEVNULL, stderr=daemon_log)\n        daemon_birth = birth(daemon.pid)\n        report[\''sshd\'']
        = daemon_birth\n        args_ssh = [\''ssh\'', \''-i\'', str(key), \''-p\'', str(port), \''-oBatchMode=yes\'', \''-oIdentitiesOnly=yes\'',\n                    \''-oStrictHostKeyChecking=yes\'',
        \''-oUserKnownHostsFile=\'' + str(known),\n                    \''-oControlMaster=no\'', \''-oControlPath=none\'',
        \''-oControlPersist=no\'', \''-oConnectTimeout=8\'']\n        # SSH readiness uses a real key login and is retained
        separately from product timing.\n        ready = False\n        for attempt in range(10):\n            probe = subprocess.run([*args_ssh,
        source.pw_name + \''@127.0.0.1\'', \''true\''],\n                                   text=True, capture_output=True,
        timeout=remaining(12))\n            report.setdefault(\''ssh_readiness\'', []).append({\''attempt\'': attempt, \''exit\'':
        probe.returncode,\n                                                          \''stderr\'': probe.stderr})\n            if
        probe.returncode == 0:\n                ready = True\n                break\n            assert daemon.poll() is None,
        \''Owned SSH service exited\''\n            time.sleep(0.2)\n        assert ready\n\n        def command(role, label,
        arguments, *, structured=True, require_success=True, observe=False):\n            nonlocal child\n            account
        = source if role == \''source\'' else destination\n            executable = str(Path(account.pw_dir) / \''.local/bin/se\'')\n            remote
        = \''cd \'' + shlex.quote(account.pw_dir) + \'' && \'' + shlex.join([executable, *arguments])\n            row = {\''label\'':
        label, \''role\'': role, \''arguments\'': arguments,\n                   \''started_utc\'': datetime.datetime.now(datetime.timezone.utc).isoformat()}\n            report[\''commands\''].append(row)\n            started
        = time.monotonic()\n            with (reports / (label + \''.stdout\'')).open(\''w\'') as stdout, (reports / (label
        + \''.stderr\'')).open(\''w\'') as stderr:\n                child = subprocess.Popen([*args_ssh, account.pw_name +
        \''@127.0.0.1\'', remote],\n                                         stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr)\n                observed
        = birth(child.pid)\n                row[\''ssh_birth\''] = observed\n                end = time.monotonic() + remaining(120)\n                samples
        = []\n                while child.poll() is None:\n                    if observe:\n                        samples.append({\''seconds\'':
        time.monotonic() - started,\n                                        \''destination_processes\'': census(destination.pw_uid),\n                                        \''source_processes\'':
        census(source.pw_uid)})\n                    if time.monotonic() >= end:\n                        owned_stop(observed)\n                        child.wait(timeout=10)\n                        raise
        TimeoutError(\''Owned SSH consumer deadline: \'' + label)\n                    time.sleep(0.05)\n                row.update(exit=child.returncode,
        elapsed_seconds=time.monotonic() - started,\n                           ssh_reaped=True, ssh_after=birth(child.pid))\n                child
        = None\n            if observe:\n                (reports / (label + \''-processes.json\'')).write_text(json.dumps(samples,
        indent=2) + \''\\n\'')\n                native = [r for sample in samples for r in sample[\''destination_processes\'']\n                          if
        executing(r) and \''--stateengine-private-runtime-bootstrap\'' in r[\''command\'']]\n                assert native,
        \''No destination host birth was observed before the original SSH consumer exited\''\n                row[\''destination_host_before_source_exit\'']
        = native[-1]\n            save()\n            if require_success:\n                assert row[\''exit\''] == 0, {\''failed_public_consumer\'':
        label, \''exit\'': row[\''exit\'']}\n            else:\n                assert row[\''exit\''] != 0, \''Disconnected
        remote call unexpectedly succeeded\''\n            if structured:\n                value = json.loads((reports / (label
        + \''.stdout\'')).read_text())\n                assert (value.get(\''schema\'') != \''se.error/v1\'') == require_success,
        {\''unexpected_envelope\'': label, \''value\'': value}\n                if not require_success:\n                    assert
        value.get(\''code\'') and value.get(\''exit\'') == row[\''exit\'']\n                    assert value.get(\''remedy\''),
        \''A structured refusal must carry its remedy\''\n                return value\n            return row\n\n        for
        role in (\''source\'', \''destination\''):\n            for name, argv in [(\''help\'', [\''--help\'']), (\''remote-add-help\'',
        [\''remote\'', \''add\'', \''--help\'']),\n                               (\''remote-list-help\'', [\''remote\'',
        \''list\'', \''--help\'']),\n                               (\''remote-disconnect-help\'', [\''remote\'', \''disconnect\'',
        \''--help\'']),\n                               (\''init-help\'', [\''init\'', \''--help\'']), (\''down-help\'', [\''down\'',
        \''--help\''])]:\n                command(role, role + \''-\'' + name, argv, structured=False)\n        work = Path(source.pw_dir)
        / \''work\''\n        work.mkdir(mode=0o700)\n        os.chown(work, source.pw_uid, source.pw_gid)\n        command(\''source\'',
        \''source-init\'', [\''--json\'', \''init\'', \''--repo\'', str(work), \''--name\'', \''ssh-regression\''])\n        cold
        = census(destination.pw_uid)\n        assert not any(executing(r) for r in cold)\n        assert not (Path(destination.pw_dir)
        / \''.stateengine-runtime\'').exists()\n        report[\''destination_before_pair\''] = cold\n        command(\''source\'',
        \''pair\'', [\''--json\'', \''remote\'', \''add\'', \''fixture-destination\'', \''--name\'', \''fixture\''], observe=True)\n        live
        = host(census(destination.pw_uid))\n        pair = next(r for r in report[\''commands\''] if r[\''label\''] == \''pair\'')\n        assert
        same(pair[\''destination_host_before_source_exit\''], live)\n        image = Path(\''/proc\'') / str(live[\''pid\''])
        / \''exe\''\n        assert digest(image) == manifest[\''files\''][\''se\''][\''sha256\'']\n        report[\''destination_after_source_exit\'']
        = live\n        command(\''source\'', \''continue\'', [\''--json\'', \''remote\'', \''list\'', \''--host\'', \''fixture\''])\n        command(\''source\'',
        \''disconnect\'', [\''--json\'', \''remote\'', \''disconnect\'', \''--name\'', \''fixture\''])\n        assert same(live,
        host(census(destination.pw_uid)))\n        command(\''source\'', \''disconnected-refusal\'', [\''--json\'', \''remote\'',
        \''list\'', \''--host\'', \''fixture\''], require_success=False)\n        command(\''source\'', \''reconnect\'', [\''--json\'',
        \''remote\'', \''add\'', \''fixture-destination\'', \''--name\'', \''fixture\''])\n        command(\''source\'', \''continued-after-reconnect\'',
        [\''--json\'', \''remote\'', \''list\'', \''--host\'', \''fixture\''])\n        assert same(live, host(census(destination.pw_uid)))\n        command(\''destination\'',
        \''destination-down\'', [\''--json\'', \''down\''])\n        command(\''source\'', \''source-down\'', [\''--json\'',
        \''down\''])\n        end = time.monotonic() + remaining(10)\n        while any(executing(r) for u in users for r
        in census(u.pw_uid)) and time.monotonic() < end:\n            time.sleep(0.1)\n        report[\''after_down\''] =
        {u.pw_name: census(u.pw_uid) for u in users}\n        assert not any(executing(r) for rows in report[\''after_down\''].values()
        for r in rows)\n        assert not same(live, birth(live[\''pid\''])) or not executing(birth(live[\''pid\'']))\n        report[\''qualified\'']
        = True\n    except Exception as error:\n        report[\''error\''] = repr(error)\n        raise\n    finally:\n        if
        child is not None:\n            observed = birth(child.pid)\n            if executing(observed):\n                owned_stop(observed)\n            child.wait(timeout=10)\n        #
        Product down must prove ordinary closure. Forced recovery never turns a failed journey green.\n        for account
        in reversed(users):\n            try:\n                rows = census(account.pw_uid)\n                assert not any(r[\''state\'']
        == \''unreadable\'' for r in rows)\n                for row in rows:\n                    if executing(row):\n                        owned_stop(row)\n                        report[\''qualified\'']
        = False\n                        report[\''cleanup\''].append({\''forced_owned_birth\'': row})\n                remaining_rows
        = census(account.pw_uid)\n                assert not any(executing(r) for r in remaining_rows), remaining_rows\n                run([\''userdel\'',
        account.pw_name])\n                home = Path(account.pw_dir)\n                assert home.parent == homes and not
        home.is_symlink()\n                shutil.rmtree(home)\n                report[\''cleanup\''].append({\''account\'':
        account.pw_name, \''removed\'': True,\n                                          \''final_processes\'': remaining_rows})\n            except
        Exception as error:\n                report[\''qualified\''] = False\n                report[\''cleanup\''].append({\''account\'':
        account.pw_name, \''error\'': repr(error)})\n        if daemon is not None:\n            try:\n                owned_stop(daemon_birth)\n                daemon.wait(timeout=10)\n                report[\''sshd_after\'']
        = birth(daemon.pid)\n                assert report[\''sshd_after\''][\''state\''] == \''absent\''\n            except
        Exception as error:\n                report[\''qualified\''] = False\n                report[\''cleanup\''].append({\''sshd_error\'':
        repr(error)})\n        report[\''completed_utc\''] = datetime.datetime.now(datetime.timezone.utc).isoformat()\n        save()\n    assert
        report[\''qualified\''], \''Regression or cleanup failed; retained reports explain it\''\n    print(json.dumps({\''qualified\'':
        True, \''source\'': args.source, \''reports\'': str(reports)}))\n\n\nif __name__ == \''__main__\'':\n    main()\n''

        root = Path(os.environ["RUNNER_TEMP"])

        (root / "r5-linux-ssh-regression.py").write_text(script)

        '
    - name: Run installed consumers through a disposable real SSH service
      shell: python
