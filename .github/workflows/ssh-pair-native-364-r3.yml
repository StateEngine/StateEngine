name: Native SSH pairing with SFTP dependency
'on':
  workflow_dispatch: {}
  push:
    branches:
    - prime/ssh-pair-native-364-r3
permissions:
  contents: read
jobs:
  pair:
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: windows-head
          runner: windows-2025
          target: x86_64-pc-windows-msvc
          source: 7916a26779df759721f840ed8f5d719241c9d0a8
          arm: head
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
        components: rust-docs, llvm-tools-preview
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      if: runner.os == 'Windows'
      with:
        arch: amd64
    - name: Materialize frozen author validation driver
      shell: python
      run: |
        import hashlib, json, os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP'])/'ssh-pair-driver'
        root.mkdir(exist_ok=False)
        files = {'accounts.py': '"""Native profiles and private ACLs for exact newly created fixture accounts."""\nimport ctypes\nfrom ctypes import wintypes as W\nimport json\nfrom pathlib import Path\nimport secrets\nimport time\nimport winreg\nfrom native import powershell, quote\n\nU = ctypes.WinDLL(\'userenv\', use_last_error=True)\nU.CreateProfile.argtypes = [W.LPCWSTR, W.LPCWSTR, W.LPWSTR, W.DWORD]\nU.CreateProfile.restype = ctypes.c_long\nU.DeleteProfileW.argtypes = [W.LPCWSTR, W.LPCWSTR, W.LPCWSTR]\nU.DeleteProfileW.restype = W.BOOL\nPROFILE_KEY = \'SOFTWARE/Microsoft/Windows NT/CurrentVersion/ProfileList/\'.replace(\'/\', chr(92))\n\n\ndef create(role):\n    name = \'r5\' + role[0] + secrets.token_hex(4)\n    # Generated only in the disposable machine; never returned, logged or uploaded.\n    script = "$password=ConvertTo-SecureString (\'Synthetic-only!\'+[Guid]::NewGuid().ToString(\'N\')) -AsPlainText -Force; "\n    script += "$u=New-LocalUser -Name " + quote(name) + " -Password $password -AccountNeverExpires -PasswordNeverExpires; "\n    script += "ConvertTo-Json @{name=$u.Name;sid=$u.SID.Value} -Compress"\n    value = json.loads(powershell(script))\n    assert value[\'name\'] == name and value[\'sid\'].startswith(\'S-1-5-21-\')\n    return dict(value, role=role, profile=None)\n\n\ndef configure_groups(account):\n    script = "$u=Get-LocalUser -Name " + quote(account[\'name\']) + "; if($u.SID.Value -ne " + quote(account[\'sid\']) + "){throw \'fixture SID changed\'}; "\n    script += "if(-not @(Get-LocalGroupMember -SID \'S-1-5-32-545\' | Where-Object {$_.SID.Value -eq $u.SID.Value}).Count){Add-LocalGroupMember -SID \'S-1-5-32-545\' -Member $u}; "\n    script += "$g=Get-LocalGroup -Name \'OpenSSH Users\' -ErrorAction SilentlyContinue; if($g){Add-LocalGroupMember -Group $g -Member $u}; "\n    script += "if(@(Get-LocalGroupMember -SID \'S-1-5-32-544\' | Where-Object {$_.SID.Value -eq $u.SID.Value}).Count){throw \'fixture account must not be an administrator\'}"\n    powershell(script)\n\n\ndef create_profile(account):\n    output = ctypes.create_unicode_buffer(260)\n    result = U.CreateProfile(account[\'sid\'], account[\'name\'], output, len(output))\n    if result < 0:\n        raise OSError(result, \'CreateProfile failed for the exact fixture SID\')\n    profile = Path(output.value)\n    account[\'profile\'] = str(profile)\n    assert profile.is_absolute() and profile.name.lower() == account[\'name\'].lower()\n    with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, PROFILE_KEY + account[\'sid\']) as key:\n        registered, _ = winreg.QueryValueEx(key, \'ProfileImagePath\')\n    assert Path(registered).resolve() == profile.resolve()\n    return profile\n\n\ndef private_acl(path, owner):\n    path = Path(path)\n    kind = \'DirectorySecurity\' if path.is_dir() else \'FileSecurity\'\n    inherit = "\'ContainerInherit,ObjectInherit\',\'None\'," if path.is_dir() else \'\'\n    script = "$a=[Security.AccessControl." + kind + "]::new();$a.SetAccessRuleProtection($true,$false); "\n    script += "$a.SetOwner([Security.Principal.SecurityIdentifier]::new(" + quote(owner) + ")); "\n    for sid in dict.fromkeys((owner, \'S-1-5-18\', \'S-1-5-32-544\')):\n        script += "$a.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]::new(" + quote(sid) + "),\'FullControl\'," + inherit + "\'Allow\')); "\n    script += "Set-Acl -LiteralPath " + quote(path) + " -AclObject $a"\n    powershell(script)\n\n\ndef remove(account):\n    current = json.loads(powershell("$u=Get-LocalUser -Name " + quote(account[\'name\']) + "; ConvertTo-Json @{name=$u.Name;sid=$u.SID.Value} -Compress"))\n    assert current[\'sid\'] == account[\'sid\'] and current[\'name\'] == account[\'name\']\n    profile = account.get(\'profile\')\n    if not profile:\n        try:\n            with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, PROFILE_KEY + account[\'sid\']) as key:\n                profile, _ = winreg.QueryValueEx(key, \'ProfileImagePath\')\n            assert Path(profile).is_absolute() and Path(profile).name.lower() == account[\'name\'].lower()\n        except FileNotFoundError:\n            pass\n    result = {\'name\': account[\'name\'], \'sid\': account[\'sid\'], \'profile\': profile}\n    result[\'native_hives_before_delete\'] = {}\n    for suffix in (\'\', \'_Classes\'):\n        try:\n            with winreg.OpenKey(winreg.HKEY_USERS, account[\'sid\']+suffix):\n                result[\'native_hives_before_delete\'][suffix or \'user\'] = \'loaded\'\n        except FileNotFoundError:\n            result[\'native_hives_before_delete\'][suffix or \'user\'] = \'absent\'\n    if profile:\n        end = time.monotonic() + 30\n        attempts = []\n        while True:\n            ok = U.DeleteProfileW(account[\'sid\'], None, None)\n            error = 0 if ok else ctypes.get_last_error()\n            attempts.append({\'ok\': bool(ok), \'native_error\': error})\n            if ok or time.monotonic() >= end:\n                break\n            time.sleep(1)\n        result[\'profile_delete_attempts\'] = attempts\n        assert ok, {\'profile_deletion_failed\': result}\n        assert not Path(profile).exists(), \'Deleted fixture profile directory still exists\'\n        try:\n            with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, PROFILE_KEY + account[\'sid\']):\n                raise AssertionError(\'Deleted fixture profile registry entry still exists\')\n        except FileNotFoundError:\n            pass\n    powershell("Remove-LocalUser -Name " + quote(account[\'name\']) + "; if(Get-LocalUser -Name " + quote(account[\'name\']) + " -ErrorAction SilentlyContinue){throw \'fixture account survived deletion\'}")\n    result[\'removed\'] = True\n    return result\n', 'common.py': '"""Shared first public product call for hosted execution and box preflight."""\ndef init_arguments(repository):\n    return [\'--json\', \'init\', \'--repo\', str(repository), \'--name\', \'ssh-regression\']\n', 'driver.py': '"""One-arm/one-pair native driver; Linux preflight stops after public init."""\nimport argparse\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\nfrom common import init_arguments\n\n\ndef main():\n    if \'--preflight\' not in sys.argv:\n        import regression\n        regression.main()\n        return\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\'--preflight\', action=\'store_true\')\n    parser.add_argument(\'--binary\', required=True, type=Path)\n    parser.add_argument(\'--root\', required=True, type=Path)\n    parser.add_argument(\'--source\', required=True)\n    parser.add_argument(\'--arm\', required=True, choices=[\'base\', \'head\'])\n    parser.add_argument(\'--pairs\', type=int, required=True)\n    args = parser.parse_args()\n    assert args.pairs == 1\n    args.root.mkdir(exist_ok=False)\n    repository = args.root/\'repository\'\n    repository.mkdir()\n    environment = {key: value for key, value in os.environ.items()\n                   if key not in (\'SE_SESSION\', \'CLAUDECODE\', \'CODEX_THREAD_ID\', \'CODEX_CI\')\n                   and not key.startswith((\'STATEENGINE_\', \'SECODE_\'))}\n    environment[\'SE_HOME\'] = str(args.root/\'private-state\')\n    argv = [str(args.binary), *init_arguments(repository)]\n    with (args.root/\'init.stdout\').open(\'xb\') as out, (args.root/\'init.stderr\').open(\'xb\') as err:\n        completed = subprocess.run(argv, env=environment, stdout=out, stderr=err, timeout=40)\n    response = json.loads((args.root/\'init.stdout\').read_text())\n    report = {\'source\': args.source, \'arm\': args.arm, \'pairs\': args.pairs,\n              \'first_product_call\': argv, \'exit\': completed.returncode,\n              \'binary_sha256\': hashlib.file_digest(args.binary.open(\'rb\'), \'sha256\').hexdigest(),\n              \'public_response\': response, \'windows_qualified\': False,\n              \'not_exercised\': [\'Windows accounts, service, install, nested SSH and pairing\']}\n    (args.root/\'preflight.json\').write_text(json.dumps(report, indent=2)+\'\\n\')\n    assert completed.returncode == 0 and response.get(\'schema\') != \'se.error/v1\'\n    print(json.dumps(report))\n\n\nif __name__ == \'__main__\':\n    main()\n', 'install.py': '"""Native fixture installer; copy into the isolated venue and run during admission.\n\nThis invokes the archive\'s own installer and independently reads installed images.\nIt performs no VM or container management and never selects a different home.\n"""\nfrom pathlib import Path, PurePosixPath\nimport argparse\nimport ctypes\nimport datetime\nimport hashlib\nimport json\nimport os\nimport subprocess\nimport sys\nimport tarfile\nimport uuid\nimport zipfile\n\n\ndef digest(path):\n    with path.open(\'rb\') as stream:\n        return hashlib.file_digest(stream, \'sha256\').hexdigest()\n\n\ndef known_folder(folder):\n    # The token\'s native known-folder lookup must agree with installer inputs.\n    class Guid(ctypes.Structure):\n        _fields_ = [(\'bytes\', ctypes.c_ubyte * 16)]\n    guid = Guid((ctypes.c_ubyte * 16).from_buffer_copy(uuid.UUID(folder).bytes_le))\n    result = ctypes.c_wchar_p()\n    get = ctypes.windll.shell32.SHGetKnownFolderPath\n    get.argtypes = [ctypes.POINTER(Guid), ctypes.c_uint32, ctypes.c_void_p,\n                    ctypes.POINTER(ctypes.c_wchar_p)]\n    get.restype = ctypes.c_long\n    status = get(ctypes.byref(guid), 0, None, ctypes.byref(result))\n    if status != 0:\n        raise OSError(status, \'Native known-folder lookup failed\')\n    try:\n        return Path(result.value)\n    finally:\n        free = ctypes.windll.ole32.CoTaskMemFree\n        free.argtypes = [ctypes.c_void_p]\n        free.restype = None\n        free(ctypes.cast(result, ctypes.c_void_p))\n\n\ndef native_install_paths():\n    if sys.platform == \'win32\':\n        profile = known_folder(\'5E6C858F-0E22-4760-9AFE-EA3317B67173\')\n        local = known_folder(\'F1B32785-6FBA-4FCF-9D55-7B8E7F157091\')\n        assert Path(os.environ[\'USERPROFILE\']).resolve() == profile.resolve()\n        assert Path(os.environ[\'LOCALAPPDATA\']).resolve() == local.resolve()\n        root = local / \'StateEngine\'\n        return profile, root / \'bin\', root\n    import pwd\n    account = pwd.getpwuid(os.geteuid())\n    assert account.pw_uid != 0, \'Linux fixture must be the actual non-root SSH user\'\n    profile = Path(account.pw_dir)\n    assert Path(os.environ[\'HOME\']).resolve() == profile.resolve()\n    assert not os.environ.get(\'XDG_STATE_HOME\'), \'Use the native account default\'\n    return profile, profile / \'.local/bin\', profile / \'.local/state/stateengine\'\n\n\ndef safe_name(name):\n    path = PurePosixPath(name)\n    assert not path.is_absolute() and \'..\' not in path.parts and \'\\\\\' not in name\n    assert path.parts and \':\' not in path.parts[0]\n    return path\n\n\ndef unpack(archive, destination):\n    destination.mkdir(mode=0o700, exist_ok=False)\n    if zipfile.is_zipfile(archive):\n        with zipfile.ZipFile(archive) as container:\n            names = set()\n            for member in container.infolist():\n                assert member.filename not in names, \'duplicate archive member\'\n                names.add(member.filename)\n                safe_name(member.filename)\n                mode = member.external_attr >> 16\n                assert mode & 0o170000 != 0o120000, \'archive symlink refused\'\n            container.extractall(destination)\n    else:\n        with tarfile.open(archive, \'r:gz\') as container:\n            names = set()\n            for member in container.getmembers():\n                assert member.name not in names, \'duplicate archive member\'\n                names.add(member.name)\n                safe_name(member.name)\n                assert member.isfile() or member.isdir(), \'archive link/device refused\'\n            container.extractall(destination, filter=\'data\')\n    children = list(destination.iterdir())\n    assert len(children) == 1 and children[0].is_dir()\n    return children[0]\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\'--archive\', required=True, type=Path)\n    parser.add_argument(\'--sha256\', required=True)\n    parser.add_argument(\'--source\', required=True)\n    parser.add_argument(\'--evidence\', required=True, type=Path)\n    args = parser.parse_args()\n    now = datetime.datetime.now(datetime.timezone.utc)\n    assert sys.platform == \'win32\', \'Hosted native Windows installer only\'\n    assert not any(os.environ.get(k) for k in (\'SE_HOME\', \'STATEENGINE_HOME\'))\n    assert digest(args.archive) == args.sha256, \'archive identity changed\'\n    profile, binary_root, data = native_install_paths()\n    assert not (data / \'standalone-install.json\').exists(), \'Preserve an incumbent\'\n    assert not (binary_root / (\'se.exe\' if sys.platform == \'win32\' else \'se\')).exists()\n    args.evidence.mkdir(mode=0o700, exist_ok=False)\n    bundle = unpack(args.archive, args.evidence / \'archive\')\n    manifest = json.loads((bundle / \'manifest.json\').read_text())\n    assert manifest[\'source_commit\'] == args.source\n    assert manifest[\'variant\'] == \'standalone\' and manifest[\'trust\'] == \'unsigned\'\n    assert manifest[\'target\'] == \'x86_64-pc-windows-msvc\'\n    for name, facts in manifest[\'files\'].items():\n        safe_name(name)\n        path = bundle / name\n        assert path.stat().st_size == facts[\'bytes\'] and digest(path) == facts[\'sha256\']\n    build = json.loads((bundle / \'build.json\').read_text())\n    assert build[\'source_commit\'] == args.source and build[\'profile\'] == \'distribution\'\n    assert \'remote\' in build[\'features\']\n    if sys.platform == \'win32\':\n        command = [\'powershell.exe\', \'-NoLogo\', \'-NoProfile\', \'-NonInteractive\',\n                   \'-ExecutionPolicy\', \'Bypass\', \'-File\', str(bundle / \'install.ps1\')]\n    else:\n        command = [\'/bin/sh\', str(bundle / \'install.sh\')]\n    with (args.evidence / \'install.stdout\').open(\'w\') as out, \\\n            (args.evidence / \'install.stderr\').open(\'w\') as err:\n        result = subprocess.run(command, cwd=profile, stdout=out, stderr=err, timeout=180)\n    report = {\'source\': args.source, \'archive_sha256\': args.sha256,\n              \'native_profile\': str(profile), \'binary_root\': str(binary_root),\n              \'data\': str(data), \'install_exit\': result.returncode, \'installed\': {}}\n    (args.evidence / \'installation.json\').write_text(json.dumps(report, indent=2) + \'\\n\')\n    assert result.returncode == 0, \'Archive-local installer failed; preserve its result\'\n    record = data / \'standalone-install.json\'\n    assert record.is_file()\n    # Installation records contain custody metadata, not provider credentials.\n    (args.evidence / \'standalone-install.json\').write_bytes(record.read_bytes())\n    selected = {k: v for k, v in manifest[\'files\'].items()\n                if k.startswith(\'remote-images/\') or k in (\'se\', \'se.exe\')}\n    assert \'se.exe\' in selected and len(selected) == 1, \'Native-only matching-platform archive\'\n    for name, facts in selected.items():\n        installed = binary_root / name\n        assert installed.stat().st_size == facts[\'bytes\']\n        observed = digest(installed)\n        assert observed == facts[\'sha256\'], \'Installed payload changed: \' + name\n        report[\'installed\'][name] = {\'sha256\': observed, \'bytes\': facts[\'bytes\']}\n    report.update(record_sha256=digest(record), qualified=True,\n                  completed_utc=datetime.datetime.now(datetime.timezone.utc).isoformat())\n    (args.evidence / \'installation.json\').write_text(json.dumps(report, indent=2) + \'\\n\')\n    print(json.dumps(report, indent=2))\n\n\nif __name__ == \'__main__\':\n    main()\n', 'native.py': '"""Outside Windows process observations for the disposable SSH fixture."""\nimport base64\nimport ctypes\nfrom ctypes import wintypes as W\nimport hashlib\nimport json\nfrom pathlib import Path\nimport subprocess\n\nPS = str(Path(\'C:/Windows/System32/WindowsPowerShell/v1.0/powershell.exe\'))\nK = ctypes.WinDLL(\'kernel32\', use_last_error=True)\nK.OpenProcess.argtypes = [W.DWORD, W.BOOL, W.DWORD]\nK.OpenProcess.restype = W.HANDLE\nK.CloseHandle.argtypes = [W.HANDLE]\nK.GetProcessTimes.argtypes = [W.HANDLE, *([ctypes.POINTER(W.FILETIME)] * 4)]\nK.WaitForSingleObject.argtypes = [W.HANDLE, W.DWORD]\nK.WaitForSingleObject.restype = W.DWORD\nK.IsProcessInJob.argtypes = [W.HANDLE, W.HANDLE, ctypes.POINTER(W.BOOL)]\nK.TerminateProcess.argtypes = [W.HANDLE, W.UINT]\n\n\ndef enable_fixture_privileges():\n    class LUID(ctypes.Structure):\n        _fields_ = [(\'low\', W.DWORD), (\'high\', W.LONG)]\n    class ENTRY(ctypes.Structure):\n        _fields_ = [(\'luid\', LUID), (\'attributes\', W.DWORD)]\n    class PRIVILEGES(ctypes.Structure):\n        _fields_ = [(\'count\', W.DWORD), (\'entry\', ENTRY)]\n    api = ctypes.WinDLL(\'advapi32\', use_last_error=True)\n    api.OpenProcessToken.argtypes = [W.HANDLE, W.DWORD, ctypes.POINTER(W.HANDLE)]\n    api.LookupPrivilegeValueW.argtypes = [W.LPCWSTR, W.LPCWSTR, ctypes.POINTER(LUID)]\n    api.AdjustTokenPrivileges.argtypes = [W.HANDLE, W.BOOL, ctypes.POINTER(PRIVILEGES), W.DWORD, W.LPVOID, W.LPVOID]\n    token = W.HANDLE()\n    if not api.OpenProcessToken(W.HANDLE(-1), 0x20 | 0x8, ctypes.byref(token)):\n        raise ctypes.WinError(ctypes.get_last_error())\n    enabled = []\n    try:\n        for name in (\'SeBackupPrivilege\', \'SeRestorePrivilege\', \'SeDebugPrivilege\'):\n            value = PRIVILEGES(count=1)\n            if not api.LookupPrivilegeValueW(None, name, ctypes.byref(value.entry.luid)):\n                raise ctypes.WinError(ctypes.get_last_error())\n            value.entry.attributes = 2\n            ctypes.set_last_error(0)\n            ok = api.AdjustTokenPrivileges(token, False, ctypes.byref(value), 0, None, None)\n            error = ctypes.get_last_error()\n            if not ok or error:\n                raise ctypes.WinError(error)\n            enabled.append(name)\n    finally:\n        assert K.CloseHandle(token)\n    return enabled\n\n\ndef quote(value):\n    return "\'" + str(value).replace("\'", "\'\'") + "\'"\n\n\ndef encoded(script):\n    return base64.b64encode(script.encode(\'utf-16le\')).decode()\n\n\ndef powershell(script, timeout=30):\n    wrapped = "$ErrorActionPreference=\'Stop\'; [Console]::OutputEncoding=[Text.UTF8Encoding]::new($false); " + script\n    result = subprocess.run([PS, \'-NoLogo\', \'-NoProfile\', \'-NonInteractive\',\n                             \'-EncodedCommand\', encoded(wrapped)], capture_output=True,\n                            encoding=\'utf-8\', timeout=timeout)\n    if result.returncode:\n        raise RuntimeError({\'operation\': \'fixture PowerShell\', \'exit\': result.returncode,\n                            \'stdout\': result.stdout, \'stderr\': result.stderr})\n    return result.stdout.strip()\n\n\ndef digest(path):\n    with Path(path).open(\'rb\') as stream:\n        return hashlib.file_digest(stream, \'sha256\').hexdigest()\n\n\ndef times(handle):\n    output = [W.FILETIME() for _ in range(4)]\n    if not K.GetProcessTimes(handle, *[ctypes.byref(x) for x in output]):\n        raise ctypes.WinError(ctypes.get_last_error())\n    return {\'creation_filetime\': (output[0].dwHighDateTime << 32) | output[0].dwLowDateTime,\n            \'exit_filetime\': (output[1].dwHighDateTime << 32) | output[1].dwLowDateTime}\n\n\ndef process(pid):\n    handle = K.OpenProcess(0x1000 | 0x100000, False, pid)\n    if not handle:\n        error = ctypes.get_last_error()\n        return {\'state\': \'absent\' if error == 87 else \'unreadable\', \'pid\': pid,\n                \'operation\': \'OpenProcess\', \'native_error\': error}\n    try:\n        value = times(handle)\n        member = W.BOOL()\n        if not K.IsProcessInJob(handle, None, ctypes.byref(member)):\n            raise ctypes.WinError(ctypes.get_last_error())\n        waited = K.WaitForSingleObject(handle, 0)\n        assert waited in (0, 258), {\'WaitForSingleObject\': waited}\n        return dict(value, state=\'present\', pid=pid, signalled=waited == 0,\n                    in_any_job=bool(member.value))\n    except OSError as error:\n        return {\'state\': \'unreadable\', \'pid\': pid, \'error\': str(error)}\n    finally:\n        assert K.CloseHandle(handle)\n\n\ndef census(sids):\n    wanted = \',\'.join(quote(sid) for sid in sids)\n    script = "$wanted=@(" + wanted + "); $rows=@(); $unknown=@(); "\n    script += "foreach($p in @(Get-CimInstance Win32_Process)) { if($p.ProcessId -le 4){continue}; "\n    script += "try {$o=Invoke-CimMethod -InputObject $p -MethodName GetOwnerSid -ErrorAction Stop; "\n    script += "if($o.ReturnValue -eq 0){if($o.Sid -in $wanted){$rows += [ordered]@{pid=[int]$p.ProcessId;parent=[int]$p.ParentProcessId;sid=$o.Sid;command=$p.CommandLine;image=$p.ExecutablePath}}} "\n    script += "elseif(Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue){$unknown += [ordered]@{pid=[int]$p.ProcessId;owner_return=$o.ReturnValue;image=$p.ExecutablePath}}} "\n    script += "catch {if(Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue){$unknown += [ordered]@{pid=[int]$p.ProcessId;error=$_.Exception.Message}}}}; "\n    script += "ConvertTo-Json -InputObject ([ordered]@{rows=@($rows);unreadable_owners=@($unknown)}) -Depth 5 -Compress"\n    result = json.loads(powershell(script))\n    assert isinstance(result[\'rows\'], list) and isinstance(result[\'unreadable_owners\'], list)\n    for row in result[\'rows\']:\n        row[\'native\'] = process(row[\'pid\'])\n        row[\'state\'] = row[\'native\'][\'state\']\n    return result\n\n\ndef exact(pid):\n    script = "$p=Get-CimInstance Win32_Process -Filter \'ProcessId="