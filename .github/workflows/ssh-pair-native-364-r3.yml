ate.casefold())}\n            process = subprocess.Popen(argv, env=child_env, stdin=subprocess.PIPE if pipe else subprocess.DEVNULL,\n                                       stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n            row[\'birth\'] = native.retained_child(process)\n            if pipe:\n                process.stdin.close()\n                process.stdin = None\n            try:\n                stdout, stderr = process.communicate(timeout=8)\n                row.update(timed_out=False, exit=process.returncode,\n                           stdout=stdout.decode(errors=\'replace\'), stderr=stderr.decode(errors=\'replace\'))\n            except subprocess.TimeoutExpired as error:\n                row.update(timed_out=True, forced_exit_is_synthetic=True, exit_at_timeout=process.poll(),\n                           native_at_timeout=native.process(process.pid))\n                if process.poll() is None:\n                    row[\'forced_exact_after\'] = native.stop_child(process, row[\'birth\'])\n                try:\n                    stdout, stderr = process.communicate(timeout=3)\n                    row.update(exit=process.returncode, pipes_joined=True,\n                               stdout=stdout.decode(errors=\'replace\'), stderr=stderr.decode(errors=\'replace\'))\n                except subprocess.TimeoutExpired as after:\n                    row.update(pipes_joined=False, partial_stdout=(after.stdout or b\'\').decode(errors=\'replace\'),\n                               partial_stderr=(after.stderr or b\'\').decode(errors=\'replace\'))\n        except Exception as error:\n            row[\'error\'] = repr(error)\n        finally:\n            row[\'elapsed_seconds\'] = time.monotonic()-started\n            args.report.parent.mkdir(exist_ok=True)\n            args.report.write_text(json.dumps(report, indent=2)+\'\\n\')\n            if process is not None and process.poll() is None:\n                try:\n                    observed = row.get(\'birth\') or native.retained_child(process)\n                    row[\'final_forced_after\'] = native.stop_child(process, observed)\n                except Exception as error:\n                    row[\'cleanup_error\'] = repr(error)\n                    args.report.write_text(json.dumps(report, indent=2)+\'\\n\')\n                    raise\n                args.report.write_text(json.dumps(report, indent=2)+\'\\n\')\n    print(json.dumps({\'completed\': True, \'cases\': len(report[\'cases\'])}))\n\n\nif __name__ == \'__main__\':\n    main()\n', 'ssh_service.py': '"""An exact newly registered service using the built-in SSH server image."""\nimport json\nimport os\nfrom pathlib import Path\nimport secrets\nimport subprocess\nimport time\nfrom native import exact, powershell, quote, same, service_family, stop\n\n\ndef run(command, timeout=30):\n    value = subprocess.run(command, capture_output=True, text=True, timeout=timeout)\n    if value.returncode:\n        raise RuntimeError({\'service_command\': command, \'exit\': value.returncode,\n                            \'stdout\': value.stdout, \'stderr\': value.stderr})\n    return value\n\n\nclass Service:\n    def __init__(self, config):\n        self.config = Path(config)\n        self.name = \'r5-sshd-\' + secrets.token_hex(8)\n        self.before = None\n        self.incumbent = None\n        self.owned = None\n        self.created = False\n        self.shell = None\n\n    @staticmethod\n    def query(name):\n        assert name == \'sshd\' or (name.startswith(\'r5-sshd-\') and name[8:].isalnum())\n        script = "$s=Get-CimInstance Win32_Service -Filter " + quote("Name=\'"+name+"\'") + "; "\n        script += "if($null -eq $s){ConvertTo-Json @{state=\'absent\'}}else{ConvertTo-Json @{state=$s.State;pid=[int]$s.ProcessId;image_path=$s.PathName;start_mode=$s.StartMode} -Compress}"\n        return json.loads(powershell(script))\n\n    @staticmethod\n    def shell_selection():\n        return powershell("$p=Get-ItemProperty -Path HKLM:\\\\SOFTWARE\\\\OpenSSH -Name DefaultShell -ErrorAction SilentlyContinue; ConvertTo-Json @{default_shell=$p.DefaultShell} -Compress")\n\n    def start(self):\n        binary = Path(os.environ[\'WINDIR\'])/\'System32/OpenSSH/sshd.exe\'\n        assert binary.is_file(), \'Hosted step unavailable: built-in OpenSSH server image is absent\'\n        self.before = self.query(\'sshd\')\n        if self.before.get(\'pid\'):\n            self.incumbent = exact(self.before[\'pid\'])\n            assert self.incumbent[\'state\'] == \'present\'\n        self.shell = self.shell_selection()\n        assert self.query(self.name)[\'state\'] == \'absent\', \'Preserve an incumbent service name\'\n        command = \'"\' + str(binary) + \'" -f "\' + str(self.config) + \'"\'\n        run([str(binary), \'-t\', \'-f\', str(self.config)])\n        run([\'sc.exe\', \'create\', self.name, \'type=\', \'own\', \'start=\', \'demand\',\n             \'obj=\', \'LocalSystem\', \'binPath=\', command])\n        self.created = True\n        run([\'sc.exe\', \'start\', self.name], timeout=45)\n        end = time.monotonic() + 30\n        while time.monotonic() < end:\n            row = self.query(self.name)\n            if row.get(\'pid\'):\n                observed = exact(row[\'pid\'])\n                assert observed[\'state\'] == \'present\' and str(self.config) in observed[\'command\']\n                assert Path(observed[\'image\']).resolve() == binary.resolve()\n                self.owned = observed\n            if row[\'state\'] == \'Running\' and self.owned:\n                return {\'stock_before\': self.before, \'stock_process\': self.incumbent,\n                        \'fixture_service\': self.name, \'owned\': self.owned,\n                        \'default_shell\': json.loads(self.shell), \'config\': str(self.config)}\n            time.sleep(0.2)\n        raise RuntimeError(\'Hosted step unavailable: separate SSH service did not become ready\')\n\n    def close(self):\n        result = {\'stock_before\': self.before, \'fixture_service\': self.name}\n        if self.created:\n            row = self.query(self.name)\n            if row.get(\'pid\'):\n                observed = self.owned or exact(row[\'pid\'])\n                assert row[\'pid\'] == observed[\'pid\'] and str(self.config) in observed[\'command\']\n                family = service_family(observed)\n                result[\'owned_family\'] = family\n                for member in sorted(family, key=lambda x: x[\'depth\'], reverse=True):\n                    stopped = stop(member)\n                    assert stopped[\'state\'] == \'absent\' or (stopped[\'state\'] == \'present\' and stopped[\'signalled\'])\n            end = time.monotonic() + 15\n            while time.monotonic() < end:\n                row = self.query(self.name)\n                if row[\'state\'] == \'Stopped\' and row[\'pid\'] == 0:\n                    break\n                time.sleep(0.2)\n            assert row[\'state\'] == \'Stopped\' and row[\'pid\'] == 0\n            run([\'sc.exe\', \'delete\', self.name])\n            assert self.query(self.name)[\'state\'] == \'absent\', \'Owned service survived deletion\'\n            result[\'fixture_state\'] = \'deleted\'\n            result[\'owned_process_after\'] = exact(self.owned[\'pid\']) if self.owned else {\'state\': \'not observed\'}\n        else:\n            result[\'fixture_state\'] = \'not created\'\n        if self.before is not None:\n            result[\'stock_after\'] = self.query(\'sshd\')\n            assert result[\'stock_after\'] == self.before, \'Stock SSH service changed during the fixture\'\n            if self.incumbent:\n                assert same(self.incumbent, exact(self.incumbent[\'pid\']))\n        if self.shell is not None:\n            assert self.shell_selection() == self.shell, \'SSH shell selection changed during the fixture\'\n        return result\n', 'unix_pair.py': '"""Real loopback SSH and public CLI controls in isolated Unix state homes."""\nimport argparse\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport pwd\nimport shlex\nimport shutil\nimport socket\nimport subprocess\nimport time\nfrom common import init_arguments\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\'--binary\', required=True, type=Path)\n    parser.add_argument(\'--root\', required=True, type=Path)\n    parser.add_argument(\'--source\', required=True)\n    parser.add_argument(\'--arm\', choices=[\'head\'], required=True)\n    parser.add_argument(\'--pairs\', type=int, required=True)\n    args = parser.parse_args()\n    assert args.pairs == 1 and os.geteuid() != 0\n    root = args.root.resolve()\n    root.mkdir(mode=0o700, exist_ok=False)\n    reports = root/\'reports\'\n    reports.mkdir()\n    for name in (\'source-work\', \'destination-work\', \'bin\'):\n        (root/name).mkdir(mode=0o700)\n        (root/name).chmod(0o700)\n    binary = root/\'bin/se\'\n    shutil.copy2(args.binary, binary)\n    report = {\'source\': args.source, \'qualified\': False, \'scope\': \'Unix public loopback pair, list, disconnect, reconnect and down; isolated SE_HOME, generated SSH keys; no provider session\', \'commands\': []}\n    env = {k: v for k, v in os.environ.items() if k not in (\'SE_SESSION\', \'CLAUDECODE\', \'CODEX_THREAD_ID\', \'CODEX_CI\', \'XDG_RUNTIME_DIR\') and not k.startswith((\'STATEENGINE_\', \'SECODE_\'))}\n    env[\'PATH\'] = str(root/\'bin\')+os.pathsep+env[\'PATH\']\n    env[\'SE_HOME\'] = str(root/\'source-state\')\n    server = None\n    daemon = None\n\n    def save():\n        (reports/\'result.json\').write_text(json.dumps(report, indent=2)+\'\\n\')\n\n    def run(label, argv, *, destination=False, expected=0):\n        environment = dict(env)\n        if destination:\n            environment[\'SE_HOME\'] = str(root/\'destination-state\')\n        started = time.monotonic()\n        with (reports/(label+\'.stdout\')).open(\'xb\') as out, (reports/(label+\'.stderr\')).open(\'xb\') as err:\n            child = subprocess.Popen([str(binary), *argv], cwd=root/\'source-work\', env=environment, stdout=out, stderr=err)\n            try:\n                code = child.wait(timeout=120)\n            except subprocess.TimeoutExpired:\n                full = subprocess.run([\'ps\',\'-p\',str(child.pid),\'-o\',\'pid=,lstart=,args=\'], check=True, capture_output=True, text=True).stdout\n                assert str(binary) in full\n                report[\'forced_consumer\'] = full\n                child.terminate()\n                child.wait(timeout=10)\n                raise\n        row = {\'label\': label, \'argv\': argv, \'exit\': code, \'seconds\': time.monotonic()-started}\n        report[\'commands\'].append(row)\n        save()\n        if expected == 0:\n            assert code == 0, row\n        else:\n            assert code != 0, row\n        parsed = []\n        for channel in (\'stdout\', \'stderr\'):\n            try:\n                parsed.append((channel, json.loads((reports/(label+\'.\'+channel)).read_text())))\n            except json.JSONDecodeError:\n                pass\n        assert len(parsed) == 1, \'Expected one structured product response; preserve both channels\'\n        row[\'response_channel\'] = parsed[0][0]\n        save()\n        return parsed[0][1]\n\n    try:\n        for name in (\'client-key\',\'host-key\'):\n            subprocess.run([\'/usr/bin/ssh-keygen\',\'-q\',\'-t\',\'ed25519\',\'-N\',\'\',\'-f\',str(root/name)], check=True, capture_output=True, timeout=20)\n        (root/\'authorized_keys\').write_bytes((root/\'client-key.pub\').read_bytes())\n        with socket.socket() as listener:\n            listener.bind((\'127.0.0.1\',0))\n            port = listener.getsockname()[1]\n        (root/\'known_hosts\').write_text(\'[127.0.0.1]:\'+str(port)+\' \'+(root/\'host-key.pub\').read_text())\n        account = pwd.getpwuid(os.geteuid()).pw_name\n        (root/\'ssh.conf\').write_text(f\'Host fixture-destination\\n HostName 127.0.0.1\\n Port {port}\\n User {account}\\n BatchMode yes\\n IdentitiesOnly yes\\n IdentityAgent none\\n IdentityFile {root}/client-key\\n UserKnownHostsFile {root}/known_hosts\\n StrictHostKeyChecking yes\\n\')\n        (root/\'bin/ssh\').write_text(\'#!/bin/sh\\nexec /usr/bin/ssh -F \'+shlex.quote(str(root/\'ssh.conf\'))+\' "$@"\\n\')\n        (root/\'bin/ssh\').chmod(0o700)\n        (root/\'bin/sftp\').write_text(\'#!/bin/sh\\nexec /usr/bin/sftp \\"$@\\"\\n\')\n        (root/\'bin/sftp\').chmod(0o700)\n        bridge = root/\'target-shell\'\n        bridge.write_text(\'#!/bin/sh\\nexport SE_HOME=\'+shlex.quote(str(root/\'destination-state\'))+\'\\ncd \'+shlex.quote(str(root/\'destination-work\'))+\' || exit 1\\nexec /bin/sh -c "$SSH_ORIGINAL_COMMAND"\\n\')\n        bridge.chmod(0o700)\n        config = root/\'sshd.conf\'\n        config.write_text(f\'Port {port}\\nListenAddress 127.0.0.1\\nHostKey {root}/host-key\\nPidFile {root}/sshd.pid\\nAuthorizedKeysFile {root}/authorized_keys\\nStrictModes no\\nPasswordAuthentication no\\nKbdInteractiveAuthentication no\\nPubkeyAuthentication yes\\nUsePAM no\\nAllowUsers {account}\\nAllowTcpForwarding yes\\nPermitTTY no\\nLogLevel VERBOSE\\nForceCommand {bridge}\\n\')\n        subsystem = Path(\'/usr/libexec/sftp-server\' if os.uname().sysname == \'Darwin\' else \'/usr/lib/openssh/sftp-server\')\n        assert subsystem.is_file()\n        with config.open(\'a\') as stream:\n            stream.write(\'Subsystem sftp \'+str(subsystem)+\'\\n\')\n        with (reports/\'sshd.log\').open(\'xb\') as log:\n            server = subprocess.Popen([\'sudo\',\'-n\',\'/usr/sbin/sshd\',\'-D\',\'-e\',\'-f\',str(config)], stdout=log, stderr=log)\n        end = time.monotonic()+10\n        while not (root/\'sshd.pid\').exists() and server.poll() is None and time.monotonic()<end:\n            time.sleep(.1)\n        assert server.poll() is None and (root/\'sshd.pid\').exists()\n        daemon = int((root/\'sshd.pid\').read_text())\n        identity = subprocess.run([\'ps\',\'-p\',str(daemon),\'-o\',\'pid=,lstart=,args=\'], capture_output=True, text=True, check=True).stdout\n        assert str(config) in identity\n        report[\'sshd_identity\'] = identity\n        run(\'init\', init_arguments(root/\'source-work\'))\n        run(\'pair\', [\'--json\',\'remote\',\'add\',\'fixture-destination\',\'--name\',\'fixture\'])\n        run(\'continue\', [\'--json\',\'remote\',\'list\',\'--host\',\'fixture\'])\n        run(\'disconnect\', [\'--json\',\'remote\',\'disconnect\',\'--name\',\'fixture\'])\n        refusal = run(\'disconnected-refusal\', [\'--json\',\'remote\',\'list\',\'--host\',\'fixture\'], expected=1)\n        assert refusal[\'code\'] == \'capability-invalid\' and \'disconnected\' in refusal[\'detail\'][\'reason\']\n        run(\'reconnect\', [\'--json\',\'remote\',\'add\',\'fixture-destination\',\'--name\',\'fixture\'])\n        run(\'continue-after-reconnect\', [\'--json\',\'remote\',\'list\',\'--host\',\'fixture\'])\n        run(\'destination-down\', [\'--json\',\'down\'], destination=True)\n        run(\'source-down\', [\'--json\',\'down\'])\n        report[\'qualified\'] = True\n    except Exception as error:\n        report[\'error\'] = repr(error)\n        raise\n    finally:\n        for name in (\'source\',\'destination\'):\n            if (root/(name+\'-state\')/\'endpoint.json\').exists():\n                try:\n                    run(\'cleanup-\'+name, [\'--json\',\'down\'], destination=name==\'destination\')\n                except Exception as error:\n                    report[\'qualified\'] = False\n                    report[\'cleanup_error_\'+name] = repr(error)\n        if daemon is not None:\n            current = subprocess.run([\'ps\',\'-p\',str(daemon),\'-o\',\'pid=,lstart=,args=\'],capture_output=True,text=True)\n            if current.returncode == 0:\n                assert current.stdout == report[\'sshd_identity\'], \'Owned daemon identity changed\'\n                subprocess.run([\'sudo\',\'-n\',\'kill\',\'-TERM\',str(daemon)],check=True,timeout=10)\n        if server is not None:\n            report[\'sshd_exit\'] = server.wait(timeout=15)\n        rows = subprocess.run([\'ps\',\'-eo\',\'pid=,args=\'],check=True,capture_output=True,text=True).stdout.splitlines()\n        report[\'surviving_private_processes\'] = [r for r in rows if len(r.split()) > 1 and r.split()[1].startswith(str(root)+\'/\') and any(arg.startswith(\'--stateengine-private\') for arg in r.split()[2:])]\n        if report[\'surviving_private_processes\']:\n            report[\'qualified\'] = False\n        save()\n    assert report[\'qualified\'], report\n    print(json.dumps({\'qualified\': True, \'reports\': str(reports)}))\n\n\nif __name__ == \'__main__\':\n    main()\n'}
        expected = {'accounts.py': '34d61f5659a4c063dfc6e7b57711a1e65ba78c72c08171774dfea234118c1830', 'common.py': '42027d437629c5e4bcee3c4826f76ed83384dea84cc6e451adf83a7d722ee165', 'driver.py': '46657d17b762a9e5faf21cfd0228bd72c1c6d41bf93fc176089387f8f79a1cbf', 'install.py': 'f84e2bffe1a98e94edc29a6f502f14b9b577bd975af01f644d29c1f25a9f1d06', 'native.py': '77c1e0d99e318b80c551c8c3635c551a5cd615b208edd9eeed8742b054ea48a1', 'regression.py': '77dd2dbc5b2a402ad21ebdf187b9105093066944071e90a525d5c69a53bd32cd', 'ssh_probe.py': '7a0c1c4baf6ff67dfa7a52f0309ac0a132b8636e5a0b147505f788cb6bdb67a9', 'ssh_service.py': '4ff6c087fc9205533135c184e1f959fb49b6e30bead8d142d0f2c7371c43d95a', 'unix_pair.py': '7138e2deef6816ad1af477c2ea22cc63bc6d7c307fdb5f7ac7ce934f7072f09a'}
        for name, content in files.items():
            data = content.encode()
            assert hashlib.sha256(data).hexdigest() == expected[name]
            (root/name).write_bytes(data)
        (root/'manifest.json').write_text(json.dumps(expected, indent=2)+'\n')
    - name: Build exact native source using the distribution profile
      shell: python
      env:
        SOURCE: ${{ matrix.source }}
        TARGET: ${{ matrix.target }}
      run: |
        import os, subprocess
        from pathlib import Path
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['SOURCE']
        assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).strip()
        subprocess.run(['python','-B','scripts/release/build.py','--target',os.environ['TARGET'],'--out',str(Path(os.environ['RUNNER_TEMP'])/'ssh-pair-build')],check=True)
    - name: Assemble native-only Windows archive and record provenance
      if: runner.os == 'Windows'
      shell: python
      env:
        SOURCE: ${{ matrix.source }}
        TARGET: ${{ matrix.target }}
      run: |
        import hashlib, json, os, subprocess
        from pathlib import Path
        scratch = Path(os.environ['RUNNER_TEMP'])
        assets = scratch/'ssh-pair-assets'
        built = subprocess.run(['python','-B','scripts/release/assemble.py','--build',str(scratch/'ssh-pair-build'),'--out',str(assets),'--native-only'],check=True,text=True,capture_output=True)
        value = json.loads(built.stdout)
        archive = Path(value['archive'])
        assert value['source_commit'] == os.environ['SOURCE']
        assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest() == value['sha256']
        release = {'source_commit':os.environ['SOURCE'],'scope':'unsigned native-only matching-platform author validation','packages':{os.environ['TARGET']:{'file':archive.name,'sha256':value['sha256'],'bytes':archive.stat().st_size}}}
        (assets/'release.json').write_text(json.dumps(release,indent=2)+'\n')
        (scratch/'ssh-pair-driver/release.json').write_bytes((assets/'release.json').read_bytes())
        (scratch/'ssh-pair-driver/build.json').write_bytes((scratch/'ssh-pair-build/build.json').read_bytes())
    - name: Public Windows pairing in fresh nonadministrator native profiles
      if: runner.os == 'Windows'
      shell: python
      env:
        SOURCE: ${{ matrix.source }}
        ARM: ${{ matrix.arm }}
      run: |
        import datetime, os, subprocess
        from pathlib import Path
        scratch = Path(os.environ['RUNNER_TEMP'])
        deadline = (datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(minutes=30)).isoformat()
        subprocess.run(['python','-B',str(scratch/'ssh-pair-driver/driver.py'),'--assets',str(scratch/'ssh-pair-assets'),'--root',str(scratch/'ssh-pair-run'),'--deadline-utc',deadline,'--source',os.environ['SOURCE'],'--arm',os.environ['ARM'],'--pairs','1'],check=True)
    - name: Public Unix pairing through real loopback SSH
      if: runner.os != 'Windows'
      shell: python
      env:
        SOURCE: ${{ matrix.source }}
      run: |
        import os, subprocess
        from pathlib import Path
        scratch = Path(os.environ['RUNNER_TEMP'])
        subprocess.run(['python','-B',str(scratch/'ssh-pair-driver/unix_pair.py'),'--binary',str(scratch/'ssh-pair-build/se'),'--root',str(scratch/'ssh-pair-run'),'--source',os.environ['SOURCE'],'--arm','head','--pairs','1'],check=True)
    - name: Preserve reports, frozen driver and build provenance
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ssh-pair-${{ matrix.label }}
        path: |-
          ${{ runner.temp }}/ssh-pair-driver
          ${{ runner.temp }}/ssh-pair-run/reports
          ${{ runner.temp }}/ssh-pair-build/build.json
        if-no-files-found: error
        retention-days: 7
