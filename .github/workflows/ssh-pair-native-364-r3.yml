th green.\n        try:\n            value = census(\'cleanup-before\') if users else {\'rows\': []}\n            for row in value[\'rows\']:\n                if row[\'native\'][\'state\']==\'present\' and not row[\'native\'][\'signalled\']:\n                    report[\'cleanup\'].append({\'forced_owned_birth\': row, \'after\': native.stop(row)})\n                    report[\'qualified\'] = False\n        except Exception as error:\n            report[\'qualified\'] = False\n            report[\'cleanup\'].append({\'census_recovery_error\': repr(error)})\n        if service is not None:\n            try:\n                report[\'service_after\'] = service.close()\n            except Exception as error:\n                report[\'qualified\'] = False\n                report[\'cleanup\'].append({\'service_cleanup_error\': repr(error)})\n        for user in reversed(users):\n            try:\n                quiet = census(\'before-account-delete\')\n                assert not [r for r in quiet[\'rows\'] if r[\'sid\']==user[\'sid\']]\n                report[\'cleanup\'].append(accounts.remove(user))\n            except Exception as error:\n                report[\'qualified\'] = False\n                report[\'cleanup\'].append({\'account\': user[\'name\'], \'cleanup_error\': repr(error)})\n        report[\'completed_utc\'] = datetime.datetime.now(datetime.timezone.utc).isoformat()\n        save()\n    errors = [row for row in report[\'cleanup\'] if any(key.endswith(\'error\') or key == \'forced_owned_birth\' for key in row)]\n    assert not errors, \'Owned fixture cleanup was not witnessed\'\n    assert report[\'qualified\'] if args.arm == \'head\' else report.get(\'base_reproduced\'), \'Windows regression failed\'\n    print(json.dumps({\'qualified\': report[\'qualified\'], \'base_reproduced\': report.get(\'base_reproduced\', False), \'cleanup_ok\': not errors, \'source\': report[\'source\'], \'reports\': str(reports)}))\n\n\nif __name__ == \'__main__\':\n    main()