d\']}\n    for parent in selected:\n        for row in snapshot:\n            if row[\'parent\'] != parent[\'pid\'] or row[\'pid\'] in visited:\n                continue\n            child = exact(row[\'pid\'])\n            if child[\'state\'] == \'absent\':\n                continue\n            assert same(parent, exact(parent[\'pid\'])), \'Service ancestor changed during family census\'\n            assert child[\'parent\'] == parent[\'pid\'] and child[\'native\'][\'state\'] == \'present\'\n            assert child[\'native\'][\'creation_filetime\'] >= parent[\'native\'][\'creation_filetime\']\n            visited.add(child[\'pid\'])\n            selected.append(dict(child, depth=parent[\'depth\']+1))\n    return selected\n\n\ndef retained_child(child):\n    handle = int(child._handle)\n    value = times(handle)\n    class UNICODE_STRING(ctypes.Structure):\n        _fields_ = [(\'length\', W.USHORT), (\'maximum\', W.USHORT), (\'buffer\', W.LPVOID)]\n    api = ctypes.WinDLL(\'ntdll\')\n    query = api.NtQueryInformationProcess\n    query.argtypes = [W.HANDLE, W.ULONG, W.LPVOID, W.ULONG, ctypes.POINTER(W.ULONG)]\n    query.restype = ctypes.c_long\n    needed = W.ULONG()\n    status = query(handle, 60, None, 0, ctypes.byref(needed))\n    assert status & 0xffffffff in (0xc0000004, 0xc0000023), {\'command_size_status\': status & 0xffffffff}\n    assert ctypes.sizeof(UNICODE_STRING) <= needed.value <= 131072\n    storage = ctypes.create_string_buffer(needed.value)\n    status = query(handle, 60, storage, len(storage), ctypes.byref(needed))\n    assert status == 0, {\'command_read_status\': status & 0xffffffff}\n    text = UNICODE_STRING.from_buffer(storage)\n    start = ctypes.addressof(storage)\n    assert text.length % 2 == 0 and text.length <= text.maximum <= len(storage)\n    assert text.buffer and start <= text.buffer and text.buffer+text.length <= start+len(storage)\n    command = ctypes.wstring_at(text.buffer, text.length//2)\n    assert command == subprocess.list2cmdline(child.args), \'Owned child command line changed\'\n    K.QueryFullProcessImageNameW.argtypes = [W.HANDLE, W.DWORD, W.LPWSTR, ctypes.POINTER(W.DWORD)]\n    path = ctypes.create_unicode_buffer(32768)\n    size = W.DWORD(len(path))\n    if not K.QueryFullProcessImageNameW(handle, 0, path, ctypes.byref(size)):\n        raise ctypes.WinError(ctypes.get_last_error())\n    assert Path(path.value).resolve() == Path(child.args[0]).resolve()\n    return {\'state\': \'present\', \'pid\': child.pid, \'command\': command,\n            \'image\': path.value, \'native\': value, \'observation\': \'retained CreateProcess handle\'}\n\n\ndef stop_child(child, observed):\n    handle = int(child._handle)\n    assert observed[\'pid\'] == child.pid and observed[\'command\']\n    assert times(handle)[\'creation_filetime\'] == observed[\'native\'][\'creation_filetime\']\n    if child.poll() is None:\n        current = retained_child(child)\n        assert current[\'command\'] == observed[\'command\'] and current[\'image\'] == observed[\'image\']\n        if not K.TerminateProcess(handle, 0):\n            raise ctypes.WinError(ctypes.get_last_error())\n        assert K.WaitForSingleObject(handle, 10000) == 0\n    child.wait(timeout=5)\n    return dict(times(handle), reaped=True, exit=child.returncode)\n', 'regression.py': '"""Hosted Windows-to-Windows SSH development regression in two fresh accounts."""\nimport argparse\nimport datetime\nimport json\nimport os\nfrom pathlib import Path\nimport secrets\nimport shutil\nimport socket\nimport subprocess\nimport sys\nimport time\nfrom concurrent.futures import ThreadPoolExecutor\nimport accounts\nfrom common import init_arguments\nimport native\nfrom ssh_service import Service\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\'--assets\', required=True, type=Path)\n    parser.add_argument(\'--root\', required=True, type=Path)\n    parser.add_argument(\'--deadline-utc\', required=True)\n    parser.add_argument(\'--source\', required=True)\n    parser.add_argument(\'--arm\', required=True, choices=[\'base\', \'head\'])\n    parser.add_argument(\'--pairs\', type=int, default=1)\n    args = parser.parse_args()\n    assert args.pairs == 1\n    assert sys.platform == \'win32\' and not os.environ.get(\'GH_TOKEN\') and not os.environ.get(\'GITHUB_TOKEN\')\n    deadline = datetime.datetime.fromisoformat(args.deadline_utc)\n    assert deadline.tzinfo is not None\n    root = args.root.resolve()\n    root.mkdir(exist_ok=False)\n    reports = root/\'reports\'\n    reports.mkdir()\n    private = root/\'private\'\n    private.mkdir()\n    accounts.private_acl(private, \'S-1-5-32-544\')\n    report = {\'qualified\': False, \'phase\': \'archive provenance\', \'commands\': [],\n              \'accounts\': [], \'cleanup\': [], \'census\': [],\n              \'scope\': \'Author validation: Windows-to-Windows native-only archive, public pairing, list, reconnect and shutdown\',\n              \'arm\': args.arm, \'pair_count\': args.pairs,\n              \'unqualified\': [\'Linux direction pairs\', \'real providers\', \'remote launch/output/send/watch\',\n                              \'four full-journey timings\', \'alternate SSH shell\', \'native VM\', \'macOS\']}\n    users = []\n    service = None\n    child = None\n    executor = ThreadPoolExecutor(max_workers=1)\n\n    def save():\n        (reports/\'result.json\').write_text(json.dumps(report, indent=2) + \'\\n\')\n\n    def remaining(maximum):\n        left = (deadline-datetime.datetime.now(datetime.timezone.utc)).total_seconds()\n        assert left > 0, \'Fixture work deadline expired; cleanup only\'\n        return min(left, maximum)\n\n    def census(label):\n        value = native.census([u[\'sid\'] for u in users])\n        value.update(label=label, utc=datetime.datetime.now(datetime.timezone.utc).isoformat())\n        report[\'census\'].append(value)\n        assert not value[\'unreadable_owners\'], {\'native_account_census_unreadable\': value}\n        assert all(r[\'native\'][\'state\'] != \'unreadable\' for r in value[\'rows\'])\n        return value\n\n    try:\n        admin = native.powershell("$p=[Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent()); $p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)")\n        assert admin == \'True\', \'Hosted fixture needs the runner administrator\'\n        report[\'native_privileges\'] = native.enable_fixture_privileges()\n        release = json.loads((args.assets/\'release.json\').read_text())\n        source_commit = args.source\n        assert release[\'source_commit\'] == source_commit\n        package = release[\'packages\'][\'x86_64-pc-windows-msvc\']\n        archive = args.assets/package[\'file\']\n        assert len(package[\'sha256\']) == 64\n        assert archive.stat().st_size == package[\'bytes\'] and native.digest(archive) == package[\'sha256\']\n        report.update(source=source_commit, archive=package)\n        report[\'phase\'] = \'native profile create/delete preflight\'\n        canary = accounts.create(\'profile\')\n        users.append(canary)\n        report[\'accounts\'].append(canary)\n        save()\n        accounts.create_profile(canary)\n        assert not census(\'profile-canary\')[\'rows\']\n        report[\'profile_preflight\'] = accounts.remove(canary)\n        users.remove(canary)\n        report[\'accounts\'].remove(canary)\n        report[\'phase\'] = \'fresh native accounts\'\n        for role in (\'source\', \'destination\'):\n            user = accounts.create(role)\n            users.append(user)\n            report[\'accounts\'].append(user)\n            save()\n            accounts.configure_groups(user)\n            profile = accounts.create_profile(user)\n            for name in (\'.ssh\', \'r5-fixture\'):\n                path = profile/name\n                path.mkdir(exist_ok=False)\n                accounts.private_acl(path, user[\'sid\'])\n            work = profile/\'r5-fixture\'\n            for name in (\'install.py\', \'native.py\', \'ssh_probe.py\'):\n                path = work/name\n                shutil.copyfile(Path(__file__).parent/name, path)\n                accounts.private_acl(path, user[\'sid\'])\n            path = work/\'distribution.zip\'\n            shutil.copyfile(archive, path)\n            accounts.private_acl(path, user[\'sid\'])\n        assert not census(\'new-accounts\')[\'rows\']\n        source, destination = users\n        key = private/\'client-key\'\n        server_key = private/\'server-key\'\n        keygen = str(Path(os.environ[\'WINDIR\'])/\'System32/OpenSSH/ssh-keygen.exe\')\n        assert Path(keygen).is_file(), \'Hosted step unavailable: built-in OpenSSH client is absent\'\n        for path in (key, server_key):\n            subprocess.run([keygen, \'-q\', \'-t\', \'ed25519\', \'-N\', \'\', \'-f\', str(path)],\n                           check=True, capture_output=True, timeout=30)\n            accounts.private_acl(path, \'S-1-5-32-544\')\n        with socket.socket() as listener:\n            listener.bind((\'127.0.0.1\', 0))\n            port = listener.getsockname()[1]\n        known = private/\'known_hosts\'\n        known.write_text(\'[127.0.0.1]:\' + str(port) + \' \' + server_key.with_suffix(\'.pub\').read_text())\n        accounts.private_acl(known, \'S-1-5-32-544\')\n        for user in users:\n            ssh = Path(user[\'profile\'])/\'.ssh\'\n            path = ssh/\'authorized_keys\'\n            path.write_bytes(key.with_suffix(\'.pub\').read_bytes())\n            accounts.private_acl(path, user[\'sid\'])\n        source_ssh = Path(source[\'profile\'])/\'.ssh\'\n        for name, data in [(\'fixture_key\', key.read_bytes()), (\'known_hosts\', known.read_bytes())]:\n            path = source_ssh/name\n            path.write_bytes(data)\n            accounts.private_acl(path, source[\'sid\'])\n        config = source_ssh/\'config\'\n        config.write_text(\'Host fixture-destination\\n HostName 127.0.0.1\\n Port \'+str(port)+\'\\n User \'+destination[\'name\']\n                          +\'\\n BatchMode yes\\n StrictHostKeyChecking yes\\n IdentitiesOnly yes\\n IdentityAgent none\\n\'\n                          +\' IdentityFile \'+str(source_ssh/\'fixture_key\').replace(\'\\\\\',\'/\')\n                          +\'\\n UserKnownHostsFile \'+str(source_ssh/\'known_hosts\').replace(\'\\\\\',\'/\')+\'\\n\')\n        accounts.private_acl(config, source[\'sid\'])\n        config = private/\'sshd_config\'\n        config.write_text(\'Port \'+str(port)+\'\\nListenAddress 127.0.0.1\\nHostKey \'+str(server_key).replace(\'\\\\\',\'/\')\n                          +\'\\nAllowUsers \'+source[\'name\']+\' \'+destination[\'name\']\n                          +\'\\nAuthorizedKeysFile .ssh/authorized_keys\\nPubkeyAuthentication yes\\nPasswordAuthentication no\\n\'\n                          +\'KbdInteractiveAuthentication no\\nStrictModes yes\\nAllowTcpForwarding local\\nGatewayPorts no\\nLogLevel VERBOSE\\n\')\n        sftp_server = Path(os.environ[\'WINDIR\'])/\'System32/OpenSSH/sftp-server.exe\'\n        assert sftp_server.is_file(), \'Built-in SFTP server absent\'\n        with config.open(\'a\') as stream:\n            stream.write(\'Subsystem sftp \\"\'+str(sftp_server).replace(\'\\\\\',\'/\')+\'\\"\\n\')\n        accounts.private_acl(config, \'S-1-5-32-544\')\n        report[\'phase\'] = \'built-in SSH service\'\n        service = Service(config)\n        report[\'service\'] = service.start()\n        save()\n        ssh = str(Path(os.environ[\'WINDIR\'])/\'System32/OpenSSH/ssh.exe\')\n        ssh_args = [ssh, \'-F\', \'NUL\', \'-i\', str(key), \'-p\', str(port), \'-oBatchMode=yes\',\n                    \'-oIdentitiesOnly=yes\', \'-oIdentityAgent=none\', \'-oStrictHostKeyChecking=yes\',\n                    \'-oUserKnownHostsFile=\'+str(known), \'-oConnectTimeout=10\']\n\n        def invoke(role, label, script, *, structured=True, success=True, observe=False, timeout=180):\n            nonlocal child\n            user = source if role == \'source\' else destination\n            wrapper = "[Console]::OutputEncoding=[Text.UTF8Encoding]::new($false); $ErrorActionPreference=\'Stop\'; " + script\n            remote = \'powershell.exe -NoLogo -NoProfile -NonInteractive -EncodedCommand \' + native.encoded(wrapper)\n            row = {\'label\': label, \'role\': role, \'started_utc\': datetime.datetime.now(datetime.timezone.utc).isoformat()}\n            report[\'commands\'].append(row)\n            started = time.monotonic()\n            samples = []\n            pending = None\n            with (reports/(label+\'.stdout\')).open(\'wb\') as stdout, (reports/(label+\'.stderr\')).open(\'wb\') as stderr:\n                child = subprocess.Popen([*ssh_args, user[\'name\']+\'@127.0.0.1\', remote],\n                                         stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr)\n                row[\'ssh_pid\'] = child.pid\n                row[\'ssh_start\'] = native.times(int(child._handle))\n                until = time.monotonic()+remaining(timeout)\n                while child.poll() is None:\n                    if observe and pending is None:\n                        pending = executor.submit(native.census, [u[\'sid\'] for u in users])\n                    if pending is not None and pending.done():\n                        samples.append(pending.result())\n                        pending = None\n                    if time.monotonic() >= until:\n                        owned = native.exact(child.pid)\n                        assert owned[\'native\'][\'creation_filetime\'] == row[\'ssh_start\'][\'creation_filetime\']\n                        native.stop(owned)\n                        child.wait(timeout=10)\n                        raise TimeoutError(\'Exact owned SSH consumer deadline: \'+label)\n                    time.sleep(0.05)\n                row.update(exit=child.returncode, elapsed_seconds=time.monotonic()-started,\n                           ssh_end=native.times(int(child._handle)), ssh_reaped=True)\n                if pending is not None:\n                    samples.append(pending.result(timeout=30))\n                child = None\n            if observe:\n                (reports/(label+\'-processes.json\')).write_text(json.dumps(samples, indent=2)+\'\\n\')\n            save()\n            assert (row[\'exit\']==0) == success, {\'public_consumer_failed\': row}\n            if structured:\n                channel = \'stdout\' if success else \'stderr\'\n                row[\'response_channel\'] = channel\n                value = json.loads((reports/(label+\'.\'+channel)).read_text(encoding=\'utf-8\'))\n                assert (value.get(\'schema\') != \'se.error/v1\') == success\n                if not success:\n                    assert value[\'code\']==\'capability-invalid\' and value[\'exit\']==row[\'exit\']\n                    assert \'disconnected\' in value[\'detail\'][\'reason\'] and value.get(\'remedy\')\n                    assert value[\'schema\'] == \'se.error/v1\'\n                return value\n            return row\n\n        def se(role, label, arguments, **kwargs):\n            user = source if role == \'source\' else destination\n            executable = Path(user[\'local_app\'])/\'StateEngine/bin/se.exe\'\n            command = \'& \'+native.quote(executable)+\' \'+ \' \'.join(native.quote(a) for a in arguments)+\'; exit $LASTEXITCODE\'\n            return invoke(role, label, command, **kwargs)\n\n        report[\'phase\'] = \'actual native profile readback and installs\'\n        for role, user in zip((\'source\',\'destination\'), users):\n            script = "$u=[Security.Principal.WindowsIdentity]::GetCurrent(); ConvertTo-Json @{sid=$u.User.Value;profile=[Environment]::GetFolderPath(\'UserProfile\');local_app=[Environment]::GetFolderPath(\'LocalApplicationData\')} -Compress"\n          