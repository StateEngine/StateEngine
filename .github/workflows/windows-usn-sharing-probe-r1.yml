name: Native journal sharing boundary
on:
  push:
    branches: [prime/windows-usn-sharing-probe-r1]
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Observe journal sharing with retained native readers
        shell: python
        run: |
          import base64, hashlib, os, pathlib, subprocess, sys
          payload = base64.b64decode('')
          if hashlib.sha256(payload).hexdigest() != '7a539c58741ff6712eb03e331290773e4d5de210f51253f6b043b7b3805ffd1b':
              raise ValueError('Probe bytes differ')
          script = pathlib.Path(os.environ['RUNNER_TEMP']) / 'usn-sharing-probe.py'
          script.write_bytes(payload)
          output = script.parent / 'usn-sharing-probe'
          subprocess.run([sys.executable, '-B', script, output], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: windows-usn-sharing-probe-r1
          path: ${{ runner.temp }}/usn-sharing-probe/receipt.json
          if-no-files-found: error
          retention-days: 14
