name: Fresh initialization traces on three native platforms
'on':
  push:
    branches:
    - prime/init-traces-241-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PRODUCT_SOURCE: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
jobs:
  observe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        - windows-2025
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ env.PRODUCT_SOURCE }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - name: Authenticate frozen external observer inputs
      shell: python
      run: |
        import ast,base64,hashlib,json,os
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'init241-inputs';r.mkdir()
        inputs={'observe.c': '', 'calibrate.c': '', 'run.py': '', 'windows-observer/Program.cs': '', 'windows-observer/SyncTrace.csproj': '', 'windows-observer/packages.lock.json': ''}
        expected={'observe.c': 'f71f4a69d49dfc4eef97dc1ec92d19e5460563370ad3e5e9f9eb978634965c90', 'calibrate.c': '94bf3f9f6bb70656e944436bde8f4ab950b29ea89bf100cd1de1d6c4f89d3325', 'run.py': '55179ee8122f35d6acc1579ea45bdb2f78363082093c14f4d1323550d11c49f1', 'windows-observer/Program.cs': 'b60874f1d3812c6f25ba48b49ef17b81619a2f7ac3af56410b1e803cf2d17d5b', 'windows-observer/SyncTrace.csproj': 'b60fcbe91693d1f3a6f0e9c877f79224886907503cc55a4a90f37008412cf8e3', 'windows-observer/packages.lock.json': '81144af8d523be2fa8e9276f858704598bb11f414c10d3181233ac08cf59cc4a'}
        for name,encoded in inputs.items():
            data=base64.b64decode(encoded);assert hashlib.sha256(data).hexdigest()==expected[name]
            if name.endswith('.py'):ast.parse(data,filename=name)
            p=r/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
        (r/'inputs.json').write_text(json.dumps(expected,indent=2)+'\n')
    - name: Compile native observer before product build
      shell: python
      run: |
        import hashlib,json,os,subprocess,sys,time
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'init241-inputs';rows=[]
        def run(argv,cwd=r):
            start=time.monotonic()
            with (r/('observer-'+str(len(rows))+'.stdout')).open('wb') as out,(r/('observer-'+str(len(rows))+'.stderr')).open('wb') as err:
                p=subprocess.run(argv,cwd=cwd,stdout=out,stderr=err,timeout=300)
            rows.append(dict(argv=argv,exit=p.returncode,seconds=time.monotonic()-start));(r/'observer-build.json').write_text(json.dumps(rows,indent=2)+'\n');assert p.returncode==0
        if os.name=='nt':
            run(['dotnet','--info'])
            run(['dotnet','build','SyncTrace.csproj','--configuration','Release','-p:RestoreLockedMode=true','--output',str(r/'windows-observer-bin')],r/'windows-observer')
        else:
            mac=sys.platform=='darwin';cc=['xcrun','clang'] if mac else ['cc'];sdk=['-isysroot',subprocess.check_output(['xcrun','--show-sdk-path'],text=True).strip()] if mac else []
            run([*cc,*sdk,'-O2','-Wall','-Wextra','-Werror',*(['-dynamiclib'] if mac else ['-shared','-fPIC']),str(r/'observe.c'),'-o',str(r/('observe.dylib' if mac else 'observe.so')),*([] if mac else ['-ldl'])])
    - name: Build unmodified native distribution image
      shell: python
      run: |
        import hashlib,json,os,shutil,subprocess,time
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'init241-inputs';source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert source==os.environ['PRODUCT_SOURCE']
        assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'])
        compiler=subprocess.check_output(['rustc','-Vv'],text=True);host=next(x.removeprefix('host: ') for x in compiler.splitlines() if x.startswith('host: '))
        argv=['cargo','build','--target',host,'--profile','distribution','-p','se','--features','remote','--locked'];start=time.monotonic()
        with (r/'build.stdout').open('wb') as out,(r/'build.stderr').open('wb') as err:p=subprocess.run(argv,stdout=out,stderr=err,timeout=3300)
        image=(Path('target')/host/'distribution'/('se.exe' if os.name=='nt' else 'se')).resolve()
        data=dict(source=source,compiler=compiler,target=host,argv=argv,features=['default','remote'],profile='distribution',exit=p.returncode,seconds=time.monotonic()-start)
        if p.returncode==0:
            frozen=r/('image.exe' if os.name=='nt' else 'image');shutil.copy2(image,frozen);data.update(image=str(frozen),sha256=hashlib.sha256(frozen.read_bytes()).hexdigest())
        (r/'build.json').write_text(json.dumps(data,indent=2)+'\n');raise SystemExit(p.returncode)
    - name: Trace thirty fresh public initializations
      shell: python
      run: |
        import json,os,subprocess,sys
        from pathlib import Path
        r=Path(os.environ['RUNNER_TEMP'])/'init241-inputs';b=json.loads((r/'build.json').read_text());assert b['exit']==0
        out=Path(os.environ['RUNNER_TEMP'])/'init241-results';homes=Path(os.environ['RUNNER_TEMP'])/'init241-homes'
        if os.name=='nt':argv=['dotnet',str(r/'windows-observer-bin/SyncTrace.dll'),str(out),str(homes),b['image'],b['source'],'30']
        else:argv=[sys.executable,'-B',str(r/'run.py'),'--image',b['image'],'--out',str(out),'--scratch',str(homes),'--source',b['source'],'--source-tree',os.environ['GITHUB_WORKSPACE'],'--count','30']
        with (r/'consumer.stdout').open('wb') as stdout,(r/'consumer.stderr').open('wb') as stderr:p=subprocess.run(argv,stdout=stdout,stderr=stderr,timeout=900)
        (r/'consumer-exit.json').write_text(json.dumps(dict(exit=p.returncode,argv=argv))+'\n');raise SystemExit(p.returncode)
    - name: Retain bounded traces and every failure
      if: always()
      shell: python
      run: |
        import hashlib,json,os,shutil
        from pathlib import Path
        base=Path(os.environ['RUNNER_TEMP']);r=base/'init241-inputs';retained=base/'init241-retained';retained.mkdir()
        dst=retained/'inputs';dst.mkdir()
        manifest=json.loads((r/'inputs.json').read_text())
        for name in [*manifest,'inputs.json','observer-build.json','build.json','build.stdout','build.stderr','consumer.stdout','consumer.stderr','consumer-exit.json']:
            p=r/name
            if p.is_file():q=dst/name;q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
        for p in r.glob('observer-*.stdout'):shutil.copy2(p,dst/p.name)
        for p in r.glob('observer-*.stderr'):shutil.copy2(p,dst/p.name)
        for name in ['image','image.exe','observe.so','observe.dylib','calibrate','inert.c']:
            p=r/name
            if p.is_file():shutil.copy2(p,retained/p.name)
        results=base/'init241-results'
        if results.exists():
            # The observer deletes its machine-wide ETL after retaining PID-filtered events.
            assert not (results/'native.etl').exists(),'Unfiltered native trace is outside the export'
            shutil.copytree(results,retained/'results')
        else:(retained/'missing-results.json').write_text(json.dumps({'missing':True})+'\n')
        files=[p for p in retained.rglob('*') if p.is_file()];assert all(not p.is_symlink() for p in files)
        (retained/'members.json').write_text(json.dumps({p.relative_to(retained).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files},indent=2)+'\n')
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: init241-${{ matrix.os }}-traced-r1
        path: ${{ runner.temp }}/init241-retained/
        if-no-files-found: error
        retention-days: 14
