name: Native uninstall finalizer differential judges
'on':
  push:
    branches:
    - prime/j5-finalizer-judges-r5
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  RUST_BACKTRACE: '1'
jobs:
  windows:
    name: Finalizer judges (${{ matrix.role }}, ${{ matrix.features }})
    runs-on: windows-2025
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
        - role: base
          source: 672c8d5aaaa882a7de66dfb8ff3f83b6886a37a3
          features: default
        - role: base
          source: 672c8d5aaaa882a7de66dfb8ff3f83b6886a37a3
          features: all
        - role: fix
          source: dedb201e3f6030b077276a8d819e64b0f9157e38
          features: default
        - role: fix
          source: dedb201e3f6030b077276a8d819e64b0f9157e38
          features: all
    env:
      JUDGE_ROLE: ${{ matrix.role }}
      JUDGE_SOURCE: ${{ matrix.source }}
      JUDGE_FEATURES: ${{ matrix.features }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: c29-windows-${{ matrix.features }}-v1
    - name: Register disposable runner account
      shell: bash
      run: 'python scripts/ci/installation_account.py provision

        python scripts/ci/installation_account.py check

        '
    - name: Apply identical frozen reviewer judges
      shell: python
      run: 'import base64,hashlib,json,os,subprocess

        from pathlib import Path

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==os.environ[''JUDGE_SOURCE'']

        patches={''base'': {''bytes'': '''', ''sha256'': ''07a051cd16e61a39fd41dad0e797a413191ab138a51133432764daa67e2732e5''}, ''fix'': {''bytes'': '''', ''sha256'': ''f7f0ddc04c99b9ee41a8fc9445fe4d23be66a4e6d3e14a7dab537bb836dcd13c''}}

        item=patches[os.environ[''JUDGE_ROLE'']];patch=base64.b64decode(item[''bytes'']);assert hashlib.sha256(patch).hexdigest()==item[''sha256'']

        p=Path(os.environ[''RUNNER_TEMP''])/''reviewer-judges.patch'';p.write_bytes(patch)

        subprocess.run([''git'',''apply'',''--check'',str(p)],check=True)

        subprocess.run([''git'',''apply'',str(p)],check=True)

        expected={''crates/se/tests/runtime_refusals.rs'': ''926655bc5c6f510c7a4c72f46403c26b6553bfe1cc9cf88c71f1751e69ac3d43'', ''crates/se/tests/support/uninstall_finalizer_judges.rs'': ''7e509c8e0968ebd91c49e4413374cfaeb597b8e2e94ec8d738fbcafed0a35614'', ''crates/se/tests/support/uninstall_finalizer.py'': ''f3f0d9dde99708cfefc13c18d6606cbddec5cad9594f6b2a242a4fe4553e90fa'', ''crates/se/tests/support/uninstall_debugger.py'': ''ae58aff04426d4f36d6bf13220bafbceb32395b3818ff6f512d305a54eda9c3f'', ''crates/se/tests/support/uninstall_console.py'': ''b05f255530abd7c42917ff676366995e85e6f9930d527ff79603ea01b5e61896''}

        for name,digest in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name

        script=base64.b64decode('''')

        assert hashlib.sha256(script).hexdigest()==''deabc0895f1e1f56c7135667f0cbebbca37a970af66056434820c815144206d4''

        (Path(os.environ[''RUNNER_TEMP''])/''run-native-judges.py'').write_bytes(script)

        '
    - name: Strict native Windows validation
      shell: bash
      run: "if [ \"$JUDGE_FEATURES\" = all ]; then\n  cargo clippy -p se -p se-proc --all-targets --target x86_64-pc-windows-msvc --all-features --locked -- -D warnings\nelse\n  cargo clippy -p se -p se-proc --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings\nfi\n"
      id: strict
    - name: Witness base counterexamples or fixed public consumers
      shell: python
      run: 'import os,runpy

        from pathlib import Path

        runpy.run_path(str(Path(os.environ[''RUNNER_TEMP''])/''run-native-judges.py''),run_name=''__main__'')

        '
      if: ${{ !cancelled() }}
      env:
        JUDGE_CLIPPY_OUTCOME: ${{ steps.strict.outcome }}
    - name: Retain complete native judge evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: j5-finalizer-${{ matrix.role }}-${{ matrix.features }}
        path: ${{ runner.temp }}/finalizer-judge-evidence
        retention-days: 14
        if-no-files-found: error
