name: Native macOS process observation boundary
on:
  push:
    branches: [prime/macos-bounded-observation-408-r2]
permissions:
  contents: read
concurrency:
  group: macos-bounded-observation-408-r2-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {side: base, source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6}
          - {side: head, source: ee4c6f714695e674823233edd2aa69b270f4f887}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PRODUCT_SOURCE: ${{ matrix.source }}
      OBSERVER_SOURCE: 7abc97929f9b1983daf93289b4686cc41ec0e63d
      OBSERVE_SIDE: ${{ matrix.side }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7abc97929f9b1983daf93289b4686cc41ec0e63d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Read the pinned native compiler
        id: compiler
        shell: python
        run: |
          import os, subprocess, tomllib
          text = subprocess.check_output(['git', 'show', os.environ['PRODUCT_SOURCE'] + ':rust-toolchain.toml'], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('channel=' + tomllib.loads(text)['toolchain']['channel'] + '\n')
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rustfmt
      - name: Run unchanged product source with independent native controls
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-observation-408'
          root.mkdir()
          tree, evidence = root / 'product', root / 'evidence'
          evidence.mkdir()
          source, judge = os.environ['PRODUCT_SOURCE'], os.environ['OBSERVER_SOURCE']
          subprocess.run(['git', 'worktree', 'add', '--detach', str(tree), source], check=True)
          if subprocess.check_output(['git', '-C', str(tree), 'rev-parse', 'HEAD'], text=True).strip() != source:
              raise ValueError('Product pin differs')
          fixtures = ['crates/se-proc/tests/macos_teardown_boundary_review.rs', 'crates/se-proc/tests/support/macos_teardown_boundary_fault.c']
          copied = {}
          for name in fixtures:
              data = subprocess.check_output(['git', 'show', judge + ':' + name])
              (tree / name).write_bytes(data)
              (evidence / pathlib.Path(name).name).write_bytes(data)
              copied[name] = hashlib.sha256(data).hexdigest()
          product = tree / 'crates/se-proc/src/macos_process.rs'
          before = hashlib.sha256(product.read_bytes()).hexdigest()
          env = dict(os.environ, CARGO_TARGET_DIR=str(root / 'target'))
          host = subprocess.check_output(['rustc', '--print', 'host-tuple'], text=True).strip()
          commands = {
              'boundary': ['cargo', 'test', '--target', host, '-p', 'se-proc', '--locked', '--test', 'macos_teardown_boundary_review', '--', '--nocapture', '--test-threads=1'],
              'existing': ['cargo', 'test', '--target', host, '-p', 'se-proc', '--locked', '--test', 'macos_process_reads', '--test', 'macos_process_read_failures', '--', '--nocapture', '--test-threads=1'],
          }
          results = {}
          for label, command in commands.items():
              with (evidence / (label + '.log')).open('xb') as log:
                  child = subprocess.run(command, cwd=tree, env=env, stdout=log, stderr=subprocess.STDOUT)
              results[label] = {'argv': command, 'exit': child.returncode}
          subprocess.run(['git', '-C', str(tree), 'diff', '--exit-code'], check=True)
          if hashlib.sha256(product.read_bytes()).hexdigest() != before:
              raise ValueError('Product source changed')
          unknown = subprocess.check_output(['git', '-C', str(tree), 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          if set(unknown) != set(fixtures):
              raise ValueError('Unexpected product overlay inventory')
          cases = []
          for line in (evidence / 'boundary.log').read_text().splitlines():
              if 'NATIVE_CASE ' in line:
                  cases.append(json.loads(line.split('NATIVE_CASE ', 1)[1]))
          names = ['recover', 'recover-later', 'deadline', 'immediate', 'authority', 'denied', 'zero', 'identity', 'expired']
          complete = len(cases) == len(names) and {row['case'] for row in cases} == set(names)
          failed = sorted(row['case'] for row in cases if not row['passed'])
          expected_failed = ['deadline', 'recover', 'recover-later'] if os.environ['OBSERVE_SIDE'] == 'base' else []
          existing_summaries = [line for line in (evidence / 'existing.log').read_text().splitlines() if line.startswith('test result:')]
          existing_ok = results['existing']['exit'] == 0 and len(existing_summaries) == 2 and all('test result: ok.' in line for line in existing_summaries)
          qualified = complete and failed == expected_failed and existing_ok and results['boundary']['exit'] == (101 if expected_failed else 0)
          receipt = dict(source=source, judge=judge, side=os.environ['OBSERVE_SIDE'], fixture_sha256=copied, product_file_sha256=before, commands=results, cases=cases, failed_cases=failed, expected_failed_cases=expected_failed, existing_summaries=existing_summaries, qualified=qualified, scope='Native macOS FFI interposition; BSD facts and successful image queries stay native; no production source edits; existing native exit/absence controls unchanged; not natural race-frequency or full provider journey qualification')
          (evidence / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps({key: value for key, value in receipt.items() if key != 'cases'}, indent=2))
          if not qualified:
              raise RuntimeError('Native controls did not qualify; complete evidence retained')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: macos-bounded-observation-408-r2-${{ matrix.side }}
          path: ${{ runner.temp }}/native-observation-408/evidence
          if-no-files-found: error
          retention-days: 14
