name: Windows uninstall phase timing through a real console
'on':
  push:
    branches:
    - prime/j5-uninstall-timing-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  RUST_BACKTRACE: '1'
jobs:
  windows:
    name: Uninstall timing (${{ matrix.features }})
    runs-on: windows-2025
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        features:
        - default
        - all
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 6f1ca61b3bf934b27a9bd13189dec28c01f6491d
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: c29-windows-${{ matrix.features }}-v1
    - name: Register disposable runner account
      shell: bash
      run: 'python scripts/ci/installation_account.py provision

        python scripts/ci/installation_account.py check

        '
    - name: Extract authenticated timing observers
      shell: python
      run: "import base64,hashlib,json,os\nfrom pathlib import Path\nr=Path(os.environ['RUNNER_TEMP'])/'timing-inputs';r.mkdir()\ninputs={'token_context.py': '',\
        \ 'runtime-console-timing.ps1': '',\
        \ 'timing.py': ''}\n\
        expected={'token_context.py': 'ed4e4714a72a15a337992d771bf4c0a55e83df54a7fbbb69bde33482d9422660', 'runtime-console-timing.ps1': 'f895a6eec5c5e14be227417bd88182b8f692261cd9d5f772a86470446270feba', 'timing.py': 'fd3d39d95b8878094bc02db8f4ef7871b172c5aa70084e89298cd8d8d2a5a4d0'}\nfor name,encoded in inputs.items():\n raw=base64.b64decode(encoded);assert hashlib.sha256(raw).hexdigest()==expected[name];(r/name).write_bytes(raw)\n(r/'inputs.json').write_text(json.dumps(expected,indent=2)+'\\n')\n"
    - name: Measure native console uninstall after observed shutdown
      shell: python
      env:
        TIMING_FEATURES: ${{ matrix.features }}
        TIMING_OUT: ${{ runner.temp }}/uninstall-timing-evidence-${{ matrix.features }}
      run: 'import os,runpy,sys

        from pathlib import Path

        r=Path(os.environ[''RUNNER_TEMP''])/''timing-inputs'';sys.path.insert(0,str(r))

        runpy.run_path(str(r/''timing.py''),run_name=''__main__'')

        '
    - name: Retain phase timing and bounded diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: j5-uninstall-timing-${{ matrix.features }}
        path: ${{ runner.temp }}/uninstall-timing-evidence-${{ matrix.features }}
        retention-days: 14
        if-no-files-found: error
