name: SSH forwarding refusal comparison
'on':
  push:
    branches:
    - prime/ssh-refusal-322-corrected
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - side: base
          ref: debfcda8a28a82b70f84178c8c1b9877542d3fca
        - side: head
          ref: e1c0fce62bfa74f24610b64119571385c28f8cfd
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.ref }}
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: judge-linux-v1
        save-if: 'false'
    - name: Build the exact reviewed CLI
      run: |
        cargo build --locked --all-features -p se --bin se
        git rev-parse HEAD > "$RUNNER_TEMP/ssh-source"
        test "$(cat "$RUNNER_TEMP/ssh-source")" = "${{ matrix.ref }}"
    - name: Write the independent real SSH control
      shell: python
      run: |
        import os
        from pathlib import Path
        Path(os.environ["RUNNER_TEMP"]).joinpath("ssh-control.py").write_text('"""Real SSH refusal control. Run only on a disposable hosted Linux runner as root."""\nimport argparse\nimport ctypes\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport pwd\nimport shutil\nimport signal\nimport socket\nimport subprocess\nimport time\nimport uuid\n\n\ndef observe(pid):\n    try:\n        root = Path(\'/proc\') / str(pid)\n        fields = (root / \'stat\').read_text().rsplit(\') \', 1)[1].split()\n        return {\'pid\': pid, \'birth\': fields[19], \'state\': fields[0],\n                \'uid\': root.stat().st_uid,\n                \'argv\': [os.fsdecode(x) for x in (root / \'cmdline\').read_bytes().split(b\'\\0\') if x]}\n    except (FileNotFoundError, ProcessLookupError):\n        return None\n\n\nclass Control:\n    def __init__(self, args):\n        self.args = args\n        self.output = args.output.resolve()\n        self.output.mkdir(parents=True, exist_ok=False)\n        self.suffix = uuid.uuid4().hex[:10]\n        self.users = []\n        self.calls = 0\n        self.server = None\n        self.server_log = None\n        self.result = {\'side\': args.side, \'source\': args.source, \'client_log_level\': args.client_log_level,\n                       \'image_sha256\': hashlib.sha256(args.se.read_bytes()).hexdigest(),\n                       \'passed\': False, \'cleanup\': {}}\n        # Detached native children remain joinable by this outside driver.\n        if ctypes.CDLL(None, use_errno=True).prctl(36, 1, 0, 0, 0) != 0:\n            raise OSError(ctypes.get_errno(), \'cannot establish child subreaper\')\n\n    def run_command(self, label, argv, timeout=150, check=True, cwd=None):\n        self.calls += 1\n        prefix = self.output / f\'{self.calls:02}-{label}\'\n        started = time.monotonic()\n        process = subprocess.Popen(argv, cwd=cwd or \'/\', stdin=subprocess.DEVNULL,\n                                   stdout=subprocess.PIPE, stderr=subprocess.PIPE)\n        try:\n            stdout, stderr = process.communicate(timeout=timeout)\n        except subprocess.TimeoutExpired:\n            identity = observe(process.pid)\n            if identity is None or identity[\'argv\'] != argv:\n                raise RuntimeError(\'cannot prove timed-out child identity\')\n            os.kill(process.pid, signal.SIGKILL)\n            stdout, stderr = process.communicate(timeout=10)\n            prefix.with_suffix(\'.stdout\').write_bytes(stdout)\n            prefix.with_suffix(\'.stderr\').write_bytes(stderr)\n            raise TimeoutError(f\'{label} exceeded {timeout}s\')\n        prefix.with_suffix(\'.stdout\').write_bytes(stdout)\n        prefix.with_suffix(\'.stderr\').write_bytes(stderr)\n        row = {\'argv\': argv, \'exit\': process.returncode, \'seconds\': time.monotonic() - started}\n        prefix.with_suffix(\'.json\').write_text(json.dumps(row, indent=2) + \'\\n\')\n        if check and process.returncode:\n            raise AssertionError((label, row, stdout.decode(errors=\'replace\'), stderr.decode(errors=\'replace\')))\n        return row, stdout, stderr\n\n    def user_command(self, account, *argv):\n        return [\'runuser\', \'-u\', account.pw_name, \'--\', \'env\', \'-i\',\n                \'PATH=/usr/local/bin:/usr/bin:/bin\', \'HOME=\' + account.pw_dir,\n                \'USER=\' + account.pw_name, \'LOGNAME=\' + account.pw_name,\n                \'LANG=C.UTF-8\', *map(str, argv)]\n\n    def make_user(self, role):\n        name = \'ssh\' + self.suffix + role\n        profile = Path(\'/home\') / name\n        self.run_command(\'user-create-\' + role,\n                         [\'useradd\', \'--create-home\', \'--home-dir\', str(profile), \'--shell\', \'/bin/sh\', name])\n        account = pwd.getpwnam(name)\n        self.users.append(account)\n        # Unlock the account for key authentication; passwords stay disabled in sshd.\n        self.run_command(\'user-unlock-\' + role, [\'passwd\', \'-d\', name])\n        profile.chmod(0o700)\n        return account\n\n    def own(self, path, account, mode):\n        path.chmod(mode)\n        os.chown(path, account.pw_uid, account.pw_gid)\n\n    def fixture_processes(self):\n        uids = {u.pw_uid for u in self.users}\n        rows = []\n        for path in Path(\'/proc\').iterdir():\n            if path.name.isdecimal():\n                row = observe(int(path.name))\n                if row and row[\'uid\'] in uids:\n                    rows.append(row)\n        return rows\n\n    def reap(self):\n        for row in self.fixture_processes():\n            if row[\'state\'] == \'Z\':\n                try:\n                    os.waitpid(row[\'pid\'], os.WNOHANG)\n                except ChildProcessError:\n                    pass\n\n    def prepare(self):\n        source = self.make_user(\'s\')\n        destination = self.make_user(\'d\')\n        self.source, self.destination = source, destination\n        self.source_home = Path(source.pw_dir) / \'state\'\n        self.destination_home = Path(destination.pw_dir) / \'.local/state/stateengine\'\n        self.image = Path(source.pw_dir) / \'se\'\n        shutil.copyfile(self.args.se, self.image)\n        self.own(self.image, source, 0o755)\n        repo = Path(source.pw_dir) / \'repo\'\n        repo.mkdir()\n        self.own(repo, source, 0o700)\n        self.repo = repo\n        for user in (source, destination):\n            directory = Path(user.pw_dir) / \'.ssh\'\n            directory.mkdir()\n            self.own(directory, user, 0o700)\n        key = Path(source.pw_dir) / \'.ssh/id_ed25519\'\n        self.run_command(\'key-create\', self.user_command(source, \'ssh-keygen\', \'-q\', \'-t\', \'ed25519\', \'-N\', \'\', \'-f\', key))\n        self.own(key, source, 0o600)\n        assert key.stat().st_mode & 0o777 == 0o600 and key.stat().st_uid == source.pw_uid\n        authorized = Path(destination.pw_dir) / \'.ssh/authorized_keys\'\n        authorized.write_text(\'no-port-forwarding,no-agent-forwarding,no-X11-forwarding \' + key.with_suffix(\'.pub\').read_text())\n        self.own(authorized, destination, 0o600)\n        hostkey = self.output / \'server-key\'\n        self.run_command(\'server-key-create\', [\'ssh-keygen\', \'-q\', \'-t\', \'ed25519\', \'-N\', \'\', \'-f\', str(hostkey)])\n        hostkey.chmod(0o600)\n        with socket.socket() as reservation:\n            reservation.bind((\'127.0.0.1\', 0))\n            port = reservation.getsockname()[1]\n        known = Path(source.pw_dir) / \'.ssh/known_hosts\'\n        known.write_text(f\'[127.0.0.1]:{port} \' + hostkey.with_suffix(\'.pub\').read_text())\n        self.own(known, source, 0o600)\n        config = Path(source.pw_dir) / \'.ssh/config\'\n        config.write_text(f\'Host restricted\\n  HostName 127.0.0.1\\n  Port {port}\\n  User {destination.pw_name}\\n\'\n                          f\'  IdentityFile {key}\\n  IdentitiesOnly yes\\n  BatchMode yes\\n  StrictHostKeyChecking yes\\n\'\n                          f\'  UserKnownHostsFile {known}\\n  GlobalKnownHostsFile /dev/null\\n  ControlMaster no\\n\'\n                          f\'  ConnectTimeout 5\\n  LogLevel {self.args.client_log_level}\\n\')\n        self.own(config, source, 0o600)\n        server_config = self.output / \'sshd_config\'\n        server_config.write_text(f\'Port {port}\\nListenAddress 127.0.0.1\\nHostKey {hostkey}\\n\'\n                                 f\'PidFile {self.output}/sshd.pid\\nAuthorizedKeysFile .ssh/authorized_keys\\n\'\n                                 f\'AllowUsers {destination.pw_name}\\nPasswordAuthentication no\\n\'\n                                 \'KbdInteractiveAuthentication no\\nPubkeyAuthentication yes\\nUsePAM no\\n\'\n                                 \'PermitRootLogin no\\nStrictModes yes\\nAllowTcpForwarding yes\\n\'\n                                 \'DisableForwarding no\\nLogLevel VERBOSE\\n\')\n        Path(\'/run/sshd\').mkdir(exist_ok=True)\n        self.run_command(\'server-config-check\', [\'/usr/sbin/sshd\', \'-t\', \'-f\', str(server_config)])\n        self.server_log = (self.output / \'sshd.log\').open(\'wb\')\n        self.server = subprocess.Popen([\'/usr/sbin/sshd\', \'-D\', \'-e\', \'-f\', str(server_config)],\n                                       stdin=subprocess.DEVNULL, stdout=self.server_log, stderr=subprocess.STDOUT)\n        self.server_birth = observe(self.server.pid)[\'birth\']\n        deadline = time.monotonic() + 10\n        while True:\n            if self.server.poll() is not None:\n                raise AssertionError(\'owned sshd exited before readiness\')\n            try:\n                with socket.create_connection((\'127.0.0.1\', port), timeout=.1):\n                    break\n            except OSError:\n                if time.monotonic() > deadline:\n                    raise TimeoutError(\'owned sshd did not listen\')\n                time.sleep(.05)\n        row, out, _ = self.run_command(\'ssh-command-control\', self.user_command(source, \'ssh\', \'restricted\', \'printf command-ok\'))\n        assert out == b\'command-ok\', \'real SSH key command did not succeed\'\n        row, _, err = self.run_command(\'ssh-forwarding-control\',\n                                      self.user_command(source, \'ssh\', \'-W\', \'127.0.0.1:9\', \'restricted\'), check=False)\n        assert row[\'exit\'] != 0, \'restricted key unexpectedly permitted direct-tcpip\'\n        if self.args.client_log_level == \'INFO\':\n            assert b\'administratively prohibited\' in err, \'client did not expose the forwarding refusal\'\n        else:\n            assert b\'stdio forwarding failed\' in err\n            assert b\'administratively prohibited\' not in err\n            assert \'refused local port forward:\' in (self.output / \'sshd.log\').read_text()\n        self.result[\'real_ssh_command_passed\'] = True\n        self.result[\'real_ssh_forwarding_prohibited\'] = True\n\n    def run(self):\n        self.prepare()\n        for command in [(\'remote\', \'--help\'), (\'remote\', \'add\', \'--help\'), (\'init\', \'--help\')]:\n            self.run_command(\'help\', self.user_command(self.source, self.image, *command))\n        self.run_command(\'init\', self.user_command(self.source, self.image, \'--home\', self.source_home,\n                         \'--json\', \'--key\', str(uuid.uuid4()), \'init\', \'--repo\', self.repo,\n                         \'--name\', \'SSH control\', \'--agent\', \'Worker\', \'--provider\', \'codex\'), cwd=str(self.repo))\n        row, out, err = self.run_command(\'remote-add\', self.user_command(self.source, self.image,\n                         \'--home\', self.source_home, \'--json\', \'remote\', \'add\', \'restricted\', \'--name\', \'blocked\'),\n                         check=False, cwd=str(self.repo))\n        response = json.loads(out)\n        text = json.dumps(response)\n        self.result[\'remote_add\'] = row | {\'response\': response}\n        assert row[\'exit\'] != 0, \'public add incorrectly reported success\'\n        assert response[\'code\'] == \'listener-unavailable\', \'refusal did not reach the intended forwarding path\'\n        if self.args.side == \'head\':\n            for phrase in (\'administratively prohibited\', \'AllowTcpForwarding\', \'no-port-forwarding\', \'PermitOpen\'):\n                assert phrase in text, f\'public head refusal omits {phrase}\'\n        else:\n            assert \'administratively prohibited\' not in text, \'base already names the forwarding restriction\'\n            assert \'WebSocket Upgrade interrupted\' in text, \'base failed outside the expected forwarded transport\'\n        self.result[\'before_cleanup\'] = self.fixture_processes()\n        # The failed add must retire its SSH forward immediately, before host down.\n        assert not any(row[\'argv\'] and Path(row[\'argv\'][0]).name == \'ssh\'\n                       for row in self.result[\'before_cleanup\']), \'failed add left an SSH client alive\'\n        self.result[\'passed\'] = True\n\n    def cleanup(self):\n        errors = []\n        for role in (\'source\', \'destination\'):\n            account = getattr(self, role, None)\n            home = getattr(self, role + \'_home\', None)\n            if account is None or home is None or not (home / \'endpoint.json\').exists():\n                self.result[\'cleanup\'][role] = {\'state\': \'no-endpoint\'}\n                continue\n            # Destination runs the same exact source image staged by real remote add.\n            if role == \'source\':\n                image = self.image\n            else:\n                digest = self.result[\'image_sha256\']\n                image = Path(account.pw_dir) / \'.stateengine-runtime\' / digest / \'se\'\n            try:\n                row, out, _ = self.run_command(role + \'-down\', self.user_command(account, image,\n                                               \'--home\', home, \'--json\', \'down\'), timeout=60)\n                receipt = json.loads(out)\n                assert receipt[\'complete\'] and receipt[\'witness\'][\'state\'] == \'witnessed\'\n                assert not (home / \'endpoint.json\').exists()\n                self.result[\'cleanup\'][role] = {\'state\': \'joined\', \'receipt\': receipt}\n            except Exception as error:\n                errors.append(f\'{role}: {error}\')\n        if self.server is not None:\n            identity = observe(self.server.pid)\n            self.result[\'cleanup\'][\'sshd_identity\'] = identity\n            try:\n                if self.server.poll() is None:\n                    assert identity and identity[\'birth\'] == self.server_birth\n                    assert str(self.output / \'sshd_config\') in \' \'.join(identity[\'argv\'])\n                    os.kill(self.server.pid, signal.SIGTERM)\n                self.result[\'cleanup\'][\'sshd_exit\'] = self.server.wait(timeout=10)\n            except Exception as error:\n                errors.append(f\'sshd: {error}\')\n        if self.server_log:\n            self.server_log.close()\n        deadline = time.monotonic() + 10\n        while True:\n            self.reap()\n            remaining = self.fixture_processes()\n            if not remaining or time.monotonic() > deadline:\n                break\n            time.sleep(.05)\n        self.result[\'cleanup\'][\'remaining_before_emergency\'] = remaining\n        if remaining:\n            errors.append(\'fixture user processes survived public shutdown\')\n        for row in remaining:\n            current = observe(row[\'pid\'])\n            if current and current[\'birth\'] == row[\'birth\'] and current[\'argv\'] == row[\'argv\'] and current[\'state\'] != \'Z\':\n                os.kill(row[\'pid\'], signal.SIGKILL)\n        deadline = time.monotonic() + 5\n        while self.fixture_processes() and time.monotonic() < deadline:\n            self.reap()\n            time.sleep(.05)\n        self.result[\'cleanup\'][\'remaining\'] = self.fixture_processes()\n        self.result[\'cleanup\'][\'errors\'] = errors\n        if errors or self.result[\'cleanup\'][\'remaining\']:\n            self.result[\'passed\'] = False\n        else:\n            for account in self.users:\n                self.run_command(\'user-remove\', [\'userdel\', account.pw_name])\n                shutil.rmtree(account.pw_dir)\n        # Never publish the synthetic private SSH keys or whole account profiles.\n        for path in (self.output / \'server-key\', self.output / \'server-key.pub\'):\n            path.unlink(missing_ok=True)\n        (self.output / \'result.json\').write_text(json.dumps(self.result, indent=2) + \'\\n\')\n        for path in self.output.iterdir():\n            if path.is_file():\n                path.chmod(0o644)\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\'--se\', type=Path, required=True)\n    parser.add_argument(\'--side\', choices=(\'base\', \'head\'), required=True)\n    parser.add_argument(\'--source\', required=True)\n    parser.add_argument(\'--output\', type=Path, required=True)\n    parser.add_argument(\'--container-dev\', action=\'store_true\')\n    parser.add_argument(\'--client-log-level\', choices=(\'INFO\', \'ERROR\'), default=\'INFO\')\n    args = parser.parse_args()\n    isolated = os.environ.get(\'GITHUB_ACTIONS\') == \'true\' or (args.container_dev and Path(\'/.dockerenv\').is_file())\n    assert os.geteuid() == 0 and isolated, \'disposable hosted or explicitly selected container administrator required\'\n    control = Control(args)\n    try:\n        control.run()\n    except Exception as error:\n        control.result[\'failure\'] = repr(error)\n        control.result[\'passed\'] = False\n        if getattr(control, \'source\', None) and control.server and control.server.poll() is None:\n            try:\n                digest = control.result[\'image_sha256\']\n                control.run_command(\'failure-cache-metadata\', control.user_command(control.source, \'ssh\', \'restricted\',\n                    \'pwd; id -u; stat -c "%u %a %F %n" . .stateengine-runtime .stateengine-runtime/\' + digest),\n                    timeout=15, check=False)\n            except Exception as diagnostic:\n                control.result[\'diagnostic_error\'] = repr(diagnostic)\n    finally:\n        control.cleanup()\n    print(json.dumps(control.result, indent=2))\n    return 0 if control.result[\'passed\'] else 1\n\n\nif __name__ == \'__main__\':\n    raise SystemExit(main())\n')
        Path(os.environ["RUNNER_TEMP"]).joinpath("ssh-control.Dockerfile").write_text('FROM python@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159\nRUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-client openssh-server ca-certificates && rm -r /var/lib/apt/lists/*\nWORKDIR /\n')
    - name: Build the qualified disposable SSH environment
      run: |
        sudo docker build --tag ssh-refusal-control - < "$RUNNER_TEMP/ssh-control.Dockerfile"
        mkdir "$RUNNER_TEMP/ssh-artifacts"
    - name: Exercise public remote add and witness joined cleanup
      env:
        SIDE: ${{ matrix.side }}
      run: |
        sudo docker run --rm --network none --cpus 2 --memory 2g --pids-limit 256 --mount "type=bind,src=$PWD/target/debug/se,dst=/images/se,readonly" --mount "type=bind,src=$RUNNER_TEMP/ssh-control.py,dst=/control.py,readonly" --mount "type=bind,src=$RUNNER_TEMP/ssh-artifacts,dst=/evidence" --entrypoint /usr/local/bin/python3 ssh-refusal-control /control.py --container-dev --se /images/se --source "$(cat "$RUNNER_TEMP/ssh-source")" --side "$SIDE" --output /evidence/info
    - name: Record the head refusal when SSH logging suppresses channel details
      if: ${{ matrix.side == 'head' }}
      run: |
        sudo docker run --rm --network none --cpus 2 --memory 2g --pids-limit 256 --mount "type=bind,src=$PWD/target/debug/se,dst=/images/se,readonly" --mount "type=bind,src=$RUNNER_TEMP/ssh-control.py,dst=/control.py,readonly" --mount "type=bind,src=$RUNNER_TEMP/ssh-artifacts,dst=/evidence" --entrypoint /usr/local/bin/python3 ssh-refusal-control /control.py --container-dev --client-log-level ERROR --se /images/se --side head --source "$(cat "$RUNNER_TEMP/ssh-source")" --output /evidence/error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ssh-refusal-${{ matrix.side }}
        path: ${{ runner.temp }}/ssh-artifacts/info/
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() && matrix.side == 'head' }}
      with:
        name: ssh-refusal-head-error
        path: ${{ runner.temp }}/ssh-artifacts/error/
        if-no-files-found: error
