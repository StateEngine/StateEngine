name: Metadata custody feasibility r2
on:
  workflow_dispatch:
  push:
    branches: [prime/metadata-custody-feasibility-r2]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Observe existing directory custody and mutation controls
        shell: python
        run: |
          import base64,hashlib,os,subprocess,sys
          from pathlib import Path
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='681acfb625d72065dd53887f8884594a1a85d79ab657550d27e61a215230d71b'
          script=Path(os.environ['RUNNER_TEMP'])/'metadata-custody-probe.py'
          script.write_bytes(data)
          raise SystemExit(subprocess.run([sys.executable,str(script)]).returncode)
      - name: Retain native observations and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metadata-custody-feasibility-r2
          path: ${{ runner.temp }}/metadata-custody-feasibility/report.json
          retention-days: 3
          if-no-files-found: error
