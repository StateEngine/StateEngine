name: Remote fresh conversation independent review r4
on:
  push:
    branches: [prime/fresh-remote-launch-441-review-r4]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 54d49ae96413895159e3c9113d87840a284e0e90
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e44a8af2a486b1835bdf7d097491873ece4a83d4
          path: judge-source
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Install native SSH server prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Build frozen source and judge actual SSH consumer
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,shutil,subprocess,time
          root=pathlib.Path('review-evidence').resolve();root.mkdir()
          source='54d49ae96413895159e3c9113d87840a284e0e90'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          judge=pathlib.Path('judge-source').resolve()
          judge_sha=subprocess.check_output(['git','-C',str(judge),'rev-parse','HEAD'],text=True).strip()
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'remote-launch441-target'
          os.environ['CARGO_TARGET_DIR']=str(target)
          host=subprocess.check_output(['rustc','-vV'],text=True).split('host: ',1)[1].splitlines()[0]
          commands=[];failures=[]
          def run(label,argv):
              started=time.monotonic_ns()
              with (root/(label+'.stdout')).open('wb') as out,(root/(label+'.stderr')).open('wb') as err:
                  value=subprocess.run(argv,stdin=subprocess.DEVNULL,stdout=out,stderr=err)
              commands.append({'label':label,'argv':argv,'exit':value.returncode,'elapsed_ns':time.monotonic_ns()-started})
              (root/'commands.json').write_text(json.dumps(commands,indent=2)+'\n')
              return value.returncode
          built=run('build',['cargo','build','-p','se','--bin','se','--all-features','--locked','--target',host])==0
          if not built:failures.append('native build failed')
          image=root/'se';image_hash=None
          if built:
              shutil.copy2(target/host/'debug/se',image)
              if run('strip',['strip','--strip-debug',str(image)]):failures.append('strip failed')
              image_hash=hashlib.sha256(image.read_bytes()).hexdigest()
              script=judge/'crates/se/tests/judges/fresh_remote_conversation.py'
              code=run('remote-consumer',['python3',str(script),'--se',str(image),'--output',str(root/'consumer')])
              path=root/'consumer/result.json'
              if not path.is_file():failures.append('remote consumer result absent')
              else:
                  result=json.loads(path.read_text())
                  closure=result.get('closure',{})
                  if code or result['failures'] or len(result['checks'])!=7 or any(closure.get(name,{}).get('witnessed') is not True for name in ('source','destination','ssh')):
                      failures.append('remote consumer or native closure failed')
          image.unlink(missing_ok=True)
          # Ephemeral test-only SSH keys are never retained as evidence.
          for path in (root/'consumer/ssh/client-key',root/'consumer/ssh/server-key'):
              path.unlink(missing_ok=True)
          names=['fresh_remote_conversation.py','private_ssh_fixture.py','fresh_conversation_provider.py','mail_cli.py','fixture_paths.py']
          inputs={name:hashlib.sha256((judge/'crates/se/tests/judges'/name).read_bytes()).hexdigest() for name in names}
          report={'source':source,'judge':judge_sha,'inputs':inputs,'target':host,'binary_sha256':image_hash,'commands':commands,'failures':failures,
                  'scope':'Native loopback OpenSSH and saved pairing/Owner launch permission, source/destination hosts, CLI and authenticated agent MCP. Only the provider is a protocol double. Development image; elapsed/private-memory observations are not release performance qualification.'}
          (root/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          members=[{'path':str(path.relative_to(root)),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for path in sorted(root.rglob('*')) if path.is_file()]
          (root/'manifest.json').write_text(json.dumps({'members':members},indent=2)+'\n')
          raise SystemExit(bool(failures))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: fresh-remote-launch-441-review-r4
          path: review-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
