name: Atlas response fitting escaped wire and full source observation
'on':
- push
- workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
        - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 9cd65b073508104d8f0a08c7c6d04a75f782a5cc
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: 'import os,tomllib

        from pathlib import Path

        channel=tomllib.loads(Path(''rust-toolchain.toml'').read_text())[''toolchain''][''channel'']

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as out:print(''channel=''+channel,file=out)

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Compile and exercise existing native readers
      shell: python
      run: "import pathlib,subprocess,os,time,json\nroot=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'atlas-response-native';out.mkdir()\nenv=dict(os.environ,CARGO_TARGET_DIR=str(root/'response-native-target'),CARGO_BUILD_JOBS='2',CARGO_INCREMENTAL='0',CARGO_PROFILE_DEV_DEBUG='0',CARGO_PROFILE_TEST_DEBUG='0')\nsource=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();receipts=[];host=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip()\ncommands=[('clippy',['cargo','clippy','--workspace','--all-targets','--all-features','--locked','--','-D','warnings']),('types-tests',['cargo','test','-p','se-types','--all-features','--locked']),('atlas-tests',['cargo','test','-p','se-atlas','--all-features','--locked']),('native-query-tests',['cargo','test','-p','se-host','--all-features','--locked','--test','atlas_query_reads'])]\nfor label,argv in commands:\n boundary=argv.index('--') if '--' in argv else len(argv);argv=argv[:boundary]+['--target',host]+argv[boundary:]\n\
        \ start=time.monotonic_ns()\n with (out/(label+'.stdout')).open('w') as stdout,(out/(label+'.stderr')).open('w') as stderr:p=subprocess.run(argv,env=env,stdout=stdout,stderr=stderr,timeout=1500)\n receipts.append({'source':source,'argv':argv,'exit':p.returncode,'elapsed_ns':time.monotonic_ns()-start});(out/'executions.json').write_text(json.dumps(receipts,indent=2))\n\n\nraise SystemExit(1 if any(r[\"exit\"] for r in receipts) else 0)\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: atlas-response-native-${{ matrix.os }}
        path: ${{ runner.temp }}/atlas-response-native/*
        if-no-files-found: error
  public-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 9cd65b073508104d8f0a08c7c6d04a75f782a5cc
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Read pinned compiler
      id: compiler
      shell: python
      run: 'import os,tomllib

        from pathlib import Path

        channel=tomllib.loads(Path(''rust-toolchain.toml'').read_text())[''toolchain''][''channel'']

        with open(os.environ[''GITHUB_OUTPUT''],''a'') as out:print(''channel=''+channel,file=out)

        '
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: ${{ steps.compiler.outputs.channel }}
    - name: Compile then exercise the normal public owner and CLI
      shell: python
      run: "MCP_OBSERVER='\"\"\"Author readback of real MCP search pages in an isolated native provider fixture.\"\"\"\\nimport argparse,hashlib,json,os,pathlib,shutil,subprocess,sys,time,traceback\\np=argparse.ArgumentParser();p.add_argument(\\'--se\\',type=pathlib.Path,required=True);p.add_argument(\\'--source\\',type=pathlib.Path,required=True);p.add_argument(\\'--out\\',type=pathlib.Path,required=True);a=p.parse_args()\\nsys.dont_write_bytecode=True\\nsys.path.insert(0,str(a.source/\\'crates/se/tests/judges\\'))\\nfrom mail_cli import Fixture\\nfrom fixture_paths import private_runtime_directory\\nroot=a.out.resolve();root.mkdir(mode=0o700);f=None;report={\\'queries\\':[],\\'limitations\\':[\\'Author observations, not an independent judge.\\',\\'Native provider protocol double and private home; provider command configuration changes only, no cache/profile/database edits.\\']}\\ndef save():(root/\\'report.json\\').write_text(json.dumps(report,indent=2))\\ndef rpc(arguments,label):\\n\
        \ before=f.calls;start=time.monotonic_ns()\\n try:result=f.rpc(\\'stateengine_atlas_find\\',arguments);error=None\\n except BaseException as e:result=None;error=repr(e)\\n stem=f.log_root/f\\'call-{f.calls:02}\\'\\n raw=stem.with_suffix(\\'.stdout\\').read_bytes();reply=json.loads(raw) if raw else None\\n row={\\'label\\':label,\\'arguments\\':arguments,\\'result\\':result,\\'reply\\':reply,\\'failure\\':error,\\'elapsed_ns\\':time.monotonic_ns()-start,\\'wire_bytes\\':len(raw)}\\n report[\\'queries\\'].append(row);save();return row\\ntry:\\n f=Fixture(a.se,root/\\'fixture\\');f.env[\\'XDG_RUNTIME_DIR\\']=str(private_runtime_directory())\\n wrapper=f.root/\\'provider.rs\\';wrapper.write_text(wrapper.read_text().replace(\\'2.1.287\\',\\'2.1.318\\'))\\n subprocess.run([\\'rustc\\',\\'--edition=2024\\',str(wrapper),\\'-o\\',str(f.root/\\'provider\\')],capture_output=True,check=True,timeout=60)\\n corpus=[]\\n for path in sorted((a.source/\\'crates/se-atlas/src\\').rglob(\\'*.rs\\')):\\\
        n  rel=path.relative_to(a.source/\\'crates/se-atlas\\');dest=f.repo/rel;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,dest);corpus.append({\\'path\\':rel.as_posix(),\\'sha256\\':hashlib.sha256(dest.read_bytes()).hexdigest()})\\n (root/\\'corpus.json\\').write_text(json.dumps(corpus,indent=2))\\n for cmd in [[\\'git\\',\\'init\\',\\'-q\\'],[\\'git\\',\\'add\\',\\'--\\',\\'src\\'],[\\'git\\',\\'-c\\',\\'user.name=Source fixture\\',\\'-c\\',\\'user.email=fixture@example.invalid\\',\\'commit\\',\\'-q\\',\\'-m\\',\\'Create ordinary source corpus\\']]:subprocess.run(cmd,cwd=f.repo,env=f.env,capture_output=True,check=True)\\n f.ok(\\'up\\');f.launch();report[\\'launch\\']=\\'real session and both discovery transports witnessed\\'\\n end=time.monotonic()+180\\n while True:\\n  status=f.ok(\\'--project\\',f.project,\\'status\\');coverage=(status.get(\\'atlas\\',{}).get(\\'summary\\')or{}).get(\\'coverage\\',{})\\n  if coverage.get(\\'discovery_complete\\') and coverage.get(\\\
        'indexed_files\\',0)==len(corpus):report[\\'indexed_status\\']=status;break\\n  if time.monotonic()>=end:raise RuntimeError(\\'ordinary source coverage not complete\\')\\n  time.sleep(.5)\\n for repetition in range(2):\\n  for kind,term,mode in [(\\'symbol\\',\\'new\\',None),(\\'symbol\\',\\'read\\',None),(\\'symbol\\',\\'collect\\',\\'literal\\'),(\\'path\\',\\'query\\',\\'literal\\'),(\\'path\\',\\'cache\\',\\'literal\\'),(\\'text\\',\\'Atlas\\',\\'literal\\')]:\\n   for fmt in [\\'compact\\',\\'json\\']:\\n    for full in [False,True]:\\n     for budget in [4096,32768]:\\n      args={\\'query\\':term,\\'kind\\':kind,\\'format\\':fmt,\\'byte_budget\\':budget,\\'full\\':full}\\n      if mode:args[\\'mode\\']=mode\\n      seen=set()\\n      for page_number in range(30):\\n       row=rpc(args,f\\'{repetition}-{kind}-{term}-{fmt}-{budget}-full{full}-page{page_number}\\')\\n       result=row[\\'result\\'] or {};content=result.get(\\'content\\',[])\\n       if row[\\'failure\\'] or result.get(\\\
        'isError\\') or not content:break\\n       text=content[0][\\'text\\']\\n       if fmt==\\'json\\':nxt=json.loads(text).get(\\'data\\',{}).get(\\'value\\',{}).get(\\'page\\',{}).get(\\'next\\')\\n       else:nxt=next((line[6:] for line in text.splitlines() if line.startswith(\\'more: \\')),None)\\n       if not nxt:break\\n       if nxt in seen:raise RuntimeError(\\'cursor did not progress\\')\\n       seen.add(nxt);args={**args,\\'cursor\\':nxt}\\n      else:row[\\'page_cap_reached\\']=True;save()\\n report[\\'observation\\']=\\'completed\\'\\nexcept BaseException:\\n report[\\'failure\\']=traceback.format_exc();report[\\'observation\\']=\\'incomplete\\';raise\\nfinally:\\n try:\\n  if f:f.close();report[\\'shutdown\\']=\\'native closure witnessed and endpoint absent\\'\\n finally:save()\\n'\nOBSERVER='\"\"\"Capture public CLI searches over real source files in a private native owner home.\"\"\"\\nimport argparse,collections,hashlib,json,os,pathlib,shutil,subprocess,tempfile,time,traceback,uuid\\\
        np=argparse.ArgumentParser();p.add_argument(\\'--se\\',type=pathlib.Path,required=True);p.add_argument(\\'--source\\',type=pathlib.Path,required=True);p.add_argument(\\'--out\\',type=pathlib.Path,required=True);a=p.parse_args()\\nimage=a.se.resolve();source=a.source.resolve();root=a.out.resolve();root.mkdir(mode=0o700);raw=root/\\'calls\\';raw.mkdir();owner=root/\\'owner\\';owner.mkdir(mode=0o700);home=root/\\'state\\';repo=root/\\'repo\\';repo.mkdir();runtime=pathlib.Path(tempfile.mkdtemp(prefix=\\'se-358-\\',dir=\\'/tmp\\'))\\nenv={k:v for k,v in os.environ.items() if not k.startswith((\\'SE_\\',\\'STATEENGINE_\\',\\'CODEX_\\',\\'CLAUDE\\',\\'ANTHROPIC_\\',\\'GIT_\\'))}\\nenv.update(HOME=str(owner),USERPROFILE=str(owner),GIT_CONFIG_NOSYSTEM=\\'1\\',GIT_CONFIG_GLOBAL=str(owner/\\'empty-git-config\\'),XDG_RUNTIME_DIR=str(runtime))\\nfor k in [\\'XDG_CONFIG_HOME\\',\\'XDG_CACHE_HOME\\',\\'XDG_DATA_HOME\\',\\'XDG_STATE_HOME\\',\\'CODEX_HOME\\']:\\n d=owner/k.lower();d.mkdir(mode=0o700);env[k]=str(d)\\\
        ncorpus=[]\\nfor path in sorted((source/\\'crates/se-atlas/src\\').rglob(\\'*.rs\\')):\\n rel=path.relative_to(source/\\'crates/se-atlas\\');dest=repo/rel;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,dest);corpus.append({\\'path\\':rel.as_posix(),\\'bytes\\':dest.stat().st_size,\\'sha256\\':hashlib.sha256(dest.read_bytes()).hexdigest()})\\n(root/\\'corpus.json\\').write_text(json.dumps(corpus,indent=2))\\ncount=0;project=None;host=None;report={\\'source\\':subprocess.check_output([\\'git\\',\\'rev-parse\\',\\'HEAD\\'],cwd=source,text=True).strip(),\\'image_sha256\\':hashlib.sha256(image.read_bytes()).hexdigest(),\\'corpus_files\\':len(corpus),\\'corpus_bytes\\':sum(x[\\'bytes\\'] for x in corpus),\\'queries\\':[],\\'limitations\\':[\\'Author development observations through the public CLI; not independent resource admission.\\',\\'No provider launch or MCP; isolated owner/home; real crate sources copied without synthetic cache rows or profile changes.\\']}\\\
        ndef call(args,label,json_mode=True):\\n global count\\n count+=1;cmd=[str(image),*([\\'--json\\'] if json_mode else []),\\'--home\\',str(home),*([\\'--project\\',project] if project and args[0] not in [\\'up\\',\\'down\\'] else []),*args]\\n start=time.monotonic_ns();r=subprocess.run(cmd,cwd=repo,env=env,stdin=subprocess.DEVNULL,capture_output=True,timeout=120);stem=raw/f\\'{count:04}-{label}\\';stem.with_suffix(\\'.stdout\\').write_bytes(r.stdout);stem.with_suffix(\\'.stderr\\').write_bytes(r.stderr)\\n meta={\\'call\\':count,\\'label\\':label,\\'argv\\':cmd,\\'exit\\':r.returncode,\\'elapsed_ns\\':time.monotonic_ns()-start}\\n try:meta[\\'decoded\\']=json.loads(r.stdout)\\n except ValueError:meta[\\'decoded\\']=None\\n stem.with_suffix(\\'.json\\').write_text(json.dumps(meta,indent=2));return meta\\n\\ndef save(): (root/\\'report.json\\').write_text(json.dumps(report,indent=2)+\\'\\\\n\\')\\ndef proc(pid):\\n try:\\n  stat=pathlib.Path(f\\'/proc/{pid}/stat\\').read_text().rsplit(\\\
        ') \\',1)[1].split();return {\\'state\\':stat[0],\\'birth\\':stat[19],\\'command\\':pathlib.Path(f\\'/proc/{pid}/cmdline\\').read_bytes().replace(b\\'\\\\0\\',b\\' \\').decode(errors=\\'replace\\')}\\n except FileNotFoundError:return {\\'state\\':\\'absent\\'}\\ntry:\\n for argv in [[\\'git\\',\\'init\\',\\'-q\\'],[\\'git\\',\\'add\\',\\'--\\',\\'src\\'],[\\'git\\',\\'-c\\',\\'user.name=Source fixture\\',\\'-c\\',\\'user.email=fixture@example.invalid\\',\\'commit\\',\\'-q\\',\\'-m\\',\\'Create ordinary source corpus\\']]:subprocess.run(argv,cwd=repo,env=env,check=True,capture_output=True)\\n \\n for verb in [[\\'atlas\\',\\'find\\'],[\\'up\\'],[\\'down\\'],[\\'status\\']]:\\n  help_result=call(verb+[\\'--help\\'],\\'help-\\'+verb[-1]);assert help_result[\\'exit\\']==0\\n init=call([\\'--key\\',str(uuid.uuid4()),\\'init\\',\\'--repo\\',str(repo),\\'--name\\',\\'Source search\\',\\'--agent\\',\\'Reader\\',\\'--provider\\',\\'codex\\'],\\'init\\');assert init[\\'exit\\']==0,init\\n\
        \ project=init[\\'decoded\\'][\\'project\\'][\\'id\\'];report[\\'project\\']=project\\n start=call([\\'up\\'],\\'up\\');report[\\'up\\']=start;assert start[\\'exit\\']==0,start\\n host=start[\\'decoded\\'][\\'process\\'][\\'pid\\'];report[\\'host_identity\\']=proc(host)\\n end=time.monotonic()+180;statuses=[]\\n while True:\\n  status=call([\\'status\\'],\\'prepare-status\\');statuses.append(status);body=status.get(\\'decoded\\') or {};atlas=body.get(\\'atlas\\',{});s=atlas.get(\\'summary\\') or {};coverage=s.get(\\'coverage\\',{})\\n  if status[\\'exit\\']==0 and coverage.get(\\'discovery_complete\\') and coverage.get(\\'indexed_files\\',0)>0:\\n   report[\\'indexed_status\\']=status;break\\n  if time.monotonic()>=end:raise RuntimeError(\\'ordinary source index did not publish before observation deadline\\')\\n  time.sleep(.5)\\n report[\\'preparation_status_calls\\']=len(statuses);save()\\n # Both ordinary terminal rendering and JSON use the public command\\'s default work deadline.\\\
        n for round in range(5):\\n  for kind,term,mode in [(\\'symbol\\',\\'new\\',None),(\\'symbol\\',\\'read\\',None),(\\'symbol\\',\\'collect\\',\\'literal\\'),(\\'path\\',\\'query\\',\\'literal\\'),(\\'path\\',\\'cache\\',\\'literal\\')]:\\n   for large in [False,True]:\\n    for json_mode in [False,True]:\\n     cmd=[\\'atlas\\',\\'find\\',term,\\'--kind\\',kind]\\n     if mode:cmd+=[\\'--mode\\',mode]\\n     if large:cmd+=[\\'--budget\\',\\'32768\\']\\n     result=call(cmd,f\\'q-{round}-{kind}-{term}-\\'+(\\'large\\' if large else \\'default\\')+(\\'-json\\' if json_mode else \\'-compact\\'),json_mode)\\n     result.update(round=round,kind=kind,term=term,mode=mode,large_budget=large,json_mode=json_mode);report[\\'queries\\'].append(result);save()\\n     body=result.get(\\'decoded\\') or {};answer=body.get(\\'value\\',body);data=answer.get(\\'data\\',{});page=data.get(\\'value\\',{}).get(\\'page\\',{})\\n     if json_mode and page.get(\\'next\\'):\\n      next_result=call(cmd+[\\'--cursor\\\
        ',page[\\'next\\']],f\\'cursor-{round}-{kind}-{term}-\\'+(\\'large\\' if large else \\'default\\'),True);next_result.update(round=round,kind=kind,term=term,large_budget=large,json_mode=True,page=1);report[\\'queries\\'].append(next_result);save()\\n report[\\'observation\\']=\\'completed\\'\\nexcept BaseException:\\n report[\\'observation\\']=\\'incomplete\\';report[\\'failure\\']=traceback.format_exc();raise\\nfinally:\\n try:\\n  if project:\\n   down=call([\\'down\\'],\\'down\\');report[\\'down\\']=down;report[\\'endpoint_after_down\\']=(home/\\'endpoint.json\\').exists();report[\\'outside_host_after_down\\']=proc(host) if host else None\\n   if down[\\'exit\\']!=0 or not down[\\'decoded\\'].get(\\'complete\\') or down[\\'decoded\\'].get(\\'witness\\',{}).get(\\'state\\')!=\\'witnessed\\':raise RuntimeError(\\'public shutdown did not witness closure\\')\\n   if host and report[\\'outside_host_after_down\\'][\\'state\\'] not in [\\'absent\\',\\'Z\\'] and report[\\'outside_host_after_down\\\
        '].get(\\'birth\\')==report[\\'host_identity\\'].get(\\'birth\\'):raise RuntimeError(\\'same owned host still present after down\\')\\n finally:save()\\n'\nimport pathlib,subprocess,os,time,json,hashlib,tomllib\nrepo=pathlib.Path.cwd();root=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'atlas-cli-observation';out.mkdir();source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();host=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip();assert host=='x86_64-unknown-linux-gnu'\nenv=dict(os.environ,CARGO_TARGET_DIR=str(root/'cli-target'),CARGO_BUILD_JOBS='2',CARGO_INCREMENTAL='0')\ninputs=json.loads((repo/'scripts/release/inputs.json').read_text());features=','.join(inputs['features']);assert inputs['default_features'] is False\n(out/'observer.py').write_text(OBSERVER)\ndef run(label,argv,timeout):\n start=time.monotonic_ns()\n with (out/(label+'.stdout')).open('w') as stdout,(out/(label+'.stderr')).open('w') as stderr:p=subprocess.run(argv,env=env,stdout=stdout,stderr=stderr,timeout=timeout)\n\
        \ (out/(label+'.execution.json')).write_text(json.dumps({'source':source,'argv':argv,'exit':p.returncode,'elapsed_ns':time.monotonic_ns()-start},indent=2));return p.returncode\nassert run('build',['cargo','build','--locked','-p','se','--no-default-features','--features',features,'--profile','distribution','--target',host],1800)==0\nimage=root/'cli-target'/host/'distribution/se'\nimport shutil\nshutil.copy2(image,out/'se')\n(out/'image.json').write_text(json.dumps({'source':source,'image_sha256':hashlib.sha256(image.read_bytes()).hexdigest(),'features':inputs['features'],'profile':'distribution','compiler':subprocess.check_output(['rustc','-Vv'],text=True)},indent=2))\nassert run('observe',['python',str(out/'observer.py'),'--se',str(image),'--source',str(repo),'--out',str(out/'public')],600)==0\n\n(out/'mcp-observer.py').write_text(MCP_OBSERVER)\nassert run('observe-mcp',['python',str(out/'mcp-observer.py'),'--se',str(image),'--source',str(repo),'--out',str(out/'mcp')],900)==0\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: atlas-response-public-cli
        path: '${{ runner.temp }}/atlas-cli-observation/*.json

          ${{ runner.temp }}/atlas-cli-observation/*.stdout

          ${{ runner.temp }}/atlas-cli-observation/*.stderr

          ${{ runner.temp }}/atlas-cli-observation/observer.py

          ${{ runner.temp }}/atlas-cli-observation/se

          ${{ runner.temp }}/atlas-cli-observation/public/*.json

          ${{ runner.temp }}/atlas-cli-observation/public/calls/*.json

          ${{ runner.temp }}/atlas-cli-observation/public/calls/*.stdout

          ${{ runner.temp }}/atlas-cli-observation/public/calls/*.stderr

          ${{ runner.temp }}/atlas-cli-observation/mcp-observer.py

          ${{ runner.temp }}/atlas-cli-observation/mcp/*.json

          ${{ runner.temp }}/atlas-cli-observation/mcp/fixture/*.stdout

          ${{ runner.temp }}/atlas-cli-observation/mcp/fixture/*.stderr'
        if-no-files-found: error
