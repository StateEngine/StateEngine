name: Native Windows private-copy uninstall validation
'on':
  push:
    branches:
    - prime/j5-private-copy-r2
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  RUST_BACKTRACE: '1'
jobs:
  windows:
    name: Native carrier consumer (${{ matrix.features }})
    runs-on: windows-2025
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        features:
        - default
        - all
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 177ab808a42c33bfb1a6adb2c3389e67b254562a
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: c29-windows-${{ matrix.features }}-v1
    - name: Register disposable runner account
      shell: bash
      run: 'python scripts/ci/installation_account.py provision

        python scripts/ci/installation_account.py check

        '
    - name: Extract frozen public-consumer invocation
      shell: python
      run: "import base64,hashlib,os\nfrom pathlib import Path\nr=Path(os.environ[\"\
        RUNNER_TEMP\"])/\"completion-inputs\";r.mkdir()\ninputs={'owned_file.py':\
        \ '',\
        \ 'token_context.py': '',\
        \ 'runtime-console-timing.ps1': '',\
        \ 'public_completion.py': ''}\n\
        expected={'owned_file.py': 'e65db33c40d8be8d035ad092e8a48128db36aae208e339af0b536267384aa594',\
        \ 'token_context.py': 'ed4e4714a72a15a337992d771bf4c0a55e83df54a7fbbb69bde33482d9422660',\
        \ 'runtime-console-timing.ps1': '44d50339e76b252143b2a3b3606e77b4fe73b94d29721126364111b9fb1bc8fa',\
        \ 'public_completion.py': '740420cd75c2ce5198a8e8c10126c88fc0eb3ef1ca944fb1ad4c36fa3386f06f'}\n\
        for n,v in inputs.items():\n raw=base64.b64decode(v);assert hashlib.sha256(raw).hexdigest()==expected[n];(r/n).write_bytes(raw)\n"
    - name: Strict native Windows target validation
      shell: bash
      env:
        REVIEW_FEATURES: ${{ matrix.features }}
      run: "if [ \"$REVIEW_FEATURES\" = all ]; then\n  cargo clippy -p se -p se-proc\
        \ --all-targets --target x86_64-pc-windows-msvc --all-features --locked --\
        \ -D warnings\nelse\n  cargo clippy -p se -p se-proc --all-targets --target\
        \ x86_64-pc-windows-msvc --locked -- -D warnings\nfi\n"
    - name: Execute reviewer-owned native uninstall tests
      shell: bash
      env:
        REVIEW_FEATURES: ${{ matrix.features }}
      run: "if [ \"$REVIEW_FEATURES\" = all ]; then\n  cargo test -p se-proc --lib\
        \ --target x86_64-pc-windows-msvc --all-features --locked uninstall:: -- --nocapture\n\
        else\n  cargo test -p se-proc --lib --target x86_64-pc-windows-msvc --locked\
        \ uninstall:: -- --nocapture\nfi\n"
    - name: Read shipped public uninstall completion
      shell: python
      env:
        TIMING_FEATURES: ${{ matrix.features }}
        TIMING_OUT: ${{ runner.temp }}/uninstall-completion-evidence-${{ matrix.features
          }}
        TIMING_EXPECTED_PRODUCT_TYPE: '3'
      run: 'import os,runpy,sys

        from pathlib import Path

        r=Path(os.environ[''RUNNER_TEMP''])/''completion-inputs'';sys.path.insert(0,str(r))

        runpy.run_path(str(r/''public_completion.py''),run_name=''__main__'')

        '
      if: ${{ !cancelled() }}
    - name: Retain native public consumer results and pinned image
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: j5-private-copy-${{ matrix.features }}
        path: ${{ runner.temp }}/uninstall-completion-evidence-${{ matrix.features
          }}
        retention-days: 14
        if-no-files-found: error
