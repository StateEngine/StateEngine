name: Measure Windows send SQL
'on':
  push:
    branches:
    - probe/agent-door-windows-send-sql
permissions:
  contents: read
jobs:
  measure:
    name: Measure kept-open Windows writer phases
    runs-on: windows-2025
    timeout-minutes: 65
    env:
      REVIEW_SOURCE: 43e0b9c12c4a7692b205630243a086769c5b8c7b
      MEASURE_TARGET: x86_64-pc-windows-msvc
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: 43e0b9c12c4a7692b205630243a086769c5b8c7b
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.97.1
        targets: x86_64-pc-windows-msvc
    - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: amd64
      if: runner.os == 'Windows'
    - name: Profile SQL inside the Windows writer transaction
      shell: python
      run: |
        OVERLAY = {'eight_writer_measurement.rs': ('', 'd55fafd2c0561d865fa2ed46ec2f92519d0096a9cac1f9623e8f4d90b0c49b3b'), 'eight_writer_rounds.py': ('', '796fd30c9f21f699ea0b5a878c798cb4dfc1a5be9842ad2d80c52611c0925e66'), 'b4_observation.rs': ('', '383176a370ff573fafeb17e7140ca33c64e42ee7561e2acd2b9a2471f7531ce9'), 'inject-b4-phases.py': ('', 'c62d0308492c00f558450d8dd92c80991850403c12c07424c8d2351cff2018ff')}

        from base64 import b64decode
        from hashlib import file_digest, sha256
        import json
        import os
        from pathlib import Path
        import shutil
        import subprocess
        import sys
        import tomllib

        root = Path.cwd()
        out = Path(os.environ['RUNNER_TEMP']) / 'agent-door-sql/evidence'
        out.mkdir(parents=True, exist_ok=False)
        assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
        source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        assert source == os.environ['REVIEW_SOURCE']
        assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip()
        for name, (encoded, digest) in OVERLAY.items():
            contents = b64decode(encoded, validate=True)
            assert sha256(contents).hexdigest() == digest
            (out / name).write_bytes(contents)
        subprocess.run([sys.executable, '-B', str(out / 'inject-b4-phases.py'), str(root)], check=True)
        expected = sorted([
            'crates/se-host/src/runtime/route.rs', 'crates/se-store/src/lib.rs', 'crates/se-store/src/transaction.rs',
            'crates/se-store/src/writer.rs', 'crates/se/src/mcp_stdio.rs',
        ])
        assert sorted(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()) == expected
        untracked = sorted(['crates/se-store/src/b4_observation.rs', 'crates/se/tests/eight_writer_measurement.rs',
                            'crates/se/tests/eight_writer_rounds.py'])
        assert sorted(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()) == untracked
        (out / 'instrumentation.diff').write_bytes(subprocess.check_output(['git', 'diff', '--binary', 'HEAD']))
        release = json.loads((root / 'scripts/release/inputs.json').read_bytes())
        target = os.environ['MEASURE_TARGET']
        assert (target == 'x86_64-pc-windows-msvc' and sys.platform == 'win32') or (
            target == 'x86_64-unknown-linux-gnu' and sys.platform == 'linux')
        assert release['package'] == 'se' and release['default_features'] is False and target in release['targets']
        flags = tomllib.loads((root / '.cargo/config.toml').read_text(encoding='utf-8')).get('target', {}).get(target, {}).get('rustflags', [])
        env = dict(os.environ, CARGO_ENCODED_RUSTFLAGS='\x1f'.join(flags), CARGO_INCREMENTAL='0',
                   SE_B4_EVIDENCE=str(out), SE_B4_ROUNDS='200')
        env['SOURCE_DATE_EPOCH'] = subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD'], text=True).strip()
        build_target = out.parent / 'target'
        argv = ['cargo', 'test', '--profile', 'distribution', '--target', target, '--target-dir', str(build_target),
                '--locked', '-p', 'se', '--no-default-features', '--features', ','.join(release['features']),
                '--test', 'eight_writer_measurement', '--no-run', '--message-format=json']
        with (out / 'build.jsonl').open('xb') as stdout, (out / 'build.stderr').open('xb') as stderr:
            subprocess.run(argv, env=env, stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr, timeout=2800, check=True)
        messages = [json.loads(line) for line in (out / 'build.jsonl').read_bytes().splitlines()]
        assert messages[-1] == {'reason': 'build-finished', 'success': True}
        observer, = [Path(msg['executable']) for msg in messages if msg.get('reason') == 'compiler-artifact'
                     and msg.get('target', {}).get('name') == 'eight_writer_measurement' and msg.get('executable')]
        binary = build_target / target / 'distribution' / ('se.exe' if sys.platform == 'win32' else 'se')

        def fingerprint(path):
            with path.open('rb') as stream:
                digest = file_digest(stream, 'sha256').hexdigest()
            return {'path': str(path), 'sha256': digest, 'bytes': path.stat().st_size}

        metadata = {'source': source, 'target': target, 'release_features': release['features'], 'profile': 'distribution',
                    'config_rustflags': flags, 'rustc': subprocess.check_output(['rustc', '-vV'], text=True),
                    'product_image': fingerprint(binary), 'observer_image': fingerprint(observer),
                    'inputs': {key: value[1] for key, value in OVERLAY.items()}}
        (out / 'build-provenance.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
        with (out / 'observer.stdout').open('xb') as stdout, (out / 'observer.stderr').open('xb') as stderr:
            result = subprocess.run([observer, '--exact', 'measure_eight_mcp_writers', '--nocapture'],
                                    env=env, stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr, timeout=720)
        assert fingerprint(binary) == metadata['product_image'] and fingerprint(observer) == metadata['observer_image']
        (out / 'observer-result.json').write_text(json.dumps({'exit': result.returncode}) + '\n', encoding='utf-8')
        raise SystemExit(result.returncode)
    - if: always()
      name: Seal the evidence
      shell: python
      run: |
        from pathlib import Path
        import hashlib, json, os

        out = Path(os.environ["RUNNER_TEMP"]) / "agent-door-sql/evidence"
        out.mkdir(parents=True, exist_ok=True)
        rows = []
        for path in sorted(out.rglob("*")):
            if path.is_file():
                with path.open("rb") as stream:
                    digest = hashlib.file_digest(stream, "sha256").hexdigest()
                rows.append(dict(file=path.relative_to(out).as_posix(), bytes=path.stat().st_size, sha256=digest))
        (out / "artifact-manifest.json").write_text(json.dumps(rows, indent=2) + "\n", encoding="utf-8")
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: agent-door-windows-send-sql
        path: ${{ runner.temp }}/agent-door-sql/evidence
        retention-days: 4
        if-no-files-found: error
