name: writer-latency
on:
  push:
    branches: [prime/writer-latency-b4-idle-r1]
permissions:
  contents: read
concurrency:
  group: writer-latency-${{ github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: baseline
            ref: b7a3c1c5d9d4f016b237a97c5c0d883645276eda
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Overlay measurement sources
        env:
          MEASUREMENTS: seat-5d/eight-writer-measurement-20261115
        run: |
          git fetch --quiet origin "31961f841f58d80244abe15f84bbd94649f5bd56:refs/remotes/measure/tests" "refs/heads/main:refs/remotes/measure/main"
          measured="$(git rev-parse refs/remotes/measure/tests)"
          test "$measured" = 31961f841f58d80244abe15f84bbd94649f5bd56
          echo "$measured" > measurement-commit.txt
          fork="$(git merge-base refs/remotes/measure/main refs/remotes/measure/tests)"
          git diff --name-only --diff-filter=AM "$fork" refs/remotes/measure/tests > "$RUNNER_TEMP/measurement-files"
          python3 -I - "$RUNNER_TEMP/measurement-files" <<'PY'
          import re, sys
          paths = open(sys.argv[1], encoding="utf-8").read().splitlines()
          if not paths or any(not re.match(r"^(crates/[^/]+/)?tests/", p) for p in paths):
              sys.exit("measurement overlay must contain only tests directory changes")
          PY
          xargs git checkout refs/remotes/measure/tests -- < "$RUNNER_TEMP/measurement-files"
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: writer-latency-macos-v1
      - name: Measure baseline release writes
        id: baseline
        continue-on-error: true
        run: |
          git rev-parse HEAD > baseline-source.txt
          target="$(rustc --print host-tuple)"
          set +e
          cargo test --target "$target" --release --locked --all-features --no-fail-fast -p se --test eight_writer_mcp_measurement -- --nocapture
          measurement_status=$?
          set -e
          if [[ -d target/judge-diagnostics ]]; then mv target/judge-diagnostics target/judge-baseline; fi
          exit "$measurement_status"
      - name: Select candidate with the same measurement overlay
        run: |
          git fetch --quiet origin refs/heads/seat-5d/writer-idle-b4-20261115:refs/remotes/measure/head
          test "$(git rev-parse refs/remotes/measure/head)" = 186292aa52e4b562ee4f0d7343717bd305ec5a94
          git checkout --detach 186292aa52e4b562ee4f0d7343717bd305ec5a94
          git rev-parse HEAD > candidate-source.txt
          while IFS= read -r measurement_path; do
            git diff --exit-code refs/remotes/measure/tests -- "$measurement_path"
          done < "$RUNNER_TEMP/measurement-files"
      - name: Measure candidate release writes
        id: candidate
        continue-on-error: true
        run: |
          target="$(rustc --print host-tuple)"
          set +e
          cargo test --target "$target" --release --locked --all-features --no-fail-fast -p se --test eight_writer_mcp_measurement -- --nocapture
          measurement_status=$?
          set -e
          if [[ -d target/judge-diagnostics ]]; then mv target/judge-diagnostics target/judge-candidate; fi
          exit "$measurement_status"
      - name: Preserve failed observer verdicts
        if: ${{ always() }}
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
        run: |
          test "$BASELINE" = success
          test "$CANDIDATE" = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: writer-latency-macos-idle-paired
          path: |
            baseline-source.txt
            candidate-source.txt
            measurement-commit.txt
            target/judge-baseline/
            target/judge-candidate/
          if-no-files-found: error
          retention-days: 14
