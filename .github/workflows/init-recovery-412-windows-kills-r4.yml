name: Review retained Windows first-init recovery image
'on':
  push:
    branches:
    - prime/init-recovery-412-windows-kills-r4
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Download authenticated source-bound native image
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: '14190505301'
        run-id: 43782723711
        github-token: ${{ github.token }}
        repository: StateEngine/StateEngine
        path: ${{ runner.temp }}/source-evidence
        merge-multiple: true
    - name: Stage frozen corrected controls
      shell: python
      run: "from pathlib import Path\nimport base64,os\nr=Path(os.environ['RUNNER_TEMP'])/'init-review-r4/controls';r.mkdir(parents=True)\nfiles={'crash_init.py': '', 'produce.py': '', 'source-proof.json': ''}\nfor name,data in files.items():\n raw=base64.b64decode(data);(r/name).write_bytes(raw)\n if name.endswith('.py'):compile(raw.decode(),name,'exec')\n"
    - name: Authenticate retained image and replay all seventeen controls
      shell: python
      run: 'from pathlib import Path

        import os,subprocess,sys

        r=Path(os.environ[''RUNNER_TEMP''])/''init-review-r4/controls''

        raise SystemExit(subprocess.run([sys.executable,''-B'',str(r/''produce.py'')]).returncode)

        '
    - name: Hash finite evidence
      if: always()
      shell: python
      run: 'from pathlib import Path

        import hashlib,json,os,shutil

        r=Path(os.environ[''RUNNER_TEMP''])/''init-review-r4'';e=r/''evidence'';e.mkdir(parents=True,exist_ok=True)

        shutil.copytree(r/''controls'',e/''frozen-inputs'')

        rows=[{''file'':p.relative_to(e).as_posix(),''bytes'':p.stat().st_size,''sha256'':hashlib.file_digest(p.open(''rb''),''sha256'').hexdigest()} for p in sorted(e.rglob(''*'')) if p.is_file() and p.name!=''artifact-manifest.json'']

        (e/''artifact-manifest.json'').write_text(json.dumps(rows,indent=2)+''\n'')

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: pr412-windows-kills-r4
        path: ${{ runner.temp }}/init-review-r4/evidence
        include-hidden-files: true
        retention-days: 2
        compression-level: 0
        if-no-files-found: error
