name: Native macOS image-cache guard comparison
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-guards:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8db91e4c4ae0396c3a5135547d1d77a4ce167e77
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read the pinned distribution compiler
        id: compiler
        shell: python
        run: |
          import os,tomllib
          from pathlib import Path
          channel=tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: print('channel='+channel,file=output)
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Run the unchanged native guards on both source images
        shell: python
        run: |
          import os,subprocess,json,hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);out=root/'sha-guard-evidence';out.mkdir()
          base='8db91e4c4ae0396c3a5135547d1d77a4ce167e77'
          head='5c7db7da74c610ffe151fdbd732e69c4d3e5e541'
          source=Path.cwd();alternate=root/'sha-guard-head-source'
          subprocess.run(['git','worktree','add','--detach',str(alternate),head],check=True)
          target=subprocess.check_output(['rustc','--print','host-tuple'],text=True).strip()
          assert target=='aarch64-apple-darwin',target
          names=['crates/se-proc/tests/image_cache.rs','crates/se-proc/tests/image_cache_upgrade.rs']
          for name in names: assert (source/name).read_bytes()==(alternate/name).read_bytes(),name
          results=[]
          for side,revision,repo in [('base',base,source),('head',head,alternate)]:
            assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=repo,text=True).strip()==revision
            env=os.environ.copy();env['CARGO_TARGET_DIR']=str(root/'sha-guard-target')
            # Explicit --target keeps target-only no_uuid flags off host proc-macros.
            command=['cargo','test','--locked','--target',target,'-p','se-proc','--test','image_cache','--test','image_cache_upgrade','--','--nocapture']
            with (out/(side+'-guards.log')).open('w') as log:
              run=subprocess.run(command,cwd=repo,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=900)
            results.append({'side':side,'source':revision,'target':target,'command':command,'exit':run.returncode,'tests_sha256':{name:hashlib.sha256((repo/name).read_bytes()).hexdigest() for name in names}})
            (out/'results.json').write_text(json.dumps(results,indent=2)+'\n')
          if any(row['exit'] for row in results): raise RuntimeError(results)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-sha-image-guards
          path: ${{ runner.temp }}/sha-guard-evidence/
          if-no-files-found: error
