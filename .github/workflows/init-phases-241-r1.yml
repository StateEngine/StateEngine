        = 1; const char *k = fd_kind(fd); BEGIN(#name, k); \\\n    int result = real(fd); END(#name, k,
        result); nested = 0; return result; \\\n} INTERPOSE(name)\nSYNC_WRAPPER(fsync);\n#ifndef __APPLE__\nSYNC_WRAPPER(fdatasync);\n#endif\n\n#define
        PWRITE_WRAPPER(name) \\\nssize_t WRAP(name)(int fd, const void *data, size_t size, off_t offset)
        { \\\n    static ssize_t (*real)(int,const void*,size_t,off_t); if (!real) real=dlsym(RTLD_NEXT,#name);
        \\\n    if (nested || trace_fd < 0) return real(fd,data,size,offset); \\\n    nested=1; const
        char *k=fd_kind(fd); BEGIN(#name,k); \\\n    ssize_t result=real(fd,data,size,offset); END(#name,k,result);
        nested=0; return result; \\\n} INTERPOSE(name)\nPWRITE_WRAPPER(pwrite);\n#ifndef __APPLE__\nPWRITE_WRAPPER(pwrite64);\n#endif\nssize_t
        WRAP(write)(int fd, const void *data, size_t size) {\n    if (!native_write) native_write = dlsym(RTLD_NEXT,"write");\n    if
