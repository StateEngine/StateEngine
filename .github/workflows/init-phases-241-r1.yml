        a; va_start(a,flags); mode=(mode_t)va_arg(a,int); va_end(a); }\n    if (nested || trace_fd<0)
        return real(dir,path,flags,mode);\n    nested=1; const char *k=at_kind(dir,path); BEGIN("openat64",k);\n    int
        result=real(dir,path,flags,mode); END("openat64",k,result); nested=0; return result;\n}\n#endif\n\n#define
