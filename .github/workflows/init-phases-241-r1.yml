        (*real)(int,int); if (!real) real=dlsym(RTLD_NEXT,"flock");\n    if (nested || trace_fd < 0) return
        real(fd,operation);\n    nested=1; const char *k=fd_kind(fd);\n    const char *op=(operation&LOCK_UN)
        ? "unlock" : (operation&LOCK_EX) ? "lock_exclusive" : "lock_shared";\n    BEGIN(op,k);\n    int
        result=real(fd,operation); END(op,k,result); nested=0; return result;\n}\nINTERPOSE(flock);\n\n#ifdef
        __APPLE__\n/* The setup uses pointer commands for SQLite locking and integer descriptor\n * flags;
        these are forwarded with their original ABI types. Unknown commands\n * are recorded so the measurement
        cannot silently claim complete coverage. */\nint observed_fcntl(int fd, int command, ...) {\n    if
