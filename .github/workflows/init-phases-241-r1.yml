        <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n#include <sys/file.h>\n#include <time.h>\n#include
        <unistd.h>\n#ifdef __APPLE__\n#include <mach-o/dyld-interposing.h>\n#define WRAP(name) observed_##name\n#define
        INTERPOSE(name) DYLD_INTERPOSE(observed_##name, name)\n#else\n#define WRAP(name) name\n#define
        INTERPOSE(name)\n#endif\n\n/* Measurement-only preload. Never records paths, buffers or credential
        bytes. */\nstatic int trace_fd = -1;\nstatic char root[PATH_MAX];\nstatic _Thread_local int nested;\nstatic
        _Atomic uint64_t sequence;\nstatic int (*native_open)(const char *, int, ...);\nstatic int (*native_openat)(int,
        const char *, int, ...);\nstatic int (*native_fcntl)(int, int, ...);\nstatic ssize_t (*native_write)(int,
        const void *, size_t);\nstatic uint64_t ns(void) {\n    struct timespec t;\n    clock_gettime(CLOCK_MONOTONIC,
        &t);\n    return (uint64_t)t.tv_sec * 1000000000ULL + (uint64_t)t.tv_nsec;\n}\n__attribute__((constructor))
        static void initialize(void) {\n    nested = 1;\n    native_open = dlsym(RTLD_NEXT, "open");\n    native_openat
        = dlsym(RTLD_NEXT, "openat");\n    native_fcntl = dlsym(RTLD_NEXT, "fcntl");\n    native_write
        = dlsym(RTLD_NEXT, "write");\n    const char *r = getenv("INIT241_ROOT"), *p = getenv("INIT241_TRACE");\n    if
        (r && p && strlen(r) < sizeof(root)) {\n        strcpy(root, r);\n        trace_fd = native_open(p,
        O_WRONLY | O_CREAT | O_APPEND, 0600);\n    }\n    nested = 0;\n}\nstatic int fd_path(int fd, char
        *p) {\n#ifdef __APPLE__\n    return native_fcntl(fd, F_GETPATH, p) == 0;\n#else\n    char link[64];\n    snprintf(link,
        sizeof(link), "/proc/self/fd/%d", fd);\n    ssize_t n = readlink(link, p, PATH_MAX - 1);\n    if
        (n < 0) return 0;\n    p[n] = 0;\n    return 1;\n#endif\n}\nstatic const char *kind(const char
        *p) {\n    size_t n = strlen(root);\n    if (!n || strncmp(root, p, n) || (p[n] && p[n] != \''/\''))
