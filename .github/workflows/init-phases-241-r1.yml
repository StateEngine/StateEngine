        = subprocess.check_output([\''git\'', \''rev-parse\'', \''HEAD\''], cwd=source_tree, text=True).strip()\n    assert
        actual == a.source\n    assert not subprocess.check_output([\''git\'', \''status\'', \''--porcelain\'',
        \''--untracked-files=no\''], cwd=source_tree)\n    report[\''actual_source\''] = actual\n    report[\''compiler\'']
        = subprocess.check_output([\''rustc\'', \''-vV\''], cwd=source_tree, text=True)\n    report[\''image\'']
        = {\''sha256\'': sha(IMAGE), \''bytes\'': IMAGE.stat().st_size}\n    for name in [\''observe.c\'',
        \''calibrate.c\'', \''run.py\'']:\n        report[\''observer_sha256\''][name] = sha(HERE / name)\n    compile_lib
        = [\''cc\'', \''-O2\'', \''-Wall\'', \''-Wextra\'', \''-Werror\'',\n                   *([\''-dynamiclib\'']
        if MAC else [\''-shared\'', \''-fPIC\'']),\n                   str(HERE / \''observe.c\''), \''-o\'',
        str(LIBRARY), *([] if MAC else [\''-ldl\''])]\n    subprocess.run(compile_lib, check=True)\n    subprocess.run([\''cc\'',
        \''-O2\'', str(HERE / \''calibrate.c\''), \''-o\'', str(HERE / \''calibrate\'')], check=True)\n    report[\''native_compiler\'']
        = subprocess.check_output([\''cc\'', \''--version\''], text=True)\n    report[\''observer_binaries_sha256\'']
        = {str(path.name): sha(path) for path in [LIBRARY, HERE / \''calibrate\'']}\n    calibrate = SCRATCH
        / \''calibration\''; calibrate.mkdir(mode=0o700)\n    cp = observed([str(HERE / \''calibrate\'')],
        traced_env(calibrate, OUT / \''calibration.tsv\''), \''calibration\'')\n    receipt, calls = trace(OUT
        / \''calibration.tsv\'', cp[\''pid\''])\n    metrics = phases(calls)\n    assert cp[\''exit\'']
        == 0 and not cp[\''supervisor_cancelled\''] and not cp[\''remaining_processes\'']\n    assert
        receipt[\''state\''] == \''readable\'' and not receipt[\''pending\''] and not receipt[\''unknown_fcntl\'']\n    assert
        all(metrics[k] is not None for k in [\''lock_calls_total_ms\'', \''credential_lookup_total_ms\'',\n                                              \''first_journal_write_call_ms\'',
        \''sync_calls_total_ms\''])\n    if MAC: assert any(x[\''op\''] == \''fullfsync\'' for x in calls)\n    report[\''calibration\'']
        = {\''command\'': cp, \''trace\'': receipt, \''phases\'': metrics}\n    binary_dir = SCRATCH /
        \''bin\''; binary_dir.mkdir()\n    inert = HERE / \''inert.c\''; inert.write_text(\''int main(void)
        { return 0; }\\n\'')\n    subprocess.run([\''cc\'', \''-O2\'', str(inert), \''-o\'', str(binary_dir
        / \''goose\'')], check=True)\n    help_result = subprocess.run([str(IMAGE), \''init\'', \''--help\''],
        env=BASE, capture_output=True)\n    (OUT / \''init-help.txt\'').write_bytes(help_result.stdout
        + help_result.stderr)\n    assert help_result.returncode == 0\n    save()\n    for index in range(a.count):\n        #
        Five plain controls, spaced among the fifty observed setups.\n        for mode in ([\''plain\'',
        \''traced\''] if index % 10 == 0 else [\''traced\'']):\n            label = f\''{index + 1:02d}-{mode}\'';
        root = SCRATCH / label; root.mkdir(mode=0o700)\n            repository = root / \''repository\'';
        repository.mkdir()\n            marker = repository / \''keep.txt\''; marker.write_text(\''Preserved
        repository fixture.\\n\'')\n            marker_hash = sha(marker)\n            state = root /
        \''state\''; trace_path = OUT / (label + \''.tsv\'')\n            env = traced_env(root, trace_path)
        if mode == \''traced\'' else BASE\n            row = {\''index\'': index + 1, \''mode\'': mode,
        \''context_before\'': context()}\n            rows.append(row); save()\n            argv = [str(IMAGE),
        \''--home\'', str(state), \''--json\'', \''init\'', \''--repo\'', str(repository),\n                    \''--name\'',
        \''Fresh setup observation\'', \''--harness\'', \''goose\'']\n            result = observed(argv,
        env, label)\n            row.update(result); row[\''context_after\''] = context()\n            row[\''config_published\'']
        = (state / \''config.toml\'').is_file()\n            row[\''repository_preserved\''] = sha(marker)
        == marker_hash\n            row[\''file_metadata\''] = []\n            if state.is_dir():\n                for
        f in state.iterdir():\n                    stat = f.lstat()\n                    row[\''file_metadata\''].append({\''leaf\'':
        f.name, \''bytes\'': stat.st_size, \''mtime_ns\'': stat.st_mtime_ns})\n            if mode ==
        \''traced\'':\n                row[\''trace\''], calls = trace(trace_path, result[\''pid\''])\n                row[\''phases\'']
        = phases(calls)\n                row[\''phase_coverage\''] = (row[\''trace\''][\''state\''] ==
        \''readable\'' and\n                    not row[\''trace\''][\''pending\''] and not row[\''trace\''][\''unknown_fcntl\'']
        and\n                    all(row[\''phases\''][k] is not None for k in [\''lock_calls_total_ms\'',\n                        \''credential_lookup_total_ms\'',
        \''first_journal_write_call_ms\'', \''sync_calls_total_ms\'']))\n            else: row[\''phase_coverage\'']
        = None\n            row[\''qualified\''] = (row[\''exit\''] == 0 and not row[\''supervisor_cancelled\'']
        and\n                not row[\''remaining_processes\''] and row[\''config_published\''] and row[\''repository_preserved\'']
        and\n                (mode == \''plain\'' or row[\''phase_coverage\'']))\n            row[\''json_output\'']
        = None\n            if row[\''exit\''] == 0:\n                try: row[\''json_output\''] = {\''valid\'':
        isinstance(json.loads((OUT / (label + \''.stdout\'')).read_text()), dict)}\n                except
        ValueError: row[\''json_output\''] = {\''valid\'': False}\n                row[\''qualified\'']
        &= row[\''json_output\''][\''valid\'']\n            save()\n            print(json.dumps({k: row[k]
        for k in [\''index\'', \''mode\'', \''exit\'', \''total_ms\'', \''qualified\'', \''phase_coverage\'']}),
        flush=True)\n            if row[\''qualified\'']:\n                # Fixtures are owned and fresh;
        never traverse a link while removing.\n                assert not any(x.is_symlink() for x in
        root.rglob(\''*\''))\n                shutil.rmtree(root)\n            if row[\''remaining_processes\'']
        or row.get(\''pipe_close_unobserved\''):\n                report[\''stopped_reason\''] = \''Process/pipe
        closure unobserved; remaining requests not run.\''\n                return 1\n            if mode
        == \''traced\'' and not row[\''phase_coverage\'']:\n                report[\''stopped_reason\'']
        = \''Native timing coverage incomplete; remaining requests not run.\''\n                return
        1\n    traced = [x for x in rows if x[\''mode\''] == \''traced\'']\n    report[\''complete\'']
        = len(traced) == a.count\n    report[\''qualified_traced\''] = sum(x[\''qualified\''] for x in
        traced)\n    report[\''supervisor_cancelled\''] = sum(x[\''supervisor_cancelled\''] for x in traced)\n    report[\''total_ms\'']
        = {mode: distribution([x[\''total_ms\''] for x in rows if x[\''mode\''] == mode])\n                          for
        mode in [\''plain\'', \''traced\'']}\n    metrics = [\''lock_calls_total_ms\'', \''credential_lookup_total_ms\'',
        \''first_journal_write_call_ms\'',\n               \''lock_to_first_journal_ms\'', \''sync_calls_total_ms\'',
        \''sync_call_max_ms\'', \''sync_calls\'']\n    report[\''phases\''] = {k: distribution([x[\''phases\''][k]
        for x in traced if x[\''phases\''][k] is not None]) for k in metrics}\n    report[\''first_stdout_ms\'']
        = distribution([x[\''first_stdout_ms\''] for x in traced if x[\''first_stdout_ms\''] is not None])\n    report[\''passed\'']
        = report[\''complete\''] and all(x[\''qualified\''] for x in rows)\n    save()\n    return 0 if
        report[\''passed\''] else 1\n\ntry:\n    code = main()\nexcept BaseException as error:\n    report[\''failure\'']
        = {\''type\'': type(error).__name__, \''detail\'': str(error), \''traceback\'': traceback.format_exc()}\n    code
        = 1\nfinally:\n    save()\n    manifest = [{\''file\'': f.relative_to(OUT).as_posix(), \''bytes\'':
        f.stat().st_size, \''sha256\'': sha(f)}\n                for f in sorted(OUT.rglob(\''*\'')) if
        f.is_file() and f.name != \''manifest.json\'']\n    (OUT / \''manifest.json\'').write_text(json.dumps(manifest,
        indent=2) + \''\\n\'')\nraise SystemExit(code)\n''}

        for name,source in files.items():(root/name).write_text(source)

        '
    - name: Build the frozen distribution image
      shell: python
      run: "from pathlib import Path\nimport os,subprocess,time,json,hashlib\nroot=Path(os.environ['RUNNER_TEMP'])/'init241'/'evidence'\n\
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\nassert source=='7b23fb01a7e16362c6d6b024e5c1801a32bda8c6'\n\
        assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'])\nenv=dict(os.environ)\n\
        for key in ['RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS']:env.pop(key,None)\nstart=time.monotonic()\n\
        with (root/'build.stdout').open('wb') as out,(root/'build.stderr').open('wb') as err:\n code=subprocess.run(['cargo','build','--profile','distribution','-p','se','--bin','se','--locked'],env=env,stdout=out,stderr=err).returncode\n\
        receipt={'exit':code,'seconds':time.monotonic()-start,'source':source,'profile':'distribution','features':'default'}\n\
        image=Path('target/distribution/se')\nif code==0:receipt['image']={'sha256':hashlib.sha256(image.read_bytes()).hexdigest(),'bytes':image.stat().st_size}\n\
        (root/'build.json').write_text(json.dumps(receipt,indent=2)+'\\n')\nraise SystemExit(code)\n"
    - name: Observe fifty fresh setups and five plain controls
      shell: python
      run: 'from pathlib import Path

        import os,sys,subprocess

        root=Path(os.environ[''RUNNER_TEMP''])/''init241''/''evidence''

        argv=[sys.executable,str(root/''run.py''),''--image'',str(Path(''target/distribution/se'').resolve()),''--source-tree'',str(Path.cwd()),''--source'',''7b23fb01a7e16362c6d6b024e5c1801a32bda8c6'',''--out'',str(root/''results''),''--scratch'',str(Path(os.environ[''RUNNER_TEMP''])/''init241-homes''),''--count'',''50'']

        raise SystemExit(subprocess.run(argv).returncode)

        '
    - name: Retain every observation and failure
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: init241-${{ matrix.os }}-r1
        path: ${{ runner.temp }}/init241/evidence
        if-no-files-found: error
        retention-days: 14
