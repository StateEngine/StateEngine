name: Observe fresh init protected setup phases
'on':
  push:
    branches:
    - prime/init-phases-241-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
jobs:
  observe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - macos-15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: init241-phases-distribution-v1
    - name: Stage content-free calibrated native observer
      shell: python
      run: 'from pathlib import Path

        import os

        root=Path(os.environ[''RUNNER_TEMP''])/''init241''/''evidence''

        root.mkdir(parents=True)

        files={''observe.c'': ''#define _GNU_SOURCE\n#include <dlfcn.h>\n#include <errno.h>\n#include
