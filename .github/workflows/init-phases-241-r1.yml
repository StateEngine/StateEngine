        result = native_openat(dir, path, flags, mode); END("openat", k, result); nested = 0; return result;\n}\nINTERPOSE(openat);\n#ifndef
        __APPLE__\nint open64(const char *path, int flags, ...) {\n    static int (*real)(const char*,int,...);
