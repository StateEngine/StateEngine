name: Contributor agreement

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths: ['docs/cla/**', 'scripts/cla/**', 'CONTRIBUTING.md', '.github/workflows/cla.yml']

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: cla
  cancel-in-progress: false

jobs:
  agreement:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Candidate code and contributor comments are never executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify authenticated signatures against the trusted agreements
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLA_INTERNAL_APP_BOT_ID: ${{ vars.CLA_INTERNAL_APP_BOT_ID }}
        run: python -I scripts/cla/check.py
