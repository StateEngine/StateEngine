name: Contributor agreement

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths: ['docs/cla/**', 'scripts/cla/**', 'CONTRIBUTING.md', '.github/workflows/cla.yml']

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  agreement:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Candidate code and contributor comments are never executed. The default branch
      # is resolved once, so a merge during the run cannot change the trusted source.
      - name: Resolve the default branch to one commit
        id: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The default branch did not resolve to one commit; rerun the check." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false
      - name: Verify authenticated signatures against the trusted agreements
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLA_TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
          CLA_INTERNAL_APP_BOT_ID: ${{ vars.CLA_INTERNAL_APP_BOT_ID }}
        run: python -I scripts/cla/check.py
