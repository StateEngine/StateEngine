name: First init final author cost r1
on:
  workflow_dispatch:
  push:
    branches: [prime/first-init-final-cost-r1]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: first-init-final-cost-r1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PRODUCER_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PRODUCER_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f3485a9bc3fb8e5d484ba5c8afd6f29635127e83
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Install syscall observer
        run: sudo apt-get update && sudo apt-get install -y strace time
      - name: Restore sealed author cost producer
        shell: python
        run: |
          import base64,hashlib
          from pathlib import Path
          data=base64.b64decode('',validate=True)
          if hashlib.sha256(data).hexdigest()!='9984fef08168d2cb4a6e93cc06c7f53ae2c81bbeb59f5f06a69f417ba5941d4a': raise RuntimeError('producer digest mismatch')
          root=Path('.init-final-cost')
          root.mkdir(exist_ok=True)
          (root/'produce.py').write_bytes(data)
      - name: Measure final paired public initialization costs
        run: python -B .init-final-cost/produce.py
      - name: Retain complete evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-init-final-cost-r1-linux
          path: init-cost-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
