name: Independent macOS public descendant exec controls
'on':
  push:
    branches:
    - prime/macos-descendant-409-review-r2
  workflow_dispatch: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: product
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '3'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  judge:
    runs-on: macos-15
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
        - arm: base
          source: 7b23fb01a7e16362c6d6b024e5c1801a32bda8c6
        - arm: head
          source: 4d01542c5b09c352fbaedcc59251960019111716
    env:
      PRODUCT_SOURCE: ${{ matrix.source }}
      ARM: ${{ matrix.arm }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ matrix.source }}
        path: product
        persist-credentials: false
    - uses: ./product/.github/actions/rust
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 2836e87c9e251d77cece6385b04b003b5030627f
        path: observer
        persist-credentials: false
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: product
        shared-key: macos-descendant-409-review-r2
    - name: Stage private independent native boundary controls
      shell: python
      run: 'import os,base64

        from pathlib import Path

        root=Path(os.environ[''RUNNER_TEMP''])/''controls409'';root.mkdir()

        p=root/''driver.py'';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        p=root/''public_driver.py'';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        p=root/''provider_helper.py'';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        p=root/''native-fixture/Cargo.toml'';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''W3BhY2thZ2VdCm5hbWUgPSAicHJpdmF0ZS1kZXNjZW5kYW50LXJldmlldyIKdmVyc2lvbiA9ICIwLjEuMCIKZWRpdGlvbiA9ICIyMDI0IgpbbGliXQpjcmF0ZS10eXBlID0gWyJjZHlsaWIiXQpbZGVwZW5kZW5jaWVzXQpsaWJjID0gIj0wLjIuMTkxIgpzZXJkZV9qc29uID0gIj0xLjAuMTU0Igo=''))

        p=root/''native-fixture/Cargo.lock'';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        p=root/''native-fixture/src/lib.rs'';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        p=root/''native-fixture/src/bin/exec-helper.rs'';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        p=root/''native-fixture/src/bin/native-probe.rs'';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''''))

        '
    - name: Run public launch with actual exec and strict counterexamples
      shell: python
      run: 'import os,subprocess,sys

        from pathlib import Path

        subprocess.run([sys.executable,str(Path(os.environ[''RUNNER_TEMP''])/''controls409/driver.py'')],check=True)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: macos-descendant-409-${{ matrix.arm }}
        path: ${{ runner.temp }}/macos409/export
        if-no-files-found: error
        retention-days: 14
