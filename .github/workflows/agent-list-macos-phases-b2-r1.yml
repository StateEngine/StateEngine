name: Native macOS agent list phase attribution
on:
  push:
    branches: [prime/agent-list-macos-phases-b2-r1]
permissions:
  contents: read
concurrency:
  group: agent-list-macos-phases-b2-r1-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      MEASURE_SOURCE: b173235aa69cc9a50f85f36332de655cf3ead511
      MEASURE_TARGET: ${{ matrix.target }}
      LIST_OBSERVE_ROUNDS: '200'
      OUTPUT_BUILD_ONLY: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b173235aa69cc9a50f85f36332de655cf3ead511
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Initialize short paths and verify product source
        id: compiler
        shell: python
        run: |
          import os, pathlib, subprocess, tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          source = os.environ['MEASURE_SOURCE']
          actual = subprocess.check_output(['git', 'rev-parse', source + '^{commit}'], text=True).strip()
          if actual != source:
              raise ValueError('Product source pin differs')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'MEASURE_ROOT={root / "b2l"}\n')
              output.write(f'EVIDENCE_ROOT={root / "b2l-evidence"}\n')
          text = subprocess.check_output(['git', 'show', source + ':rust-toolchain.toml'], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={tomllib.loads(text)["toolchain"]["channel"]}\n')
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.compiler.outputs.channel }}
          components: rust-docs, llvm-tools-preview
      - name: Verify diagnostic observer syntax
        shell: python
        run: |
          import ast, pathlib
          for path in pathlib.Path('scripts/agent_list_observe').glob('*.py'):
              ast.parse(path.read_text())
      - name: Build stripped diagnostic package and observe one listing cohort
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/agent_list_observe/build.py', os.environ['MEASURE_ROOT']], check=True)
          subprocess.run([sys.executable, '-B', 'scripts/agent_list_observe/phase_observe.py', os.environ['MEASURE_ROOT']], check=True)
      - name: Collect raw listings and archives without private homes
        if: ${{ always() }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-B', 'scripts/agent_list_observe/collect.py', os.environ['MEASURE_ROOT'], os.environ['EVIDENCE_ROOT']], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: agent-list-macos-phases-b2-r1-${{ matrix.target }}
          path: ${{ runner.temp }}/b2l-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
