name: Git2 status native development checks
'on':
  push:
    branches:
    - prime/status-git2-389-checks-r1
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2025
        - ubuntu-24.04
        - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SOURCE_SHA: a63fa63e665cc9451c5c02a5167c26e952fda1bc
      SOURCE_ARM: head
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: a63fa63e665cc9451c5c02a5167c26e952fda1bc
        persist-credentials: false
    - uses: ./.github/actions/rust
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: git2-status-389-v1-${{ matrix.os }}
        cache-workspace-crates: false
    - name: Record native checks, existing tests and CLI linking
      shell: python
      run: 'import ast,base64,hashlib,os,subprocess,sys

        from pathlib import Path

        data=base64.b64decode('''')

        assert hashlib.sha256(data).hexdigest()==''b5925c656801476c223818acab6c07f9ff89d9e154096ee08a317f8a8d3b68b6''

        ast.parse(data)

        p=Path(os.environ[''RUNNER_TEMP''])/''git2-check-recorder.py''

        p.write_bytes(data)

        raise SystemExit(subprocess.call([sys.executable,''-B'',str(p)]))

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: git2-check-${{ matrix.os }}
        path: ${{ runner.temp }}/git2-check-results/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
